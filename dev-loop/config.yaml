# Dev Loop Configuration — Ralph Loop
# Controls autonomous task execution, validation gates, and escalation

loop:
  max_iterations: 3          # Max fix-validate cycles per task before escalation
  timeout_minutes: 120       # Max time per task before timeout
  auto_commit: false  # SAFETY: Require human review before committing
  auto_advance: true         # Auto-pick next task after completion

validation_gates:
  bicep:
    script: "gates/validate-bicep.ps1"
    triggers: ["*.bicep", "*.bicepparam"]
    required: true
    timeout_seconds: 300

  # These triggers are the same set validate-all.ps1's Gate 2 matches, and the
  # authority for both is SCOPE_DIRS in scripts/ci/python_lint_scope.py:
  #     python scripts/ci/python_lint_scope.py --print-trigger-globs
  # emits exactly this list. The gate asserts the orchestrator's copy against
  # that authority on every run (-TriggerGlobs) and fails on any difference.
  #
  # They are written in validate-all.ps1's dialect - PowerShell `-like`, where a
  # single `*` matches across `/`, so `scripts/*.py` covers
  # scripts/data/download-noaa.py. They previously read `scripts/**/*.py`, which
  # is a DIFFERENT dialect: under `-like` that pattern requires a literal `/`
  # after `scripts/` and would not match `scripts/foo.py` at all. This file is
  # decorative (nothing reads it; validate-all.ps1 carries its own copy and only
  # the gate NAMES are drift-checked), but two lists asserted to mirror each
  # other must at least be written in the same language.
  #
  # It was ["*.py"] - all 762 tracked .py - against a much smaller check
  # population, so a change under portal, tests, apps, azure-functions, cli, sdk
  # or examples selected the gate, was never examined by it, and the suite
  # reported a measured PASS. Same defect shape as the typescript entry below.
  # `governance/*` and `dev-loop/*` have zero population today and are listed so
  # that populating either opens neither half of the hole. `.ipynb` is here
  # because ruff lints notebooks and six tracked ones are in the population.
  # Python outside these directories is NOT covered by `make validate`; it stays
  # with test.yml, validate.yml and sdk-contract.yml. See #3811.
  python:
    script: "gates/validate-python.ps1"
    triggers:
      - "csa_platform/*.ipynb"
      - "csa_platform/*.py"
      - "dev-loop/*.ipynb"
      - "dev-loop/*.py"
      - "domains/*.ipynb"
      - "domains/*.py"
      - "governance/*.ipynb"
      - "governance/*.py"
      - "scripts/*.ipynb"
      - "scripts/*.py"
      - "tools/*.ipynb"
      - "tools/*.py"
    required: true
    timeout_seconds: 120

  dbt:
    script: "gates/validate-dbt.ps1"
    triggers: ["*.sql", "*.yml"]
    paths: ["domains/*/dbt/**"]
    required: false           # Only required if dbt models changed

  deployment:
    script: "gates/validate-deployment.ps1"
    triggers: ["deploy/bicep/**"]
    required: false           # Only for infra changes
    timeout_seconds: 600

  # Typecheck-only leg for the console. The triggers below MIRROR
  # tsconfig.build.json's include/exclude, because that is the population the
  # gate actually compiles: it excludes every test, spec, __tests__, e2e and
  # uat file. A trigger wider than the check population makes the gate report a
  # measured PASS over a file it never examined - #3506's shape, measured here
  # at 78 of the last 141 console changes. Console TESTS are NOT covered by
  # `make validate`; next build, eslint and vitest stay with fiab-console-ci.
  # See #3811.
  typescript:
    script: "gates/validate-typescript.ps1"
    triggers: ["apps/fiab-console/**/*.ts", "apps/fiab-console/**/*.tsx"]
    excludes:
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.spec.ts"
      - "**/*.spec.tsx"
      - "**/__tests__/**"
      - "apps/fiab-console/e2e/**"
      - "**/*.uat.ts"
      - "**/*.uat.tsx"
      - "apps/fiab-console/vitest.config.ts"
      - "apps/fiab-console/vitest.setup.ts"
      - "apps/fiab-console/playwright.config.ts"
      # NOT gitignored (.gitignore:25 covers only portal/react-webapp/out/), so
      # unlike node_modules/.next/dist/temp this one is reachable by change
      # detection. Zero population today; a `next export` would give it one.
      - "apps/fiab-console/out/**"
    required: true
    timeout_seconds: 600

  all:
    script: "gates/validate-all.ps1"
    always_run: true
    required: true

escalation:
  on_max_iterations: "review"  # Mark task for human review
  on_timeout: "review"
  on_error: "pause"            # Pause loop, notify human
  review_assignee: "User"      # Archon assignee for review tasks

archon:
  project_id: "1bd59749-db0a-4009-82c7-f1a56d24a820"
  task_filter:
    status: "todo"
    assignee: "Coding Agent"

notifications:
  on_completion: true
  on_escalation: true
  on_error: true

