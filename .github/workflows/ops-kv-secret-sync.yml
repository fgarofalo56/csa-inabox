name: ops-kv-secret-sync

# Sync a Container App (or Container Apps JOB) secret value into its Key Vault
# mirror — IN-VNET — optionally stamping an expiry on the mirror.
#
# WHY THIS EXISTS (S1/S2, loom-next-level): the hub Key Vault is
# private-endpoint-locked (publicNetworkAccess=Disabled, policy-enforced), so a
# workstation rotation that updates the app registration + the Container App
# secret CANNOT update the KV mirror — exactly how the KV copy went stale
# before the 2026-07-19 sign-in outage, and again at the 2026-07-23 rotation.
# A stale KV mirror is a time bomb: the next full bicep deploy re-resolves the
# Container App secret FROM the vault and would roll the app back onto the
# dead credential.
#
# This job runs on the in-VNet self-hosted runner (gh-aca-runner), where the
# vault's private endpoint resolves, reads the LIVE value from the Container
# App / Job secret store, and writes it to the vault. Values are masked and
# never echoed.
#
# Run after any manual/workstation secret rotation:
#   gh workflow run ops-kv-secret-sync.yml \
#     -f aca_secret=loom-msal-client-secret -f kv_secret=loom-msal-client-secret
#
# RUNNER PAT (#5483). The in-VNet runner's GitHub PAT lives as the secret
# `github-pat` on the Container Apps JOB gh-aca-runner. Mirror it into the vault
# as `gh-actions-pat` (the name provision-gh-runner.sh reads) and stamp the PAT's
# expiry date, so the secret-expiry monitor (which tracks gh-actions-pat) alerts
# at 60/30/7 days instead of the runner fleet silently dying on expiry:
#   gh workflow run ops-kv-secret-sync.yml -f source_kind=job \
#     -f containerapp=gh-aca-runner -f aca_secret=github-pat \
#     -f kv_secret=gh-actions-pat -f expires_on=YYYY-MM-DD
# expires_on is stamped at 00:00:00Z of that date (the start of the day, so the
# alert can only be early, never late). It must be a real YYYY-MM-DD date after
# today's UTC date, or the run fails before anything is written. Decision logic
# lives in scripts/ci/kv-secret-sync-plan.mjs (tested in
# scripts/ci/__tests__/kv-secret-sync-plan.test.mjs).
#
# Without expires_on the CURRENT KV version's expiry is carried forward onto the
# new version, so a plain re-sync cannot silently erase an earlier stamp. Only
# when the vault holds no expiry at all is the new version written without one
# (a ::warning:: says so, and the monitor reports it as no-expiry).

on:
  workflow_dispatch:
    inputs:
      source_kind:
        description: 'Source type: containerapp (a Container App) or job (a Container Apps Job, e.g. gh-aca-runner)'
        type: choice
        options:
          - containerapp
          - job
        default: 'containerapp'
      containerapp:
        description: 'Container App (or Container Apps Job, when source_kind=job) holding the source secret'
        type: string
        default: 'loom-console'
      aca_secret:
        description: 'Source secret name on the app/job (source of truth after a rotation)'
        type: string
        default: 'loom-msal-client-secret'
      kv_secret:
        description: 'Key Vault secret name to sync (the mirror)'
        type: string
        default: 'loom-msal-client-secret'
      kv_name:
        description: 'Key Vault name (blank = auto-discover the kv-loom-* vault in the source RG)'
        type: string
        default: ''
      expires_on:
        description: 'Optional credential expiry date YYYY-MM-DD (UTC, must be after today). Stamped on the KV secret so the expiry monitor alerts.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  sync:
    name: 'Sync ACA secret → Key Vault mirror (in-VNet)'
    runs-on: [self-hosted, loom-aca]
    timeout-minutes: 15
    steps:
      - name: Checkout (decision script only)
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs (before any Azure call)
        id: plan
        shell: bash
        env:
          SOURCE_KIND: ${{ inputs.source_kind }}
          EXPIRES_ON: ${{ inputs.expires_on }}
        run: |
          set -euo pipefail
          # Each call exits non-zero with a message naming exactly what was checked.
          GROUP_WORDS=$(node scripts/ci/kv-secret-sync-plan.mjs source-group "$SOURCE_KIND")
          EXP_ISO=$(node scripts/ci/kv-secret-sync-plan.mjs expiry "$EXPIRES_ON")
          echo "group=$GROUP_WORDS" >> "$GITHUB_OUTPUT"
          echo "exp_iso=$EXP_ISO" >> "$GITHUB_OUTPUT"
          if [ -n "$EXP_ISO" ]; then
            echo "Expiry to stamp: $EXP_ISO"
          else
            echo "expires_on is blank — the current KV version's expiry (if any) will be carried forward."
          fi

      - name: Azure login
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Sync secret
        shell: bash
        env:
          APP: ${{ inputs.containerapp }}
          ACA_SECRET: ${{ inputs.aca_secret }}
          KV_SECRET: ${{ inputs.kv_secret }}
          KV_INPUT: ${{ inputs.kv_name }}
          GROUP_WORDS: ${{ steps.plan.outputs.group }}
          EXP_ISO: ${{ steps.plan.outputs.exp_iso }}
        run: |
          set -euo pipefail
          # "containerapp" or "containerapp job" — chosen by kv-secret-sync-plan.mjs.
          read -r -a GROUP <<< "$GROUP_WORDS"
          RG=$(az "${GROUP[@]}" list --query "[?name=='$APP'].resourceGroup | [0]" -o tsv)
          if [ -z "$RG" ]; then echo "::error::az ${GROUP[*]} list returned no resource named $APP in this subscription"; exit 1; fi
          KV="$KV_INPUT"
          if [ -z "$KV" ]; then
            KV=$(az keyvault list -g "$RG" --query "[?starts_with(name, 'kv-loom')].name | [0]" -o tsv)
          fi
          if [ -z "$KV" ]; then echo "::error::No kv-loom-* vault found in $RG (pass kv_name to name one)"; exit 1; fi
          echo "Syncing ${GROUP[*]} $APP secret '$ACA_SECRET' -> $KV/'$KV_SECRET'"
          VAL=$(az "${GROUP[@]}" secret list -n "$APP" -g "$RG" --show-values \
            --query "[?name=='$ACA_SECRET'].value | [0]" -o tsv)
          if [ -z "$VAL" ]; then echo "::error::${GROUP[*]} secret '$ACA_SECRET' on $APP is absent or empty"; exit 1; fi
          echo "::add-mask::$VAL"
          # A blank expires_on must not erase an earlier stamp: read the CURRENT
          # version's expiry (metadata only — `secret list` returns no values;
          # an absent secret yields an empty string) and carry it forward.
          CUR_EXP=""
          if [ -z "$EXP_ISO" ]; then
            CUR_EXP=$(az keyvault secret list --vault-name "$KV" \
              --query "[?name=='$KV_SECRET'].attributes.expires | [0]" -o tsv)
          fi
          EXP_PLAN=$(node scripts/ci/kv-secret-sync-plan.mjs effective-exp "$EXP_ISO" "$CUR_EXP")
          read -r EXP_SOURCE EXP_ISO <<< "$EXP_PLAN"
          EXP_ISO="${EXP_ISO:-}"
          case "$EXP_SOURCE" in
            input)   echo "Stamping requested expiry $EXP_ISO" ;;
            carried) echo "expires_on blank — carrying the current version's expiry $EXP_ISO forward" ;;
            *)       echo "::warning::expires_on is blank and $KV/$KV_SECRET has no current expiry — the new version will carry NO expiry and the secret-expiry monitor will report it as no-expiry." ;;
          esac
          EXP_ARGS=()
          if [ -n "$EXP_ISO" ]; then EXP_ARGS=(--expires "$EXP_ISO"); fi
          az keyvault secret set --vault-name "$KV" --name "$KV_SECRET" --value "$VAL" "${EXP_ARGS[@]}" -o none
          unset VAL
          # Verify the mirror matches (compare hashes only — values never printed).
          ACA_HASH=$(az "${GROUP[@]}" secret list -n "$APP" -g "$RG" --show-values \
            --query "[?name=='$ACA_SECRET'].value | [0]" -o tsv | sha256sum | cut -c1-16)
          KV_HASH=$(az keyvault secret show --vault-name "$KV" --name "$KV_SECRET" \
            --query value -o tsv | sha256sum | cut -c1-16)
          if [ "$ACA_HASH" = "$KV_HASH" ]; then
            echo "SYNCED — mirror verified (hash $ACA_HASH)"
          else
            echo "::error::hash mismatch after write ($ACA_HASH vs $KV_HASH)"; exit 1
          fi
          # Verify the expiry ATTRIBUTE (never the value) equals what was requested.
          if [ -n "$EXP_ISO" ]; then
            GOT_EXP=$(az keyvault secret show --vault-name "$KV" --name "$KV_SECRET" \
              --query attributes.expires -o tsv)
            if node scripts/ci/kv-secret-sync-plan.mjs check-exp "$EXP_ISO" "$GOT_EXP"; then
              echo "EXPIRY STAMPED — $KV/$KV_SECRET attributes.expires=$GOT_EXP"
            else
              echo "::error::read-back attributes.expires of $KV/$KV_SECRET is '$GOT_EXP', requested $EXP_ISO"; exit 1
            fi
          fi
