name: csa-loom-memory-consolidate

# ---------------------------------------------------------------------------
# CTS-13 — nightly Copilot memory consolidation ("sleep cycle").
#
# Merges near-duplicate memories, flags contradictions into the review queue, and
# promotes recurring tags into topic pages across every memory scope. Runs as an
# EXTERNAL timer that pings the internal-token-gated consolidation endpoint — the
# SAME proven pattern as csa-loom-spark-keepwarm (the console reaches Cosmos +
# AI Search in-VNet; this only triggers the pass).
#
# Auth: LOOM_INTERNAL_TOKEN (GitHub secret) as a Bearer token. The console is
# reachable via Front Door.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '17 7 * * *'   # 07:17 UTC nightly (off-peak; avoids top-of-hour contention)
  workflow_dispatch:
    inputs:
      console_url:
        description: 'Console base URL (default the Commercial vanity)'
        type: string
        default: 'https://csa-loom.limitlessdata.ai'
        required: false

concurrency:
  group: memory-consolidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  consolidate:
    name: 'Nightly memory consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger consolidation
        env:
          CONSOLE_URL: ${{ inputs.console_url || 'https://csa-loom.limitlessdata.ai' }}
          INTERNAL_TOKEN: ${{ secrets.LOOM_INTERNAL_TOKEN }}
        run: |
          if [ -z "$INTERNAL_TOKEN" ]; then
            echo "::warning::LOOM_INTERNAL_TOKEN secret not set — cannot run memory consolidation. Add it to repo secrets."
            exit 0
          fi
          # A failed curl ASSIGNS 000; it must NOT be `|| echo 000`, which
          # appends to stdout (#3414): curl already PRINTS `000` from `-w` on a
          # connect failure, so `|| echo 000` concatenated to "000000" and the
          # `000` arm below could never match. Assigning also covers a transfer
          # that timed out after the status line arrived: curl printed that
          # status, but the request did not complete, so it is 000, not success.
          code=$(curl -sS -o /tmp/mc.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $INTERNAL_TOKEN" \
            -H 'Content-Type: application/json' \
            --max-time 540 \
            "${CONSOLE_URL}/api/internal/copilot/memory/consolidate") || code=000
          [ -n "$code" ] || code=000
          echo "consolidate HTTP $code"
          body=''
          if [ -f /tmp/mc.json ]; then body=$(head -c 800 /tmp/mc.json); fi
          echo "$body"
          # The console's internal routes answer JSON. A 403 whose body is an
          # HTML page was produced before the request reached the console, so
          # retrying from here cannot succeed: fail the run (#4869).
          lead="${body#"${body%%[![:space:]]*}"}"
          case "$code" in
            200) echo "consolidation pass complete";;
            401) echo "::error::consolidate 401 — LOOM_INTERNAL_TOKEN mismatch between the secret and the console env"; exit 1;;
            403)
              case "${lead,,}" in
                '<!doctype html'*|'<html'*)
                  echo "::error::consolidate 403 — the request was refused before it reached the Console (HTML 403). This job must reach the Console from inside the network; see #4869.";;
                *) echo "::error::consolidate returned $code — see body above";;
              esac
              exit 1;;
            000)
              # R7: we know the request did not complete. We do NOT know that the
              # console is down -- DNS, TLS, egress and a timeout all land here.
              echo "::warning::the request to $CONSOLE_URL did not complete (curl failed or timed out). Cause not established from here; next nightly tick retries.";;
            *)   echo "::warning::consolidate returned $code — see body above";;
          esac
