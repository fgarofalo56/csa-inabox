name: health-pdp-bundle-publish

# LHDS PDP (W1-5): builds, tests and PUBLISHES the per-stamp Rego bundle UNSIGNED to the stamp's
# control plane (PUT /api/health/pdp/stamps/<stamp>/bundle). The control plane ES256-signs it with its
# non-exportable Key Vault key before storing it in the health-pdp-bundles Cosmos container (#5422), so no
# private key exists on this runner or in GitHub. (This workflow used to sign here with a Key Vault secret that
# the private stamp vault never let a runner read.) The stamp's OPA pulls the signed bundle from
# GET .../bundle.tar.gz and verifies the signature itself. Until a bundle is published a stamp's PDP has no
# data and denies every request.
#
# Dispatch-only. mode=build-only (default) runs the full test gate and publishes NOTHING.
# mode=publish additionally needs the `health-pdp-publish` environment (configure required
# reviewers on it; not verified to exist) and a running `loom-aca` runner (the fleet scales to zero; a
# publish with no runner queues rather than failing).
#
# SECRETS. None are read here. The control plane token is masked, and this workflow never prints a
# token or bundle body. The signature is the control plane's: the stamp's OPA verifies it with the public key
# deploy-health fetched from the control plane (GET .../verification-key) and deployed. A failure at any
# step fails the run; nothing here uses continue-on-error or `|| true`.
#
# WHERE IT RUNS (#5422). The control plane's own URL is internal: the hub Container Apps environment has
# public access Disabled, and the LHDS Front Door routes only /auth/* and /api/health/pdp/* to it (decision 7),
# deliberately not /api/health/routing-map or the bundle PUT. So the publish job runs on the in-VNet
# `[self-hosted, loom-aca]` fleet, as the deploy SP, and reaches the control plane at its internal FQDN, which
# it resolves from the deployed estate with scripts/csa-loom/resolve-health-console-binding.sh exactly as
# lhds-tenant-destroy.yml does (control_plane_url / control_plane_audience override it when supplied).
# MEASURED on that image (platform/runners/github-actions/Dockerfile): Node 20 (:154), curl and jq (:75),
# az (:92); and loom-aca-runner-capability-probe.yml reached github.com and objects.githubusercontent.com (:170),
# the hosts the pinned OPA download uses. So build, test and PUT all run in the one job.
# The issuer JWKS is read from the PUBLIC Front Door host ISSUER_URL: it is public by design, and that is the
# very path the stamp's relying parties use, so reading it there also proves the edge serves it.
#
# BOUNDARIES. Commercial only for mode=publish. The `loom-aca` fleet exists only in the Commercial DMLZ
# subscription; there is no Gov in-VNet runner, so a GCC-High publish cannot reach the internal control plane
# and is refused with a message saying so (cloud-parity.md: a disclosed gap, not a silent one). mode=build-only
# still runs the test gate for either boundary. This workflow has never produced a published bundle, and the
# Entra role `HealthCP.Admin` (publish needs 'write') must be held by the deploy principal. GCC is not
# claimed. IL5/DoD are not offered.

run-name: health-pdp-bundle-publish ${{ inputs.boundary }} ${{ inputs.stamp_id }}${{ inputs.mode != 'publish' && ' - BUILD ONLY (publishes nothing)' || '' }}

on:
  workflow_dispatch:
    inputs:
      boundary:
        description: 'Cloud boundary. Commercial or GCC-High.'
        type: choice
        default: Commercial
        options: [Commercial, GCC-High]
      mode:
        description: 'build-only runs the test gate and the build, publishes NOTHING. publish also PUTs the unsigned bundle to the control plane, which signs it.'
        type: choice
        default: build-only
        options: [build-only, publish]
      stamp_id:
        description: 'Stamp id (slug) to publish for, as registered in the control plane.'
        type: string
        required: true
      control_plane_url:
        description: 'https base URL of loom-health-cp (publish mode).'
        type: string
        default: ''
      control_plane_audience:
        description: 'Token audience of loom-health-cp (its app id URI or client id) (publish mode).'
        type: string
        default: ''
      issuer_url:
        description: 'Authorization server issuer URL; its /jwks.json goes into the bundle (publish mode).'
        type: string
        default: ''
      allow_empty_stamp:
        description: 'Publish even if the stamp homes zero active tenants (that bundle denies every request). Default false: refuse.'
        type: boolean
        default: false
  # Callable (lhds-fhir-crud-probe.yml publishes inside its own run so tenant ownership stays in one run). The
  # inputs are the dispatch inputs, with `choice` becoming `string`: a called workflow gets no choice validation, and
  # the `if:` conditions below compare exact strings, so any value other than Commercial/publish publishes nothing.
  # The `health-pdp-publish` environment approval and this concurrency group apply to the called job exactly as on dispatch.
  workflow_call:
    inputs:
      boundary:
        description: 'Cloud boundary. Commercial or GCC-High.'
        type: string
        default: Commercial
      mode:
        description: 'build-only runs the test gate and the build, publishes NOTHING. publish also PUTs the unsigned bundle to the control plane, which signs it.'
        type: string
        default: build-only
      stamp_id:
        description: 'Stamp id (slug) to publish for, as registered in the control plane.'
        type: string
        required: true
      control_plane_url:
        description: 'https base URL of loom-health-cp (publish mode).'
        type: string
        default: ''
      control_plane_audience:
        description: 'Token audience of loom-health-cp (its app id URI or client id) (publish mode).'
        type: string
        default: ''
      issuer_url:
        description: 'Authorization server issuer URL; its /jwks.json goes into the bundle (publish mode).'
        type: string
        default: ''
      allow_empty_stamp:
        description: 'Publish even if the stamp homes zero active tenants (that bundle denies every request). Default false: refuse.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: health-pdp-bundle-${{ inputs.stamp_id }}
  cancel-in-progress: false

jobs:
  # The same gate as a PR: opa test, strict check, publish-path tests, and the end-to-end
  # run of a signed bundle in a real OPA. Publishing never starts without it.
  gate:
    uses: ./.github/workflows/health-pdp-opa.yml

  # GCC-High cannot publish: no in-VNet runner exists there, and the control plane is internal. Fail with
  # the TRUE reason instead of queueing forever on a runner label that has no fleet (or calling a URL that
  # cannot be reached). Runs only for that selection.
  gov-unsupported:
    name: GCC-High publish is not supported (no in-VNet runner)
    if: ${{ inputs.mode == 'publish' && inputs.boundary == 'GCC-High' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse
        run: |
          echo "::error::mode=publish is not supported for GCC-High: the control plane is reachable only in-VNet, and the [self-hosted, loom-aca] runner fleet exists only in the Commercial subscription. Nothing was published. Run mode=build-only, or publish from Commercial. Tracked on #5422."
          exit 1

  publish:
    name: Build, sign and publish (${{ inputs.boundary }}, ${{ inputs.stamp_id }})
    needs: gate
    if: ${{ inputs.mode == 'publish' && inputs.boundary == 'Commercial' }}
    runs-on: [self-hosted, loom-aca]
    timeout-minutes: 30
    environment: health-pdp-publish
    env:
      CP_URL_IN: ${{ inputs.control_plane_url }}
      CP_AUDIENCE_IN: ${{ inputs.control_plane_audience }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ISSUER_URL: ${{ inputs.issuer_url }}
      STAMP: ${{ inputs.stamp_id }}
      ALLOW_EMPTY: ${{ inputs.allow_empty_stamp }}
      OPA_VERSION: v1.9.0
      OPA_SHA256: 66fa66f3b730b2fb086003863428b382b2898d343adb4b5dfab5598b4d739eed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Check publish inputs
        run: |
          set -euo pipefail
          for v in ISSUER_URL STAMP; do
            if [ -z "${!v}" ]; then echo "::error::publish mode needs input for $v (it is empty); nothing was sent"; exit 1; fi
          done
          case "$ISSUER_URL" in https://*) ;; *) echo "::error::issuer_url must be https"; exit 1;; esac
          # Supplied control plane values are validated here; empty ones are resolved from the estate below.
          if [ -n "$CP_URL_IN" ]; then
            case "$CP_URL_IN" in https://*) ;; *) echo "::error::control_plane_url must be https; nothing was sent"; exit 1;; esac
          fi
          if [ -z "$AZURE_SUBSCRIPTION_ID" ]; then echo "::error::AZURE_SUBSCRIPTION_ID secret is empty"; exit 1; fi

      - name: Azure login (Commercial - limitlessdata_deploy SP)
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Locate the stamp resource group (subscription of record)
        if: ${{ inputs.control_plane_url == '' || inputs.control_plane_audience == '' }}
        run: |
          set -euo pipefail
          FOUND=""
          for s in $(az account list --query "[].id" -o tsv | tr -d '\r'); do
            n="$(az group list --subscription "$s" --query "[?starts_with(name, 'rg-csa-loom-health-${STAMP}-')] | length(@)" -o tsv | tr -d '\r')"
            if [ "$n" != "0" ]; then FOUND="$s"; break; fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::no resource group rg-csa-loom-health-${STAMP}-* is visible to the deploy SP in any of its subscriptions. Check stamp_id, or supply control_plane_url and control_plane_audience. Nothing was sent."
            exit 1
          fi
          echo "::add-mask::$FOUND"
          echo "STAMP_SUB=$FOUND" >> "$GITHUB_ENV"
          echo "stamp resource group found (subscription id withheld from output)"

      - name: Pre-install the containerapp CLI extension
        if: ${{ inputs.control_plane_url == '' || inputs.control_plane_audience == '' }}
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors -o none
          echo "containerapp extension version: $(az extension show --name containerapp --query version -o tsv | tr -d '\r')"

      - name: Resolve the control plane URL and audience from the deployed estate
        id: binding
        if: ${{ inputs.control_plane_url == '' || inputs.control_plane_audience == '' }}
        env:
          HEALTH_CP_APP_CLIENT_ID: ${{ vars.LOOM_HEALTH_CP_APP_CLIENT_ID || '' }}
        run: bash scripts/csa-loom/resolve-health-console-binding.sh --subscription "$STAMP_SUB"

      - name: Fix the control plane URL and audience (never the Front Door host)
        env:
          BINDING: ${{ steps.binding.outputs.health_binding }}
          BINDING_REASON: ${{ steps.binding.outputs.health_binding_reason }}
        run: |
          set -euo pipefail
          # LOOM_HEALTH_* are written to $GITHUB_ENV by resolve-health-console-binding.sh (a script the
          # shell-text guard cannot see into); they are only read when a resolve ran, and the check below
          # refuses unless it resolved.
          # unset-var-ok: LOOM_HEALTH_CP_AUDIENCE
          # unset-var-ok: LOOM_HEALTH_CP_URL
          # unset-var-ok: LOOM_HEALTH_DEFAULT_STAMP_ID
          cp_url="$CP_URL_IN"; cp_aud="$CP_AUDIENCE_IN"
          if [ -z "$cp_url" ] || [ -z "$cp_aud" ]; then
            # `preserved` means a lookup was unknown and the console's old values were reused: not good
            # enough to aim a publish with.
            if [ "$BINDING" != "resolved" ]; then
              echo "::error::the control plane binding is '${BINDING:-unset}', not 'resolved' (${BINDING_REASON:-no reason reported}). Supply control_plane_url and control_plane_audience to override. Nothing was sent."
              exit 1
            fi
            if [ "${LOOM_HEALTH_DEFAULT_STAMP_ID:-}" != "$STAMP" ]; then
              echo "::error::the control plane in this subscription serves stamp '${LOOM_HEALTH_DEFAULT_STAMP_ID:-}', not '$STAMP'. Nothing was sent."
              exit 1
            fi
            [ -n "$cp_url" ] || cp_url="${LOOM_HEALTH_CP_URL:-}"
            [ -n "$cp_aud" ] || cp_aud="${LOOM_HEALTH_CP_AUDIENCE:-}"
          fi
          case "$cp_url" in https://*) ;; *) echo "::error::control plane URL is empty or not https. Nothing was sent."; exit 1;; esac
          [ -n "$cp_aud" ] || { echo "::error::control plane audience is empty. Nothing was sent."; exit 1; }
          # Front Door serves only /auth/* and /api/health/pdp/*; the routing-map read and the bundle PUT
          # would 404 there (#5422). Refuse it by name rather than let curl report a bare 404.
          cp_host="${cp_url#https://}"; cp_host="${cp_host%%/*}"
          iss_host="${ISSUER_URL#https://}"; iss_host="${iss_host%%/*}"
          if [ "$cp_host" = "$iss_host" ] || [[ "$cp_host" == *.azurefd.net ]]; then
            echo "::error::control plane URL host $cp_host is the LHDS Front Door edge, which routes only /auth/* and /api/health/pdp/*. Use the control plane's internal URL (leave control_plane_url empty to resolve it). Nothing was sent."
            exit 1
          fi
          {
            echo "CP_URL=$cp_url"
            echo "CP_AUDIENCE=$cp_aud"
          } >> "$GITHUB_ENV"
          echo "control plane resolved for stamp $STAMP (audience is an app id URI, not a secret)"

      - name: Install pinned OPA and build the control plane CLI
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/opa" "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  $RUNNER_TEMP/opa" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opa"
          cd apps/loom-health-cp
          npm ci --no-audit --no-fund
          npm run build

      - name: Get the control plane token (not printed)
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/pdp-publish"; mkdir -p "$work"
          echo "WORK=$work" >> "$GITHUB_ENV"
          tok="$(az account get-access-token --resource "$CP_AUDIENCE" --query accessToken -o tsv)"
          [ -n "$tok" ] || { echo "::error::no access token for audience $CP_AUDIENCE"; exit 1; }
          echo "::add-mask::$tok"
          printf 'authorization: Bearer %s\n' "$tok" > "$work/auth.hdr"
          echo "LHDS_CP_TOKEN=$tok" >> "$GITHUB_ENV"

      - name: Refresh the routing map from the tenant registry
        run: |
          set -uo pipefail
          # The bundle must reflect the CURRENT registry, and a fresh stamp has no map at all: GET
          # /api/health/routing-map answers 404 until something publishes one (measured on dev01,
          # run 45038029387). publish is idempotent (unchanged registry = published:false) and the
          # control plane refuses, with a 409, to replace a non-empty map with an empty one.
          # No -f here: this call exists to OBSERVE the status, so the code is read and branched on.
          RC=0
          CODE=$(curl -sS -X POST -H @"$WORK/auth.hdr" -o "$WORK/routing-publish.json" -w '%{http_code}' "${CP_URL%/}/api/health/routing-map/publish" 2> "$WORK/routing-publish.err") || RC=$?
          if [ "$RC" != "0" ]; then
            echo "::error::POST /api/health/routing-map/publish did not complete (curl exit $RC, no HTTP status: DNS, TLS or timeout; curl: $(head -c 200 "$WORK/routing-publish.err")). Nothing was published."
            exit 1
          fi
          if [ "${CODE:0:1}" != "2" ]; then
            case "$CODE" in
              409) WHY="the control plane refused to replace a non-empty routing map with an empty one (the registry lists no routable tenant). Not overriding that guard; check the tenant registry." ;;
              401|403) WHY="the deploy principal was not authorised to publish the routing map (HealthCP.Admin and the caller allowlist are granted by csa-loom-post-deploy-bootstrap)." ;;
              *) WHY="cause not established (curl: $(head -c 200 "$WORK/routing-publish.err"))." ;;
            esac
            echo "::error::POST /api/health/routing-map/publish answered HTTP $CODE: $WHY Nothing was published."
            exit 1
          fi
          if ! node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!r.ok||!r.data||typeof r.data.version!=="string"){process.exit(1)} console.log("routing map "+(r.data.published?"published":"unchanged")+": version "+r.data.version+", "+r.data.entryCount+" entries, "+(r.data.skipped||[]).length+" skipped")' "$WORK/routing-publish.json"; then
            echo "::error::POST /api/health/routing-map/publish answered HTTP $CODE but the body is not a publish result (no data.version). Nothing was published."
            exit 1
          fi

      - name: Derive stamp inputs from the live routing map and AS JWKS
        run: |
          set -euo pipefail
          # -f makes an HTTP error fail the step; the response body is never printed.
          curl -fsS -H @"$WORK/auth.hdr" -o "$WORK/routing-resp.json" "${CP_URL%/}/api/health/routing-map"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!r.ok||!r.data||!Array.isArray(r.data.entries)){console.error("routing-map response has no data.entries");process.exit(1)} require("fs").writeFileSync(process.argv[2],JSON.stringify(r.data))' "$WORK/routing-resp.json" "$WORK/routing.json"
          curl -fsS -o "$WORK/jwks.json" "${ISSUER_URL%/}/jwks.json"
          node apps/loom-health-cp/dist/pdp/pdp-stamp-inputs-cli.js "$WORK/routing.json" "$STAMP" "$ISSUER_URL" "$WORK/jwks.json" "$WORK/inputs.json"
          n="$(node -e 'console.log(Object.keys(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).stamp.tenants).length)' "$WORK/inputs.json")"
          if [ "$n" = "0" ] && [ "$ALLOW_EMPTY" != "true" ]; then
            echo "::error::stamp $STAMP homes 0 active tenants in the routing map, so this bundle would deny every request. Check the stamp id, or set allow_empty_stamp to publish it anyway. Nothing was published."
            exit 1
          fi

      - name: Build (unsigned) and publish; the control plane signs it
        run: |
          set -euo pipefail
          rev="${GITHUB_SHA::12}-${GITHUB_RUN_ID}"
          OPA="$RUNNER_TEMP/opa" STAMP_INPUTS="$WORK/inputs.json" \
            bash apps/loom-health-pdp/tools/build-bundle.sh --unsigned "$rev" "$WORK/out"
          node apps/loom-health-pdp/tools/publish-bundle.mjs "$WORK/out/lhds-pdp.tar.gz" "$STAMP" "$CP_URL" "$rev" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove working files
        if: ${{ always() }}
        run: |
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then rm -rf "$WORK"; fi
