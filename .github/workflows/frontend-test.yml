# Frontend Jest test suite for the React portal.
#
# Triggered on PRs and pushes that touch `portal/react-webapp/**` so the
# full test pipeline runs in a few seconds for every change. Coverage
# artefacts are uploaded to support PR comments and long-term tracking.
name: Frontend Tests

on:
  pull_request:
    paths:
      - 'portal/react-webapp/**'
      - '.github/workflows/frontend-test.yml'
  push:
    branches: [main]
    paths:
      - 'portal/react-webapp/**'
      - '.github/workflows/frontend-test.yml'

permissions:
  contents: read

jobs:
  test:
    name: jest (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x']
    defaults:
      run:
        working-directory: portal/react-webapp
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: portal/react-webapp/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        # This gate could not fail, TWICE OVER (refs #2860): the pipe to `tee`
        # made the step's status `tee`'s, and the trailing `|| true` discarded
        # whatever survived that. `tsc` could report any number of errors and
        # the step was green.
        #
        # The stated reason was a narrow suppression list — "pre-existing errors
        # in StepIngestion / StepSchema / StepSourceType, tracked as CSA-0125".
        # Checked against reality on 2026-08-02 rather than trusted: after
        # `npm ci`, `npm run type-check` exits 0 with ZERO errors. All three
        # components type-clean; the debt this masked was paid off at some
        # point and nobody removed the mask. So there is nothing to ratchet and
        # no allowlist to carry — the gate just runs.
        run: npm run type-check

      - name: Jest with coverage
        run: npm test

      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: portal/react-webapp/coverage
          retention-days: 14
