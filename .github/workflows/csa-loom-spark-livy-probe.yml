name: csa-loom-spark-livy-probe

# ---------------------------------------------------------------------------
# DIAGNOSTIC: create a Synapse Spark Livy session IN-VNET (the dev API is
# private-endpoint-locked, 403 from a public runner) with a MINIMAL config,
# poll it to idle/dead, and dump the session state + driver log so we can see
# the REAL reason interactive Spark sessions fail to start ("notebooks slow /
# session recycled"). Read-only probe; it shuts the session down after.
#
# #3034: this file was INVALID YAML from the day it was written — the Python
# one-liners embedded in the `run:` block sat at column 0, which terminated
# the YAML block scalar. GitHub accepted the file, created runs for it, and
# every run had jobs=0: the probe never executed once. The probe body now
# lives in scripts/csa-loom/spark-livy-probe.sh (shared with
# csa-loom-spark-probe2.yml, which was an identical copy) and the workflow
# checks out the repo and runs the script.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      pool:
        description: 'Spark pool name'
        type: string
        default: loompool
        required: false
      with_la_emitter:
        description: 'Include the Log Analytics emitter conf (to A/B whether it kills the session)'
        type: boolean
        default: false
        required: false

permissions:
  id-token: write
  contents: read

env:
  DLZ_SUB: 363ef5d1-0e77-4594-a530-f51af23dbf8c
  SYN_WS: syn-loom-default-centralus

jobs:
  livy-probe:
    name: 'Livy session probe (in-VNET)'
    runs-on: [self-hosted, loom-aca]
    timeout-minutes: 20
    steps:
      - name: Checkout (the probe script lives in the repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Azure login (deploy SP — Synapse Spark admin)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.DLZ_SUB }}
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Create + poll a Livy session, dump driver log
        env:
          POOL: ${{ inputs.pool || 'loompool' }}
          WITH_LA: ${{ inputs.with_la_emitter }}
        run: bash scripts/csa-loom/spark-livy-probe.sh
