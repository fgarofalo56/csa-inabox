name: deploy-secret-expiry

run-name: >-
  deploy-secret-expiry
  ${{ inputs.dry_run && '[DRY RUN — nothing deployed]' || format('→ {0}', inputs.region || 'centralus') }}

# CSA Loom — dispatchable deploy path for the `loom-secret-expiry-monitor`
# Container App Job (the in-VNet, scheduled MSAL/Key-Vault credential-expiry
# monitor, S1).
#
# ── WHY THIS EXISTS (#2816, class of #2814) ────────────────────────────────
# `scripts/csa-loom/deploy-secret-expiry-job.sh` is the only thing that BUILDS
# and rolls the monitor image. Until this workflow it was referenced by ZERO
# workflows, so shipping a monitor change required a workstation with `az` write
# access on the admin RG.
#
# This one has teeth beyond the usual: the monitor is what warns BEFORE an MSAL
# client secret expires. On 2026-07-19 an expired console secret (AADSTS7000215)
# broke every real sign-in while the cookie-minted verify harness stayed green —
# a production outage whose entire purpose this job exists to pre-empt. A
# credential-expiry monitor that cannot be deployed from CI is a smoke detector
# in a drawer.
#
# bicep (modules/admin-plane/secret-expiry-monitor-job.bicep) CREATES the job on
# a full deploy, but bicep does not build images: the job's first scheduled
# execution fails honestly until an image exists.
#
# It was also invisible to the "merged ≠ deployed" watchdog (#2775) by
# construction — that check compares a watched WORKFLOW's last successful run
# against the code it deploys, and a deploy path that is not a workflow can never
# register as stale. Registered in `WATCHED` in
# scripts/ci/check-deploy-staleness.mjs.
#
# ── WHAT IT DOES ───────────────────────────────────────────────────────────
# It is a WRAPPER. It does not reimplement the script, which owns the ACR
# firewall-lease acquire/release lifecycle (#2603). Read that script's header
# before changing anything here.
#
# ── AUTH ───────────────────────────────────────────────────────────────────
# Service-principal `creds:` login, matching deploy-copilot-evaluator.yml (the
# template). NOT OIDC: this repo's federated credential is scoped to
# `repo:...:ref:refs/heads/main`, so an OIDC login would authenticate only on a
# main-ref dispatch and fail for a branch dispatch during a fix. `id-token:
# write` here exists for cosign; this workflow signs nothing, so `contents: read`
# only.

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Azure region of the target Admin Plane (e.g. centralus, eastus2).'
        type: string
        default: centralus
      subscription:
        description: 'Target subscription id (defaults to the AZURE_SUBSCRIPTION_ID secret).'
        type: string
        required: false
      cron:
        description: 'Schedule cron override — STANDARD 5-FIELD UTC. Empty keeps the job''s current schedule (script default 0 6 * * * on first create).'
        type: string
        required: false
      dry_run:
        description: 'Resolve + print every coordinate and STOP. Nothing is built, no ACR firewall change, no job write.'
        type: boolean
        default: true

permissions:
  contents: read

# Never cancel in flight: this holds the ACR firewall lease while the image
# builds (#2603).
concurrency:
  group: deploy-secret-expiry-${{ inputs.region || 'centralus' }}
  cancel-in-progress: false

env:
  AZURE_LOCATION: ${{ inputs.region || 'centralus' }}
  JOB_NAME: loom-secret-expiry-monitor

jobs:
  deploy:
    name: Build image + create/refresh the secret-expiry monitor job
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ inputs.subscription || secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      # ── Resolve the coordinates the script hard-requires ──────────────────
      # SUB / CONSOLE_UAMI_ID / CONSOLE_UAMI_CLIENT_ID / ACR are `${VAR:?}` in
      # the script — it exits non-zero on the first missing one before touching
      # anything.
      #
      # PUBLIC REPO: the subscription id and the UAMI ARM id (which embeds it)
      # are masked before anything can echo them.
      - name: Resolve deploy coordinates
        env:
          VAR_ADMIN_RG: ${{ vars.LOOM_ADMIN_RG }}
          VAR_UAMI_NAME: ${{ vars.LOOM_CONSOLE_UAMI_NAME }}
          VAR_UAMI_CLIENT: ${{ vars.LOOM_CONSOLE_UAMI_CLIENT }}
        run: |
          set -euo pipefail
          az extension add --name containerapp --only-show-errors 2>/dev/null || true

          RG="${VAR_ADMIN_RG:-}"
          [ -n "$RG" ] || RG="rg-csa-loom-admin-${AZURE_LOCATION}"

          SUB=$(az account show --query id -o tsv | tr -d '\r')
          echo "::add-mask::$SUB"

          ACR=$(az acr list -g "$RG" --query "[?starts_with(name,'acrloom')]|[0].loginServer" -o tsv 2>/dev/null | tr -d '\r' || true)
          [ -n "$ACR" ] || ACR=$(az acr list -g "$RG" --query "[0].loginServer" -o tsv 2>/dev/null | tr -d '\r' || true)
          if [ -z "$ACR" ]; then
            echo "::error::No container registry found in $RG. The Admin Plane must be provisioned before the monitor image can be built — run the infra deploy first."
            exit 1
          fi

          CAE=$(az containerapp env list -g "$RG" --query "[?starts_with(name,'cae-')]|[0].name" -o tsv 2>/dev/null | tr -d '\r' || true)
          [ -n "$CAE" ] || CAE=$(az containerapp env list -g "$RG" --query "[0].name" -o tsv 2>/dev/null | tr -d '\r' || true)
          if [ -z "$CAE" ]; then
            echo "::error::No Container Apps managed environment found in $RG. The monitor runs inside the console's VNet-integrated CAE; it cannot be created without one."
            exit 1
          fi

          UAMI_NAME="${VAR_UAMI_NAME:-}"
          [ -n "$UAMI_NAME" ] || UAMI_NAME="uami-loom-console-${AZURE_LOCATION}"
          UAMI_JSON=$(az identity show -n "$UAMI_NAME" -g "$RG" -o json 2>/dev/null || true)
          if [ -z "$UAMI_JSON" ]; then
            UAMI_JSON=$(az identity list -g "$RG" --query "[?starts_with(name,'uami-loom-console')]|[0]" -o json 2>/dev/null || true)
          fi
          UAMI_ID=$(printf '%s' "$UAMI_JSON" | jq -r '.id // empty')
          UAMI_CLIENT="${VAR_UAMI_CLIENT:-}"
          [ -n "$UAMI_CLIENT" ] || UAMI_CLIENT=$(printf '%s' "$UAMI_JSON" | jq -r '.clientId // empty')
          if [ -z "$UAMI_ID" ] || [ -z "$UAMI_CLIENT" ]; then
            echo "::error::Could not resolve the Console UAMI in $RG (looked for $UAMI_NAME, then any uami-loom-console*). The job runs AS this identity — it is the identity that holds Key Vault Secrets User and the Graph Application.Read.All grant the monitor needs. Set the LOOM_CONSOLE_UAMI_NAME / LOOM_CONSOLE_UAMI_CLIENT repo vars, or check the region."
            exit 1
          fi
          echo "::add-mask::$UAMI_ID"
          echo "::add-mask::$UAMI_CLIENT"

          {
            echo "ADMIN_RG=$RG"
            echo "SUB=$SUB"
            echo "CAE=$CAE"
            echo "ACR=$ACR"
            echo "CONSOLE_UAMI_ID=$UAMI_ID"
            echo "CONSOLE_UAMI_CLIENT_ID=$UAMI_CLIENT"
          } >> "$GITHUB_ENV"

          echo "::notice::admin RG=$RG  CAE=$CAE  ACR=$ACR  UAMI=$UAMI_NAME (ids masked)"

      # ── The one piece of real logic: do not blank a working job ───────────
      # The script builds ENV_ARGS from its own environment and passes ALL of it
      # to `az containerapp job update --set-env-vars`. Per the az CLI contract,
      # --set-env-vars adds/updates the NAMED variables and leaves unnamed ones
      # alone — so the bicep-set extras this script does not carry
      # (LOOM_GITHUB_REPO_OWNER / LOOM_GITHUB_REPO_NAME, and the secretRef-backed
      # LOOM_SECRET_EXPIRY_GITHUB_TOKEN) survive untouched. But every name the
      # script DOES list is written, and a name left unresolved here is written
      # as the EMPTY STRING.
      #
      # Blanking is not cosmetic on this job. Empty LOOM_KEY_VAULT_URI or
      # LOOM_MSAL_CLIENT_ID makes the monitor honest-gate: it keeps running,
      # keeps reporting Succeeded, and stops watching the credential whose
      # expiry took production down on 2026-07-19. Empty
      # LOOM_ALERT_ACTION_GROUP_ID means it can still detect an imminent expiry
      # and have nowhere to send it. So the authoritative source is the RUNNING
      # JOB; the console app / repo vars are the fallback for a first create; and
      # an unreadable existing job is a hard stop.
      - name: Resolve monitor config (carry forward — never blank a live job)
        env:
          INPUT_CRON: ${{ inputs.cron }}
          VAR_MSAL_CLIENT_ID: ${{ vars.LOOM_MSAL_CLIENT_ID }}
        run: |
          set -euo pipefail
          CFG_VARS="LOOM_MSAL_CLIENT_ID LOOM_KEY_VAULT_URI LOOM_SECRET_EXPIRY_KV_SECRETS LOOM_SECRET_EXPIRY_WARN_DAYS LOOM_ALERT_ACTION_GROUP_ID LOOM_GRAPH_BASE LOOM_ARM_ENDPOINT LOOM_STORAGE_SUFFIX LOOM_OPS_STATE_ACCOUNT LOOM_OPS_STATE_CONTAINER"

          pick() { printf '%s' "$1" | jq -r --arg n "$2" 'first((. // [])[] | select(.name==$n) | (.value // "")) // ""'; }

          JOB_ENV='[]'
          JOB_EXISTS=false
          if az containerapp job show -g "$ADMIN_RG" -n "$JOB_NAME" -o none 2>/dev/null; then
            JOB_EXISTS=true
            JOB_ENV=$(az containerapp job show -g "$ADMIN_RG" -n "$JOB_NAME" \
              --query "properties.template.containers[0].env" -o json 2>/dev/null || echo 'READ_FAILED')
            if [ "$JOB_ENV" = "READ_FAILED" ] || ! printf '%s' "$JOB_ENV" | jq -e 'type=="array"' >/dev/null 2>&1; then
              echo "::error::$JOB_NAME exists in $ADMIN_RG but its env set could not be read. REFUSING to run the deploy: the script would rewrite every listed config value to the empty string and the credential-expiry monitor would honest-gate — still Succeeded, no longer watching anything. Fix the read (RBAC / az) and re-dispatch."
              exit 1
            fi
            echo "Existing job found — carrying its config forward ($(printf '%s' "$JOB_ENV" | jq 'length') env var(s) on the job)."
          else
            echo "::notice::$JOB_NAME does not exist in $ADMIN_RG yet — the script will CREATE it. Config falls back to the loom-console app's env, then repo vars."
          fi

          APP_ENV=$(az containerapp show -g "$ADMIN_RG" -n loom-console \
            --query "properties.template.containers[0].env" -o json 2>/dev/null || echo '[]')
          printf '%s' "$APP_ENV" | jq -e 'type=="array"' >/dev/null 2>&1 || APP_ENV='[]'

          MISSING=""
          for V in $CFG_VARS; do
            CUR=$(pick "$JOB_ENV" "$V")
            VAL="$CUR"
            SRC=job
            if [ -z "$VAL" ]; then VAL=$(pick "$APP_ENV" "$V"); SRC=console; fi
            if [ -z "$VAL" ] && [ "$V" = "LOOM_MSAL_CLIENT_ID" ]; then VAL="${VAR_MSAL_CLIENT_ID:-}"; SRC=repo-var; fi
            if [ -z "$VAL" ]; then SRC='(unset — script default applies)'; fi

            if [ -n "$CUR" ] && [ -z "$VAL" ]; then MISSING="$MISSING $V"; fi

            # PUBLIC REPO: the action-group id is a full ARM resource id and
            # embeds the subscription id. Mask before the dry-run print.
            if [ "$V" = "LOOM_ALERT_ACTION_GROUP_ID" ] && [ -n "$VAL" ]; then echo "::add-mask::$VAL"; fi

            [ -n "$VAL" ] && echo "$V=$VAL" >> "$GITHUB_ENV"
            echo "  $V <- $SRC"
          done

          if [ -n "$MISSING" ]; then
            echo "::error::REFUSING to deploy — these values are set on the live $JOB_NAME but resolved empty here, so the script would blank them:$MISSING"
            exit 1
          fi

          # Honest gate, not a hard stop: the script accepts these empty (they
          # default to ''), and bicep is the canonical creator. But an empty one
          # means the monitor half-works while reporting success, so name it.
          KVU=$(printenv LOOM_KEY_VAULT_URI || true)
          MSAL=$(printenv LOOM_MSAL_CLIENT_ID || true)
          AG=$(printenv LOOM_ALERT_ACTION_GROUP_ID || true)
          [ -n "$KVU" ]  || echo "::warning::LOOM_KEY_VAULT_URI is unset — the Key Vault half of the monitor will honest-gate and track NO secret expiries. Deploy modules/admin-plane/secret-expiry-monitor-job.bicep (functionAppsConfig.secretExpiryEnabled) to wire it."
          [ -n "$MSAL" ] || echo "::warning::LOOM_MSAL_CLIENT_ID is unset — the Graph half will not watch the console's MSAL app-registration credential. That is the exact credential whose silent expiry broke every sign-in on 2026-07-19."
          [ -n "$AG" ]   || echo "::warning::LOOM_ALERT_ACTION_GROUP_ID is unset — an imminent expiry will be detected and have nowhere to fire. Results will only appear in the job's container logs."

          CRON="${INPUT_CRON:-}"
          if [ -z "$CRON" ] && [ "$JOB_EXISTS" = true ]; then
            CRON=$(az containerapp job show -g "$ADMIN_RG" -n "$JOB_NAME" \
              --query "properties.configuration.scheduleTriggerConfig.cronExpression" -o tsv 2>/dev/null | tr -d '\r' || true)
          fi
          [ -n "$CRON" ] && [ "$CRON" != "None" ] && echo "SECRET_EXPIRY_CRON=$CRON" >> "$GITHUB_ENV"
          echo "  SECRET_EXPIRY_CRON <- ${CRON:-script default 0 6 * * *}"

      - name: DRY RUN — resolved plan only, nothing deployed
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "DRY RUN. No image was built. The ACR firewall was not touched. The job was not written."
          echo
          echo "  admin RG    : $ADMIN_RG"
          echo "  CAE         : $CAE"
          echo "  ACR         : $ACR"
          echo "  image       : $ACR/loom-secret-expiry-monitor:latest"
          echo "  job         : $JOB_NAME"
          echo "  cron        : ${SECRET_EXPIRY_CRON:-<script default 0 6 * * *>}"
          echo "  build commit: ${GITHUB_SHA}"
          echo
          echo "Config that WOULD be written (empty = script default applies):"
          for V in LOOM_MSAL_CLIENT_ID LOOM_KEY_VAULT_URI LOOM_SECRET_EXPIRY_KV_SECRETS LOOM_SECRET_EXPIRY_WARN_DAYS LOOM_ALERT_ACTION_GROUP_ID LOOM_GRAPH_BASE LOOM_ARM_ENDPOINT LOOM_STORAGE_SUFFIX LOOM_OPS_STATE_ACCOUNT LOOM_OPS_STATE_CONTAINER; do
            printf '  %-34s %s\n' "$V" "$(printenv "$V" || echo '<unset>')"
          done
          echo
          echo "::warning::DRY RUN — the secret-expiry monitor was NOT deployed. This run does NOT count as a deploy for the staleness watchdog. Re-dispatch with dry_run=false to actually build and roll it."

      # The script owns everything from here: ACR firewall lease acquire →
      # `az acr build` → lease release → `az containerapp job create|update`.
      - name: Deploy — build image + create/refresh the job
        if: ${{ !inputs.dry_run }}
        run: bash scripts/csa-loom/deploy-secret-expiry-job.sh

      - name: Verify the job now points at the built image
        if: ${{ !inputs.dry_run }}
        run: |
          set -uo pipefail
          IMAGE=$(az containerapp job show -g "$ADMIN_RG" -n "$JOB_NAME" \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null | tr -d '\r' || true)
          CONTAINER=$(az containerapp job show -g "$ADMIN_RG" -n "$JOB_NAME" \
            --query "properties.template.containers[0].name" -o tsv 2>/dev/null | tr -d '\r' || true)
          STATE=$(az containerapp job show -g "$ADMIN_RG" -n "$JOB_NAME" \
            --query "properties.provisioningState" -o tsv 2>/dev/null | tr -d '\r' || true)
          KVU=$(az containerapp job show -g "$ADMIN_RG" -n "$JOB_NAME" \
            --query "properties.template.containers[0].env[?name=='LOOM_KEY_VAULT_URI'].value | [0]" -o tsv 2>/dev/null | tr -d '\r' || true)
          echo "image=$IMAGE container=$CONTAINER provisioningState=$STATE"
          if [ -z "$IMAGE" ]; then
            echo "::error::$JOB_NAME is not readable after the deploy — cannot confirm the image rolled."
            exit 1
          fi
          # bicep names the container 'secret-expiry' and the script header's log
          # query keys off it. The script's CREATE path passes no
          # --container-name, so az defaults it to the JOB name. Warn: a mismatch
          # misleads a human reading logs, but no automated gate reads this name.
          if [ "$CONTAINER" != "secret-expiry" ]; then
            echo "::warning::container name is '$CONTAINER', not 'secret-expiry'. The log query in the script header (ContainerAppConsoleLogs_CL | where ContainerName_s == 'secret-expiry') will return NOTHING for this job. Deploy modules/admin-plane/secret-expiry-monitor-job.bicep to get the canonical name."
          fi
          if [ -z "$KVU" ] || [ "$KVU" = "None" ]; then
            echo "::warning::LOOM_KEY_VAULT_URI is empty on the deployed job — the Key Vault half of the monitor will honest-gate and track no expiries."
          fi
          echo "::notice::$JOB_NAME rolled to $IMAGE (built from ${GITHUB_SHA}). The next scheduled execution picks it up. NOTE: the Graph half stays honest-gated until Application.Read.All is admin-consented on the Console UAMI — see scripts/csa-loom/grant-identity-graph-approles.sh and docs/fiab/runbooks/secret-rotation.md."
