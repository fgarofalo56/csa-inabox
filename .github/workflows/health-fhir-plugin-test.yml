name: health-fhir-plugin-test

# LHDS W2-3: runs the HAPI plugin tests (embedded Jetty + real RestfulServer, stand-in PDP) and the
# static image contract. The Dockerfile builds the plugin with -DskipTests, so this workflow is the
# only thing that executes the Java tests. The tests read the PDP interactions table and the role
# scope map by repo-relative path, hence the apps/loom-health-pdp and role-map path filters.

on:
  pull_request:
    paths:
      - 'apps/loom-health-fhir/**'
      - 'apps/loom-health-pdp/**'
      - 'apps/loom-health-cp/src/auth/role-scope-map.v1.json'
      - '.github/workflows/health-fhir-plugin-test.yml'
  push:
    branches: [main]
    paths:
      - 'apps/loom-health-fhir/**'
      - 'apps/loom-health-pdp/**'
      - 'apps/loom-health-cp/src/auth/role-scope-map.v1.json'
      - '.github/workflows/health-fhir-plugin-test.yml'

permissions:
  contents: read

jobs:
  plugin-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/loom-health-fhir/plugin/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Plugin tests (mvn)
        run: mvn -f apps/loom-health-fhir/plugin/pom.xml -B test
      - name: Image contract (node)
        run: node --test apps/loom-health-fhir/tests/
