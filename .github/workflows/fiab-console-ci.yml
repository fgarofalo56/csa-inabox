# CSA Loom console — build gate.
#
# WHY THIS EXISTS:
#   The repo's required PR checks are Python / dbt / lint / secret-scan — none
#   of them COMPILE the Next.js console in apps/fiab-console. So a TypeScript /
#   bundling break (e.g. an import of a file that was never committed) passed
#   every required check and only blew up later in the Docker image build inside
#   loom-roll-and-validate / deploy-fiab-*. This workflow runs the SAME build the
#   Dockerfile runs (`pnpm build` == `next build`, node 20, pnpm 9, 4 GB heap),
#   so module-resolution / bundling failures are caught at PR time instead.
#
#   next.config sets typescript.ignoreBuildErrors + eslint.ignoreDuringBuilds, so
#   this mirrors deploy exactly: it does NOT fail on pure type/lint nits, but it
#   DOES fail on anything that would break the real production build (unresolved
#   imports, bad JSX, server/client boundary violations, etc.).
#
# Path-filtered to apps/fiab-console/** so it only runs when the console changes.
name: CSA Loom Console Build

# NOTE: this job is a REQUIRED status check. It must therefore run (and report)
# on EVERY pull request, even ones that don't touch the console — otherwise a
# bicep/workflow-only PR deadlocks: the required `next build (node 20)` context
# never reports and the PR can never merge. So we DON'T path-filter at the `on:`
# level; instead the job always starts and an internal change-detection step
# skips the heavy install/build (reporting green) when apps/fiab-console is
# untouched. When the console DOES change, the full real `next build` runs.
on:
  pull_request:
  push:
    branches: [main]
  # REQUIRED-CHECK DISPATCH (#3393). release-please's PR is authored by
  # GITHUB_TOKEN, whose events GitHub suppresses — so `next build (node 20)` and
  # `vitest (node 20)` never ran on a release PR and were replaced by SYNTHETIC
  # statuses. That is precisely where the residual risk lived: release-please
  # bumps the version in apps/fiab-console/package.json via extra-files, and
  # NOTHING compiled that bumped tree before it landed on main.
  # `workflow_dispatch` is the documented exception GITHUB_TOKEN *may* trigger.
  # Under a dispatch the change-detection step below takes its non-PR branch
  # (`range=HEAD~1...HEAD`), and the release commit DOES touch
  # apps/fiab-console/package.json — so the full real `next build` + vitest run.
  workflow_dispatch:

# CONCURRENCY: keyed per-COMMIT on main, per-ref on PRs.
#
# WHY: `vitest (node 20)` from this workflow is the ROLL GATE —
# loom-roll-and-validate refuses to roll a SHA whose vitest did not conclude
# `success`. With a ref-keyed group, merging any follow-up PR CANCELS the
# still-running main CI of the PREVIOUS commit, permanently marking that SHA
# `cancelled` and making it unrollable even though nothing was wrong with it.
# That is not hypothetical: it blocked a production roll on 2026-07-28 (the
# Phase-A image was built and signed, but its vitest had been cancelled by the
# next merge, so the gate correctly refused an unverified SHA).
#
# On main each commit is an independent, rollable artifact, so its CI must run
# to completion — cancel-in-progress is FALSE there. On PR refs a new push
# genuinely supersedes the old one, so cancelling still applies (and still
# saves the CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  build:
    name: next build (node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/fiab-console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Detect console changes
        id: changed
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            # depth=1 gives the base TIP but not the MERGE BASE, so the
            # three-dot range below cannot be resolved and `git diff` errors.
            # That error used to be swallowed (2>/dev/null), the grep found
            # nothing, and the else-branch reported this REQUIRED check green
            # without building or testing anything.
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            if ! git merge-base "$base" HEAD >/dev/null 2>&1; then
              git fetch --no-tags --deepen=200 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            fi
            range="$base...HEAD"
          else
            range="HEAD~1...HEAD"
          fi
          # FAIL OPEN. If the range cannot be resolved we must BUILD, never skip:
          # skipping reports a required check green on an unexamined tree.
          if ! changed=$(git diff --name-only "$range" 2>&1); then
            echo "::warning::could not resolve '$range' ($changed) — building anyway rather than reporting this required check green on an unexamined tree."
            echo "console=true" >> "$GITHUB_OUTPUT"
          elif echo "$changed" | grep -qE '^apps/fiab-console/|^\.github/workflows/fiab-console-ci\.yml'; then
            echo "console=true" >> "$GITHUB_OUTPUT"
            echo "Console changed — running full next build."
          else
            echo "console=false" >> "$GITHUB_OUTPUT"
            echo "No apps/fiab-console changes — skipping build, reporting this required check green."
          fi

      - name: Use Node.js 20
        if: steps.changed.outputs.console == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Item-route persistence guard
        if: steps.changed.outputs.console == 'true'
        working-directory: apps/fiab-console
        # Fails if any editor's useItemState(<type>) lacks a matching
        # /api/items/<type>/[id]/route.ts (GET+PATCH) — the silent edit-loss
        # class the 2026-06-04 scaffold audit caught. Pure node, no install.
        run: node scripts/check-item-routes.mjs

      - name: No bare server-fetch guard
        if: steps.changed.outputs.console == 'true'
        working-directory: apps/fiab-console
        # Fails if any server module in lib/azure/** or lib/install/** does a bare
        # global fetch( instead of fetchWithTimeout — the "no-timeout" defect class
        # PR #1198 eliminated. Keeps "every server caller inherits the ceiling"
        # true going forward. Pure node, no install.
        run: node scripts/no-bare-server-fetch.mjs

      - name: Install pnpm
        if: steps.changed.outputs.console == 'true'
        run: npm install -g pnpm@9

      - name: Circular-dependency guard (lib/editors)
        if: steps.changed.outputs.console == 'true'
        working-directory: apps/fiab-console
        # rel-T29 / B13: run the `guard:circular` script that was defined in
        # package.json but never wired into CI. Fails if a NEW import cycle
        # appears in lib/editors beyond the documented baseline (the phase3
        # per-editor split + barrel could silently reintroduce one — it already
        # caught the paginated-report-editor ⇄ barrel cycle once). Uses madge via
        # npx; needs no project deps, so it runs before the heavy install/build
        # and fails fast.
        run: pnpm guard:circular

      - name: Install dependencies
        if: steps.changed.outputs.console == 'true'
        # Match the Dockerfile (`pnpm install --no-frozen-lockfile`) so CI builds
        # exactly what deploy builds.
        run: pnpm install --no-frozen-lockfile

      - name: Build (next build)
        if: steps.changed.outputs.console == 'true'
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # 6144 matches the Dockerfile/ACR build heap — 4096 OOMs since the
          # console grew past ~117 editors (FATAL: JS heap out of memory).
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build

      - name: Lint (next lint)
        if: steps.changed.outputs.console == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        # next.config sets eslint.ignoreDuringBuilds so `pnpm build` above does
        # NOT lint. This runs the ESLint gate explicitly (rel-T26 / B13): the
        # console's .eslintrc.json extends next/core-web-vitals with a few noisy
        # rules downgraded to warnings, so this FAILS only on genuine lint
        # errors (missing keys, comment-in-JSX, parse errors), not on the ~600
        # existing style warnings.
        run: pnpm lint

  vitest:
    name: vitest (node 20)
    runs-on: ubuntu-latest
    # 45m (was 25m, then 40m, then 55m). Two things trade time for correctness
    # here: the coverage provider is istanbul (Babel instrumentation costs wall
    # clock that v8's runtime-derived coverage did not) and maxForks is capped
    # at 2 under CI to keep the main thread responsive to the 60s reporting-RPC
    # deadline. MEASURED per-blob on this runner:
    #     v8,       3 forks   534.52s + 562.76s = ~1097s   (25m43s, RED)
    #     istanbul, 3 forks   728.94s + 751.68s = ~1481s   (25m43s, RED)
    #     istanbul, 2 forks   783.84s + 816.73s = ~1601s   (27m40s, GREEN)
    # Dropping a fork cost only ~7%, which is itself evidence that the MAIN
    # THREAD was the bottleneck rather than worker parallelism. 45m is ~60%
    # headroom over the green run. A TIMEOUT HERE WOULD BE A FALSE RED — it
    # means this budget is too small, NOT that the RPC bug is back. Not a
    # masked hang: the job still fails on any test failure or coverage miss.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/fiab-console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Detect console changes
        id: changed
        working-directory: ${{ github.workspace }}
        # This job always starts (so it can safely be wired as a required check
        # without deadlocking bicep- or workflow-only PRs) but skips the heavy
        # install/test when nothing it covers was touched. It resolves to one of
        # THREE states, not two:
        #
        #   console=true            the console itself changed -> full sharded
        #                           suite + the ratcheting coverage floor.
        #   infra=true              the console did NOT change, but the PR
        #                           touched files that console suites READ ->
        #                           run just those suites (~66s measured).
        #   neither                 nothing this suite covers changed -> green.
        #
        # The middle state is #3783. The filter used to be keyed to where a test
        # FILE LIVES (`^apps/fiab-console/`), but ~42 suites under that path are
        # infra gates that readFileSync a workflow, a bicep module, or a
        # scripts/ci fixture — or IMPORT a `scripts/`/`azure-functions/` module
        # that does. A PR touching only .github/workflows/** changes
        # exactly what those suites watch and was exactly when they were skipped
        # — this REQUIRED check reported green having executed zero tests (job
        # 95847683230: steps 4-7 all `skipped`, conclusion `success`).
        #
        # The `--ere` pattern is DERIVED from the same source scan that selects
        # the suites, so the trigger and the selection cannot drift apart. `node`
        # is preinstalled on ubuntu-latest, which matters because this step runs
        # BEFORE setup-node; the deriver is dependency-free and uses only
        # node: builtins so that ordering is safe.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            # depth=1 gives the base TIP but not the MERGE BASE, so the
            # three-dot range below cannot be resolved and `git diff` errors.
            # That error used to be swallowed (2>/dev/null), the grep found
            # nothing, and the else-branch reported this REQUIRED check green
            # without building or testing anything.
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            if ! git merge-base "$base" HEAD >/dev/null 2>&1; then
              git fetch --no-tags --deepen=200 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            fi
            range="$base...HEAD"
          else
            range="HEAD~1...HEAD"
          fi
          # FAIL OPEN. If the range cannot be resolved we must BUILD, never skip:
          # skipping reports a required check green on an unexamined tree.
          if ! changed=$(git diff --name-only "$range" 2>&1); then
            echo "::warning::could not resolve '$range' ($changed) — building anyway rather than reporting this required check green on an unexamined tree."
            echo "console=true" >> "$GITHUB_OUTPUT"
            echo "infra=false" >> "$GITHUB_OUTPUT"
          elif echo "$changed" | grep -qE '^apps/fiab-console/|^\.github/workflows/fiab-console-ci\.yml'; then
            echo "console=true" >> "$GITHUB_OUTPUT"
            echo "infra=false" >> "$GITHUB_OUTPUT"
            echo "Console changed — running the full vitest suite."
          elif ! ere=$(node scripts/ci/derive-infra-reading-suites.mjs --ere); then
            # FAIL OPEN again, and in the same direction: a broken deriver means
            # we do not KNOW which subset is safe to skip, so run everything.
            # Skipping on an unanswerable question is the #3783 defect itself.
            echo "::warning::the infra-suite deriver failed — running the FULL suite rather than guessing which subset to skip."
            echo "console=true" >> "$GITHUB_OUTPUT"
            echo "infra=false" >> "$GITHUB_OUTPUT"
          elif echo "$changed" | grep -qE "$ere"; then
            echo "console=false" >> "$GITHUB_OUTPUT"
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "Console untouched, but this PR changes paths the infra-gate suites read ($ere) — running that subset."
          else
            echo "console=false" >> "$GITHUB_OUTPUT"
            echo "infra=false" >> "$GITHUB_OUTPUT"
            echo "Nothing this suite covers changed — skipping vitest, reporting this check green."
          fi

      - name: Use Node.js 20
        if: steps.changed.outputs.console == 'true' || steps.changed.outputs.infra == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install pnpm
        if: steps.changed.outputs.console == 'true' || steps.changed.outputs.infra == 'true'
        run: npm install -g pnpm@9

      - name: Install dependencies
        if: steps.changed.outputs.console == 'true' || steps.changed.outputs.infra == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Run vitest (with istanbul coverage floor)
        if: steps.changed.outputs.console == 'true'
        env:
          # 3072, NOT the build job's 6144 — and the reduction is the point.
          #
          # A GitHub runner has ~16 GB. At 6144 per fork, 3 forks plus the main
          # process can ask for ~24 GB, and the kernel kills a fork; its IPC
          # channel then closes and vitest reports
          #     Serialized Error: { code: 'ERR_IPC_CHANNEL_CLOSED' }
          # with NO blob written for that shard. That is what the missing-blob
          # guard below caught — before it, the merge would have graded half the
          # suite and called the job green.
          #
          # Each shard now transforms ~651 files rather than 1302, so it does not
          # need the whole-suite heap. 3072 x 3 forks + main fits with headroom.
          NODE_OPTIONS: --max-old-space-size=3072
        # SHARDED, and deliberately WITHIN one job rather than a matrix.
        #
        # WHY SHARDED — FOR MEMORY. At 6144 per fork the whole suite OOM-killed a
        # fork on a ~16 GB runner and closed its IPC channel
        # (ERR_IPC_CHANNEL_CLOSED) with no blob written. Half-suite shards at 3072
        # fit with headroom. That is the reason sharding is here and stays here.
        #
        # SHARDING IS **NOT** A REMEDY FOR `Timeout calling "onTaskUpdate"`, and
        # the note that used to claim it "reduces the window" was wrong. #2944
        # measured the mechanism: that error is a spec file blocking its own
        # worker's event loop past birpc's hardcoded 60s reply deadline, so it is
        # a function of ONE FILE's cumulative synchronous CPU. A shard still runs
        # each file whole, so sharding cannot buy any of it back — nor can the
        # fork cap (it reproduces at maxForks 1, with the main thread idle), nor
        # the coverage provider. The actual culprit was
        # lib/azure/__tests__/unity-audit-guard.test.ts at 108,699ms — the only
        # file over 60s out of 1,354 — and it was fixed in the guard it exercises.
        # See the poolOptions note in apps/fiab-console/vitest.config.ts for the
        # controlled measurements before forming a theory about this error.
        #
        # WHY NOT A MATRIX. `vitest (node 20)` is the ROLL GATE — see the header
        # of this file and loom-roll-and-validate.yml, which reads a check-run of
        # exactly that name. A matrix would rename it to `vitest (node 20) (1/2)`
        # and silently break every deploy. Sharding inside the job keeps the
        # check name, and the per-process file count is what matters anyway.
        #
        # WHY --merge-reports FOR THE FLOOR. Each shard sees only half the files,
        # so its coverage is PARTIAL. Enforcing --cov-fail-under per shard would
        # compare half a numerator against a whole-suite floor and fail
        # spuriously — or, worse, pass while measuring less than it claims. The
        # blob reports are merged first and the ratcheting floor (rel-T28) is
        # enforced ONCE, on the whole.
        run: |
          set -euo pipefail
          rm -rf .vitest-reports
          for shard in 1 2; do
            echo "::group::vitest shard $shard/2"
            # A shard's own exit code is NOT the verdict, and letting `set -e`
            # act on it was a real bug in the first version of this step: shard 2
            # exited non-zero on the vitest-3 RPC reporting error and killed the
            # job BEFORE the merge could run, so the actual gate never executed.
            #
            # This is not a suppression. The blob carries every test result, so
            # the merge below sees all 1302 files and fails on any genuine test
            # failure or on the coverage floor. Deferring to it is what makes the
            # merge the single enforcement point rather than one of three.
            # Thresholds MUST be off per shard. A shard sees half the files, so
            # its coverage lands well under the whole-suite floor — it fails
            # every time, for a reason that says nothing about the code. I wrote
            # the commit message warning about exactly this and then dropped the
            # disable flag in the next commit; CI caught it.
            pnpm vitest run --shard="$shard/2" --reporter=blob               --coverage --coverage.reporter=json               --coverage.thresholds.lines=0 --coverage.thresholds.statements=0               --coverage.thresholds.functions=0 --coverage.thresholds.branches=0               || echo "shard $shard exited non-zero — the merge below is the verdict"
            echo "::endgroup::"
          done
          # Fail loudly if a shard produced no blob — that IS fatal, because the
          # merge would then silently grade half the suite.
          test -f .vitest-reports/blob-1-2.json || { echo "::error::shard 1 produced no blob"; exit 1; }
          test -f .vitest-reports/blob-2-2.json || { echo "::error::shard 2 produced no blob"; exit 1; }
          # THE gate: every test from both shards + the ratcheting coverage floor.
          pnpm vitest --merge-reports --coverage

      - name: Run vitest (infra-reading suites only)
        if: steps.changed.outputs.console != 'true' && steps.changed.outputs.infra == 'true'
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        # The #3783 branch: the console is untouched, but this PR edits files
        # that console suites read. Run exactly those suites.
        #
        # NOT SHARDED, and NO COVERAGE FLOOR — both are deliberate, and both
        # differ from the full-suite step above for the same reason.
        #
        #   Sharding exists up there to keep a fork under the ~16 GB runner
        #   (1302 files at 3072/fork). MEASURED here at 38 suites: 66s wall /
        #   45.87s vitest / 798 tests, single pass. The derived set is now 42:
        #   the import signal recovers three suites the fs-call rule missed
        #   (~21s combined, measured during review), and fixing the deriver's
        #   INCLUDE globs recovered one more — `lib/__tests__/
        #   api-route-typing.test.ts`, which vitest ran but the deriver could
        #   not see. So the lane is nowhere near memory or time pressure. The
        #   42-suite total has NOT been re-measured end to end — stated so the
        #   numbers above are not read as covering it.
        #
        #   The coverage floor is a WHOLE-SUITE ratchet. Enforcing it against a
        #   42-file subset compares a small numerator to a whole-suite
        #   denominator and fails every time, for a reason that says nothing
        #   about the diff — the same trap documented on the per-shard
        #   thresholds above. This lane gates CORRECTNESS of the infra
        #   assertions, not coverage; coverage is enforced whenever the console
        #   itself changes, which is when it can be measured honestly.
        #
        # The suite list is re-derived here rather than passed from the detect
        # step: it is the same script and the same tree, so it is the same
        # answer, and the derivation carries its own controls (a sentinel suite
        # that must be present, a floor below which it refuses to emit, and a
        # set of directories that must appear in the emitted trigger). A
        # deriver that silently returned nothing would recreate this issue's own
        # defect one level down — a green check having run zero tests.
        run: |
          set -euo pipefail
          # Command substitution, NOT `mapfile < <(node ...)`. A process
          # substitution does not propagate its exit status to mapfile, so
          # `set -e` never sees the deriver fail — its controls would fire, the
          # step would ignore them, and vitest would be handed an empty filter
          # (which runs everything, blowing this lane's budget) or nothing at
          # all. An assignment from $(...) does fail the step, which is the
          # whole point of the controls.
          suites_raw=$(node scripts/ci/derive-infra-reading-suites.mjs --suites)
          if [ -z "$suites_raw" ]; then
            echo "::error::the deriver emitted no suites but exited 0 — refusing to report this required check green on zero tests (#3783)."
            exit 1
          fi
          mapfile -t suites <<< "$suites_raw"
          echo "Running ${#suites[@]} infra-reading suites:"
          printf '  %s\n' "${suites[@]}"
          cd apps/fiab-console
          # `Running N suites` is a CLAIM. Until now nothing checked it, and the
          # gap was measured in review (2026-08-20): with 2 of 3 filters not
          # matching, vitest ran ONE file and exited 0 — the step printed its
          # confident count and went green having executed a fraction of it.
          # That is #3783's exact shape (a required check green on tests it did
          # not run), just with a numerator above zero, which is why
          # `passWithNoTests: false` in vitest.config.ts does not cover it alone.
          #
          # So capture the machine-readable report and assert the EXECUTED file
          # count against the DERIVED one. `--reporter=default` is kept so the
          # log stays readable; `--outputFile.json` is the per-reporter form
          # required when more than one reporter is active.
          report="${RUNNER_TEMP:-/tmp}/vitest-infra-report.json"
          rm -f "$report"
          pnpm vitest run --coverage=false             --reporter=default --reporter=json --outputFile.json="$report"             "${suites[@]}"
          # A missing/unparseable report FAILS the step, and says so in words
          # rather than as a node stack trace (deploy-integrity R6). It is the
          # only evidence of what actually ran, so "I could not read it" must
          # never be treated as "it was fine" (R7: if the code does not know, it
          # does not claim).
          executed=$(node -e "const fs=require('node:fs');let r;try{r=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));}catch(e){console.error('::error::could not read the vitest JSON report at '+process.argv[1]+' ('+e.message+'). That report is the only evidence of which files actually executed, so this step fails rather than assume the run was complete (#3783).');process.exit(1);}const n=Array.isArray(r.testResults)?r.testResults.length:-1;if(n<0){console.error('::error::the vitest JSON report has no testResults array, so the number of files executed cannot be established. Failing rather than assuming (#3783).');process.exit(1);}process.stdout.write(String(n));" "$report")
          echo "vitest executed $executed file(s); the deriver selected ${#suites[@]}."
          if [ "$executed" -lt "${#suites[@]}" ]; then
            echo "::error::vitest executed $executed file(s) but the deriver selected ${#suites[@]}. This required check is also the roll gate, so reporting it green would put a SHA on the estate whose infra-gate suites did not all run (#3783). Refusing."
            exit 1
          fi
          if [ "$executed" -gt "${#suites[@]}" ]; then
            echo "::warning::vitest executed $executed file(s), MORE than the ${#suites[@]} selected — the filters are matching beyond the derived set. Not a coverage hole, but the two numbers should agree."
          fi

  tutorial-coverage:
    # Audits visual-tutorial coverage across ALL THREE dimensions (B-9):
    #   items + features are parsed from source; apps are audited against the
    #   checked-in fixture scripts/csa-loom/fixtures/apps-catalog.json (generated
    #   from CATALOG_META ∩ listBundleIds(), the exact set the live
    #   /api/apps-catalog surfaces). Pure node, no install.
    #
    # The fixture is BLOCKING-verified for freshness (the drift check below) so a
    # new curated app can never silently escape the apps coverage audit.
    #
    # The coverage REPORT itself is non-blocking *until reviewed screenshots are
    # published*: captures are produced by an operator running the
    # csa-loom-tutorial-capture workflow against the live console and reviewing
    # them behind the Azure-imagery privacy gate (publish-tutorials.mjs), so the
    # published set legitimately lags source until that credentialed run lands.
    # The instant the first reviewed captures are committed under
    # docs/fiab/tutorials/items/, make this a hard gate by adding `--strict` to
    # the coverage step below — that single edit permanently enforces
    # "every item/app/feature has a screenshot set".
    name: visual-tutorial coverage (report)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Use Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Verify apps-catalog fixture is in sync with source (blocking)
        # FAILS the build if a new app was added to CATALOG_META/index.ts without
        # regenerating the fixture, so the apps dimension stays auditable + honest.
        run: node scripts/csa-loom/gen-apps-catalog-fixture.mjs --check
      - name: Report tutorial coverage (items + features + apps)
        # Non-blocking until reviewed captures land — add `--strict` here to enable
        # the blocking gate in the same change that commits the published captures.
        run: node scripts/csa-loom/check-tutorial-coverage.mjs --apps-catalog scripts/csa-loom/fixtures/apps-catalog.json

  # -- LU-9: the out-of-band sharing app's own fail-closed suite -------------
  #
  # apps/loom-sharing ships an entrypoint that renders the Delta Sharing
  # reference server's config and REFUSES TO BOOT without a bearer, with a
  # corrupt manifest, or with a half-wired storage principal. Those assertions
  # are the difference between "internal-ingress only" and "an unauthenticated
  # server holding every published share", so they need a CI lane rather than a
  # local `node --test` nobody runs. Pure node:test -- no install, no network.
  loom-sharing:
    name: loom-sharing entrypoint (node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Use Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Run the entrypoint fail-closed suite
        working-directory: apps/loom-sharing
        run: node --test tests/

  # -- #2835: EVERY node:test suite in the repo, discovered not listed --------
  #
  # The `loom-sharing` job above and the scripts/ci self-test step in
  # loom-guardrails.yml each reached the same conclusion -- "a test nobody runs
  # is the same class of defect as a gate that measures nothing" -- and each
  # fixed exactly ONE directory by hand. Neither generalized, so four suites
  # (58 tests) were still dark: apps/loom-unity (Unity Catalog authorization is
  # DEFAULT-ON and FAIL-CLOSED), apps/loom-onelake (path-traversal defenses and
  # the no-Fabric-host invariant), scripts/csa-loom (the image preflight fails
  # rather than deploying blind), and tools/ado-loom-task.
  #
  # Adding a third and fourth hand-written lane would close those four and leave
  # the class open, so this job DISCOVERS instead: any node:test file added
  # anywhere is picked up the day it lands. The runner fails closed when
  # discovery matches nothing and when every suite skips, because both of those
  # are green-while-measuring-nothing.
  #
  # `loom-sharing` above is deliberately left in place: it is an independent
  # control proving this job changed no existing behaviour. The few seconds of
  # overlap are worth that.
  #
  # Pure node:test -- no install, no network, ~20s.
  node-test-suites:
    name: 'node:test suites (node 20)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Use Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: 'Discover and run every node:test suite'
        run: node scripts/ci/check-node-test-suites.mjs
