# CSA Loom console — build gate.
#
# WHY THIS EXISTS:
#   The repo's required PR checks are Python / dbt / lint / secret-scan — none
#   of them COMPILE the Next.js console in apps/fiab-console. So a TypeScript /
#   bundling break (e.g. an import of a file that was never committed) passed
#   every required check and only blew up later in the Docker image build inside
#   loom-roll-and-validate / deploy-fiab-*. This workflow runs the SAME build the
#   Dockerfile runs (`pnpm build` == `next build`, node 20, pnpm 9, 4 GB heap),
#   so module-resolution / bundling failures are caught at PR time instead.
#
#   next.config sets typescript.ignoreBuildErrors + eslint.ignoreDuringBuilds, so
#   this mirrors deploy exactly: it does NOT fail on pure type/lint nits, but it
#   DOES fail on anything that would break the real production build (unresolved
#   imports, bad JSX, server/client boundary violations, etc.).
#
# Path-filtered to apps/fiab-console/** so it only runs when the console changes.
name: CSA Loom Console Build

# NOTE: this job is a REQUIRED status check. It must therefore run (and report)
# on EVERY pull request, even ones that don't touch the console — otherwise a
# bicep/workflow-only PR deadlocks: the required `next build (node 20)` context
# never reports and the PR can never merge. So we DON'T path-filter at the `on:`
# level; instead the job always starts and an internal change-detection step
# skips the heavy install/build (reporting green) when apps/fiab-console is
# untouched. When the console DOES change, the full real `next build` runs.
on:
  pull_request:
  push:
    branches: [main]

# CONCURRENCY: keyed per-COMMIT on main, per-ref on PRs.
#
# WHY: `vitest (node 20)` from this workflow is the ROLL GATE —
# loom-roll-and-validate refuses to roll a SHA whose vitest did not conclude
# `success`. With a ref-keyed group, merging any follow-up PR CANCELS the
# still-running main CI of the PREVIOUS commit, permanently marking that SHA
# `cancelled` and making it unrollable even though nothing was wrong with it.
# That is not hypothetical: it blocked a production roll on 2026-07-28 (the
# Phase-A image was built and signed, but its vitest had been cancelled by the
# next merge, so the gate correctly refused an unverified SHA).
#
# On main each commit is an independent, rollable artifact, so its CI must run
# to completion — cancel-in-progress is FALSE there. On PR refs a new push
# genuinely supersedes the old one, so cancelling still applies (and still
# saves the CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  build:
    name: next build (node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/fiab-console
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - name: Detect console changes
        id: changed
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            # depth=1 gives the base TIP but not the MERGE BASE, so the
            # three-dot range below cannot be resolved and `git diff` errors.
            # That error used to be swallowed (2>/dev/null), the grep found
            # nothing, and the else-branch reported this REQUIRED check green
            # without building or testing anything.
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            if ! git merge-base "$base" HEAD >/dev/null 2>&1; then
              git fetch --no-tags --deepen=200 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            fi
            range="$base...HEAD"
          else
            range="HEAD~1...HEAD"
          fi
          # FAIL OPEN. If the range cannot be resolved we must BUILD, never skip:
          # skipping reports a required check green on an unexamined tree.
          if ! changed=$(git diff --name-only "$range" 2>&1); then
            echo "::warning::could not resolve '$range' ($changed) — building anyway rather than reporting this required check green on an unexamined tree."
            echo "console=true" >> "$GITHUB_OUTPUT"
          elif echo "$changed" | grep -qE '^apps/fiab-console/|^\.github/workflows/fiab-console-ci\.yml'; then
            echo "console=true" >> "$GITHUB_OUTPUT"
            echo "Console changed — running full next build."
          else
            echo "console=false" >> "$GITHUB_OUTPUT"
            echo "No apps/fiab-console changes — skipping build, reporting this required check green."
          fi

      - name: Use Node.js 20
        if: steps.changed.outputs.console == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Item-route persistence guard
        if: steps.changed.outputs.console == 'true'
        working-directory: apps/fiab-console
        # Fails if any editor's useItemState(<type>) lacks a matching
        # /api/items/<type>/[id]/route.ts (GET+PATCH) — the silent edit-loss
        # class the 2026-06-04 scaffold audit caught. Pure node, no install.
        run: node scripts/check-item-routes.mjs

      - name: No bare server-fetch guard
        if: steps.changed.outputs.console == 'true'
        working-directory: apps/fiab-console
        # Fails if any server module in lib/azure/** or lib/install/** does a bare
        # global fetch( instead of fetchWithTimeout — the "no-timeout" defect class
        # PR #1198 eliminated. Keeps "every server caller inherits the ceiling"
        # true going forward. Pure node, no install.
        run: node scripts/no-bare-server-fetch.mjs

      - name: Install pnpm
        if: steps.changed.outputs.console == 'true'
        run: npm install -g pnpm@9

      - name: Circular-dependency guard (lib/editors)
        if: steps.changed.outputs.console == 'true'
        working-directory: apps/fiab-console
        # rel-T29 / B13: run the `guard:circular` script that was defined in
        # package.json but never wired into CI. Fails if a NEW import cycle
        # appears in lib/editors beyond the documented baseline (the phase3
        # per-editor split + barrel could silently reintroduce one — it already
        # caught the paginated-report-editor ⇄ barrel cycle once). Uses madge via
        # npx; needs no project deps, so it runs before the heavy install/build
        # and fails fast.
        run: pnpm guard:circular

      - name: Install dependencies
        if: steps.changed.outputs.console == 'true'
        # Match the Dockerfile (`pnpm install --no-frozen-lockfile`) so CI builds
        # exactly what deploy builds.
        run: pnpm install --no-frozen-lockfile

      - name: Build (next build)
        if: steps.changed.outputs.console == 'true'
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # 6144 matches the Dockerfile/ACR build heap — 4096 OOMs since the
          # console grew past ~117 editors (FATAL: JS heap out of memory).
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build

      - name: Lint (next lint)
        if: steps.changed.outputs.console == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        # next.config sets eslint.ignoreDuringBuilds so `pnpm build` above does
        # NOT lint. This runs the ESLint gate explicitly (rel-T26 / B13): the
        # console's .eslintrc.json extends next/core-web-vitals with a few noisy
        # rules downgraded to warnings, so this FAILS only on genuine lint
        # errors (missing keys, comment-in-JSX, parse errors), not on the ~600
        # existing style warnings.
        run: pnpm lint

  vitest:
    name: vitest (node 20)
    runs-on: ubuntu-latest
    # 55m (was 25m, then 40m): the coverage provider is now istanbul (Babel
    # instrumentation costs wall clock v8's runtime-derived coverage did not),
    # AND maxForks is capped at 2 under CI to keep the main thread responsive
    # to the 60s reporting-RPC deadline. Both trade time for correctness.
    # MEASURED per-blob on this runner:
    #     v8,       3 forks   534.52s + 562.76s = ~1097s  (25m43s end to end)
    #     istanbul, 3 forks   728.94s + 751.68s = ~1481s
    # 2 forks is slower again. A TIMEOUT HERE WOULD BE A FALSE RED — do not read
    # it as the RPC bug; it means this budget is too small. This is not a masked
    # hang: the job still fails on any test failure or coverage miss, and 55m
    # still bounds a genuine deadlock.
    timeout-minutes: 55
    defaults:
      run:
        working-directory: apps/fiab-console
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - name: Detect console changes
        id: changed
        working-directory: ${{ github.workspace }}
        # Same change-detection as the build job: this job always starts (so it
        # can safely be wired as a required check without deadlocking bicep- or
        # workflow-only PRs) but skips the heavy install/test — reporting green —
        # when apps/fiab-console is untouched.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            # depth=1 gives the base TIP but not the MERGE BASE, so the
            # three-dot range below cannot be resolved and `git diff` errors.
            # That error used to be swallowed (2>/dev/null), the grep found
            # nothing, and the else-branch reported this REQUIRED check green
            # without building or testing anything.
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            if ! git merge-base "$base" HEAD >/dev/null 2>&1; then
              git fetch --no-tags --deepen=200 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            fi
            range="$base...HEAD"
          else
            range="HEAD~1...HEAD"
          fi
          # FAIL OPEN. If the range cannot be resolved we must BUILD, never skip:
          # skipping reports a required check green on an unexamined tree.
          if ! changed=$(git diff --name-only "$range" 2>&1); then
            echo "::warning::could not resolve '$range' ($changed) — building anyway rather than reporting this required check green on an unexamined tree."
            echo "console=true" >> "$GITHUB_OUTPUT"
          elif echo "$changed" | grep -qE '^apps/fiab-console/|^\.github/workflows/fiab-console-ci\.yml'; then
            echo "console=true" >> "$GITHUB_OUTPUT"
            echo "Console changed — running vitest."
          else
            echo "console=false" >> "$GITHUB_OUTPUT"
            echo "No apps/fiab-console changes — skipping vitest, reporting this check green."
          fi

      - name: Use Node.js 20
        if: steps.changed.outputs.console == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install pnpm
        if: steps.changed.outputs.console == 'true'
        run: npm install -g pnpm@9

      - name: Install dependencies
        if: steps.changed.outputs.console == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Run vitest (with istanbul coverage floor)
        if: steps.changed.outputs.console == 'true'
        env:
          # 3072, NOT the build job's 6144 — and the reduction is the point.
          #
          # A GitHub runner has ~16 GB. At 6144 per fork, 3 forks plus the main
          # process can ask for ~24 GB, and the kernel kills a fork; its IPC
          # channel then closes and vitest reports
          #     Serialized Error: { code: 'ERR_IPC_CHANNEL_CLOSED' }
          # with NO blob written for that shard. That is what the missing-blob
          # guard below caught — before it, the merge would have graded half the
          # suite and called the job green.
          #
          # Each shard now transforms ~651 files rather than 1302, so it does not
          # need the whole-suite heap. 3072 x 3 forks + main fits with headroom.
          NODE_OPTIONS: --max-old-space-size=3072
        # SHARDED, and deliberately WITHIN one job rather than a matrix.
        #
        # WHY SHARDED. vitest 3 fails a run on an unhandled error that vitest 2
        # tolerated, and this suite produces
        #     Error: [vitest-worker]: Timeout calling "onTaskUpdate"
        # — the worker->main RPC missing its deadline while REPORTING, while
        # every test passes. Halving the per-run file count reduces the window
        # in which that can happen. It does NOT eliminate it: this job still
        # trips the error on a 4-core runner, and switching the coverage
        # provider to istanbul did not change that (it is a main-thread
        # starvation problem against a 60s deadline hardcoded in vitest's
        # bundled birpc — no config option, no VITEST_* env var. See the long
        # note in vitest.config.ts before forming a theory about it, and DO NOT
        # conclude anything from a local run: on 32 cores this suite is clean
        # under istanbul and still fails here).
        #
        # Sharding also earns its keep on memory, which is the reason to KEEP it
        # regardless: at 6144 per fork the whole suite OOM-killed a fork on a
        # ~16 GB runner and closed its IPC channel (ERR_IPC_CHANNEL_CLOSED) with
        # no blob written. Half-suite shards at 3072 fit with headroom.
        #
        # WHY NOT A MATRIX. `vitest (node 20)` is the ROLL GATE — see the header
        # of this file and loom-roll-and-validate.yml, which reads a check-run of
        # exactly that name. A matrix would rename it to `vitest (node 20) (1/2)`
        # and silently break every deploy. Sharding inside the job keeps the
        # check name, and the per-process file count is what matters anyway.
        #
        # WHY --merge-reports FOR THE FLOOR. Each shard sees only half the files,
        # so its coverage is PARTIAL. Enforcing --cov-fail-under per shard would
        # compare half a numerator against a whole-suite floor and fail
        # spuriously — or, worse, pass while measuring less than it claims. The
        # blob reports are merged first and the ratcheting floor (rel-T28) is
        # enforced ONCE, on the whole.
        run: |
          set -euo pipefail
          rm -rf .vitest-reports
          for shard in 1 2; do
            echo "::group::vitest shard $shard/2"
            # A shard's own exit code is NOT the verdict, and letting `set -e`
            # act on it was a real bug in the first version of this step: shard 2
            # exited non-zero on the vitest-3 RPC reporting error and killed the
            # job BEFORE the merge could run, so the actual gate never executed.
            #
            # This is not a suppression. The blob carries every test result, so
            # the merge below sees all 1302 files and fails on any genuine test
            # failure or on the coverage floor. Deferring to it is what makes the
            # merge the single enforcement point rather than one of three.
            # Thresholds MUST be off per shard. A shard sees half the files, so
            # its coverage lands well under the whole-suite floor — it fails
            # every time, for a reason that says nothing about the code. I wrote
            # the commit message warning about exactly this and then dropped the
            # disable flag in the next commit; CI caught it.
            pnpm vitest run --shard="$shard/2" --reporter=blob               --coverage --coverage.reporter=json               --coverage.thresholds.lines=0 --coverage.thresholds.statements=0               --coverage.thresholds.functions=0 --coverage.thresholds.branches=0               || echo "shard $shard exited non-zero — the merge below is the verdict"
            echo "::endgroup::"
          done
          # Fail loudly if a shard produced no blob — that IS fatal, because the
          # merge would then silently grade half the suite.
          test -f .vitest-reports/blob-1-2.json || { echo "::error::shard 1 produced no blob"; exit 1; }
          test -f .vitest-reports/blob-2-2.json || { echo "::error::shard 2 produced no blob"; exit 1; }
          # THE gate: every test from both shards + the ratcheting coverage floor.
          pnpm vitest --merge-reports --coverage

  tutorial-coverage:
    # Audits visual-tutorial coverage across ALL THREE dimensions (B-9):
    #   items + features are parsed from source; apps are audited against the
    #   checked-in fixture scripts/csa-loom/fixtures/apps-catalog.json (generated
    #   from CATALOG_META ∩ listBundleIds(), the exact set the live
    #   /api/apps-catalog surfaces). Pure node, no install.
    #
    # The fixture is BLOCKING-verified for freshness (the drift check below) so a
    # new curated app can never silently escape the apps coverage audit.
    #
    # The coverage REPORT itself is non-blocking *until reviewed screenshots are
    # published*: captures are produced by an operator running the
    # csa-loom-tutorial-capture workflow against the live console and reviewing
    # them behind the Azure-imagery privacy gate (publish-tutorials.mjs), so the
    # published set legitimately lags source until that credentialed run lands.
    # The instant the first reviewed captures are committed under
    # docs/fiab/tutorials/items/, make this a hard gate by adding `--strict` to
    # the coverage step below — that single edit permanently enforces
    # "every item/app/feature has a screenshot set".
    name: visual-tutorial coverage (report)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Verify apps-catalog fixture is in sync with source (blocking)
        # FAILS the build if a new app was added to CATALOG_META/index.ts without
        # regenerating the fixture, so the apps dimension stays auditable + honest.
        run: node scripts/csa-loom/gen-apps-catalog-fixture.mjs --check
      - name: Report tutorial coverage (items + features + apps)
        # Non-blocking until reviewed captures land — add `--strict` here to enable
        # the blocking gate in the same change that commits the published captures.
        run: node scripts/csa-loom/check-tutorial-coverage.mjs --apps-catalog scripts/csa-loom/fixtures/apps-catalog.json

  # -- LU-9: the out-of-band sharing app's own fail-closed suite -------------
  #
  # apps/loom-sharing ships an entrypoint that renders the Delta Sharing
  # reference server's config and REFUSES TO BOOT without a bearer, with a
  # corrupt manifest, or with a half-wired storage principal. Those assertions
  # are the difference between "internal-ingress only" and "an unauthenticated
  # server holding every published share", so they need a CI lane rather than a
  # local `node --test` nobody runs. Pure node:test -- no install, no network.
  loom-sharing:
    name: loom-sharing entrypoint (node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Run the entrypoint fail-closed suite
        working-directory: apps/loom-sharing
        run: node --test tests/
