name: CI_RUNNER is a well-formed runner label set

# 102 workflows route through
#   runs-on: ${{ fromJSON(startsWith(vars.CI_RUNNER, '[') && vars.CI_RUNNER || '["ubuntu-latest"]') }}
#
# THE SCALAR FAIL-OPEN IS NOW CLOSED IN THE EXPRESSION ITSELF, and this header
# used to describe the state before that. The original form was
# `fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]')`, and an independent reviewer
# on PR #4492 measured its four states:
#
#   unset / empty / malformed JSON  -> fail CLOSED (the job does not start)
#   a JSON ARRAY                    -> correct
#   a JSON SCALAR, e.g. "self-hosted"
#                                   -> `fromJSON` returns a STRING, `runs-on:
#                                      <string>` is legal YAML, and the job
#                                      routed to ANY self-hosted runner with no
#                                      `loom-aca` narrowing.  <- FAILED OPEN
#
# `startsWith` is evaluated on the RAW variable text before anything parses it,
# so a value that is not bracket-delimited can no longer reach `fromJSON`: it
# falls back to ubuntu-latest instead of misrouting. The old claim that there
# is "no way to assert array-ness inside a GitHub expression" was true as
# stated and beside the point -- we do not need array-ness, only the cheaper
# necessary condition that a JSON array starts with '['.
#
# WHAT THAT COSTS, and why the bracket check below exists. A value that IS a
# valid JSON array but does not START with '[' -- leading whitespace -- now
# degrades silently to ubuntu-latest. Fail-safe, but silent, and a fleet the
# operator believes is live would quietly not be. So this guard asserts the
# SAME predicate the expression uses. If the two ever disagree, this goes red
# rather than the estate going quiet.
#
# This is therefore prevention AND detection, where it used to be detection
# alone. It is still not sufficient on its own: `vars.CI_RUNNER` changes OUT OF
# BAND, on no trigger at all, and on a pull_request this job runs CONCURRENTLY
# with the jobs it judges. The `schedule` below exists so that drift is bounded
# by an interval rather than by "whenever someone next opens a PR" -- of the
# 102 converted workflows, 26 are schedule-triggered and 92 dispatch-triggered
# (26 are both), and neither class would otherwise ever run this guard.
#
# That dispatch figure READ 93 UNTIL 2026-09-26, and the extra one was THIS
# FILE. A raw-text census matches the expression quoted in the comment at the
# top of this header, so the guard counted itself as converted -- a control
# derived from its own subject -- while the schedule figure beside it excluded
# the guard and was right. Re-derived at 5cfe3aaa6 by a PyYAML walk that reads
# each job's `runs-on` VALUE rather than the file's text, with a control
# asserting the two populations differ by exactly this file:
#
#   workflow files scanned                        130
#   raw-text hits (counts this header's comment)  103
#   converted workflows (runs-on VALUE)           102
#     schedule-triggered                           26
#     workflow_dispatch-triggered                  92
#     both                                         26
#     neither                                      10
#
# THIS WORKFLOW PINS `ubuntu-latest` ON PURPOSE. It must not route through the
# variable it exists to check: a malformed value would otherwise take the guard
# down with everything else, which is the failure mode where a control is
# absent exactly when it is needed.
#
# ---------------------------------------------------------------------------
# WHAT THIS GUARD DOES NOT CHECK: THE BOUNDARY
# ---------------------------------------------------------------------------
# Everything above judges the variable's SHAPE. It cannot judge its SCOPE,
# because the variable has none: `vars.CI_RUNNER` is a single repository-wide
# value with no boundary dimension, and .github/actionlint.yaml declares
# exactly one self-hosted label — `loom-aca`, the Commercial fleet in the DMLZ
# subscription's cae-csa-loom-centralus, under the Commercial identity
# uami-loom-ci. There is no Gov / GCC-High / IL5 fleet.
#
# Measured 2026-09-25 at PR #4492's head, by a PyYAML walk that classifies a
# workflow as boundary-touching only when it TAKES a sovereign action
# (`az cloud set --name AzureUSGovernment`, a secrets.AZURE_GOV_*/AZURE_GCC_*
# reference, a .usgovcloudapi endpoint, or a gov-* filename):
#
#   converted jobs, all workflows        171
#   in Gov-touching workflows             54  in 36 files
#   mentions a boundary token only        13  in  6 files (NOT counted)
#
# So a value this guard passes as WELL-FORMED still routes all 54 sovereign
# jobs onto the Commercial fleet — a GCC-High or IL5 deploy would run its
# `az cloud set` and its sovereign credentials on a host inside the Commercial
# hub VNet. That is DECLARED, per cloud-parity.md, not fixed: no value of a
# single variable can express a correct per-boundary configuration. See the
# "SOVEREIGN BOUNDARY EXPOSURE" block in
# platform/fiab/bicep/modules/admin-plane/gh-runner-job.bicep.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Hourly. The variable is written out of band, so this is the only trigger
    # that bounds how long a bad value can route jobs unobserved.
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  check:
    name: CI_RUNNER is unset or a JSON array naming a real fleet
    runs-on: ubuntu-latest   # NOT vars.CI_RUNNER — see the header.
    timeout-minutes: 5
    steps:
      # Needed only for .github/actionlint.yaml, which is the source of the
      # declared-fleet-label list the narrowing arm checks against. Lifting the
      # list at run time rather than transcribing it means a typo cannot make
      # this guard disagree with the config it is enforcing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Validate the variable's shape
        env:
          # Read RAW, never through fromJSON — the point is to judge the text
          # before anything parses it into a shape that hides the defect.
          CI_RUNNER_RAW: ${{ vars.CI_RUNNER }}
        run: |
          raw="${CI_RUNNER_RAW:-}"
          if [ -z "$raw" ]; then
            echo "CI_RUNNER is unset — every job falls back to ubuntu-latest. That is a"
            echo "valid state (it is the rollback), so this passes."
            exit 0
          fi
          echo "CI_RUNNER = $raw"

          # THE SAME PREDICATE THE `runs-on` EXPRESSION USES, asserted here so
          # the two cannot diverge. The expression tests startsWith(…, '[') on
          # the RAW text; a value that parses as an array but does not start
          # with '[' (leading whitespace) would be accepted by every jq check
          # below and SILENTLY downgraded to ubuntu-latest at routing time.
          # This arm is what makes that state loud instead of quiet.
          # What value would make it fail: ' ["self-hosted","loom-aca"]'.
          case "$raw" in
            '['*) : ;;
            *)
              echo "::error::CI_RUNNER does not START with '['. The runs-on expression tests"
              echo "::error::startsWith(vars.CI_RUNNER, '[') on the raw text, so this value would"
              echo "::error::NOT be parsed as a label set — every job would silently fall back to"
              echo "::error::ubuntu-latest while appearing to be configured for the fleet."
              echo "::error::Remove any leading whitespace/quoting: [\"self-hosted\",\"loom-aca\"]"
              exit 1
              ;;
          esac

          # jq -e exits non-zero when the filter yields false/null.
          if ! printf '%s' "$raw" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::error::CI_RUNNER is not a JSON ARRAY. A scalar makes fromJSON return a"
            echo "::error::string, runs-on accepts it, and the job routes to ANY self-hosted"
            echo "::error::runner with no label narrowing. Set it to e.g. [\"self-hosted\",\"loom-aca\"]"
            exit 1
          fi
          if ! printf '%s' "$raw" | jq -e 'length > 0' >/dev/null 2>&1; then
            echo "::error::CI_RUNNER is an EMPTY array — no runner can satisfy it and every"
            echo "::error::job will queue forever. Unset it instead to fall back to ubuntu-latest."
            exit 1
          fi
          if ! printf '%s' "$raw" | jq -e 'all(type == "string")' >/dev/null 2>&1; then
            echo "::error::CI_RUNNER contains a non-string element; labels must be strings."
            exit 1
          fi
          # A self-hosted set must NARROW, and `length > 1` is NOT enough to
          # establish that. An independent reviewer on PR #4492 measured
          # `["self-hosted",""]` passing the old arm: two elements, so the
          # length test was satisfied, while the set names no fleet at all.
          # `["self-hosted","x64"]` had the same hole. What the routing actually
          # needs is a DECLARED fleet label, so that is what is asserted —
          # lifted from .github/actionlint.yaml at run time, never transcribed.
          #
          # WHAT VALUE WOULD MAKE THIS FAIL: ["self-hosted",""],
          # ["self-hosted","x64"], ["self-hosted"] — all three are red here and
          # the first two were green before.
          if printf '%s' "$raw" | jq -e 'index("self-hosted")' >/dev/null 2>&1; then
            declared="$(awk '
              /^self-hosted-runner:/            { in_sh = 1; next }
              /^[^[:space:]#]/                  { in_sh = 0 }
              in_sh && /^[[:space:]]+labels:/   { in_l = 1; next }
              in_sh && in_l && /^[[:space:]]+-[[:space:]]*/ {
                sub(/^[[:space:]]+-[[:space:]]*/, ""); sub(/[[:space:]]+$/, ""); print; next }
              in_sh && in_l && /^[[:space:]]+[A-Za-z_]+:/ { in_l = 0 }
            ' .github/actionlint.yaml | jq -R . | jq -s -c .)"
            if [ "$(printf '%s' "$declared" | jq -r 'length')" -eq 0 ]; then
              echo "::error::Could not read any self-hosted label from .github/actionlint.yaml."
              echo "::error::Not treating that as 'the value is fine': the narrowing check has no"
              echo "::error::list to check against, so it cannot establish anything (R7)."
              exit 1
            fi
            echo "declared fleet labels: $(printf '%s' "$declared" | jq -c .)"
            if ! printf '%s' "$raw" | jq -e --argjson d "$declared" \
                 'map(select(. != "self-hosted" and (. | length) > 0)) | any(. as $l | $d | index($l))' \
                 >/dev/null 2>&1; then
              echo "::error::CI_RUNNER names 'self-hosted' but no DECLARED fleet label. Length alone"
              echo "::error::is not narrowing: [\"self-hosted\",\"\"] and [\"self-hosted\",\"x64\"] are two"
              echo "::error::elements and still route to ANY self-hosted runner, or to none at all."
              echo "::error::Use a label declared in .github/actionlint.yaml, e.g."
              echo "::error::[\"self-hosted\",\"loom-aca\"]."
              exit 1
            fi
          fi
          echo "ok — CI_RUNNER is a non-empty JSON array of strings$(printf '%s' "$raw" | jq -r 'if index("self-hosted") then " naming a narrowed self-hosted fleet" else "" end')."
