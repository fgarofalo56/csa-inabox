name: CI_RUNNER is a well-formed runner label set

# 102 workflows route through
#   runs-on: ${{ fromJSON(startsWith(vars.CI_RUNNER, '[') && vars.CI_RUNNER || '["ubuntu-latest"]') }}
#
# THE SCALAR FAIL-OPEN IS NOW CLOSED IN THE EXPRESSION ITSELF, and this header
# used to describe the state before that. The original form was
# `fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]')`, and an independent reviewer
# on PR #4492 measured its four states:
#
#   unset / empty / malformed JSON  -> fail CLOSED (the job does not start)
#   a JSON ARRAY                    -> correct
#   a JSON SCALAR, e.g. "self-hosted"
#                                   -> `fromJSON` returns a STRING, `runs-on:
#                                      <string>` is legal YAML, and the job
#                                      routed to ANY self-hosted runner with no
#                                      `loom-aca` narrowing.  <- FAILED OPEN
#
# `startsWith` is evaluated on the RAW variable text before anything parses it,
# so a value that is not bracket-delimited can no longer reach `fromJSON`: it
# falls back to ubuntu-latest instead of misrouting. The old claim that there
# is "no way to assert array-ness inside a GitHub expression" was true as
# stated and beside the point -- we do not need array-ness, only the cheaper
# necessary condition that a JSON array starts with '['.
#
# WHAT THAT COSTS, and why the bracket check below exists. A value that IS a
# valid JSON array but does not START with '[' -- leading whitespace -- now
# degrades silently to ubuntu-latest. Fail-safe, but silent, and a fleet the
# operator believes is live would quietly not be. So this guard asserts the
# SAME predicate the expression uses. If the two ever disagree, this goes red
# rather than the estate going quiet.
#
# This is therefore prevention AND detection, where it used to be detection
# alone. It is still not sufficient on its own: `vars.CI_RUNNER` changes OUT OF
# BAND, on no trigger at all, and on a pull_request this job runs CONCURRENTLY
# with the jobs it judges. The `schedule` below exists so that drift is bounded
# by an interval rather than by "whenever someone next opens a PR" -- of the
# 102 converted workflows, 26 are schedule-triggered and 92 dispatch-triggered
# (26 are both), and neither class would otherwise ever run this guard.
#
# That dispatch figure READ 93 UNTIL 2026-09-26, and the extra one was THIS
# FILE. A raw-text census matches the expression quoted in the comment at the
# top of this header, so the guard counted itself as converted -- a control
# derived from its own subject -- while the schedule figure beside it excluded
# the guard and was right. Re-derived at 5cfe3aaa6 by a PyYAML walk that reads
# each job's `runs-on` VALUE rather than the file's text, with a control
# asserting the two populations differ by exactly this file:
#
#   workflow files scanned                        130
#   raw-text hits (counts this header's comment)  103
#   converted workflows (runs-on VALUE)           102
#     schedule-triggered                           26
#     workflow_dispatch-triggered                  92
#     both                                         26
#     neither                                      10
#
# THIS WORKFLOW PINS `ubuntu-latest` ON PURPOSE. It must not route through the
# variable it exists to check: a malformed value would otherwise take the guard
# down with everything else, which is the failure mode where a control is
# absent exactly when it is needed.
#
# ---------------------------------------------------------------------------
# THE VARIABLE HAS A SCOPE, AND UNTIL 2026-09-26 THIS GUARD READ ONE OF THEM
# ---------------------------------------------------------------------------
# This block used to say the variable "has no scope" — that `vars.CI_RUNNER` is
# "a single repository-wide value with no boundary dimension". That was FALSE,
# and it was false in the reassuring direction. GitHub resolves `vars.*` with
# ENVIRONMENT PRECEDENCE inside a job that declares an `environment:`, and
# converted jobs do. Re-measured 2026-09-26 at efda6b114 by the PyYAML walk
# below (each job's `runs-on` VALUE, never the file's raw text):
#
#   converted jobs (runs-on VALUE)                171
#   ... that declare an `environment:`             19  in 10 files
#         naming a LITERAL environment              5
#         naming an EXPRESSION                     14
#
# The five literals include, verbatim:
#
#   deploy-fiab-gcch.yml  deploy-validate  ->  environment: gcc-high-deploy
#   deploy-fiab-il5.yml   deploy-validate  ->  environment: il5-deploy
#
# So setting CI_RUNNER on the `il5-deploy` environment routed an IL5 deploy into
# the Commercial hub VNet, under the Commercial identity uami-loom-ci, and this
# guard stayed GREEN — no value could turn it red, because the guard's own job
# declares no `environment:` and therefore reads REPOSITORY SCOPE ONLY. An
# independent reviewer on PR #4492 could construct no failing value for that
# case, which is the definition of a control that watches nothing.
#
# It is now checked. scripts/ci/check-ci-runner-scopes.sh enumerates EVERY
# environment from the API and applies the same shape validation to each, plus
# a boundary arm: at environment scope a `self-hosted` value is red outright,
# because every label in .github/actionlint.yaml is Commercial (`loom-aca`, the
# DMLZ fleet in cae-csa-loom-centralus under uami-loom-ci — there is no Gov /
# GCC-High / IL5 fleet), and because 14 of the 19 take their environment from an
# EXPRESSION — `deploy-gov.yml`'s two converted jobs among them — so a Gov
# deploy can land on any environment name a dispatcher types. The script's
# header records why the API read is used rather than declaring the
# environments on this job: `gcc-high-deploy`, `il5-deploy` and `prod` carry
# `required_reviewers`, so a job declaring them QUEUES for approval instead of
# running, and the control would be absent exactly where it is needed.
#
# WHAT IS STILL DECLARED AND NOT FIXED. Repository scope remains boundary-blind
# by construction: one well-formed value still routes every sovereign job onto
# the Commercial fleet, because no value of a single variable can express a
# per-boundary configuration. The guard now makes the ENVIRONMENT-scoped form of
# that misroute loud; the repository-scoped form stays a declared exposure, per
# cloud-parity.md. See the "SOVEREIGN BOUNDARY EXPOSURE" block in
# platform/fiab/bicep/modules/admin-plane/gh-runner-job.bicep.
#
# The sovereign job census quoted in that block and in .github/actionlint.yaml —
# "54 in 36 files" — reproduces at efda6b114 only under the FILE-scope reading
# of its stated method (classify a WORKFLOW as boundary-touching, then count the
# converted jobs in it): 54 jobs in 36 files. Applying the same needles to each
# job's own subtree instead gives 43 jobs in the same 36 files. The file count
# is identical either way; the job count is not, and the figure does not say
# which scope it used. Tracked, not silently re-stated.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Hourly, and it is the only TIME-BOUNDED trigger: the variable is written
    # out of band, so the other three fire only when somebody opens a PR,
    # merges, or dispatches. What that bounds changed on 2026-09-26 — before
    # then this guard read repository scope alone, so for the 19 converted jobs
    # that declare an `environment:` it bounded nothing at all. It now covers
    # repository scope and every environment scope.
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  # TWO JOBS, TWO VERDICTS, DELIBERATELY. The repository-scope check needs no
  # token and works today; the environment-scope audit needs a permission
  # GITHUB_TOKEN does not have (measured — see the script header) and fails
  # closed until CI_RUNNER_AUDIT_TOKEN exists. Folding them into one verdict
  # would either report green over an unread scope or make a working control
  # look broken. Each job's NAME states exactly what its green covers.
  shape-repo:
    # NO `environment:` HERE, DELIBERATELY. Declaring one would make GitHub
    # resolve `vars.CI_RUNNER` at that environment and hide repository scope;
    # it would also subject this guard to that environment's protection rules,
    # and three of the nine carry `required_reviewers`.
    name: CI_RUNNER at REPOSITORY scope is unset or a JSON array naming a real fleet
    runs-on: ubuntu-latest   # NOT vars.CI_RUNNER — see the header.
    timeout-minutes: 5
    steps:
      # Needed for .github/actionlint.yaml (the declared-fleet-label list the
      # narrowing arm checks against) and for the checker script itself.
      # Lifting the list at run time rather than transcribing it means a typo
      # cannot make this guard disagree with the config it is enforcing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # PROVE THE CHECKER CAN FAIL BEFORE TRUSTING ITS VERDICT. 32 arms against
      # a stubbed variables API in a scratch directory — every red value and a
      # neighbouring green one, including the case this guard was rebuilt for
      # (["self-hosted","loom-aca"] on il5-deploy, which no earlier revision
      # could turn red). It runs FIRST so a checker that has silently become
      # unkillable is caught here rather than reported as a clean estate.
      - name: The checker can fail — 32 arms, both directions
        run: bash scripts/ci/check-ci-runner-scopes.selftest.sh
      - name: Validate the variable's shape at repository scope
        env:
          # Read RAW, never through fromJSON — the point is to judge the text
          # before anything parses it into a shape that hides the defect. This
          # job declares no `environment:`, so this IS the repository-scope
          # value.
          CI_RUNNER_REPO_RAW: ${{ vars.CI_RUNNER }}
          AUDIT_SCOPES: repo
        run: bash scripts/ci/check-ci-runner-scopes.sh

  scope-audit:
    # Independent of shape-repo on purpose: this job's red must not suppress
    # that job's verdict, and its green must not be read as covering it.
    name: No environment-scoped CI_RUNNER shadows repository scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Audit every environment scope
        env:
          CI_RUNNER_REPO_RAW: ${{ vars.CI_RUNNER }}
          TARGET_REPO: ${{ github.repository }}
          AUDIT_SCOPES: all
          # CI_RUNNER_AUDIT_TOKEN is a fine-grained PAT carrying the repository
          # "Environments: read" + "Variables: read" permissions. GITHUB_TOKEN
          # is refused 403 on the environment variables endpoint — measured in
          # run 36255512416, all nine environments — and no `permissions:` key
          # reaches it. Until the secret exists this job fails closed, naming
          # the refusal rather than reporting an unread scope as clean
          # (deploy-integrity.md R7).
          GH_TOKEN: ${{ secrets.CI_RUNNER_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/check-ci-runner-scopes.sh
