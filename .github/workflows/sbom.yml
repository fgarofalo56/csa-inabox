name: SBOM

# CSA-0032 — Software Bill of Materials generation.
#
# Emits CycloneDX and SPDX SBOMs on every push to main and on every
# tagged release for:
#   1. The Python source tree (resolved from requirements/locks/*/requirements.txt
#      so the SBOM reflects the exact pinned, hash-verified dependency set that
#      ships in CI and Docker images).
#   2. The two portal container images (backend + frontend), built locally
#      from the Dockerfiles in portal/kubernetes/docker/*/.
#
# #3485 — EVERY PYTHON SBOM THIS JOB EVER PUBLISHED HAD ZERO COMPONENTS. The
# `sbom-python-portal-cyclonedx.json` from run 31789267009 is empty. Syft's
# python cataloger keys on the FILENAME and `requirements/portal.lock` matched
# nothing it looks for, so a document asserting "this software has no
# dependencies" was published as a supply-chain artifact for auditors. The
# comment that used to sit here — "Use `file:` instead so Syft scans the lock
# file as `python-requirements`" — was an unverified claim that did not hold,
# and it survived review precisely because it reads as a reasoned choice.
#
# Fixed by the filename, not by configuration: the locks now live at
# requirements/locks/<extra>/requirements.txt, which Syft recognises by default
# (measured: 0 components before, 13 after, on the same file contents). The
# component floor below is what makes it stay fixed.
#
# SBOMs are:
#   • Uploaded to the workflow run as artifacts (retention: 90 days).
#   • Attached to the GitHub Release when the trigger is a tag push.
#
# See docs/SUPPLY_CHAIN.md for the full pipeline and incident-response
# procedure.

on:
  push:
    branches: [main]
    paths:
      - 'requirements/**'
      - 'pyproject.toml'
      - 'portal/kubernetes/docker/**/Dockerfile'
      - 'scripts/ci/check-lock-scan-coverage.mjs'
      - '.github/workflows/sbom.yml'
  release:
    types: [published]
  workflow_dispatch:

# Cancel superseded runs on the same ref so a fast-follow push replaces
# an in-flight SBOM run instead of racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions — only the Release upload step needs write.
permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # 1. Python source SBOM (CycloneDX + SPDX) for each extra.
  # ───────────────────────────────────────────────────────────────────────
  python-sbom:
    name: Python SBOM (${{ matrix.extra }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `base` is deliberately absent: the bare package declares no runtime
        # dependencies, so its lock has zero pins and a 0-component SBOM for it
        # would be TRUE. Every extra listed here has a non-empty lock, which is
        # what makes the component floor below a real assertion rather than one
        # that has to carve out an exception.
        extra:
          - dev
          - governance
          - functions
          - platform
          - portal
          - bff
          - postgres
          - copilot
          - streaming
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Verify lock file exists
        run: |
          test -f "requirements/locks/${{ matrix.extra }}/requirements.txt" || {
            echo "::error::requirements/locks/${{ matrix.extra }}/requirements.txt is missing. Run scripts/update-locks.sh."
            exit 1
          }

      # The component floor's own control, before any SBOM is judged: a
      # 0-component document must FAIL and a populated one must pass.
      - name: sbom-coverage self-test (the component floor must be able to fail)
        run: node scripts/ci/check-lock-scan-coverage.mjs --selftest

      # Syft recognises `requirements.txt` by default; the `file:` scheme just
      # points it at one. No cataloger configuration — see the header for why
      # that is the whole design.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: requirements/locks/${{ matrix.extra }}/requirements.txt
          format: cyclonedx-json
          artifact-name: sbom-python-${{ matrix.extra }}-cyclonedx.json
          output-file: sbom-python-${{ matrix.extra }}-cyclonedx.json
          upload-artifact: true
          upload-artifact-retention: 90

      # THE COMPONENT FLOOR. A published SBOM with zero components asserts that
      # this software has no dependencies. That is what shipped for months, and
      # this is the single assertion that would have caught it (#3485).
      - name: sbom-coverage (the published SBOM must describe something — #3485)
        run: node scripts/ci/check-lock-scan-coverage.mjs --sbom sbom-python-${{ matrix.extra }}-cyclonedx.json --extra ${{ matrix.extra }}

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: requirements/locks/${{ matrix.extra }}/requirements.txt
          format: spdx-json
          artifact-name: sbom-python-${{ matrix.extra }}-spdx.json
          output-file: sbom-python-${{ matrix.extra }}-spdx.json
          upload-artifact: true
          upload-artifact-retention: 90

      # Attach to the GitHub Release when this run was triggered by one.
      - name: Attach SBOM to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@7b4da11513bf3f43f9999e90eabced41ab8bb048 # v2.2.0
        with:
          files: |
            sbom-python-${{ matrix.extra }}-cyclonedx.json
            sbom-python-${{ matrix.extra }}-spdx.json
          fail_on_unmatched_files: true

  # ───────────────────────────────────────────────────────────────────────
  # 2. Docker image SBOMs for portal backend + frontend.
  #    Images are built locally (no push) and scanned by Syft directly
  #    from the local Docker daemon.
  # ───────────────────────────────────────────────────────────────────────
  docker-sbom:
    name: Docker SBOM (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: portal-backend
            dockerfile: portal/kubernetes/docker/backend/Dockerfile
            context: .
          - component: portal-frontend
            dockerfile: portal/kubernetes/docker/frontend/Dockerfile
            # Same context fix as Trivy: the frontend Dockerfile uses
            # repo-root-relative COPY paths.
            context: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Build to local daemon (no push) so Syft can inspect it.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: csa/${{ matrix.component }}:sbom-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate CycloneDX SBOM for image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: csa/${{ matrix.component }}:sbom-${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-image-${{ matrix.component }}-cyclonedx.json
          output-file: sbom-image-${{ matrix.component }}-cyclonedx.json
          upload-artifact: true
          upload-artifact-retention: 90

      - name: Generate SPDX SBOM for image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: csa/${{ matrix.component }}:sbom-${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-image-${{ matrix.component }}-spdx.json
          output-file: sbom-image-${{ matrix.component }}-spdx.json
          upload-artifact: true
          upload-artifact-retention: 90

      - name: Attach image SBOM to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@7b4da11513bf3f43f9999e90eabced41ab8bb048 # v2.2.0
        with:
          files: |
            sbom-image-${{ matrix.component }}-cyclonedx.json
            sbom-image-${{ matrix.component }}-spdx.json
          fail_on_unmatched_files: true

  # ───────────────────────────────────────────────────────────────────────
  # 3. Summary job — aggregates status so branch protection can require
  #    a single check named "SBOM Summary" instead of one per matrix cell.
  # ───────────────────────────────────────────────────────────────────────
  sbom-summary:
    name: SBOM Summary
    if: always()
    needs: [python-sbom, docker-sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Check matrix outcomes
        run: |
          set -euo pipefail
          # #3368 — this WAS `if [[ "$PY_RESULT" != "success" || ... ]]; then
          # echo "::error::One or more SBOM jobs failed."`. The job is
          # `if: always()`, so a CANCELLED run made `!= "success"` true and the
          # check asserted a job FAILURE that never happened (R7).
          #
          # --require-verdict preserves the fail-closed exit status exactly; it
          # is only the claim that is now true to what was observed.
          node scripts/ci/run-outcome.mjs \
            --require-verdict \
            --what 'SBOM generation' \
            --result '${{ needs.python-sbom.result }}' \
            --result '${{ needs.docker-sbom.result }}'
