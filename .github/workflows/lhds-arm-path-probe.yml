name: lhds ARM path probe

# POSITIVE CONTROL for #5380. MEASURES, gates nothing.
#
# The health control plane (Container App in the hub CAE cae-csa-loom-centralus,
# Commercial) intermittently gets a BARE 403 on
#   GET /subscriptions/<sub>/resourceGroups/rg-csa-loom-health-<stamp>-<region>
#       /providers/Microsoft.Resources/deployments/lhds-stamp-<stamp>
# - no JSON body, no x-ms-correlation-request-id, nothing in the Activity Log.
# This workflow makes the SAME GET repeatedly from the in-VNet `loom-aca` runner
# (the console's VNet-integrated CAE) with two identities, printing identifiers
# only (scripts/measure/health/arm-path-probe.mjs):
#
#   ARM 1 - WITH access: the deploy SP, logged in exactly as the in-VNet
#           `seed-automation-grant` job of csa-loom-post-deploy-bootstrap.yml
#           does for Commercial. EXPECTED 200.
#   ARM 2 - runner MANAGED IDENTITY (`az login --identity`; uami-loom-ci is
#           AcrPull-only). EXPECTED an ARM-shaped JSON 403 with a correlation id.
#
# HOW TO READ THE RESULT
#   * arm 1 = 200 always, arm 2 = JSON 403 + correlation id: the path from this
#     CAE is clean, so the bare 403 is specific to the control plane (its
#     identity / credential resolution / its own CAE), not the network.
#   * arm 1 or arm 2 shows a bare 403 (empty or non-JSON body, no correlation id,
#     especially intermittently flipping with 200): the cause is on the PATH
#     (an intermediary in front of ARM), not the control plane.
#   * arm 1 = JSON 403: the deploy SP lost rights on the stamp RG; a real authz
#     finding, not a path one.
#   * network-error on every attempt: could not measure (the step fails).
# A refusal is a RESULT, not a failure: any HTTP status exits 0.
#
# WHY DISPATCH-ONLY, NO `push:`, NO HOSTED FALLBACK: same reasons as
# loom-aca-runner-capability-probe.yml. This is a measurement OF THAT NETWORK
# POSITION; on ubuntu-latest it would report a different network under this
# name, and a push trigger with the fleet scaled to zero queues for 24h and
# reports CANCELLED. Run it deliberately, fleet up. Commercial only: the
# `loom-aca` fleet exists only in the Commercial DMLZ subscription
# (cloud-parity.md: disclosed gap; the Gov path of #5380 is not covered).
#
# NOTE: login uses the client-secret `creds:` form, copied from the
# seed-automation-grant job. No OIDC is used, so no `id-token` permission is granted.

on:
  workflow_dispatch:
    inputs:
      stamp_id:
        description: Health stamp id (rg-csa-loom-health-<stamp>-<region>, deployment lhds-stamp-<stamp>)
        type: string
        default: dev01
      region:
        description: Region slug in the resource group name
        type: string
        default: centralus
      repeat:
        description: GETs per arm
        type: string
        default: '20'
      interval_s:
        description: Seconds between GETs
        type: string
        default: '6'

permissions:
  contents: read

concurrency:
  group: lhds-arm-path-probe
  cancel-in-progress: false

jobs:
  probe:
    name: ARM GET of the stamp deployment from the in-VNet runner
    runs-on: [self-hosted, loom-aca]
    timeout-minutes: 20
    env:
      STAMP_ID: ${{ inputs.stamp_id }}
      REGION: ${{ inputs.region }}
      REPEAT: ${{ inputs.repeat }}
      INTERVAL_S: ${{ inputs.interval_s }}
      SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '20'

      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$STAMP_ID" =~ ^[a-z0-9]{1,20}$ ]] || { echo "::error::stamp_id must match ^[a-z0-9]{1,20}$"; exit 1; }
          [[ "$REGION" =~ ^[a-z0-9]{1,30}$ ]] || { echo "::error::region must match ^[a-z0-9]{1,30}$"; exit 1; }
          [[ "$REPEAT" =~ ^[0-9]{1,3}$ ]] || { echo "::error::repeat must be 1-3 digits"; exit 1; }
          [[ "$INTERVAL_S" =~ ^[0-9]{1,3}$ ]] || { echo "::error::interval_s must be 1-3 digits"; exit 1; }
          if [ -z "$SUB" ]; then echo "::error::AZURE_SUBSCRIPTION_ID secret is empty"; exit 1; fi

      - name: Azure login (Commercial - limitlessdata_deploy SP)
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ env.SUB }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Locate the stamp resource group (subscription of record)
        run: |
          set -euo pipefail
          RG="rg-csa-loom-health-${STAMP_ID}-${REGION}"
          FOUND=""
          for s in $(az account list --query "[].id" -o tsv | tr -d '\r'); do
            exists="$(az group exists --subscription "$s" -n "$RG" | tr -d '\r')"
            if [ "$exists" = "true" ]; then FOUND="$s"; break; fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::resource group $RG is not visible to the deploy SP in any of its subscriptions"
            exit 1
          fi
          echo "RG=$RG" >> "$GITHUB_ENV"
          echo "PROBE_SUB=$FOUND" >> "$GITHUB_ENV"
          echo "stamp RG $RG found (subscription id withheld from output)"

      - name: 'ARM 1 - WITH access (deploy SP)'
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --resource https://management.azure.com --query accessToken -o tsv | tr -d '\r\n')"
          if [ -z "$TOKEN" ]; then echo "::error::empty access token from the deploy SP login"; exit 1; fi
          echo "::add-mask::$TOKEN"
          {
            echo "## ARM 1 - deploy SP (expected 200)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          ARM_PROBE_TOKEN="$TOKEN" node scripts/measure/health/arm-path-probe.mjs \
            --subscription "$PROBE_SUB" --resource-group "$RG" --deployment "lhds-stamp-${STAMP_ID}" \
            --repeat "$REPEAT" --interval-s "$INTERVAL_S" | tee -a "$GITHUB_STEP_SUMMARY"
          rc="${PIPESTATUS[0]}"
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "probe exit code: $rc (0 = measured, 1 = could not measure)"
          exit "$rc"

      - name: 'ARM 2 - runner managed identity (az login --identity)'
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # A SEPARATE config dir: the SP session from azure/login must stay intact.
          export AZURE_CONFIG_DIR="$RUNNER_TEMP/az-mi"
          mkdir -p "$AZURE_CONFIG_DIR"
          set +e
          az login --identity --allow-no-subscriptions -o none 2> "$RUNNER_TEMP/az-mi.err"
          login_rc=$?
          set -e
          if [ "$login_rc" -ne 0 ]; then
            # Public repo: the raw stderr can carry client/tenant ids, so only a
            # coarse class is printed. The job FAILS: an arm that measured nothing
            # must not read green (deploy-integrity R6/R7). ARM 1's result is
            # already in the summary above.
            cls=other
            if grep -qiE 'no managed identity|identity not found|ManagedIdentityCredential' "$RUNNER_TEMP/az-mi.err"; then cls=no-identity
            elif grep -qiE 'IMDS|169\.254\.169\.254|IDENTITY_ENDPOINT|connection' "$RUNNER_TEMP/az-mi.err"; then cls=endpoint-unreachable
            elif grep -qiE 'multiple|client[_ -]?id' "$RUNNER_TEMP/az-mi.err"; then cls=ambiguous-identity
            fi
            echo "## ARM 2 - runner managed identity: NOT MEASURED (az login --identity rc=$login_rc, class=$cls)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::ARM 2 not measured: managed-identity login failed on this runner (rc=$login_rc, class=$cls)"
            exit 1
          fi
          TOKEN="$(az account get-access-token --resource https://management.azure.com --query accessToken -o tsv | tr -d '\r\n')"
          if [ -z "$TOKEN" ]; then echo "::error::empty access token after a successful identity login"; exit 1; fi
          echo "::add-mask::$TOKEN"
          {
            echo "## ARM 2 - runner managed identity (expected JSON 403 + correlation id)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          ARM_PROBE_TOKEN="$TOKEN" node scripts/measure/health/arm-path-probe.mjs \
            --subscription "$PROBE_SUB" --resource-group "$RG" --deployment "lhds-stamp-${STAMP_ID}" \
            --repeat "$REPEAT" --interval-s "$INTERVAL_S" | tee -a "$GITHUB_STEP_SUMMARY"
          rc="${PIPESTATUS[0]}"
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "probe exit code: $rc (0 = measured, 1 = could not measure)"
          exit "$rc"
