name: gov-gates

# Fast gates-only re-verification (no exercise POST, so it never collides with a
# running gov-exercise). Mints an admin loom_session and GETs /api/admin/gates,
# printing the score + blocked list. Read-only.
#
# ── NOW RUNS AFTER EVERY GOV ROLL (#3730) ──────────────────────────────────
# Commercial's roll lane validates what it shipped in the same run (live-URL
# probe + in-VNet UAT gate). Gov had the verification lanes — this one,
# gov-bff-verify — but nothing connected them to a roll, so they ran only when a
# human remembered: last success 2026-07-30, nineteen days before #3730 was
# filed. A roll nobody checks is how a bad Gov revision sits unnoticed.
#
# `workflow_run` and not a job inside gov-console-roll: this probes the LIVE
# console over the public Front Door endpoint, and it must run AFTER that
# workflow has finished re-locking the ACR and released its firewall lease.
#
# SAFE TO AUTO-TRIGGER because this workflow takes NO inputs. `workflow_dispatch: {}`
# means there is no `default:` to silently become the empty string on a
# non-dispatch trigger — the trap that froze deploy-fiab-commercial's nightly
# reconcile. Everything this lane needs is in `env:` below.
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ['gov-console-roll']
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  RG: rg-csa-loom-admin-usgovvirginia
  APP: loom-console
  BASE: https://loom-console-dcmt6cqoezlgs-agg6h9e5cjamh5h2.z01.azurefd.us

jobs:
  gates:
    name: Gov gates score
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only verify a roll that actually SHIPPED something. A failed roll has
    # already reported itself and either rolled back or left the previous
    # revision serving, so probing here would grade the OLD image and report it
    # under the new commit's run — a receipt attached to the wrong artifact.
    # A dispatch always proceeds: that is the on-demand path.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Azure login (Gov sub) — deploy SP
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment

      - name: Set Azure cloud to Gov
        run: az cloud set --name AzureUSGovernment

      - name: Resolve SESSION_SECRET + admin identity
        run: |
          set -euo pipefail
          J=$(az containerapp secret show -n "$APP" -g "$RG" --secret-name session-secret -o json)
          SS=$(echo "$J" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('value') or '')")
          KVURL=$(echo "$J" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('keyVaultUrl') or '')")
          if [ -z "$SS" ] && [ -n "$KVURL" ]; then SS=$(az keyvault secret show --id "$KVURL" --query value -o tsv | tr -d '\r'); fi
          case "$SS" in https://*) SS=$(az keyvault secret show --id "$SS" --query value -o tsv | tr -d '\r');; esac
          [ -n "$SS" ] || { echo "::error::session-secret unreadable"; exit 1; }
          echo "::add-mask::$SS"; echo "SS=$SS" >> "$GITHUB_ENV"
          E=$(az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].env" -o json)
          AOID=$(echo "$E" | python3 -c "import json,sys;d={x['name']:x.get('value','') for x in json.load(sys.stdin)};print(d.get('LOOM_TENANT_ADMIN_OID',''))")
          AGRP=$(echo "$E" | python3 -c "import json,sys;d={x['name']:x.get('value','') for x in json.load(sys.stdin)};print(d.get('LOOM_TENANT_ADMIN_GROUP_ID',''))")
          # The identity fails closed, symmetric with the secret above (#3804).
          # An unset admin oid used to fall back to the zero GUID. That does NOT
          # escalate — isTenantAdmin's oid arm is `bootstrapOid && oid ===
          # bootstrapOid`, so an unset bootstrapOid matches nothing. It does
          # something quieter: it mints a VALID NON-ADMIN session, every
          # /api/admin/* call 403s, and the score step below hits `!g.ok` and
          # `return`s — exiting 0 with no score printed. A green run that
          # measured nothing.
          [ -n "$AOID" ] || { echo "::error::LOOM_TENANT_ADMIN_OID is empty on $APP, so no admin session can be minted and the gate score would be meaningless. Re-run the gov deploy lane to render the admin binding (auto-bind-by-default.md §5) rather than hand-editing the container app."; exit 1; }
          echo "AOID=$AOID" >> "$GITHUB_ENV"
          echo "AGRP=$AGRP" >> "$GITHUB_ENV"

      - name: GET gates + print score
        run: |
          set -euo pipefail
          node - <<'EOF'
          const crypto=require('node:crypto'), fs=require('node:fs');
          const S=process.env.SS, B=process.env.BASE, GRP=process.env.AGRP||'';
          // Second line of defence behind the resolve-step guard (#3804): never
          // mint on an absent or placeholder oid, whatever put it there.
          // NORMALIZE FIRST (#3805): the RAW-string test missed every padded
          // placeholder, and neither GitHub nor $GITHUB_ENV trims a value. The
          // normalized string is both what is tested and what is sealed.
          const OID=String(process.env.AOID||'').replace(/\r/g,'').trim();
          if(!OID||/^0{8}-0{4}-0{4}-0{4}-0{11}[0-9a-f]$/i.test(OID)){console.log('::error::AOID is absent or a placeholder ('+(OID||'<empty>')+'). Refusing to mint — a placeholder oid yields a non-admin session and a 403 the score step would swallow.');process.exit(1);}
          const K=Buffer.from(crypto.hkdfSync('sha256',Buffer.from(S,'utf-8'),Buffer.alloc(32),Buffer.from('loom-session-v1'),32));
          const claims={oid:OID,name:'gov-gates',email:'gates@automation.inv',upn:'gov-gates@automation'};
          if(GRP) claims.groups=GRP.split(',').map(s=>s.trim()).filter(Boolean);
          const iv=crypto.randomBytes(12), c=crypto.createCipheriv('aes-256-gcm',K,iv);
          const enc=Buffer.concat([c.update(Buffer.from(JSON.stringify({claims,exp:Math.floor(Date.now()/1000)+3600}))),c.final()]);
          const cookie='loom_session='+Buffer.concat([iv,c.getAuthTag(),enc]).toString('base64url');
          (async()=>{
            const r=await fetch(B+'/api/admin/gates',{headers:{cookie}});
            const t=await r.text(); fs.writeFileSync('gates.json',t);
            // Both of these used to `return` — the step then exited 0 having
            // printed no score at all. A gate that cannot fail (#3804).
            let g; try{g=JSON.parse(t);}catch{console.log('::error::/api/admin/gates returned non-JSON (HTTP '+r.status+'): '+t.slice(0,400));process.exit(1);}
            if(!g.ok){console.log('::error::/api/admin/gates not ok (HTTP '+r.status+'): '+t.slice(0,400));process.exit(1);}
            console.log(`GATE SCORE: ${g.configured}/${g.count} configured, ${g.blocked} blocked (cloud=${g.cloud})`);
            const bl=(g.gates||[]).filter(x=>x.status!=='configured');
            for(const sev of ['critical','recommended','optional']){
              const rows=bl.filter(x=>x.severity===sev);
              if(rows.length){console.log(`--- ${sev} (${rows.length}) ---`); for(const x of rows) console.log(`  ${x.id} missing=[${(x.missing||[]).join(', ')}]`);}
            }
          })().catch(e=>{console.log('::error::'+e.message);process.exit(1);});
          EOF

      - name: Upload gates.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gov-gates
          path: gates.json
          if-no-files-found: warn
