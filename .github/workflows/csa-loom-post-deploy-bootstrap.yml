name: csa-loom-post-deploy-bootstrap

# Runs as the limitlessdata_deploy SP (the Synapse + Databricks
# workspace admin) to perform one-time RBAC bootstraps that can't be
# done via bicep:
#   1. Grant Console UAMI Synapse Administrator data-plane role.
#   2. Register Console UAMI as Databricks workspace SP (SCIM).
#   3. Grant Console UAMI APIM Service Contributor (if APIM exists).

on:
  # Reusable form — the deploy workflows (deploy-fiab-commercial.yml + the Gov
  # deploy workflows) call this via `uses: ./.github/workflows/csa-loom-post-deploy-bootstrap.yml`
  # with `secrets: inherit`, so the cloud-agnostic composite steps below are NOT
  # copy-pasted per cloud — the ONE bootstrap runs against any boundary. The
  # `boundary` input selects the login secret set + az cloud (see the login steps).
  workflow_call:
    inputs:
      boundary:
        description: 'Commercial | GCC | GCC-High | IL5. Selects the login secret set + az cloud (GCC-High/IL5 = AzureUSGovernment).'
        type: string
        required: true
      region:
        description: 'Azure region the deploy landed in. REQUIRED — every RG/workspace/UAMI name derives from it.'
        type: string
        required: true
      admin_subscription:
        description: 'Subscription id holding the ADMIN plane (Console UAMI, Key Vault, APIM, Purview, Foundry). Empty → falls back to the boundary subscription secret (AZURE_SUBSCRIPTION_ID / AZURE_GOV_SUBSCRIPTION_ID), because a caller CANNOT pass this through a job output: GitHub scrubs outputs matching a registered secret (#3090).'
        type: string
        required: false
        default: ''
      dlz_subscription:
        description: 'OPTIONAL OVERRIDE. Subscription id holding the Data Landing Zone. Empty (the default) → DISCOVERED from Azure Resource Graph by the "Discover the Data Landing Zone" step, which spans every subscription the deploy identity can read, so a cross-subscription DLZ needs nothing passed. Supply it only to disambiguate an estate with several.'
        type: string
        required: false
        default: ''
      dlz_domain:
        description: 'OPTIONAL OVERRIDE. The <domain> segment of rg-csa-loom-dlz-<domain>-<region>. Empty (the default) → DISCOVERED. It used to default to "single", which is one estate shape out of several and produced a resource group that does not exist on every multi-sub / dlz-attach estate (#3143).'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      boundary:
        description: 'Cloud boundary — selects the login secret set + az cloud. Commercial/GCC use the public AzureCloud; GCC-High/IL5 set AzureUSGovernment (and use the AZURE_GOV_* secret set).'
        type: choice
        default: Commercial
        required: true
        options:
          - Commercial
          - GCC
          - GCC-High
          - IL5
      region:
        description: 'Azure region the deploy landed in (e.g. eastus2, centralus, usgovvirginia). REQUIRED — every RG / workspace / UAMI name below DERIVES from this (rg-csa-loom-admin-<region>, apim-csa-loom-<region>, uami-loom-console-<region>, …). NO default: a public repo must not ship an estate region as a default.'
        type: string
        required: true
      admin_subscription:
        description: 'Subscription id holding the ADMIN plane (hub) — Console UAMI, Key Vault, APIM, Purview, Foundry. REQUIRED — no estate default is shipped.'
        type: string
        required: true
      dlz_subscription:
        description: 'OPTIONAL OVERRIDE. Subscription id holding the Data Landing Zone (Synapse / Databricks / ADLS). Leave EMPTY: it is discovered from Azure Resource Graph, cross-subscription included. Supply it only to pick between several landing zones.'
        type: string
        required: false
      dlz_domain:
        description: 'OPTIONAL OVERRIDE. The <domain> segment of rg-csa-loom-dlz-<domain>-<region>. Leave EMPTY: it is discovered. An override that matches no existing group fails the run rather than rebuilding a name ARM will reject.'
        type: string
        default: ''
        required: false

# NOTE: no id-token permission — every login step uses secret-based
# azure/login `creds:` (no OIDC). Declaring an unused `id-token: write` here
# broke every CALLER whose own permissions block doesn't grant it: GitHub
# refuses the workflow_call at STARTUP ("requesting 'id-token: write', but is
# only allowed 'id-token: none'") — seen live when the in-product Update
# button dispatched full-app-deploy-commercial at csa-inabox-v0.71.0
# (run 29466697351).
permissions:
  contents: read

env:
  # Cloud boundary — selects the login secret set + az cloud in the login steps.
  BOUNDARY: ${{ inputs.boundary }}
  # Region drives every region-stamped name below. REQUIRED (validated in the
  # first step) — no estate region default ships in a public repo.
  REGION: ${{ inputs.region }}
  # ADMIN (hub) sub holds the Console UAMI / KV / APIM / Purview / Foundry.
  ADMIN_SUB: ${{ inputs.admin_subscription || (inputs.boundary == 'Commercial' && secrets.AZURE_SUBSCRIPTION_ID || secrets.AZURE_GOV_SUBSCRIPTION_ID) }}
  # ── DLZ COORDINATES ARE DISCOVERED, NOT ASSUMED (#3143) ────────────────────
  # DLZ_SUB / DLZ_RG / DLZ_DOMAIN / SYNAPSE_WS / DBX_WS below are PRE-DISCOVERY
  # PLACEHOLDERS. The "Discover the Data Landing Zone" step (before any consumer)
  # reads Azure Resource Graph across every subscription this identity can see
  # and OVERWRITES all five in $GITHUB_ENV; if it cannot resolve exactly one, it
  # fails the job rather than letting a guessed name reach ARM.
  #
  # They used to be the whole answer, and the answer was wrong on every estate
  # that is not single-sub: `dlz_domain` defaulted to `single`, so a multi-sub /
  # dlz-attach estate got `rg-csa-loom-dlz-single-<region>`, which does not
  # exist. Measured on the live Commercial estate (run 31243230253): 25 of 27
  # jobs green, then `(ResourceGroupNotFound) Resource group
  # 'rg-csa-loom-dlz-single-centralus' could not be found` — the real group is
  # `rg-csa-loom-dlz-default-centralus`, in a DIFFERENT subscription. So the
  # deploy's day-one wiring never ran as part of the deploy on that shape.
  #
  # DLZ_SUB keeps the admin-sub fallback because the `if: always()` cleanup steps
  # reference it; on the success path discovery has already replaced it.
  DLZ_SUB: ${{ inputs.dlz_subscription || inputs.admin_subscription || (inputs.boundary == 'Commercial' && secrets.AZURE_SUBSCRIPTION_ID || secrets.AZURE_GOV_SUBSCRIPTION_ID) }}
  # SUB kept as an alias of the ADMIN sub for the many steps that scope grants /
  # role assignments to the admin plane (Cost/Security/Monitor, APIM, Reader, …).
  # The "Resolve deploy coordinates" step re-points SUB to the admin sub at runtime.
  SUB: ${{ inputs.admin_subscription || (inputs.boundary == 'Commercial' && secrets.AZURE_SUBSCRIPTION_ID || secrets.AZURE_GOV_SUBSCRIPTION_ID) }}
  ADMIN_RG: rg-csa-loom-admin-${{ inputs.region }}
  # EMPTY unless an operator pinned dlz_domain explicitly. Empty is honest: an
  # unresolved group name is better than a plausible one that does not exist,
  # and every consumer runs after discovery has set the real value.
  DLZ_RG: ${{ inputs.dlz_domain && format('rg-csa-loom-dlz-{0}-{1}', inputs.dlz_domain, inputs.region) || '' }}
  DLZ_DOMAIN: ${{ inputs.dlz_domain }}
  # The Loom naming convention, kept ONLY as the pre-discovery placeholder. Note
  # that the RG's domain segment and the workspaces' are NOT the same string:
  # main.bicep's single-sub branch stamps `domainName: 'default'` into
  # `rg-csa-loom-dlz-single-<loc>`. Discovery reads both from the estate.
  SYNAPSE_WS: syn-loom-default-${{ inputs.region }}
  DBX_WS: adb-loom-default-${{ inputs.region }}
  APIM_NAME: apim-csa-loom-${{ inputs.region }}
  # DBX_HOST is deploy-specific (per-workspace adb-<id>.<n>.azuredatabricks.net) and
  # CANNOT be derived from region — the "Resolve deploy coordinates" step resolves it
  # at runtime from the workspace's workspaceUrl. EMPTY by default (no estate host
  # shipped in a public repo); the Databricks steps skip cleanly when it stays empty
  # (no workspace bound in this deploy).
  DBX_HOST: ''
  # Console UAMI principal (object) id + client (app) id. De-hardcoded so a
  # non-eastus2 / non-Commercial / different-tenant deploy grants the RIGHT
  # identity. Precedence: repo var (explicit BYO) → RUNTIME RESOLUTION (the
  # "Resolve deploy coordinates" step queries `az identity show -n
  # uami-loom-console-<region> -g rg-csa-loom-admin-<region>` and overrides these
  # in $GITHUB_ENV). Empty by default (no estate principal). Every grant step
  # references these, so the runtime resolution re-targets the whole bootstrap.
  CONSOLE_UAMI_PRINCIPAL: ${{ vars.LOOM_CONSOLE_UAMI_PRINCIPAL || '' }}
  CONSOLE_UAMI_CLIENT: ${{ vars.LOOM_CONSOLE_UAMI_CLIENT || '' }}
  # Console UAMI display NAME used for the Synapse SQL CREATE LOGIN/USER FROM
  # EXTERNAL PROVIDER steps. identity.bicep names it uami-loom-console-<region>,
  # so this DERIVES from the region input; the "Resolve Console UAMI SQL name"
  # step below OVERRIDES it with the actual UAMI discovered in the admin RG so it
  # is correct even for a renamed identity. Override via repo var
  # LOOM_CONSOLE_UAMI_NAME to pin it explicitly.
  CONSOLE_SQL_UAMI: ${{ vars.LOOM_CONSOLE_UAMI_NAME || format('uami-loom-console-{0}', inputs.region) }}
  # Weave (Semantic Ontology) graph store — the Console UAMI's Entra principal
  # NAME registered in PostgreSQL (must match LOOM_POSTGRES_AAD_USER on the
  # Console, default loom-console). The PG server name is resolved at runtime.
  CONSOLE_UAMI_NAME: loom-console
  # MSAL Web App client (app) id. NO hardcoded shared app reg — the
  # "Provision MSAL app registration" step below creates/reconciles a
  # per-deployment app registration. For a Gov boundary a pre-created Gov MSAL
  # app can be supplied via the LOOM_GOV_MSAL_CLIENT_ID secret; else set the repo
  # var to BYO, or the step self-provisions one.
  LOOM_MSAL_CLIENT_ID: ${{ vars.LOOM_MSAL_CLIENT_ID || ((inputs.boundary == 'GCC-High' || inputs.boundary == 'IL5') && secrets.LOOM_GOV_MSAL_CLIENT_ID) || '' }}
  # Console host(s) (no scheme) whose https://<host>/auth/callback redirect URIs
  # are reconciled onto the app registration. Defaults to the vanity domain.
  CSA_LOOM_CONSOLE_HOSTS: ${{ vars.CSA_LOOM_VANITY_DOMAIN || '' }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate required inputs (no estate defaults)
        # Hard gate — NOT masked. Enforces the rel-T34 required-ness for BOTH the
        # manual dispatch AND workflow_call callers: region + admin_subscription
        # MUST be supplied (a public repo ships no estate region/sub as a default).
        #
        # #3090 — VALIDATE THE RESOLVED VALUE, NOT THE RAW INPUT. This checked
        # `inputs.admin_subscription` and failed every chained call from
        # full-app-deploy-commercial.yml with "'admin_subscription' is REQUIRED",
        # because the CALLER routed the subscription through a job output whose
        # value equals the AZURE_SUBSCRIPTION_ID secret — and GitHub scrubs those
        # in transit ("Skip output 'admin_sub' since it may contain secret"). The
        # input really was empty; the caller really did read it correctly. Both
        # sides were right and the value still did not arrive.
        #
        # The workflow-level env above now falls back to the boundary's
        # subscription secret (available here via `secrets: inherit`), so this
        # gate asserts on $ADMIN_SUB — what the run will actually USE. That keeps
        # the rel-T34 promise ("no estate default ships in a public repo": the
        # fallback is an operator-supplied secret, not a literal) while removing
        # a failure mode neither caller nor callee could see.
        run: |
          set -e
          FAIL=0
          if [ -z "${{ inputs.region }}" ]; then echo "::error::'region' is REQUIRED (no estate default)."; FAIL=1; fi
          if [ -z "${ADMIN_SUB}" ]; then
            echo "::error::No admin subscription is available: the 'admin_subscription' input is empty AND no subscription secret is configured for boundary '${{ inputs.boundary }}' (Commercial → AZURE_SUBSCRIPTION_ID, Gov → AZURE_GOV_SUBSCRIPTION_ID). Supply the input or configure the secret."
            FAIL=1
          fi
          case "${{ inputs.boundary }}" in
            Commercial|GCC|GCC-High|IL5) : ;;
            *) echo "::error::'boundary' must be one of Commercial | GCC | GCC-High | IL5 (got '${{ inputs.boundary }}')."; FAIL=1 ;;
          esac
          [ "$FAIL" = "0" ] || exit 1
          if [ -z "${{ inputs.admin_subscription }}" ]; then
            echo "::notice::admin_subscription input was empty (GitHub scrubs a job output that matches a registered secret) — using the boundary's subscription secret instead."
          fi
          echo "boundary=${{ inputs.boundary }} region=${{ inputs.region }} admin_sub set; dlz coordinates are DISCOVERED (overrides supplied: dlz_subscription=${{ inputs.dlz_subscription && 'yes' || 'no' }} dlz_domain='${{ inputs.dlz_domain }}')"

      - name: Azure login (Commercial — limitlessdata_deploy SP)
        if: inputs.boundary == 'Commercial'
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ env.SUB }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Azure login (GCC — Azure public cloud, GCC identity)
        if: inputs.boundary == 'GCC'
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GCC_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GCC_CLIENT_SECRET }}",
              "subscriptionId": "${{ env.SUB }}",
              "tenantId": "${{ secrets.AZURE_GCC_TENANT_ID }}"
            }

      - name: Azure login (Gov — GCC-High / IL5, AzureUSGovernment)
        if: inputs.boundary == 'GCC-High' || inputs.boundary == 'IL5'
        uses: azure/login@v2
        with:
          environment: AzureUSGovernment
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "subscriptionId": "${{ env.SUB }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }

      - name: Set Azure cloud to Gov (GCC-High / IL5)
        if: inputs.boundary == 'GCC-High' || inputs.boundary == 'IL5'
        run: az cloud set --name AzureUSGovernment

      - name: Verify SP identity
        run: |
          set -e
          echo "Boundary: ${{ inputs.boundary }}  cloud: $(az cloud show --query name -o tsv 2>/dev/null || echo AzureCloud)"
          az account show --query "{user:user.name, sub:id}" -o table
          echo "Acting as Synapse initial admin"

      # Discovery needs Azure Resource Graph. Install the extension UP FRONT and
      # FAIL CLOSED: `az graph query` would otherwise dynamic-install on first
      # use and write a banner to stderr, and this repo has already shipped one
      # probe that read that banner as its answer (deploy-fiab-gcch, 2026-08-08).
      # No `|| true` — an install that did not happen must not look like one that did.
      - name: Pre-install the resource-graph CLI extension
        run: |
          set -e
          az extension add --name resource-graph --upgrade --only-show-errors -o none
          echo "resource-graph version: $(az extension show --name resource-graph --query version -o tsv | tr -d '\r')"

      - name: Discover the Data Landing Zone (subscription + domain + workspaces)
        # deploy-integrity.md R5 (DISCOVER, never assume) + auto-bind-by-default.md
        # §5 (a value the platform can determine must not be asked for).
        #
        # Reads Resource Graph across EVERY subscription this identity can see —
        # which is what makes a cross-subscription landing zone visible at all,
        # since the login above targets the ADMIN subscription — and writes
        # DLZ_SUB / DLZ_RG / DLZ_DOMAIN / SYNAPSE_WS / DBX_WS into $GITHUB_ENV for
        # every step below. `dlz_subscription` / `dlz_domain` are passed through
        # only when an operator supplied them, and they NARROW the discovered set
        # rather than bypassing it: an override naming a group that does not exist
        # now fails here instead of reaching ARM as `(ResourceGroupNotFound)`.
        #
        # Fails closed on zero candidates, on more than one, and on an unreadable
        # estate — three distinct exit codes and three distinct messages, because
        # "I could not determine" is not "it is not there".
        #
        # Subscription ids reach $GITHUB_ENV (a file), never the log.
        # Decision logic is mutation-proved in
        # scripts/csa-loom/__tests__/resolve-dlz-coordinates.test.mjs.
        env:
          INPUT_DLZ_SUBSCRIPTION: ${{ inputs.dlz_subscription }}
          INPUT_DLZ_DOMAIN: ${{ inputs.dlz_domain }}
        run: |
          set -euo pipefail
          node scripts/csa-loom/resolve-dlz-coordinates.mjs \
            --region "$REGION" \
            --admin-subscription "$ADMIN_SUB" \
            ${INPUT_DLZ_SUBSCRIPTION:+--dlz-subscription "$INPUT_DLZ_SUBSCRIPTION"} \
            ${INPUT_DLZ_DOMAIN:+--dlz-domain "$INPUT_DLZ_DOMAIN"} \
            --github-env "$GITHUB_ENV"
          # MASK THE DISCOVERED SUBSCRIPTION ID. It used to arrive from the
          # AZURE_SUBSCRIPTION_ID secret and GitHub masked it automatically
          # (`dlz_sub=***` in every log). A discovered value is not a registered
          # secret, so without this the existing `echo …$DLZ_SUB…` further down
          # would start printing it in clear — a log-hygiene regression caused by
          # the fix, not by the bug.
          DISCOVERED_SUB="$(grep '^DLZ_SUB=' "$GITHUB_ENV" | tail -1 | cut -d= -f2-)"
          if [ -n "$DISCOVERED_SUB" ]; then echo "::add-mask::$DISCOVERED_SUB"; fi

      - name: Resolve deploy coordinates (region-correct Console UAMI principal/client + Databricks host)
        # Region-parameterize the OLD eastus2 hardcodes. The env: block derives every
        # RG / workspace name from the `region` input; this step resolves the values
        # that can ONLY be known at runtime against the live admin sub:
        #   - Console UAMI principalId + clientId (az identity show on uami-loom-console-<region>)
        #   - the actual UAMI display NAME (for the SQL CREATE LOGIN steps)
        #   - the Databricks workspace host (per-workspace adb-<id>.<n>.azuredatabricks.net)
        # Repo vars LOOM_CONSOLE_UAMI_PRINCIPAL / _CLIENT / _NAME still WIN (explicit
        # BYO override); otherwise these overwrite the eastus2 defaults in $GITHUB_ENV
        # so every downstream grant targets the identity this deploy actually created.
        run: |
          set -uo pipefail
          echo "region=$REGION  admin_rg=$ADMIN_RG  dlz_rg=$DLZ_RG  dlz_domain=$DLZ_DOMAIN  synapse=$SYNAPSE_WS  databricks=$DBX_WS"
          # --- Console UAMI (admin sub) ---
          az account set --subscription "$ADMIN_SUB" 2>/dev/null || true
          UAMI_NAME="uami-loom-console-$REGION"
          # Discover the real UAMI in the admin RG (tolerates a renamed identity).
          DISCOVERED_NAME=$(az identity list -g "$ADMIN_RG" \
            --query "[?contains(name,'console')].name | [0]" -o tsv 2>/dev/null || true)
          [ -n "${DISCOVERED_NAME:-}" ] && [ "$DISCOVERED_NAME" != "None" ] && UAMI_NAME="$DISCOVERED_NAME"
          UAMI_JSON=$(az identity show -n "$UAMI_NAME" -g "$ADMIN_RG" 2>/dev/null || true)
          if [ -n "${UAMI_JSON:-}" ]; then
            RES_PRINCIPAL=$(echo "$UAMI_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('principalId',''))" 2>/dev/null || true)
            RES_CLIENT=$(echo "$UAMI_JSON"   | python3 -c "import sys,json;print(json.load(sys.stdin).get('clientId',''))"   2>/dev/null || true)
          fi
          # Repo-var override wins; else runtime-resolved; else keep the env default.
          if [ -n "${{ vars.LOOM_CONSOLE_UAMI_PRINCIPAL }}" ]; then
            echo "Using repo var LOOM_CONSOLE_UAMI_PRINCIPAL (override)"
          elif [ -n "${RES_PRINCIPAL:-}" ]; then
            echo "CONSOLE_UAMI_PRINCIPAL=$RES_PRINCIPAL" >> "$GITHUB_ENV"
            echo "Resolved Console UAMI principalId: $RES_PRINCIPAL ($UAMI_NAME)"
          else
            echo "::warning::Could not resolve Console UAMI in $ADMIN_RG — keeping default CONSOLE_UAMI_PRINCIPAL. Set LOOM_CONSOLE_UAMI_PRINCIPAL or check region/admin_subscription."
          fi
          if [ -n "${{ vars.LOOM_CONSOLE_UAMI_CLIENT }}" ]; then
            echo "Using repo var LOOM_CONSOLE_UAMI_CLIENT (override)"
          elif [ -n "${RES_CLIENT:-}" ]; then
            echo "CONSOLE_UAMI_CLIENT=$RES_CLIENT" >> "$GITHUB_ENV"
            echo "Resolved Console UAMI clientId: $RES_CLIENT"
          fi
          # Display NAME for the SQL CREATE LOGIN steps (repo var still wins).
          if [ -z "${{ vars.LOOM_CONSOLE_UAMI_NAME }}" ]; then
            echo "CONSOLE_SQL_UAMI=$UAMI_NAME" >> "$GITHUB_ENV"
            echo "Resolved Console UAMI SQL name: $UAMI_NAME"
          fi
          # --- Databricks host (dlz sub) ---
          az account set --subscription "$DLZ_SUB" 2>/dev/null || true
          DBX_URL=$(az databricks workspace show -g "$DLZ_RG" -n "$DBX_WS" --query workspaceUrl -o tsv 2>/dev/null \
                    || az databricks workspace show -g "$ADMIN_RG" -n "$DBX_WS" --query workspaceUrl -o tsv 2>/dev/null || true)
          if [ -n "${DBX_URL:-}" ] && [ "$DBX_URL" != "None" ]; then
            echo "DBX_HOST=$DBX_URL" >> "$GITHUB_ENV"
            echo "Resolved Databricks host: $DBX_URL"
          else
            echo "::notice::Could not resolve Databricks workspaceUrl for $DBX_WS — keeping default DBX_HOST (SCIM step is best-effort)."
          fi
          # Restore the admin sub as the active context for the grant steps.
          az account set --subscription "$SUB" 2>/dev/null || true

      - name: Provision MSAL app registration (sign-in app + redirect URIs + secret in KV)
        # Day-one deploy-readiness (GH #1383): create/reconcile the per-deployment
        # Entra app registration, write the client secret + a stable SESSION_SECRET
        # to Key Vault, and wire LOOM_MSAL_CLIENT_ID + secretRefs onto the Console
        # Container App — so interactive login works on first sign-in. Idempotent;
        # safe to re-run. Best-effort (|| true) so a Graph-consent gap doesn't fail
        # the whole bootstrap. Requires the deploy SP to hold the Graph Application
        # Administrator directory role + KV Secrets Officer.
        run: |
          set -uo pipefail
          # Resolve the Loom Key Vault in the admin RG (kv-loom-*).
          KV_NAME=$(az keyvault list -g "$ADMIN_RG" --query "[?starts_with(name,'kv-loom')].name | [0]" -o tsv 2>/dev/null || true)
          if [ -z "${KV_NAME:-}" ]; then
            KV_NAME=$(az keyvault list -g "$ADMIN_RG" --query "[0].name" -o tsv 2>/dev/null || true)
          fi
          if [ -z "${KV_NAME:-}" ]; then
            echo "::warning::No Key Vault found in $ADMIN_RG — skipping MSAL app-reg provisioning"
            exit 0
          fi
          # REACHABILITY: the Loom Key Vault is deployed with
          # publicNetworkAccess=Disabled (private), so the `az keyvault secret set`
          # calls the script makes (loom-msal-client-secret + session-secret) are
          # NOT reachable from this public ubuntu-latest runner and would fail
          # silently, leaving login broken AFTER a "successful" deploy. So: punch
          # a SINGLE-IP firewall allow scoped to THIS runner's egress IP for the
          # write window (default-action stays Deny — do NOT open the vault to the
          # whole internet), and restore it via a trap so it runs even on failure.
          #
          # #2855: the open/close pair used to be inline `az` here, and the close
          # ended in `-o none || true` with NO read-back — so an ARM error left the
          # secret vault PUBLIC and this step still went green. Both halves now go
          # through scripts/csa-loom/kv-firewall-window.sh, whose `close` RE-READS
          # publicNetworkAccess + defaultAction + the ipRules count and returns
          # non-zero unless all three verify. SOFT_FAIL keeps a transient miss here
          # from aborting the rest of bootstrap; the authoritative, job-failing
          # verdict is the always() "Restore Loom Key Vault private (verified)"
          # step at the end of this job.
          KV_ORIG_PNA="$(az keyvault show -n "$KV_NAME" --query "properties.publicNetworkAccess" -o tsv 2>/dev/null || echo Enabled)"
          echo "Key Vault $KV_NAME publicNetworkAccess=$KV_ORIG_PNA"
          restore_kv_pna() {
            if [ -n "${KV_NAME:-}" ] && [ "${KV_ORIG_PNA:-Enabled}" != "Enabled" ]; then
              LOOM_KV_WINDOW_SOFT_FAIL=1 bash scripts/csa-loom/kv-firewall-window.sh close --vault "$KV_NAME" || true
            fi
          }
          trap restore_kv_pna EXIT
          if [ "$KV_ORIG_PNA" != "Enabled" ]; then
            echo "-> temporarily enabling Key Vault public access (scoped to runner IP) for the secret-write window"
            bash scripts/csa-loom/kv-firewall-window.sh open --vault "$KV_NAME" \
              || echo "::warning::Could not open the Key Vault write window — secret writes may be unreachable from the runner."
          fi
          # Resolve the Console Container App's runtime FQDN to add to redirect URIs.
          CONSOLE_FQDN=$(az containerapp show -n loom-console -g "$ADMIN_RG" --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
          HOSTS="${CSA_LOOM_CONSOLE_HOSTS:-}"
          if [ -n "${CONSOLE_FQDN:-}" ]; then
            HOSTS="${HOSTS:+$HOSTS,}$CONSOLE_FQDN"
          fi
          # INCIDENT 2026-06-17: real users reach the console through Azure Front
          # Door, NOT the direct ACA ingress FQDN above — so the browser sends the
          # Front Door host as redirect_uri. Registering only the ACA host caused
          # AADSTS50011 redirect-URI mismatch at login. Discover the Front Door
          # endpoint hostname(s) generically (no hardcoded estate FD host) across
          # every AFD profile in the admin RG and append each to HOSTS so the
          # callback is registered for the real user-facing host(s). Best-effort:
          # a missing AFD must not fail the step.
          for AFD_PROFILE in $(az afd profile list -g "$ADMIN_RG" --query "[].name" -o tsv 2>/dev/null || true); do
            for FD_HOST in $(az afd endpoint list --profile-name "$AFD_PROFILE" -g "$ADMIN_RG" --query "[].hostName" -o tsv 2>/dev/null || true); do
              [ -n "$FD_HOST" ] && HOSTS="${HOSTS:+$HOSTS,}$FD_HOST"
            done
          done
          UAMI_ID=$(az identity list -g "$ADMIN_RG" --query "[?contains(name,'console')].id | [0]" -o tsv 2>/dev/null || true)
          chmod +x scripts/csa-loom/bootstrap-msal-app-reg.sh
          # NOT best-effort any more (#3176). This step OWNS interactive sign-in:
          # if it does not put a VALIDATED client secret into Key Vault, every
          # sign-in fails AADSTS7000215. It used to end in
          #   || echo "::warning::MSAL app-reg provisioning incomplete …"
          # so a total failure produced a warning and a GREEN bootstrap. That is
          # exactly how the live Commercial estate ended up with an app
          # registration holding ZERO credentials while the Console served a
          # stale Key Vault value — for weeks, with every deploy reporting
          # success (deploy-integrity R1/R6: never report success on an
          # unverified outcome).
          #
          # The script now writes to Key Vault through the ARM control plane, so
          # it no longer depends on the firewall window above — which CANNOT be
          # opened where Azure Policy KeyVault_PublicNetwork_Modify is assigned
          # (it silently reverts publicNetworkAccess, so the open "succeeds" and
          # changes nothing). The window is left in place only for other steps
          # in this job that still use the data plane.
          if ! OUT=$(KEYVAULT_NAME="$KV_NAME" \
            CONSOLE_HOSTS="$HOSTS" \
            EXISTING_CLIENT_ID="${LOOM_MSAL_CLIENT_ID:-}" \
            CONSOLE_APP_NAME=loom-console CONSOLE_RG="$ADMIN_RG" \
            UAMI_RESOURCE_ID="${UAMI_ID:-}" \
            bash scripts/csa-loom/bootstrap-msal-app-reg.sh 2>&1); then
            echo "$OUT"
            echo "::error::MSAL app-reg provisioning FAILED. Interactive sign-in will not work on this estate: the Console resolves LOOM_MSAL_CLIENT_SECRET from the Key Vault secret this step writes, so a failure here leaves it stale (or absent) and every sign-in returns AADSTS7000215. The script fails closed — it does NOT write an unvalidated secret — so the PREVIOUS secret is still authoritative and a currently-working sign-in is not broken by this failure. Read the output above for the specific cause (Graph Application Administrator role, or control-plane Microsoft.KeyVault/vaults/secrets/write on $KV_NAME)."
            exit 1
          fi
          echo "$OUT"
          # Export the resolved app id for the Dataverse AppUser step below.
          APP_ID=$(echo "$OUT" | sed -n 's/^LOOM_MSAL_CLIENT_ID=//p' | tail -1)
          if [ -n "${APP_ID:-}" ]; then
            echo "LOOM_MSAL_CLIENT_ID=$APP_ID" >> "$GITHUB_ENV"
          fi

      - name: Unseal Loom Unity + wire the Console (LU / #2681)
        # THE FIRST-DEPLOY HALF of #2681. admin-plane/main.bicep now deploys
        # loom-unity DEFAULT-ON with authMode=entra, and passes the Console's MSAL
        # app registration as the catalog's entraClientId. On a genuinely fresh
        # estate that registration does not exist yet at ARM time (it is a
        # Microsoft Graph object; the step above creates it), so the module has no
        # audience to pin and deploys SEALED BY DESIGN — minReplicas 0, an
        # unroutable `api://loom-unity-sealed-*.invalid` audience, every caller
        # refused. That is the correct fail-closed posture (#2643 was the
        # alternative: an anonymous catalog anything on the CAE VNet could mutate)
        # but it is not a working catalog, and leaving it there would be exactly
        # the "value the deploy could have set" that auto-bind-by-default forbids.
        #
        # This step closes the loop the moment the registration exists.
        #
        # ENV UPDATE, NOT A MODULE REDEPLOY — deliberately. Re-running
        # compute/loom-unity-app.bicep out-of-band with a partial param set would
        # take unityPostgresFqdn='' + dbEphemeral=false, i.e. useAzureFiles=true,
        # and SILENTLY MIGRATE the catalog off its Postgres metastore onto an
        # Azure Files H2 file DB — which on Azure Government blocks container
        # start outright (CIFS mount, CrashLoopBackOff). Setting the three auth
        # values and the replica floor touches persistence not at all.
        #
        # LOOM_UNITY_CONSOLE_PRINCIPAL_ID is already on the app (the orchestrator
        # passes consolePrincipalId unconditionally), so the #2974 SCIM auto-bind
        # runs on the revision this step creates and the enforcing catalog is also
        # a usable one.
        #
        # Best-effort like every bootstrap step: a miss leaves the catalog SEALED
        # (safe) and the svc-loom-unity-authz gate honest, and never fails the
        # deploy.
        continue-on-error: true
        run: |
          set -uo pipefail
          CID="${LOOM_MSAL_CLIENT_ID:-}"
          # Belt and braces: the step above writes the freshly-created app id to
          # $GITHUB_ENV, but LOOM_MSAL_CLIENT_ID is ALSO a workflow-level `env:`
          # and the precedence between the two is not worth betting a federal
          # catalog on. Fall back to the estate's own record (Key Vault → live
          # Console app), which is the authority either way.
          if [ -z "$CID" ]; then
            # resolve-msal-client-id.sh logs to stderr and prints ONLY the id on
            # stdout, so its diagnostics stay visible in the job log — no 2>/dev/null.
            CID="$(bash scripts/csa-loom/resolve-msal-client-id.sh --rg "$ADMIN_RG" || true)"
            CID="$(printf '%s' "$CID" | tr -d '\r')"
          fi
          # NO `2>/dev/null` ON ANY QUERY BELOW, deliberately. The dominant defect
          # class in this repo's automation is UNKNOWN reported as a NEGATIVE: an
          # `az ... 2>/dev/null` that fails on rights or a bad subscription
          # returns an empty string, and the script then reports "not deployed —
          # nothing to do" for a catalog that is deployed and sealed. Each read
          # below captures its exit status separately so a FAILED query is a
          # warning, never a silent pass.
          UNITY=""
          if UNITY_RAW=$(az containerapp list -g "$ADMIN_RG" --subscription "$ADMIN_SUB" \
                --query "[?name=='loom-unity'].name | [0]" -o tsv); then
            UNITY=$(printf '%s' "$UNITY_RAW" | tr -d '\r')
          else
            echo "::warning::Could not enumerate Container Apps in $ADMIN_RG — cannot tell whether loom-unity is deployed. NOT treating that as absent. Check the deploy identity's rights on $ADMIN_RG and re-run."
            exit 0
          fi
          if [ -z "$UNITY" ]; then
            echo "::notice::loom-unity is not deployed in $ADMIN_RG (loomBackends.unity='disabled', or deployAppsEnabled=false) — nothing to unseal."
            exit 0
          fi
          if [ -z "$CID" ]; then
            echo "::warning::loom-unity is deployed but no MSAL client id resolved, so the catalog stays SEALED (up, refusing every caller). Re-run this workflow once bootstrap-msal-app-reg.sh has created the registration."
            exit 0
          fi
          CURRENT=$(az containerapp show -n loom-unity -g "$ADMIN_RG" --subscription "$ADMIN_SUB" \
            --query "properties.template.containers[0].env[?name=='LOOM_UNITY_ENTRA_CLIENT_ID'].value | [0]" -o tsv \
            | tr -d '\r') || CURRENT="__query_failed__"
          if [ "$CURRENT" = "$CID" ]; then
            echo "  loom-unity already pins this audience — no change."
          else
            echo "Unsealing loom-unity onto audience api://$CID …"
            az containerapp update -n loom-unity -g "$ADMIN_RG" --subscription "$ADMIN_SUB" \
              --min-replicas 1 \
              --set-env-vars \
                "LOOM_UNITY_AUTH=enable" \
                "LOOM_UNITY_ENTRA_CLIENT_ID=$CID" \
                "LOOM_UNITY_AUDIENCES=api://$CID,$CID" \
              -o none \
              && echo "  loom-unity unsealed (authorization ENFORCED against the Console registration)." \
              || echo "::warning::Could not update loom-unity — the catalog stays SEALED. Check the deploy identity's rights on $ADMIN_RG."
            for i in $(seq 1 20); do
              REV=$(az containerapp show -n loom-unity -g "$ADMIN_RG" --subscription "$ADMIN_SUB" --query properties.latestRevisionName -o tsv | tr -d '\r') || REV=""
              [ -n "$REV" ] || { echo "  (could not read the latest revision name — retrying)"; sleep 15; continue; }
              H=$(az containerapp revision show -n loom-unity -g "$ADMIN_RG" --subscription "$ADMIN_SUB" --revision "$REV" --query properties.healthState -o tsv | tr -d '\r') || H="?"
              echo "  loom-unity health=$H"
              [ "$H" = "Healthy" ] && break
              sleep 15
            done
          fi
          # CONSOLE HALF. The orchestrator emits LOOM_UNITY_URL unconditionally but
          # emits the client id / audience only when it had one at ARM time, so on
          # a first deploy those two are empty strings on the Console. Fill them —
          # `has()` in the env-checks treats an empty value as absent, so until
          # this runs the svc-loom-unity-authz gate correctly reports the estate as
          # unconfigured rather than pretending otherwise.
          CAE_DOMAIN=$(az containerapp env list -g "$ADMIN_RG" --subscription "$ADMIN_SUB" --query "[0].properties.defaultDomain" -o tsv | tr -d '\r') || CAE_DOMAIN=""
          if [ -n "$CAE_DOMAIN" ]; then
            az containerapp update -g "$ADMIN_RG" -n loom-console --subscription "$ADMIN_SUB" \
              --set-env-vars \
                "LOOM_UNITY_URL=https://loom-unity.internal.$CAE_DOMAIN" \
                "LOOM_UNITY_CLIENT_ID=$CID" \
                "LOOM_UNITY_AUDIENCE=api://$CID/.default" \
                "LOOM_UNITY_AUTH_MODE=entra" \
              -o none \
              && echo "  Wired LOOM_UNITY_* on loom-console (entra)." \
              || echo "::warning::Could not set the LOOM_UNITY_* vars on loom-console — set them manually."
          else
            echo "::warning::Could not resolve the Container Apps environment default domain — LOOM_UNITY_URL not wired."
          fi

      - name: Reindex loom-docs on the freshly-rolled console (Copilot index freshness — #2929)
        # A fresh deploy rolls a NEW console image whose baked docs corpus the
        # Help Copilot's AI Search index must reflect — otherwise /copilot answers
        # (and the copilot-quality-evals gate) query a STALE index until an admin
        # manually POSTs the reindex. This warms it once, right after sign-in is
        # wired. Best-effort like every bootstrap step: a miss never fails the
        # deploy (the eval workflow's own pre-run reindex is the fail-loud path).
        # Auth = LOOM_INTERNAL_TOKEN (the same VNet-internal trust token the
        # evaluator uses); NO hardcoded estate host — the console URL is resolved
        # from repo vars → Front Door → ACA ingress, and the step skips cleanly
        # when none resolves. See docs/fiab/copilot-retrieval-remediation.md §9.
        env:
          INTERNAL_TOKEN: ${{ secrets.LOOM_INTERNAL_TOKEN }}
          VERIFY_URL: ${{ vars.LOOM_VERIFY_URL || '' }}
        run: |
          set -uo pipefail
          if [ -z "${INTERNAL_TOKEN:-}" ]; then
            echo "::notice::LOOM_INTERNAL_TOKEN not available to this bootstrap — skipping the loom-docs reindex (an admin can POST /api/help-copilot/reindex, or dispatch copilot-quality-evals which reindexes before its run)."
            exit 0
          fi
          # Resolve the console base URL with NO estate host baked in.
          BASE=""
          if [ -n "${VERIFY_URL:-}" ]; then
            BASE="$VERIFY_URL"
          elif [ -n "${CSA_LOOM_CONSOLE_HOSTS:-}" ]; then
            BASE="https://${CSA_LOOM_CONSOLE_HOSTS%%,*}"
          else
            for AFD_PROFILE in $(az afd profile list -g "$ADMIN_RG" --query "[].name" -o tsv 2>/dev/null || true); do
              FD_HOST=$(az afd endpoint list --profile-name "$AFD_PROFILE" -g "$ADMIN_RG" --query "[0].hostName" -o tsv 2>/dev/null || true)
              [ -n "$FD_HOST" ] && { BASE="https://$FD_HOST"; break; }
            done
            if [ -z "$BASE" ]; then
              ACA_FQDN=$(az containerapp show -n loom-console -g "$ADMIN_RG" --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
              [ -n "$ACA_FQDN" ] && BASE="https://$ACA_FQDN"
            fi
          fi
          if [ -z "$BASE" ]; then
            echo "::notice::Could not resolve a console URL (no LOOM_VERIFY_URL / vanity / Front Door / ACA ingress) — skipping the loom-docs reindex."
            exit 0
          fi
          echo "Reindexing loom-docs on ${BASE%/}"
          # #2929: the route is ASYNC — 202 means ACCEPTED, not finished. The
          # shared driver POSTs, then polls GET for the DURABLE cross-replica
          # freshness signal, so this step can never REPORT a refresh it did not
          # observe. Same script + same tested verdict as loom-docs-reindex.yml,
          # copilot-quality-evals.yml and the console rolls — one implementation,
          # never a divergent inline copy.
          #
          # FATAL=false is deliberate and is THE ONLY call site allowed to set
          # it: a fresh-deploy bootstrap must not be blocked by a Copilot index
          # refresh. The real verdict is still printed in full, and the downgrade
          # announces itself as a ::warning:: — it changes the exit code, nothing
          # else. (scripts/ci/__tests__/reindex-loom-docs.test.mjs pins exactly
          # that, so the downgrade can never become a silent pass.)
          CONSOLE_URL="$BASE" \
          INTERNAL_TOKEN="$INTERNAL_TOKEN" \
          POLL_TIMEOUT_S=600 \
          POLL_INTERVAL_S=15 \
          FATAL=false \
            bash scripts/ci/reindex-loom-docs.sh

      - name: Grant Console UAMI Purview Data Map roles (data-plane)
        env:
          # De-hardcoded so a non-eastus2 / non-Commercial deploy grants the right
          # account on the right host. Override via repo var LOOM_PURVIEW_ACCOUNT
          # (the bicep output catalog.purviewAccountName, e.g. purview-csa-loom-<region>).
          # When the var is UNSET we DISCOVER the provisioned account in the admin RG
          # below rather than falling back to a hardcoded eastus2 name that would not
          # exist in a different-region deploy (which left the grant failing after a
          # "successful" deploy). PURVIEW_CLOUD drives the Data Map host TLD (.us in
          # US Gov); the token audience stays https://purview.azure.net in all clouds.
          PURVIEW_ACCOUNT: ${{ vars.LOOM_PURVIEW_ACCOUNT || '' }}
          PURVIEW_CLOUD: ${{ vars.LOOM_CLOUD || vars.AZURE_CLOUD || ((inputs.boundary == 'GCC-High' || inputs.boundary == 'IL5') && 'AzureUSGovernment') || 'AzureCloud' }}
        run: |
          set -uo pipefail
          # When LOOM_PURVIEW_ACCOUNT is not pinned, discover the account this deploy
          # provisioned (catalog.bicep names it purview-csa-loom-<region>). Prefer the
          # admin RG, then any account in the subscription. Skip the grants cleanly
          # when none exists (Purview opted out / reused account in another sub).
          if [ -z "${PURVIEW_ACCOUNT:-}" ]; then
            PURVIEW_ACCOUNT="$(az purview account list -g "$ADMIN_RG" --query "[?starts_with(name,'purview-csa-loom')].name | [0]" -o tsv 2>/dev/null || true)"
            [ -z "$PURVIEW_ACCOUNT" ] && PURVIEW_ACCOUNT="$(az resource list --resource-type Microsoft.Purview/accounts --query "[?starts_with(name,'purview-csa-loom')].name | [0]" -o tsv 2>/dev/null || true)"
          fi
          if [ -z "${PURVIEW_ACCOUNT:-}" ]; then
            echo "No CSA Loom Purview account found (purviewEnabled=false or reused cross-sub) — skipping Data Map grants."
            exit 0
          fi
          echo "Targeting Purview account: $PURVIEW_ACCOUNT"
          # Classic Purview Data Map permissions are data-plane (collection
          # metadata policy), not ARM RBAC — so they can't be set in bicep. The
          # deploy SP created the Purview account, so it is the root Collection
          # Admin and can grant the Console UAMI the roles it needs for the
          # catalog/scan/glossary/lineage surfaces (fixes the /admin/security +
          # /governance scan + sources "Not authorized to access account" 403).
          # data-reader is included for the F5 lakehouse MIP-label-on-download
          # lookup (reading the sensitivity label scanned onto an ADLS path).
          # Idempotent.
          #
          # REACHABILITY: catalog.bicep deploys the Purview account with
          # publicNetworkAccess='Disabled', so the data plane
          # ({account}.purview.azure.{tld}/policystore/metadataPolicies) is NOT
          # reachable from this public ubuntu-latest runner — the grant PUT (and
          # the metadata-policy GET it depends on) would silently fail and the
          # `|| echo ::warning::` would swallow it, leaving the UAMI unauthorized
          # and the pane stuck on a permanent 403 AFTER a "successful" deploy.
          # We therefore temporarily flip publicNetworkAccess=Enabled for the
          # grant window (mirrors the Synapse/Databricks steps below) and RESTORE
          # it via a trap so it returns to Disabled even if the grant fails.
          PURVIEW_API_VERSION="2024-04-01-preview"
          PURVIEW_ID="$(az resource list --resource-type Microsoft.Purview/accounts \
            --query "[?name=='$PURVIEW_ACCOUNT'].id | [0]" -o tsv 2>/dev/null)"
          if [ -z "$PURVIEW_ID" ]; then
            PURVIEW_ID="$(az purview account show -n "$PURVIEW_ACCOUNT" -g "$ADMIN_RG" --query id -o tsv 2>/dev/null || true)"
          fi
          ORIG_PNA=""
          restore_purview_pna() {
            if [ -n "$PURVIEW_ID" ] && [ "${ORIG_PNA:-Enabled}" != "Enabled" ]; then
              echo "-> restoring Purview publicNetworkAccess=Disabled"
              az resource update --ids "$PURVIEW_ID" --api-version "$PURVIEW_API_VERSION" \
                --set properties.publicNetworkAccess=Disabled --query "properties.publicNetworkAccess" -o tsv || true
            fi
          }
          trap restore_purview_pna EXIT
          if [ -n "$PURVIEW_ID" ]; then
            ORIG_PNA="$(az resource show --ids "$PURVIEW_ID" --api-version "$PURVIEW_API_VERSION" \
              --query "properties.publicNetworkAccess" -o tsv 2>/dev/null || echo Enabled)"
            echo "Purview account $PURVIEW_ACCOUNT publicNetworkAccess=$ORIG_PNA"
            if [ "$ORIG_PNA" != "Enabled" ]; then
              echo "-> temporarily enabling Purview public access for the grant window"
              az resource update --ids "$PURVIEW_ID" --api-version "$PURVIEW_API_VERSION" \
                --set properties.publicNetworkAccess=Enabled --query "properties.publicNetworkAccess" -o tsv || \
                echo "::warning::Could not enable Purview public access — grant may be unreachable from the runner."
              sleep 30
            fi
          else
            echo "::warning::Could not resolve a Microsoft.Purview/accounts id for '$PURVIEW_ACCOUNT' — proceeding (account may be public, in a different RG, or absent)."
          fi
          # All four roles are granted in a single script invocation (ROLES env).
          # The script handles the PE-toggle + restore internally (PURVIEW_TOGGLE_PUBLIC=1)
          # and polls until reachable (up to 8 min), so the outer workflow no longer
          # needs to manage the ARM toggle or loop over roles.
          chmod +x scripts/csa-loom/grant-purview-datamap-role.sh
          echo "== granting all Purview Data Map roles on $PURVIEW_ACCOUNT (cloud=$PURVIEW_CLOUD) =="
          PURVIEW_ACCOUNT="$PURVIEW_ACCOUNT" \
            PURVIEW_CLOUD="$PURVIEW_CLOUD" \
            PURVIEW_TOGGLE_PUBLIC=1 \
            CONSOLE_UAMI_PRINCIPAL="$CONSOLE_UAMI_PRINCIPAL" \
            ROLES="data-reader data-curator data-source-administrator collection-administrator" \
            ADMIN_RG="$ADMIN_RG" \
            bash scripts/csa-loom/grant-purview-datamap-role.sh \
            || echo "::warning::Purview Data Map role grants failed — the deploy SP may not be Collection Admin on $PURVIEW_ACCOUNT (add it once in the Purview portal, then re-run)."

      - name: Purview Unified Catalog governance-domain + Data Product Owner (guidance)
        # Day-one gap closure plan §D3/§D4. The Purview UNIFIED Catalog
        # (purview.microsoft.com) governance-domain creation AND its role grants
        # (Data Product Owner / Data Steward / Catalog Reader) have NO public
        # data-plane REST / az CLI surface as of 2026-06 — they are portal-only.
        # The classic Data Map grants above are fully automated; this unified path
        # is an honest, documented gate (plan §D4) that fires ONLY when an operator
        # has opted into the unified-catalog data-products backend. We print the
        # exact, ordered portal runbook (create domain → add the Console UAMI as
        # Data Product Owner + Catalog Reader) via the existing guidance script so
        # the operator has the steps in the workflow log; the Console renders the
        # matching honest-gate MessageBar until the grant lands. Nothing here fails
        # the deploy — the data-products surface falls through to the Cosmos
        # adapter by default (no Fabric/Power BI dependency).
        if: ${{ vars.LOOM_DATAPRODUCTS_BACKEND == 'unified-catalog' }}
        env:
          LOOM_PURVIEW_UNIFIED_ACCOUNT: ${{ vars.LOOM_PURVIEW_UNIFIED_ACCOUNT || '' }}
          LOOM_PURVIEW_UC_ENDPOINT: ${{ vars.LOOM_PURVIEW_UC_ENDPOINT || '' }}
          LOOM_PURVIEW_GOVERNANCE_DOMAIN_ID: ${{ vars.LOOM_PURVIEW_GOVERNANCE_DOMAIN_ID || '' }}
        run: |
          set -uo pipefail
          echo "== Purview Unified Catalog: governance-domain + Data Product Owner grant =="
          echo "   (unified-catalog backend opted in via LOOM_DATAPRODUCTS_BACKEND)"
          chmod +x scripts/csa-loom/grant-purview-uc-role.sh
          CONSOLE_UAMI_PRINCIPAL="$CONSOLE_UAMI_PRINCIPAL" \
            LOOM_PURVIEW_UNIFIED_ACCOUNT="$LOOM_PURVIEW_UNIFIED_ACCOUNT" \
            LOOM_PURVIEW_UC_ENDPOINT="$LOOM_PURVIEW_UC_ENDPOINT" \
            LOOM_PURVIEW_GOVERNANCE_DOMAIN_ID="$LOOM_PURVIEW_GOVERNANCE_DOMAIN_ID" \
            bash scripts/csa-loom/grant-purview-uc-role.sh \
            || echo "::warning::Unified Catalog role grant is portal-only — follow the printed runbook, then the data-products surface activates."

      - name: Seed default governance taxonomy (classifications / labels / domains)
        env:
          # Deploy-readiness (#229): make /governance + /admin/security POPULATED
          # on first login instead of empty. Seeds GLOBAL Cosmos defaults that the
          # console BFF copies into each tenant on first access. Azure-native; the
          # optional Purview push only fires when LOOM_PURVIEW_ACCOUNT is set.
          LOOM_PURVIEW_ACCOUNT: ${{ vars.LOOM_PURVIEW_ACCOUNT || '' }}
        run: |
          set -uo pipefail
          # The governance docs live in the CONSOLE Cosmos `loom` DB (tenant-settings
          # + governance-domains containers). In tenant mode the console Cosmos is in
          # the ADMIN RG; discover it there first, then fall back to the DLZ RG.
          COSMOS_ACCT="$(az cosmosdb list --subscription "$ADMIN_SUB" -g "$ADMIN_RG" --query "[?starts_with(name,'cosmos-loom')].name | [0]" -o tsv 2>/dev/null || true)"
          COSMOS_RG="$ADMIN_RG"; COSMOS_SUB="$ADMIN_SUB"
          if [ -z "$COSMOS_ACCT" ]; then
            COSMOS_ACCT="$(az cosmosdb list --subscription "$DLZ_SUB" -g "$DLZ_RG" --query "[?starts_with(name,'cosmos-loom')].name | [0]" -o tsv 2>/dev/null || true)"
            COSMOS_RG="$DLZ_RG"; COSMOS_SUB="$DLZ_SUB"
          fi
          if [ -z "$COSMOS_ACCT" ]; then
            echo "::warning::Could not resolve a cosmos-loom* account in $ADMIN_RG or $DLZ_RG — skipping governance seed."
            exit 0
          fi
          echo "== seeding governance taxonomy into $COSMOS_ACCT (rg=$COSMOS_RG, db=loom) =="
          chmod +x scripts/csa-loom/seed-governance.sh
          LOOM_SUBSCRIPTION_ID="$COSMOS_SUB" LOOM_COSMOS_ACCOUNT="$COSMOS_ACCT" LOOM_COSMOS_RG="$COSMOS_RG" \
            LOOM_COSMOS_DATABASE="loom" LOOM_PURVIEW_ACCOUNT="$LOOM_PURVIEW_ACCOUNT" \
            bash scripts/csa-loom/seed-governance.sh \
            || echo "::warning::governance seed failed (Cosmos Data Contributor RBAC on $COSMOS_ACCT for the deploy SP?) — surfaces start empty until re-run."

      - name: Grant Console UAMI subscription RBAC (Monitor / Cost / Security)
        run: |
          set -uo pipefail
          # Security Reader (Defender reads), Resource Policy Contributor
          # (Defender "Fix via Loom" remediations), Cost Management Reader
          # (Monitor → Cost), Monitoring Contributor (diagnostics-on), Reader.
          # Baked in here so a fresh deploy's Monitor surfaces work without the
          # operator hunting for grants. Idempotent.
          chmod +x scripts/csa-loom/grant-console-rbac.sh
          CONSOLE_UAMI_PRINCIPAL="$CONSOLE_UAMI_PRINCIPAL" SUBS="$SUB" \
            bash scripts/csa-loom/grant-console-rbac.sh \
            || echo "::warning::Some Console UAMI RBAC grants failed — the deploy SP needs Owner / User Access Administrator on the subscription."

      - name: Grant Microsoft Sentinel service (Automation Contributor) on the admin RG — Gov AI-defense auto-run playbook
        # GOV-ONLY (GCC-High / IL5, where defenderForAIEnabled=false). ai-defense.bicep
        # deploys the Sentinel automation rule whose RunPlaybook action auto-runs the
        # AI-alert playbook (la-csa-loom-ai-alert-*) on AI-rule incidents. Sentinel runs
        # incident-triggered playbooks under a dedicated service account — the first-party
        # "Azure Security Insights" app (appId 98785600-1bb7-4fb9-b9fa-19afe2c8a360). That
        # account must hold the "Microsoft Sentinel Automation Contributor" role
        # (fixed GUID f4c81013-99ee-4d62-a7ee-b3f1f648599a) on the resource group where the
        # playbook resides (the admin RG) for the automation rule to actually fire the
        # playbook. This was a temp deploy-script pre-step; making it a durable, idempotent
        # bootstrap step so a clean push-button Gov deploy grants it automatically.
        # Ref: https://learn.microsoft.com/azure/sentinel/automation/run-playbooks#prerequisites
        if: ${{ inputs.boundary == 'GCC-High' || inputs.boundary == 'IL5' }}
        run: |
          set -uo pipefail
          SENTINEL_APP_ID="98785600-1bb7-4fb9-b9fa-19afe2c8a360"
          SENTINEL_AUTOMATION_CONTRIBUTOR="f4c81013-99ee-4d62-a7ee-b3f1f648599a"
          ADMIN_RG_SCOPE="/subscriptions/$ADMIN_SUB/resourceGroups/$ADMIN_RG"
          # Resolve the Azure Security Insights SP object (principal) id in this tenant.
          SENTINEL_SP_OID=$(az ad sp show --id "$SENTINEL_APP_ID" --query id -o tsv 2>/dev/null || true)
          if [ -z "${SENTINEL_SP_OID:-}" ] || [ "$SENTINEL_SP_OID" = "None" ]; then
            echo "::notice::Azure Security Insights SP not yet present in tenant — creating it (best-effort)."
            az ad sp create --id "$SENTINEL_APP_ID" -o none 2>/dev/null || true
            SENTINEL_SP_OID=$(az ad sp show --id "$SENTINEL_APP_ID" --query id -o tsv 2>/dev/null || true)
          fi
          if [ -z "${SENTINEL_SP_OID:-}" ] || [ "$SENTINEL_SP_OID" = "None" ]; then
            echo "::warning::Could not resolve the Azure Security Insights SP (appId $SENTINEL_APP_ID) — the AI-defense automation rule won't be able to run the playbook until this is granted. Onboard Microsoft Sentinel on the workspace, then re-run. See docs/fiab/compliance/defender-ai-workaround.md."
            exit 0
          fi
          echo "Granting 'Microsoft Sentinel Automation Contributor' to Azure Security Insights ($SENTINEL_SP_OID) on $ADMIN_RG_SCOPE"
          az role assignment create \
            --assignee-object-id "$SENTINEL_SP_OID" \
            --assignee-principal-type ServicePrincipal \
            --role "$SENTINEL_AUTOMATION_CONTRIBUTOR" \
            --scope "$ADMIN_RG_SCOPE" \
            -o table 2>&1 | grep -v "already exists" \
            || echo "::warning::Sentinel Automation Contributor grant failed — the deploy SP needs Owner/User Access Administrator on $ADMIN_RG. The AI-defense automation rule will not fire the playbook until this is applied (idempotent — safe to re-run)."

      - name: Grant Console UAMI Reader at tenant-root management group (Connections cross-sub discovery)
        # The Connections "add existing" dialog discovers Azure resources
        # (subscriptions, existing services) via Azure Resource Graph. Resource
        # Graph returns rows only for scopes where the caller holds at least
        # Reader. Sub-scoped grants only cover the admin subscription, so
        # resources in DLZ subs and any other subs the tenant owns are invisible.
        # Granting Reader at the TENANT-ROOT management group propagates
        # Read access to EVERY subscription in the tenant (inherited), making
        # cross-sub discovery work without per-sub grants.
        #
        # The tenant-root MG id equals the AAD tenant id. The deploy SP needs
        # Microsoft.Management/register RP + either Owner/UAAM on the MG or the
        # ManagementGroupAccess Entra built-in — see docs/fiab/v3-tenant-bootstrap.md.
        # If the grant is denied (runner lacks MG-write), we log a clear warning
        # and continue (the step is non-fatal by design).
        #
        # Repo var LOOM_TENANT_ROOT_MG_ID lets operators override the MG id
        # for tenants that use a custom top-level MG name; defaults to the
        # AAD tenant id (which IS the tenant-root MG id in Azure).
        run: |
          set -uo pipefail
          TENANT_ID="${{ vars.LOOM_TENANT_ROOT_MG_ID || '' }}"
          if [ -z "${TENANT_ID:-}" ]; then
            TENANT_ID="$(az account show --query tenantId -o tsv 2>/dev/null || true)"
          fi
          if [ -z "${TENANT_ID:-}" ]; then
            echo "::warning::Could not resolve tenant id for tenant-root MG grant — skipping."
            exit 0
          fi
          MG_SCOPE="/providers/Microsoft.Management/managementGroups/$TENANT_ID"
          echo "Granting Reader at tenant-root MG: $MG_SCOPE"
          az role assignment create \
            --assignee-object-id "$CONSOLE_UAMI_PRINCIPAL" \
            --assignee-principal-type ServicePrincipal \
            --role "Reader" \
            --scope "$MG_SCOPE" \
            -o table 2>&1 | grep -v "already exists" \
            || echo "::warning::Tenant-root MG Reader grant failed — the deploy SP needs Owner/UAAM on the root management group or the ManagementGroupAccess Entra role. See docs/fiab/v3-tenant-bootstrap.md §cross-sub-discovery. Cross-sub discovery in the Connections pane will be limited to the admin subscription until this grant is applied."

      - name: Grant Console UAMI Reader on the DLZ subscription (cross-sub discovery fallback) — Refs #1549
        # The tenant-root MG grant above propagates Reader to EVERY sub by inheritance,
        # but MG-write is commonly DENIED on the runner (the deploy SP often lacks
        # Owner/UAAM on the root MG). When that happens, the Console still can't
        # enumerate DLZ resources (Connections "Add existing" / discover returns empty
        # for the DLZ sub). This step is the explicit, narrower fallback that the LIVE
        # centralus fix applied alongside the MG grant: grant Reader directly at the DLZ
        # subscription scope so cross-sub discovery works even without the MG grant. Skips
        # cleanly when the DLZ sub == the admin sub (single-sub: already Reader). Idempotent.
        run: |
          set -uo pipefail
          if [ -z "${DLZ_SUB:-}" ] || [ "$DLZ_SUB" = "$ADMIN_SUB" ]; then
            echo "DLZ sub == admin sub (or unset) — Reader already covered by the admin-sub grants; skipping."
            exit 0
          fi
          echo "Granting Reader to Console UAMI at DLZ subscription scope: /subscriptions/$DLZ_SUB"
          az role assignment create \
            --assignee-object-id "$CONSOLE_UAMI_PRINCIPAL" \
            --assignee-principal-type ServicePrincipal \
            --role "Reader" \
            --scope "/subscriptions/$DLZ_SUB" \
            -o table 2>&1 | grep -v "already exists" \
            || echo "::warning::DLZ-sub Reader grant failed — the deploy SP needs Owner/User Access Administrator on the DLZ subscription ($DLZ_SUB). Cross-sub resource discovery for this DLZ will be limited until applied."

      - name: Fix Synapse Spark storage access (Hive metastore abfss)
        run: |
          set -uo pipefail
          # Grant the Synapse workspace MSI Storage Blob Data Contributor on the
          # default ADLS account + create/approve the managed private endpoints
          # so Spark notebooks can initialize the Hive metastore (otherwise
          # SHOW NAMESPACES fails with InvalidAbfsRestOperationException -1).
          chmod +x scripts/csa-loom/fix-synapse-spark-storage-access.sh
          SYNAPSE_WS="$SYNAPSE_WS" SYNAPSE_RG="$DLZ_RG" SUBSCRIPTION="$DLZ_SUB" \
            bash scripts/csa-loom/fix-synapse-spark-storage-access.sh \
            || echo "::warning::Synapse Spark storage fix incomplete — check the deploy SP's rights on the default storage account."

      - name: Upsert DLZ private-endpoint A-records into HUB private-DNS zones (no-public) — Refs #1549
        # DAY-ONE no-public reachability fix. The Console runs in the HUB VNet but the
        # DLZ data planes (ADLS dfs/blob, Synapse Sql/SqlOnDemand/Dev, +ADX/EH/KV/Cosmos)
        # are PE-only in the DLZ VNet. Their A-records land in the DLZ-side private-DNS
        # zones, NOT the hub-linked zones the Console resolves against — so the Console
        # got lakehouse 504 / lakehouse-query ENOTFOUND / notebook|pipeline|warehouse
        # provisioning failures. The bicep attaches a privateDnsZoneGroup that targets
        # the HUB zones cross-sub, but when the hub zone-id map wasn't threaded into the
        # DLZ deploy the group is skipped and the hub zone has no record. This step is the
        # durable fallback: it enumerates each DLZ PE's customDnsConfigs (fqdn+IP, set by
        # Azure on PE creation regardless of any zone group) and upserts the A-record into
        # the matching hub privatelink zone. Pure private DNS — NO public access. Idempotent.
        run: |
          set -uo pipefail
          chmod +x scripts/csa-loom/upsert-hub-dns-arecords.sh
          ADMIN_SUB="$ADMIN_SUB" ADMIN_RG="$ADMIN_RG" DLZ_SUB="$DLZ_SUB" DLZ_RG="$DLZ_RG" \
            bash scripts/csa-loom/upsert-hub-dns-arecords.sh \
            || echo "::warning::Hub private-DNS A-record sweep incomplete — the deploy SP needs Private DNS Zone Contributor on $ADMIN_RG + Reader on $DLZ_RG. DLZ data planes may be unreachable from the Console until re-run."

      - name: AI private endpoints (AOAI + Foundry) so copilot/agents resolve — Refs #1549
        # DAY-ONE no-public AI reachability. The AOAI + AI Foundry (kind=AIServices)
        # accounts' public FQDNs CNAME into privatelink.cognitiveservices/openai/
        # services.ai zones that are hub-linked. Without a private endpoint those zones
        # are EMPTY -> in-VNet resolution returns NXDOMAIN -> EVERY copilot/chat/agent/
        # tool call fails with "fetch failed" (root-caused 2026-06-23). This creates the
        # PEs + the services.ai zone + DNS-zone-groups so the Console resolves them
        # privately. Idempotent.
        run: |
          set -uo pipefail
          chmod +x scripts/csa-loom/ensure-ai-private-endpoints.sh
          ADMIN_SUB="$ADMIN_SUB" REGION="$REGION" ADMIN_RG="$ADMIN_RG" \
            bash scripts/csa-loom/ensure-ai-private-endpoints.sh \
            || echo "::warning::AI private-endpoint setup incomplete — copilot/agents may be unreachable until re-run (deploy SP needs Network Contributor on $ADMIN_RG)."

      - name: DNS Private Resolver resource (VPN; NOT VNet DNS) — Refs #1549
        # Ensures the DNS Private Resolver resource exists for potential VPN use, but
        # deliberately does NOT set it as the hub VNet DNS — doing so made the Console
        # use it and it proved INTERMITTENT for recursive public->private AI lookups
        # (caused the "fetch failed" outage). Hub VNet stays on Azure-default DNS; VPN
        # clients use the hosts-file block. See docs/fiab/vpn-access.md.
        run: |
          set -uo pipefail
          chmod +x scripts/csa-loom/ensure-vpn-dns-resolver.sh
          ADMIN_SUB="$ADMIN_SUB" REGION="$REGION" ADMIN_RG="$ADMIN_RG" \
            bash scripts/csa-loom/ensure-vpn-dns-resolver.sh \
            || echo "::warning::DNS Private Resolver resource setup incomplete (non-blocking)."

      - name: Grant Console UAMI Synapse RBAC (in-VNET, NO public access) — Refs #1549
        # NO-PUBLIC day-one fix. The Synapse workspace is publicNetworkAccess=Disabled
        # behind a managed VNet, so `az synapse role assignment create` (which targets
        # the dev/management endpoint dev.azuresynapse.net) is NOT reachable from this
        # public ubuntu-latest runner. The OLD flow flipped the workspace to public for
        # the grant window — a no-public-network VIOLATION. Instead we run the grant from
        # a Container App Job in the CONSOLE's VNet-integrated environment (the hub VNet),
        # which reaches the PE-only dev endpoint privately over hub<->DLZ peering + the
        # hub private-DNS records upserted above. The job authenticates as the deploy SP
        # (the workspace Synapse admin) and grants the Console UAMI Synapse Administrator
        # + Synapse SQL Administrator + Artifact Publisher — which is what makes warehouse
        # + serverless-sql-pool CREATE DATABASE stop failing with
        # "Login failed for user '<token-identified principal>'".
        # Resolve the CAE in the admin RG; skip cleanly if none (no console = nothing to grant).
        run: |
          set -uo pipefail
          CAE_NAME=$(az containerapp env list -g "$ADMIN_RG" --subscription "$ADMIN_SUB" \
            --query "[?contains(name,'cae') || contains(name,'loom')].name | [0]" -o tsv 2>/dev/null || true)
          if [ -z "${CAE_NAME:-}" ]; then
            echo "::warning::No Container App Environment in $ADMIN_RG — cannot run the in-VNET Synapse RBAC grant. Re-run after the admin plane is deployed, or grant 'Synapse SQL Administrator' to the Console UAMI manually."
            exit 0
          fi
          echo "Console CAE for in-VNET grant: $CAE_NAME"
          chmod +x scripts/csa-loom/grant-synapse-rbac-invnet-job.sh
          ADMIN_RG="$ADMIN_RG" ADMIN_SUB="$ADMIN_SUB" CAE="$CAE_NAME" \
          DLZ_SUB="$DLZ_SUB" SYNAPSE_WS="$SYNAPSE_WS" \
          CONSOLE_UAMI_PRINCIPAL="$CONSOLE_UAMI_PRINCIPAL" \
          CONSOLE_UAMI_APPID="$CONSOLE_UAMI_CLIENT" \
          CONSOLE_SQL_UAMI="$CONSOLE_SQL_UAMI" \
          DEPLOY_SP_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}" \
          DEPLOY_SP_SECRET="${{ secrets.AZURE_CLIENT_SECRET }}" \
          DEPLOY_SP_TENANT="${{ secrets.AZURE_TENANT_ID }}" \
            bash scripts/csa-loom/grant-synapse-rbac-invnet-job.sh \
            || echo "::warning::In-VNET Synapse RBAC grant job did not complete — warehouse/serverless provisioning may still ELOGIN. Check the CAE Log Analytics ContainerAppConsoleLogs_CL."

      - name: Create Synapse managed PE to the default lake (in-VNET — Spark storage)
        # On a PE-only managed-VNet workspace (preventDataExfiltration), Spark
        # notebooks/jobs can only read the default ADLS lake (mirrored data +
        # lakehouse Delta) over an APPROVED managed private endpoint — otherwise
        # the ABFS read HANGS on a blocked egress (cell "running" for minutes, no
        # error). The standalone fix-synapse-spark-storage-access.sh below runs on
        # THIS public runner and fails silently on a PE-only workspace (the dev
        # endpoint is private). Run the create+approve IN-VNET as the deploy SP,
        # where the dev endpoint is reachable — same pattern as the RBAC grant.
        run: |
          set -uo pipefail
          CAE_NAME=$(az containerapp env list -g "$ADMIN_RG" --subscription "$ADMIN_SUB" \
            --query "[?contains(name,'cae') || contains(name,'loom')].name | [0]" -o tsv 2>/dev/null || true)
          if [ -z "${CAE_NAME:-}" ]; then
            echo "::warning::No Container App Environment in $ADMIN_RG — skipping the in-VNET Synapse Spark storage fix."
            exit 0
          fi
          echo "Console CAE for in-VNET Spark storage fix: $CAE_NAME"
          chmod +x scripts/csa-loom/run-spark-storage-fix-invnet-job.sh
          ADMIN_RG="$ADMIN_RG" ADMIN_SUB="$ADMIN_SUB" CAE="$CAE_NAME" \
          DLZ_SUB="$DLZ_SUB" SYNAPSE_WS="$SYNAPSE_WS" \
          DEPLOY_SP_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}" \
          DEPLOY_SP_SECRET="${{ secrets.AZURE_CLIENT_SECRET }}" \
          DEPLOY_SP_TENANT="${{ secrets.AZURE_TENANT_ID }}" \
            bash scripts/csa-loom/run-spark-storage-fix-invnet-job.sh \
            || echo "::warning::In-VNET Synapse Spark storage-fix job did not complete — Spark notebooks may hang reading the lake. Check the CAE Log Analytics (ContainerName_s=='sparkfix')."

      - name: Wire Synapse Spark → Log Analytics telemetry (best-practice + LA emitter config on every pool)
        # Deploy-time compute-telemetry gap: the Spark pools carry no LA emitter,
        # so Spark applications outside the console notebook path emit NO telemetry
        # to Log Analytics. This bakes the LA emitter (secret via KV, workspace-MSI
        # read) + best-practice AQE/Delta confs onto EVERY Loom Spark pool
        # (loompool + the loometl/loombatch tiers) and re-asserts the workspace
        # diagnostic settings. Idempotent; DEFAULT-ON (skip via LOOM_SKIP_COMPUTE_PROVISION=true).
        if: ${{ vars.LOOM_SKIP_COMPUTE_PROVISION != 'true' }}
        run: |
          set -uo pipefail
          chmod +x scripts/csa-loom/wire-spark-telemetry.sh
          REGION="$REGION" ADMIN_SUB="$ADMIN_SUB" DLZ_SUB="$DLZ_SUB" \
          ADMIN_RG="$ADMIN_RG" DLZ_RG="$DLZ_RG" SYNAPSE_WS="$SYNAPSE_WS" \
          LOOM_DLZ_DOMAIN="$DLZ_DOMAIN" KV_TOGGLE_PUBLIC=1 \
            bash scripts/csa-loom/wire-spark-telemetry.sh \
            || echo "::warning::Spark→LA telemetry wiring incomplete — Spark job/pipeline runs may not emit to Log Analytics. See docs/fiab/compute-tiers-and-telemetry.md."

      - name: Enable Synapse public access (temp — OPT-IN ONLY, default OFF)
        # DEFAULT OFF (no public network access — the in-VNET grant above replaces it).
        # The sqlcmd CREATE LOGIN/USER steps below need to reach the SQL data-plane
        # endpoints from this PUBLIC runner; on first deploy there are no serverless
        # user databases yet (they're created on first item), so those steps no-op and
        # the in-VNET RBAC grant is sufficient. An operator who needs to (re)run the
        # sqlcmd logins from the runner against an EXISTING workspace can opt in by
        # setting repo var LOOM_SYNAPSE_PUBLIC_TOGGLE=true; the public window is then
        # opened here and ALWAYS restored to Disabled by the "Restore Synapse public
        # access disabled" step (if: always()). Leave it unset for the no-public posture.
        if: ${{ vars.LOOM_SYNAPSE_PUBLIC_TOGGLE == 'true' }}
        run: |
          set -e
          az resource update --ids "/subscriptions/$DLZ_SUB/resourceGroups/$DLZ_RG/providers/Microsoft.Synapse/workspaces/$SYNAPSE_WS" \
            --api-version 2021-06-01 --set properties.publicNetworkAccess=Enabled \
            --query "properties.publicNetworkAccess" -o tsv
          sleep 30
          # Allow GHA runner IP through firewall
          GHA_IP=$(curl -sS https://ifconfig.me)
          echo "GHA IP: $GHA_IP"
          az synapse workspace firewall-rule create --subscription "$DLZ_SUB" -g $DLZ_RG --workspace-name $SYNAPSE_WS \
            --name allow-gha-bootstrap-$(date +%s) --start-ip-address "$GHA_IP" --end-ip-address "$GHA_IP" || true
          sleep 30

      - name: Resolve Console UAMI SQL name (region-correct, not hardcoded)
        run: |
          set -uo pipefail
          # identity.bicep names the Console UAMI uami-loom-console-<region>. The
          # hardcoded eastus2 default in env: would create the SQL login for the
          # WRONG name in any other region, leaving the Console UAMI with
          # "Login failed for user" (ELOGIN) on every Synapse SQL call. Discover
          # the real UAMI in the admin RG and derive the region from ADMIN_RG so
          # CREATE LOGIN/USER targets the identity that actually runs the console.
          DISCOVERED=$(az identity list -g "$ADMIN_RG" \
            --query "[?contains(name,'console')].name | [0]" -o tsv 2>/dev/null || true)
          if [ -n "${DISCOVERED:-}" ] && [ "$DISCOVERED" != "None" ]; then
            echo "CONSOLE_SQL_UAMI=$DISCOVERED" >> "$GITHUB_ENV"
            echo "Resolved Console UAMI SQL name from admin RG: $DISCOVERED"
          else
            # Fallback: derive region from the admin RG suffix (rg-csa-loom-admin-<region>).
            REGION_FROM_RG="${ADMIN_RG##*-}"
            if [ -n "$REGION_FROM_RG" ] && [ "$REGION_FROM_RG" != "$ADMIN_RG" ]; then
              echo "CONSOLE_SQL_UAMI=uami-loom-console-$REGION_FROM_RG" >> "$GITHUB_ENV"
              echo "Derived Console UAMI SQL name from admin RG region: uami-loom-console-$REGION_FROM_RG"
            else
              echo "Keeping configured CONSOLE_SQL_UAMI=$CONSOLE_SQL_UAMI"
            fi
          fi

      - name: SQL-level grants via sqlcmd (Serverless)
        # OPT-IN ONLY (no-public default). sqlcmd reaches the PE-only -ondemand SQL
        # endpoint, which is only routable from this public runner inside the
        # opt-in public window (LOOM_SYNAPSE_PUBLIC_TOGGLE=true). On the default
        # no-public path this step is skipped; the in-VNET Synapse RBAC grant above
        # plus the bicep AzurePowerShell SQL-admin grant create the serverless login.
        if: ${{ vars.LOOM_SYNAPSE_PUBLIC_TOGGLE == 'true' }}
        run: |
          set -e
          # Acquire AAD token for Synapse SQL
          TOKEN=$(az account get-access-token --resource https://database.windows.net --query accessToken -o tsv)
          # Install sqlcmd
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # Connect to Serverless master, create UAMI as login + user (region-correct name).
          sqlcmd -S "$SYNAPSE_WS-ondemand.sql.azuresynapse.net" -d master -G -P "$TOKEN" -Q "
          IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = '$CONSOLE_SQL_UAMI')
            CREATE LOGIN [$CONSOLE_SQL_UAMI] FROM EXTERNAL PROVIDER;
          IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = '$CONSOLE_SQL_UAMI')
            CREATE USER [$CONSOLE_SQL_UAMI] FROM LOGIN [$CONSOLE_SQL_UAMI];
          ALTER SERVER ROLE sysadmin ADD MEMBER [$CONSOLE_SQL_UAMI];
          " || echo "Some grants may have failed (already exist or other) — continuing"

      - name: SQL-level grants via sqlcmd (Dedicated pool — F13 table/column/row security)
        # OPT-IN ONLY (no-public default) — reaches the PE-only dedicated SQL endpoint
        # from the public runner; only routable inside the LOOM_SYNAPSE_PUBLIC_TOGGLE
        # window. The in-VNET grant + bicep SQL-admin grant cover the day-one path.
        if: ${{ vars.LOOM_SYNAPSE_PUBLIC_TOGGLE == 'true' }}
        run: |
          set -e
          # The Permissions dialog's Table/Column/Row tabs run real
          # GRANT SELECT / CREATE SECURITY POLICY against the Dedicated SQL
          # pool. The Console UAMI must be a db_owner contained user there to
          # CREATE USER … FROM EXTERNAL PROVIDER + manage object/RLS security.
          # We also pre-create the LoomSecurity schema the RLS predicates live
          # in (Dedicated pools reject the inline CREATE SCHEMA IF NOT EXISTS
          # form, so the client guards it; pre-creating here is belt-and-braces).
          POOL="${LOOM_SYNAPSE_DEDICATED_POOL:-loompool}"
          TOKEN=$(az account get-access-token --resource https://database.windows.net --query accessToken -o tsv)
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # The dedicated pool (the Azure-native "warehouse" backend) must be
          # running (resumed) for this to connect. Use the region-correct UAMI
          # name resolved above so the login matches the identity the console runs
          # as (fixes ELOGIN on non-eastus2 deploys).
          sqlcmd -S "$SYNAPSE_WS.sql.azuresynapse.net" -d "$POOL" -G -P "$TOKEN" -I -b -Q "
          IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = '$CONSOLE_SQL_UAMI')
            CREATE USER [$CONSOLE_SQL_UAMI] FROM EXTERNAL PROVIDER;
          IF IS_ROLEMEMBER('db_owner','$CONSOLE_SQL_UAMI') = 0
            EXEC sp_addrolemember 'db_owner', '$CONSOLE_SQL_UAMI';
          IF NOT EXISTS (SELECT 1 FROM sys.schemas WHERE name = 'LoomSecurity')
            EXEC('CREATE SCHEMA LoomSecurity');
          " || echo "::warning::Dedicated-pool F13 grants incomplete — ensure the pool '$POOL' is resumed and the UAMI is Synapse SQL Administrator."

      - name: SQL-level grants via sqlcmd (Serverless user databases — warehouse/lakehouse SQL endpoints)
        # OPT-IN ONLY (no-public default) — per-DB contained-user grants on the PE-only
        # -ondemand endpoint, only routable inside the LOOM_SYNAPSE_PUBLIC_TOGGLE window.
        # On first deploy there are no serverless user databases yet (created on first
        # item), so this is a no-op on the day-one path anyway.
        if: ${{ vars.LOOM_SYNAPSE_PUBLIC_TOGGLE == 'true' }}
        run: |
          set -uo pipefail
          # The serverless master login (above) authenticates the Console UAMI to
          # the on-demand endpoint, but per-database SQL (warehouse/lakehouse
          # logical DBs exposed as serverless databases, e.g. SELECT over external
          # tables / OPENROWSET views) needs a CONTAINED USER in each user DB.
          # Without it the Console UAMI connects to master fine but gets ELOGIN /
          # "principal not found" against the warehouse DB. Create the user +
          # db_owner in every non-system serverless database. Idempotent.
          export PATH="$PATH:/opt/mssql-tools18/bin"
          TOKEN=$(az account get-access-token --resource https://database.windows.net --query accessToken -o tsv)
          ONDEMAND="$SYNAPSE_WS-ondemand.sql.azuresynapse.net"
          # Enumerate user databases on the serverless endpoint.
          DBS=$(sqlcmd -S "$ONDEMAND" -d master -G -P "$TOKEN" -h -1 -W -Q \
            "SET NOCOUNT ON; SELECT name FROM sys.databases WHERE database_id > 4 AND name <> 'master';" 2>/dev/null | grep -vE '^\s*$' || true)
          if [ -z "${DBS:-}" ]; then
            echo "No serverless user databases yet (warehouse/lakehouse SQL endpoints are created on first item) — master login is sufficient for now. Re-run after creating a warehouse to grant per-DB access."
            exit 0
          fi
          for DB in $DBS; do
            echo "Granting [$CONSOLE_SQL_UAMI] db_owner on serverless DB: $DB"
            sqlcmd -S "$ONDEMAND" -d "$DB" -G -P "$TOKEN" -I -b -Q "
            IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = '$CONSOLE_SQL_UAMI')
              CREATE USER [$CONSOLE_SQL_UAMI] FROM EXTERNAL PROVIDER;
            IF IS_ROLEMEMBER('db_owner','$CONSOLE_SQL_UAMI') = 0
              EXEC sp_addrolemember 'db_owner', '$CONSOLE_SQL_UAMI';
            " || echo "::warning::Per-DB grant on serverless DB '$DB' incomplete (continuing)."
          done

      - name: Restore Synapse public access disabled (safety net) — Refs #1549
        # Runs always(). On the no-public default path the public toggle was never
        # opened, so this just RE-ASSERTS the correct posture (publicNetworkAccess=
        # Disabled) — a harmless no-op that also catches any drift. On the opt-in
        # LOOM_SYNAPSE_PUBLIC_TOGGLE path it closes the window even if a SQL step failed.
        if: always()
        run: |
          az resource update --ids "/subscriptions/$DLZ_SUB/resourceGroups/$DLZ_RG/providers/Microsoft.Synapse/workspaces/$SYNAPSE_WS" \
            --api-version 2021-06-01 --set properties.publicNetworkAccess=Disabled \
            --query "properties.publicNetworkAccess" -o tsv || true

      - name: Enable Databricks public access (temp, so GHA can reach SCIM)
        run: |
          set -e
          # The Databricks workspace lives behind a private endpoint. The
          # GHA runner can't reach `/api/2.0/preview/scim/v2/...` without
          # publicNetworkAccess=Enabled. We flip it on, do the SCIM PATCH,
          # and restore disabled in the always-run cleanup step below.
          DBX_RID=$(az resource list --subscription "$DLZ_SUB" -g $DLZ_RG --resource-type Microsoft.Databricks/workspaces --query "[?name=='$DBX_WS'].id" -o tsv)
          if [ -z "$DBX_RID" ]; then
            DBX_RID=$(az resource list --subscription "$ADMIN_SUB" -g $ADMIN_RG --resource-type Microsoft.Databricks/workspaces --query "[?name=='$DBX_WS'].id" -o tsv)
          fi
          echo "DBX_RID=$DBX_RID"
          if [ -n "$DBX_RID" ]; then
            az resource update --ids "$DBX_RID" --api-version 2024-05-01 \
              --set properties.publicNetworkAccess=Enabled \
              --query "properties.publicNetworkAccess" -o tsv || true
            sleep 30
          fi

      - name: Bootstrap Databricks SCIM (Console UAMI as SP)
        run: |
          set -e
          # DBX_HOST is resolved at runtime from the workspace (env default is now
          # empty — no estate host is shipped). Skip cleanly when no Databricks
          # workspace was bound in this deploy rather than curling https:///…
          if [ -z "${DBX_HOST:-}" ]; then
            echo "::notice::No Databricks workspace resolved (DBX_HOST empty) — skipping SCIM bootstrap."
            exit 0
          fi
          TOKEN=$(az account get-access-token --resource 2ff814a6-3304-4ab8-85cb-cd0e6f879c1d --query accessToken -o tsv)
          # workspace-access + databricks-sql-access = browse, run notebooks, SQL warehouses
          # allow-cluster-create = POST /api/2.1/clusters/create (fixes the 403 in
          #   the Cluster editor reported 2026-05-27; PR #366)
          # allow-instance-pool-create = POST /api/2.0/instance-pools/create
          PAYLOAD=$(cat <<EOF
          {
            "schemas":["urn:ietf:params:scim:schemas:core:2.0:ServicePrincipal"],
            "applicationId":"$CONSOLE_UAMI_CLIENT",
            "displayName":"$CONSOLE_SQL_UAMI",
            "groups":[],
            "entitlements":[
              {"value":"workspace-access"},
              {"value":"databricks-sql-access"},
              {"value":"allow-cluster-create"},
              {"value":"allow-instance-pool-create"}
            ]
          }
          EOF
          )
          # Try POST; on 409 (SP already exists from a prior bootstrap that
          # only granted 2 entitlements), look up the SP id and PATCH the
          # entitlements list to all four. Idempotent on re-run.
          STATUS=$(curl -sS -w "%{http_code}" -o /tmp/scim.json -X POST \
            "https://$DBX_HOST/api/2.0/preview/scim/v2/ServicePrincipals" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/scim+json" \
            -d "$PAYLOAD")
          echo "SCIM POST status: $STATUS"
          cat /tmp/scim.json
          echo
          if [[ "$STATUS" == "409" ]] || grep -q "already exists\|exists" /tmp/scim.json 2>/dev/null; then
            echo "SP already exists — looking up id + PATCHing entitlements"
            SP_LOOKUP=$(curl -sS \
              "https://$DBX_HOST/api/2.0/preview/scim/v2/ServicePrincipals?filter=applicationId%20eq%20%22$CONSOLE_UAMI_CLIENT%22" \
              -H "Authorization: Bearer $TOKEN")
            SP_ID=$(echo "$SP_LOOKUP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['Resources'][0]['id'])")
            echo "Existing SP id: $SP_ID"
            PATCH_RESP=$(curl -sS -w "%{http_code}" -o /tmp/scim_patch.json -X PATCH \
              "https://$DBX_HOST/api/2.0/preview/scim/v2/ServicePrincipals/$SP_ID" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/scim+json" \
              -d '{"schemas":["urn:ietf:params:scim:api:messages:2.0:PatchOp"],"Operations":[{"op":"replace","path":"entitlements","value":[{"value":"workspace-access"},{"value":"databricks-sql-access"},{"value":"allow-cluster-create"},{"value":"allow-instance-pool-create"}]}]}')
            echo "SCIM PATCH status: $PATCH_RESP"
            cat /tmp/scim_patch.json
            echo
          fi

      - name: Provision Databricks instance pools + Loom cluster policy
        # Deploy-time compute-provisioning gap: the Databricks workspace has 0
        # instance pools + no Loom cluster policy, so clusters cold-start and
        # nothing enforces the best-practice spark_conf / auto-terminate / log
        # delivery the console presets bake in. Creates loom-pool-s/m/l (node
        # types from lib/databricks/cluster-presets.ts) + the "Loom Standard"
        # policy. Runs HERE because Databricks public access is open (the SCIM
        # steps above enable it and the "Restore Databricks public access
        # disabled" step below re-locks it). Idempotent; DEFAULT-ON
        # (skip via LOOM_SKIP_COMPUTE_PROVISION=true).
        if: ${{ vars.LOOM_SKIP_COMPUTE_PROVISION != 'true' }}
        run: |
          set -uo pipefail
          if [ -z "${DBX_HOST:-}" ]; then
            echo "::notice::No Databricks workspace resolved (DBX_HOST empty) — skipping Databricks compute provisioning."
            exit 0
          fi
          chmod +x scripts/csa-loom/provision-databricks-compute.sh
          REGION="$REGION" ADMIN_SUB="$ADMIN_SUB" DLZ_SUB="$DLZ_SUB" \
          ADMIN_RG="$ADMIN_RG" DLZ_RG="$DLZ_RG" DBX_WS="$DBX_WS" DBX_HOST="$DBX_HOST" \
            bash scripts/csa-loom/provision-databricks-compute.sh \
            || echo "::warning::Databricks compute provisioning incomplete — instance pools / cluster policy may be missing. See docs/fiab/compute-tiers-and-telemetry.md."

      - name: Grant Databricks Delta Sharing metastore privileges (UAMI)
        # Day-one fix so the Marketplace "Data shares" flow works END-TO-END
        # without operator confusion: grant the Console UAMI the FULL UC metastore
        # sharing set — CREATE PROVIDER (register an inbound share from an
        # activation file) + CREATE CATALOG (subscribe = create a catalog from the
        # share so it's queryable) + CREATE SHARE / CREATE RECIPIENT (publish
        # outbound). account_admin does NOT include these data-plane privileges;
        # the deploy SP (a Databricks account ≈ metastore admin) PATCHes them. The
        # UAMI must already be SCIM-provisioned (previous step). Idempotent +
        # best-effort (skips cleanly when no Databricks workspace is bound).
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "${DBX_HOST:-}" ]; then echo "::notice::No Databricks host bound — skipping Delta Sharing grant."; exit 0; fi
          UAMI="${CONSOLE_UAMI_CLIENT:-}"
          if [ -z "$UAMI" ]; then echo "::notice::CONSOLE_UAMI_CLIENT unset — skipping Delta Sharing grant."; exit 0; fi
          TOKEN=$(az account get-access-token --resource 2ff814a6-3304-4ab8-85cb-cd0e6f879c1d --query accessToken -o tsv)
          auth=(-H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json")
          MID=$(curl -sf "${auth[@]}" "https://$DBX_HOST/api/2.1/unity-catalog/metastore_summary" | jq -r '.metastore_id' 2>/dev/null || true)
          if [ -z "$MID" ] || [ "$MID" = "null" ]; then echo "::warning::Could not resolve metastore_id on $DBX_HOST (is the deploy SP a metastore admin?). Skipping Delta Sharing grant."; exit 0; fi
          echo ">>> Granting CREATE PROVIDER/CATALOG/SHARE/RECIPIENT to $UAMI on metastore $MID"
          BODY=$(jq -n --arg p "$UAMI" '{changes:[{principal:$p, add:["CREATE_PROVIDER","CREATE_CATALOG","CREATE_SHARE","CREATE_RECIPIENT"]}]}')
          CODE=$(curl -s -o /tmp/ds_grant.json -w '%{http_code}' "${auth[@]}" -X PATCH "https://$DBX_HOST/api/2.1/unity-catalog/permissions/metastore/$MID" -d "$BODY")
          echo "    Delta Sharing grant PATCH: $CODE"; cat /tmp/ds_grant.json 2>/dev/null || true
          if [ "$CODE" = "200" ]; then echo "✓ Delta Sharing metastore grants applied to $UAMI"; else echo "::warning::Delta Sharing grant returned $CODE (non-fatal — re-run csa-loom-grant-delta-sharing.yml)"; fi

      - name: Provision default Databricks SQL warehouse (query compute) + wire it on the Console
        # Day-one QUERY COMPUTE for Databricks — the equivalent of Synapse's
        # always-on Serverless SQL pool, so users don't have to create one. A SQL
        # warehouse is a Databricks DATA-PLANE resource (REST API, NOT ARM), so it
        # cannot be created in bicep — it is provisioned here. Without it, the
        # Marketplace "query a Delta share" path + any UC SQL execution have
        # nothing to run against (LOOM_DATABRICKS_SQL_WAREHOUSE_ID was empty).
        # Idempotent (reuses an existing 'loom-default' warehouse). Serverless when
        # the workspace/region supports it, else a small classic PRO warehouse.
        # Best-effort; skips cleanly when no Databricks workspace is bound.
        # Learn: https://learn.microsoft.com/azure/databricks/sql/admin/sql-endpoints
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "${DBX_HOST:-}" ]; then echo "::notice::No Databricks host bound — skipping SQL warehouse provisioning."; exit 0; fi
          TOKEN=$(az account get-access-token --resource 2ff814a6-3304-4ab8-85cb-cd0e6f879c1d --query accessToken -o tsv)
          auth=(-H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json")
          WID=$(curl -sf "${auth[@]}" "https://$DBX_HOST/api/2.0/sql/warehouses" 2>/dev/null | jq -r '.warehouses[]? | select(.name=="loom-default") | .id' | head -1 || true)
          if [ -z "$WID" ] || [ "$WID" = "null" ]; then
            echo ">>> Creating serverless SQL warehouse 'loom-default' (2X-Small, auto-stop 10m)"
            RESP=$(curl -s "${auth[@]}" -X POST "https://$DBX_HOST/api/2.0/sql/warehouses" -d '{"name":"loom-default","cluster_size":"2X-Small","min_num_clusters":1,"max_num_clusters":1,"auto_stop_mins":10,"enable_serverless_compute":true,"warehouse_type":"PRO"}')
            WID=$(echo "$RESP" | jq -r '.id // empty')
            if [ -z "$WID" ]; then
              echo "::notice::Serverless unavailable in this workspace/region — creating a classic PRO warehouse."
              RESP=$(curl -s "${auth[@]}" -X POST "https://$DBX_HOST/api/2.0/sql/warehouses" -d '{"name":"loom-default","cluster_size":"2X-Small","min_num_clusters":1,"max_num_clusters":1,"auto_stop_mins":10,"enable_serverless_compute":false,"warehouse_type":"PRO"}')
              WID=$(echo "$RESP" | jq -r '.id // empty')
            fi
            if [ -z "$WID" ]; then echo "::warning::Could not create a SQL warehouse: $RESP"; exit 0; fi
          fi
          echo "    SQL warehouse id: $WID"
          # One warehouse serves SQL execution, Delta-Sharing grants, lineage, and system-tables.
          az containerapp update -n loom-console -g "$ADMIN_RG" --set-env-vars "LOOM_DATABRICKS_SQL_WAREHOUSE_ID=$WID" "LOOM_DATABRICKS_LINEAGE_WAREHOUSE_ID=$WID" -o none \
            && echo "✓ Wired LOOM_DATABRICKS_SQL_WAREHOUSE_ID + LINEAGE = $WID on the Console" \
            || echo "::warning::Could not set the warehouse env on the Console (set LOOM_DATABRICKS_SQL_WAREHOUSE_ID=$WID manually)."

      - name: Databricks reachability fallback (IP access-list for Console egress)
        # #1466 FALLBACK to the databricks_ui_api Private Endpoint (databricks.bicep).
        # PRIMARY day-one fix: the PE + privatelink.azuredatabricks.net DNS zone make
        # the PE-locked workspace (publicNetworkAccess Disabled) reachable from the hub
        # VNet with NO IP drift — so the Console no longer gets "403 Unauthorized network
        # access to workspace". This step only matters when an operator runs the
        # workspace with publicNetworkAccess=Enabled (no PE): then the workspace IP
        # access list, if enabled, can still block the Console's NAT egress IP. We add
        # that egress IP to an ALLOW list so the Console reaches the workspace over the
        # public path too. Opt-in via repo var LOOM_DBX_IP_ALLOWLIST_FALLBACK=true
        # (default off — the PE is the supported posture). Reuses the public-access
        # window opened above for SCIM. Grounded in Microsoft Learn
        # (ip-access-list-workspace: POST /api/2.0/ip-access-lists, list_type ALLOW).
        if: ${{ vars.LOOM_DBX_IP_ALLOWLIST_FALLBACK == 'true' }}
        continue-on-error: true
        env:
          # The Console's outbound egress IP (the hub NAT gateway / firewall public IP).
          # Set this repo var to the deployment's egress IP (CIDR ok, e.g. 20.1.2.3/32).
          CONSOLE_EGRESS_IP: ${{ vars.LOOM_CONSOLE_EGRESS_IP }}
        run: |
          set -uo pipefail
          if [ -z "${CONSOLE_EGRESS_IP:-}" ]; then
            echo "::warning::LOOM_DBX_IP_ALLOWLIST_FALLBACK=true but LOOM_CONSOLE_EGRESS_IP unset — cannot allowlist. Prefer the databricks_ui_api Private Endpoint (no IP drift)."
            exit 0
          fi
          TOKEN=$(az account get-access-token --resource 2ff814a6-3304-4ab8-85cb-cd0e6f879c1d --query accessToken -o tsv)
          # Make sure the IP access-list feature is on (no-op if already enabled).
          curl -sS -X PATCH "https://$DBX_HOST/api/2.0/workspace-conf" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"enableIpAccessLists":"true"}' >/dev/null || true
          PAYLOAD=$(printf '{"label":"csa-loom-console","list_type":"ALLOW","ip_addresses":["%s"]}' "$CONSOLE_EGRESS_IP")
          R=$(curl -sS -w "%{http_code}" -o /tmp/dbx_ipacl.json -X POST \
            "https://$DBX_HOST/api/2.0/ip-access-lists" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$PAYLOAD")
          if [[ "$R" == "200" ]]; then
            echo "  Console egress $CONSOLE_EGRESS_IP added to Databricks ALLOW list."
          elif grep -qi "already exists\|duplicate" /tmp/dbx_ipacl.json 2>/dev/null; then
            echo "  ALLOW list 'csa-loom-console' already present (idempotent)."
          else
            echo "::warning::IP allowlist add returned $R: $(cat /tmp/dbx_ipacl.json). Prefer the databricks_ui_api Private Endpoint."
          fi

      - name: Enable Unity Catalog (metastore + default catalog + UAMI account-admin)
        # Default-on UC enablement. Runs against the Databricks ACCOUNT API
        # (accounts.azuredatabricks.net, NOT the network-locked workspace) to
        # create/assign the metastore + grant the Console UAMI account-admin, and
        # against the WORKSPACE REST (reachable here because public access is
        # temporarily Enabled above) to create + pin the DEFAULT CATALOG so
        # Browse > Unity Catalog shows a real configured catalog. Requires:
        #   - var/secret DATABRICKS_ACCOUNT_ID (the account GUID), AND
        #   - the deploy SP to be a Databricks ACCOUNT ADMIN (one-time human step).
        # If either is absent the step prints how to do it and continues — UC
        # enablement is never a hard deploy blocker.
        env:
          DATABRICKS_ACCOUNT_ID: ${{ vars.DATABRICKS_ACCOUNT_ID || secrets.DATABRICKS_ACCOUNT_ID }}
          # OPTIONAL sovereign override. Commercial/GCC default to
          # accounts.azuredatabricks.net; GCC-High/IL5 default to
          # accounts.azuredatabricks.us (Azure US Government). A repo var still
          # wins. enable-unity-catalog.sh reads this as its host default.
          DATABRICKS_ACCOUNT_HOST: ${{ vars.DATABRICKS_ACCOUNT_HOST || ((inputs.boundary == 'GCC-High' || inputs.boundary == 'IL5') && 'accounts.azuredatabricks.us') || '' }}
        run: |
          if [ -z "$DATABRICKS_ACCOUNT_ID" ]; then
            echo "::notice::DATABRICKS_ACCOUNT_ID not set — skipping UC auto-enable."
            echo "To automate: set repo var DATABRICKS_ACCOUNT_ID (account console → ⊙ menu → Account ID)"
            echo "and make the deploy SP a Databricks account admin once. Or assign the metastore manually:"
            echo "  docs/fiab/catalog/metastores.md#enabling-unity-catalog"
            exit 0
          fi
          WS_ID=$(az databricks workspace show --subscription "$DLZ_SUB" -g "$DLZ_RG" -n "$DBX_WS" --query workspaceId -o tsv 2>/dev/null \
                  || az databricks workspace show --subscription "$ADMIN_SUB" -g "$ADMIN_RG" -n "$DBX_WS" --query workspaceId -o tsv 2>/dev/null)
          DBX_REGION=$(az databricks workspace show --subscription "$DLZ_SUB" -g "$DLZ_RG" -n "$DBX_WS" --query location -o tsv 2>/dev/null \
                   || az databricks workspace show --subscription "$ADMIN_SUB" -g "$ADMIN_RG" -n "$DBX_WS" --query location -o tsv 2>/dev/null)
          if [ -z "$WS_ID" ] || [ -z "$DBX_REGION" ]; then
            echo "::warning::Could not resolve Databricks workspaceId/region — skipping UC auto-enable."; exit 0
          fi
          chmod +x scripts/csa-loom/enable-unity-catalog.sh
          # --workspace-host is reachable because public access is Enabled above;
          # it lets the script CREATE + pin the default catalog so Browse shows a
          # real configured catalog. Tolerate non-account-admin deploy SP: warn,
          # don't fail the bootstrap.
          bash scripts/csa-loom/enable-unity-catalog.sh \
            --region "$DBX_REGION" --workspace-id "$WS_ID" --uami-app-id "$CONSOLE_UAMI_CLIENT" \
            --workspace-host "$DBX_HOST" --default-catalog main \
            || echo "::warning::UC auto-enable failed (deploy SP likely not a Databricks account admin). See docs/fiab/catalog/metastores.md"
          # Wire LOOM_DATABRICKS_ACCOUNT_ID onto the LIVE console (tenant/dlz-attach
          # bridge): the single-sub path gets it from admin-plane bicep apps[].env
          # (param databricksAccountId), but a dlz-attach deploy does NOT redeploy
          # the admin plane, so the Catalog → Metastores UC enumerate/attach +
          # /catalog/domains UC-mirror surfaces would honest-gate on a missing env.
          # The console UC client (lib/azure/unity-catalog-account-client.ts) reads
          # LOOM_DATABRICKS_ACCOUNT_ID; set it now so the surfaces are live day-one.
          CONSOLE_APP=$(az containerapp list -g "$ADMIN_RG" --query "[?contains(name,'loom-console') || contains(name,'console')].name | [0]" -o tsv 2>/dev/null || true)
          if [ -n "$CONSOLE_APP" ]; then
            ENVPAIRS=("LOOM_DATABRICKS_ACCOUNT_ID=$DATABRICKS_ACCOUNT_ID")
            [ -n "${DATABRICKS_ACCOUNT_HOST:-}" ] && ENVPAIRS+=("LOOM_DATABRICKS_ACCOUNT_HOST=$DATABRICKS_ACCOUNT_HOST")
            az containerapp update -g "$ADMIN_RG" -n "$CONSOLE_APP" --set-env-vars "${ENVPAIRS[@]}" -o none 2>&1 | tail -1 \
              && echo "Wired LOOM_DATABRICKS_ACCOUNT_ID onto $CONSOLE_APP (UC metastore enumerate/attach now configured)." \
              || echo "::warning::Could not set LOOM_DATABRICKS_ACCOUNT_ID on $CONSOLE_APP — run scripts/csa-loom/patch-navigator-env.sh (it now wires this env)."
          else
            echo "::notice::No console Container App found in $ADMIN_RG — the single-sub bicep path wires LOOM_DATABRICKS_ACCOUNT_ID via admin-plane apps[].env."
          fi

      - name: Restore Databricks public access disabled
        if: always()
        run: |
          DBX_RID=$(az resource list --subscription "$DLZ_SUB" -g $DLZ_RG --resource-type Microsoft.Databricks/workspaces --query "[?name=='$DBX_WS'].id" -o tsv)
          if [ -z "$DBX_RID" ]; then
            DBX_RID=$(az resource list --subscription "$ADMIN_SUB" -g $ADMIN_RG --resource-type Microsoft.Databricks/workspaces --query "[?name=='$DBX_WS'].id" -o tsv)
          fi
          if [ -n "$DBX_RID" ]; then
            az resource update --ids "$DBX_RID" --api-version 2024-05-01 \
              --set properties.publicNetworkAccess=Disabled \
              --query "properties.publicNetworkAccess" -o tsv || true
          fi

      - name: Grant Console UAMI APIM Service Contributor (if APIM exists)
        run: |
          set -e
          APIM_STATE=$(az apim show -n $APIM_NAME -g $ADMIN_RG --query provisioningState -o tsv 2>/dev/null || echo "Missing")
          echo "APIM state: $APIM_STATE"
          if [[ "$APIM_STATE" == "Succeeded" ]]; then
            az role assignment create \
              --assignee $CONSOLE_UAMI_PRINCIPAL \
              --role "API Management Service Contributor" \
              --scope "/subscriptions/$SUB/resourceGroups/$ADMIN_RG/providers/Microsoft.ApiManagement/service/$APIM_NAME" \
              -o table || echo "Already assigned"
          else
            echo "APIM not provisioned yet — skipping RBAC grant"
          fi

      - name: Grant Console UAMI Reader on admin RG (unblocks /admin/capacity full inventory)
        run: |
          az role assignment create \
            --assignee-object-id $CONSOLE_UAMI_PRINCIPAL \
            --assignee-principal-type ServicePrincipal \
            --role "Reader" \
            --scope "/subscriptions/$SUB/resourceGroups/$ADMIN_RG" \
            -o table 2>&1 | grep -v "already exists" || echo "Already assigned"

      - name: Grant Console UAMI Cost Management Reader + Security Reader (Monitor Cost + Security tabs)
        # Sub-scope, so the /monitor Cost tab (Microsoft.CostManagement query) and
        # Security/Defender tab (Microsoft.Security secureScores/assessments/alerts)
        # show real data instead of an honest "grant X" gate. Idempotent.
        run: |
          for ROLE in "Cost Management Reader" "Security Reader"; do
            az role assignment create \
              --assignee-object-id $CONSOLE_UAMI_PRINCIPAL \
              --assignee-principal-type ServicePrincipal \
              --role "$ROLE" \
              --scope "/subscriptions/$SUB" \
              -o table 2>&1 | grep -v "already exists" || echo "$ROLE already assigned"
          done

      - name: Enable diagnostics on ALL Loom resources → Loom Log Analytics
        # "All logs ON by default, routed to the Loom LAW." Deploy-time bicep
        # wires the first-class resources; this sweep covers everything created
        # at runtime (installed-app resources, ADX DBs, etc.) and any drift.
        # First grant the Console UAMI Monitoring Contributor so the in-console
        # Monitor → Diagnostics tab's "Enable" buttons work at runtime too.
        run: |
          # ADMIN_RG lives in the admin sub; DLZ_RG may live in a DIFFERENT sub on a
          # cross-sub dlz-attach. Pair each RG with its sub so the scope is correct.
          for PAIR in "$ADMIN_SUB:$ADMIN_RG" "$DLZ_SUB:$DLZ_RG"; do
            RG_SUB="${PAIR%%:*}"; RG="${PAIR##*:}"
            az role assignment create \
              --assignee-object-id $CONSOLE_UAMI_PRINCIPAL \
              --assignee-principal-type ServicePrincipal \
              --role "Monitoring Contributor" \
              --scope "/subscriptions/$RG_SUB/resourceGroups/$RG" \
              -o table 2>&1 | grep -v "already exists" || echo "Monitoring Contributor already assigned on $RG"
          done
          # Idempotent sweep — skips resources already routing to the LAW and
          # types that don't support diagnostic settings.
          bash scripts/csa-loom/enable-all-diagnostics.sh --resource-groups "$ADMIN_RG $DLZ_RG" || \
            echo "WARN: diagnostics sweep reported issues (non-fatal)"

      - name: Grant Console UAMI constrained RBAC Admin (Governance access-policy enforcement)
        # Lets the Governance → Policies "Access" wizard ENFORCE policies as real
        # Storage RBAC grants (Blob Data Reader/Contributor/Owner) on the DLZ.
        # Least-privilege: "Role Based Access Control Administrator" with a
        # condition restricting it to ONLY assign/remove the 3 Storage Blob Data
        # roles. Without this the access policy records with an honest error.
        run: |
          COND="((!(ActionMatches{'Microsoft.Authorization/roleAssignments/write'})) OR (@Request[Microsoft.Authorization/roleAssignments:RoleDefinitionId] ForAnyOfAnyValues:GuidEquals {2a2b9908-6ea1-4ae2-8e65-a410df84e7d1, ba92f5b4-2d11-453d-a403-e96b0029c9fe, b7e6dc6d-f1e8-4753-8033-0f276bb0955b})) AND ((!(ActionMatches{'Microsoft.Authorization/roleAssignments/delete'})) OR (@Resource[Microsoft.Authorization/roleAssignments:RoleDefinitionId] ForAnyOfAnyValues:GuidEquals {2a2b9908-6ea1-4ae2-8e65-a410df84e7d1, ba92f5b4-2d11-453d-a403-e96b0029c9fe, b7e6dc6d-f1e8-4753-8033-0f276bb0955b}))"
          az role assignment create \
            --assignee-object-id $CONSOLE_UAMI_PRINCIPAL \
            --assignee-principal-type ServicePrincipal \
            --role "Role Based Access Control Administrator" \
            --scope "/subscriptions/$DLZ_SUB/resourceGroups/$DLZ_RG" \
            --condition "$COND" --condition-version "2.0" \
            -o table 2>&1 | grep -v "already exists" || echo "RBAC Admin (constrained) already assigned on $DLZ_RG"

      - name: Grant Console UAMI Microsoft Graph roles (Directory.Read.All + User.Read.All)
        # Unblocks /admin/users displayName + department + license
        # enrichment so the page shows real Entra identity data instead of
        # falling back to UPN-only Cosmos activity. Idempotent — only POSTs
        # the assignment when it isn't already present.
        run: |
          export LOOM_UAMI_OBJECT_ID=$CONSOLE_UAMI_PRINCIPAL
          export AZURE_TENANT_ID=$(az account show --query tenantId -o tsv)
          # Pull optional extra roles from repo variable so adminstrators
          # can extend the set without re-coding the workflow.
          if [ -n "${{ vars.LOOM_GRAPH_EXTRA_ROLES }}" ]; then
            export LOOM_GRAPH_EXTRA_ROLES="${{ vars.LOOM_GRAPH_EXTRA_ROLES }}"
          fi
          bash scripts/csa-loom/grant-uami-graph-roles.sh

      # ── Foundry grants (#1468) ──────────────────────────────────────────────
      # CSA Loom's "Foundry" is an AIServices Cognitive Services account
      # (aifndry-loom-<region>, kind=AIServices) — NOT a classic
      # Microsoft.MachineLearningServices/workspaces. The old steps granted
      # "AzureML Data Scientist" on a MLServices scope; on an AIServices estate
      # the scope doesn't exist, the grant 404s, AND (because the steps had no
      # `continue-on-error`) the failure CASCADE-SKIPPED the dependent grants
      # after it (Compute Operator, Foundry-storage reader, DLZ blob contributor).
      #
      # Fix: detect the account type and grant the CORRECT roles —
      #   AIServices  → Cognitive Services User (a97b65f3-24c7-4388-baec-2e87135dc908)
      #               + Cognitive Services OpenAI User (5e0bd9bd-7b93-4f28-af87-19fc36ad61bd)
      #   MLServices  → AzureML Data Scientist + AzureML Compute Operator (legacy hub)
      # Role GUIDs verified against Microsoft Learn (Azure built-in roles, AI+ML).
      # Every grant below is DECOUPLED — `if: always()` + `continue-on-error: true`
      # — so one failing grant emits a `::warning::` and the rest still run.
      - name: Grant Console UAMI Foundry roles (AIServices → Cognitive Services; MLServices → AzureML)
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          # Built-in role GUIDs (use ids so a misspelled role name can't 404).
          ROLE_COG_USER="a97b65f3-24c7-4388-baec-2e87135dc908"        # Cognitive Services User
          ROLE_COG_OAI_USER="5e0bd9bd-7b93-4f28-af87-19fc36ad61bd"    # Cognitive Services OpenAI User
          ROLE_AML_DS="f6c7c914-8db3-469d-8ca1-694a8f32e121"          # AzureML Data Scientist
          ROLE_AML_CO="e503ece1-11d0-4e8e-8e2c-7a6c3bf38815"          # AzureML Compute Operator

          grant() { # <role-guid> <scope> <label>
            az role assignment create \
              --assignee-object-id "$CONSOLE_UAMI_PRINCIPAL" \
              --assignee-principal-type ServicePrincipal \
              --role "$1" --scope "$2" -o none 2>/tmp/grant.err \
              && echo "  granted $3" \
              || { grep -q "already exists\|RoleAssignmentExists" /tmp/grant.err \
                     && echo "  $3 already assigned" \
                     || echo "::warning::Foundry grant '$3' failed: $(tr -d '\n' </tmp/grant.err)"; }
          }

          # Prefer an AIServices/Cognitive-Services account (the CSA Loom default).
          AISVC=$(az cognitiveservices account list -g "$ADMIN_RG" \
                    --query "[?contains(name,'aifndry') || kind=='AIServices' || kind=='OpenAI'].id | [0]" -o tsv 2>/dev/null || true)
          MLWS=$(az resource list -g "$ADMIN_RG" --resource-type Microsoft.MachineLearningServices/workspaces --query "[0].id" -o tsv 2>/dev/null || true)

          if [ -n "$AISVC" ]; then
            echo "Foundry is an AIServices/Cognitive Services account: $AISVC"
            grant "$ROLE_COG_USER" "$AISVC" "Cognitive Services User"
            grant "$ROLE_COG_OAI_USER" "$AISVC" "Cognitive Services OpenAI User"
          fi
          if [ -n "$MLWS" ]; then
            echo "AzureML (MachineLearningServices) workspace present: $MLWS"
            grant "$ROLE_AML_DS" "$MLWS" "AzureML Data Scientist"
            grant "$ROLE_AML_CO" "$MLWS" "AzureML Compute Operator"
          fi
          if [ -z "$AISVC" ] && [ -z "$MLWS" ]; then
            echo "::warning::No AIServices account and no MachineLearningServices workspace in $ADMIN_RG — Foundry editors will honest-gate. Re-run the deploy with agentFoundryEnabled=true."
          fi

      - name: Grant Console UAMI Storage Blob Data Reader on Foundry storage (unblocks datastores)
        # Decoupled (#1468): runs regardless of the role-grant step's outcome.
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          STG=$(az storage account list -g $ADMIN_RG --query "[?contains(name,'aifound') || contains(name,'aifndry') || contains(name,'foundry') || contains(name,'aml')].id" -o tsv | head -1)
          if [ -n "$STG" ]; then
            echo "Foundry storage: $STG"
            az role assignment create \
              --assignee-object-id $CONSOLE_UAMI_PRINCIPAL \
              --assignee-principal-type ServicePrincipal \
              --role "Storage Blob Data Reader" \
              --scope "$STG" \
              -o table 2>&1 | grep -v "already exists" || echo "Already assigned"
          else
            echo "No Foundry storage in $ADMIN_RG — skipping (AIServices accounts have no managed storage; this is expected)"
          fi

      - name: Grant Console UAMI Storage Blob Data Contributor on DLZ (lakehouse writes + notebook .ipynb backup)
        # The Console UAMI writes Delta files (lakehouse provisioner) AND backs up
        # published Synapse notebooks as .ipynb into ADLS silver/loom/notebooks/
        # (synapse-notebook PUT route → adls-client.uploadFile). Both need Storage
        # Blob Data Contributor on the DLZ data-lake account. Idempotent.
        # Decoupled (#1468): previously cascade-skipped by the AzureML grant failure.
        if: always()
        continue-on-error: true
        run: |
          DLZ_STG=$(az storage account list --subscription "$DLZ_SUB" -g $DLZ_RG --query "[?contains(name,'dls') || contains(name,'lake') || contains(name,'adls')].id" -o tsv | head -1)
          [ -z "$DLZ_STG" ] && DLZ_STG=$(az storage account list --subscription "$DLZ_SUB" -g $DLZ_RG --query "[0].id" -o tsv)
          if [ -n "$DLZ_STG" ]; then
            echo "DLZ data-lake storage: $DLZ_STG"
            az role assignment create \
              --assignee-object-id $CONSOLE_UAMI_PRINCIPAL \
              --assignee-principal-type ServicePrincipal \
              --role "Storage Blob Data Contributor" \
              --scope "$DLZ_STG" \
              -o table 2>&1 | grep -v "already exists" || echo "Already assigned"
          else
            echo "No data-lake storage in $DLZ_RG — skipping"
          fi

      - name: Wire org-visuals (F22/F23) — Storage Blob Delegator grant + LOOM_ORG_VISUALS_URL env on console
        # Deploy-readiness: in tenant / dlz-attach topology the admin plane is NOT
        # redeployed, so admin-plane/main.bicep leaves loomStorageAccount empty and
        # neither the org-visuals env (LOOM_ORG_VISUALS_URL + medallion/CSV URLs)
        # nor the Storage Blob Delegator grant lands → Embed codes (F22) + Org
        # visuals (F23) 503 not-configured. The account-wide Storage Blob Data
        # Contributor grant above already covers the org-visuals CONTAINER writes;
        # the only extra grant needed is Storage Blob Delegator (account scope) so
        # getUserDelegationKey() can mint the read-only embed SAS. This step adds
        # that grant and wires the storage env vars onto the live console app —
        # mirroring scripts/csa-loom/patch-navigator-env.sh's storage block. The
        # single-sub path already gets all of this from bicep; this is the
        # tenant/dlz-attach bridge. Idempotent. Skips cleanly if no DLZ HNS account.
        # Honors loomBackends.orgVisuals=disabled via the LOOM_ORG_VISUALS_DISABLED
        # repo var (set it to '1' to keep the panes honestly gated after a deploy).
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ "${LOOM_ORG_VISUALS_DISABLED:-0}" = "1" ]; then
            echo "::notice::LOOM_ORG_VISUALS_DISABLED=1 — leaving Embed codes / Org visuals honestly gated (opt-out)."
            exit 0
          fi
          # Discover the DLZ HNS (Data Lake) account — reuse-first via repo var.
          SA_ACCT="${EXISTING_LOOM_STORAGE_ACCOUNT:-}"
          if [ -z "$SA_ACCT" ]; then
            SA_ACCT=$(az storage account list --subscription "$DLZ_SUB" -g "$DLZ_RG" \
              --query "[?starts_with(name,'saloom') && isHnsEnabled].name | [0]" -o tsv 2>/dev/null)
            [ -z "$SA_ACCT" ] && SA_ACCT=$(az storage account list --subscription "$DLZ_SUB" -g "$DLZ_RG" \
              --query "[?isHnsEnabled].name | [0]" -o tsv 2>/dev/null)
          fi
          if [ -z "$SA_ACCT" ]; then
            echo "::notice::No HNS (Data Lake) account in $DLZ_RG — Embed codes / Org visuals stay honestly gated."
            exit 0
          fi
          echo "DLZ ADLS account: $SA_ACCT"
          SA_ID=$(az storage account show --subscription "$DLZ_SUB" -n "$SA_ACCT" -g "$DLZ_RG" --query id -o tsv)
          # Storage Blob Delegator (account scope) — getUserDelegationKey for embed SAS.
          az role assignment create \
            --assignee-object-id "$CONSOLE_UAMI_PRINCIPAL" \
            --assignee-principal-type ServicePrincipal \
            --role "Storage Blob Delegator" \
            --scope "$SA_ID" \
            -o table 2>&1 | grep -v "already exists" || echo "Storage Blob Delegator already assigned"
          # Wire the storage env on the live console app (single merged revision).
          SA_BLOB=$(az storage account show --subscription "$DLZ_SUB" -n "$SA_ACCT" -g "$DLZ_RG" --query "primaryEndpoints.blob" -o tsv)
          SA_DFS=$(az storage account show --subscription "$DLZ_SUB" -n "$SA_ACCT" -g "$DLZ_RG"  --query "primaryEndpoints.dfs"  -o tsv)
          SA_BLOB="${SA_BLOB%/}"; SA_DFS="${SA_DFS%/}"
          CONSOLE_APP="${LOOM_CONSOLE_APP:-loom-console}"
          az containerapp update -g "$ADMIN_RG" -n "$CONSOLE_APP" --set-env-vars \
            "LOOM_ADLS_ACCOUNT=$SA_ACCT" \
            "LOOM_ORG_VISUALS_URL=$SA_BLOB/org-visuals" \
            "LOOM_BRONZE_URL=$SA_DFS/bronze" \
            "LOOM_SILVER_URL=$SA_DFS/silver" \
            "LOOM_GOLD_URL=$SA_DFS/gold" \
            "LOOM_LANDING_URL=$SA_DFS/landing" \
            "LOOM_CSV_IMPORTS_URL=$SA_DFS/csv-imports" \
            -o none 2>&1 | tail -2 \
            && echo "Wired LOOM_ORG_VISUALS_URL + medallion URLs on $CONSOLE_APP" \
            || echo "::warning::Could not update $CONSOLE_APP env — run scripts/csa-loom/patch-navigator-env.sh manually."

      - name: Grant Console UAMI Cognitive Services User on Content Safety (unblocks /items/content-safety)
        run: |
          CS=$(az cognitiveservices account list -g $ADMIN_RG --query "[?kind=='ContentSafety'].id" -o tsv | head -1)
          if [ -n "$CS" ]; then
            echo "Content Safety: $CS"
            az role assignment create \
              --assignee-object-id $CONSOLE_UAMI_PRINCIPAL \
              --assignee-principal-type ServicePrincipal \
              --role "Cognitive Services User" \
              --scope "$CS" \
              -o table 2>&1 | grep -v "already exists" || echo "Already assigned"
          else
            echo "No Content Safety in $ADMIN_RG — skipping"
          fi

      - name: Verify AOAI account + gpt-4o deployment, self-heal Console UAMI grants (unblocks Copilot / data-agent / AI functions)
        run: |
          # Deploy-readiness safety-net (PRP gap #6). The dedicated AOAI account
          # aifndry-loom-<region> + its chat/embedding deployments are provisioned
          # by bicep (agentFoundryEnabled defaults true). This step VERIFIES the
          # account + a gpt-4o-class chat deployment exist and RE-GRANTS the three
          # Console UAMI inference roles (idempotent) so a partial deploy (account
          # created but a role grant raced/failed) self-heals — Copilot,
          # data-agents and AI functions then work on first login. If the account
          # is missing entirely, it prints the exact remediation (re-run the
          # deploy with agentFoundryEnabled=true) rather than silently passing.
          AOAI=$(az cognitiveservices account list -g $ADMIN_RG \
            --query "[?kind=='AIServices' && starts_with(name,'aifndry-loom')].name" -o tsv | head -1)
          if [ -z "$AOAI" ]; then
            AOAI=$(az cognitiveservices account list -g $ADMIN_RG \
              --query "[?kind=='AIServices' || kind=='OpenAI'].name" -o tsv | head -1)
          fi
          if [ -z "$AOAI" ]; then
            echo "::warning::No AOAI (AIServices) account in $ADMIN_RG. Copilot / data-agent / AI-functions will honest-gate. Re-run the deploy with agentFoundryEnabled=true (default) to provision aifndry-loom-<region> + gpt-4o + embeddings."
          else
            AOAI_ID=$(az cognitiveservices account show -n "$AOAI" -g $ADMIN_RG --query id -o tsv)
            echo "AOAI account: $AOAI"
            CHAT=$(az cognitiveservices account deployment list -n "$AOAI" -g $ADMIN_RG \
              --query "[?contains(to_string(properties.model.name) || '','gpt-4')].name | [0]" -o tsv 2>/dev/null || true)
            if [ -z "$CHAT" ]; then
              echo "::warning::AOAI account $AOAI has no gpt-4o-class chat deployment. Re-run the deploy (agentFoundryEnabled=true deploys 'chat' = gpt-4o) or deploy a gpt-4o model to it."
            else
              echo "AOAI chat deployment present: $CHAT"
            fi
            # Re-grant the three Console UAMI inference roles (idempotent).
            for ROLE in "Azure AI Developer" "Cognitive Services User" "Cognitive Services OpenAI User"; do
              az role assignment create \
                --assignee-object-id $CONSOLE_UAMI_PRINCIPAL \
                --assignee-principal-type ServicePrincipal \
                --role "$ROLE" \
                --scope "$AOAI_ID" \
                -o none 2>&1 | grep -v "already exists" || echo "  $ROLE: already assigned"
            done
            # Self-heal the Spark MSI grants (Synapse workspace MSI + Databricks
            # Access Connector) so notebook ai.* functions can call AOAI.
            SYN_MI=$(az synapse workspace list --query "[?contains(name,'syn') || contains(name,'loom')].identity.principalId | [0]" -o tsv 2>/dev/null || true)
            if [ -n "$SYN_MI" ] && [ "$SYN_MI" != "None" ]; then
              az role assignment create \
                --assignee-object-id "$SYN_MI" \
                --assignee-principal-type ServicePrincipal \
                --role "Cognitive Services OpenAI User" \
                --scope "$AOAI_ID" \
                -o none 2>&1 | grep -v "already exists" || echo "  Synapse MSI OpenAI User: already assigned"
            fi
          fi

      - name: Assign Power Platform Administrator directory role to the Console UAMI (Graph)
        run: |
          # WHY THIS STEP EXISTS (#3375)
          #
          #   docs/fiab/operator-interactive-setup.md used to ask the operator to
          #   click this grant in the Power Platform / Entra admin centre — and the
          #   same doc's tail recorded that it had ALREADY been done via Microsoft
          #   Graph by hand, naming this exact role template id. A portal paragraph
          #   for an action the platform can perform is a defect under
          #   .claude/rules/auto-bind-by-default.md §5 and ux-baseline.md G2, so the
          #   bootstrap performs it here instead.
          #
          # WHAT IT DOES
          #
          #   Assigns the built-in Entra directory role "Power Platform
          #   Administrator" (role template id 11648597-926c-4cf3-9c36-bcebb0ba8dcc
          #   — https://learn.microsoft.com/entra/identity/role-based-access-control/permissions-reference)
          #   to the Console UAMI's service principal at tenant scope ("/").
          #
          #   Per Create unifiedRoleAssignment
          #   (https://learn.microsoft.com/graph/api/rbacapplication-post-roleassignments)
          #   `roleDefinitionId` accepts the service-wide roleTemplateId directly, and
          #   the principal "can be a user or service principal" — so no intermediary
          #   role-assignable group is needed (the by-hand run used one; a direct
          #   assignment is the same grant with one less object to keep in sync).
          #
          # IDEMPOTENCY
          #
          #   Pre-checks with a filtered GET; a re-run on an already-assigned tenant
          #   makes no POST. If the pre-check is inconclusive the POST still runs and
          #   a duplicate is recognised from Graph's conflict response, so re-running
          #   can never produce a spurious failure.
          #
          # FAILS CLOSED, CLASSIFIED
          #
          #   Every non-success outcome is classified (403 = the bootstrap principal
          #   lacks RoleManagement.ReadWrite.Directory; 400-conflict = already
          #   assigned; anything else = reported verbatim). Nothing is discarded and
          #   no message asserts a cause the code did not establish
          #   (deploy-integrity.md R7). A 403 is NON-FATAL and prints the one-time
          #   Global-Admin remediation, matching the MIP/DLP AppRole step below:
          #   the Power Platform surfaces then keep their honest gate
          #   (lib/gates/registry svc-powerplatform) rather than the deploy failing.
          set -uo pipefail
          PP_ADMIN_ROLE_TEMPLATE_ID="11648597-926c-4cf3-9c36-bcebb0ba8dcc"

          if [ -z "${CONSOLE_UAMI_PRINCIPAL:-}" ]; then
            echo "::warning title=Power Platform Administrator role not assigned::Console UAMI principal id is empty — cannot assign the directory role. Set the LOOM_CONSOLE_UAMI_PRINCIPAL repo var or check the UAMI discovery step above."
            exit 0
          fi

          GRAPH_TOKEN=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
          if [ -z "$GRAPH_TOKEN" ]; then
            echo "::warning title=Power Platform Administrator role not assigned::Could not acquire a Microsoft Graph token for the bootstrap principal. This step did NOT establish whether the role is assigned."
            exit 0
          fi

          # ── Pre-check: is the assignment already present? ────────────────────
          # An inconclusive pre-check (non-200) must NOT be read as "not assigned"
          # — we fall through to the POST, which distinguishes the two for real.
          CHECK_URL="https://graph.microsoft.com/v1.0/roleManagement/directory/roleAssignments?\$filter=principalId%20eq%20'${CONSOLE_UAMI_PRINCIPAL}'%20and%20roleDefinitionId%20eq%20'${PP_ADMIN_ROLE_TEMPLATE_ID}'"
          CHECK_CODE=$(curl -sS -w "%{http_code}" -o /tmp/pprole-check.json -X GET "$CHECK_URL" \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            -H "ConsistencyLevel: eventual")
          if [ "$CHECK_CODE" = "200" ] && grep -q '"roleDefinitionId"' /tmp/pprole-check.json 2>/dev/null; then
            echo "  Power Platform Administrator already assigned to the Console UAMI (idempotent — no change)."
            exit 0
          fi
          if [ "$CHECK_CODE" != "200" ]; then
            echo "  Pre-check inconclusive (HTTP $CHECK_CODE) — attempting the assignment; a duplicate is detected from the POST response."
          fi

          # ── Assign ───────────────────────────────────────────────────────────
          PAYLOAD=$(printf '{"@odata.type":"#microsoft.graph.unifiedRoleAssignment","principalId":"%s","roleDefinitionId":"%s","directoryScopeId":"/"}' \
            "$CONSOLE_UAMI_PRINCIPAL" "$PP_ADMIN_ROLE_TEMPLATE_ID")
          R=$(curl -sS -w "%{http_code}" -o /tmp/pprole.json -X POST \
            "https://graph.microsoft.com/v1.0/roleManagement/directory/roleAssignments" \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$R" = "201" ]; then
            echo "  Power Platform Administrator assigned to the Console UAMI at tenant scope."
            echo "  NOTE: Entra -> Power Platform propagation takes ~5-15 minutes before the BAP API stops returning 403."
          elif grep -qi "conflicting object\|already exist" /tmp/pprole.json 2>/dev/null; then
            echo "  Power Platform Administrator already assigned (idempotent — Graph reported a conflicting object)."
          elif [ "$R" = "403" ]; then
            echo "  Assignment returned 403: $(cat /tmp/pprole.json)"
            echo "::warning title=Power Platform Administrator role not assigned (403)::The bootstrap principal cannot write directory role assignments. Power Platform + Copilot Studio surfaces keep their honest gate (svc-powerplatform) until a Global Administrator runs the one-time grant below, then this job is re-run."
            echo ""
            echo "  ===================================================================="
            echo "  ONE-TIME TENANT ACTION — a Global Administrator runs ONCE:"
            echo "    Grant the deploy SP the Microsoft Graph application permission"
            echo "    RoleManagement.ReadWrite.Directory (app role id"
            echo "    9e3f62cf-ca93-4989-b6ce-bf83c28f9fe8), OR assign the deploy SP"
            echo "    the Privileged Role Administrator directory role."
            echo "    Then re-run this job — the assignment succeeds unattended thereafter."
            echo "  ===================================================================="
          else
            echo "::warning title=Power Platform Administrator role not assigned::Graph returned HTTP $R. This step did NOT establish the cause; the response body follows."
            cat /tmp/pprole.json
            echo
          fi

      - name: Register Console UAMI as Power Platform Management App (unblocks PP + Copilot Studio editors)
        run: |
          # PP admin API for SP access requires the SP to be registered as a
          # tenant-wide PP management app — separate from the Power Platform
          # Admin Entra role assigned in the step above.
          #
          # This one is GENUINELY human-only in the general case: Microsoft
          # documents that "a service principal can't register itself. By design,
          # an administrator using username and password context must register the
          # application."
          # https://learn.microsoft.com/power-platform/admin/powerplatform-api-create-service-principal
          # The PUT is attempted anyway because it succeeds where the deploy
          # principal is already a registered management app, and it is idempotent
          # (returns 200 on re-run). When it does not succeed the surfaces keep
          # their registered honest gate (svc-powerplatform) with its Fix-it.
          PP_TOKEN=$(az account get-access-token --resource https://api.bap.microsoft.com --query accessToken -o tsv)
          R=$(curl -sS -w "%{http_code}" -o /tmp/pp.json -X PUT \
            "https://api.bap.microsoft.com/providers/Microsoft.BusinessAppPlatform/adminApplications/$CONSOLE_UAMI_CLIENT?api-version=2020-10-01" \
            -H "Authorization: Bearer $PP_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "PP management app PUT: $R"
          cat /tmp/pp.json
          echo
          if [[ "$R" == "200" ]] || [[ "$R" == "201" ]]; then
            echo "  Power Platform + Copilot Studio editors unlocked."
          else
            # R7 — do not assert a cause this step did not establish. The most
            # common reason is the documented SP-cannot-self-register constraint,
            # not a missing role; say what we know and name both possibilities.
            echo "  PP management app PUT returned $R — NOT registered."
            echo "  Microsoft requires an administrator USER context for this registration"
            echo "  (a service principal cannot self-register), so a non-200 here is the"
            echo "  EXPECTED outcome on a tenant where a human has not yet run:"
            echo "    New-PowerAppManagementApp -ApplicationId <console-uami-client-id>"
            echo "  (scripts/csa-loom/grant-powerplatform-sp.ps1). Until then the Power"
            echo "  Platform surfaces show their registered honest gate + Fix-it"
            echo "  (lib/gates/registry svc-powerplatform). See"
            echo "  docs/fiab/tenant-admin-walkthroughs.md."
          fi

      - name: Register MSAL SP as Dataverse Application User in every env that has Dataverse
        run: |
          # For each env with Dataverse, register the MSAL Web App SP as an
          # Application User with System Administrator. Idempotent — skips
          # envs where the AppUser already exists. Requires the caller to
          # already be SA on each env (Default env needs one-time Promote To
          # Admin click; see docs/fiab/dataverse-app-user.md Step 1).
          if [ -z "${LOOM_MSAL_CLIENT_ID:-}" ]; then
            echo "  LOOM_MSAL_CLIENT_ID not set — skipping Dataverse AppUser registration"
          else
            # The script's exit status was previously discarded with `|| true`, so a
            # failed registration was indistinguishable from a clean run and the
            # operator was told (in the runbook) to go do it by hand. Capture the
            # status and SURFACE it instead — still non-fatal, because a tenant with
            # no Dataverse environment is a legitimate no-op, but never silent
            # (deploy-integrity.md: a discarded result is a gate that cannot fail).
            set +e
            LOOM_MSAL_CLIENT_ID="$LOOM_MSAL_CLIENT_ID" \
              bash scripts/csa-loom/dataverse-add-appuser.sh
            DV_RC=$?
            set -e
            if [ "$DV_RC" -eq 0 ]; then
              echo "  Dataverse Application User registration completed (idempotent)."
            else
              echo "::warning title=Dataverse Application User registration incomplete (exit $DV_RC)::dataverse-add-appuser.sh did not complete. Most common cause: the bootstrap identity is not yet Dataverse System Administrator on an environment where Dataverse was added AFTER the environment was created (the one-time 'Promote To Admin' click — docs/fiab/dataverse-app-user.md Step 1). The Dataverse-backed editors keep their honest gate until this succeeds; re-run this job after the promotion."
            fi
          fi

      - name: Grant MIP+DLP Graph AppRoles (Information Protection + DLP for /admin/security)
        run: |
          # Grant the Console UAMI five Microsoft Graph application
          # permissions required by /admin/security + /governance DLP:
          #   - InformationProtectionPolicy.Read.All  (MIP labels + policies)
          #   - SensitivityLabel.Evaluate              (apply-label action)
          #   - Policy.Read.All                        (DLP policies + rules)
          #   - SecurityAlert.Read.All                 (DLP alerts/violations via alerts_v2)
          #   - SecurityIncident.Read.All              (Graph Security incidents — alerts_v2
          #                                             403 names this alongside SecurityAlert;
          #                                             granting both clears the DLP/IP
          #                                             "Missing application roles" gate)
          #
          # Each grant is idempotent — re-runs cleanly. For a MANAGED IDENTITY
          # the appRoleAssignment POST below IS the grant: it takes effect
          # immediately, with NO separate "Grant admin consent" click (that is
          # the app-registration pattern, not the MI pattern). The ONLY
          # prerequisite is that the bootstrap principal can assign Graph app
          # roles — i.e. it holds AppRoleAssignment.ReadWrite.All on Microsoft
          # Graph. If it doesn't, the POST returns 403 and we surface the exact
          # one-time tenant remediation below (non-fatal — the /admin/security
          # tabs then render the honest 503 NotConfigured MessageBar).
          set -uo pipefail
          GRAPH_SP_ID=$(az ad sp list --filter "appId eq '00000003-0000-0000-c000-000000000000'" --query "[0].id" -o tsv)
          FORBIDDEN=0
          if [ -z "$GRAPH_SP_ID" ]; then
            echo "  Could not resolve Microsoft Graph SP — skipping AppRole grants"
          else
            echo "Microsoft Graph SP object id: $GRAPH_SP_ID"
            for ROLE in \
              "InformationProtectionPolicy.Read.All:19da66cb-0fb0-4390-b071-ebc76a349482" \
              "SensitivityLabel.Evaluate:57f0b71b-a759-45a0-9a0f-cc099fbd9a44" \
              "Policy.Read.All:246dd0d5-5bd0-4def-940b-0421030a5b68" \
              "SecurityAlert.Read.All:bf394140-e372-4bf9-a898-299cfc7564e5" \
              "SecurityIncident.Read.All:45cc0394-e837-488b-a098-1918f48d186c" \
            ; do
              NAME="${ROLE%%:*}"
              APPROLE_ID="${ROLE##*:}"
              echo "Granting Graph AppRole $NAME ($APPROLE_ID) to Console UAMI..."
              PAYLOAD=$(printf '{"principalId":"%s","resourceId":"%s","appRoleId":"%s"}' \
                "$CONSOLE_UAMI_PRINCIPAL" "$GRAPH_SP_ID" "$APPROLE_ID")
              R=$(curl -sS -w "%{http_code}" -o /tmp/approle.json -X POST \
                "https://graph.microsoft.com/v1.0/servicePrincipals/$CONSOLE_UAMI_PRINCIPAL/appRoleAssignments" \
                -H "Authorization: Bearer $(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")
              if [[ "$R" == "201" ]]; then
                echo "  $NAME granted"
              elif grep -q "Permission being assigned already exists" /tmp/approle.json 2>/dev/null; then
                echo "  $NAME already granted (idempotent)"
              elif [[ "$R" == "403" ]]; then
                FORBIDDEN=1
                echo "  $NAME grant 403 FORBIDDEN — bootstrap principal cannot assign Graph app roles."
              else
                echo "  $NAME grant returned $R: $(cat /tmp/approle.json)"
              fi
            done
            if [[ "$FORBIDDEN" == "1" ]]; then
              echo "::warning title=MIP/DLP Graph AppRoles not granted (403)::Deploy SP lacks AppRoleAssignment.ReadWrite.All on Microsoft Graph. /admin/security MIP+DLP tabs stay on the honest 503 NotConfigured gate until a Global Admin runs the one-time grant — see docs/fiab/v3-tenant-bootstrap.md (Step: Grant the deploy SP Graph AppRoleAssignment.ReadWrite.All)."
              echo ""
              echo "  ===================================================================="
              echo "  ONE-TIME TENANT ACTION — a Global Administrator runs ONCE:"
              echo "    DEPLOY_SP_OBJID=<deploy SP service-principal object id>"
              echo "    GRAPH_SP_ID=\$(az ad sp list --filter \"appId eq '00000003-0000-0000-c000-000000000000'\" --query '[0].id' -o tsv)"
              echo "    APPROLE_RW=\$(az ad sp show --id \$GRAPH_SP_ID --query \"appRoles[?value=='AppRoleAssignment.ReadWrite.All'].id | [0]\" -o tsv)"
              echo "    az rest --method POST --url \"https://graph.microsoft.com/v1.0/servicePrincipals/\$DEPLOY_SP_OBJID/appRoleAssignments\" \\"
              echo "      --headers 'Content-Type=application/json' \\"
              echo "      --body \"{\\\"principalId\\\":\\\"\$DEPLOY_SP_OBJID\\\",\\\"resourceId\\\":\\\"\$GRAPH_SP_ID\\\",\\\"appRoleId\\\":\\\"\$APPROLE_RW\\\"}\""
              echo "  Then re-run this job — the grants succeed unattended thereafter."
              echo "  (Assigning an app role to the Console MI IS the grant — no admin-consent click.)"
              echo "  ===================================================================="
            else
              echo ""
              echo "  Graph AppRoles assigned to the Console UAMI — effective immediately (MI app-role assignment = grant; no admin-consent click)."
            fi
          fi

      - name: Ensure AI Search governance catalog index (loom-governance-items, day-one)
        # Day-one gap closure (#1470): the Governance → Catalog page queries the
        # `loom-governance-items` AI Search index; on a fresh deploy it doesn't
        # exist yet, so the page 404'd ("index not found" → "Could not load
        # catalog"). Create it here so the catalog loads on first sign-in. The
        # search service is PE-locked + disableLocalAuth=true, so the script flips
        # publicNetworkAccess on for the PUT window (AAD token), then restores it.
        # The Console BFF also self-heals the index from inside the VNet on first
        # load, so this step is belt-and-braces; non-fatal on failure.
        if: always()
        continue-on-error: true
        env:
          # BYO existing search service wins; else discover the deployed one.
          EXISTING_AI_SEARCH_SERVICE: ${{ vars.LOOM_AI_SEARCH_SERVICE || '' }}
          EXISTING_AI_SEARCH_RG: ${{ vars.LOOM_AI_SEARCH_RG || '' }}
          # Sovereign data-plane host suffix (US Gov uses search.usgovcloudapi.net).
          SEARCH_SUFFIX: ${{ vars.LOOM_SEARCH_SUFFIX || 'search.windows.net' }}
        run: |
          set -uo pipefail
          SEARCH_SERVICE="${EXISTING_AI_SEARCH_SERVICE:-}"
          SEARCH_RG="${EXISTING_AI_SEARCH_RG:-$ADMIN_RG}"
          SEARCH_SUB="$ADMIN_SUB"
          if [ -z "$SEARCH_SERVICE" ]; then
            # ai-search.bicep names it search-loom-<uniqueString(rg)>. Discover in the admin RG.
            SEARCH_SERVICE=$(az search service list -g "$ADMIN_RG" --subscription "$ADMIN_SUB" \
              --query "[?starts_with(name,'search-loom')].name | [0]" -o tsv 2>/dev/null || true)
            [ -z "$SEARCH_SERVICE" ] && SEARCH_SERVICE=$(az search service list -g "$ADMIN_RG" --subscription "$ADMIN_SUB" \
              --query "[0].name" -o tsv 2>/dev/null || true)
          fi
          if [ -z "$SEARCH_SERVICE" ]; then
            echo "::notice::No AI Search service in $ADMIN_RG (aiSearchEnabled=false or BYO not set) — catalog stays on the Cosmos fallback. Skipping index ensure."
            exit 0
          fi
          echo "AI Search service: $SEARCH_SERVICE (rg=$SEARCH_RG)"
          chmod +x scripts/csa-loom/ensure-search-index.sh
          SEARCH_SERVICE="$SEARCH_SERVICE" SEARCH_RG="$SEARCH_RG" SUBSCRIPTION="$SEARCH_SUB" \
            SEARCH_SUFFIX="$SEARCH_SUFFIX" \
            bash scripts/csa-loom/ensure-search-index.sh \
            || echo "::warning::Governance index ensure incomplete — the Console BFF self-heals it on first catalog load."

      - name: Provision SCC labels + DLP sidecar (label, label-policy & DLP CRUD)
        if: always()
        continue-on-error: true
        run: |
          # Sets up the Security & Compliance PowerShell sidecar that backs
          # sensitivity-label + label-policy CRUD AND DLP compliance-policy CRUD
          # (create/edit/delete) on /admin/security. Microsoft Graph has no write
          # surface for labels, label policies, OR DLP policies, so all of these
          # run through SCC PowerShell (New-/Set-/Remove-Label, *-LabelPolicy, and
          # Get/New/Set/Remove-DlpCompliancePolicy + *-DlpComplianceRule) via the
          # azure-functions/scc-labels Function app (labels/ + dlp/ functions),
          # authenticated with the SAME certificate-based app (Exchange.ManageAsApp
          # + Compliance Administrator — those rights cover both label and DLP
          # cmdlets, so no extra grant is needed for DLP CRUD).
          #
          # This step performs the automatable parts (app registration, the
          # Exchange.ManageAsApp grant, the Compliance Administrator role
          # assignment, and — when the Function app exists — publishing the
          # code, which now includes the dlp/ function). The auth certificate
          # upload + Tenant Admin consent + the re-deploy with
          # loomMipAdminEnabled=true and/or loomDlpAdminEnabled=true remain
          # one-time manual actions, printed at the end of the script. Until
          # then label/DLP-policy READS work and CRUD returns the honest
          # 'mip_admin_not_configured' / 'dlp_admin_not_configured' gate (no vaporware).
          set +e
          SCC_FUNCTION_APP=$(az functionapp list -g "$ADMIN_RG" --query "[?starts_with(name,'func-scclbl-')].name | [0]" -o tsv 2>/dev/null)
          if [ -n "$SCC_FUNCTION_APP" ]; then
            echo "Found SCC labels Function app: $SCC_FUNCTION_APP — provisioning + publishing code (labels + dlp functions)."
            SCC_FUNCTION_APP="$SCC_FUNCTION_APP" SCC_FUNCTION_RG="$ADMIN_RG" \
              bash scripts/csa-loom/provision-scc-labels-sidecar.sh || true
          else
            echo "No func-scclbl-* Function app found in $ADMIN_RG."
            echo "Deploy with loomMipAdminEnabled=true (label CRUD) and/or loomDlpAdminEnabled=true (DLP CRUD) to create it, then re-run this job."
            echo "Running the app/role provisioning portion now so the SCC app exists ahead of the next deploy:"
            bash scripts/csa-loom/provision-scc-labels-sidecar.sh || true
          fi

      - name: Deploy + wire Govern posture-refresh Function (day-one)
        if: always()
        continue-on-error: true
        run: |
          # Day-one gap closure (#1470): the Govern tab's on-open posture refresh
          # needs the posture-refresh Function (LOOM_POSTURE_FUNCTION_URL was empty
          # → "On-open refresh not provisioned" gate). Provision it END-TO-END here
          # rather than in the main deploy (the Function needs the Cosmos endpoint,
          # which would create an admin-plane→DLZ ordering coupling): (1) DEPLOY the
          # bicep into the admin RG if the app is absent, (2) PUBLISH the code,
          # (3) store the host key in Key Vault (loom-posture-function-key), and
          # (4) set LOOM_POSTURE_FUNCTION_URL + the LOOM_POSTURE_FUNCTION_KEY
          # secretRef on the Console app. The Console BFF still computes posture LIVE
          # from Cosmos, so this is a latency pre-warm + on-open recompute, never a
          # hard dependency. Every sub-step is best-effort; the honest gate in
          # app/api/governance/govern/refresh/route.ts remains until the URL lands.
          set +e
          POSTURE_FUNC=$(az functionapp list -g "$ADMIN_RG" --subscription "$ADMIN_SUB" --query "[?starts_with(name, 'func-loom-posture')].name | [0]" -o tsv 2>/dev/null)
          # Resolve the Loom Cosmos account (admin RG first, then DLZ) for the bicep params.
          COSMOS_ACCT=$(az cosmosdb list --subscription "$ADMIN_SUB" -g "$ADMIN_RG" --query "[?starts_with(name,'cosmos-loom')].name | [0]" -o tsv 2>/dev/null)
          COSMOS_RG="$ADMIN_RG"; COSMOS_SUB="$ADMIN_SUB"
          if [ -z "$COSMOS_ACCT" ]; then
            COSMOS_ACCT=$(az cosmosdb list --subscription "$DLZ_SUB" -g "$DLZ_RG" --query "[?starts_with(name,'cosmos-loom')].name | [0]" -o tsv 2>/dev/null)
            COSMOS_RG="$DLZ_RG"; COSMOS_SUB="$DLZ_SUB"
          fi
          if [ -z "$POSTURE_FUNC" ]; then
            if [ -z "$COSMOS_ACCT" ]; then
              echo "::warning::No Loom Cosmos account found in $ADMIN_RG or $DLZ_RG — cannot deploy posture-refresh. Govern stays on the live-compute path (honest gate). Re-run after Cosmos exists."
            else
              COSMOS_ENDPOINT=$(az cosmosdb show -n "$COSMOS_ACCT" -g "$COSMOS_RG" --subscription "$COSMOS_SUB" --query documentEndpoint -o tsv 2>/dev/null)
              echo "Deploying posture-refresh Function into $ADMIN_RG (cosmos=$COSMOS_ACCT)…"
              az deployment group create --subscription "$ADMIN_SUB" -g "$ADMIN_RG" \
                --name posture-refresh-$(date +%s) \
                -f azure-functions/posture-refresh/deploy/main.bicep \
                -p loomCosmosEndpoint="$COSMOS_ENDPOINT" \
                   loomCosmosAccountName="$COSMOS_ACCT" \
                   loomCosmosAccountResourceGroup="$COSMOS_RG" \
                -o none \
                && echo "  posture-refresh deployed." \
                || echo "::warning::posture-refresh bicep deploy failed (deploy SP rights on $ADMIN_RG? cross-RG Cosmos RBAC?) — re-run; Govern stays on live-compute."
              POSTURE_FUNC=$(az functionapp list -g "$ADMIN_RG" --subscription "$ADMIN_SUB" --query "[?starts_with(name, 'func-loom-posture')].name | [0]" -o tsv 2>/dev/null)
            fi
          fi
          if [ -z "$POSTURE_FUNC" ]; then
            echo "  No posture-refresh Function App (deploy step did not yield one) — skipping publish + wiring."
            exit 0
          fi
          echo "posture-refresh Function App: $POSTURE_FUNC"
          # Publish code (best-effort; needs func Core Tools on the runner).
          if command -v func >/dev/null 2>&1; then
            echo "Publishing posture-refresh code to $POSTURE_FUNC ..."
            ( cd azure-functions/posture-refresh && func azure functionapp publish "$POSTURE_FUNC" --python ) \
              || echo "  publish non-zero — re-run: cd azure-functions/posture-refresh && func azure functionapp publish $POSTURE_FUNC --python"
          else
            echo "  func Core Tools not on runner — skipping code publish (re-run from a runner that has it)."
          fi
          # Resolve the Function base URL + host key; store the key in Key Vault.
          FUNC_HOST=$(az functionapp show -n "$POSTURE_FUNC" -g "$ADMIN_RG" --subscription "$ADMIN_SUB" --query defaultHostName -o tsv 2>/dev/null)
          FUNC_URL="https://${FUNC_HOST}"
          HOST_KEY=$(az functionapp keys list -n "$POSTURE_FUNC" -g "$ADMIN_RG" --subscription "$ADMIN_SUB" --query "functionKeys.default || masterKey" -o tsv 2>/dev/null)
          KV_NAME=$(az keyvault list -g "$ADMIN_RG" --subscription "$ADMIN_SUB" --query "[?starts_with(name,'kv-loom')].name | [0]" -o tsv 2>/dev/null)
          [ -z "$KV_NAME" ] && KV_NAME=$(az keyvault list -g "$ADMIN_RG" --subscription "$ADMIN_SUB" --query "[0].name" -o tsv 2>/dev/null)
          if [ -n "$HOST_KEY" ] && [ -n "$KV_NAME" ]; then
            # KV is private — scope a single-IP firewall allow to this runner for
            # the write window (default-action stays Deny; do NOT open to the whole
            # internet), then restore it. #2855: the close used to be inline
            # `az keyvault update ... 2>/dev/null` inside a `set +e` step that is
            # ALSO continue-on-error, so a failed re-lock was invisible three ways
            # over and left the secret vault public. It now goes through the
            # verified helper, and the always() restore step at the end of this job
            # is the enforcing check.
            KV_PNA=$(az keyvault show -n "$KV_NAME" --query "properties.publicNetworkAccess" -o tsv 2>/dev/null || echo Enabled)
            if [ "$KV_PNA" != "Enabled" ]; then
              bash scripts/csa-loom/kv-firewall-window.sh open --vault "$KV_NAME" \
                || echo "::warning::Could not open the Key Vault write window for loom-posture-function-key."
            fi
            az keyvault secret set --vault-name "$KV_NAME" --name loom-posture-function-key --value "$HOST_KEY" -o none 2>/dev/null \
              && echo "  Stored host key in KV $KV_NAME/loom-posture-function-key." \
              || echo "::warning::Could not write loom-posture-function-key to $KV_NAME — the URL still works without the key if the Function allows anonymous; else set the secret manually."
            if [ "$KV_PNA" != "Enabled" ]; then
              LOOM_KV_WINDOW_SOFT_FAIL=1 bash scripts/csa-loom/kv-firewall-window.sh close --vault "$KV_NAME" || true
            fi
          fi
          # Set the URL on the Console (and the key secretRef if a KV secret exists).
          if [ -n "$FUNC_HOST" ]; then
            az containerapp update -g "$ADMIN_RG" -n loom-console \
              --set-env-vars "LOOM_POSTURE_FUNCTION_URL=$FUNC_URL" -o none 2>/dev/null \
              && echo "  Wired LOOM_POSTURE_FUNCTION_URL=$FUNC_URL on loom-console." \
              || echo "::warning::Could not set LOOM_POSTURE_FUNCTION_URL on loom-console — set it manually (admin-plane param loomPostureFunctionUrl)."
          fi

      - name: Deploy + wire Iceberg REST Catalog (external-engine federation, day-one)
        if: always()
        continue-on-error: true
        run: |
          # Day-one gap closure (#2757): the Iceberg REST Catalog container
          # (Unity Catalog OSS serving the Apache Iceberg REST spec) lets external
          # engines — Trino / Spark / DuckDB / Snowflake — DISCOVER + browse Loom
          # lakehouse tables (namespaces, table listing, credential vending)
          # instead of being handed raw ADLS paths. The bicep module exists
          # (data-plane/iceberg-catalog-aca.bicep) but was orphaned from every
          # deploy path by the ARM 256-param ceiling, so LOOM_ICEBERG_CATALOG_URL
          # was never set and /admin/catalog showed "not configured".
          #
          # Provision it END-TO-END here, following the posture-refresh pattern:
          # (1) resolve the CAE / Console UAMI / ACR / loom-unity image / DLZ lake,
          # (2) DEPLOY the module into the admin RG if the app is absent,
          # (3) set LOOM_ICEBERG_CATALOG_URL on the Console. Every sub-step is
          # best-effort — the svc-iceberg-catalog gate is optionalDefault (the
          # Delta↔Iceberg dual-metadata path already works unset), so a failure
          # here degrades honestly to that fallback and NEVER breaks the deploy.
          set +e
          ICEBERG_APP=$(az containerapp list -g "$ADMIN_RG" --subscription "$ADMIN_SUB" \
            --query "[?name=='iceberg-catalog'].name | [0]" -o tsv 2>/dev/null)
          if [ -z "$ICEBERG_APP" ]; then
            # Container Apps managed environment (in-VNet) hosting the console.
            CAE_ID=$(az containerapp env list -g "$ADMIN_RG" --subscription "$ADMIN_SUB" \
              --query "[0].id" -o tsv 2>/dev/null)
            # Console UAMI — resource id (ACR pull + lake read). The PRINCIPAL id
            # is no longer needed here: per #3357 the catalog module makes no role
            # assignment, so it takes no principal. Its Storage Blob Data Reader
            # grant is made by data-plane/serving-tier-lake-rbac.bicep on the main
            # admin-plane deploy, at the LAKE's own RG scope.
            UAMI_NAME=$(az identity list -g "$ADMIN_RG" --subscription "$ADMIN_SUB" \
              --query "[?starts_with(name,'uami-loom-console')].name | [0]" -o tsv 2>/dev/null)
            UAMI_ID=$(az identity show -n "$UAMI_NAME" -g "$ADMIN_RG" --subscription "$ADMIN_SUB" --query id -o tsv 2>/dev/null)
            # ACR + the loom-unity image tag the console release already runs (the
            # catalog runs the SAME Unity Catalog OSS image, so no new build).
            ACR_LOGIN=$(az acr list -g "$ADMIN_RG" --subscription "$ADMIN_SUB" --query "[0].loginServer" -o tsv 2>/dev/null)
            CONSOLE_IMG=$(az containerapp show -n loom-console -g "$ADMIN_RG" --subscription "$ADMIN_SUB" \
              --query "properties.template.containers[0].image" -o tsv 2>/dev/null)
            IMG_TAG="${CONSOLE_IMG##*:}"; [ -z "$IMG_TAG" ] && IMG_TAG=latest
            UNITY_IMG="${ACR_LOGIN}/loom-unity:${IMG_TAG}"
            # DLZ ADLS Gen2 lake account the catalog reads table metadata from.
            LAKE_ACCT=$(az storage account list --subscription "$DLZ_SUB" -g "$DLZ_RG" \
              --query "[?kind=='StorageV2' && isHnsEnabled].name | [0]" -o tsv 2>/dev/null)
            if [ -z "$CAE_ID" ] || [ -z "$UAMI_ID" ] || [ -z "$ACR_LOGIN" ] || [ -z "$LAKE_ACCT" ]; then
              echo "::warning::Iceberg REST Catalog not deployed — could not resolve CAE/UAMI/ACR/lake (CAE=$CAE_ID UAMI=$UAMI_ID ACR=$ACR_LOGIN LAKE=$LAKE_ACCT). /admin/catalog stays on the dual-metadata fallback (honest gate). Re-run after those exist."
            else
              # entraClientId = the Console's own MSAL app so the catalog accepts
              # Loom-issued bearers (else it deploys SEALED — up but every caller
              # rejected — per the module's auth-by-default posture).
              CFG=$(printf '{"environmentId":"%s","uamiId":"%s","acrLoginServer":"%s","image":"%s","lakeStorageAccountName":"%s","authMode":"entra","entraClientId":"%s"}' \
                "$CAE_ID" "$UAMI_ID" "$ACR_LOGIN" "$UNITY_IMG" "$LAKE_ACCT" "${LOOM_MSAL_CLIENT_ID:-}")
              echo "Deploying Iceberg REST Catalog into $ADMIN_RG (image=$UNITY_IMG lake=$LAKE_ACCT)…"
              az deployment group create --subscription "$ADMIN_SUB" -g "$ADMIN_RG" \
                --name iceberg-catalog-$(date +%s) \
                -f platform/fiab/bicep/modules/data-plane/iceberg-catalog-aca.bicep \
                -p location="${{ inputs.region }}" catalogConfig="$CFG" \
                -o none \
                && echo "  Iceberg REST Catalog deployed." \
                || echo "::warning::Iceberg catalog bicep deploy failed (deploy SP rights on $ADMIN_RG? image tag $IMG_TAG present in ACR?) — re-run; /admin/catalog stays on the dual-metadata fallback."
              ICEBERG_APP=iceberg-catalog
            fi
          fi
          # Wire LOOM_ICEBERG_CATALOG_URL on the Console once the app exists.
          if [ -n "$ICEBERG_APP" ]; then
            IB_FQDN=$(az containerapp show -n iceberg-catalog -g "$ADMIN_RG" --subscription "$ADMIN_SUB" \
              --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null)
            if [ -n "$IB_FQDN" ]; then
              az containerapp update -g "$ADMIN_RG" -n loom-console \
                --set-env-vars "LOOM_ICEBERG_CATALOG_URL=https://$IB_FQDN" -o none 2>/dev/null \
                && echo "  Wired LOOM_ICEBERG_CATALOG_URL=https://$IB_FQDN on loom-console." \
                || echo "::warning::Could not set LOOM_ICEBERG_CATALOG_URL on loom-console — set it manually to https://$IB_FQDN."
            fi
          fi

      - name: Verify the report-subscriptions delivery job (WS-C2)
        run: |
          set -uo pipefail
          # B-FN C3 (2026-08-06): report-subscriptions is a scheduled Container
          # App Job (loom-report-subscriptions), NOT a Y1 Function App. This step
          # used to `func azure functionapp publish` into func-rptsub-* and then
          # overwrite LOOM_REPORT_SUBSCRIPTIONS_FUNCTION on loom-console with
          # https://<that host>. Both halves were harmful:
          #   • the Function-hosted runtime executes nothing — measured
          #     2026-08-06, FunctionExecutionCount (2026-07-25→08-06, P1D Total)
          #     sums to ZERO across all seven Function Apps in the admin RG
          #     (errorCode=Success, 13/13 datapoints with an explicit total of
          #     0.0, none absent), and func-rptsub-* indexes no functions at all
          #     — so the published code never ran;
          #   • the overwrite replaced the value bicep sets with a URL pointing
          #     at that host, so the console's delivery gate read "wired"
          #     while nothing could deliver.
          # bicep now sets the env var to the JOB NAME. The image is built by
          # .github/workflows/deploy-report-subscriptions.yml. This step only
          # VERIFIES — it does not write — and it FAILS when the job is absent:
          # a missing delivery runtime means scheduled report delivery is dead,
          # which is precisely the silent condition this replaced.
          az extension add --name containerapp --only-show-errors || true
          if ! JOB=$(az containerapp job show -g "$ADMIN_RG" --subscription "$ADMIN_SUB" \
                       -n loom-report-subscriptions --query name -o tsv); then
            echo "::error::loom-report-subscriptions job not found in $ADMIN_RG (or unreadable). Scheduled report delivery is NOT running: subscriptions will keep saving to Cosmos and the editor will keep listing them as enabled while nothing is delivered. Deploy admin-plane/main.bicep with reportSubscriptionsEnabled=true, then dispatch deploy-report-subscriptions.yml to build the image."
            exit 1
          fi
          IMAGE=$(az containerapp job show -g "$ADMIN_RG" --subscription "$ADMIN_SUB" \
                    -n "$JOB" --query "properties.template.containers[0].image" -o tsv || true)
          CRON=$(az containerapp job show -g "$ADMIN_RG" --subscription "$ADMIN_SUB" \
                   -n "$JOB" --query "properties.configuration.scheduleTriggerConfig.cronExpression" -o tsv || true)
          echo "  report-subscriptions delivery job: $JOB  image=$IMAGE  cron=$CRON"
          WIRED=$(az containerapp show -g "$ADMIN_RG" --subscription "$ADMIN_SUB" -n loom-console \
                    --query "properties.template.containers[0].env[?name=='LOOM_REPORT_SUBSCRIPTIONS_FUNCTION'].value | [0]" -o tsv || true)
          if [ -z "$WIRED" ] || [ "$WIRED" = "None" ]; then
            echo "::error::LOOM_REPORT_SUBSCRIPTIONS_FUNCTION is empty on loom-console, so the subscriptions editor shows an honest delivery gate even though the job exists. Re-run the admin-plane deploy (bicep sets it from the job name)."
            exit 1
          fi
          echo "  loom-console delivery gate reads: $WIRED"

      - name: Grant Identity Picker Graph AppRoles (User/Group/Application Read.All for the reusable picker)
        run: |
          # Grant the Console UAMI the three Microsoft Graph application
          # permissions required by the reusable Identity Picker
          # (/api/governance/identities/search + <IdentityPicker>):
          #   - User.Read.All        (search users by displayName / UPN)
          #   - Group.Read.All       (search groups + expand transitiveMembers)
          #   - Application.Read.All (search service principals / managed ids)
          #
          # Idempotent — re-runs cleanly. Until a Tenant Administrator grants
          # admin consent, the picker renders its honest-gate MessageBar
          # naming exactly these grants. Delegates to the shared script so the
          # grant logic stays in one place.
          set -e
          export CONSOLE_UAMI_PRINCIPAL="$CONSOLE_UAMI_PRINCIPAL"
          bash scripts/csa-loom/grant-identity-graph-approles.sh || \
            echo "  Identity Picker AppRole grant step reported a non-zero status (likely already granted)."

          # Grant the Console UAMI the two Microsoft Graph application
          # permissions required by OneLake shortcuts to SharePoint / OneDrive
          # (lakehouse editor -> New shortcut -> SharePoint / OneDrive):
          #   - Sites.Read.All (enumerate SharePoint sites + document libraries)
          #   - Files.Read.All (list + read OneDrive / SharePoint drive items)
          #
          # Azure-native parity with Fabric OneLake OneDrive/SharePoint shortcuts;
          # NO Fabric dependency. Idempotent — re-runs cleanly. Until a Tenant
          # Administrator grants admin consent, the SharePoint source renders its
          # honest-gate MessageBar naming exactly these grants.
          bash scripts/csa-loom/grant-shortcut-graph-approles.sh || \
            echo "  SharePoint shortcut AppRole grant step reported a non-zero status (likely already granted)."


      - name: Bootstrap Weave ontology PostgreSQL + Apache AGE (graph + extension + UAMI principal)
        if: always()
        continue-on-error: true
        run: |
          # Weave (Semantic Ontology) Phase 1 — data-plane setup for the PG + AGE
          # graph store that backs object/link/action instance write-back. Bicep
          # (modules/landing-zone/postgres-weave.bicep) provisions the server +
          # shared_preload_libraries=AGE + azure.extensions=AGE; this step runs the
          # one-time CREATE EXTENSION AGE + create_graph + pgaadauth_create_principal
          # that cannot be done in bicep. Idempotent — re-runs cleanly.
          set -uo pipefail
          # BRANCH ON THE EXIT CODE, NOT ON EMPTINESS. This read used to be
          # `$(az … 2>/dev/null)` tested with `[ -z ]`, which cannot tell "the
          # server is not there" apart from "I could not look". A deploy SP
          # without Reader on $DLZ_SUB, a wrong -g, or a transient az failure all
          # produced an empty string, and the notice below then ASSERTED the
          # server was absent. That is deploy-integrity.md R7 verbatim — the same
          # shape as the roll that reported "the tag does not exist" when the
          # truth was "I could not reach the registry", and it sent two
          # investigations down the wrong path. stderr is captured and surfaced,
          # never discarded.
          PG_ERR="$(mktemp)"
          if ! WEAVE_PG_SERVER=$(az postgres flexible-server list --subscription "$DLZ_SUB" -g "$DLZ_RG" \
            --query "[?starts_with(name,'psql-loom-weave')].name | [0]" -o tsv 2>"$PG_ERR"); then
            echo "::warning::Could NOT enumerate PostgreSQL flexible servers in $DLZ_RG (subscription $DLZ_SUB). This job did NOT determine whether the Weave server exists — it could not look. Common causes: the deploy identity lacks Reader on that subscription/RG, the RG name is wrong, or a transient az failure. az stderr: $(tr -d '\r' < "$PG_ERR")"
            rm -f "$PG_ERR"
            exit 0
          fi
          rm -f "$PG_ERR"
          # az exited 0, so the enumeration genuinely happened and an empty result
          # genuinely means no matching server IN THIS RESOURCE GROUP.
          if [ -z "$WEAVE_PG_SERVER" ]; then
            # What this establishes: no psql-loom-weave-* server in THIS resource
            # group. It does NOT establish that no server exists — admin-plane/
            # main.bicep deploys `weavePg` at ADMIN-RG scope on every topology
            # except dlz-attach, which this query does not cover. And "deploy with
            # weaveOntologyEnabled=true" stopped being sufficient advice in 3449d:
            # that param already defaults true, and the server is now ALSO gated on
            # postgresQuotaAvailable, which both Gov param files pin false.
            echo "::notice::No psql-loom-weave-* server found in $DLZ_RG (the enumeration succeeded; this job did not look in the admin RG, where every topology except dlz-attach places it). If the server really is absent: weaveOntologyEnabled already defaults true, so check postgresQuotaAvailable — the gcc-high/il5 bicepparams pin it false and the Weave server is skipped there by design (3449d). On tenant, single-sub and multi-sub you can re-enable just this server with observabilityConfig.backendOverrides={weavePostgres:'enabled'} without un-gating the Airflow/DuckLake hosts — it lands in the ADMIN RG, not this one. Only on dlz-attach is postgresQuotaAvailable the sole lever. Then re-run this job."
            exit 0
          fi
          echo "Weave PG server: $WEAVE_PG_SERVER"
          # The deploy SP must be a PG Entra admin to run pgaadauth_create_principal.
          # bicep set the Console UAMI as admin; add the deploy SP as a co-admin so
          # this job can bootstrap. (Idempotent — PUT returns 200 on re-run.)
          DEPLOY_OID=$(az ad signed-in-user show --query id -o tsv 2>/dev/null \
            || az account show --query user.name -o tsv 2>/dev/null)
          DEPLOY_SP_OID=$(az ad sp show --id "$(az account show --query user.name -o tsv)" --query id -o tsv 2>/dev/null || echo "")
          if [ -n "$DEPLOY_SP_OID" ]; then
            az postgres flexible-server ad-admin create --subscription "$DLZ_SUB" -g "$DLZ_RG" -s "$WEAVE_PG_SERVER" \
              --object-id "$DEPLOY_SP_OID" --display-name "loom-deploy-sp" --type ServicePrincipal \
              -o none 2>/dev/null || echo "  (deploy SP may already be a PG admin — continuing)"
            sleep 20
            export PG_ADMIN_USER="loom-deploy-sp"
          fi
          chmod +x scripts/csa-loom/bootstrap-weave-pg.sh
          # APPS-W3: also register the shared apps UAMI (the identity every hosted
          # Loom app runs as) so weave-ontology app resources work day-one — the
          # Resources-tab attach then reports already-exists instead of a
          # pending-grants script.
          SUB="$DLZ_SUB" DLZ_RG="$DLZ_RG" WEAVE_PG_SERVER="$WEAVE_PG_SERVER" \
            CONSOLE_UAMI_NAME="$CONSOLE_UAMI_NAME" \
            EXTRA_PG_PRINCIPALS="uami-loom-mcp-${{ inputs.region }}" \
            bash scripts/csa-loom/bootstrap-weave-pg.sh \
            || echo "::warning::Weave PG bootstrap incomplete — ensure the deploy SP is a PG Entra admin on $WEAVE_PG_SERVER, then re-run."

      - name: Create Govern/Usage Grafana dashboards (F2 + F21 embed, day-one)
        if: always()
        continue-on-error: true
        run: |
          # Day-one Govern (F2) + Usage (F21) embedded analytics. bicep deploys
          # Azure Managed Grafana (managedGrafanaEnabled) and wires the console env
          # LOOM_REPORT_KIND=grafana / LOOM_USAGE_REPORT_KIND=grafana + the stable
          # UIDs (loom-governance / loom-usage). This step creates the two real
          # dashboards (over the OOB Azure Monitor data source) so the embeds
          # resolve immediately. Idempotent — re-runs with --overwrite. The UIDs
          # MUST match the bicep defaults + platform/fiab/grafana/*.json.
          set -uo pipefail
          az account set --subscription "$ADMIN_SUB" 2>/dev/null || true
          GRAFANA_NAME=$(az grafana list -g "$ADMIN_RG" --query "[?starts_with(name,'grafana-csa-loom')].name | [0]" -o tsv 2>/dev/null)
          if [ -z "${GRAFANA_NAME:-}" ] || [ "$GRAFANA_NAME" = "None" ]; then
            echo "::notice::No grafana-csa-loom-* instance in $ADMIN_RG — deploy with managedGrafanaEnabled=true to create it, then re-run this job."
            exit 0
          fi
          echo "Managed Grafana: $GRAFANA_NAME"
          az extension add -n amg -y 2>/dev/null || az extension update -n amg 2>/dev/null || true
          GRAFANA_ID=$(az grafana show -n "$GRAFANA_NAME" -g "$ADMIN_RG" --query id -o tsv 2>/dev/null)
          # The deploy SP must be a Grafana Admin to create dashboards via the API.
          DEPLOY_SP_OID=$(az ad sp show --id "$(az account show --query user.name -o tsv)" --query id -o tsv 2>/dev/null || echo "")
          if [ -n "$DEPLOY_SP_OID" ] && [ -n "${GRAFANA_ID:-}" ]; then
            az role assignment create --assignee-object-id "$DEPLOY_SP_OID" --assignee-principal-type ServicePrincipal \
              --role "22926164-76b3-42b3-bc55-97df8dab3e41" --scope "$GRAFANA_ID" \
              -o none 2>&1 | grep -v "already exists" || echo "  (deploy SP Grafana Admin already assigned)"
          fi
          # The Grafana managed identity needs Monitoring Reader to read metrics/logs.
          GRAFANA_MI=$(az grafana show -n "$GRAFANA_NAME" -g "$ADMIN_RG" --query "identity.principalId" -o tsv 2>/dev/null)
          if [ -n "${GRAFANA_MI:-}" ] && [ "$GRAFANA_MI" != "None" ]; then
            for S in "$ADMIN_SUB" "$DLZ_SUB"; do
              [ -n "$S" ] && az role assignment create --assignee-object-id "$GRAFANA_MI" --assignee-principal-type ServicePrincipal \
                --role "Monitoring Reader" --scope "/subscriptions/$S" \
                -o none 2>&1 | grep -v "already exists" || true
            done
          fi
          sleep 30
          for D in loom-governance loom-usage; do
            if [ -f "platform/fiab/grafana/${D}.json" ]; then
              az grafana dashboard create -n "$GRAFANA_NAME" -g "$ADMIN_RG" --overwrite \
                --definition "@platform/fiab/grafana/${D}.json" \
                --query "{uid:uid,status:status}" -o tsv 2>&1 \
                && echo "  created/updated dashboard: $D" \
                || echo "::warning::Could not create dashboard $D — ensure the deploy SP has Grafana Admin on $GRAFANA_NAME, then re-run."
            else
              echo "::warning::platform/fiab/grafana/${D}.json not found — skipping."
            fi
          done

      - name: Verify console runtime (probes / resources / telemetry)
        if: always()
        continue-on-error: true
        run: |
          # Deploy-readiness guard for the "Console runtime" domain (#1382):
          # asserts loom-console came up Healthy, right-sized (>=1cpu/2Gi), with
          # relaxed probe timeouts (>=5s) and consistent telemetry wiring
          # (conn-string present iff LOOM_CONSOLE_TELEMETRY_ENABLED=true).
          # Non-fatal (continue-on-error) so it reports drift without blocking the
          # rest of bootstrap; flip to a hard gate once stable across boundaries.
          chmod +x scripts/csa-loom/verify-console-runtime.sh
          ADMIN_RG="$ADMIN_RG" CONSOLE_APP="${CONSOLE_UAMI_NAME:-loom-console}" \
            bash scripts/csa-loom/verify-console-runtime.sh \
            || echo "::warning::console-runtime verification reported drift — see log (probes/resources/telemetry)."

      - name: Restore Loom Key Vault private (verified)
        # Runs always() — including after a failed or cancelled earlier step,
        # which is exactly when the vault is most likely to have been left open.
        #
        # This is the ENFORCING check for the Key Vault firewall (#2855). Earlier
        # steps open a single-IP window for a secret write and close it inline;
        # this step re-derives the posture FROM THE VAULT and fails the job if it
        # is not verifiably private. It used to end in
        #   `... -o none 2>/dev/null && echo ok || echo "::warning::Could not …"`
        # which meant the step exited 0 no matter what, never re-read the ACLs,
        # and printed "re-asserted private" over a vault it had not confirmed.
        # A control whose verdict is discarded is not a control.
        #
        # NOTE deliberately NO continue-on-error and no trailing `exit 0`: the
        # helper's exit status must be the step's, or this reverts to theatre.
        if: always()
        run: |
          set -uo pipefail
          # Enumerate with the rc CAPTURED. An `az` failure returns an empty list,
          # and reading "empty" as "no vault, nothing to lock down" is bug #2836 —
          # the same credential/ARM problem that breaks this call is a plausible
          # cause of the failure that left the vault open in the first place.
          KV_LIST="$(az keyvault list -g "$ADMIN_RG" --subscription "$ADMIN_SUB" --query "[].name" -o tsv)"
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::Could not enumerate Key Vaults in $ADMIN_RG (az exit $RC). Cannot confirm the Loom vault is private, so this is a FAILURE, not 'nothing to lock down'. Check the vault's firewall by hand."
            exit 1
          fi
          KV_NAME="$(printf '%s\n' "$KV_LIST" | tr -d '\r' | grep '^kv-loom' | head -1)"
          [ -z "${KV_NAME:-}" ] && KV_NAME="$(printf '%s\n' "$KV_LIST" | tr -d '\r' | grep . | head -1)"
          if [ -z "${KV_NAME:-}" ]; then
            echo "No Key Vault exists in $ADMIN_RG (az listed zero) — nothing to lock down."
            exit 0
          fi
          # Verified close: strips residual ip allow rules, re-asserts
          # Disabled + Deny, RE-READS all three and returns non-zero unless they
          # confirm. Non-zero here fails the step and therefore the job.
          bash scripts/csa-loom/kv-firewall-window.sh close --vault "$KV_NAME" --subscription "$ADMIN_SUB"

