name: deploy-fiab-gcc

# The run-name carries the OUTCOME, because the conclusion alone lies.
# Without credentials this lane skips both real jobs and concludes SUCCESS —
# five consecutive green runs, three of them scheduled, that deployed nothing
# (see the precheck below). `gh run list` and the GitHub UI show only the
# conclusion, so the run title is the one place the truth is visible without
# opening the run.
#
# The third line is not decoration on the second. The `Provision` step below is
# gated `if: github.event_name == 'schedule' || inputs.run_mode == 'full'` and
# run_mode DEFAULTS to whatif-only, so the DEFAULT dispatch succeeds having
# applied nothing — and this lane is now a WATCHED entry in
# scripts/ci/check-deploy-staleness.mjs, which clears drift on the newest
# SUCCESSFUL run. That watchdog filters on the exact literal DRY_RUN_MARKER
# ('DRY RUN'); "(whatif-only)" from line two does NOT match it, so line two
# alone would have let one default dispatch silence a GCC deploy gap it did not
# close. Machine-readable marker AND human-readable mode, deliberately both.
run-name: >-
  deploy-fiab-gcc
  ${{ github.event_name == 'schedule' && '(scheduled)' || format('({0})', inputs.run_mode) }}
  ${{ (github.event_name == 'workflow_dispatch' && inputs.run_mode != 'full') && '— DRY RUN (whatif-only, applies nothing)' || '' }}

# CSA Loom — nightly deploy validation against GCC (Azure Commercial
# under M365 GCC identity). GCC limitations: no F-SKU, no Direct
# Lake parity.

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily (after Commercial run)
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'whatif-only PREVIEWS the Bicep and applies NOTHING. full APPLIES the template: it provisions/reconciles the infrastructure and smokes it, and does NOT tear anything down (keep_resources defaults true). KNOWN GAP — on THIS boundary a full run deploys INFRASTRUCTURE ONLY: gcc.bicepparam leaves deployAppsEnabled unset because there is no GCC image producer, so ZERO Container Apps are created and no loom-console is stamped. A green run here does not mean GCC serves Loom. Tracked in #3078; the other three lanes deploy the app tier on full.'
        type: choice
        default: whatif-only
        options:
          - whatif-only
          - full
      topology:
        description: 'Explicit topology (audit-t156). Overrides deployment_mode. single-sub=dev/demo; tenant=DMLZ console+shared only; dlz-attach=landing zone only (no second console). Empty=derive.'
        type: choice
        default: ''
        options:
          - ''
          - single-sub
          - tenant
          - dlz-attach
      target_subscription:
        description: 'dlz-attach: the NEW subscription the DLZ is provisioned into.'
        type: string
        required: false
      keep_resources:
        description: 'Keep the estate up and RECONCILE in place (the safe default, and what a real install wants). TRUE reconfigures and adds services without destroying anything, so a full run is IDEMPOTENT and can be repeated safely. Setting it FALSE makes this a TEARDOWN run — only do that for a deliberate clean-slate rebuild.'
        type: boolean
        default: true
      allow_existing_hub:
        description: 'topology=tenant only: bypass the "hub already exists in target sub" guard to idempotently reconcile/retry an existing or partially-deployed GCC hub. Does NOT stamp a second Console — the incremental deploy reconciles the existing admin RG. Leave false for first-run installs. (Cloud parity: commercial and gcch have carried this; gcc did not, because its guard could not fail in the first place.)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

env:
  AZURE_CLOUD: AzureCloud   # GCC = Azure public + GCC M365 identity
  AZURE_LOCATION: eastus
  CSA_LOOM_BOUNDARY: GCC
  CSA_LOOM_DEPLOYMENT_MODE: single-sub
  CSA_LOOM_TOPOLOGY: ${{ inputs.topology || '' }}
  CSA_LOOM_CAPACITY_SKU: F8
  CSA_LOOM_TARGET_SUBSCRIPTION: ${{ inputs.target_subscription }}

jobs:
  precheck:
    name: Verify GCC secrets are configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          C: ${{ secrets.AZURE_GCC_CLIENT_ID }}
          S: ${{ secrets.AZURE_GCC_CLIENT_SECRET }}
          T: ${{ secrets.AZURE_GCC_TENANT_ID }}
          U: ${{ secrets.AZURE_GCC_SUBSCRIPTION_ID }}
        run: |
          if [[ -z "$C" || -z "$S" || -z "$T" || -z "$U" ]]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            MISSING=""
            [[ -z "$C" ]] && MISSING="$MISSING AZURE_GCC_CLIENT_ID"
            [[ -z "$S" ]] && MISSING="$MISSING AZURE_GCC_CLIENT_SECRET"
            [[ -z "$T" ]] && MISSING="$MISSING AZURE_GCC_TENANT_ID"
            [[ -z "$U" ]] && MISSING="$MISSING AZURE_GCC_SUBSCRIPTION_ID"
            # A CRON that can never do anything is not a no-op, it is a defect
            # that reports green every day (deploy-integrity.md R3). An explicit
            # dispatch is different: the operator asked, and gets the warning in
            # front of them, so a graceful skip is the right answer there.
            if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
              echo "::error::deploy-fiab-gcc is on a DAILY CRON and cannot authenticate — missing secret(s):${MISSING}. Every scheduled run since this cron was added has reported SUCCESS while skipping both real jobs, i.e. a green tick over a lane that has never deployed anything. Either bootstrap the secrets (docs/fiab/runbooks/secrets-bootstrap.md) or remove the schedule. Failing rather than reporting a green no-op."
              exit 1
            fi
            echo "::warning::AZURE_GCC_* secrets not configured — skipping. Missing:${MISSING}"
            echo "::warning::Bootstrap per docs/fiab/runbooks/secrets-bootstrap.md. NOTE: this run will conclude SUCCESS having deployed NOTHING; that is why the scheduled path fails instead."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

  deploy-validate:
    name: Deploy + validate CSA Loom in GCC
    needs: precheck
    if: needs.precheck.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Coordinates exported for the chained Gov post-deploy bootstrap (rel-T32).
    outputs:
      admin_sub: ${{ steps.bootstrap_coords.outputs.admin_sub }}
      dlz_sub: ${{ steps.bootstrap_coords.outputs.dlz_sub }}
      region: ${{ steps.bootstrap_coords.outputs.region }}

    steps:
      - uses: actions/checkout@v7

      - name: Azure login (GCC sub)
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GCC_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GCC_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GCC_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GCC_SUBSCRIPTION_ID }}"
            }

      - name: Setup Bicep
        run: az bicep install

      # audit-t157: same "second Console is impossible" invariant as Commercial,
      # enforced at the CI layer. topology=tenant is rejected when an Admin Plane
      # (hub) RG already exists in the target sub; dlz-attach must name a NEW
      # subscription via target_subscription.
      # Remove the CAUSE of the stderr banner, not just its effect — see the
      # matching step in deploy-fiab-gcch.yml. Now that this lane's probe fails
      # closed on a non-numeric answer, a dynamic-install banner would turn a
      # working estate into a refusal, so the extension is installed up front.
      # Fail-closed: no `|| true`.
      - name: Pre-install the resource-graph CLI extension
        run: |
          set -e
          az extension add --name resource-graph --upgrade --only-show-errors -o none
          echo "resource-graph version: $(az extension show --name resource-graph --query version -o tsv | tr -d '\r')"

      - name: Topology guard
        id: topology_guard
        env:
          INPUT_ALLOW_EXISTING_HUB: ${{ inputs.allow_existing_hub }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -e
          TOPOLOGY="${CSA_LOOM_TOPOLOGY:-tenant}"
          echo "topology=$TOPOLOGY"
          if [ "$TOPOLOGY" = "dlz-attach" ]; then
            if [ -z "$CSA_LOOM_TARGET_SUBSCRIPTION" ]; then
              echo "::error::dlz-attach requires target_subscription (the new DLZ subscription)."; exit 1
            fi
          else
            # Scope the hub check to the ACTIVE (deploy) subscription, not the
            # whole tenant, so a deliberate migration to a new hub sub is not
            # blocked by an old hub still running elsewhere as a UAT ring
            # (audit-t156 D3/Q10). Still blocks an accidental double-stamp into
            # the same sub.
            # FAIL CLOSED ON UNKNOWN (deploy-integrity R6/R7) — adopted from
            # deploy-fiab-gcch.yml 2026-08-08.
            #
            # This probe previously read:
            #   EXISTING=$(az graph query … 2>/dev/null || echo "0")
            # which converted an auth failure, a missing resource-graph
            # extension, or a throttle into the string "0" — i.e. "no hub
            # exists" — and let the deploy proceed against a subscription that
            # might already hold one. The guard could not fail, so its verdict
            # carried no information.
            #
            # This is why the two Gov lanes disagreed on 2026-08-08: gcch's
            # hardened probe REFUSED on an unreadable answer (correctly), while
            # gcc's returned a confident "0" it had not established. GCC's green
            # was the absence of a check, not the presence of a clean estate —
            # the guard-adoption gap: the correct fix existed in a sibling and
            # this lane never took it.
            SCOPE_SUB=$(az account show --query id -o tsv 2>&1) || {
              echo "::error::Could not resolve the active subscription (az account show failed), so the hub-existence check cannot even be scoped. Refusing. Detail: ${SCOPE_SUB:-<no output>}"
              exit 1
            }
            SCOPE_SUB=$(printf '%s' "$SCOPE_SUB" | tr -d '\r\n')
            # stderr goes to a FILE, never to /dev/null and never merged into
            # the numeric capture: the CLI's preview-extension banner is written
            # to stderr and would otherwise contaminate the count (the exact
            # defect fixed in gcch on the same day), while discarding it would
            # destroy the diagnosis.
            HUB_PROBE_ERR=$(mktemp)
            if ! HUB_PROBE_RAW=$(az graph query ${SCOPE_SUB:+--subscriptions "$SCOPE_SUB"} -q "ResourceContainers | where type == 'microsoft.resources/subscriptions/resourcegroups' | where name startswith 'rg-csa-loom-admin-' | project name" --query "data | length(@)" -o tsv 2>"$HUB_PROBE_ERR"); then
              HUB_PROBE_STDERR=$(head -c 2000 "$HUB_PROBE_ERR" | tr -d '\r')
              rm -f "$HUB_PROBE_ERR"
              echo "::error::Could NOT read the target subscription to determine whether a CSA Loom hub already exists, so the answer is UNKNOWN — not 'none'. Refusing rather than risk stamping a second Console. Resolve the read (Reader on the subscription for the GCC deploy SP, and the resource-graph CLI extension) and re-run. Detail: ${HUB_PROBE_STDERR:-<no stderr>}"
              exit 1
            fi
            HUB_PROBE_STDERR=$(head -c 2000 "$HUB_PROBE_ERR" | tr -d '\r')
            rm -f "$HUB_PROBE_ERR"
            EXISTING=$(printf '%s' "$HUB_PROBE_RAW" | tr -d '\r\n')
            case "$EXISTING" in
              ''|*[!0-9]*)
                echo "::error::The hub-existence probe exited 0 but returned a non-numeric result (${EXISTING:-<empty>}), so whether a hub exists is UNVERIFIED. Refusing. az stderr was: ${HUB_PROBE_STDERR:-<empty>}"; exit 1 ;;
            esac
            if [ "$EXISTING" != "0" ]; then
              # Brownfield parity with gcch/commercial: a scheduled reconcile
              # runs against the existing hub by design; an operator dispatch
              # against one must opt in explicitly.
              if [ "${INPUT_ALLOW_EXISTING_HUB:-false}" = "true" ]; then
                echo "::notice::A CSA Loom hub already exists in this subscription ($EXISTING rg-csa-loom-admin-* RG) and allow_existing_hub=true — reconciling the EXISTING admin RG incrementally. No second Console is stamped."
              elif [ "$TRIGGER" = "schedule" ]; then
                echo "::notice::Scheduled reconcile against the existing GCC hub ($EXISTING rg-csa-loom-admin-* RG) — proceeding incrementally, as deploy-fiab-commercial.yml does on its schedule. An operator DISPATCH against an existing hub still requires allow_existing_hub=true."
              else
                echo "::error::A CSA Loom hub already exists in the target subscription (found $EXISTING rg-csa-loom-admin-* RG). A second Console cannot be stamped into the same sub. To reconcile/retry the EXISTING hub, re-dispatch with allow_existing_hub=true. To add a NEW landing zone, use topology=dlz-attach with target_subscription."; exit 1
              fi
            fi
          fi

      # #3056 — adopt the estate's LIVE internal trust token instead of letting
      # bicep re-mint it. `loomGeneratedSecretSeed` defaults to `newGuid()`, so
      # every deploy used to rotate this secret and strand every holder outside
      # the deployment. Resolves empty on greenfield (bicep mints — correct);
      # the value is masked and only a fingerprint reaches the log.
      - name: Adopt the estate's live internal trust token (never re-mint it)
        run: bash scripts/csa-loom/resolve-internal-token.sh --export > /dev/null

      # ── ADOPT THE DATA LANDING ZONE (#3380) ────────────────────────────────
      #
      # CLOUD PARITY, MEASURED. params/gcc.bicepparam:52 reads
      #   param adopt = union(legacyAdoptFromEnv, json(readEnvironmentVariable('LOOM_ADOPT_JSON', '{}')))
      # exactly as commercial.bicepparam does — so the CONSUMER has always been
      # here. The PRODUCER was not: `discover-dlz-adopt-plan` / `LOOM_ADOPT_JSON`
      # appeared 11 times in deploy-fiab-commercial.yml and ZERO times in this
      # lane, in deploy-fiab-gcch and in deploy-fiab-il5. Brownfield adoption and
      # the cross-subscription grant pass were therefore Commercial-only BY
      # CONSTRUCTION: every sovereign deploy resolved `{}` and behaved as if the
      # estate owned nothing, whatever it actually owned. cloud-parity.md calls
      # that INCOMPLETE, and deploy-integrity.md R5 makes brownfield a
      # first-class path in BOTH clouds, not a Commercial convenience.
      #
      # THIS LANE IS `disabled_manually` (#3345), so this is a CODE-IDENTITY fix
      # rather than a measured-failure fix, and it is stated as such — the same
      # reasoning the #3415 fix in this file already records. It is made here
      # rather than deferred because leaving it would mean re-enabling this lane
      # onto a deploy path already known to strip lake wiring on a brownfield
      # estate.
      #
      # WHAT AN EMPTY PLAN COSTS. main.bicep composes `loomStorageAccount` from
      # the adopt plan, and the console env array in modules/admin-plane/main.bicep
      # is CONDITIONAL on that string (`!empty(loomStorageAccount) ? [ … ] : []`).
      # An empty binding does not leave the lake variables alone — it REMOVES
      # LOOM_BRONZE_URL, LOOM_SILVER_URL, LOOM_GOLD_URL, LOOM_LANDING_URL,
      # LOOM_CSV_IMPORTS_URL, LOOM_SAMPLE_ADLS and LOOM_RECYCLE_RETENTION_DAYS
      # from a running console (#3701).
      #
      # MUST PRECEDE THE WHAT-IF. `readEnvironmentVariable` resolves at BICEP
      # COMPILE time — i.e. inside `az deployment sub what-if` / `create`, not
      # when this step runs. Exporting it afterwards is a no-op, and a preview
      # that resolves a different adopt plan than the apply is a lying preview
      # (deploy-integrity R7). Discovery is read-only — it never creates and
      # never grants — so running it on a dry run mutates nothing.
      #
      # THE EXIT CODE IS CLASSIFIED, NEVER SWALLOWED (R6/R7). resolve-dlz-
      # coordinates.mjs states the contract this port keeps intact: 0 resolved /
      # 1 not-found / 2 usage / 3 unreadable / 4 ambiguous. A single `|| echo`
      # that collapses all four non-zero codes into one sentence ASSERTS a
      # measurement the script did not make — the defect #3701/#3703 removed from
      # the Commercial lane. UNKNOWN (3) and AMBIGUOUS (4) refuse rather than
      # compose an empty plan; only a MEASURED not-found continues.
      - name: Adopt the DLZ (discover what the estate already owns — #3380)
        id: dlz_adopt
        env:
          ADMIN_SUB: ${{ secrets.AZURE_GCC_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          REGION="${AZURE_LOCATION:-}"
          if [ -z "$REGION" ]; then
            echo "::error::[dlz-adopt] No region is available: \$AZURE_LOCATION is empty. Refusing rather than discovering against no region — that is what silently produced 'adopting: (none)' on the Commercial lane and stripped the lake env vars off the console (#3701)."
            exit 1
          fi
          if [ -z "${ADMIN_SUB:-}" ]; then
            echo "::error::[dlz-adopt] No admin subscription: the AZURE_GCC_SUBSCRIPTION_ID repository secret is empty, so Resource Graph cannot be scoped and NOTHING would be established about this estate. Refusing rather than composing an empty adopt plan."
            exit 1
          fi
          RESOLVED="$RUNNER_TEMP/dlz-coords.env"; : > "$RESOLVED"
          RC=0
          node scripts/csa-loom/resolve-dlz-coordinates.mjs \
            --region "$REGION" \
            --admin-subscription "$ADMIN_SUB" \
            --github-env "$RESOLVED" || RC=$?
          case "$RC" in
            0)
              echo "[dlz-adopt] resolver RESOLVED a landing zone for region '$REGION'."
              ;;
            1)
              # EXIT 1 IS ALSO NODE'S CODE FOR AN UNCAUGHT THROW, so the code
              # alone cannot tell "Resource Graph was read and nothing matched"
              # from "this script died before measuring anything". Require the
              # positive DLZ_STATUS marker the resolver writes on every MEASURED
              # path rather than inferring a measurement from an exit code.
              if grep -q '^DLZ_STATUS=not-found$' "$RESOLVED"; then
                echo "::notice::[dlz-adopt] resolver read Azure Resource Graph SUCCESSFULLY and no landing zone matched region '$REGION'. Continuing without adoption — that is the correct greenfield answer, and it is a measurement, not a fallback."
              else
                echo "::error::[dlz-adopt] resolve-dlz-coordinates exited 1 but did NOT write 'DLZ_STATUS=not-found'. Exit 1 is also node's code for an uncaught throw or a module-load failure, so nothing here establishes that the estate was read. Refusing rather than reporting a greenfield negative nobody measured (#3701/#3703)."
                exit 1
              fi
              ;;
            2)
              echo "::error::[dlz-adopt] resolve-dlz-coordinates exited USAGE (2): this workflow passed it invalid arguments (region='$REGION'). NOTHING was established about the estate. Refusing — continuing would compose an EMPTY adopt plan, and an empty plan does not skip the lake binding, it DELETES the seven LOOM_*_URL/LOOM_SAMPLE_ADLS env vars from the running console (#3701)."
              exit 1
              ;;
            3)
              if [ "${CSA_LOOM_TOPOLOGY:-}" = "dlz-attach" ]; then
                echo "::warning::[dlz-adopt] resolve-dlz-coordinates exited UNREADABLE (3): the Azure Resource Graph query FAILED, so whether this estate has a landing zone is UNKNOWN. Continuing ONLY because topology=dlz-attach deploys no admin plane (main.bicep:1114), so no console env variable can be removed by an empty adopt plan. Discovery still measured nothing — check that the GCC deploy identity can read Resource Graph across this estate's subscriptions."
              else
                echo "::error::[dlz-adopt] resolve-dlz-coordinates exited UNREADABLE (3): the Azure Resource Graph query FAILED, so whether this estate has a landing zone is UNKNOWN — it is NOT 'no'. Refusing rather than deploying an empty adopt plan that would strip the lake env vars off the console. Check that the GCC deploy identity can read Resource Graph across this estate's subscriptions (Reader at the DLZ subscription is the usual gap)."
                exit 1
              fi
              ;;
            4)
              if [ "${CSA_LOOM_TOPOLOGY:-}" = "dlz-attach" ]; then
                echo "::warning::[dlz-adopt] resolve-dlz-coordinates exited AMBIGUOUS (4): more than one landing zone matches region '$REGION' and none was chosen. Continuing ONLY because topology=dlz-attach deploys no admin plane, so nothing can be stripped."
              else
                echo "::error::[dlz-adopt] resolve-dlz-coordinates exited AMBIGUOUS (4): more than one landing zone matches region '$REGION' and this deploy wires exactly one, so NOTHING was chosen. Failing closed. Name the intended DLZ explicitly, or remove the duplicate resource group."
                exit 1
              fi
              ;;
            *)
              echo "::error::[dlz-adopt] resolve-dlz-coordinates exited with the undocumented code $RC. Its contract is 0 resolved / 1 not-found / 2 usage / 3 unreadable / 4 ambiguous, so nothing it printed can be read as a verdict about this estate. Refusing."
              exit 1
              ;;
          esac
          DLZ_SUB="$(grep '^DLZ_SUB=' "$RESOLVED" | tail -1 | cut -d= -f2- || true)"
          DLZ_RG="$(grep  '^DLZ_RG='  "$RESOLVED" | tail -1 | cut -d= -f2- || true)"
          [ -n "${DLZ_SUB:-}" ] && echo "::add-mask::$DLZ_SUB"

          PLAN='{}'
          if [ -n "${DLZ_SUB:-}" ] && [ -n "${DLZ_RG:-}" ]; then
            PLAN="$(bash scripts/csa-loom/discover-dlz-adopt-plan.sh \
                      --dlz-subscription "$DLZ_SUB" --dlz-rg "$DLZ_RG")"
          fi

          # An EXPLICIT plan always wins over a discovered one — the operator
          # said what to adopt, and discovery must not override a deliberate
          # decision. Discovery only fills keys nobody chose.
          if [ -n "${LOOM_ADOPT_JSON:-}" ] && [ "${LOOM_ADOPT_JSON}" != "{}" ]; then
            PLAN="$(PLAN="$PLAN" EXPLICIT="$LOOM_ADOPT_JSON" python -c 'import json,os; d=json.loads(os.environ["PLAN"]); d.update(json.loads(os.environ["EXPLICIT"])); print(json.dumps(d,separators=(",",":")))')"
            echo "::notice::[dlz-adopt] merged discovery UNDER the explicitly supplied LOOM_ADOPT_JSON (explicit wins)."
          fi

          echo "LOOM_ADOPT_JSON=$PLAN" >> "$GITHUB_ENV"
          KEYS="$(PLAN="$PLAN" python -c 'import json,os; print(",".join(sorted(json.loads(os.environ["PLAN"]))) or "(none)")')"
          echo "::notice::[dlz-adopt] adopting: $KEYS"
          echo "adopted=$KEYS" >> "$GITHUB_OUTPUT"

      # ── ADX MUST BE RUNNING BEFORE WHAT-IF **AND** THE APPLY (#3449) ────────
      # admin-plane/adx-cluster.bicep declares two
      # `Microsoft.Kusto/clusters/principalAssignments` children (the Console
      # UAMI's AllDatabasesAdmin and the Activator's AllDatabasesViewer). Those
      # are ADX DATA-plane roles, so the Kusto RP must reach the engine to write
      # them — and on a STOPPED cluster it cannot:
      #
      #   ClusterNotValidForPrincipals on '<cluster>/console-uami-alldatabasesadmin':
      #   [BadRequest] Cluster is in state 'Stopped', cannot retrieve list of principals
      #
      # THIS LANE CARRIES THE SAME EXPOSURE. Measured on this tree:
      # params/gcc.bicepparam does NOT set `adxEnabled`, and main.bicep declares
      # `param adxEnabled bool = true` (L417), so this boundary deploys the
      # cluster and both principal assignments like every other; adx-cluster.bicep
      # sets `enableAutoStop: true` unconditionally (L124), so Azure WILL stop it
      # once it idles. `disabled_manually` (#3345) means this is a CODE-IDENTITY
      # fix, not a measured-failure fix, and it is stated as such — but per
      # cloud-parity.md fixing three of four boundaries is INCOMPLETE, and
      # re-enabling this lane onto a known-broken preflight order would only
      # rediscover #3449 a fourth time.
      #
      # ORDERING IS THE ENTIRE CONTENT OF #3449. `az deployment sub what-if`
      # EVALUATES those principalAssignment leaves, so it hits
      # ClusterNotValidForPrincipals and exits 1 BEFORE any step that merely
      # precedes the apply. #3779 shipped this remediation for GCC-High placed
      # just above `Provision`, and deploy-fiab-gcch still failed 6/6 daily
      # scheduled runs with the script present and wired the whole time, because
      # the what-if sat six steps above it (#3880). A preflight must precede the
      # first step that READS the resource, not the first that WRITES it.
      #
      # It runs on the same trigger as `Provision` below, so a whatif-only DRY RUN
      # never mutates the estate. Same stated residual as the other lanes: a dry
      # run against a stopped cluster still fails what-if, which is the correct
      # trade because starting a cluster is a mutation.
      - name: ADX preflight — a stopped cluster cannot take its principal assignments (#3449)
        if: github.event_name == 'schedule' || inputs.run_mode == 'full'
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_GCC_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          # dlz-attach deploys no admin plane, so it declares no principal
          # assignments on the hub cluster and has nothing to start.
          if [ "${CSA_LOOM_TOPOLOGY:-}" = "dlz-attach" ]; then
            echo "::notice::topology=dlz-attach deploys no admin-plane ADX cluster; nothing to start."
            exit 0
          fi
          DEPLOY_SUB="${CSA_LOOM_TARGET_SUBSCRIPTION:-$AZURE_SUBSCRIPTION_ID}"
          if [ -z "$DEPLOY_SUB" ]; then
            echo "::error::No target subscription, so the estate's ADX cluster cannot be located. It comes from the AZURE_GCC_SUBSCRIPTION_ID repository secret; it is empty."
            exit 1
          fi
          node scripts/ci/ensure-adx-cluster-running.mjs \
            --subscription "$DEPLOY_SUB" \
            --rg "rg-csa-loom-admin-${AZURE_LOCATION}"

      - name: Bicep what-if
        run: |
          az deployment sub what-if \
            --name csa-loom-gcc-ci-${{ github.run_id }} \
            --location $AZURE_LOCATION \
            ${CSA_LOOM_TARGET_SUBSCRIPTION:+--subscription "$CSA_LOOM_TARGET_SUBSCRIPTION"} \
            --template-file platform/fiab/bicep/main.bicep \
            --parameters platform/fiab/bicep/params/gcc.bicepparam \
            --parameters adminEntraGroupId=${{ secrets.FIAB_GCC_ADMIN_GROUP_ID }} \
            --parameters loomTenantAdminGroupId=${{ secrets.FIAB_GCC_ADMIN_GROUP_ID }} \
            ${LOOM_INTERNAL_TOKEN:+--parameters loomInternalTokenValue="$LOOM_INTERNAL_TOKEN"} \
            ${CSA_LOOM_TOPOLOGY:+--parameters topology="$CSA_LOOM_TOPOLOGY"} \
            ${CSA_LOOM_TARGET_SUBSCRIPTION:+--parameters targetSubscriptionId="$CSA_LOOM_TARGET_SUBSCRIPTION"}

      - name: Provision
        id: provision
        if: github.event_name == 'schedule' || inputs.run_mode == 'full'
        env:
          # THE azd BRANCH IS GONE (#3415) — byte-identical fix to the GCC-High
          # lane. Every topology except `dlz-attach` ran `azd provision
          # --no-prompt` against platform/fiab/bicep/main.bicep, which declares
          # 22 parameters with NO default. azd binds Bicep parameters through
          # `<module>.parameters.json` with `${VAR}` substitution (Learn,
          # "Explore the azd up workflow"), and this repo has no
          # platform/fiab/bicep/main.parameters.json and no main.bicepparam
          # beside the module — so nothing could bind them, and the
          # `azd env set CSA_LOOM_*` calls had no path into the template
          # (main.bicep calls readEnvironmentVariable zero times).
          #
          # THIS LANE IS `disabled_manually` (#3345), so this is a CODE-IDENTITY
          # fix, not a measured-failure fix, and it is stated as such. It is made
          # here rather than deferred because the defect is the same defect in
          # the same template: leaving it would mean re-enabling this lane onto a
          # deploy path already known not to work, and would force the #3415
          # ratchet to carry an exemption that lets exactly this back in.
          #
          # AZURE_SUBSCRIPTION_ID is still required and still cannot be derived
          # (#3137) — it is the subscription this deploy targets when no
          # dlz-attach target subscription was named. The guard below is written
          # against `az deployment sub create`, because that is what runs now
          # (deploy-integrity R7).
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_GCC_SUBSCRIPTION_ID }}
        run: |
          set -e
          # RETRY WITH CLASSIFICATION (#3017, deploy-integrity R6): same harness
          # as Commercial — this ran bare, and the failure notifier below reads
          # deploy-failure.json, which nothing on this workflow produced.
          # ONE INVOCATION, EVERY TOPOLOGY (#3415). The topology-specific parts
          # are PARAMETERS, not a second deploy path. The template file, param
          # file and inline overrides are the SAME ones the `az deployment sub
          # what-if` above previews, so the preview and the apply describe the
          # same deployment. The one deliberate difference is `--subscription`:
          # the what-if passes it only when a target subscription was named,
          # this passes the RESOLVED value always, so the apply can never land
          # at an ambient default the log does not name.
          #
          # WHICH SUBSCRIPTION. dlz-attach provisions the DLZ directly INTO the
          # new target sub so `subscription()` resolves to it (per main.bicep's
          # dlz-attach scope) — the DLZ RG/module uses single-arg
          # resourceGroup(), so deploying from the hub sub would land it in the
          # wrong subscription. Every other topology targets the hub sub. Same
          # precedence the what-if uses.
          DEPLOY_SUB="${CSA_LOOM_TARGET_SUBSCRIPTION:-$AZURE_SUBSCRIPTION_ID}"
          # #3137, restated for the command that actually runs. `--subscription`
          # is passed EXPLICITLY rather than relying on the ambient az login
          # context, so an empty value would send the deploy nowhere while the
          # log claimed otherwise. Fail loudly, before anything is attempted.
          if [ -z "${DEPLOY_SUB:-}" ]; then
            echo "::error::No target subscription. az deployment sub create is subscription-scoped and cannot derive one. On topology=dlz-attach this comes from the target_subscription input; otherwise from the AZURE_GCC_SUBSCRIPTION_ID repository secret. Both are empty."
            exit 1
          fi
          # RETRY TUNING, PRESERVED PER TOPOLOGY: dlz-attach stamps a landing
          # zone into a fresh subscription and rides replication lag (4 attempts
          # / 45s, unchanged); every other topology reconciles the whole hub —
          # idempotent but not cheap (2 / 60s, the tuning the branch this
          # replaces carried, kept deliberately rather than silently widened).
          if [ "$CSA_LOOM_TOPOLOGY" = "dlz-attach" ]; then
            MAX_ATTEMPTS=4; BACKOFF=45
          else
            MAX_ATTEMPTS=2; BACKOFF=60
          fi
          # --arm-deployment now applies on EVERY topology. The azd branch had no
          # drill-down at all (azd names its own nested deployment), so a failed
          # default-topology deploy handed the classifier bicep linter noise
          # instead of the ARM leaf errors.
          node "$GITHUB_WORKSPACE/scripts/ci/deploy-retry.mjs" \
            --class-allow transient,eventual-consistency \
            --max-attempts "$MAX_ATTEMPTS" --backoff "$BACKOFF" --jitter 0.3 --wall-clock 110m \
            --step "az deployment sub create (gcc ${CSA_LOOM_TOPOLOGY:-derived})" \
            --artifact "$GITHUB_WORKSPACE/deploy-failure.json" \
            --remediate \
            --arm-deployment "csa-loom-gcc-ci-${{ github.run_id }}" --arm-scope sub \
            --arm-subscription "$DEPLOY_SUB" \
            -- az deployment sub create \
            --name csa-loom-gcc-ci-${{ github.run_id }} \
            --location "$AZURE_LOCATION" \
            --subscription "$DEPLOY_SUB" \
            --template-file "$GITHUB_WORKSPACE/platform/fiab/bicep/main.bicep" \
            --parameters "$GITHUB_WORKSPACE/platform/fiab/bicep/params/gcc.bicepparam" \
            --parameters adminEntraGroupId=${{ secrets.FIAB_GCC_ADMIN_GROUP_ID }} \
            --parameters loomTenantAdminGroupId=${{ secrets.FIAB_GCC_ADMIN_GROUP_ID }} \
            ${LOOM_INTERNAL_TOKEN:+--parameters loomInternalTokenValue="$LOOM_INTERNAL_TOKEN"} \
            ${CSA_LOOM_TOPOLOGY:+--parameters topology="$CSA_LOOM_TOPOLOGY"} \
            ${CSA_LOOM_TARGET_SUBSCRIPTION:+--parameters targetSubscriptionId="$CSA_LOOM_TARGET_SUBSCRIPTION"}

          # ── The smoke test's target: RESOLVED, never assumed (#3137) ────────
          # Byte-identical defect to deploy-fiab-gcch.yml, fixed the same way:
          # the smoke step below carried
          #     env:
          #       CONSOLE_URL: $(azd env get-values | grep CONSOLE_URL | cut -d= -f2)
          # A workflow `env:` value is a LITERAL, so that TEXT reached the smoke
          # script as its console URL and every probe curled a nonsense address.
          # Guard: scripts/ci/check-workflow-env-substitution.mjs.
          #
          # THIS LANE'S EXTRA STATE, stated rather than papered over:
          # gcc.bicepparam deliberately never sets deployAppsEnabled (there is no
          # GCC image producer — #3078), so this deploy stands up the hub and
          # ZERO Container Apps. There is no Console to probe and no Front Door
          # public ingress (frontDoorPublicUrl is gated on deployAppsEnabled).
          # The expectation is READ FROM THE PARAM FILE rather than hardcoded, so
          # the day #3078 lands and apps are enabled, a missing public URL fails
          # this step instead of silently continuing to skip the smoke test.
          PARAMS="$GITHUB_WORKSPACE/platform/fiab/bicep/params/gcc.bicepparam"
          # An UNREADABLE param file is UNKNOWN, not "apps are off": `grep` inside
          # an `if` is exempt from `set -e`, so a missing path would silently take
          # the else branch and skip the smoke test with a confident wrong reason.
          if [ ! -r "$PARAMS" ]; then
            echo "::error::cannot read $PARAMS, so it is NOT established whether this deploy stands up a Console. Refusing to skip the smoke test on an unread file."
            exit 1
          fi
          if grep -qE '^[[:space:]]*param[[:space:]]+deployAppsEnabled[[:space:]]*=[[:space:]]*true' "$PARAMS"; then
            EXPECT_CONSOLE=true
          else
            EXPECT_CONSOLE=false
          fi
          if [ "$CSA_LOOM_TOPOLOGY" = "dlz-attach" ]; then
            echo "console_url=" >> "$GITHUB_OUTPUT"
            echo "::notice::topology=dlz-attach stamps no Console, so there is no endpoint to smoke-test."
          elif [ "$EXPECT_CONSOLE" != "true" ]; then
            echo "console_url=" >> "$GITHUB_OUTPUT"
            echo "::warning::$(basename "$PARAMS") does not set deployAppsEnabled=true (#3078), so this deploy stands up no Console. The external smoke test is skipped and this run does NOT establish that the GCC boundary serves Loom."
          else
            # Two separate command substitutions, not a pipeline: each one's
            # failure is its own and `set -e` stops on either.
            #
            # SOURCE CHANGED WITH #3415: this read `azd env get-values --output
            # json`, which only existed because the deploy above ran under azd.
            # There is no azd environment now, so the outputs come from the ARM
            # deployment itself. `az deployment sub show` returns them ARM-shaped
            # ({"type":…,"value":…}); the resolver accepts that shape too.
            ARM_OUTPUTS=$(az deployment sub show \
              --name "csa-loom-gcc-ci-${{ github.run_id }}" \
              --subscription "$DEPLOY_SUB" \
              --query properties.outputs -o json)
            SMOKE_URL=$(printf '%s' "$ARM_OUTPUTS" | node "$GITHUB_WORKSPACE/scripts/ci/resolve-smoke-console-url.mjs")
            echo "console_url=$SMOKE_URL" >> "$GITHUB_OUTPUT"
            echo "::notice::smoke-test target (public ingress): $SMOKE_URL"
          fi

      # ── ACR COMPLIANCE TAGS — APPLIED HERE, NOT BY THE TEMPLATE (#3714) ────
      # CLOUD PARITY: identical to the step in deploy-fiab-commercial.yml. The
      # admin-plane ACR carries the firewall-lease mutex as out-of-band ARM tags
      # (`loomAcrFw*`), so the template cannot own its tag dictionary:
      #   #3676  `tags: complianceTags` PUT-replaced the dict and erased the live
      #          lease mid-apply, denying an in-flight `az acr build`.
      #   #3714  a declarative `Microsoft.Resources/tags` resource read its OWN
      #          id and ARM rejected the whole template with "Circular dependency
      #          detected", breaking every `az deployment sub create`.
      # `az tag update --operation Merge` adds the keys server-side and touches
      # nothing else. This lane's tag set (Environment=GCC, Data_Classification=
      # CUI-low, M365_Boundary=GCC, …) comes from gcc.bicepparam, so it cannot
      # drift from what the deployment itself used.
      - name: Apply ACR compliance tags (merge-patch, out-of-band — #3714)
        if: steps.provision.conclusion == 'success'
        run: |
          set -uo pipefail
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          ACR_ERR="$RUNNER_TEMP/acr-tag-resolve.err"
          : > "$ACR_ERR"
          ACR=$(az acr list -g "$RG" --query "[?starts_with(name,'acrloom')]|[0].name" -o tsv 2> "$ACR_ERR" | tr -d '\r')
          ACR_RC=$?
          if [ "$ACR_RC" -ne 0 ]; then
            echo "::error::Could not LIST registries in $RG (az exited $ACR_RC), so whether this estate has an ACR to tag is UNKNOWN. Raw stderr:"
            sed -n '1,20p' "$ACR_ERR" >&2
            exit 1
          fi
          if [ -z "$ACR" ]; then
            echo "::error::Provision succeeded but no 'acrloom*' registry exists in $RG. The admin-plane ACR is not optional."
            exit 1
          fi
          bash scripts/csa-loom/apply-acr-compliance-tags.sh \
            --acr "$ACR" \
            --params-file platform/fiab/bicep/params/gcc.bicepparam

      # Front Door -> ACA env Private Link approval (#3203). CLOUD PARITY: the
      # sovereign lanes previously passed an EMPTY scriptIdentityId so the ARM
      # deploymentScript never ran, and the documented substitute was the
      # operator clicking Approve in the portal. That is exactly what
      # auto-bind-by-default.md forbids, applied to the boundary that can least
      # afford a manual step. Same script, same behaviour, every cloud.
      - name: Approve the Front Door -> ACA private-endpoint connection
        if: github.event_name == 'schedule' || inputs.run_mode == 'full'
        run: |
          set -euo pipefail
          CAE_ID=$(az containerapp env show -n "cae-csa-loom-${{ env.AZURE_LOCATION }}" -g "rg-csa-loom-admin-${{ env.AZURE_LOCATION }}" --query id -o tsv | tr -d '[:space:]')
          if [ -z "$CAE_ID" ]; then
            echo "::error::could not resolve the Container Apps managed environment id in rg-csa-loom-admin-${{ env.AZURE_LOCATION }} - cannot approve the Front Door private-endpoint connection, and Front Door answers 504 while it is Pending."
            exit 1
          fi
          bash scripts/csa-loom/approve-cae-private-endpoints.sh --cae-id "$CAE_ID" --timeout-seconds 600

      - name: Export bootstrap coordinates (for the chained Gov bootstrap)
        id: bootstrap_coords
        if: (github.event_name == 'schedule' || inputs.run_mode == 'full')
        run: |
          ADMIN_SUB=$(az account show --query id -o tsv)
          echo "admin_sub=$ADMIN_SUB" >> "$GITHUB_OUTPUT"
          # dlz_sub ONLY when a DISTINCT DLZ subscription was named (#3143) —
          # same reasoning as deploy-fiab-commercial.yml. Defaulting to
          # $ADMIN_SUB asserted a single-subscription layout the deploy had not
          # established, and now that the callee DISCOVERS the landing zone that
          # assertion would narrow discovery to the wrong subscription.
          echo "dlz_sub=${CSA_LOOM_TARGET_SUBSCRIPTION:-}" >> "$GITHUB_OUTPUT"
          echo "region=$AZURE_LOCATION" >> "$GITHUB_OUTPUT"

      # deploy-integrity forbids "a deploy workflow that exits 0 having produced no
      # artifact". gcc.bicepparam deliberately never sets `deployAppsEnabled`
      # (no GCC image producer — #3078), so this lane stands up the hub and ZERO
      # Container Apps, then concludes SUCCESS. In `gh run list` that is
      # indistinguishable from a boundary that is fully deployed, which is exactly
      # the "green dashboard over a dead pipeline" shape R3 exists to prevent.
      #
      # This step does not fail the lane — infra-only is the DECIDED state, not a
      # regression — but it makes the run say what it actually produced, both in
      # the log and in the run summary the operator reads.
      - name: 'Declare what this deploy actually produced (infra-only vs apps)'
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run_mode == 'full') }}
        run: |
          set -uo pipefail
          RG="rg-csa-loom-admin-${{ env.AZURE_LOCATION }}"
          # `az … -o tsv` carries a trailing CR on some runners; strip before counting.
          if ! APPS=$(az containerapp list -g "$RG" --query "length(@)" -o tsv 2>/dev/null | tr -d '[:space:]'); then
            APPS=""
          fi
          if [ -z "$APPS" ]; then
            # UNKNOWN is not ZERO. Say which one this is.
            echo "::warning::GCC: could not enumerate Container Apps in $RG (the query failed or the RG is unreachable). This run does NOT establish how many apps exist."
            {
              echo "### GCC deploy — app count UNKNOWN"
              echo ""
              echo "Could not enumerate Container Apps in \`$RG\`. This run does **not** establish whether apps are deployed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$APPS" -eq 0 ]; then
            echo "::warning::GCC deployed INFRA ONLY — 0 Container Apps in $RG. gcc.bicepparam does not set deployAppsEnabled because there is no GCC image producer (#3078). A green run here does NOT mean the GCC boundary serves Loom."
            {
              echo "### ⚠️ GCC deploy — INFRA ONLY (0 Container Apps)"
              echo ""
              echo "The hub deployed, but **no Container Apps** were stamped: no \`loom-console\`, \`loom-unity\`, \`loom-trino\`, or \`iceberg-catalog\`."
              echo ""
              echo "\`gcc.bicepparam\` deliberately leaves \`deployAppsEnabled\` unset — there is no GCC image producer, so enabling it would fail every Container App PUT with \`MANIFEST_UNKNOWN\`. Tracked in #3078 (cloud-parity)."
              echo ""
              echo "**A success on this lane does not mean the GCC boundary serves Loom.**"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::GCC deployed $APPS Container App(s) in $RG."
            echo "### GCC deploy — $APPS Container App(s) deployed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Smoke test (GCC-specific — no Direct Lake)
        # Runs only when the Provision step RESOLVED a reachable target. Empty in
        # exactly two DECLARED states — topology=dlz-attach, and gcc.bicepparam
        # deploying no apps (#3078) — and the resolver FAILS the provision step
        # in every other case, so this cannot silently absorb a resolution defect.
        if: (github.event_name == 'schedule' || inputs.run_mode == 'full') && steps.provision.outputs.console_url != ''
        run: bash .github/scripts/fiab-smoke-test.sh
        env:
          CONSOLE_URL: ${{ steps.provision.outputs.console_url }}
          SKIP_DIRECT_LAKE_TEST: true   # No F-SKU in GCC

      # NEVER ON THE SCHEDULE — identical defect to deploy-fiab-gcch.yml. The
      # daily 08:00 UTC cron would tear the GCC estate down on every successful
      # run, because a scheduled event carries no inputs so `!inputs.keep_resources`
      # is `!''` = TRUE. Commercial has always guarded
      # `github.event_name != 'schedule'`; both sovereign lanes inverted it.
      - name: Teardown
        if: success() && github.event_name != 'schedule' && inputs.run_mode == 'full' && !inputs.keep_resources
        run: bash .github/scripts/fiab-teardown.sh
        env:
          RG_NAME: rg-csa-loom-admin-${{ env.AZURE_LOCATION }}

      - name: Note dry-run completion
        if: success() && inputs.run_mode == 'whatif-only'
        run: |
          echo "✅ whatif-only run complete. Bicep + auth validated; no resources provisioned."

      - name: Notify on failure (dedicated, OPEN issue - never a closed one)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Was: a comment on `issue_number: 279` - "CSA Loom - v1 build roadmap",
        # state CLOSED, 289 comments - with the body "Check workflow logs". That
        # is the literal mechanism by which 47 days of daily deploy failure
        # stayed invisible (deploy-integrity.md). The notifier now opens/updates
        # ONE dedicated OPEN issue per failing workflow, renders the classified
        # failure from deploy-failure.json, and FAILS if it cannot notify.
        run: |
          node .github/scripts/deploy-notify-failure.mjs \
            --workflow deploy-fiab-gcc \
            --result "${{ job.status }}" \
            --failure-json "$GITHUB_WORKSPACE/deploy-failure.json"

  # rel-T32 (B8): GCC post-deploy bootstrap — the SAME reusable bootstrap the
  # Commercial + Gov workflows call, boundary=GCC (Azure public cloud, GCC
  # identity → AZURE_GCC_* login, no az cloud set). Only on a real, KEPT deploy.
  post-deploy-bootstrap:
    name: Post-deploy bootstrap (GCC)
    needs: deploy-validate
    if: ${{ inputs.keep_resources && (github.event_name == 'schedule' || inputs.run_mode == 'full') && needs.deploy-validate.result == 'success' }}
    uses: ./.github/workflows/csa-loom-post-deploy-bootstrap.yml
    secrets: inherit
    with:
      boundary: GCC
      region: ${{ needs.deploy-validate.outputs.region }}
      admin_subscription: ${{ needs.deploy-validate.outputs.admin_sub }}
      dlz_subscription: ${{ needs.deploy-validate.outputs.dlz_sub }}
