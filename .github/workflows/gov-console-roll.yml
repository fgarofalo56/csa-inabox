name: gov-console-roll

# THE AZURE GOVERNMENT CONTINUOUS-DEPLOY LANE (#3730).
#
# Builds apps/fiab-console on the Gov ACR (server-side `az acr build`) and rolls
# the loom-console Container App to it, then health-gates. Uses the Gov deploy SP
# (the same creds deploy-fiab-gcch.yml uses). Non-interactive.
#
# ── WHY THIS FILE NOW HAS A `push` TRIGGER ─────────────────────────────────
# Measured 2026-08-18: the Gov console served `28de89fb`, stamped 2026-08-11,
# 251 commits behind main and eight minor versions back (0.90.2 vs 0.98.11).
# Commercial read 0-behind. The difference was not attention or luck — it was
# trigger configuration. Commercial is a self-driving chain:
#
#   build-fiab-images-acr-tasks   push          -> image on every merge
#   loom-roll-and-validate        workflow_run  -> roll when that build finishes
#   deploy-fiab-commercial        schedule      -> nightly infra apply
#
# Every Gov lane was `workflow_dispatch`-only, so a Gov roll happened only when a
# human remembered. `cloud-parity.md` is explicit that a capability which works
# in Commercial and not in Gov is INCOMPLETE — and continuous deployment is a
# capability. This lane is the Gov half of the first two rows above, collapsed
# into one job because the Gov registry serializes builds anyway.
#
# ── WHY BUILD AND ROLL STAY IN ONE JOB ─────────────────────────────────────
# Commercial splits them because its producer is a ~13-image parallel matrix and
# the roll must not be hostage to a sibling image breaking (#3260). Gov has no
# such split to make here, and keeping them together buys the property #3730
# actually needs: the tag this job rolls is the tag this job just built and
# digest-verified, so "an image matching the deployed SHA exists before the roll"
# is true BY CONSTRUCTION rather than by a cross-workflow assumption. There is no
# window in which this lane can re-roll an older image.
#
# ── AND WHY THERE IS STILL A STALENESS GATE ────────────────────────────────
# Building what you check out is not the same as checking out what is current.
# A dispatch from a stale ref, or from a branch, builds a real image, pushes a
# real digest, and passes every existence gate in this file — while shipping the
# Gov console code that is not what main says is released. `Gate — the image this
# roll builds must be CURRENT with main` is the one control that can see that,
# and it runs BEFORE the build so a refusal costs seconds rather than 20 minutes
# of ACR time. Decision logic + mutation proofs:
# scripts/ci/gov-roll-staleness-gate.mjs, scripts/ci/__tests__/.
#
# BE CLEAR ABOUT WHICH PATH THAT GATE ACTUALLY PROTECTS. On `push` its only
# non-zero verdicts — `behind` and `diverged` — are precisely the ones the
# trigger makes unreachable (GitHub fires `push: branches: [main]` only for
# commits on main), so every REACHABLE push verdict exits 0. The gate's teeth are
# on the DISPATCH path, which is the path #3730 measured: the single
# gov-console-roll run in seventeen days was a dispatch. What protects the
# automatic lane is the `push: branches: [main]` filter itself, not this gate.
# Stated explicitly so nobody later reads the gate as guarding the auto path and
# relaxes the trigger on that assumption.
#
# ── WHAT THIS LANE DOES NOT DO ─────────────────────────────────────────────
# It does not apply bicep. The Gov admin-plane template is deploy-fiab-gcch.yml's
# job, and `deploy-gov.yml` is a DIFFERENT estate entirely (deploy/bicep/gov/ —
# a data platform with no Container Apps and no ACR references at all; grep it).
# So "deploy-gov succeeded" has never been, and still is not, evidence that
# anything shipped to the Gov console. deploy-gov.yml now says so in its own run
# name.
#
# SC1 supply-chain gate: after the build (while the ACR data plane is still
# open for the tarball upload), the pushed image is Trivy-scanned (CRITICAL
# CVEs FAIL the run before anything rolls), cosign-signed keylessly via GitHub
# Actions OIDC, and the signature is cosign-VERIFIED against the trusted-
# workflow identity BEFORE the roll step ships it. Sigstore (Fulcio/Rekor) is
# reached from the GitHub-hosted runner, not from inside the Gov boundary, so
# this is cloud-invariant. Emergency valve (mirrors loom-roll-and-validate's
# skip_uat): the `skip_supply_chain` dispatch input skips scan+sign+verify
# with a loud warning. NOTE that valve is DISPATCH-ONLY by construction — on the
# `push` path `inputs.*` is the empty string, so `if: ${{ !inputs.skip_supply_chain }}`
# is TRUE and the automatic lane can never skip its own supply-chain gate. That
# is the safe direction, and it is a property of the trigger rather than of a
# default, so it cannot be edited away by changing a `default:`. The `lastgood`
# rollback path intentionally stays unverified: it re-ships the image that was
# already running. See docs/SUPPLY_CHAIN.md §7.

# SAY WHICH SHA THIS RUN ROLLS, in the run title — the same contract
# loom-roll-and-validate.yml carries. `gh run list` and the Actions UI otherwise
# show only the workflow name, and with two trigger paths (a merge, and a human
# recovering an estate) "which commit did that Gov roll actually ship?" becomes
# unanswerable from the run list.
run-name: >-
  gov-console-roll ${{ github.sha }}
  (${{ github.event_name == 'push' && 'merge-triggered' || 'manual dispatch' }})

on:
  # EVERY MERGE THAT CHANGES THE CONSOLE IMAGE ROLLS GOV. This is the line that
  # closes #3730's first acceptance criterion.
  #
  # The path filter mirrors the Commercial producer's for the console context.
  # KNOWN GAP, stated rather than hidden: the image also embeds the Copilot RAG
  # corpus, which `scripts/csa-loom/stage-copilot-corpus.sh` stages from repo-root
  # docs/ + PRPs/ — neither of which is listed here. A docs-only merge therefore
  # does not rebuild the Gov console, exactly as it does not rebuild the
  # Commercial one (build-fiab-images-acr-tasks.yml carries the same filter
  # shape). Widening it is a parity change for BOTH clouds, not a Gov-only one,
  # so it is deliberately not made here.
  push:
    branches: [main]
    paths:
      - 'apps/fiab-console/**'
      - '.github/workflows/gov-console-roll.yml'
      - 'scripts/ci/gov-roll-staleness-gate.mjs'
  workflow_dispatch:
    inputs:
      lastgood:
        description: 'Rollback image TAG if the new revision is unhealthy. BLANK (the default) means "whatever loom-console is running right now", MEASURED before the roll — that is almost always what you want. Only name a tag to roll back somewhere other than where you came from.'
        required: false
        default: ''
      allow_stale_image:
        description: 'EMERGENCY VALVE — roll even though this ref is NOT the current tip of main (recovering an estate onto a known-good older commit). Ships a Gov console that is knowingly behind main; the next merge-triggered roll supersedes it. Does NOT waive an UNKNOWN comparison — see scripts/ci/gov-roll-staleness-gate.mjs.'
        type: boolean
        default: false
      skip_supply_chain:
        description: 'EMERGENCY VALVE — skip the SC1 Trivy CRITICAL gate + cosign sign/verify (mirrors skip_uat semantics). The roll ships WITHOUT supply-chain verification.'
        type: boolean
        default: false
      bypass_agent_pool:
        description: 'DIAGNOSTIC (#2706) — build on the DEFAULT hosted ACR agent instead of the S3 pool. Separates "the pool is broken" from "ACR is broken". ANSWERED 2026-07-30 (run 30564119314): the default agent SIGKILLs the Next.js build worker at ~7min, so the pool is genuinely required — keep this false unless re-testing that.'
        type: boolean
        default: false
      agent_pool_name:
        description: 'ACR agent pool to build on (#2706). Default loombuild2 — the ORIGINAL `loombuild` pool on the Gov ACR has a backing queue stuck in "being deleted" (409); builds submitted to it sit ~60min and `az acr build` exits 0 having pushed NOTHING. loombuild2 is the fresh name that fixed it, proven by 8+ consecutive green rolls (17-23min each). If loombuild2 ever wedges the same way, pass a FRESH name (loombuild3) rather than retrying. Precedent: loompool -> loompool2, 2026-07-14 Spark incident.'
        type: string
        default: 'loombuild2'
      recreate_agent_pool:
        description: 'REMEDIATION (#2706) — delete + recreate the agent pool named by agent_pool_name before building. NOTE: this did NOT work on the wedged `loombuild` pool (run 30565655935 got "The specified queue is being deleted", 409) — a fresh NAME is the reliable move. Safe: an agent pool is stateless build compute and the build step recreates it when absent.'
        type: boolean
        default: false

permissions:
  contents: read
  # SC1: keyless cosign signing exchanges the Actions OIDC token for a
  # short-lived Fulcio certificate.
  id-token: write

# SERIALIZE ROLLS AGAINST THE SAME GOV CONTAINER APP.
#
# Mandatory now that this lane fires on `push`: before, only a human could start
# it and only one at a time. Two merges minutes apart would otherwise run two
# `az containerapp update` calls against loom-console concurrently, which returns
# ContainerAppOperationInProgress — an unclassified failure in a deploy path
# under deploy-integrity.md R6 — and both hold the SAME per-registry ACR firewall
# lease, so the second would sit waiting for the first anyway (see
# scripts/csa-loom/acr-firewall-lease.sh). Commercial hit exactly this and fixed
# it the same way in loom-roll-and-validate.yml (#3159).
#
# The group names the ROLL TARGET (resource group + app), not `github.ref`: every
# roll targets the same Container App, so a ref-keyed group would not serialize
# the thing that actually collides. It is a literal because GitHub does not
# expose the `env` context to a workflow-level `concurrency:` — it must stay in
# step with env.RG/env.APP below.
#
# cancel-in-progress is FALSE, deliberately. Killing a roll mid-`az containerapp
# update` is how ContainerAppOperationInProgress gets left behind, and a Gov
# console build is 17-23 minutes — cancelling one to start another would throw
# away the expensive half. A queued run that a newer merge supersedes has done
# nothing yet, and rolling the newer SHA is strictly better.
concurrency:
  group: gov-console-roll-rg-csa-loom-admin-usgovvirginia-loom-console
  cancel-in-progress: false

env:
  RG: rg-csa-loom-admin-usgovvirginia
  ACR: acrloomdcmt6cqoezlgs
  ACR_LOGIN: acrloomdcmt6cqoezlgs.azurecr.us
  APP: loom-console

jobs:
  roll:
    name: Build + roll Gov console
    runs-on: ubuntu-latest
    # #2706 — this job inherited the 6-hour default. Two consecutive runs spent
    # 4h25m and 3h29m+ in `az acr build` (Commercial builds the same commit in
    # ~30min) and burned most of a day before anyone could learn anything. A
    # bound turns "silently stuck" into a failed run someone can act on.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # ── #3730: REFUSE TO ROLL A GOV CONSOLE THAT IS NOT CURRENT WITH MAIN ──
      #
      # FIRST, before the Azure login and before the 17-23 minute build, because
      # a refusal should cost seconds and because there is nothing to clean up if
      # nothing has been touched yet.
      #
      # WHY THIS IS NOT REDUNDANT WITH THE DIGEST CHECK IN THE BUILD STEP. That
      # one answers "did az acr build actually push something?" — the #2706
      # wedged-agent-pool failure. It CANNOT answer "is this the right commit",
      # because a build of a two-week-old ref pushes a perfectly real image with a
      # perfectly real digest. Every existence gate in this file passes on a stale
      # ref. This is the only step that looks at WHICH commit.
      #
      # EVERY INPUT COMES FROM GITHUB, NEVER FROM AZURE — deliberately, so that a
      # Gov outage, an ACR firewall propagation window, or an expired Gov SP
      # secret can never render this UNKNOWN and block an emergency roll on a
      # fault that has nothing to do with the question being asked.
      #
      # No `|| true`, no `2>/dev/null`, no `continue-on-error`: the verdict IS the
      # exit status. 0 current (or waived) / 3 stale or diverged / 4 unknown —
      # 3 and 4 both stop the roll, and they are kept distinct so the log never
      # says "stale" about a comparison that never happened (deploy-integrity R7,
      # the 2026-08-05 "the tag does not exist" incident).
      #
      # ENFORCEMENT IS TRIGGER-AWARE, and `--trigger` is what carries that. On
      # `push` GitHub only fires for commits already on main, so "behind main" can
      # only mean a newer merge landed while this run queued — a SUPERSEDE, which
      # proceeds with a warning because failing it would paint an ordinary merge
      # sequence red. On a DISPATCH — the path #3730 actually measured, and the
      # only path that can aim this lane at an unmerged ref — every verdict keeps
      # full teeth. DIVERGED refuses on both. Rationale + mutation proofs live in
      # the script and scripts/ci/__tests__/gov-roll-staleness-gate.test.mjs.
      - name: Gate — the image this roll builds must be CURRENT with main
        id: staleness
        env:
          GH_TOKEN: ${{ github.token }}
          # EMPTY on the `push` path — `inputs.*` does not exist outside a
          # dispatch and a dispatch `default:` does not apply to other triggers.
          # So the automatic lane structurally cannot waive its own gate.
          ALLOW_STALE: ${{ inputs.allow_stale_image || 'false' }}
        run: |
          set -uo pipefail
          # The commit this run would ship is the one the build step compiles:
          # HEAD of THIS checkout. Deliberately not `github.sha` — the gate must
          # measure the tree that is about to be built, not a context value that
          # is merely expected to agree with it.
          ROLLED=$(git rev-parse HEAD | tr -d '\r\n')
          echo "rolled_sha=$ROLLED" >> "$GITHUB_OUTPUT"

          ERR=$(mktemp)
          MAIN="unknown"
          if MAIN_OUT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha' 2>"$ERR"); then
            MAIN=$(printf '%s' "$MAIN_OUT" | tr -d '\r\n')
            [ -n "$MAIN" ] || MAIN="unknown"
          else
            echo "::warning::Could not READ the tip of main from the GitHub API. This is not a verdict about the image — the gate below will report UNKNOWN and refuse. Detail: $(head -c 400 "$ERR")"
          fi

          STATUS="unknown"
          AHEAD="unknown"
          if [ "$MAIN" != "unknown" ]; then
            # base = the commit being rolled, head = main. So `ahead` means MAIN
            # is ahead, i.e. THIS ROLL is behind by ahead_by commits.
            if CMP=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${ROLLED}...${MAIN}" \
                       --jq '[.status, (.ahead_by | tostring)] | @tsv' 2>"$ERR"); then
              STATUS=$(printf '%s' "$CMP" | cut -f1 | tr -d '\r\n')
              AHEAD=$(printf '%s' "$CMP" | cut -f2 | tr -d '\r\n')
              [ -n "$STATUS" ] || STATUS="unknown"
              [ -n "$AHEAD" ] || AHEAD="unknown"
            else
              echo "::warning::Could not COMPARE ${ROLLED} against main via the GitHub API. Detail: $(head -c 400 "$ERR")"
            fi
          fi
          echo "main_sha=$MAIN" >> "$GITHUB_OUTPUT"
          echo "compare_status=$STATUS" >> "$GITHUB_OUTPUT"

          node scripts/ci/gov-roll-staleness-gate.mjs \
            --rolled-sha "$ROLLED" --main-sha "$MAIN" \
            --compare-status "$STATUS" --ahead-by "$AHEAD" \
            --trigger "${{ github.event_name }}" \
            --allow-stale "$ALLOW_STALE"

      - name: Azure login (Gov sub) — deploy SP
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment

      - name: Set Azure cloud to Gov
        run: az cloud set --name AzureUSGovernment

      - name: Build + push console image on the Gov ACR
        id: build
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short=8 HEAD)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "::notice::Building loom-console:$SHA on $ACR"
          # #2603: take the ACR firewall lease instead of a bare toggle. The
          # "Re-lock ACR (always)" step below then re-locks ONLY if this run is
          # still the recorded holder — an `if: always()` cleanup that fires on
          # cancellation can no longer deny another run's in-flight push. See
          # docs/fiab/acr-firewall-lease.md.
          # #2706 — was 120, which BOTH long runs exceeded while still building.
          # An expired lease mid-build means the re-lock cleanup can close the
          # data plane under an in-flight push. Kept just above the job's
          # timeout-minutes so the lease outlives any run that can still be
          # alive, and no longer.
          LOOM_ACR_LEASE_TTL_MINUTES=100 \
            bash scripts/csa-loom/acr-firewall-lease.sh acquire --acr "$ACR"
          # #3210 — this loop had NO verdict (`&& break` with no failure path)
          # and `az acr login` is the wrong oracle anyway: it authenticates via
          # an ARM-mediated token exchange and returns 0 while the registry is
          # still denying the runner by IP. acr-dataplane-ready.sh probes
          # `GET https://<acr><suffix>/v2/` on the same HTTP path the data-plane
          # tools use, and derives the suffix from the active cloud so it works
          # unchanged in .azurecr.us (.claude/rules/cloud-parity.md).
          bash "${LOOM_ACR_DATAPLANE_READY_SCRIPT:-scripts/ci/acr-dataplane-ready.sh}" --acr "$ACR" --timeout-seconds 180             || echo "::warning::ACR data plane not confirmed reachable; the next data-plane call may be denied."
          bash scripts/ci/acr-login-retry.sh --acr "$ACR"
          # 2026-07-16: console builds run on a dedicated 16 GB S3 agent pool —
          # the default 8 GB agent cgroup-OOM-SIGKILLs the compile. Agent pools
          # are available in USGov Arizona/Texas/Virginia. Pool builds don't get
          # the trusted-service bypass, so the ACR stays open through the build
          # (it already is for the tarball upload).
          # #2706 — the pool NAME is an input. The original `loombuild` queue on
          # this registry is stuck in "being deleted" (409), which is what made
          # az acr build exit 0 while pushing nothing; `loombuild2` is the fresh
          # name that fixed it and is now the DEFAULT (8+ consecutive green rolls,
          # 17-23min each). Recreating the wedged pool did NOT work (run
          # 30565655935) — a fresh NAME is the reliable move.
          POOL="${{ inputs.agent_pool_name }}"
          POOL="${POOL:-loombuild2}"
          echo "::notice::building on ACR agent pool: $POOL"

          # #2706 REMEDIATION — recreate the pool when asked. The bypass diagnostic
          # (run 30564119314) established the pool is at fault: ON it `az acr build`
          # runs 60min, exits 0 and pushes NOTHING; OFF it the same commit fails in
          # 7min with real streaming logs. Deleting is safe — an agent pool is
          # stateless build compute, and the `|| create` below rebuilds it, so this
          # is self-healing rather than destructive.
          if [ "${{ inputs.recreate_agent_pool }}" = "true" ]; then
            echo "::warning::#2706 — recreating the $POOL agent pool."
            echo "  runs before delete (evidence for Azure support if this does not fix it):"
            az acr task list-runs -r "$ACR" --top 10 -o table 2>&1 | sed 's/^/    /' | head -14 || true
            az acr agentpool delete -r "$ACR" -n "$POOL" --yes -o none 2>&1 | head -3 || true
            az acr agentpool create -r "$ACR" -n "$POOL" --tier S3 --count 1 -o none
            echo "::notice::$POOL recreated (S3, count 1)"
          fi

          az acr agentpool show -r "$ACR" -n "$POOL" -o none 2>/dev/null \
            || az acr agentpool create -r "$ACR" -n "$POOL" --tier S3 -o none
          CNT=$(az acr agentpool show -r "$ACR" -n "$POOL" --query count -o tsv | tr -d '\r')
          [ "${CNT:-0}" -ge 1 ] || az acr agentpool update -r "$ACR" -n "$POOL" --count 1 -o none
          STAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # #2706 — report the agent pool BEFORE building. Two consecutive runs
          # sat in `az acr build` for 3.5-4.5h with zero output; if the single S3
          # agent is unhealthy or still scaling from 0 the run just queues rather
          # than failing, and `--no-logs` made a stall indistinguishable from a
          # slow build. Print what we are about to build on.
          #
          # provisioningState is NOT the tell — it read `Succeeded` on BOTH
          # silent failures (runs 30552543683, 30558316496). Printed for
          # forensics only; do not gate on it.
          echo "::notice::agent pool state before build:"
          az acr agentpool show -r "$ACR" -n "$POOL" \
            --query "{count:count,tier:tier,state:provisioningState}" -o tsv 2>&1 | sed 's/^/  pool: /' || true

          # #2706 — QUEUE DEPTH IS THE SIGNAL, and it used to be printed and
          # DISCARDED. Measured, on this exact registry:
          #
          #   loombuild  (wedged queue)  queued=3 / queued=4  -> ~60min, exit 0, NO image
          #   loombuild2 (healthy)       queued=0  x8 runs    -> 17-23min, image pushed
          #
          # This run already holds the ACR firewall lease — a real mutex (see
          # scripts/csa-loom/acr-firewall-lease.sh), and every `az acr build`
          # call site on this registry takes it. So no other legitimate build can
          # be occupying the queue right now: a queue that will not drain is a
          # STUCK queue, not contention. Wait briefly for a straggler, then FAIL
          # FAST with the remediation instead of burning an hour discovering the
          # same thing. An unreadable probe is reported as UNKNOWN, never as
          # "clear" — a check that cannot distinguish those measures nothing.
          read_queue() {
            az acr agentpool show -r "$ACR" -n "$POOL" --queue-count -o tsv 2>/dev/null \
              | tr -d '\r' | grep -E '^[0-9]+$' | tail -1 || true
          }
          Q="$(read_queue)"
          if [ -n "$Q" ] && [ "$Q" != "0" ]; then
            echo "::warning::#2706 — $POOL reports $Q queued item(s) before this build; waiting up to 5min for it to drain."
            for i in $(seq 1 20); do
              sleep 15
              N="$(read_queue)"
              if [ -z "$N" ]; then
                echo "  queued: UNKNOWN (read failed) — NOT treating that as drained ($i/20)"
                continue
              fi
              Q="$N"
              echo "  queued: $Q ($i/20)"
              if [ "$Q" = "0" ]; then break; fi
            done
          fi
          if [ -z "$Q" ]; then
            echo "::warning::#2706 — could not read the queue depth for $POOL. This is UNKNOWN, not zero; proceeding, but if this build runs long and pushes nothing, the wedged-queue failure mode is the first thing to check."
          elif [ "$Q" != "0" ]; then
            echo "::error::#2706 — the '$POOL' queue on $ACR still holds $Q item(s) after 5 minutes, and this run holds the ACR firewall lease so nothing legitimate is building. That is the signature of the queue stuck in 'being deleted' that made az acr build exit 0 after ~60min having pushed NO image. Do NOT retry on this pool and do NOT bother recreating it (that returned 409 in run 30565655935) — re-dispatch with agent_pool_name set to a FRESH name, e.g. loombuild3. Precedent: loombuild -> loombuild2 here, loompool -> loompool2 in the 2026-07-14 Spark incident."
            exit 1
          else
            echo "::notice::  queued: 0 — the $POOL queue is clear"
          fi

          # Logs STREAM now (the `--no-logs` opt-out is gone). A silent build is
          # exactly the shape this repo keeps getting burned by: it looks
          # identical whether it is compiling or wedged. The extra output is a
          # rounding error next to a 4-hour blind wait.
          # #2706 diagnostic — bypass_agent_pool builds on the DEFAULT hosted ACR
          # agent. Two instrumented runs had `az acr build` exit 0 on the pool
          # while pushing no tag; this separates "the pool is broken" from "ACR is
          # broken". An OOM on the default agent is a MEANINGFUL result (the pool
          # is genuinely required); a successful build indicts the pool.
          POOL_ARGS=(--agent-pool "$POOL")
          if [ "${{ inputs.bypass_agent_pool }}" = "true" ]; then
            echo "::warning::#2706 DIAGNOSTIC — building on the DEFAULT hosted agent, NOT the $POOL S3 pool. This is EXPECTED to fail: run 30564119314 proved the default 8 GB agent SIGKILLs the Next.js build worker at ~7min."
            POOL_ARGS=()
          fi

          # #2929 — stage the Copilot RAG corpus INTO the build context first.
          # docs/ + PRPs/ live at repo root, outside apps/fiab-console, so
          # without this the Gov console image ships copilot-corpus/ holding only
          # .gitkeep and POST /api/help-copilot/reindex 502s with "No corpus
          # chunks discovered". Commercial hit exactly this on 2026-08-04.
          # Enforced by scripts/ci/check-console-corpus-staged.mjs.
          bash scripts/csa-loom/stage-copilot-corpus.sh

          az acr build --registry "$ACR" "${POOL_ARGS[@]}" \
            --image "loom-console:$SHA" --image "loom-console:latest" \
            --file apps/fiab-console/Dockerfile \
            --build-arg "LOOM_BUILD_SHA=$SHA" --build-arg "LOOM_BUILD_TIMESTAMP=$STAMP" \
            apps/fiab-console

          # #2706 — VERIFY THE TAG EXISTS HERE, not one step later. Both failures
          # had this command report success and the tag be absent; asserting it
          # inside the build step makes "success" mean the image is really there.
          # #3117 (deploy-integrity R7). This was:
          #   if ! az acr repository show … -o none 2>/dev/null; then
          #     echo '::error::… does NOT exist … the build silently produced nothing'
          # Any non-zero exit — auth, throttle, firewall, DNS — became 'does NOT
          # exist', and `2>/dev/null` destroyed the evidence that would have
          # classified it. On this step in particular the false diagnosis is
          # expensive: it blames a wedged ACR agent pool and tells the operator to
          # re-dispatch with a FRESH pool name, which is a long, disruptive
          # remediation for a problem that is usually the firewall.
          #
          # resolve-acr-digest.sh keeps the three states apart and is self-tested:
          #   0 = digest on stdout   3 = registry ANSWERED absent   4 = could not READ
          set +e
          DIGEST=$(bash "$GITHUB_WORKSPACE/scripts/ci/resolve-acr-digest.sh" \
                     --acr "$ACR" --image "loom-console:$SHA")
          RC=$?
          set -e
          if [ $RC -eq 3 ]; then
            echo "::error::az acr build exited 0 but the registry ANSWERED NOT FOUND for loom-console:$SHA on $ACR — the build silently produced nothing (#2706). Re-dispatch with agent_pool_name set to a FRESH name, e.g. loombuild3."
            exit 1
          fi
          if [ $RC -ne 0 ]; then
            echo "::error::could NOT READ $ACR to confirm loom-console:$SHA (see the resolver output above). This is NOT proof the tag is missing and it is NOT evidence of a wedged agent pool — the registry never answered. Most likely the ACR firewall is closed to this runner or a firewall change has not propagated. Refusing to roll an unverified image."
            exit 1
          fi
          echo "::notice::loom-console:$SHA verified present on $ACR -> $DIGEST"
          q=$(az acr agentpool show -r "$ACR" -n "$POOL" --queue-count -o tsv 2>/dev/null | tr -d '\r' || echo 1)
          [ "${q:-1}" = "0" ] && az acr agentpool update -r "$ACR" -n "$POOL" --count 0 --no-wait -o none || true
          # NOTE (SC1): the ACR re-lock moved to a dedicated `if: always()` step
          # below so (a) the supply-chain gate can pull the image + push the
          # signature while the data plane is still open, and (b) a failed
          # build/scan no longer leaves the ACR open.

      # ── SC1: supply-chain gate — scan, sign, verify BEFORE the roll ──
      - name: Supply-chain — resolve image digest
        id: sc
        if: ${{ !inputs.skip_supply_chain }}
        run: |
          set -euo pipefail
          bash scripts/ci/acr-login-retry.sh --acr "$ACR"
          DIGEST=$(az acr repository show --name "$ACR" --image "loom-console:$SHA" --query digest -o tsv | tr -d '\r')
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not resolve the manifest digest for loom-console:$SHA on $ACR — cannot scan/sign/verify."
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "::notice::loom-console:$SHA → $DIGEST"

      - name: Supply-chain — Trivy gate (fail on CRITICAL CVEs)
        if: ${{ !inputs.skip_supply_chain }}
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.ACR_LOGIN }}/loom-console:${{ env.SHA }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # Vuln gating only + reviewed baseline (see .trivyignore) — same
          # posture as build-fiab-images-acr-tasks; secret-scan FPs on minified
          # bundles are excluded, source secret hygiene has its own lane.
          scanners: vuln
          trivyignores: .trivyignore
          format: table

      - name: Supply-chain — install cosign
        if: ${{ !inputs.skip_supply_chain }}
        uses: sigstore/cosign-installer@v4.1.2
        # PIN THE CLI. cosign-installer v4 defaults to Cosign v3.0.5 — a MAJOR
        # upgrade of the tool that signs every image this repo ships. Every
        # workflow that runs `cosign sign` / `cosign verify` is DISPATCH-ONLY, so
        # PR CI never exercises it: a green PR proves nothing about signing, and
        # the failure mode that matters is an image that signs fine and fails
        # `verify` AT ROLL TIME, which stops deploys (deploy-integrity R1).
        # Upstream discourages pinning "unless you have a specific reason";
        # not silently changing the signature format on a path CI cannot run is
        # a specific reason. Cosign v3 gets its own change, with a real receipt.
        with:
          cosign-release: v2.6.1

      - name: Supply-chain — cosign sign (keyless OIDC) + verify-before-roll
        if: ${{ !inputs.skip_supply_chain }}
        run: |
          set -euo pipefail
          REF="$ACR_LOGIN/loom-console@${{ steps.sc.outputs.digest }}"
          echo "Signing $REF keylessly (GitHub Actions OIDC → Fulcio/Rekor) ..."
          # Via the shared retry — see scripts/ci/cosign-sign-retry.sh. Refusing
          # to roll an unsigned image is still the outcome when it exhausts.
          bash scripts/ci/cosign-sign-retry.sh --ref "$REF"
          echo "Verifying $REF before the roll ..."
          IDENTITY_RE="^https://github\\.com/${{ github.repository }}/\\.github/workflows/(build-fiab-images-acr-tasks\\.yml|full-app-deploy-commercial\\.yml|gov-console-roll\\.yml)@"
          if ! cosign verify "$REF" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity-regexp "$IDENTITY_RE" \
              --output text; then
            echo "::error::SC1 SUPPLY-CHAIN GATE FAILED — $REF has NO valid cosign signature from a trusted build workflow. Refusing to roll. Emergency only: re-dispatch with skip_supply_chain=true."
            exit 1
          fi
          echo "::notice::SC1 supply-chain gate PASSED — $REF scanned (Trivy CRITICAL), signed, and verified. Proceeding to roll."

      - name: Supply-chain — skip notice
        if: ${{ inputs.skip_supply_chain }}
        run: |
          echo "::warning::skip_supply_chain is set — SKIPPING the SC1 Trivy CRITICAL gate + cosign sign/verify. This roll ships an UNSCANNED, UNSIGNED image; a later commercial-style roll of this tag will be rejected by the verification gates."

      - name: Re-lock ACR (always)
        # `always()` IS NOT ENOUGH ONCE A GATE RUNS BEFORE THE AZURE LOGIN.
        #
        # The staleness gate (`id: staleness`) sits ahead of `Azure login` so a
        # refusal costs seconds instead of a 20-minute build. That made this
        # cleanup reachable on a path where NO `az` credential exists and NO
        # lease was ever taken — and traced through acr-firewall-lease.sh the
        # consequences are worse than a wasted step:
        #
        #   ACR_LEASE_STATE defaults to `none`; `_lease_acr_q` swallows stderr,
        #   so an UNAUTHENTICATED `az acr show` returns empty; with no owner and
        #   no live holder the state matches none of held / held-claim-only /
        #   unleased, so it falls to the fail-closed branch, runs `az acr update`
        #   unauthenticated, burns 6 retries x 20s, and exits 1 printing
        #   "release FAILED on ACR 'acrloomdcmt6cqoezlgs' (no live lease holder).
        #   The registry may be PUBLICLY REACHABLE".
        #
        # An operator dispatching from a stale ref during an incident would get a
        # correct refusal followed by two minutes of red telling them a sovereign
        # registry may be exposed — about a registry this run never opened. That
        # is a false claim of exactly the "the tag does not exist" shape
        # (deploy-integrity R7) that this PR exists to remove, fired precisely
        # when someone is recovering.
        #
        # SO IT KEYS ON THE STEP THAT ACQUIRES THE LEASE, not on `always()` and
        # not on the gate. `Build + push console image on the Gov ACR` is where
        # `acr-firewall-lease.sh acquire` runs, so:
        #   - it EXECUTED (success or failure) -> a lease may be held, release it.
        #   - it was SKIPPED (gate refused, or the Azure login failed) -> nothing
        #     was ever opened and there is nothing to release.
        # Testing the two executed conclusions POSITIVELY rather than `!=
        # 'skipped'` also covers a cancelled job, where an unrun step's
        # conclusion is empty rather than 'skipped'.
        if: always() && (steps.build.conclusion == 'success' || steps.build.conclusion == 'failure')
        run: |
          set -euo pipefail
          # #2603: re-locks only if this run still holds the firewall lease; if
          # another run holds it, this leaves the registry open for them (they
          # release it, and acr-firewall-sweeper re-locks if they die). If
          # nobody holds it, this re-locks anyway — fail closed.
          #
          # C24 (#3088): the trailing `|| true` is GONE. `release` now verifies
          # the registry actually locked and exits non-zero when it could not
          # confirm it; discarding that result would restore the exact defect
          # measured on 2026-08-07 — a green "Re-lock ACR" job sitting on top of
          # a publicly reachable registry. If this step goes red, the registry
          # may be open: read the remediation the script prints.
          bash scripts/csa-loom/acr-firewall-lease.sh release --acr "$ACR"

      - name: Roll loom-console + health-gate
        env:
          # THE ROLLBACK TARGET, AND WHY IT IS NO LONGER A LITERAL.
          #
          # This was `${{ inputs.lastgood }}` with `default: '26e7f3db'`, read
          # directly inside the rollback command. Both halves break the moment
          # this lane fires on `push`:
          #
          #   1. `inputs.*` IS THE EMPTY STRING outside a dispatch, and a
          #      workflow_dispatch `default:` does NOT apply to other triggers.
          #      So every merge-triggered roll whose revision came up Unhealthy
          #      would have run
          #          az containerapp update --image <acr>/loom-console:
          #      i.e. an empty tag — the rollback would fail, and the estate
          #      would be left on the unhealthy revision by the very step whose
          #      job is to rescue it. This is the same class as the schedule-path
          #      input defect that froze deploy-fiab-commercial's nightly
          #      reconcile for weeks (scripts/ci/deploy-trigger-policy.mjs).
          #   2. Even on a dispatch, `26e7f3db` is a hardcoded tag from an
          #      earlier era. Rolling "back" to it from a recent revision is not
          #      a rollback, it is a months-long regression that reports success.
          #
          # The honest rollback target is the image that was RUNNING before this
          # roll, and the platform can measure that instead of asking for it
          # (auto-bind-by-default.md §5). The input is kept as an override for
          # the case a human genuinely wants somewhere else.
          LASTGOOD_IN: ${{ inputs.lastgood }}
        run: |
          set -euo pipefail
          IMG="$ACR_LOGIN/loom-console:$SHA"

          # MEASURE the rollback target BEFORE mutating anything. No
          # `2>/dev/null || echo ""`: an unreadable control plane is not an empty
          # image, and rolling with no way back is worse than not rolling. Under
          # `set -e` a failed read aborts here, before the estate is touched.
          PREV_IMAGE=$(az containerapp show -n "$APP" -g "$RG" \
            --query "properties.template.containers[0].image" -o tsv | tr -d '\r')
          if [ -z "$PREV_IMAGE" ]; then
            echo "::error::Read the $APP Container App successfully but it reported NO current image, so this roll would have no rollback target. That is not a state this workflow has reasoned about — refusing before touching the estate rather than rolling without a way back."
            exit 1
          fi
          if [ -n "$LASTGOOD_IN" ]; then
            ROLLBACK_IMAGE="$ACR_LOGIN/loom-console:$LASTGOOD_IN"
            echo "::notice::Rollback target OVERRIDDEN by the lastgood input: $ROLLBACK_IMAGE (the image actually running right now is $PREV_IMAGE)."
          else
            ROLLBACK_IMAGE="$PREV_IMAGE"
            echo "::notice::Rollback target = the image currently running: $ROLLBACK_IMAGE"
          fi

          # THE REMEDIATION MUST BE PASTEABLE INTO THE INPUT IT NAMES.
          #
          # `lastgood` is consumed as a TAG above ("$ACR_LOGIN/loom-console:$LASTGOOD_IN"),
          # so telling an operator `lastgood=<full ref>` yields
          #   …/loom-console:acrloomdcmt6cqoezlgs.azurecr.us/loom-console:28de89fb
          # which is not a valid reference and makes the rollback they were told
          # to run fail. A remediation that cannot be followed is the same defect
          # class as one that is untrue (deploy-integrity R6/R7).
          #
          # Digest-pinned refs are a REAL shape on Gov, not a hypothetical: a Gov
          # apply can set `<acr>/<app>@sha256:…` (see
          # scripts/ci/assert-no-silent-image-tag-revert.mjs). `${VAR##*:}` on one
          # of those returns the hex digest, which is not a tag either — so that
          # case is detected and gets different advice rather than a confident
          # wrong answer.
          case "$ROLLBACK_IMAGE" in
            *@sha256:*)
              LASTGOOD_HINT=""
              ROLLBACK_ADVICE="the previous image is DIGEST-pinned ($ROLLBACK_IMAGE) and the lastgood input takes a TAG, so roll back directly with: az containerapp update -n $APP -g $RG --image '$ROLLBACK_IMAGE'"
              ;;
            *)
              LASTGOOD_HINT="${ROLLBACK_IMAGE##*:}"
              ROLLBACK_ADVICE="re-dispatch with lastgood=$LASTGOOD_HINT"
              ;;
          esac

          az containerapp update -n "$APP" -g "$RG" --image "$IMG" -o none
          NEWREV=$(az containerapp revision list -n "$APP" -g "$RG" \
            --query "[?properties.template.containers[0].image=='$IMG'].name | [0]" -o tsv | tr -d '\r')
          if [ -z "$NEWREV" ]; then
            echo "::error::The Container App update reported success but NO revision on $APP is running $IMG. The roll has therefore not done what it says it did, and the health loop below would probe an empty revision name and report a timeout about nothing. Refusing here instead, while the log still names the real symptom."
            exit 1
          fi
          echo "::notice::New revision $NEWREV"
          H=""
          # `2>/dev/null` is GONE from this read. It made a persistent failure —
          # an expired token, a throttle, a revision name that never resolved —
          # look identical to "not Healthy yet", so the loop would spin for the
          # full twelve minutes and then report a health timeout about a probe
          # that had never once succeeded (deploy-integrity R7). The stderr is
          # kept and printed instead, and an unreadable probe is named as such.
          PROBE_ERR=$(mktemp)
          READS=0
          for i in $(seq 1 24); do
            if H=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$NEWREV" \
                     --query properties.healthState -o tsv 2>"$PROBE_ERR"); then
              H=$(printf '%s' "$H" | tr -d '\r\n')
              READS=$((READS + 1))
            else
              H=""
              echo "  [$i/24] health probe FAILED (this is not a health verdict): $(head -c 300 "$PROBE_ERR" | tr -d '\r\n')"
            fi
            echo "$(date -u +%H:%M:%S) $NEWREV=${H:-<unread>}"
            case "$H" in
              Healthy) echo "::notice::GOV-CONSOLE-ROLL $SHA HEALTHY"; exit 0 ;;
              Unhealthy) echo "::error::Revision $NEWREV came up Unhealthy on $IMG — rolling back to $ROLLBACK_IMAGE"; az containerapp update -n "$APP" -g "$RG" --image "$ROLLBACK_IMAGE" -o none; exit 1 ;;
            esac
            sleep 30
          done
          if [ "$READS" -eq 0 ]; then
            echo "::error::The health probe for revision $NEWREV NEVER returned an answer in 24 attempts (see the per-attempt stderr above), so this run established NOTHING about whether the new Gov revision is healthy — it is not 'unhealthy', it is unmeasured. The roll DID happen; investigate the Gov control-plane read (token, RBAC, throttling) before concluding anything about the image. If the estate is degraded, roll back deliberately: $ROLLBACK_ADVICE."
            exit 1
          fi
          echo "::error::Revision $NEWREV never reached Healthy within ~12 minutes (last state read: ${H:-<unread>}, successful probes: $READS/24). NOT rolling back automatically on a timeout — an inconclusive health read is not evidence the new revision is bad, and traffic stays on the previous revision until this one goes Healthy. If the estate is degraded, roll back deliberately: $ROLLBACK_ADVICE."
          exit 1
