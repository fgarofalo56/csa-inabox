name: csa-loom-spark-probe2

# ---------------------------------------------------------------------------
# DIAGNOSTIC: identical to csa-loom-spark-livy-probe.yml (this file was
# created as a byte-for-byte copy of it during the 2026-07 "notebooks slow"
# investigation, differing only in `name:`). Both run the SAME probe script.
#
# #3034: like its sibling, this file was INVALID YAML from the day it was
# written (column-0 Python inside the `run:` block scalar) — every run had
# jobs=0 and the probe never executed once. The body now lives in
# scripts/csa-loom/spark-livy-probe.sh, shared with the sibling so the two
# cannot drift. Candidate for retirement — kept dispatchable for now because
# removing a workflow is an operator decision, not a YAML fix.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      pool:
        description: 'Spark pool name'
        type: string
        default: loompool
        required: false
      with_la_emitter:
        description: 'Include the Log Analytics emitter conf (to A/B whether it kills the session)'
        type: boolean
        default: false
        required: false

permissions:
  id-token: write
  contents: read

env:
  DLZ_SUB: 363ef5d1-0e77-4594-a530-f51af23dbf8c
  SYN_WS: syn-loom-default-centralus

jobs:
  livy-probe:
    name: 'Livy session probe (in-VNET)'
    runs-on: [self-hosted, loom-aca]
    timeout-minutes: 20
    steps:
      - name: Checkout (the probe script lives in the repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Azure login (deploy SP — Synapse Spark admin)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.DLZ_SUB }}
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Create + poll a Livy session, dump driver log
        env:
          POOL: ${{ inputs.pool || 'loompool' }}
          WITH_LA: ${{ inputs.with_la_emitter }}
        run: bash scripts/csa-loom/spark-livy-probe.sh
