      # shellcheck rule when shellcheck is absent from PATH (measured: 5 findings
      # with it, 0 without, on the same file) — so the guard lints a fixture with
      # a planted SC2086 and fails if it does not come back.
      - name: 'workflow-actionlint (pinned actionlint + shellcheck, ratcheted; probes prove shellcheck + invalid-YAML detection are live; unparseable = hard fail, #3034)'
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-workflow-actionlint.mjs
      # #3025 — there is NO out-of-band MSAL rotation marker: one existed, was
      # written only by a post-deploy `az containerapp update`, was never
      # declared in admin-plane bicep, and was measured ABSENT from all 425 env
      # vars on the live console after a re-render. So the rule is now the
      # MISMATCH (a marker written by a script that bicep does not declare),
      # the runbook must name `az ad app credential list` as the record and
      # still roll a revision after the secret set, must name the UAMI (not
      # `system`), and neither file may discard the result of an MSAL wiring
      # command. Self-test first: it carries the mutant fixtures (marker added
      # alongside a clean roll / marker fragment with no command token /
      # identityref:system / `|| echo` / a dark bicep probe) and proves the
      # analyser flags each before the real files are judged.
      - name: 'msal-rotation-consistency (no out-of-band rotation marker; runbook names the Entra credential list + the UAMI — #3025)'
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci/check-msal-rotation-consistency.mjs --self-test
          node scripts/ci/check-msal-rotation-consistency.mjs
      # #3335 — MEASURED on the live Commercial app registration 2026-08-13:
      # NINE live password credentials, five minted that day, each `--years 2`.
      # The bootstrap minted UNCONDITIONALLY on every invocation and nothing
      # pruned; the mint rate follows the DEPLOY rate (deploy-fiab-commercial
      # ran 11 times that day and calls the bootstrap via workflow_call). The
      # in-bicep sibling carried the OPPOSITE defect — a bare `credential reset`
      # with no --append, which deletes every credential including the one the
      # running console is serving.
      #
      # This is the STATIC half. The live half is the credential ceiling the
      # bootstrap asserts on the real count; that can only fail once a
      # regression has reached an estate, so this one fails at review time. Both
      # analyzers were run against the pre-fix files and reported the defects at
      # the exact lines the issue names (bootstrap:268, bicep:178).
      # Self-test first: it carries the mutant fixtures (bare reset,
      # unconditional mint, missing/discarded ceiling, prune with no dry run,
      # an echoed ${SECRET}, a delete without --key-id, and a subject with no
      # mint at all) and proves the analyser flags each before the real files
      # are judged. Runtime behaviour is covered separately by
      # scripts/ci/__tests__/msal-credential-lifecycle.test.mjs, which drives
      # the REAL script against a stub `az`.
      - name: 'msal-credential-hygiene (mints are appended + gated by reuse, ceiling can fail, prune is dry-runnable, no value ever printed — #3335)'
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci/check-msal-credential-hygiene.mjs --self-test
          node scripts/ci/check-msal-credential-hygiene.mjs
      # #3042 — the meta-guard for THIS file: every `run:` step above must
      # carry `if: ${{ !cancelled() }}`, or one failing guard hides the rest
      # behind benign-looking `skipped` steps again. Self-test first (mutant
      # fixtures: a run step with no `if`, and one with `if: success()`).
      - name: 'guardrails-observability (every guard step runs even when a sibling fails — #3042)'
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci/check-guardrails-observability.mjs --self-test
          node scripts/ci/check-guardrails-observability.mjs
