name: Loom Guardrails

# Merge-blocking guardrails that turn CSA Loom's recurring bug-classes into
# CI failures. See scripts/ci/*.mjs for each rule + how to add an allowlist.
#
# EVERY GUARD RUNS, EVERY FAILURE REPORTS (#3042). Each `run:` step carries
# `if: ${{ !cancelled() }}`: without it, the first failing guard renders every
# later guard as `skipped`, and skipped reads as passed to anyone scanning the
# run — which is how a SECOND, unrelated blocker sat invisible behind #3040 and
# would have turned main green for exactly one run. Two simultaneous failures
# must both be visible from a single run. The job still fails if any step
# fails; the `if` only stops one failure from hiding the others. (If a setup
# step fails, every guard fails loudly — that is fail-closed, not noise.)
# check-guardrails-observability.mjs enforces this invariant mechanically.
on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read
  # prp-freshness re-counts two PRP facts that are PR STATES (#2389, #2392) via
  # `gh pr view`, which needs pull-requests:read. Without it `gh` 403s.
  # That mattered the moment FRESH0 stopped being warn-only: for its entire
  # warn-only life those two facts had NEVER been measured in CI — the 403 was
  # swallowed into the literal string 'UNKNOWN', compared unequal to 'MERGED',
  # emitted a ::warning:: nobody read, and exited 0. A gate that cannot reach
  # its own evidence has verified nothing (`gates_that_measure_nothing`).
  pull-requests: read

concurrency:
  group: loom-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    # 10 was the original budget and the job has outgrown it: on 2026-08-11 it
    # ran 10m15s, was killed at step 94 of 98, and GitHub reported the kill as
    # `cancelled` — which in a run list reads like "superseded by a newer push",
    # not "this job died". The four steps after it showed as `skipped`, and
    # skipped reads as passed (the #3042 shape this file's `if: !cancelled()`
    # convention exists to prevent — a TIMEOUT defeats that convention, because
    # the runner is gone). Raised with headroom; if it approaches this again the
    # answer is to split the job, not to raise it further.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history so check-parity-doc-freshness can read per-file commit dates
          fetch-depth: 0
      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: env-sync (LOOM_* read-but-not-emitted)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-env-sync.mjs
      - name: adoption-catalog-sync (adopt-or-create catalog must match the bicep that honours it)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-adoption-catalog-sync.mjs
      - name: fitness-messages (every adoption check records what it OBSERVED; unknown never claims non-existence)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-fitness-messages.mjs
      - name: route-guards (cross-tenant BFF authorization)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-route-guards.mjs
      - name: credential-route-authz (routes returning keys must authorize, not just authenticate)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-credential-route-authz.mjs
      - name: tid-boundary-chokepoint (the cross-tenant boundary cannot be skipped by omission)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-tid-boundary-chokepoint.mjs
      - name: loom-content-id-chokepoint (a `loom:` bundle id must not 404 an item that exists — #2830)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-loom-content-id-chokepoint.mjs
      - name: kv-secret-purpose (every Key Vault read declares its name-space)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-kv-secret-purpose.mjs
      - name: containerlog-query-scope (a log query must not be able to count its own output)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-containerlog-query-scope.mjs
      - name: no-freeform (raw-JSON config surfaces)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-no-freeform.mjs
      - name: sql-quoting (inline identifier/literal quoting outside lib/sql/quoting.ts)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-sql-quoting.mjs
      - name: bff-errors (raw exception text on 500 + raw-envelope helpers)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-bff-errors.mjs
      - name: editor-read-failure-honesty (a failed read must never look like empty content — C19 data loss)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-editor-read-failure-honesty.mjs
      - name: quadratic-trims (the two ReDoS trim shapes closed to zero — PR #2677)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-quadratic-trims.mjs
      - name: no-raw-px (raw-px inline styles vs Loom tokens — backlog DRAINED, now absolute)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-no-raw-px.mjs
      - name: client-route-map drift (generated /api map vs app/api — R15)
        if: ${{ !cancelled() }}
        run: node scripts/ci/generate-client-route-map.mjs --check
      - name: known-client-routes (every client /api call names a real BFF route — R17)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-known-client-routes.mjs
      - name: learn-doc-registry (Learning Hub slug sets vs authored guides/captures — loom-apex D1)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-learn-doc-registry.mjs
      - name: no-bare-client-fetch (client /api fetch must use clientFetch)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-no-bare-client-fetch.mjs
      - name: route-toolkit (hand-rolled session-route ratchet — loom-next-level R3)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-route-toolkit.mjs
      - name: owner-only-workspace-guard (a workspace point-read that asks "did you CREATE it" — #2947)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-owner-only-workspace-guard.mjs
      - name: url-boundary (no substring URL validation — parse the host instead)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-url-boundary.mjs
      - name: remote-path-containment (no HTTP-response value becomes a filesystem path — js/http-to-file-access)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-remote-path-containment.mjs
      - name: regex-anchor (mixed-anchor alternation in a secret-name predicate — #2772)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-regex-anchor.mjs
      - name: temp-artifact-safety (fixed path in a world-writable temp dir; decodes base64 payloads — CodeQL #323/#330)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-temp-artifact-safety.mjs
      - name: log-injection (sanitizer stays CodeQL-recognisable + route console.* args are sanitized)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-log-injection.mjs
      - name: prototype-pollution (request-derived object keys + the dismissal register)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-prototype-pollution.mjs
      - name: unity-audit-chokepoint (every Unity Catalog call is audited — loom-apex LU-3)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-unity-audit-chokepoint.mjs
      - name: uc-token-exchange-params (client matches the live authz harness — F1)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-uc-token-exchange-params.mjs
      - name: breaker-coverage (unbounded-fetch ratchet — loom-next-level CH1)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-breaker-coverage.mjs
      - name: file-size (monolith-creep ratchet — WS-E E3)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-file-size.mjs
      - name: ws-credential-adoption (credential-factory ratchet — loom-next-level I5)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-workspace-credential-adoption.mjs
      - name: cloud-endpoint-literals (bare Commercial host literals ratchet — X1)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-cloud-endpoint-literals.mjs
      - name: bicep-sync (orphan modules + env-sync core)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-bicep-sync.mjs
      - name: deploy-script-reachability (every deploy-*-job.sh runs from CI — #2816)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-deploy-script-reachability.mjs
      # The deployment planner is the ONLY surface with multi-subscription
      # discovery, per-service adopt-or-deploy-new, and a reviewable plan. It
      # used to redirect away the moment a hub existed — i.e. it was unreachable
      # on exactly the estate brownfield planning applies to, so brownfield was
      # in effect not shipped (deploy-integrity.md R4/R5). The second-hub
      # invariant is enforced in POST /api/setup/deploy, not by a redirect.
      - name: setup-entrypoints (the deployment planner stays reachable — deploy-integrity R4/R5)
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci/check-setup-entrypoints.mjs --self-test
          node scripts/ci/check-setup-entrypoints.mjs
      # Reachability says the deploy script RUNS. This says the staleness
      # watchdog can SEE it: every source a watched workflow executes or applies
      # must be in that entry's `paths`, or a commit touching it can never
      # register as drift. gov-uc-purview-wire watched 2 paths while building its
      # image from apps/loom-unity, and post-deploy-bootstrap watched 1 while
      # running ~28 scripts and 2 bicep templates — so the watchdog written for
      # #2775 could not see the #2643 fix change (#2775 residual).
      - name: deploy-paths-coverage (the staleness watchdog measures what it claims — #2775)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-deploy-paths-coverage.mjs
      # Reachability says the script is INVOKED. This says the command it invokes
      # can SUCCEED: secrets declared before they are referenced, the mutating
      # create/update not swallowing its own stderr, the container named. All three
      # were violated by scripts that reachability passed (#2816 residual).
      - name: deploy-job-scripts (the job create can actually succeed — #2816 residual)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-deploy-job-scripts.mjs
      # The three above say the deploy path RUNS, is WATCHED, and can SUCCEED.
      # This one says that when it FAILS, the failure is classified, retried only
      # if retrying can help, reported to somebody who is listening, and never
      # asserts a cause the code did not establish (deploy-integrity.md R6/R7).
      # Four workflows notified failure on issue #279 — CLOSED, 289 comments —
      # which is how 47 days of daily deploy failure stayed invisible.
      - name: deploy-failure-handling (classified retries + true error messages — deploy-integrity R6/R7)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-deploy-failure-handling.mjs
      # Container Apps that share ONE image repository must be rolled TOGETHER.
      # loom-unity and iceberg-catalog both run the `loom-unity` repository
      # (admin-plane/main.bicep :6676 and :6190 are the SAME image expression),
      # and reconcile-policy.mjs::resolveRunningImageTags groups the live estate
      # BY REPOSITORY — so a repo found at two tags resolves to UNKNOWN and
      # decideDeployApps() then refuses deployAppsEnabled while anything is
      # unknown. A half-roll therefore does not merely split a pair, it freezes
      # estate-wide config reconciliation. This guard reads the app→repository
      # mapping straight out of bicep and fails if the roll registry in
      # scripts/ci/roll-plan.mjs omits any app sharing a targeted repository.
      # It reports unresolvable module calls rather than counting them absent.
      - name: roll-atomicity (apps sharing an image repository roll together)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-roll-atomicity.mjs
      # ARM enforces role-assignment uniqueness on the (scope, principalId,
      # roleDefinitionId) TRIPLE, not on the assignment NAME — so two names for
      # one triple is `RoleAssignmentExists` on every future reconcile of an
      # estate that already carries the first. That is what killed
      # deploy-fiab-commercial run 31069329802's swa-publish-rbac child
      # deployment: the template asked for one GUID, the estate held another,
      # and the grant was already in place. #3039.
      - name: role-assignment-determinism (a re-run is a real no-op — #3039)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-role-assignment-determinism.mjs
      - name: image-producer-coverage (every apps/*/Dockerfile is built by a workflow — #2619)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-image-producer-coverage.mjs
      # image-producer-coverage says the image gets BUILT. This says the build can
      # actually EXECUTE: the `loombuild` ACR agent pool on the Gov registry has a
      # backing queue stuck in "being deleted", so builds sent to it are accepted,
      # never run, and `az acr build` exits 0 having pushed NOTHING after ~60min
      # (4h25m unbounded). #2938 moved two Gov lanes onto the fresh `loombuild2`
      # and missed the other two — including console-bluegreen-roll, the
      # documented successor to the in-place roll. Also forbids `--no-logs` on a
      # POOL build: that is what made a dead queue indistinguishable from a slow
      # compile for most of a day (#2706).
      - name: acr-agent-pool (no Gov build on the wedged pool; no silent pool build — #2706)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-acr-agent-pool.mjs
      # image-producer-coverage says the image gets BUILT. This says the console
      # image gets built with its CONTENTS: docs/ + PRPs/ sit outside the
      # apps/fiab-console build context and copilot-corpus/ is a tracked
      # .gitkeep, so an unstaged build COPYs an empty corpus with no error at
      # all — which is how 7 of 8 console builders shipped a dead loom-docs
      # index and the quality evals measured a stale one (#2929).
      - name: console-corpus-staged (the console image ships its Copilot corpus — #2929)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-console-corpus-staged.mjs
      - name: afd-endpoint-discovery (no CDN endpoint addressed by a name CI never discovered — #2828)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-afd-endpoint-discovery.mjs
      - name: bicep-param-cap (ARM 256-param headroom — loom-next-level R0)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-bicep-param-cap.mjs
      # The adoption catalog (brownfield discovery) names bicep enable flags and
      # ARM types. Six earlier "service catalogs" disagreed on those names in
      # ways nothing caught: `maps` carried loomMapsEnabled in the CLI and
      # azureMapsEnabled in TypeScript, and `foundry` pointed at two DIFFERENT
      # Azure accounts. The vitest that was meant to prevent it asserted only
      # `expect(def.enabledFlag).toBeTruthy()` — it compared no names at all.
      # This compares names against platform/fiab/bicep/main.bicep on disk.
      - name: adoption-catalog-sync (brownfield catalog names match main.bicep)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-adoption-catalog-sync.mjs
      # bicep-sync above judges the SOURCE. This judges the COMPILED OUTPUT that
      # actually deploys: apps/fiab-console/deploy-templates/main.json is COPY'd
      # into the console image and submitted INLINE to ARM, and until #2945
      # nothing regenerated or verified it. It had drifted from its own bicep
      # and the drift shipped — carrying a role assignment against a role GUID
      # that does not exist, and an airflow image still pulled straight from
      # Docker Hub, i.e. #2682's supply-chain fix INERT in the deploying
      # artifact months after it merged.
      #
      # This step is deliberately NOT path-filtered: loom-guardrails.yml has a
      # bare `on: pull_request:`, so it runs on every PR. A path filter is how
      # the sibling gates in this repo went quiet (#2775, #2939) and there is no
      # filter that would be correct here anyway — main.bicep's transitive
      # closure is ~200 modules.
      #
      # It compiles only; it makes no Azure API call and needs no credentials
      # (`az bicep install` + `az bicep build` are local). `az` is preinstalled
      # on ubuntu-latest; if it were ever absent the guard FAILS rather than
      # skipping, because a compile gate that cannot compile has not verified
      # anything.
      - name: deploy-template-sync (the compiled ARM template that SHIPS must match its bicep — #2945)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-deploy-template-sync.mjs
      # INTERNAL-TOKEN SINGLE WRITER (#3056). `LOOM_INTERNAL_TOKEN` had TWO
      # writers and no owner, and it broke the estate three times in two days.
      # bicep derived it from `loomGeneratedSecretSeed`, whose ARM default
      # compiles to `"defaultValue": "[newGuid()]"` — so EVERY deploy minted a
      # brand-new token, the console and jobs agreed with each other, and every
      # holder outside that deployment (the consumer jobs on the next deploy,
      # the LOOM_INTERNAL_TOKEN repo secret, any rotated value) was silently
      # invalidated. Container Apps does not restart replicas on a secret write,
      # so it detonated hours later: 153/153 eval probes 401'd (2026-08-06) and
      # #2929's reindex rejected with the same single root.
      #
      # The estate now OWNS the value and every deploy lane ADOPTS it. This
      # guard refuses the change that would re-introduce the second writer;
      # loom-internal-token-drift.yml catches divergence on the live estate.
      # They are complements — this one cannot see a hand-run `az deployment`,
      # and that one cannot run on a PR.
      - name: internal-token single writer (a deploy must never re-mint the trust token — #3056)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-internal-token-single-writer.mjs
      # CLOUD PARITY (.claude/rules/cloud-parity.md). A .bicepparam object
      # assignment REPLACES the template default — it does not merge — and
      # main.bicep forwards `appImageTags` to admin-plane VERBATIM. So a param
      # file that omits a key the template dereferences with a plain `.` makes
      # that boundary's ARM deployment abort on "the language expression
      # property '<key>' doesn't exist" BEFORE a single resource is touched.
      #
      # Measured 2026-08-06, CORRECTED 2026-08-07: il5, commercial-full and
      # tenant-dmlz were each missing the same five keys. All five derefs are
      # gated on `deployAppsEnabled` (the appDeployments condition, and
      # admin-plane L688/691/724/740), so severity differs per file and an
      # earlier revision of this comment overstated it:
      #   il5           — declares deployAppsEnabled=true and deploy-fiab-il5.yml
      #                   passes no override, so it WOULD abort on its first
      #                   apps-enabled run. Never observed: that lane has NEVER
      #                   RUN (zero runs).
      #   tenant-dmlz   — same shape, and no automated caller at all
      #                   (operator/manual only).
      #   commercial-full — LATENT, not broken. Every known invocation overrides
      #                   deployAppsEnabled=false (bicep-whatif.yml:291,
      #                   loom-drift-check.yml:147), and no-vaporware.md's
      #                   from-scratch PHASE 1 does too. bicep-whatif ran it
      #                   SUCCESS on 2026-08-07. The earlier claim that "the
      #                   from-scratch path could not deploy" was FALSE.
      # The live Commercial lane was never exposed at all: it uses
      # params/commercial.bicepparam, which does not assign appImageTags.
      #
      # Nothing measured any of it: `bicep build-params` type-checks the file in
      # isolation and appImageTags is an untyped `object`, so the omission is
      # invisible until ARM evaluates it in a real deployment. This guard derives
      # the required key set from the SHIPPED artifact, so it tracks the template
      # instead of a stale list.
      - name: appimagetags-coverage (every boundary's param bag carries every plainly-read image tag)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-appimagetags-coverage.mjs
      # The SAME class of defect as appimagetags-coverage — a param file that
      # compiles clean and deploys an unusable product — but on the identity
      # side, and this one was LIVE. On 2026-08-07 the operator opened the
      # onboarding queue and was told to "Set LOOM_TENANT_ADMIN_OID … on the
      # loom-console container app": auto-bind-by-default.md §5 verbatim. The
      # live console had BOTH bootstrap bindings empty, so /admin/*, the
      # onboarding queue and every requireTenantAdmin route were 403 for EVERY
      # user, with no in-product way out — the gate's own Fix-it needs
      # admin.env-config at Admin, which a locked-out user cannot hold.
      # Three defects stacked: the `readEnvironmentVariable('…', adminEntraGroupId)`
      # compile-time trap (a paramfile reference NEVER sees a --parameters
      # override, so it emitted an explicit ''), the Gov param files never
      # declaring the parameter at all, and `secrets.FIAB_ADMIN_GROUP_ID` never
      # having existed. Nothing measured any of it.
      - name: tenant-admin-binding (every lane supplies a bootstrap admin — auto-bind §5)
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci/check-tenant-admin-binding.mjs --selftest
          node scripts/ci/check-tenant-admin-binding.mjs
      # deploy-staleness (above) says the reconcile has not RUN. This says that
      # when it does run, it cannot destroy, duplicate or re-image the estate:
      # no destructive step on the schedule, one image repository per
      # appImageTags key, and every tag pinned through the env var the resolver
      # exports. #2881 fixed the guard that had been blocking that path without
      # walking what lay beyond it — a successful scheduled run would have torn
      # the estate down.
      - name: reconcile-safety (a scheduled reconcile is non-destructive — #2775)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-reconcile-safety.mjs
      # The INPUT half of the same workflow. reconcile-safety says a SCHEDULED
      # run cannot destroy the estate; this says an operator DISPATCH cannot
      # either — not by accident. Three defects, all found by the operator while
      # preparing one authorised deploy, none caught by CI:
      #   #3028 keep_resources DEFAULTED FALSE, so run_mode=full + change
      #         nothing else provisioned the estate and then deleted every
      #         rg-csa-loom-* RG in the subscription;
      #   #3029 an omitted `region` silently targeted eastus2 while the estate
      #         is in centralus — the deploy then SUCCEEDS against a different,
      #         empty estate while every log line claims a reconcile;
      #   #3022 the what-if previewed a different template than the apply
      #         (LOOM_MSAL_CLIENT_ID was resolved after it), and the two
      #         commands were separate copies of one argument list that had
      #         already drifted on --subscription.
      # Mutation-proved in scripts/ci/__tests__/deploy-input-safety.test.mjs.
      - name: deploy-input-safety (a dispatch cannot tear down or mis-target the estate — #3028/#3029/#3022)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-deploy-input-safety.mjs
      # G2 (ux-baseline.md): "A bare remediation MessageBar without Fix-it is no
      # longer compliant." MEASURED 2026-08-08 by AST: the gate REGISTRY is
      # complete (131 GATE_META entries, 131 `fixit:`, 1:1) — but 63 console
      # surfaces still render 74 remediation bars that name a LOOM_* var and
      # mount no HonestGate, so they hand the operator a value to set with no
      # Fix-it, no registry linkage, and no /admin/gates entry. 59 of those 74
      # name a var whose ENV_CHECKS spec declares a `provisionedBy` bicep module,
      # which makes them auto-bind-by-default §5 defects (delete the gate, do not
      # decorate it); 15 name vars that are in NO spec at all.
      # This is a two-directional ratchet: a new bare gate fails, AND a fixed
      # file fails until it is removed from the baseline — so adopting the fix
      # cannot make the guard go quiet on exactly the files that were fixed
      # (`guard_keyed_to_the_unsafe_pattern`). Selftest runs first so a neutered
      # ratchet is caught even when the tree happens to match.
      - name: honest-gate-coverage (G2 Fix-it ratchet — no new bare remediation bars)
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci/check-honest-gate-coverage.mjs --selftest
          node scripts/ci/check-honest-gate-coverage.mjs
      # FRESH0 was warn-only for its entire life (FINISHLINE C15). `--strict`
      # existed and worked, but the workflow never passed it and the flag was
      # documented as "for the boundary run itself" — a run that is in no PR's
      # required checks. So the exit code could not block a merge and every fact
      # in the table was free to drift: the `gates_that_cannot_fail` class, by
      # way of never asking for the result. The script is now blocking by
      # default (no flag), classifies an unreadable counter as `undetermined`
      # rather than as drift (deploy-integrity R7 — an error must not assert what
      # it did not establish), and carries a --selftest that mutation-proves a
      # drifting fact exits non-zero. Run the selftest FIRST so a neutered gate
      # is caught even on a run where nothing happens to have drifted.
      - name: prp-freshness (PRP ground-truth drift BLOCKS — FRESH0 / C15)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci/check-prp-freshness.mjs --selftest
          node scripts/ci/check-prp-freshness.mjs
      - name: pnpm-overrides (CVE floors declared for BOTH pnpm majors — #2729 regression)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-pnpm-overrides.mjs
      # The npm-side sibling. portal/react-webapp is npm + package-lock.json, a
      # different toolchain from apps/fiab-console, so the pnpm guard above says
      # nothing about it and #2729's floors never reached it. npm's failure mode
      # is also different: `npm ci` hard-fails when a declared floor is missing
      # from the lockfile, so the ONE way an npm floor goes quiet is by governing
      # nothing — which npm is blind to and this guard is built for.
      - name: npm-cve-floors (npm overrides must govern something, reach the BUILD, and state their exposure honestly)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-npm-cve-floors.mjs
      # The third member of that family, and the one that closes the gap both
      # others assume shut: they check WHAT is pinned, this checks that the
      # lockfile doing the pinning is in the build context at all. #2816 —
      # azure-functions/lineage-extractor shipped `RUN npm ci` with no
      # package-lock.json anywhere in the repo, and nothing caught it for months
      # because the only thing that reads a Dockerfile is a build, and that image
      # had never been built. It failed on its first real deploy, in 12 seconds.
      - name: dockerfile-lockfiles (npm ci / --frozen-lockfile needs its lockfile in the context — #2816)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-dockerfile-lockfiles.mjs
      - name: duplicate-env (env name emitted more than once per app)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-duplicate-env.mjs
      - name: docs-hygiene (live estate identifiers + operator PII)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-docs-hygiene.mjs
      # deploy-integrity.md R8 — a deployment doc that tells a customer to run a
      # script or dispatch a workflow that does not exist is drift with teeth.
      # A 2026-08 survey found EIGHT such references across docs/fiab/deployment
      # and docs/fiab/runbooks.
      - name: docs-deploy-refs (every script/workflow/bicep path a deploy doc names exists)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-docs-deploy-refs.mjs
      - name: health-coverage (every Azure client + item family has a health check mapping)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-health-coverage.mjs
      - name: parity-doc-freshness (parity docs vs their source files; warn-first)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-parity-doc-freshness.mjs
      - name: acr-firewall-lease (ownership + fail-closed semantics — #2603)
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test-acr-firewall-lease.sh
      # The AOAI deployment picker both BYO scanners source. Its predecessor was a
      # hard-coded model allowlist (`gpt-4o|gpt-4.1|gpt-4|gpt-35`) that matched
      # NOTHING on a real 2026 account and therefore bound an EMPTY
      # LOOM_AOAI_CHAT_DEPLOYMENT on a reuse pick, silently. The suite runs it
      # against four REAL captured deployment lists plus an account of entirely
      # unrecognised families — that last case goes red the moment anyone turns
      # the ranked preference order back into an allowlist, of any vintage.
      - name: aoai-deployment-pick (the model matcher must not age out silently)
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test-aoai-deployment-pick.sh
      # The lease test above covers the lease SCRIPT. This one covers the
      # sweeper's DISCOVERY, which decides which registries get swept at all and
      # used to read an `az` failure as "nothing to sweep" and exit 0 (#2836).
      - name: acr-firewall-sweep-all (discovery must not read an az failure as "empty" — #2836)
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test-acr-firewall-sweep-all.sh
      # Key Vault's equivalent. Six call sites opened the secret vault's firewall
      # for a write and re-locked it WITHOUT ever checking the re-lock applied, so
      # a transient ARM error left it publicly reachable behind a green run
      # (#2855). The suite drives the helper against a fake `az` — including the
      # case where `az keyvault update` exits 0 and ARM silently drops it — and
      # the chokepoint stops the next author writing another inline re-lock.
      - name: kv-firewall-window (the re-lock must be VERIFIED, not merely attempted — #2855)
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test-kv-firewall-window.sh
      - name: kv-firewall-restore (no unverified inline Key Vault firewall toggles — #2855)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-kv-firewall-restore.mjs
      # LIC0 lives in license-scan.yml too, but THAT workflow is path-filtered to
      # package.json / requirements.txt / the manifest — it does NOT run on a
      # bicep change. The guard now also reviews UPSTREAM CONTAINER IMAGES pinned
      # in platform/fiab/bicep/** (PR #2640), and the change that introduces one
      # is by definition a bicep change, so it has to run here, unfiltered, or it
      # is a gate that cannot fire on the edit it exists to catch.
      - name: license-inventory (LIC0 — Python embeds + pinned upstream images)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-license-inventory.mjs
      # MIR0 is the EGRESS/PROVENANCE half that LIC0 cannot cover: LIC0 is fully
      # satisfied by an image pulled anonymously from docker.io at runtime, as long
      # as its SPDX id is permissive and recorded. This asserts the same image is
      # mirrored into the estate's own ACR, pinned to a manifest DIGEST (a mutable
      # upstream tag can otherwise swap the bits under a reviewed licence and a
      # passed CVE scan), and actually imported by BOTH cloud lanes from the one
      # manifest. Unfiltered for the same reason as LIC0: the edit that introduces
      # the violation is a bicep or workflow change.
      - name: upstream-image-mirror (MIR0 — ACR mirror + digest pinning, #2682)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-upstream-image-mirror.mjs
      # MCR0 is the half MIR0 deliberately does NOT cover. MIR0 skips
      # mcr.microsoft.com on purpose (Microsoft first-party, reachable from every
      # boundary, so the ACR-mirror requirement does not apply) — but the skip was
      # TOTAL: no MCR ref was looked at at all. Four floated `:latest`, one of them
      # on a DEFAULT-ON path (dabRuntimeEnabled), and every one was baked into the
      # shipped ARM artifact. A floating tag means two deploys of the SAME commit
      # can run different bytes, which falsifies the build-marker SHA as an
      # identifier of what is live (deploy-integrity R2/R3). Unfiltered for the
      # same reason as LIC0/MIR0: the edit that introduces the violation is a bicep
      # change. Keyed on the SAFE property (a digest is present and matches the
      # registry of record), never on the string ':latest'.
      - name: mcr-image-pins (MCR0 — every MCR deploy ref resolves to immutable bits, C18)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-mcr-image-pins.mjs
      - name: mcr-image-pins mutation proof (the guard must go RED on each mutant, C18)
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test-check-mcr-image-pins.sh
      - name: image-preflight self-test (assert-acr-image-tags — PR #2640)
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test-assert-acr-image-tags.sh
      # MIR0 above proves the mirror is WIRED. This proves its digest read-back
      # can tell "verified" from "mismatch" from "could not read" — which it
      # could not: `2>&1` merged az's PREVIEW banner for the `acr manifest`
      # command group into the digest, so every comparison failed and the step
      # reported "digest mismatch" with the expected and actual digests
      # IDENTICAL (run 31229911331, #3090). A read-back that cannot pass is as
      # useless as one that cannot fail, and this one blocked the whole deploy.
      - name: upstream-mirror digest read-back self-test (stdout is the value, stderr is the evidence — #3090)
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test-mirror-upstream-images.sh
      # assert-acr-image-tags.sh proves a tag EXISTS. This proves the workflow
      # that is supposed to CREATE it actually builds it: the Commercial image
      # producer's build matrix, its cosign APPS=() list, and the deploy
      # contract derived from params/commercial.bicepparam were three
      # hand-maintained lists with a "keep in sync" comment and no control.
      # They had drifted three separate ways at once (refs #2958) — including
      # loom-script-runner, an image the paramfile pulls that NO workflow in
      # the repo built.
      - name: full-app-deploy image contract (matrix == cosign list == deploy contract — refs #2958)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-full-app-deploy-contract.mjs
      # The roll's digest resolution used to be `az … 2>/dev/null || echo ""`
      # and called an empty result "the tag does not exist" — a false statement
      # printed about images that were in the registry (#2980/#2982). Its
      # replacement retries, and a retry is precisely the thing that quietly
      # becomes a gate that cannot fail, so it gets a mutation-proving self-test.
      - name: acr-digest resolver self-test (fails closed — #2980)
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test-resolve-acr-digest.sh
      - name: route-inventory (route taxonomy drift gate — WS-D D3)
        if: ${{ !cancelled() }}
        run: node scripts/ci/generate-route-inventory.mjs --check
      - name: 'annotation-teeth (a step that prints ::error:: must be able to fail — #2837)'
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-annotation-teeth.mjs
      # annotation-teeth judges a step that PRINTS a verdict. This judges the
      # step that never got to print one: actions/github-script compiles each
      # `script:` body into an async function whose PARAMETERS are the injected
      # names (github, context, core, exec, glob, io, fetch, require), so a
      # `const exec = …` is a redeclaration and the SyntaxError kills the step
      # before line 1. loom-synthetic-monitor's alert — the file's own
      # "durable signal" — threw exactly that on every run: 83 consecutive red
      # runs with the six live journeys down, and ZERO issues ever filed.
      - name: 'github-script-syntax (every github-script body must compile as the action compiles it)'
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-github-script-syntax.mjs
      # init/autobuild/analyze share one CodeQL bundle. Dependabot bumped ONLY
      # init (#3103), every Analyze job died on the version mismatch — and a
      # failed analysis still uploads a 0-result SARIF that GitHub will not
      # retire alerts from, so the code-scanning list froze at the last real
      # scan and read as current while merges went unscanned.
      - name: 'codeql-action-pins (init/autobuild/analyze must run one release)'
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-codeql-action-pins.mjs
      # A module that reaches INTO the lake account (role assignment, or an
      # `existing` reference inside loomDlzRg) must gate on loomStorageGrantable,
      # not on !empty(loomStorageAccount). #3196 split binding from granting but
      # converted only 4 of 7 consumers; the 3 it missed took the estate's first
      # real apply down with ResourceNotFound / ParentResourceNotFound, because on
      # a multi-sub estate loomDlzRg is the ADMIN rg and the lake is in another
      # subscription. A PARTIAL split is worse than none — it looks wired right up
      # until ARM refuses.
      - name: 'lake-grant-gate (cross-sub lake: bind always, grant only when local)'
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-lake-grant-gate.mjs
      # A teardown step must be UNREACHABLE from a cron. Both sovereign lanes
      # had `(github.event_name == 'schedule' || inputs.run_mode == 'full') &&
      # !inputs.keep_resources` — and a scheduled event carries NO inputs, so
      # `!inputs.keep_resources` is `!''` = TRUE. The daily crons (gcch 10:00Z,
      # gcc 08:00Z) would have destroyed the sovereign estate on every green run.
      # Invisible from `gh run list` because both lanes are disabled_manually,
      # and invisible from run history because it had never fired.
      - name: 'teardown-not-on-schedule (a cron must never be able to tear down an estate)'
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-teardown-not-on-schedule.mjs
      # If the registry NAME comes from a variable, the login-server SUFFIX must
      # too. mirror-upstream-images.sh read back `${ACR}.azurecr.io/${DST}` — the
      # name was right for Gov, the suffix was Commercial. All three upstream
      # images mirrored fine; only the VERIFY failed, which failed the step, which
      # starved the Gov ACR of loom-duckdb:v0.1, which is what deploy-fiab-gcch's
      # image preflight refuses on. One literal suffix made GCC-High undeployable.
      - name: 'acr-suffix-boundary-agnostic (a varying registry needs a varying suffix)'
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-acr-suffix-boundary-agnostic.mjs
      # `az acr login` authenticates through an ARM-mediated token exchange, so it
      # returns 0 while the registry still refuses this runner's IP. Roll
      # 31454217160: this oracle said "reachable after 1 attempt" in the SAME
      # SECOND the firewall opened, and cosign was DENIED 3s later — then the
      # gate reported "NO valid cosign signature", a fact it never established.
      # 19 sites across the Commercial and sovereign lanes carried the same
      # oracle, 10 of them with no failure path at all.
      - name: 'acr-reachability-oracle (az acr login is a credential, not a probe)'
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-acr-reachability-oracle.mjs
      # The probe itself is mutation-proved offline against stub az/curl: 403 DENIED
      # is NOT ready, a connect failure is exit 2 (not 1), and reinstating
      # `CODE="$(curl … || echo 000)"` — which concatenates to `000000` and makes
      # a DNS failure read as a firewall refusal — fails the suite.
      - name: 'acr-dataplane-ready self-test (403 != ready; DNS failure != refusal)'
        if: ${{ !cancelled() }}
        run: bash scripts/ci/test-acr-dataplane-ready.sh
      # annotation-teeth judges steps that PRINT ::error::. The publish-version
      # E2E printed nothing of the sort — Playwright's own "1 failed, 6 passed"
      # is not an annotation — so it sailed through while continue-on-error threw
      # the verdict away and a missing `id:` made it unreferenceable (#2875,
      # third recurrence in loom-ui-verify.yml after #2787 and #2837). This
      # covers the complementary population: browser/verification steps whose
      # EXIT STATUS is the verdict.
      - name: 'ui-verify-step-teeth (a browser step verdict must reach the job conclusion — refs #2875)'
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-ui-verify-step-teeth.mjs
      # ── controls that existed and did not run (refs #2860) ──────────────────
      # annotation-teeth covers "invoked but cannot fail". These four were one
      # rung lower: NOT INVOKED AT ALL. check-route-smoke-floor.mjs called
      # itself a merge-blocker in its own header and no workflow ever ran it;
      # check-insecure-randomness.mjs is a ratchet whose BASELINE nothing was
      # comparing against; generate-coverage-summary.mjs --check is a drift gate
      # that had never checked (and was RED the first time it ran). The fourth
      # is the reachability guard itself, which now keeps the class closed.
      - name: ci-guard-reachability (every scripts/ci control is invoked by a workflow — refs #2860)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-ci-guard-reachability.mjs
      - name: route-smoke-floor (app/**/page.tsx coverage ratchet — WS-V V4)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-route-smoke-floor.mjs
      - name: insecure-randomness (Math.random() shrink-only ratchet — #2656)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-insecure-randomness.mjs
      - name: coverage-summary (published thresholds vs the ones CI enforces — WS-F1)
        if: ${{ !cancelled() }}
        run: node scripts/ci/generate-coverage-summary.mjs --check
      # The scripts/ci self-tests. These existed but NOTHING RAN THEM: the
      # roll-gate suite is new (#2819) and the insecure-randomness suite has been
      # sitting in the tree with a "Run: node --test …" comment and no CI lane
      # since it was written. A test nobody runs is the same class of defect as
      # a gate that measures nothing — it reads as coverage and enforces nothing.
      - name: scripts/ci self-tests (roll-gate, ratchet comment-stripping, FD purge target, login-health verdict, annotation-teeth, bff-errors RULE 3)
        if: ${{ !cancelled() }}
        run: node --test scripts/ci/__tests__/*.test.mjs
      # EVERY node:test suite in the tree, not just the one directory above
      # (#2856). The discovery runner was added by #2838 and wired ONLY into
      # `node:test suites (node 20)` in fiab-console-ci.yml — a context that is
      # not a required status check, and that the `Protect main` ruleset does
      # not add either. So the 41 fail-closed assertions in apps/loom-unity
      # (Unity Catalog authorization is DEFAULT-ON) and apps/loom-onelake
      # (path traversal) could go red while the PR merged on green required
      # checks. `guardrails` IS required, so running it here gives them teeth —
      # no branch-protection change needed.
      #
      # The step above is deliberately left in place as an independent control:
      # it proves this one changed no existing behaviour. The overlap is ~5s.
      - name: 'node:test suites (every suite in the tree — #2856)'
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-node-test-suites.mjs
      # The step above closed the class for `node:test` and left the vitest half
      # open. At this step's merge-base EVERY vitest suite under
      # azure-functions/ was dark — five packages, five spec files, 121
      # assertions — because each carries its own package.json + node_modules
      # and no workflow ran them.
      #
      # The concrete case: the report-subscriptions delivery payload had drifted
      # from its Logic App trigger schema (it posted `contentBytes`/`fileName`,
      # which the workflow does not read). That code had never executed on the
      # estate, so it emailed nothing and broke nothing — but nothing in CI
      # could have told us either way, and the spec that now catches it is
      # worth nothing unless something runs it.
      - name: 'standalone vitest suites (azure-functions packages no other lane runs)'
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-standalone-vitest-suites.mjs
      # ── the workflow files themselves (refs #3030) ─────────────────────────
      # Every guard above judges the repo. These two judge the WORKFLOWS THAT RUN
      # THE GUARDS. On 2026-08-05 full-app-deploy-commercial.yml — the only
      # producer of the app images and the only path that rolls the Container
      # Apps — died on three consecutive runs because of ONE line:
      #     echo "admin_sub=$ADMIN_SUB" >> "$GITHUB_OUTPUT"
      # ADMIN_SUB was read and never assigned; the step runs under
      # `set -uo pipefail`, so it aborted there and took every image build and
      # app roll with it. The class is entirely mechanical and nothing checked it.
      #
      # There are TWO guards because one of them cannot see that bug. actionlint
      # does pipe `run:` blocks through shellcheck, but it hard-codes
      #   --norc … -e SC1091,SC2194,SC2050,SC2153,SC2154,SC2157,SC2043
      # so SC2154 ("referenced but not assigned") is excluded BY DESIGN — and
      # stock shellcheck exempts ALL-CAPS names from it in any case. Run against
      # the pre-#3030 file, actionlint reports SC2086/SC2129 and says nothing
      # about ADMIN_SUB. check-workflow-unset-vars.mjs does that analysis with
      # the workflow/job/step `env:` + $GITHUB_ENV context shellcheck lacks —
      # which is exactly why actionlint is right to exclude it and we are right
      # to re-implement it. Neither guard substitutes for the other.
      - name: 'Install pinned actionlint + shellcheck (workflow lint toolchain)'
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          AL_VER=1.7.12
          AL_SHA=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SC_VER=0.11.0
          SC_SHA=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl -sSfL -o /tmp/actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${AL_VER}/actionlint_${AL_VER}_linux_amd64.tar.gz"
          echo "${AL_SHA}  /tmp/actionlint.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tgz -C /usr/local/bin actionlint
          # NOTE: a comment must not begin with "# shellcheck " — shellcheck
          # reads that as a directive and errors (SC1072/SC1073). The pinned
          # binary below is deliberate: shellcheck's VERSION decides which
          # findings exist, so inheriting the runner image's copy would move
          # the ratchet baseline underneath us on the next image bump.
          # ubuntu-latest ships one; this overrides it.
          curl -sSfL -o /tmp/shellcheck.txz "https://github.com/koalaman/shellcheck/releases/download/v${SC_VER}/shellcheck-v${SC_VER}.linux.x86_64.tar.xz"
          echo "${SC_SHA}  /tmp/shellcheck.txz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.txz -C /tmp
          sudo install -m755 "/tmp/shellcheck-v${SC_VER}/shellcheck" /usr/local/bin/shellcheck
          actionlint --version | head -1
          shellcheck --version | grep version:
      # The self-test runs FIRST and separately: it drives the analyser over the
      # real #3030 defect and fails if ADMIN_SUB is not reported. A guard nobody
      # has watched fail is not a guard, and this repo has shipped several.
      - name: 'workflow-unset-vars self-test (must detect the #3030 ADMIN_SUB defect)'
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-workflow-unset-vars.mjs --self-test
      - name: 'workflow-unset-vars (a `run:` step must not read a variable it never assigns — #3030)'
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-workflow-unset-vars.mjs
      # Its own first act is a liveness probe: actionlint silently skips EVERY
      # shellcheck rule when shellcheck is absent from PATH (measured: 5 findings
      # with it, 0 without, on the same file) — so the guard lints a fixture with
      # a planted SC2086 and fails if it does not come back.
      - name: 'workflow-actionlint (pinned actionlint + shellcheck, ratcheted; probes prove shellcheck + invalid-YAML detection are live; unparseable = hard fail, #3034)'
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-workflow-actionlint.mjs
      # #3025 — the MSAL rotation marker is written by the same hand that
      # writes the secret, the rotation runbook names the UAMI (not `system`),
      # and no rotation step discards its result. Self-test first: it carries
      # the mutant fixtures (marker dropped / identityref:system / `|| true`)
      # and proves the analyser flags each before the real files are judged.
      - name: 'msal-rotation-consistency (marker written with the secret; runbook names the UAMI — #3025)'
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci/check-msal-rotation-consistency.mjs --self-test
          node scripts/ci/check-msal-rotation-consistency.mjs
      # #3042 — the meta-guard for THIS file: every `run:` step above must
      # carry `if: ${{ !cancelled() }}`, or one failing guard hides the rest
      # behind benign-looking `skipped` steps again. Self-test first (mutant
      # fixtures: a run step with no `if`, and one with `if: success()`).
      - name: 'guardrails-observability (every guard step runs even when a sibling fails — #3042)'
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci/check-guardrails-observability.mjs --self-test
          node scripts/ci/check-guardrails-observability.mjs
