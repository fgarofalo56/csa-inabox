name: gov-uc-purview-wire

# One-shot Gov wiring for the two missing Azure-native governance backends
# (operator ask 2026-07-14):
#
#   1. OSS Unity Catalog — Databricks Unity Catalog has NO Azure Government
#      endpoint, so Gov runs the self-hosted OSS Unity Catalog server
#      (apps/loom-unity + platform/fiab/bicep/modules/compute/loom-unity-app.bicep).
#      This job builds the loom-unity image on the Gov ACR, deploys the Container
#      App into the Gov CAE, then sets LOOM_UC_BACKEND=oss + LOOM_UNITY_URL on
#      the Gov console so uc-backend.ts routes to it.
#
#      OWNERSHIP: this workflow is the ONLY producer/owner of the live Gov
#      `loom-unity` Container App today — admin-plane/main.bicep does NOT deploy
#      it (loom-unity-app.bicep is still a standalone entrypoint, orphan-
#      allowlisted in scripts/ci/check-bicep-sync.mjs). Making the orchestrator
#      deploy + adopt it is a separate, follow-up change; it is deliberately not
#      part of the svc-loom-unity-authz fix, because adoption would flip this
#      LIVE federal app's authorization mode. This workflow publishes :v0.1 (the
#      tag the Gov bicepparams pull) so that future adoption cannot repoint the
#      app at a missing image. See docs/fiab/unity-gov.md § "Ownership".
#
#   2. Purview — a Purview account is ALREADY deployed in the Gov sub but the
#      console never had LOOM_PURVIEW_ACCOUNT set, so every governance surface
#      honest-gates. This job discovers the account, sets the env var (the
#      purview-client resolves *.purview.azure.us via isGovCloud()), and prints
#      the exact data-plane role grant the console UAMI still needs if the Atlas
#      probe fails (root-collection Data Reader/Curator are granted inside
#      Purview's own portal/REST, not ARM).
#
# Non-interactive: uses the same Gov deploy SP + endpoints as gov-console-roll.
# Safe to re-run (idempotent bicep + env upserts).
on:
  workflow_dispatch:
    inputs:
      skip_unity:
        description: 'Skip the OSS Unity Catalog arm'
        required: false
        default: 'false'
      skip_purview:
        description: 'Skip the Purview wiring arm'
        required: false
        default: 'false'
      unity_auth_mode:
        description: 'Loom Unity authorization posture. entra (DEFAULT) enforces Entra bearer authorization. disabled is an AUDITED OPT-OUT that leaves the catalog readable AND writable by anything that can reach it — issue #2643. Choosing it is a deliberate acceptance of that finding, not a fallback.'
        required: false
        type: choice
        options:
          - entra
          - disabled
        default: 'entra'

permissions:
  contents: read

env:
  RG: rg-csa-loom-admin-usgovvirginia
  ACR: acrloomdcmt6cqoezlgs
  ACR_LOGIN: acrloomdcmt6cqoezlgs.azurecr.us
  APP: loom-console
  UNITY_APP: loom-unity

jobs:
  wire:
    name: Wire OSS Unity Catalog + Purview into the Gov console
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (Gov sub) — deploy SP
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment

      - name: Set Azure cloud to Gov
        run: az cloud set --name AzureUSGovernment

      - name: Discover Gov console environment (CAE, UAMI, current env)
        run: |
          set -euo pipefail
          CAE_ID=$(az containerapp show -n "$APP" -g "$RG" --query properties.environmentId -o tsv | tr -d '\r')
          UAMI_ID=$(az containerapp show -n "$APP" -g "$RG" --query 'identity.userAssignedIdentities | keys(@) | [0]' -o tsv | tr -d '\r')
          LOCATION=$(az containerapp show -n "$APP" -g "$RG" --query location -o tsv | tr -d '\r' | tr '[:upper:]' '[:lower:]' | tr -d ' ')
          echo "CAE_ID=$CAE_ID" >> "$GITHUB_ENV"
          echo "UAMI_ID=$UAMI_ID" >> "$GITHUB_ENV"
          echo "LOCATION=$LOCATION" >> "$GITHUB_ENV"
          echo "::notice::CAE=$CAE_ID UAMI=$UAMI_ID location=$LOCATION"

      - name: Build loom-unity image on the Gov ACR
        if: ${{ inputs.skip_unity != 'true' }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short=8 HEAD)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          # #2603: lease the ACR firewall instead of a bare toggle, so this
          # step's re-lock cannot deny another run's in-flight push.
          bash scripts/csa-loom/acr-firewall-lease.sh acquire --acr "$ACR"
          for i in $(seq 1 12); do az acr login -n "$ACR" >/dev/null 2>&1 && break; sleep 15; done
          # ALSO tag :v0.1 — the tag the Gov .bicepparam files pull for every
          # orchestrator-deployed app. If this workflow only published :<sha> +
          # :latest, the FIRST orchestrator deploy that ever adopts this app
          # would repoint the LIVE Gov catalog at a tag that does not exist and
          # the revision would fail its image pull. Publishing it now makes that
          # follow-up change safe before it is written.
          # gov-build-images.yml is the from-scratch producer for the same tag.
          az acr build --registry "$ACR" --no-logs \
            --image "loom-unity:$SHA" --image "loom-unity:latest" --image "loom-unity:v0.1" \
            --file apps/loom-unity/Dockerfile \
            apps/loom-unity
          # PROVE the :v0.1 tag landed while the data plane is still open.
          # "`az acr build` exited 0" is not "the tag is in the registry"; the
          # deploy step below, and any future orchestrator deploy that adopts
          # this app, reference exactly that tag, so a silent tagging failure
          # here would leave the live Gov catalog pointing at a missing image.
          DIGEST=$(az acr repository show -n "$ACR" --image "loom-unity:v0.1" --query digest -o tsv | tr -d '\r')
          if [ -z "${DIGEST:-}" ]; then
            echo "::error::loom-unity:v0.1 is NOT resolvable in $ACR after the build. That is the exact tag gcc-high/il5.bicepparam pull, so deploying now would point this estate at a missing image. Refusing."
            bash scripts/csa-loom/acr-firewall-lease.sh release --acr "$ACR" || true
            exit 1
          fi
          echo "::notice::loom-unity:v0.1 -> $DIGEST (the tag the Gov bicepparams pull)"
          bash scripts/csa-loom/acr-firewall-lease.sh release --acr "$ACR" || true

      - name: Release the ACR firewall lease (always)
        if: always()
        run: bash scripts/csa-loom/acr-firewall-lease.sh release --acr "$ACR" || true

      - name: Deploy the OSS Unity Catalog Container App (loom-unity-app.bicep)
        if: ${{ inputs.skip_unity != 'true' }}
        run: |
          set -euo pipefail
          # svc-loom-unity-authz (#2643) — this workflow used to deploy the
          # catalog with NO entraClientId, and the module silently downgraded to
          # server.authorization=disable: anything on the Gov CAE VNet could read
          # AND mutate catalog metadata anonymously.
          #
          # It then deployed authMode=disabled EXPLICITLY, because at that time
          # turning authorization on would have taken the live Gov catalog down
          # rather than secured it. Two things blocked it, both now cleared:
          #
          #   1. The Console sent its Entra bearer DIRECTLY, and upstream
          #      AuthDecorator rejects any bearer whose `iss` is not its own
          #      `internal` issuer (403, even on a byte-exact audience). The
          #      token-exchange client LANDED in #2679 —
          #      lib/azure/uc-token-exchange.ts, called by ossUcAuthHeader() —
          #      so the Console now exchanges at
          #      /api/1.0/unity-control/auth/tokens and sends the internal token.
          #   2. AuthService.verifyPrincipal additionally requires the subject to
          #      be `admin` or an ENABLED Unity Catalog user, and an Entra
          #      app-only token has no `email` claim, so the subject is the
          #      principal's OBJECT ID. Nothing registered it. The entrypoint now
          #      AUTO-BINDS that object id as an enabled UC user at boot using the
          #      server's own admin token (auto-bind-by-default.md §5), which is
          #      why consolePrincipalId is resolved and passed below.
          #
          # So the stated precondition — "set UNITY_AUTH_MODE=entra in the SAME
          # change that lands the Console token-exchange client, not before" — is
          # met. Authorization is ON, and this step now FAILS rather than falling
          # back to an anonymous catalog if it cannot resolve what enforcement
          # needs. `disabled` remains reachable only as a deliberate, audited
          # dispatch input, never as the default this file hard-codes.
          UNITY_AUTH_MODE="${{ inputs.unity_auth_mode || 'entra' }}"
          UNITY_CLIENT_ID=$(az containerapp show -n "$APP" -g "$RG" \
            --query "properties.template.containers[0].env[?name=='LOOM_MSAL_CLIENT_ID'].value | [0]" -o tsv | tr -d '\r')
          if [ "$UNITY_AUTH_MODE" = "entra" ] && [ -z "${UNITY_CLIENT_ID:-}" ]; then
            echo "::error::Cannot resolve LOOM_MSAL_CLIENT_ID from the Console app, so no audience can be pinned. Refusing to deploy — with authMode=entra the module would deploy the catalog SEALED (up, accepting nobody). Run the MSAL app-registration bootstrap first (scripts/csa-loom/bootstrap-msal-app-reg.sh)."
            exit 1
          fi
          CAE_SUBNET_ID=$(az containerapp env show --ids "$CAE_ID" --query properties.vnetConfiguration.infrastructureSubnetId -o tsv | tr -d '\r')
          CAE_CIDR=$(az network vnet subnet show --ids "$CAE_SUBNET_ID" --query addressPrefix -o tsv | tr -d '\r')
          if [ -z "${CAE_CIDR:-}" ]; then
            echo "::error::Could not resolve the CAE infrastructure subnet CIDR — refusing to deploy without the ingress IP pin."
            exit 1
          fi
          echo "::notice::Loom Unity authMode=$UNITY_AUTH_MODE, ingress pinned to $CAE_CIDR"
          # Identity — prefer a dedicated least-privilege UAMI if one exists
          # (uami-loom-unity-<location>); fall back to the Console UAMI. The
          # Console identity is broadly permissioned and ACA exposes the app
          # identity over IMDS to in-container code, so the dedicated identity is
          # the right long-term home for this app.
          UNITY_UAMI_ID=$(az identity show -n "uami-loom-unity-${LOCATION}" -g "$RG" --query id -o tsv 2>/dev/null | tr -d '\r' || true)
          if [ -z "${UNITY_UAMI_ID:-}" ]; then
            UNITY_UAMI_ID="$UAMI_ID"
            echo "::notice::dedicated uami-loom-unity-${LOCATION} not present — using the Console UAMI."
          fi
          UNITY_UAMI_CLIENT_ID=$(az identity show --ids "$UNITY_UAMI_ID" --query clientId -o tsv 2>/dev/null | tr -d '\r' || true)
          # AUTO-BIND — the OBJECT ID (principalId) of the identity the CONSOLE
          # runs as. That is the `sub` claim of the app-only token the Console
          # mints, and upstream verifyPrincipal resolves the caller from `email`
          # else `sub`, so this is the value that must exist as an ENABLED Unity
          # Catalog user. It is deliberately read off the CONSOLE app rather than
          # from $UAMI_ID: those are usually the same identity, but if the Console
          # is ever moved to its own UAMI, binding the deployer's identity would
          # register the wrong principal and the catalog would refuse every real
          # call while reporting a successful bind.
          CONSOLE_PRINCIPAL_ID=$(az containerapp show -n "$APP" -g "$RG" \
            --query "identity.userAssignedIdentities.*.principalId | [0]" -o tsv | tr -d '\r')
          if [ "$UNITY_AUTH_MODE" = "entra" ] && [ -z "${CONSOLE_PRINCIPAL_ID:-}" ]; then
            echo "::error::Could not resolve the Console managed identity's principalId, so the entrypoint cannot register it as an enabled Unity Catalog user. Deploying authMode=entra now would leave the catalog correct-but-unusable (every Console call 401s at the token exchange). Refusing. Re-run once the Console app has a user-assigned identity."
            exit 1
          fi
          az deployment group create -g "$RG" \
            -n "loom-unity-$(date -u +%Y%m%d%H%M%S)" \
            -f platform/fiab/bicep/modules/compute/loom-unity-app.bicep \
            -p location="$LOCATION" \
               environmentId="$CAE_ID" \
               unityUamiId="$UNITY_UAMI_ID" \
               unityUamiClientId="$UNITY_UAMI_CLIENT_ID" \
               acrLoginServer="$ACR_LOGIN" \
               image="$ACR_LOGIN/loom-unity:v0.1" \
               dbEphemeral=true \
               authMode="$UNITY_AUTH_MODE" \
               entraClientId="$UNITY_CLIENT_ID" \
               consolePrincipalId="$CONSOLE_PRINCIPAL_ID" \
               consoleAllowedCidrs="[\"$CAE_CIDR\"]" \
               complianceTags='{"env":"gov","boundary":"usgovvirginia"}' \
            -o none
          echo "UNITY_CLIENT_ID=$UNITY_CLIENT_ID" >> "$GITHUB_ENV"
          echo "UNITY_AUTH_MODE=$UNITY_AUTH_MODE" >> "$GITHUB_ENV"
          # Gov posture: H2 on an Azure Files SMB mount fails to ATTACH on this
          # boundary — the mount blocks container start (CrashLoopBackOff, restarts:0,
          # never logs) before the app runs, so an app-level LOOM_UNITY_DB_LOCAL
          # fallback can't help. dbEphemeral=true makes the DB volume an EmptyDir
          # (no storage account/share, no SMB mount) + sets LOOM_UNITY_DB_LOCAL in
          # the container spec, so UC boots FUNCTIONAL now. Catalog metadata is not
          # persisted across restarts; wire unityDbUrl (Postgres) — gated on Gov
          # Postgres quota — for durable storage.
          FQDN=$(az containerapp show -n "$UNITY_APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv | tr -d '\r')
          echo "UNITY_FQDN=$FQDN" >> "$GITHUB_ENV"
          echo "::notice::loom-unity internal FQDN: $FQDN (H2 local-ephemeral; wire LOOM_UNITY_DB_URL=postgres for durable metadata)"
          # Wait for the new revision to go healthy before the console reads it.
          for i in $(seq 1 20); do
            H=$(az containerapp revision show -n "$UNITY_APP" -g "$RG" --revision "$(az containerapp show -n "$UNITY_APP" -g "$RG" --query properties.latestRevisionName -o tsv | tr -d '\r')" --query properties.healthState -o tsv 2>/dev/null | tr -d '\r')
            echo "loom-unity health=$H"; [ "$H" = "Healthy" ] && break; sleep 15
          done

      - name: Discover the Gov Purview account
        if: ${{ inputs.skip_purview != 'true' }}
        run: |
          set -euo pipefail
          PVW=$(az resource list --resource-type Microsoft.Purview/accounts --query '[0].name' -o tsv | tr -d '\r')
          if [ -z "$PVW" ]; then
            echo "::error::No Purview account found in the Gov subscription — cannot wire LOOM_PURVIEW_ACCOUNT."
            exit 1
          fi
          echo "PVW=$PVW" >> "$GITHUB_ENV"
          echo "::notice::Gov Purview account: $PVW"

      - name: Set console env (LOOM_UC_BACKEND / LOOM_UNITY_URL / LOOM_PURVIEW_ACCOUNT) + roll
        run: |
          set -euo pipefail
          VARS=""
          if [ "${{ inputs.skip_unity }}" != "true" ] && [ -n "${UNITY_FQDN:-}" ]; then
            # svc-loom-unity-authz (#2643) — the CONSOLE half, kept in lockstep
            # with the authorization mode the deploy step actually applied.
            #
            # On the `entra` path the Console mints an Entra bearer and exchanges
            # it at /api/1.0/unity-control/auth/tokens for the internal token the
            # catalog accepts (lib/azure/uc-token-exchange.ts, #2679); the
            # entrypoint's AUTO-BIND has registered the Console principal as an
            # enabled UC user so that exchange succeeds. Sending the raw Entra
            # bearer would still be answered 403 by design — the exchange is what
            # makes this work (docs/fiab/security/loom-unity-authz-proof.md).
            #
            # `anonymous` is written ONLY when the deploy applied the audited
            # authMode=disabled opt-out, so the two halves can never disagree.
            # It is DECLARED rather than inferred so the svc-loom-unity-authz
            # gate (which now rejects that value) and
            # /api/catalog/unity/capabilities report the open posture explicitly
            # instead of it reading as configured.
            VARS="$VARS LOOM_UC_BACKEND=oss LOOM_UNITY_URL=https://$UNITY_FQDN"
            if [ "${UNITY_AUTH_MODE:-entra}" = "entra" ]; then
              VARS="$VARS LOOM_UNITY_CLIENT_ID=$UNITY_CLIENT_ID"
              VARS="$VARS LOOM_UNITY_AUDIENCE=api://$UNITY_CLIENT_ID/.default"
              VARS="$VARS LOOM_UNITY_AUTH_MODE=entra"
            else
              VARS="$VARS LOOM_UNITY_AUTH_MODE=anonymous"
            fi
          fi
          if [ "${{ inputs.skip_purview }}" != "true" ] && [ -n "${PVW:-}" ]; then
            VARS="$VARS LOOM_PURVIEW_ACCOUNT=$PVW"
          fi
          if [ -z "$VARS" ]; then echo "::notice::nothing to set"; exit 0; fi
          echo "::notice::setting on $APP:$VARS"
          # shellcheck disable=SC2086
          az containerapp update -n "$APP" -g "$RG" --set-env-vars $VARS -o none

      - name: Health-gate the new console revision
        run: |
          set -euo pipefail
          NEWREV=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv | tr -d '\r')
          H=""
          for i in $(seq 1 24); do
            H=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$NEWREV" \
              --query properties.healthState -o tsv 2>/dev/null | tr -d '\r')
            echo "$(date -u +%H:%M:%S) $NEWREV=$H"
            [ "$H" = "Healthy" ] && break
            sleep 15
          done
          if [ "$H" != "Healthy" ]; then
            echo "::error::New revision $NEWREV did not reach Healthy — inspect and roll back via gov-console-roll (lastgood)."
            exit 1
          fi

      - name: Probe the wired backends from inside the console
        run: |
          set -euo pipefail
          # The console is behind Front Door with MSAL; probe the UNAUTH health route
          # for liveness, and use the self-audit checks for the two new backends on
          # the next operator sign-in. Here we verify the loom-unity app itself
          # answers on its catalog root (internal ingress — reachable only in-VNet,
          # so we exec a curl inside the console container).
          if [ "${{ inputs.skip_unity }}" != "true" ] && [ -n "${UNITY_FQDN:-}" ]; then
            REP=$(az containerapp replica list -n "$APP" -g "$RG" --query '[0].name' -o tsv | tr -d '\r')
            OUT=$(az containerapp exec -n "$APP" -g "$RG" --replica "$REP" --container "$APP" \
              --command "node -e \"fetch('https://$UNITY_FQDN/api/2.1/unity-catalog/catalogs').then(r=>r.text().then(t=>console.log('UC',r.status,t.slice(0,200)))).catch(e=>console.log('UC ERR',e.message))\"" 2>/dev/null || true)
            echo "$OUT"
            # svc-loom-unity-authz — this is an UNAUTHENTICATED read, and the
            # assertion is keyed to the authorization mode THIS RUN deployed
            # (UNITY_AUTH_MODE), never to an assumption. Before this change the
            # probe treated an anonymous HTTP 200 as SUCCESS, which is why the
            # finding survived in Gov for months: the gate was measuring
            # reachability, not authorization.
            AUTHZ="${UNITY_AUTH_MODE:-disabled}"
            if echo "$OUT" | grep -q "UC 200"; then
              if [ "$AUTHZ" = "entra" ]; then
                echo "::error::Loom Unity answered an UNAUTHENTICATED read with 200 while it was deployed authMode=entra — authorization is NOT being enforced (svc-loom-unity-authz). Check the loom-unity container logs for the LOOM_UNITY_AUTH value it booted with."
                exit 1
              fi
              echo "::warning::svc-loom-unity-authz is OPEN on this estate: Loom Unity answered an UNAUTHENTICATED read with 200 because it is deployed with the audited authMode=disabled opt-out. Ingress is IP-pinned to the CAE infrastructure subnet, so the exposure is bounded to that subnet — but any workload there can read AND mutate catalog metadata. Closing it needs the Console token-exchange client (upstream only accepts tokens it issued itself; see docs/fiab/security/loom-unity-authz-proof.md), after which this workflow flips UNITY_AUTH_MODE to entra."
            elif echo "$OUT" | grep -qE "UC (401|403)"; then
              if [ "$AUTHZ" = "entra" ]; then
                echo "::notice::Loom Unity rejected the unauthenticated read — Entra bearer authorization is enforced."
              else
                echo "::warning::Loom Unity rejected an unauthenticated read although it was deployed authMode=disabled — the running container disagrees with the template. Check its LOOM_UNITY_AUTH env value."
              fi
            else
              echo "::warning::Unexpected Loom Unity probe result (first boot can take ~1 min, and a fail-closed boot returns a connection error). Check the loom-unity container logs."
            fi
          fi
          echo "::notice::Purview + UC wiring applied. Operator: open the Gov console → Governance; the Purview gates should be gone. If Atlas calls 403, grant the console UAMI Data Reader + Data Curator on the Purview ROOT collection (Purview portal → Data Map → Collections → Role assignments)."
