name: gov-uc-purview-wire

# One-shot Gov wiring for the two missing Azure-native governance backends
# (operator ask 2026-07-14):
#
#   1. OSS Unity Catalog — Databricks Unity Catalog has NO Azure Government
#      endpoint, so Gov runs the self-hosted OSS Unity Catalog server
#      (apps/loom-unity + platform/fiab/bicep/modules/compute/loom-unity-app.bicep).
#      This job builds the loom-unity image on the Gov ACR, deploys the Container
#      App into the Gov CAE, then sets LOOM_UC_BACKEND=oss + LOOM_UNITY_URL on
#      the Gov console so uc-backend.ts routes to it.
#
#      OWNERSHIP (svc-loom-unity-authz round 2): admin-plane/main.bicep now
#      deploys this SAME app (`loom-unity` in the same admin RG) as part of the
#      push-button deploy, so the orchestrator is the long-term owner and the next
#      Gov infra deploy ADOPTS the app this workflow created. That adoption is
#      deliberate and convergent — this workflow now publishes the :v0.1 tag the
#      Gov bicepparams pull and prefers the same dedicated UAMI the orchestrator
#      creates — so re-running either one is idempotent. This workflow remains the
#      targeted path for re-wiring an existing Gov estate without a full infra
#      deploy. See docs/fiab/unity-gov.md § "Ownership".
#
#   2. Purview — a Purview account is ALREADY deployed in the Gov sub but the
#      console never had LOOM_PURVIEW_ACCOUNT set, so every governance surface
#      honest-gates. This job discovers the account, sets the env var (the
#      purview-client resolves *.purview.azure.us via isGovCloud()), and prints
#      the exact data-plane role grant the console UAMI still needs if the Atlas
#      probe fails (root-collection Data Reader/Curator are granted inside
#      Purview's own portal/REST, not ARM).
#
# Non-interactive: uses the same Gov deploy SP + endpoints as gov-console-roll.
# Safe to re-run (idempotent bicep + env upserts).
on:
  workflow_dispatch:
    inputs:
      skip_unity:
        description: 'Skip the OSS Unity Catalog arm'
        required: false
        default: 'false'
      skip_purview:
        description: 'Skip the Purview wiring arm'
        required: false
        default: 'false'

permissions:
  contents: read

env:
  RG: rg-csa-loom-admin-usgovvirginia
  ACR: acrloomdcmt6cqoezlgs
  ACR_LOGIN: acrloomdcmt6cqoezlgs.azurecr.us
  APP: loom-console
  UNITY_APP: loom-unity

jobs:
  wire:
    name: Wire OSS Unity Catalog + Purview into the Gov console
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (Gov sub) — deploy SP
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment

      - name: Set Azure cloud to Gov
        run: az cloud set --name AzureUSGovernment

      - name: Discover Gov console environment (CAE, UAMI, current env)
        run: |
          set -euo pipefail
          CAE_ID=$(az containerapp show -n "$APP" -g "$RG" --query properties.environmentId -o tsv | tr -d '\r')
          UAMI_ID=$(az containerapp show -n "$APP" -g "$RG" --query 'identity.userAssignedIdentities | keys(@) | [0]' -o tsv | tr -d '\r')
          LOCATION=$(az containerapp show -n "$APP" -g "$RG" --query location -o tsv | tr -d '\r' | tr '[:upper:]' '[:lower:]' | tr -d ' ')
          echo "CAE_ID=$CAE_ID" >> "$GITHUB_ENV"
          echo "UAMI_ID=$UAMI_ID" >> "$GITHUB_ENV"
          echo "LOCATION=$LOCATION" >> "$GITHUB_ENV"
          echo "::notice::CAE=$CAE_ID UAMI=$UAMI_ID location=$LOCATION"

      - name: Build loom-unity image on the Gov ACR
        if: ${{ inputs.skip_unity != 'true' }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short=8 HEAD)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          # #2603: lease the ACR firewall instead of a bare toggle, so this
          # step's re-lock cannot deny another run's in-flight push.
          bash scripts/csa-loom/acr-firewall-lease.sh acquire --acr "$ACR"
          for i in $(seq 1 12); do az acr login -n "$ACR" >/dev/null 2>&1 && break; sleep 15; done
          # svc-loom-unity-authz (round 2) — ALSO tag :v0.1. admin-plane/main.bicep
          # now deploys this same app on every boundary and pulls
          # `loom-unity:${appImageTags.unity}` (v0.1 in gcc-high/il5.bicepparam).
          # If this workflow only published :<sha> + :latest, the first orchestrator
          # deploy over this estate would repoint the LIVE app at a tag that does
          # not exist and the revision would fail its image pull.
          # gov-build-images.yml is the from-scratch producer for the same tag.
          az acr build --registry "$ACR" --no-logs \
            --image "loom-unity:$SHA" --image "loom-unity:latest" --image "loom-unity:v0.1" \
            --file apps/loom-unity/Dockerfile \
            apps/loom-unity
          bash scripts/csa-loom/acr-firewall-lease.sh release --acr "$ACR" || true

      - name: Release the ACR firewall lease (always)
        if: always()
        run: bash scripts/csa-loom/acr-firewall-lease.sh release --acr "$ACR" || true

      - name: Deploy the OSS Unity Catalog Container App (loom-unity-app.bicep)
        if: ${{ inputs.skip_unity != 'true' }}
        run: |
          set -euo pipefail
          # svc-loom-unity-authz — this workflow used to deploy the catalog with
          # NO entraClientId, and the module silently downgraded to
          # server.authorization=disable: anything on the Gov CAE VNet could read
          # AND mutate catalog metadata anonymously. Pin the audience to the app
          # registration the Console already signs in with, and pin ingress to the
          # Container Apps infrastructure subnet so "on the VNet" is no longer
          # sufficient to open a connection.
          UNITY_CLIENT_ID=$(az containerapp show -n "$APP" -g "$RG" \
            --query "properties.template.containers[0].env[?name=='LOOM_MSAL_CLIENT_ID'].value | [0]" -o tsv | tr -d '\r')
          if [ -z "${UNITY_CLIENT_ID:-}" ]; then
            echo "::error::LOOM_MSAL_CLIENT_ID is not set on $APP, so no Entra audience can be pinned for Loom Unity. Run csa-loom-post-deploy-bootstrap (bootstrap-msal-app-reg.sh) first. Refusing to deploy an anonymously-readable catalog (svc-loom-unity-authz)."
            exit 1
          fi
          CAE_SUBNET_ID=$(az containerapp env show --ids "$CAE_ID" --query properties.vnetConfiguration.infrastructureSubnetId -o tsv | tr -d '\r')
          CAE_CIDR=$(az network vnet subnet show --ids "$CAE_SUBNET_ID" --query addressPrefix -o tsv | tr -d '\r')
          if [ -z "${CAE_CIDR:-}" ]; then
            echo "::error::Could not resolve the CAE infrastructure subnet CIDR from $CAE_SUBNET_ID — refusing to deploy without the ingress IP pin."
            exit 1
          fi
          echo "::notice::pinning Loom Unity audience to api://$UNITY_CLIENT_ID and ingress to $CAE_CIDR"
          # svc-loom-unity-authz (round 2) — CONVERGE WITH THE ORCHESTRATOR.
          # admin-plane/main.bicep now deploys a Container App with this exact
          # name into this exact RG, so the next Gov infra deploy ADOPTS whatever
          # this step leaves behind. Adoption is only safe if the two agree, so:
          #   * identity — prefer the dedicated least-privilege UAMI the
          #     orchestrator creates (uami-loom-unity-<location>); fall back to the
          #     Console UAMI only on estates the orchestrator has not reached yet
          #     (its ONLY grants there are AcrPull + its own Postgres, so the
          #     broadly-permissioned Console identity is not the right long-term
          #     home for an app that exposes IMDS to in-container code);
          #   * image — :v0.1, the tag the Gov bicepparams pull.
          # See docs/fiab/unity-gov.md § "Ownership".
          UNITY_UAMI_ID=$(az identity show -n "uami-loom-unity-${LOCATION}" -g "$RG" --query id -o tsv 2>/dev/null | tr -d '\r' || true)
          if [ -z "${UNITY_UAMI_ID:-}" ]; then
            UNITY_UAMI_ID="$UAMI_ID"
            echo "::notice::dedicated uami-loom-unity-${LOCATION} not present yet — using the Console UAMI; the next admin-plane deploy switches it to the dedicated identity."
          fi
          UNITY_UAMI_CLIENT_ID=$(az identity show --ids "$UNITY_UAMI_ID" --query clientId -o tsv 2>/dev/null | tr -d '\r' || true)
          az deployment group create -g "$RG" \
            -n "loom-unity-$(date -u +%Y%m%d%H%M%S)" \
            -f platform/fiab/bicep/modules/compute/loom-unity-app.bicep \
            -p location="$LOCATION" \
               environmentId="$CAE_ID" \
               unityUamiId="$UNITY_UAMI_ID" \
               unityUamiClientId="$UNITY_UAMI_CLIENT_ID" \
               acrLoginServer="$ACR_LOGIN" \
               image="$ACR_LOGIN/loom-unity:v0.1" \
               dbEphemeral=true \
               authMode=entra \
               entraClientId="$UNITY_CLIENT_ID" \
               consoleAllowedCidrs="[\"$CAE_CIDR\"]" \
               complianceTags='{"env":"gov","boundary":"usgovvirginia"}' \
            -o none
          echo "UNITY_CLIENT_ID=$UNITY_CLIENT_ID" >> "$GITHUB_ENV"
          # Gov posture: H2 on an Azure Files SMB mount fails to ATTACH on this
          # boundary — the mount blocks container start (CrashLoopBackOff, restarts:0,
          # never logs) before the app runs, so an app-level LOOM_UNITY_DB_LOCAL
          # fallback can't help. dbEphemeral=true makes the DB volume an EmptyDir
          # (no storage account/share, no SMB mount) + sets LOOM_UNITY_DB_LOCAL in
          # the container spec, so UC boots FUNCTIONAL now. Catalog metadata is not
          # persisted across restarts; wire unityDbUrl (Postgres) — gated on Gov
          # Postgres quota — for durable storage.
          FQDN=$(az containerapp show -n "$UNITY_APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv | tr -d '\r')
          echo "UNITY_FQDN=$FQDN" >> "$GITHUB_ENV"
          echo "::notice::loom-unity internal FQDN: $FQDN (H2 local-ephemeral; wire LOOM_UNITY_DB_URL=postgres for durable metadata)"
          # Wait for the new revision to go healthy before the console reads it.
          for i in $(seq 1 20); do
            H=$(az containerapp revision show -n "$UNITY_APP" -g "$RG" --revision "$(az containerapp show -n "$UNITY_APP" -g "$RG" --query properties.latestRevisionName -o tsv | tr -d '\r')" --query properties.healthState -o tsv 2>/dev/null | tr -d '\r')
            echo "loom-unity health=$H"; [ "$H" = "Healthy" ] && break; sleep 15
          done

      - name: Discover the Gov Purview account
        if: ${{ inputs.skip_purview != 'true' }}
        run: |
          set -euo pipefail
          PVW=$(az resource list --resource-type Microsoft.Purview/accounts --query '[0].name' -o tsv | tr -d '\r')
          if [ -z "$PVW" ]; then
            echo "::error::No Purview account found in the Gov subscription — cannot wire LOOM_PURVIEW_ACCOUNT."
            exit 1
          fi
          echo "PVW=$PVW" >> "$GITHUB_ENV"
          echo "::notice::Gov Purview account: $PVW"

      - name: Set console env (LOOM_UC_BACKEND / LOOM_UNITY_URL / LOOM_PURVIEW_ACCOUNT) + roll
        run: |
          set -euo pipefail
          VARS=""
          if [ "${{ inputs.skip_unity }}" != "true" ] && [ -n "${UNITY_FQDN:-}" ]; then
            # svc-loom-unity-authz — the CONSOLE half. The catalog now enforces
            # Entra bearer authorization, so the BFF must mint a matching token on
            # every /api/databricks/unity-catalog/* call or it will 401. All three
            # vars are set explicitly; uc-backend.ts then fails CLOSED instead of
            # silently retrying anonymously.
            VARS="$VARS LOOM_UC_BACKEND=oss LOOM_UNITY_URL=https://$UNITY_FQDN"
            VARS="$VARS LOOM_UNITY_CLIENT_ID=$UNITY_CLIENT_ID"
            VARS="$VARS LOOM_UNITY_AUDIENCE=api://$UNITY_CLIENT_ID/.default"
            VARS="$VARS LOOM_UNITY_AUTH_MODE=entra"
          fi
          if [ "${{ inputs.skip_purview }}" != "true" ] && [ -n "${PVW:-}" ]; then
            VARS="$VARS LOOM_PURVIEW_ACCOUNT=$PVW"
          fi
          if [ -z "$VARS" ]; then echo "::notice::nothing to set"; exit 0; fi
          echo "::notice::setting on $APP:$VARS"
          # shellcheck disable=SC2086
          az containerapp update -n "$APP" -g "$RG" --set-env-vars $VARS -o none

      - name: Health-gate the new console revision
        run: |
          set -euo pipefail
          NEWREV=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv | tr -d '\r')
          H=""
          for i in $(seq 1 24); do
            H=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$NEWREV" \
              --query properties.healthState -o tsv 2>/dev/null | tr -d '\r')
            echo "$(date -u +%H:%M:%S) $NEWREV=$H"
            [ "$H" = "Healthy" ] && break
            sleep 15
          done
          if [ "$H" != "Healthy" ]; then
            echo "::error::New revision $NEWREV did not reach Healthy — inspect and roll back via gov-console-roll (lastgood)."
            exit 1
          fi

      - name: Probe the wired backends from inside the console
        run: |
          set -euo pipefail
          # The console is behind Front Door with MSAL; probe the UNAUTH health route
          # for liveness, and use the self-audit checks for the two new backends on
          # the next operator sign-in. Here we verify the loom-unity app itself
          # answers on its catalog root (internal ingress — reachable only in-VNet,
          # so we exec a curl inside the console container).
          if [ "${{ inputs.skip_unity }}" != "true" ] && [ -n "${UNITY_FQDN:-}" ]; then
            REP=$(az containerapp replica list -n "$APP" -g "$RG" --query '[0].name' -o tsv | tr -d '\r')
            OUT=$(az containerapp exec -n "$APP" -g "$RG" --replica "$REP" --container "$APP" \
              --command "node -e \"fetch('https://$UNITY_FQDN/api/2.1/unity-catalog/catalogs').then(r=>r.text().then(t=>console.log('UC',r.status,t.slice(0,200)))).catch(e=>console.log('UC ERR',e.message))\"" 2>/dev/null || true)
            echo "$OUT"
            # svc-loom-unity-authz — this is an UNAUTHENTICATED read. With
            # authorization enforced it MUST be rejected. A 200 here is the exact
            # finding this workflow change closes, so treat it as a failure, not
            # a success: it means the catalog is answering anonymous callers.
            if echo "$OUT" | grep -q "UC 200"; then
              echo "::error::Loom Unity answered an UNAUTHENTICATED read with 200 — authorization is NOT being enforced (svc-loom-unity-authz). Check the loom-unity container logs for the LOOM_UNITY_AUTH value it booted with."
              exit 1
            fi
            if echo "$OUT" | grep -qE "UC (401|403)"; then
              echo "::notice::Loom Unity rejected the unauthenticated read — Entra bearer authorization is enforced."
            else
              echo "::warning::Unexpected Loom Unity probe result (first boot can take ~1 min, and a fail-closed boot returns a connection error). Check the loom-unity container logs."
            fi
          fi
          echo "::notice::Purview + UC wiring applied. Operator: open the Gov console → Governance; the Purview gates should be gone. If Atlas calls 403, grant the console UAMI Data Reader + Data Curator on the Purview ROOT collection (Purview portal → Data Map → Collections → Role assignments)."
