name: loom-synthetic-monitor

# V1 (loom-next-level WS-V) — synthetic user-journey monitoring.
#
# Every 15 minutes (+ on demand) this workflow starts the scheduled-capable
# `loom-synthetic-monitor` Container App Job (modules/admin-plane/
# synthetic-monitor-job.bicep) which runs the six real end-to-end journeys
# (e2e/synthetic-journeys.uat.ts via e2e/run-synthetic.mjs) against the LIVE
# deployment from INSIDE the console VNet:
#   J1 TRUE MSAL login probe (the 2026-07-19 AADSTS7000215 class — the check
#      minted-session `verify` monitoring is blind to), J2 create-item,
#   J3 editor+primary action, J4 warehouse query, J5 marketplace subscribe,
#   J6 git-sync/promotion.
#
# The ACA job itself ALSO carries a */15 Schedule trigger (in-VNet, no GitHub
# dependency — the IL5-safe path). This workflow adds the pieces an in-VNet job
# cannot do itself: the GitHub-issue dedup on failure and the shared
# action-group notification, plus a dispatchable one-shot for receipts.
# The GH lane polls the job's LATEST execution rather than double-starting when
# one is already running.
#
# ALERTING (O1 unified convention — lib/azure/alert-dispatch.ts is the code
# module; this bash lane mirrors its contract): failures are SEVERITY P1
# (user-facing journeys / sign-in path down → page, per
# docs/fiab/runbooks/on-call.md) and notify through the ONE shared action
# group `loom-default-alerts` (monitoring-default-alerts.bicep::
# defaultActionGroup, derived var LOOM_ALERT_ACTION_GROUP_ID) via
# `az monitor action-group test-notifications create` — which delivers to
# EVERY receiver on the group: email + subscription-Owner ARM-role day-one,
# plus the optional O1 on-call webhook receiver once wired (see the runbook).
# NO parallel Logic Apps, NO per-item action groups. The dedup GitHub issue
# below follows the O1 open-issue-else-comment convention
# (alert-dispatch.upsertDedupIssue) and is the durable text channel.

on:
  schedule:
    # DECLARED */15. MEASURED median 55m (3.6x) — GitHub drops high-frequency
    # schedules on busy repos. Do not assume this interval when sizing anything
    # that depends on it (#3226).
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: 'Minutes to wait for the synthetic run before declaring it failed.'
        type: string
        default: '20'

permissions:
  contents: read
  issues: write

env:
  RG_NAME: rg-csa-loom-admin-centralus
  JOB_NAME: loom-synthetic-monitor
  ACTION_GROUP_NAME: loom-default-alerts

concurrency:
  group: loom-synthetic-monitor
  cancel-in-progress: false

jobs:
  synthetic-journeys:
    name: Run + gate the six synthetic journeys
    runs-on: ubuntu-latest
    steps:
      # This job never checked out the repo — it only called `az` to start an ACA
      # job. The edge-health step below runs a SCRIPT from the tree, so it needs
      # one. Its first live run (31479818731) died with
      #     bash: scripts/ci/check-vanity-edge-health.sh: No such file or directory
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Start (or adopt) a synthetic-monitor execution + poll to completion
        id: run
        env:
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes || '20' }}
        run: |
          set -e
          az config set extension.use_dynamic_install=yes_without_prompt -o none 2>/dev/null || true

          if ! az containerapp job show -n "$JOB_NAME" -g "$RG_NAME" -o none 2>/dev/null; then
            echo "::warning::$JOB_NAME Container App Job not found in $RG_NAME — the synthetic monitor is not deployed in this estate (deploy modules/admin-plane/synthetic-monitor-job.bicep via the admin-plane observabilityConfig bag). Skipping."
            echo "status=NotDeployed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Adopt an already-Running execution (the job's own */15 Schedule
          # trigger may have just fired) instead of double-starting.
          EXEC=$(az containerapp job execution list -n "$JOB_NAME" -g "$RG_NAME" \
            --query "[?properties.status=='Running'] | [0].name" -o tsv 2>/dev/null | tr -d '\r' || echo "")
          if [[ -n "$EXEC" ]]; then
            echo "::notice::Adopting in-flight execution $EXEC (job's own Schedule trigger)."
          else
            START_ERR=$(mktemp)
            EXEC=$(az containerapp job start -n "$JOB_NAME" -g "$RG_NAME" \
              --query name -o tsv 2>"$START_ERR" | tr -d '\r')
            if [[ -z "$EXEC" ]]; then
              echo "::error::Failed to start $JOB_NAME. az stderr:"; cat "$START_ERR" >&2 || true
              echo "status=StartFailed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "::notice::Started execution $EXEC"
          fi
          echo "execution=$EXEC" >> "$GITHUB_OUTPUT"

          DEADLINE=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          STATUS="Running"
          while :; do
            STATUS=$(az containerapp job execution list -n "$JOB_NAME" -g "$RG_NAME" \
              --query "[?name=='$EXEC'].properties.status | [0]" -o tsv 2>/dev/null | tr -d '\r' || echo "")
            [[ -z "$STATUS" ]] && STATUS="Unknown"
            echo "[synthetic] $(date -u +%H:%M:%S) status=$STATUS"
            case "$STATUS" in
              Succeeded) break ;;
              Failed|Degraded|Cancelled) break ;;
            esac
            if (( $(date +%s) >= DEADLINE )); then STATUS="TimedOut"; break; fi
            sleep 20
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          # Best-effort: surface the UAT_RESULT summary line from Log Analytics
          # (ingestion lags — the execution status above is the gate, never this).
          #
          # R7 (deploy-integrity: error messages must be TRUE): keep stderr so a
          # FAILED query is reported as a failed query. The previous version sent
          # both the workspace lookup and the query to /dev/null, so "the lookup
          # errored" and "there is no UAT_RESULT row" collapsed into the same
          # empty string — and the issue body then asserted the second. That is
          # the UNKNOWN-reported-as-NEGATIVE class; the cause is now measured, not
          # guessed. Still best-effort: this never fails the step.
          LA_ERR=$(mktemp)
          WS=$(az monitor log-analytics workspace list -g "$RG_NAME" \
            --query "[?starts_with(name, 'law-csa-loom-')]|[0].customerId" -o tsv 2>"$LA_ERR" | tr -d '\r' || echo "")
          if [[ -z "$WS" ]]; then
            WS=$(az monitor log-analytics workspace list -g "$RG_NAME" --query "[0].customerId" -o tsv 2>>"$LA_ERR" | tr -d '\r' || echo "")
          fi
          if [[ -z "$WS" ]]; then
            echo "::warning::Could not resolve a Log Analytics workspace in $RG_NAME — the failing-journey summary is unavailable for this run (this is NOT evidence about the journeys). az stderr:"
            sed 's/^/  /' "$LA_ERR" >&2 || true
          else
            QERR=$(mktemp)
            # The VERDICT is az's EXIT CODE, never "did it write to stderr".
            # az writes extension-install notices there ("The command requires
            # the extension log-analytics. It will be installed first."), so a
            # stderr-emptiness test reports a perfectly good query as FAILED —
            # measured on run 31351602478, which is the same stderr-contamination
            # class this step exists to stop mis-reporting.
            set +e
            RAW=$(az monitor log-analytics query -w "$WS" --analytics-query \
              "ContainerAppConsoleLogs_CL | where ContainerAppName_s == '$JOB_NAME' | where Log_s contains 'UAT_RESULT' | order by TimeGenerated desc | take 1 | project Log_s" \
              --query "[0].Log_s" -o tsv 2>"$QERR")
            QRC=$?
            set -e
            RESULT=$(printf '%s' "$RAW" | tr -d '\r')
            if [[ -n "$RESULT" ]]; then
              echo "::notice::$RESULT"
              echo "loom-synthetic-monitor: $RESULT" >> "$GITHUB_STEP_SUMMARY"
              echo "uat_result=$RESULT" >> "$GITHUB_OUTPUT"
            elif [[ $QRC -ne 0 ]]; then
              echo "::warning::The UAT_RESULT query FAILED (rc=$QRC) — so 'no result' here is unknown, not negative. az stderr:"
              sed 's/^/  /' "$QERR" >&2 || true
            else
              echo "::notice::No UAT_RESULT row yet for $JOB_NAME (query succeeded, zero rows — ingestion typically lags a few minutes)."
            fi
          fi

          # Surface the per-journey lines from the execution's own console logs.
          # This is what an operator actually needs: which of J1..J6 went red.
          #
          # Deliberately NOT a guessed pass/fail regex. The reporter's marker
          # glyphs are not pinned anywhere in this repo, and a pattern that
          # matched nothing would render as "no journey failed" — manufacturing
          # the same false-negative this commit exists to remove. So: match the
          # journey TITLES (which are pinned, in e2e/synthetic-journeys.uat.ts)
          # and hand the operator the raw lines to read.
          if [[ -n "$WS" ]]; then
            JERR=$(mktemp)
            # Exit code, not stderr-emptiness — see the UAT_RESULT block above.
            set +e
            JRAW=$(az monitor log-analytics query -w "$WS" --analytics-query \
              "ContainerAppConsoleLogs_CL | where ContainerAppName_s == '$JOB_NAME' | where TimeGenerated > ago(2h) | where Log_s has_any ('synthetic J', 'UAT_FAIL', 'UAT_REAL_FAILS') | order by TimeGenerated asc | take 60 | project Log_s" \
              --query "[].Log_s" -o tsv 2>"$JERR")
            JRC=$?
            set -e
            JOURNEYS=$(printf '%s' "$JRAW" | tr -d '\r')
            if [[ -n "$JOURNEYS" ]]; then
              echo "::group::Per-journey console lines (last 2h)"
              echo "$JOURNEYS"
              echo "::endgroup::"
              {
                echo "### Per-journey lines"
                echo '```'
                echo "$JOURNEYS"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              # Keep the output single-line and bounded — GITHUB_OUTPUT is not a
              # multi-line channel without a heredoc, and the issue body only
              # needs a pointer plus a short excerpt.
              #
              # awk, not tr/sed: `tr` maps single CHARACTERS, so `tr '\n' ' | '`
              # silently collapses to a plain space, and a tr-to-sentinel +
              # `sed 's/\034/ | /g'` does not match either (sed does not read
              # `\034` as an octal escape in the pattern) — it leaves invisible
              # control bytes in the issue body. Both were tried; both were
              # wrong in a way a terminal will not show you.
              echo "journey_lines=$(printf '%s' "$JOURNEYS" | awk '{ printf "%s%s", (NR>1 ? " | " : ""), $0 }' | cut -c1-800)" >> "$GITHUB_OUTPUT"
            elif [[ $JRC -ne 0 ]]; then
              echo "::warning::The per-journey log query FAILED (rc=$JRC) — 'no journey lines' below is unknown, not negative."
              sed 's/^/  /' "$JERR" >&2 || true
            else
              echo "::notice::No 'synthetic J' console lines in the last 2h (query succeeded, zero rows)."
            fi
          fi

          if [[ "$STATUS" != "Succeeded" ]]; then
            echo "::error::Synthetic journeys FAILED (status=$STATUS, execution $EXEC) — realFails>0 (the runner exits non-zero only on real code/login failures; honest infra gates exit 0). Inspect ContainerAppConsoleLogs_CL (ContainerAppName_s=='$JOB_NAME') for the failing journey + the Journeys tab on /admin/health."
            exit 1
          fi

      # THE EDGE, WHICH NOTHING ELSE WATCHES.
      #
      # This monitor's ACA job probes LOOM_URL=`http://loom-console` — the
      # IN-CLUSTER name. It never leaves the Container Apps environment, so it is
      # blind to Front Door, to the vanity-domain binding and to TLS entirely.
      # loom-uat probes the *.azurefd.net host, which stays healthy while the
      # vanity host is dead — that is the CONTROL, not the subject.
      #
      # csa-loom.limitlessdata.ai has lost its Front Door route binding TWICE
      # (2026-08-10, reported by the operator; 2026-08-11, found by hand) and this
      # monitor reported success straight through both. The one URL a human opens
      # was the one URL nothing checked.
      #
      # continue-on-error is NOT set: an edge outage is an outage. The check
      # itself distinguishes BROKEN (exit 1) from UNKNOWN (exit 2, an unreadable
      # control plane) so a lapsed permission cannot manufacture a false outage.
      - name: Vanity-domain edge health (Front Door route binding + served certificate)
        # Runs even when the journey step failed: a journey outage and an edge
        # outage are different faults, and the second must not be hidden by the
        # first (the #3042 masking shape). Its own verdict still fails the run.
        if: ${{ !cancelled() }}
        env:
          # Only the HOST. The profile, custom domain, endpoints and routes are
          # all discovered from it — check-afd-endpoint-discovery.mjs forbids
          # addressing a CDN endpoint by a name CI never discovered, and naming
          # the route here would also have made the check unable to see the very
          # outage it exists for (the binding is what breaks).
          VANITY_HOST: csa-loom.limitlessdata.ai
        run: |
          bash scripts/ci/check-vanity-edge-health.sh --rg "$RG_NAME" --host "$VANITY_HOST"

      - name: Alert — notify the shared action group (loom-default-alerts, P1)
        if: failure() && steps.run.outputs.status != 'NotDeployed'
        run: |
          # O1 unified alert convention (P1 — journeys failing = page band):
          # route through the ONE shared default action group. test-notifications
          # delivers a real notification to EVERY receiver on the group (email +
          # subscription-Owner ARM-role day-one; the optional oncall-webhook
          # receiver too once wired per docs/fiab/runbooks/on-call.md — P1
          # includes it by design). Best-effort — the dedup GitHub issue below
          # is the durable signal.
          az monitor action-group test-notifications create \
            -g "$RG_NAME" --action-group-name "$ACTION_GROUP_NAME" \
            --alert-type log 2>/dev/null \
          || az monitor action-group test-notifications create \
            -g "$RG_NAME" --action-group-name "$ACTION_GROUP_NAME" \
            --alert-type budget 2>/dev/null \
          || echo "::warning::action-group notification failed (receivers may still be empty on this estate) — the dedup issue below is the durable alert."

      - name: File / update dedup issue on failure
        if: failure() && steps.run.outputs.status != 'NotDeployed'
        uses: actions/github-script@v7
        env:
          # Values reach the script through the ENVIRONMENT, never through
          # `${{ }}` interpolated into the JS source. Two reasons, both of them
          # the same failure class this commit exists to close:
          #   1. These strings are LOG TEXT. A Playwright line containing a
          #      backtick or `${` interpolated into a template literal is a
          #      SyntaxError — which kills the step before line 1 and makes the
          #      alert silent, exactly as `const exec` did.
          #   2. It is also the injection-safe form: nothing in a log line can
          #      become code.
          SYNTH_STATUS: ${{ steps.run.outputs.status }}
          SYNTH_EXEC: ${{ steps.run.outputs.execution }}
          SYNTH_UAT: ${{ steps.run.outputs.uat_result }}
          SYNTH_JOURNEYS: ${{ steps.run.outputs.journey_lines }}
        with:
          script: |
            // NOTE: `exec`, `github`, `context`, `core`, `glob`, `io`, `fetch`,
            // `require` and `__original_require__` are INJECTED by
            // actions/github-script as parameters of the async function this
            // body becomes. Declaring a `const` of any of those names is a
            // SyntaxError that kills the step before its first line runs — which
            // is exactly how this alert stayed silent for 83 consecutive
            // failures (see the header). scripts/ci/check-github-script-syntax.mjs
            // now compiles every one of these blocks the same way the action
            // does, so the class cannot come back.
            const status = process.env.SYNTH_STATUS || 'Failed';
            const execName = process.env.SYNTH_EXEC || '<unknown>';
            const uat = process.env.SYNTH_UAT || '(no UAT_RESULT was retrieved — either Log Analytics ingestion lagged or the query itself failed; the poll step logs which. Check the container logs.)';
            const journeys = process.env.SYNTH_JOURNEYS || '(none retrieved — see the poll step, which distinguishes a failed query from zero rows)';
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Severity: **P1** (page band — O1 alert convention, docs/fiab/runbooks/on-call.md)`,
              `Execution: \`${execName}\` → **${status}**`,
              `Summary: \`${uat}\``,
              `Journey lines: \`${journeys}\``,
              ``,
              `The six synthetic journeys (J1 MSAL login / J2 create-item / J3 editor / J4 query / J5 marketplace / J6 git-promotion) run in-VNet every 15 min; a failure here is a REAL code or sign-in-path failure (honest infra gates never fail the run).`,
              `Triage + ack: on-call runbook docs/fiab/runbooks/on-call.md · Journeys tab on /admin/health · runbook docs/fiab/runbooks/synthetic-journeys.md · Log Analytics ContainerAppConsoleLogs_CL (ContainerAppName_s=='loom-synthetic-monitor').`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'synthetic-monitor', per_page: 1,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Synthetic journeys failing again.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `synthetic-monitor: journeys failing (${status})`,
                body, labels: ['csa-loom', 'synthetic-monitor'],
              });
            }

      - name: Auto-close stale synthetic-monitor issues on success
        if: success() && steps.run.outputs.status == 'Succeeded'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'synthetic-monitor', per_page: 20,
            });
            for (const iss of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: iss.number,
                body: `Auto-resolved: synthetic journeys are GREEN (run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}). Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: iss.number, state: 'closed',
              });
            }
