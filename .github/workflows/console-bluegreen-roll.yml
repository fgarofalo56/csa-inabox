name: console-bluegreen-roll

# BR-BLUEGREEN — zero-downtime blue-green roll of the loom-console Container App.
#
# Supersedes the in-place `az containerapp update --image` roll (single-revision
# PATCH, where a bad image = instant outage until a manual rollback). Instead:
#   1. ensure the app is in MULTIPLE-revision mode (idempotent),
#   2. build the image server-side on the ACR (same pattern as gov-console-roll),
#   3. deploy it as a NEW ("green") revision at 0% traffic,
#   4. health-gate green: revision healthState == Healthy AND a probe to
#      /api/version on green's OWN revision FQDN reports the new build SHA,
#   5. shift traffic blue=0 green=100 ONLY after green is healthy,
#   6. auto-roll-back on any gate failure — traffic never left blue, and the
#      failed green revision is deactivated.
# Non-interactive + idempotent. Commercial + Gov (AzureUSGovernment) via the
# `cloud` input, matching gov-console-roll's SP pattern.
#
# Runbook: docs/fiab/deployment/bluegreen-rolls.md
on:
  workflow_dispatch:
    inputs:
      cloud:
        description: 'Target cloud'
        type: choice
        options: [commercial, gov]
        default: commercial
        required: true
      resource_group:
        description: 'Admin-plane RG (blank = cloud default: Commercial rg-csa-loom-admin, Gov rg-csa-loom-admin-usgovvirginia)'
        required: false
        default: ''
      app:
        description: 'Container App name'
        required: false
        default: 'loom-console'
      health_retries:
        description: 'Health-gate polls (30s each) before declaring green unhealthy'
        required: false
        default: '24'
      agent_pool_name:
        description: 'ACR agent pool to build on (#2706). Default loombuild2 — the ORIGINAL `loombuild` pool on the Gov ACR has a backing queue stuck in "being deleted" (409); builds submitted to it sit ~60min and `az acr build` exits 0 having pushed NOTHING. loombuild2 is proven by 8+ consecutive green Gov rolls (17-23min each). If it ever wedges the same way, pass a FRESH name (loombuild3) — recreating a wedged pool 409s.'
        type: string
        default: 'loombuild2'

permissions:
  contents: read

jobs:
  bluegreen:
    name: Blue-green roll (${{ inputs.cloud }})
    runs-on: ubuntu-latest
    # #2706 — bound the run. Without this the job inherits the 6-hour default,
    # and a wedged ACR agent pool burned 4h25m in `az acr build` before anyone
    # could act (Commercial builds the same commit in ~15min, Gov ~17-23min on a
    # healthy pool). A bound turns "silently stuck" into a failed run. Sized to
    # cover build (~25min) + health-gate (24 polls x 30s = 12min) with headroom.
    timeout-minutes: 90
    env:
      APP: ${{ inputs.app }}
      HEALTH_RETRIES: ${{ inputs.health_retries }}
    steps:
      - uses: actions/checkout@v7

      # ── Auth: Commercial vs Gov SP (mirrors full-app-deploy / gov-console-roll) ──
      - name: Azure login (Commercial)
        if: ${{ inputs.cloud == 'commercial' }}
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Azure login (Gov)
        if: ${{ inputs.cloud == 'gov' }}
        uses: Azure/login@v2
        with:
          environment: AzureUSGovernment
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }

      - name: Set Azure cloud (Gov)
        if: ${{ inputs.cloud == 'gov' }}
        run: az cloud set --name AzureUSGovernment

      # ── Resolve RG + ACR for the chosen cloud ─────────────────────────────────
      - name: Resolve RG + ACR
        id: resolve
        run: |
          set -euo pipefail
          RG="${{ inputs.resource_group }}"
          # The admin RG is region-suffixed (rg-csa-loom-admin-<region>, e.g.
          # -usgovvirginia). Resolve it by prefix so we don't hardcode the region.
          if [[ -z "$RG" ]]; then
            RG=$(az group list --query "[?starts_with(name, 'rg-csa-loom-admin')] | [0].name" -o tsv | tr -d '\r')
          fi
          if [[ -z "$RG" ]] || ! az group show -n "$RG" -o none 2>/dev/null; then
            echo "::error::Admin RG not found (looked for rg-csa-loom-admin*) — pass resource_group."; exit 1
          fi
          ACR=$(az acr list --resource-group "$RG" --query "[?starts_with(name, 'acrloom')]|[0].name" -o tsv | tr -d '\r')
          if [[ -z "$ACR" ]]; then echo "::error::No acrloom* ACR in $RG."; exit 1; fi
          LOGIN=$(az acr show -n "$ACR" --query loginServer -o tsv | tr -d '\r')
          echo "rg=$RG"       >> "$GITHUB_OUTPUT"
          echo "acr=$ACR"     >> "$GITHUB_OUTPUT"
          echo "login=$LOGIN" >> "$GITHUB_OUTPUT"
          echo "::notice::RG=$RG ACR=$ACR login=$LOGIN app=$APP"

      # ── Ensure MULTIPLE-revision mode (idempotent; enables blue-green) ────────
      #
      # THIS STEP IS WHERE THE LANE DIED, ALL FOUR TIMES (#3399). Run
      # 30635466301 (2026-07-31) is representative, verbatim:
      #     current activeRevisionsMode=Single
      #     switching loom-console to multiple-revision mode
      #     ERROR: (ContainerAppInvalidIngressStickySessionRevisionMode)
      #            Sticky Session is not supported for Multiple revision mode.
      #     ##[error]Process completed with exit code 1.
      # ACA refuses Multiple-revision mode while ingress session affinity is
      # 'sticky' — they are mutually exclusive. The old step ran the bare `az`
      # under `set -e`, so a run ended on an ARM error naming neither the
      # conflicting setting nor a way out. Per deploy-integrity R6 a failure
      # that hands back no remediation is a defect in itself, so the fix is not
      # only to clear the conflict but to SAY what was wrong when it can't.
      #
      # affinity:'none' is now asserted in bicep for every multiRevision app
      # (modules/admin-plane/app-deployments.bicep), so a deployed estate
      # self-heals. This step covers the estate BETWEEN deploys, and per
      # auto-bind-by-default it performs the remediation rather than printing
      # it: clear affinity, retry once, fail CLOSED with the exact command if
      # that still doesn't take.
      #
      # R7 — nothing here asserts a cause it did not establish. The sticky
      # branch is entered only when ACA's own error names it; any other failure
      # is reported verbatim and explicitly labelled unclassified. And note
      # `sticky-sessions show --query affinity -o tsv` returns EMPTY (not
      # 'none') when the app has no stickySessions block at all — measured on
      # the live console — so the empty case is rendered as <unset>, never as a
      # value we did not read.
      - name: Ensure multiple-revision mode
        run: |
          set -uo pipefail
          RG="${{ steps.resolve.outputs.rg }}"

          if ! MODE=$(az containerapp show -n "$APP" -g "$RG" \
                --query properties.configuration.activeRevisionsMode -o tsv | tr -d '\r'); then
            echo "::error::Could not READ activeRevisionsMode for $APP in $RG, so this step will not claim anything about it. Either the app does not exist in that resource group, or this workflow's identity lacks Reader on it. Remediation: az containerapp show -n $APP -g $RG"
            exit 1
          fi
          echo "::notice::current activeRevisionsMode=$MODE"
          if [[ "${MODE,,}" == "multiple" ]]; then
            echo "::notice::already in multiple-revision mode — nothing to do."
            exit 0
          fi

          set_mode() { az containerapp revision set-mode -n "$APP" -g "$RG" --mode multiple -o none 2>&1; }

          echo "::notice::switching $APP to multiple-revision mode"
          if ERR=$(set_mode); then exit 0; fi

          if [[ "$ERR" != *"ContainerAppInvalidIngressStickySessionRevisionMode"* ]]; then
            echo "::error::$APP could not be switched to multiple-revision mode, and the failure is NOT the known sticky-session conflict — this step cannot classify it further. Azure said:"
            printf '%s\n' "$ERR"
            exit 1
          fi

          AFFINITY=$(az containerapp ingress sticky-sessions show -n "$APP" -g "$RG" \
            --query affinity -o tsv 2>&1 | tr -d '\r') || AFFINITY='<unreadable>'
          echo "::warning::$APP has ingress session affinity='${AFFINITY:-<unset>}', which ACA forbids in multiple-revision mode. Clearing it to 'none': blue-green runs two revisions at once, so affinity cannot be honoured here. Anything that pins a caller to a replica must not depend on it — see issue #3400 (SQL query-cancel)."

          if ! OUT=$(az containerapp ingress sticky-sessions set -n "$APP" -g "$RG" --affinity none -o none 2>&1); then
            echo "::error::Could not clear ingress session affinity on $APP, so blue-green cannot proceed. Remediation (needs Contributor on the container app): az containerapp ingress sticky-sessions set -n $APP -g $RG --affinity none — then re-run this workflow. Azure said:"
            printf '%s\n' "$OUT"
            exit 1
          fi

          if ! ERR=$(set_mode); then
            echo "::error::Affinity was cleared to 'none', but $APP still could not switch to multiple-revision mode — so the sticky conflict was not the only blocker. Azure said:"
            printf '%s\n' "$ERR"
            exit 1
          fi
          echo "::notice::$APP is now in multiple-revision mode (affinity cleared from '${AFFINITY:-<unset>}')."

      # ── Capture the current production (BLUE) revision — the rollback target ──
      #
      # R7 / #3413 — THIS VALUE IS THE ROLLBACK TARGET, not a diagnostic. The
      # auto-rollback step at the bottom of this job re-pins 100% of ingress
      # traffic to whatever this step records, so a silently-wrong BLUE does not
      # degrade a message: it points a rollback at a revision that was never
      # production.
      #
      # The pre-#3413 shape read it as
      #     BLUE=$(az … ingress traffic show … -o tsv 2>/dev/null | tr -d '\r' || true)
      # and then branched on `-z "$BLUE"`. That test was doing DOUBLE DUTY — it
      # was the genuine fresh-app signal AND the swallowed-error signal. An auth
      # failure, an ARM throttle, a transient 5xx and a wrong `-n`/`-g` pair all
      # arrived as the same empty string, and the fallback branch then ran under
      # a comment asserting "Fresh app (latestRevision:true, unnamed)" — a cause
      # the code never established, and one no reader could disprove from the
      # log afterwards, because both cases printed the same nothing.
      #
      # The fallback is not a harmless default either. It takes the NEWEST ACTIVE
      # revision, and this job's own rollback step warns about the state that
      # makes that wrong: "rollback 1/2 FAILED — green … is still ACTIVE at 0%
      # traffic". On an app left in that state by an earlier failed roll, the
      # newest active revision is exactly the one that never served traffic.
      #
      # So each read branches on `az`'s EXIT STATUS, never on emptiness, and per
      # #2819 "the read SUCCEEDED and came back EMPTY" is its own class:
      #   read FAILED    -> the rollback target is UNKNOWN. Fail the step. This
      #                     happens BEFORE the build and before any revision is
      #                     created, so blue keeps 100% of traffic and nothing
      #                     has to be undone. Unknown must not proceed to a roll.
      #   read SUCCEEDED,
      #   value EMPTY    -> the genuine fresh-app case, and the ONLY thing that
      #                     licenses the newest-active-revision fallback.
      - name: Capture blue (current production) revision
        id: blue
        run: |
          # `-e` is KEPT here (unlike the health-gate and rollback steps below,
          # which drop it to reach their own classification): every failable
          # command in this step is already explicitly guarded by an `if`, so
          # `-e` costs nothing and still catches anything added carelessly later.
          set -euo pipefail
          RG="${{ steps.resolve.outputs.rg }}"
          ERR="$(mktemp)"
          # A newline inside a `::error::` ends the annotation and everything
          # after it is dropped, so truncate first, then flatten — the same
          # helper the health-gate and rollback steps use.
          err_detail() { head -c 400 "$ERR" | tr '\n' ' '; }

          # The blue revision is the one currently taking >0% ingress traffic.
          # `2>"$ERR"` rather than `2>/dev/null`, and NO `|| true`: the exit
          # status is the signal and the stderr is the evidence for the message.
          if ! BLUE="$(az containerapp ingress traffic show -n "$APP" -g "$RG" \
                --query "sort_by([?weight>\`0\`], &weight)[-1].revisionName" -o tsv 2>"$ERR" | tr -d '\r')"; then
            echo "::error::Could not READ the ingress traffic split for $APP in $RG, so the ROLLBACK TARGET is UNKNOWN — and this step will not guess one. A guessed blue is how an auto-rollback re-pins production traffic to a revision that was never production, so the roll stops HERE, before the image build and before any new revision exists: traffic is untouched and blue still holds 100%. This says nothing about whether the app is fresh; it says the read failed. Candidates: no such app/resource group under those names, this workflow's identity lacks Reader on it, or a transient ARM error worth a re-run. Check: az containerapp ingress traffic show -n $APP -g $RG . Detail: $(err_detail)"
            exit 1
          fi

          if [ -z "${BLUE//[[:space:]]/}" ] || [ "$BLUE" = 'None' ]; then
            # Reachable ONLY now that the read is known to have succeeded.
            echo "::notice::The ingress traffic read SUCCEEDED and reported NO weighted revision (value: '${BLUE:-<empty>}') — the fresh-app case, where ingress runs on latestRevision:true and no revision is named in the weights. Falling back to the newest ACTIVE revision BECAUSE THE READ SUCCEEDED AND CAME BACK EMPTY, not because anything failed."
            if ! BLUE="$(az containerapp revision list -n "$APP" -g "$RG" \
                  --query "sort_by([?properties.active], &properties.createdTime)[-1].name" -o tsv 2>"$ERR" | tr -d '\r')"; then
              echo "::error::The ingress traffic read reported no weighted revision, and the fresh-app fallback read of $APP's revision list in $RG then FAILED — so the rollback target is UNKNOWN and the roll stops here, before the build, with traffic untouched. Check: az containerapp revision list -n $APP -g $RG . Detail: $(err_detail)"
              exit 1
            fi
            if [ -z "${BLUE//[[:space:]]/}" ] || [ "$BLUE" = 'None' ]; then
              BLUE=''
              echo "::warning::BOTH reads SUCCEEDED and neither named a revision: $APP has no weighted ingress revision and no ACTIVE revision. Recording blue as empty — an ESTABLISHED absence, not a swallowed error. There is genuinely nothing to roll back to on an app whose first revision this roll will create, and the rollback step reports that state rather than claiming the weights are correct."
            fi
          fi

          echo "blue=$BLUE" >> "$GITHUB_OUTPUT"
          echo "::notice::BLUE (rollback target) = ${BLUE:-<none — established by two successful reads, see above>}"

      # ── Build the green image on the ACR (server-side; open→build→re-lock) ────
      - name: Build + push green image
        id: build
        run: |
          set -euo pipefail
          ACR="${{ steps.resolve.outputs.acr }}"
          SHA=$(git rev-parse --short=8 HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "::notice::Building loom-console:$SHA on $ACR"
          # #2603: take the ACR firewall lease instead of a bare toggle, so this
          # job's re-lock below cannot deny a concurrent build's in-flight push
          # (and vice versa). See docs/fiab/acr-firewall-lease.md.
          # #2706 — sized just above the job's timeout-minutes (90) so the lease
          # outlives any run that can still be alive, and no longer: an expired
          # lease mid-build lets the sweeper close the data plane under an
          # in-flight push, and an over-long one leaves the registry reachable
          # after a dead run. Matches gov-console-roll.yml.
          LOOM_ACR_LEASE_TTL_MINUTES=100 \
            bash scripts/csa-loom/acr-firewall-lease.sh acquire --acr "$ACR"
          # #3210 — this loop had no verdict at all and `az acr login` is the
          # wrong oracle anyway (returns 0 against a still-denying data plane).
          bash "${LOOM_ACR_DATAPLANE_READY_SCRIPT:-scripts/ci/acr-dataplane-ready.sh}" --acr "$ACR" --timeout-seconds 180             || echo "::warning::ACR data plane not confirmed reachable; the next data-plane call may be denied."
          bash scripts/ci/acr-login-retry.sh --acr "$ACR"
          # 2026-07-16: console builds run on the dedicated 16 GB S3 pool —
          # the default 8 GB agent cgroup-OOM-SIGKILLs the compile (cjdq..cjdv).
          # NOTE: pool builds do NOT get the trusted-service network bypass, so
          # the ACR must stay open for the duration of the build (it already is
          # for the tarball upload).
          #
          # #2706 — the pool is `loombuild2`, NOT `loombuild`. This workflow takes
          # `cloud: gov`, so it resolves the SAME Gov registry whose original
          # `loombuild` pool has a backing queue stuck in "being deleted" (409):
          # builds submitted to it sit ~60min and `az acr build` exits 0 having
          # pushed NOTHING (runs 30552543683, 30558316496). #2938 moved
          # gov-console-roll + gov-build-images off it and MISSED this lane, which
          # is the documented blue-green successor to the in-place roll — so the
          # safer roll path was the one still aimed at the dead queue.
          # loombuild2 is proven on that registry by 8+ consecutive green rolls.
          POOL="${{ inputs.agent_pool_name }}"
          POOL="${POOL:-loombuild2}"
          echo "::notice::building on ACR agent pool: $POOL"
          az acr agentpool show -r "$ACR" -n "$POOL" -o none 2>/dev/null \
            || az acr agentpool create -r "$ACR" -n "$POOL" --tier S3 -o none
          CNT=$(az acr agentpool show -r "$ACR" -n "$POOL" --query count -o tsv | tr -d '\r')
          [ "${CNT:-0}" -ge 1 ] || az acr agentpool update -r "$ACR" -n "$POOL" --count 1 -o none

          # #2706 — QUEUE DEPTH IS THE SIGNAL, and on the wedged pool it was
          # printed and DISCARDED. Measured on the Gov registry:
          #   loombuild  (wedged queue)  queued=3 / queued=4  -> ~60min, exit 0, NO image
          #   loombuild2 (healthy)       queued=0  x8 runs    -> 17-23min, image pushed
          # This run already holds the ACR firewall lease — a real mutex that
          # every `az acr build` call site on this registry takes — so a queue
          # that will not drain is a STUCK queue, not contention. An unreadable
          # probe is UNKNOWN, never "clear".
          read_queue() {
            az acr agentpool show -r "$ACR" -n "$POOL" --queue-count -o tsv 2>/dev/null \
              | tr -d '\r' | grep -E '^[0-9]+$' | tail -1 || true
          }
          Q="$(read_queue)"
          if [ -n "$Q" ] && [ "$Q" != "0" ]; then
            echo "::warning::#2706 — $POOL reports $Q queued item(s); waiting up to 5min for it to drain."
            for i in $(seq 1 20); do
              sleep 15
              N="$(read_queue)"
              if [ -z "$N" ]; then
                echo "  queued: UNKNOWN (read failed) — NOT treating that as drained ($i/20)"
                continue
              fi
              Q="$N"
              echo "  queued: $Q ($i/20)"
              if [ "$Q" = "0" ]; then break; fi
            done
          fi
          if [ -z "$Q" ]; then
            echo "::warning::#2706 — could not read the queue depth for $POOL. UNKNOWN, not zero; if this build runs long and pushes nothing, the wedged-queue failure mode is the first thing to check."
          elif [ "$Q" != "0" ]; then
            echo "::error::#2706 — the '$POOL' queue on $ACR still holds $Q item(s) after 5 minutes, and this run holds the ACR firewall lease so nothing legitimate is building. That is the signature of the queue stuck in 'being deleted' that made az acr build exit 0 after ~60min having pushed NO image. Do NOT retry on this pool and do NOT recreate it (that returned 409 in run 30565655935) — re-dispatch with agent_pool_name set to a FRESH name, e.g. loombuild3."
            exit 1
          else
            echo "::notice::  queued: 0 — the $POOL queue is clear"
          fi
          STAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # #2929 — stage the Copilot RAG corpus INTO the build context before
          # the build. docs/ + PRPs/ live at repo root, outside apps/fiab-console,
          # so without this the image's copilot-corpus/ is just .gitkeep and
          # POST /api/help-copilot/reindex 502s with "No corpus chunks discovered"
          # while the quality evals measure a stale index.
          # Enforced by scripts/ci/check-console-corpus-staged.mjs.
          bash scripts/csa-loom/stage-copilot-corpus.sh
          # #2706 — logs STREAM (the `--no-logs` opt-out is gone). A silent build
          # is exactly the shape this repo got burned by: with --no-logs a stalled
          # build and a slow build are indistinguishable, which is how the wedged
          # pool consumed 4h25m before anyone could learn anything. This lane runs
          # on the pool, so it is precisely the one where a stall is invisible.
          az acr build --registry "$ACR" --agent-pool "$POOL" \
            --image "loom-console:$SHA" --image "loom-console:latest" \
            --file apps/fiab-console/Dockerfile \
            --build-arg "LOOM_BUILD_SHA=$SHA" --build-arg "LOOM_BUILD_TIMESTAMP=$STAMP" \
            apps/fiab-console
          # #2706 — VERIFY THE TAG EXISTS HERE. `az acr build` exiting 0 is NOT
          # proof a tag landed: on the wedged pool it exited 0 having pushed
          # nothing, and the failure only surfaced a step later as a confusing
          # supply-chain error. Green deploys the image it just "built", so a
          # silent no-op here would roll a revision at an image that does not exist.
          # #3117 (deploy-integrity R7). This was:
          #   if ! az acr repository show … -o none 2>/dev/null; then
          #     echo '::error::… does NOT exist … the build silently produced nothing'
          # Any non-zero exit — auth, throttle, firewall, DNS — became 'does NOT
          # exist', and `2>/dev/null` destroyed the evidence that would have
          # classified it. On this step in particular the false diagnosis is
          # expensive: it blames a wedged ACR agent pool and tells the operator to
          # re-dispatch with a FRESH pool name, which is a long, disruptive
          # remediation for a problem that is usually the firewall.
          #
          # resolve-acr-digest.sh keeps the three states apart and is self-tested:
          #   0 = digest on stdout   3 = registry ANSWERED absent   4 = could not READ
          set +e
          DIGEST=$(bash "$GITHUB_WORKSPACE/scripts/ci/resolve-acr-digest.sh" \
                     --acr "$ACR" --image "loom-console:$SHA")
          RC=$?
          set -e
          if [ $RC -eq 3 ]; then
            echo "::error::az acr build exited 0 but the registry ANSWERED NOT FOUND for loom-console:$SHA on $ACR — the build silently produced nothing (#2706). Re-dispatch with agent_pool_name set to a FRESH name, e.g. loombuild3."
            exit 1
          fi
          if [ $RC -ne 0 ]; then
            echo "::error::could NOT READ $ACR to confirm loom-console:$SHA (see the resolver output above). This is NOT proof the tag is missing and it is NOT evidence of a wedged agent pool — the registry never answered. Most likely the ACR firewall is closed to this runner or a firewall change has not propagated. Refusing to roll an unverified image."
            exit 1
          fi
          echo "::notice::loom-console:$SHA verified present on $ACR -> $DIGEST"
          q=$(az acr agentpool show -r "$ACR" -n "$POOL" --queue-count -o tsv 2>/dev/null | tr -d '\r' || echo 1)
          [ "${q:-1}" = "0" ] && az acr agentpool update -r "$ACR" -n "$POOL" --count 0 --no-wait -o none || true
          # Re-locks only if this run still holds the lease; re-locks
          # unconditionally when nobody does (fail closed).
          bash scripts/csa-loom/acr-firewall-lease.sh release --acr "$ACR"

      # Safety net: if the build step above dies before its inline release (a
      # failed `az acr build`, a cancelled run), the registry would otherwise be
      # left publicly reachable until the scheduled sweeper notices. `release`
      # is idempotent, so running it again here is free.
      - name: Release the ACR firewall lease (always)
        if: always()
        # C24 (#3088): NO `|| true`. This is the SAFETY-NET release — it runs
        # exactly when the build died before its inline release, which is the
        # single likeliest way a registry is left publicly reachable. Discarding
        # its verdict made this the last surviving instance of the C24 defect: a
        # green re-lock step over a possibly-open registry. The `|| true` sat on
        # the CONTINUATION line, so the per-line guard in
        # scripts/ci/__tests__/acr-firewall-lease-close.test.mjs could not see
        # it; that guard now joins continuations (and scans scripts/ too).
        run: |
          bash scripts/csa-loom/acr-firewall-lease.sh release \
            --acr "${{ steps.resolve.outputs.acr }}"

      # ── Deploy green as a NEW revision at 0% traffic ──────────────────────────
      - name: Deploy green revision (0% traffic)
        id: green
        run: |
          set -euo pipefail
          RG="${{ steps.resolve.outputs.rg }}"
          IMG="${{ steps.resolve.outputs.login }}/loom-console:${{ steps.build.outputs.sha }}"
          # A revision suffix must be DNS-safe + unique; the SHA plus the run number
          # keeps re-rolls of the same SHA from colliding with an existing revision.
          SUFFIX="g${{ steps.build.outputs.sha }}-${{ github.run_number }}"
          echo "::notice::Deploying green image=$IMG suffix=$SUFFIX"
          # In multiple-revision mode a new revision is created with 0% traffic —
          # existing weights are preserved, so production stays on blue.
          az containerapp update -n "$APP" -g "$RG" --image "$IMG" --revision-suffix "$SUFFIX" -o none
          GREEN=$(az containerapp revision list -n "$APP" -g "$RG" \
            --query "[?ends_with(name, '$SUFFIX')].name | [0]" -o tsv | tr -d '\r')
          if [[ -z "$GREEN" || "$GREEN" == "None" ]]; then echo "::error::Could not resolve the green revision."; exit 1; fi
          echo "green=$GREEN" >> "$GITHUB_OUTPUT"
          echo "::notice::GREEN = $GREEN"

      # ── Health-gate green: healthState Healthy + /api/version reports new SHA ──
      #
      # THE GATE'S DIRECTION IS UNCHANGED, deliberately (#3411). Every path here
      # that is not a PROVEN-Healthy green sets `gate=fail`, and the traffic
      # shift below is `if: steps.gate.outputs.gate == 'pass'`, so unknown health
      # never takes traffic and blue keeps 100%. What changes is only WHICH
      # SENTENCE the operator reads at 3am.
      #
      # R7 (deploy-integrity.md) — nothing below asserts a cause it did not
      # establish. The pre-#3411 shape read every value as
      #     H=$(az … -o tsv 2>/dev/null | tr -d '\r' || true)
      # and then branched on `-z "$H"`, so an auth failure, an ARM throttle, a
      # transient 5xx and a wrong revision name all arrived as the SAME empty
      # string — and the summary rendered that empty string as "green never
      # reached Healthy", a claim about the REVISION when the truth may have
      # been about the RUNNER'S ABILITY TO READ IT. Identical class to the roll
      # that reported "the tag does not exist" when it meant "I could not reach
      # the registry", the incident deploy-integrity.md R7 is written from.
      #
      # So each read now branches on `az`'s EXIT STATUS, keeps its stderr, and
      # resolves to one of three named classes — and per #2819 a read that
      # SUCCEEDED and returned EMPTY is its own class, never folded into "no".
      - name: Health-gate green revision
        id: gate
        run: |
          # `-e` is deliberately absent (as in `Ensure multiple-revision mode`
          # above): every failable command below is explicitly guarded by `if`,
          # and the step must reach its own classification rather than abort out
          # of the middle of a poll loop.
          set -uo pipefail
          RG="${{ steps.resolve.outputs.rg }}"
          GREEN="${{ steps.green.outputs.green }}"
          SHA="${{ steps.build.outputs.sha }}"
          ERR="$(mktemp)"
          BODYF="$(mktemp)"

          # az writes multi-line errors, and a newline inside a `::error::` ends
          # the annotation — everything after it is dropped from the thing the
          # operator actually reads. Truncate first, then flatten.
          err_detail() { head -c 400 "$ERR" | tr '\n' ' '; }

          # Echoes one ARM property of the green revision. Returns non-zero ONLY
          # when the READ itself failed; an empty answer is a successful read of
          # an empty value, and the callers below treat it as its own case.
          rev_field() {
            az containerapp revision show -n "$APP" -g "$RG" --revision "$GREEN" \
              --query "$1" -o tsv 2>"$ERR" | tr -d '\r'
          }

          # ── green's own FQDN: three outcomes, three sentences ────────────────
          # The old code had one outcome ("") and no sentence at all — an
          # unreadable FQDN silently skipped the /api/version probe below without
          # ever saying the probe had been skipped, let alone why.
          if FQDN="$(rev_field properties.fqdn)"; then
            if [ -z "${FQDN//[[:space:]]/}" ]; then
              FQDN=''
              NO_PROBE_REASON="the read of properties.fqdn SUCCEEDED and came back EMPTY — ACA published no FQDN for revision $GREEN"
              echo "::warning::No FQDN for green ($GREEN): $NO_PROBE_REASON."
            else
              NO_PROBE_REASON=''
              echo "::notice::green FQDN=$FQDN"
            fi
          else
            FQDN=''
            NO_PROBE_REASON="properties.fqdn could NOT BE READ, so this step will not claim the revision has no FQDN. Detail: $(err_detail)"
            echo "::warning::Could not read green's FQDN: $NO_PROBE_REASON"
          fi

          # ── healthState poll ────────────────────────────────────────────────
          # Counted, not sticky: the classification after the loop has to tell
          # "every read FAILED" from "reads SUCCEEDED and returned empty" from
          # "ACA reported a real, non-Healthy state". A transient read failure is
          # retried rather than fatal — this is already a retry loop, and the
          # time budget is unchanged from the pre-#3411 behaviour.
          HEALTHY=0
          READS_OK=0
          READS_FAIL=0
          OBSERVED=''   # last NON-EMPTY healthState ACA actually reported
          LAST_ERR=''   # detail from the most recent FAILED read
          POLLS=0
          for i in $(seq 1 "$HEALTH_RETRIES"); do
            POLLS="$i"
            if H="$(rev_field properties.healthState)"; then
              READS_OK=$((READS_OK + 1))
              if [ -n "${H//[[:space:]]/}" ]; then
                OBSERVED="$H"
                HTXT="$H"
              else
                HTXT='<read OK, value EMPTY — ACA published no healthState>'
              fi
            else
              READS_FAIL=$((READS_FAIL + 1))
              LAST_ERR="$(err_detail)"
              H=''
              HTXT="<UNREADABLE — $LAST_ERR>"
            fi
            if RUN="$(rev_field properties.runningState)"; then
              RUNTXT="${RUN:-<read OK, value EMPTY>}"
            else
              RUNTXT='<UNREADABLE>'
            fi
            echo "$(date -u +%H:%M:%S) poll $i/$HEALTH_RETRIES green healthState=$HTXT runningState=$RUNTXT"
            if [ "$H" = 'Unhealthy' ]; then echo "::warning::ACA reported green as Unhealthy."; break; fi
            if [ "$H" = 'Healthy' ]; then HEALTHY=1; break; fi
            sleep 30
          done

          if [ "$HEALTHY" != '1' ]; then
            echo "gate=fail" >> "$GITHUB_OUTPUT"
            FAILNOTE=''
            if [ "$READS_FAIL" -gt 0 ]; then
              FAILNOTE=" ($READS_FAIL of $POLLS poll(s) could not be read at all; last read failure: $LAST_ERR)"
            fi
            if [ "$READS_OK" -eq 0 ]; then
              echo "::error::UNKNOWN whether green ($GREEN) is healthy — could not read green's healthState. ALL $READS_FAIL attempt(s) to read it FAILED, so nothing here establishes anything about the revision. Failing the gate, because unknown health must not take traffic; blue keeps 100%. Do NOT read this as 'the revision is unhealthy' — that is the claim this message used to make wrongly (#3411). Detail: $LAST_ERR"
            elif [ -z "$OBSERVED" ]; then
              echo "::error::UNKNOWN whether green ($GREEN) is healthy — $READS_OK read(s) of properties.healthState SUCCEEDED and every one came back EMPTY, i.e. ACA published no healthState for that revision name. That is a different fact from an unhealthy revision (#2819): the shapes that produce it are a revision name resolved wrongly upstream, or a revision ACA has not begun reporting on. Failing the gate; blue keeps 100%.$FAILNOTE"
            else
              echo "::error::green ($GREEN) never reached Healthy — the last healthState ACA reported was '$OBSERVED' after $POLLS poll(s) at 30s. This one IS a statement about the revision: the read SUCCEEDED and that is what it said.$FAILNOTE"
            fi
            exit 0
          fi

          # ── Secondary gate: does green's OWN FQDN serve the NEW build SHA? ──
          # Proves the IMAGE, not merely liveness. DIRECTION UNCHANGED:
          #   serves the wanted SHA  -> probe passes
          #   serves a DIFFERENT SHA -> hard fail (gate=fail), as before
          #   anything else          -> the gate rests on healthState, as before
          # What changes is the last sentence. The old line asserted ONE cause —
          # "not directly reachable (likely internal ingress)" — for an empty
          # $BODY that `curl -fsS … 2>/dev/null || true` produced from ANY of: a
          # 401, a 403, a 404, a 500, a 302 to a sign-in page, a DNS failure, a
          # TLS failure or a timeout. Reading `%{http_code}` and curl's exit code
          # tells those apart, so a green that is up and answering 500 can never
          # again be logged as unreachable. `-f` is gone for the same reason: a
          # probe whose PURPOSE is to observe the status must treat 4xx/5xx as
          # answers, not as errors (scripts/ci/check-curl-httpcode-fallback.mjs).
          if [ -n "$FQDN" ]; then
            PROBE_OK=0
            PROBE_CLASS='unknown-probe-no-attempt-completed'
            PROBE_DETAIL='no attempt completed'
            for i in $(seq 1 10); do
              CODE="$(curl -sS -o "$BODYF" -w '%{http_code}' --max-time 10 "https://$FQDN/api/version" 2>"$ERR")"
              RC=$?
              [ -n "$CODE" ] || CODE='000'
              if [ "$RC" -ne 0 ] || [ "$CODE" = '000' ]; then
                PROBE_CLASS='unknown-probe-no-http-response'
                PROBE_DETAIL="curl exit $RC, http_code $CODE — $(err_detail)"
              elif [ "$CODE" != '200' ]; then
                PROBE_CLASS="unknown-probe-http-$CODE"
                PROBE_DETAIL="green ANSWERED with HTTP $CODE, so it is reachable — this is a status, not an unreachability"
              elif ! SERVED="$(python3 -c 'import sys,json; print((json.load(sys.stdin).get("build") or {}).get("sha",""))' <"$BODYF" 2>"$ERR")"; then
                PROBE_CLASS='unknown-probe-body-unparseable'
                PROBE_DETAIL="HTTP 200, but the body did not parse as JSON — $(err_detail)"
              elif [ -z "${SERVED//[[:space:]]/}" ]; then
                PROBE_CLASS='unknown-probe-no-sha-field'
                PROBE_DETAIL='HTTP 200 and valid JSON, but build.sha was absent or empty'
              elif [ "$SERVED" = "$SHA" ]; then
                PROBE_OK=1
                echo "probe $i/10: green /api/version build.sha=$SERVED — matches the rolled SHA."
                break
              else
                echo "gate=fail" >> "$GITHUB_OUTPUT"
                echo "::error::green ($GREEN) is reachable and serving, but /api/version reports build.sha '$SERVED' when this roll deployed '$SHA' — the revision is running the WRONG IMAGE. Established, not inferred: HTTP 200, body parsed as JSON, sha field present. Traffic stays on blue."
                exit 0
              fi
              echo "probe $i/10: $PROBE_CLASS — $PROBE_DETAIL"
              sleep 15
            done
            if [ "$PROBE_OK" != '1' ]; then
              # The candidate list is chosen by the class. Offering "ingress is
              # internal" after green ANSWERED would be the same defect in a
              # softer voice: a cause floated for an observation that rules it
              # out. Candidates are offered only where they are still live, and
              # are labelled as candidates either way.
              case "$PROBE_CLASS" in
                unknown-probe-no-http-response|unknown-probe-no-attempt-completed)
                  CANDIDATES="No HTTP response ever came back, so the transport is what failed. Candidates, NONE of them established here: ingress is internal, so the runner cannot reach a revision FQDN at all; the revision FQDN has not propagated in DNS yet; egress from the runner is blocked; TLS was rejected. curl's exit code above is what tells them apart (6=DNS, 7=connect, 28=timeout, 35/60=TLS)." ;;
                *)
                  CANDIDATES="green DID answer, so it is reachable and 'internal ingress' is NOT the explanation. What remains open is WHAT answered: the app itself erroring, an auth or redirect layer in front of the route, or a route that exists but does not report build.sha." ;;
              esac
              echo "::warning::The /api/version probe never confirmed the rolled SHA on green's own FQDN, so this gate rests on healthState ALONE. Observed on the last attempt: class=$PROBE_CLASS; $PROBE_DETAIL. $CANDIDATES"
            fi
          else
            echo "::warning::The /api/version probe was NOT attempted, so this gate rests on healthState ALONE — $NO_PROBE_REASON"
          fi
          echo "gate=pass" >> "$GITHUB_OUTPUT"
          echo "::notice::green PASSED the health gate"

      # ── Switch traffic blue=0 green=100 (only when the gate passed) ───────────
      - name: Shift traffic to green
        if: ${{ steps.gate.outputs.gate == 'pass' }}
        run: |
          set -euo pipefail
          RG="${{ steps.resolve.outputs.rg }}"
          GREEN="${{ steps.green.outputs.green }}"
          BLUE="${{ steps.blue.outputs.blue }}"
          if [[ -n "$BLUE" && "$BLUE" != "$GREEN" && "$BLUE" != "None" ]]; then
            az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$BLUE=0" "$GREEN=100" -o none
          else
            az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$GREEN=100" -o none
          fi
          echo "::notice::BR-BLUEGREEN ${{ steps.build.outputs.sha }} LIVE — 100% traffic on $GREEN; $BLUE retained at 0% for instant rollback."

      # ── Refresh the Copilot index against the image we just put live ─────────
      # #2929. The image carries a NEWLY STAGED corpus (the build step above runs
      # stage-copilot-corpus.sh), so the `loom-docs` AI Search index is stale the
      # moment traffic shifts. Nothing used to refresh it on a roll: the only
      # trigger lived inside copilot-quality-evals.yml, which does not run on a
      # roll at all — so a rolled console served retrieval over whatever corpus
      # was indexed last, however many rolls ago.
      #
      # POST → poll GET for the DURABLE cross-replica freshness signal, verdict
      # from the unit-tested classifier, via the SAME shared driver every other
      # call site uses. FATAL is left at its default (true): a roll that leaves
      # the Copilot index unrefreshed is a roll that half-shipped, and saying so
      # is the entire point.
      #
      # COMMERCIAL ONLY, deliberately. `vars.LOOM_VERIFY_URL` and the
      # `LOOM_INTERNAL_TOKEN` secret both address the COMMERCIAL console; there
      # is no confirmed Gov equivalent of either, and pointing a Gov roll at the
      # Commercial vanity would reindex the wrong estate while a mismatched token
      # would red the roll on a 401. Gov refreshes via an explicit dispatch of
      # loom-docs-reindex.yml with `console_url` set — an honest scoping, not a
      # silent skip: the notice below fires on every Gov roll.
      - name: Reindex loom-docs on the new revision (Commercial)
        if: ${{ steps.gate.outputs.gate == 'pass' && inputs.cloud == 'commercial' }}
        env:
          CONSOLE_URL: ${{ vars.LOOM_VERIFY_URL || 'https://csa-loom.limitlessdata.ai' }}
          INTERNAL_TOKEN: ${{ secrets.LOOM_INTERNAL_TOKEN }}
          POLL_TIMEOUT_S: '900'
          POLL_INTERVAL_S: '15'
        run: bash scripts/ci/reindex-loom-docs.sh

      - name: loom-docs reindex not wired for Gov (notice)
        if: ${{ steps.gate.outputs.gate == 'pass' && inputs.cloud != 'commercial' }}
        run: |
          echo "::notice::Gov console rolled with a freshly staged Copilot corpus, but the loom-docs index was NOT refreshed here — LOOM_VERIFY_URL / LOOM_INTERNAL_TOKEN address the Commercial estate. Refresh it by dispatching loom-docs-reindex.yml with console_url set to the Gov console base URL (refs #2929)."

      # ── Auto-rollback: green failed the gate → deactivate it; blue never moved ─
      #
      # R7 (#3411) — this step used to announce "Deactivating green." in the
      # progressive tense and then run the deactivate as
      #     az containerapp revision deactivate … -o none 2>/dev/null || true
      # discarding whether it happened at all. A failed deactivate leaves green
      # ACTIVE at 0% traffic, silently, where it counts against the app's
      # revision cap — and the one reader who needed to know that was told the
      # opposite. Same for the belt-and-braces traffic re-pin below it.
      #
      # Nothing here asserts an action any more: each attempt is made, its exit
      # status captured, and its OUTCOME reported with a remediation on failure.
      - name: Auto-rollback (green failed the gate)
        if: ${{ steps.gate.outputs.gate != 'pass' }}
        run: |
          # `-e` is deliberately absent: BOTH remediation attempts below must be
          # made and reported even when the first one fails. The step still ends
          # in an unconditional `exit 1` — a failed gate is a failed roll.
          set -uo pipefail
          RG="${{ steps.resolve.outputs.rg }}"
          GREEN="${{ steps.green.outputs.green }}"
          BLUE="${{ steps.blue.outputs.blue }}"
          ERR="$(mktemp)"
          err_detail() { head -c 400 "$ERR" | tr '\n' ' '; }

          echo "::error::green ($GREEN) failed the health gate — traffic never left blue ($BLUE). Rolling back now; what follows is the OUTCOME of each rollback action, reported rather than assumed."

          if az containerapp revision deactivate -n "$APP" -g "$RG" --revision "$GREEN" -o none 2>"$ERR"; then
            echo "::notice::rollback 1/2 — green ($GREEN) DEACTIVATED."
          else
            echo "::error::rollback 1/2 FAILED — green ($GREEN) could NOT be deactivated, so it is still ACTIVE at 0% traffic and still counts against this app's revision cap. Deactivate it by hand: az containerapp revision deactivate -n $APP -g $RG --revision $GREEN . Detail: $(err_detail)"
          fi

          if [ -n "$BLUE" ] && [ "$BLUE" != 'None' ]; then
            if az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$BLUE=100" -o none 2>"$ERR"; then
              echo "::notice::rollback 2/2 — traffic re-pinned 100% to blue ($BLUE)."
            else
              echo "::error::rollback 2/2 FAILED — could not re-pin traffic to blue ($BLUE). This is belt-and-braces (the traffic-shift step never ran, so the weights should already be untouched), but they are now UNVERIFIED rather than confirmed. Check: az containerapp ingress traffic show -n $APP -g $RG . Detail: $(err_detail)"
            fi
          else
            echo "::warning::rollback 2/2 SKIPPED — no blue revision was recorded (blue='$BLUE'), so there is nothing to re-pin. The traffic weights are whatever ACA already had; this step is not claiming they are correct."
          fi
          exit 1
