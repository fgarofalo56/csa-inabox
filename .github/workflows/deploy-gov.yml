# Deploy Azure Government infrastructure
# Uses Bicep templates from deploy/bicep/gov/
name: Deploy Gov Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - gov-dev
          - gov-staging
          - gov-prod
          - gov-tribal-health
      deploy_dlz:
        description: 'Deploy Data Landing Zone'
        required: true
        default: true
        type: boolean
      deploy_streaming:
        description: 'Deploy Streaming Services'
        required: true
        default: true
        type: boolean
      deploy_ai:
        description: 'Deploy AI Services'
        required: true
        default: false
        type: boolean
      deploy_oss:
        description: 'Deploy OSS Alternatives (AKS)'
        required: true
        default: false
        type: boolean
      what_if:
        description: 'Run What-If only (no deployment)'
        required: false
        default: true
        type: boolean
      # Purview is a per-TENANT per-REGION singleton (cap 5), so "just deploy a
      # new one" is not a safe default in a sovereign tenant — it is what made
      # run 31917112453 fail (#3577). Left blank, the run DISCOVERS the accounts
      # the tenant already owns and binds one; the operator does not have to
      # know this input exists (auto-bind-by-default.md §5).
      purview_account:
        description: 'Purview: existing account to adopt. Blank = discover and adopt automatically. Use "NEW" to force a brand-new account.'
        required: false
        default: ''
        type: string
      purview_account_rg:
        description: 'Purview: resource group of the account named above. Only needed when it lives outside the subscriptions this identity can enumerate.'
        required: false
        default: ''
        type: string

permissions:
  # No id-token: write — this workflow authenticates with a service-principal
  # secret (see the login steps). It carried id-token: write while taking an
  # OIDC path that could never succeed, which made the over-permission look
  # load-bearing.
  contents: read

env:
  AZURE_GOV_ENVIRONMENT: AzureUSGovernment

jobs:
  validate:
    name: Validate Templates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Bicep Build
        run: |
          set -euo pipefail
          # Compile to a FILE, not stdout: the emitted ARM JSON is large and
          # piping it makes a compile failure harder to read. A non-zero exit
          # here is a genuine template defect and must stop the run.
          az bicep build --file deploy/bicep/gov/main.bicep --outfile "$RUNNER_TEMP/gov-main.json"

      # NOTE (FINISHLINE G3): the step that used to sit here was
      #   az bicep build --file … 2>&1 | grep -c "Error" && exit 1 || echo "No errors found"
      # which is a gate that measures almost nothing. `az bicep build` writes
      # the compiled template to a FILE by default, so the piped stream carried
      # only diagnostics; `grep -c` counts the literal string "Error", so any
      # WARNING whose text happens to contain that word would have failed the
      # run, while the step's real verdict was already decided by the compile
      # above. It also ran the whole compile a second time for no added signal.
      # The compile step above is the honest gate; this comment is left so the
      # removal is not mistaken for a dropped check.

  what-if:
    name: What-If Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: validate
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Service-principal secret, NOT OIDC. The Gov app registration
      # (csa-loom-gov-deploy) has no federated identity credentials configured,
      # so the OIDC path this step used to take failed 100% of the time with
      # AADSTS70025 — which is why this workflow has never once succeeded. Every
      # Gov lane that DOES produce receipts (gov-verify-facts, gov-console-roll,
      # gov-build-images, gov-workspace-identity, gov-selfaudit) authenticates
      # this way. Migrating the whole Gov fleet to OIDC is tracked separately and
      # requires the FICs to exist first.
      - name: Azure Gov Login
        uses: azure/login@d19a4f1b3c068b799dff7574ac265b0144f415fe # v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: ${{ env.AZURE_GOV_ENVIRONMENT }}

      - name: Determine parameters file
        id: params
        run: |
          # CSA-0057: gov-staging now has its own params file so it
          # cannot silently drift with gov-dev.
          case "${{ github.event.inputs.environment }}" in
            gov-dev)           echo "file=params.gov-dev.json" >> "$GITHUB_OUTPUT" ;;
            gov-staging)       echo "file=params.gov-staging.json" >> "$GITHUB_OUTPUT" ;;
            gov-prod)          echo "file=params.gov-prod.json" >> "$GITHUB_OUTPUT" ;;
            gov-tribal-health) echo "file=params.gov-tribal-health.json" >> "$GITHUB_OUTPUT" ;;
          esac

      # DISCOVER-AND-BIND before ARM is asked for anything (deploy-integrity R5,
      # #3577). Purview accounts are capped per TENANT per REGION at 5, so on a
      # sovereign tenant "create a new one" is usually refused at preflight —
      # which is exactly how run 31917112453 failed. This step enumerates what
      # the tenant already owns, prints each candidate with what Loom would
      # change about it, and emits the `adopt` plan main.bicep binds to. It
      # writes an EMPTY plan on a greenfield tenant, so that path is unchanged.
      - name: Discover Purview — adopt or create
        env:
          PARAMS_FILE: ${{ steps.params.outputs.file }}
          PURVIEW_ACCOUNT: ${{ github.event.inputs.purview_account }}
          PURVIEW_ACCOUNT_RG: ${{ github.event.inputs.purview_account_rg }}
        run: bash .github/scripts/gov-purview-adopt.sh

      - name: What-If
        run: |
          az deployment sub what-if \
            --location usgovvirginia \
            --template-file deploy/bicep/gov/main.bicep \
            --parameters deploy/bicep/gov/${{ steps.params.outputs.file }} \
            --parameters "$RUNNER_TEMP/adopt.json" \
            --parameters \
              deployDLZ=${{ github.event.inputs.deploy_dlz }} \
              deployStreaming=${{ github.event.inputs.deploy_streaming }} \
              deployAIServices=${{ github.event.inputs.deploy_ai }} \
              deployOSSAlternatives=${{ github.event.inputs.deploy_oss }}

  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: what-if
    if: github.event.inputs.what_if == 'false'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Service-principal secret, NOT OIDC. The Gov app registration
      # (csa-loom-gov-deploy) has no federated identity credentials configured,
      # so the OIDC path this step used to take failed 100% of the time with
      # AADSTS70025 — which is why this workflow has never once succeeded. Every
      # Gov lane that DOES produce receipts (gov-verify-facts, gov-console-roll,
      # gov-build-images, gov-workspace-identity, gov-selfaudit) authenticates
      # this way. Migrating the whole Gov fleet to OIDC is tracked separately and
      # requires the FICs to exist first.
      - name: Azure Gov Login
        uses: azure/login@d19a4f1b3c068b799dff7574ac265b0144f415fe # v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: ${{ env.AZURE_GOV_ENVIRONMENT }}

      - name: Determine parameters file
        id: params
        run: |
          # CSA-0057: gov-staging now has its own params file so it
          # cannot silently drift with gov-dev.
          case "${{ github.event.inputs.environment }}" in
            gov-dev)           echo "file=params.gov-dev.json" >> "$GITHUB_OUTPUT" ;;
            gov-staging)       echo "file=params.gov-staging.json" >> "$GITHUB_OUTPUT" ;;
            gov-prod)          echo "file=params.gov-prod.json" >> "$GITHUB_OUTPUT" ;;
            gov-tribal-health) echo "file=params.gov-tribal-health.json" >> "$GITHUB_OUTPUT" ;;
          esac

      # Re-run in this job rather than carried over from what-if: the two jobs
      # are separate runners with separate workspaces, and re-discovering is
      # also the correct behaviour — an account created or deleted between the
      # what-if and the deploy must change the plan, not be assumed away.
      - name: Discover Purview — adopt or create
        env:
          PARAMS_FILE: ${{ steps.params.outputs.file }}
          PURVIEW_ACCOUNT: ${{ github.event.inputs.purview_account }}
          PURVIEW_ACCOUNT_RG: ${{ github.event.inputs.purview_account_rg }}
        run: bash .github/scripts/gov-purview-adopt.sh

      - name: Deploy
        run: |
          # RETRY WITH CLASSIFICATION (#3017, deploy-integrity R6): the Gov
          # deploy previously ran bare — a throttle or replication lag failed
          # the run outright with an unclassified stack of az output. Same
          # harness as Commercial: bounded retry of transient classes only,
          # fail-closed, classified deploy-failure.json + ARM leaf drill-down.
          DEPLOY_NAME="gov-deploy-$(date +%Y%m%d-%H%M%S)"
          node scripts/ci/deploy-retry.mjs \
            --class-allow transient,eventual-consistency \
            --max-attempts 4 --backoff 45 --jitter 0.3 --wall-clock 100m \
            --step "az deployment sub create (deploy-gov ${{ github.event.inputs.environment }})" \
            --artifact "$GITHUB_WORKSPACE/deploy-failure.json" \
            --remediate \
            --arm-deployment "$DEPLOY_NAME" --arm-scope sub \
            -- az deployment sub create \
            --location usgovvirginia \
            --template-file deploy/bicep/gov/main.bicep \
            --parameters deploy/bicep/gov/${{ steps.params.outputs.file }} \
            --parameters "$RUNNER_TEMP/adopt.json" \
            --parameters \
              deployDLZ=${{ github.event.inputs.deploy_dlz }} \
              deployStreaming=${{ github.event.inputs.deploy_streaming }} \
              deployAIServices=${{ github.event.inputs.deploy_ai }} \
              deployOSSAlternatives=${{ github.event.inputs.deploy_oss }} \
            --name "$DEPLOY_NAME"

      # deploy-integrity R7 — an error must not assert a cause it did not
      # establish. Every probe below previously ended in
      # `2>/dev/null || echo "…may not exist yet"`, which collapsed three very
      # different outcomes — the RG genuinely absent, the SP denied read, and a
      # throttle/transport error — into one reassuring sentence, printed as
      # fact. That is the same defect class that sent two investigations down
      # the wrong path on 2026-08-05. These steps now capture stderr, classify
      # it, and say plainly when they do not know.
      - name: Verify Deployment
        env:
          RG: rg-csa-${{ github.event.inputs.environment }}-platform
        run: |
          set -euo pipefail
          echo "=== Deployed Resources ==="
          set +e
          OUT=$(az resource list --resource-group "$RG" --output table 2>&1)
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            echo "$OUT"
          elif printf '%s' "$OUT" | grep -qiE "could not be found|ResourceGroupNotFound"; then
            echo "::error::resource group '$RG' does not exist after a deploy that reported success. The deploy did not create what it claimed."
            exit 1
          else
            echo "::error::could NOT read resource group '$RG' — so its contents are UNVERIFIED, not empty. Azure said:"
            printf '%s\n' "$OUT"
            exit 1
          fi

      - name: Post FedRAMP Compliance Check
        env:
          RG: rg-csa-${{ github.event.inputs.environment }}-platform
        run: |
          set -euo pipefail
          echo "=== FedRAMP Compliance Verification ==="
          # Each probe reports one of three HONEST outcomes: the finding, a
          # named "nothing configured" (which is itself a compliance signal),
          # or "could not read" with the Azure error. None of them silently
          # degrade into a pass.
          FAILED=0
          probe() {
            local label="$1"; shift
            echo ""
            echo "--- $label"
            set +e
            local out; out=$("$@" 2>&1); local rc=$?
            set -e
            if [ $rc -ne 0 ]; then
              echo "::error::$label — probe FAILED, result is UNKNOWN (not compliant, not non-compliant). Azure said:"
              printf '%s\n' "$out"
              FAILED=1
              return
            fi
            if [ -z "$(printf '%s' "$out" | tr -d '[:space:]')" ]; then
              echo "::warning::$label — the query succeeded and returned NOTHING. Treat as not-configured, and confirm that is intended for this boundary."
              return
            fi
            printf '%s\n' "$out"
          }

          probe "Encryption at rest (storage accounts)" \
            az resource list --resource-group "$RG" \
              --query "[?type=='Microsoft.Storage/storageAccounts'].{name:name,encryption:properties.encryption.services.blob.enabled}" \
              --output table

          probe "Network isolation (private endpoints)" \
            az network private-endpoint list --resource-group "$RG" \
              --query "[].{name:name,status:privateLinkServiceConnections[0].privateLinkServiceConnectionState.status}" \
              --output table

          probe "Diagnostic settings" \
            az monitor diagnostic-settings list \
              --resource "/subscriptions/${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}/resourceGroups/$RG" \
              --query "[].{name:name,workspace:workspaceId}" --output table

          probe "Azure Policy compliance state" \
            az policy state summarize --resource-group "$RG" \
              --query "results.{compliant:resourceDetails[?complianceState=='Compliant'] | length(@), nonCompliant:resourceDetails[?complianceState=='NonCompliant'] | length(@)}" \
              --output table

          echo ""
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::FedRAMP compliance check did not complete — at least one probe could not be evaluated. This run proves nothing about the compliance posture."
            exit 1
          fi
          echo "FedRAMP compliance check complete — every probe returned a real answer."
