name: gov-verify-facts

# READ-ONLY Gov fact-finder. Answers the specific questions that block the
# "gates to zero, both clouds" pass and that CANNOT be answered from a
# developer workstation (there is no local Gov az context — the Gov estate is
# reachable only via the deploy SP in Actions).
#
# Every question below exists because the honest alternative was GUESSING a
# value, and wiring a gate to a resource that may not exist is exactly the
# vaporware pattern we reject. Nothing here mutates.
#
# Q1  Does the synthetic-monitor results container exist on the Gov lake?
#     (blocks LOOM_UAT_RESULTS_CONTAINER for #2641)
# Q2  Does ANY action group exist in the Gov sub?
#     (blocks LOOM_ALERT_ACTION_GROUP_ID)
# Q3  Is loom-unity really running with authorization disabled? (#2643)
# Q4  Which console image tag is live, and does it contain the merged
#     security fixes (#2683 adls destination, #2691 role allow-list)?
# Q5  Which of the still-blocked optional gates now have a backing resource?
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RG: rg-csa-loom-admin-usgovvirginia
  APP: loom-console

jobs:
  facts:
    name: Probe Gov facts (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Q4 correlates the live image tag (a git SHA) against the tree, so the
          # full history must be present — a depth-1 checkout makes every tag
          # "unknown" and would silently answer "cannot correlate".
          fetch-depth: 0

      - name: Azure login (Gov sub) — deploy SP
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment

      - name: Set Azure cloud to Gov
        run: az cloud set --name AzureUSGovernment

      - name: Q1 — synthetic-monitor results container
        run: |
          # GitHub's default shell is `bash -e`. `set -uo pipefail` does NOT clear
          # -e, so a failing command substitution aborts the step BEFORE the RC
          # check below can classify it — which is how the first run died at Q1
          # instead of reporting the 403 it was written to distinguish.
          set +e -uo pipefail
          ACCT=$(az containerapp show -n "$APP" -g "$RG" \
            --query "properties.template.containers[0].env[?name=='LOOM_ADLS_ACCOUNT'].value | [0]" -o tsv 2>/dev/null)
          echo "lake account: ${ACCT:-<unset>}"
          if [ -z "${ACCT:-}" ]; then echo "Q1: UNKNOWN — no LOOM_ADLS_ACCOUNT on the app"; exit 0; fi
          # Data-plane list with the SP identity. A 403 is a DIFFERENT answer from
          # "container absent" and must not be reported as absence.
          OUT=$(az storage fs list --account-name "$ACCT" --auth-mode login -o tsv --query "[].name" 2>&1)
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "Q1: INDETERMINATE — list failed (SP may lack Storage Blob Data Reader):"
            echo "$OUT" | head -3
          else
            echo "filesystems present:"; echo "$OUT" | tr '\t' '\n' | sed 's/^/  - /'
            if echo "$OUT" | tr '\t' '\n' | grep -qx 'uat-results'; then
              echo "Q1: PRESENT — uat-results exists"
            else
              echo "Q1: ABSENT — uat-results does NOT exist; #2641 must create it"
            fi
          fi
          # Informational probe: its OUTPUT is the deliverable, so a non-zero tail
          # (a closed pipe under pipefail, an az probe for an absent provider) must
          # not fail the step and suppress the remaining answers.
          exit 0

      - name: Q2 — action groups in the Gov sub
        run: |
          # GitHub's default shell is `bash -e`. `set -uo pipefail` does NOT clear
          # -e, so a failing command substitution aborts the step BEFORE the RC
          # check below can classify it — which is how the first run died at Q1
          # instead of reporting the 403 it was written to distinguish.
          set +e -uo pipefail
          echo "action groups (whole sub):"
          # NAME + RG only. The full ARM id embeds the SUBSCRIPTION ID, and this
          # repo is PUBLIC — Actions logs are world-readable. The first run of
          # this workflow printed `id` and published the Gov subscription id;
          # that is fixed here. Name + RG is all a caller needs, because
          # gov-apply-env resolves the id server-side from
          # `@action-group:<name>`.
          az monitor action-group list --query "[].{name:name,rg:resourceGroup}" -o tsv 2>&1 | sed 's/^/  /' | head -20
          N=$(az monitor action-group list --query "length(@)" -o tsv 2>/dev/null || echo "?")
          echo "Q2: count=$N  (0 => LOOM_ALERT_ACTION_GROUP_ID has no legitimate value yet)"
          # Informational probe: its OUTPUT is the deliverable, so a non-zero tail
          # (a closed pipe under pipefail, an az probe for an absent provider) must
          # not fail the step and suppress the remaining answers.
          exit 0

      - name: Q3 — loom-unity authorization posture
        run: |
          # GitHub's default shell is `bash -e`. `set -uo pipefail` does NOT clear
          # -e, so a failing command substitution aborts the step BEFORE the RC
          # check below can classify it — which is how the first run died at Q1
          # instead of reporting the 403 it was written to distinguish.
          set +e -uo pipefail
          if ! az containerapp show -n loom-unity -g "$RG" -o none 2>/dev/null; then
            echo "Q3: loom-unity NOT DEPLOYED in $RG"; exit 0
          fi
          echo "--- ingress ---"
          az containerapp show -n loom-unity -g "$RG" \
            --query "{external:properties.configuration.ingress.external,fqdn:properties.configuration.ingress.fqdn,transport:properties.configuration.ingress.transport}" -o json
          echo "--- auth-relevant env (names + whether a value is set; secretRefs shown as <secretRef>) ---"
          az containerapp show -n loom-unity -g "$RG" \
            --query "properties.template.containers[0].env[?contains(name,'AUTH') || contains(name,'TOKEN') || contains(name,'ENTRA') || contains(name,'CLIENT') || contains(name,'TENANT') || contains(name,'JWT') || contains(name,'OIDC')].{name:name,hasValue:value!=null,secretRef:secretRef}" -o table
          echo "--- easyauth (platform auth) ---"
          az containerapp auth show -n loom-unity -g "$RG" -o json 2>&1 | head -30 || echo "(no easyauth config)"
          echo "Q3: read the three blocks above — an externally-reachable ingress with no auth env and no easyauth == unauthenticated."
          # Informational probe: its OUTPUT is the deliverable, so a non-zero tail
          # (a closed pipe under pipefail, an az probe for an absent provider) must
          # not fail the step and suppress the remaining answers.
          exit 0

      - name: Q4 — live console image + does it carry the security fixes
        run: |
          # GitHub's default shell is `bash -e`. `set -uo pipefail` does NOT clear
          # -e, so a failing command substitution aborts the step BEFORE the RC
          # check below can classify it — which is how the first run died at Q1
          # instead of reporting the 403 it was written to distinguish.
          set +e -uo pipefail
          IMG=$(az containerapp show -n "$APP" -g "$RG" \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null)
          echo "live image: ${IMG:-<none>}"
          TAG="${IMG##*:}"
          echo "tag (expected to be a git SHA): $TAG"
          if [ -n "${TAG:-}" ] && git cat-file -e "${TAG}^{commit}" 2>/dev/null; then
            echo "--- commit ---"; git log -1 --format='%h %ad %s' --date=short "$TAG"
            # The merged security fixes must be present in the tree the live
            # image was built from. Asserting on the FIX TEXT, not on a commit
            # being an ancestor, because a revert would keep the ancestry.
            check_fix() { # check_fix <file> <needle> <label>
              if git show "$TAG:$1" 2>/dev/null | grep -q "$2"; then
                echo "Q4: PRESENT — $3"
              else
                echo "Q4: MISSING — $3 (not in the live tree)"
              fi
            }
            check_fix apps/fiab-console/lib/azure/adls-client.ts \
              'Refusing to assign role' '#2691 role allow-list'
            check_fix apps/fiab-console/lib/azure/uc-host-allowlist.ts \
              'assertAllowedUcHost' '#2607 UC host allow-list'
          else
            echo "Q4: tag '$TAG' is not a commit in this checkout — cannot correlate. Fetch depth or a non-SHA tag."
          fi
          # Informational probe: its OUTPUT is the deliverable, so a non-zero tail
          # (a closed pipe under pipefail, an az probe for an absent provider) must
          # not fail the step and suppress the remaining answers.
          exit 0

      - name: Q5 — backing resources for the still-blocked optional gates
        run: |
          # GitHub's default shell is `bash -e`. `set -uo pipefail` does NOT clear
          # -e, so a failing command substitution aborts the step BEFORE the RC
          # check below can classify it — which is how the first run died at Q1
          # instead of reporting the 403 it was written to distinguish.
          set +e -uo pipefail
          probe() { # probe <label> <az-list-cmd...>
            local label="$1"; shift
            local out; out=$("$@" 2>&1)
            if [ $? -ne 0 ]; then echo "  $label: ERROR $(echo "$out" | head -1)"; return; fi
            local n; n=$(echo "$out" | grep -c . || true)
            if [ "$n" -eq 0 ] || [ -z "$out" ]; then echo "  $label: none"; else
              echo "  $label: $n"; echo "$out" | sed 's/^/      /' | head -5
            fi
          }
          echo "Gov backing-resource inventory:"
          probe "ai-search"      az search service list --query "[].name" -o tsv
          probe "postgres-flex"  az postgres flexible-server list --query "[].name" -o tsv
          probe "batch"          az batch account list --query "[].name" -o tsv
          probe "adf"            az datafactory list --query "[].name" -o tsv
          probe "redis"          az redis list --query "[].name" -o tsv
          probe "adx"            az kusto cluster list --query "[].name" -o tsv
          probe "eventhub-ns"    az eventhubs namespace list --query "[].name" -o tsv
          probe "maps"           az maps account list --query "[].name" -o tsv
          probe "cognitive"      az cognitiveservices account list --query "[].name" -o tsv
          echo "--- container apps in $RG ---"
          az containerapp list -g "$RG" --query "[].{n:name,ext:properties.configuration.ingress.external,img:properties.template.containers[0].image}" -o table 2>&1 | head -40
          # Informational probe: its OUTPUT is the deliverable, so a non-zero tail
          # (a closed pipe under pipefail, an az probe for an absent provider) must
          # not fail the step and suppress the remaining answers.
          exit 0
