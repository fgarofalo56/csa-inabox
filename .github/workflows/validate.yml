# ==============================================================================
# CSA-in-a-Box: Bicep Validation & Security Scanning
# Runs on PRs and pushes to main
# ==============================================================================

name: Validate & Scan

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**/*.bicep'
      - 'deploy/**/*.json'
      - '*.bicep'
      # #4466. The three entries above reach 'deploy/**' and the repo ROOT only.
      # Measured on this tree: `git ls-files '*.bicep'` -> 357 files, of which
      # 198 live under platform/fiab/bicep/ and matched NONE of them, and
      # `git ls-files '*.bicepparam'` -> 17 files, of which 7 are
      # platform/fiab/bicep/params/*.bicepparam and again matched none. So a
      # push to main touching only those paths never started this workflow at
      # all. Both globs are widened together deliberately: adding the
      # .bicepparam arm alone would have left the .bicep arm short by the same
      # 198 files, which is the one-side-of-a-symmetry shape this repo keeps
      # shipping. `pull_request:` below carries no `paths:`, so the PR path was
      # never affected — this only closes the push-to-main arm.
      - '**/*.bicep'
      - '**/*.bicepparam'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  # REQUIRED-CHECK DISPATCH (#3393). release-please's PR is authored by
  # GITHUB_TOKEN and GitHub suppresses the `pull_request` trigger on it, so the
  # four required contexts published here (Secret Scan, PowerShell Lint, Python
  # Lint, Repo Hygiene) never ran and were replaced by synthetic statuses.
  # `workflow_dispatch` is the documented exception GITHUB_TOKEN *may* trigger,
  # so release-please.yml dispatches this workflow against the release branch.
  # None of those four jobs read PR context, and none of them `needs:` the
  # `changes` job, so they behave identically under a dispatch.
  workflow_dispatch:
  # MERGE QUEUE. Secret Scan / PowerShell Lint / Python Lint / Repo Hygiene are
  # REQUIRED contexts, and a merge group is gated on the SAME required set as a
  # PR. A required context that never reports in a merge group does not fail the
  # group — it leaves it pending until the queue times out and ejects the PR, so
  # a missing trigger here would stall every merge in the repo.
  #
  # DELIBERATELY BARE — no `branches:`, no `paths:`. The `paths:` list above
  # belongs to `push:` only; inheriting a path filter here would reintroduce the
  # same stall by another route (a merge group touching no matching path would
  # never produce the context). All four jobs are event-agnostic: none has a
  # job-level `if:`, none reads `github.event.pull_request.*`, and none `needs:`
  # the path-filtered `changes` job. They behave identically here.
  merge_group:

concurrency:
  # #3426 — per-SHA on push/dispatch. This lane publishes FOUR required
  # contexts (PowerShell Lint, Python Lint, Repo Hygiene, Secret Scan), and with
  # a ref-keyed group + cancel-in-progress:true every merge cancelled the
  # previous commit's run: 4 of the last 30 main runs cancelled (2026-08-14).
  # A cancelled required check is an ABSENCE, not a pass. See
  # scripts/ci/check-required-lane-concurrency.mjs, which now enforces this.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  # -------------------------------------------------------------------------
  # Bicep Linting & Validation
  #
  # The lint + build steps walk every .bicep file and take ~10 min.
  # That tax doesn't need to land on every PR — only the ones that
  # actually touch IaC. The ``changes`` job below detects that and
  # gates the heavy ``bicep-lint`` job. Other jobs in this workflow
  # (Secret Scan, Repo Hygiene, Python Lint, etc.) still run on every
  # PR because they're fast enough and Secret Scan is a required check.
  # -------------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      bicep: ${{ steps.filter.outputs.bicep }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            bicep:
              - '**/*.bicep'
              - 'deploy/**/*.json'
              - '.github/workflows/validate.yml'

  bicep-lint:
    name: Bicep Lint
    needs: changes
    if: needs.changes.outputs.bicep == 'true'
    runs-on: ubuntu-latest
    # This job HIT its 30-minute ceiling and was killed on PR #2641 — a
    # bicep-heavy PR, i.e. exactly the PR it exists to guard. A timed-out gate
    # reports `failure` without having checked anything, and because the job is
    # path-filtered it shows `skipped` (green) on main, so the ceiling was
    # invisible until a bicep PR needed it. Same shape as the hollow gates in
    # #2585 / #2656: a check that looks like it works because it never runs.
    #
    # Two measured causes, both fixed below:
    #   1. It ran `bicep lint` over every file AND then `bicep build` over every
    #      file. Those two passes are BEHAVIOURALLY IDENTICAL on exit code —
    #      verified against bicep 0.45.15:
    #        broken (BCP057)  -> lint exit 1, build exit 1
    #        warning-only     -> lint exit 0, build exit 0   (SAME warning text)
    #        clean            -> lint exit 0, build exit 0
    #      `bicep build` runs the linter and emits the identical diagnostics, so
    #      the lint pass bought zero signal for half the job's wall-clock.
    #   2. Both passes were serial — 263 in-scope files x 2 = 526 sequential CLI
    #      invocations, each a cold .NET start. The big orchestrators are not
    #      cheap: `platform/fiab/bicep/main.bicep` alone measures ~14s.
    #
    # So: one pass instead of two, run in parallel. Keeps FULL coverage (every
    # in-scope file is still compiled) rather than the "scope to changed files"
    # shortcut the old comment proposed — narrowing to changed files is what
    # lets cross-module drift like #2540/#2541 through, since editing a module
    # breaks its CONSUMERS, which are by definition unchanged files.
    #
    # 20 min, not 30: the new shape should land well inside it, so a timeout
    # again becomes real news rather than the steady state.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/

      - name: Build every Bicep file (compile + lint in one pass)
        run: |
          set -uo pipefail
          # `git ls-files` rather than `find`: tracked files only, so it cannot
          # wander into node_modules, and it is deterministic. The exclusion
          # list is unchanged from the previous `find -not -path` chain:
          #   landing-zone-alz/    ALZ accelerator, vendored + lint-incompatible
          #   gov/main.bicep       policy defs using dynamic expressions
          #   alerts/              threshold expressions -> false positives
          #   example-vertical/    cookiecutter {{ }} Jinja, not valid until rendered
          #
          # SCOPE, MEASURED (#4466): this pathspec matches 357 files and ZERO
          # `.bicepparam` — `git ls-files '*.bicep' | grep -c bicepparam` -> 0.
          # Param files are NOT in this population and are not meant to be; they
          # need `bicep build-params`, not `bicep build`. The `bicep-params` job
          # below is the guard that covers them, and
          # scripts/ci/check-bicepparam-compiled.mjs enforces that it keeps
          # doing so.
          git ls-files '*.bicep' \
            | grep -vE '^codeqlDB/|/node_modules/|landing-zone-alz/|gov/main\.bicep$|/alerts/|templates/example-vertical/' \
            > /tmp/bicep-files.txt
          COUNT=$(wc -l < /tmp/bicep-files.txt)
          echo "=== Compiling $COUNT Bicep files across $(nproc) workers ==="

          # EXPORTED, not a plain shell var: the `sh -c` workers below are
          # separate processes spawned by xargs and inherit only the
          # environment. A non-exported FAIL_DIR would arrive empty there and
          # every `touch` would target /<name> instead — failures would be
          # recorded nowhere and the gate would report success on a broken tree.
          export FAIL_DIR
          FAIL_DIR=$(mktemp -d)

          # -d '\n' so paths containing spaces stay intact; `sh -c ... _` passes
          # the filename as $1 rather than interpolating it into the script.
          # --stdout >/dev/null: the old form wrote a sibling .json for all 263
          # files, littering the checkout mid-run. We want the diagnostics on
          # stderr, never the ARM output.
          xargs -d '\n' -P "$(nproc)" -n1 sh -c '
            f="$1"
            if ! out=$(bicep build "$f" --no-restore --stdout 2>&1 >/dev/null); then
              printf "%s\n" "$out"
              printf "::error file=%s::bicep build failed\n" "$f"
              touch "$FAIL_DIR/$(printf "%s" "$f" | tr "/" "_")"
            fi
          ' _ < /tmp/bicep-files.txt

          FAILED=$(find "$FAIL_DIR" -type f | wc -l)
          rm -rf "$FAIL_DIR"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED Bicep file(s) failed to compile"
            exit 1
          fi
          echo "All $COUNT Bicep files compiled clean."

  # -------------------------------------------------------------------------
  # Bicep PARAM files (#4466)
  #
  # The job above compiles `*.bicep`. It does NOT compile `*.bicepparam`, and
  # neither did anything else: measured on 0348d3715e6, `az bicep build-params`
  # appeared in `.github/workflows/` at exactly three sites, ALL of them
  # comments (deploy-fiab-commercial.yml:1114,1172; loom-guardrails.yml:581) and
  # zero of them executable steps. The enumeration above is
  # `git ls-files '*.bicep'`, whose pathspec matches 357 files and ZERO
  # `.bicepparam` (verified: `git ls-files '*.bicep' | grep -c bicepparam` -> 0),
  # so the param files were outside the population that guard walks rather than
  # merely skipped by it. The only other build of a param file is
  # `bicep-whatif.yml:403`, which passes `commercial-full.bicepparam` to
  # `az deployment sub what-if` — one file out of seventeen, behind an Azure
  # login, on a lane that no-ops when credentials are absent.
  #
  # Net effect: a syntax error, a BCP259 undeclared assignment, a type mismatch
  # or a dangling `using` in gcc.bicepparam / gcc-high.bicepparam /
  # il5.bicepparam / dlz-attach.bicepparam / tenant-dmlz.bicepparam reached main
  # with nothing in CI having parsed it. il5.bicepparam is the worst case: it is
  # compiled by no gate AND executed by no deploy (deploy-fiab-il5.yml is
  # `active` with zero recorded runs), so an IL5 first-ever deploy would have
  # been the first time anything parsed it — against deploy-integrity.md R4.
  #
  # NO PATHS FILTER, DELIBERATELY. #4466 asks for a filter that includes
  # '**/*.bicepparam' so a param-only PR cannot skip the step. This job goes
  # further: it carries no `needs: changes` and no `if:`, so NO PR can skip it,
  # and a `skipped` (green-looking) result is unreachable. That costs ~1 minute
  # and removes the hollow-check shape entirely. `check-bicepparam-compiled.mjs`
  # enforces that it stays unconditional.
  #
  # POPULATION: every tracked `*.bicepparam`, repo-wide — 17 files, not just the
  # 7 under platform/fiab/bicep/params/. All 17 compile clean today (measured
  # with `az bicep build-params` CLI 0.45.15 before this job was written), so
  # there is no exclusion list and none is needed. Adding one would be a
  # weakening: `check-bicepparam-compiled.mjs` fails if a `grep -v` here drops
  # any tracked param file.
  # -------------------------------------------------------------------------
  bicep-params:
    name: Bicep Params Compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/
          bicep --version

      # NEGATIVE CONTROL, RUN FIRST (#4466 "done" #4; assertion-design.md §2).
      # A gate nobody has seen fail is not known to watch anything, so this
      # proves the kill power of the compile below IN THE ENVIRONMENT WHERE IT
      # RUNS — this CLI build, this runner — before any verdict is reported
      # about the repo.
      #
      # It works on a SANDBOX COPY under $RUNNER_TEMP. The tracked tree is never
      # written to, and the final arm PROVES that (before/after `git status`)
      # rather than asserting it.
      #
      # POSITIVE ARM (assertion-design.md §4): the unmutated copy must compile
      # clean. Without it a RED from the mutated arm could equally mean "the
      # copy is broken" — e.g. a `cp` that lost ../main.bicep, which is exactly
      # what happens if you copy the params directory alone.
      #   -> goes red if `cp -r platform/fiab/bicep` stops producing a
      #      self-contained tree, or if il5.bicepparam itself stops compiling.
      #
      # NEGATIVE ARM: the SAME copy, plus one line assigning a parameter that
      # main.bicep does not declare, must exit NON-ZERO.
      #   -> goes red (i.e. this step fails) if `bicep build-params` exits 0 for
      #      a params file containing
      #      `param zzzGateNegativeControlUndeclaredParam = true`.
      #      Measured locally with az bicep 0.45.15: rc=1 (BCP259 class). Also
      #      measured rc=1 for a syntax error, a type mismatch and a dangling
      #      `using`; rc=0 for the pristine file DESPITE ~40 linter warnings, so
      #      this gate fires on errors only and warnings cannot red main.
      #
      # An undeclared-parameter assignment is chosen over a syntax error on
      # purpose: a syntax error would only prove the parser ran, while BCP259
      # can only be reached by TYPE-CHECKING the params file against the target
      # template — which is the property #4466 says nothing had ever
      # established.
      - name: Negative control — prove this gate can fail
        run: |
          set -uo pipefail
          SBX="$RUNNER_TEMP/bicepparam-negative-control"
          rm -rf "$SBX"
          mkdir -p "$SBX"
          # BEFORE state, so a tree that was already dirty for some unrelated
          # reason is not mis-attributed to this control (deploy-integrity.md R7
          # — do not assert a cause you have not established).
          BEFORE=$(git status --porcelain -- platform/fiab/bicep)
          cp -r platform/fiab/bicep "$SBX/bicep"
          TARGET="$SBX/bicep/params/il5.bicepparam"
          if [ ! -f "$TARGET" ]; then
            echo "::error::Negative-control sandbox has no params/il5.bicepparam — the copy did not produce the expected tree, so nothing below would be attributable. Check that platform/fiab/bicep/params/il5.bicepparam still exists."
            exit 1
          fi

          echo "--- positive arm: the unmutated sandbox copy must compile clean ---"
          if ! bicep build-params "$TARGET" --outfile "$SBX/pristine.json"; then
            echo "::error::Negative-control SANDBOX is broken: the UNMUTATED copy of il5.bicepparam failed to compile. A red from the mutated arm below would not be attributable to the mutation, so no verdict is reported."
            exit 1
          fi
          echo "pristine copy compiled clean (rc=0)."

          echo "--- negative arm: the same copy + one undeclared assignment must FAIL ---"
          printf '\nparam zzzGateNegativeControlUndeclaredParam = true\n' >> "$TARGET"
          # CAPTURE THE RC THROUGH AN `if`, NOT THROUGH `$?`.
          #
          # GitHub's default shell for a `run:` block is
          # `bash --noprofile --norc -e -o pipefail {0}` — errexit is ON before
          # this script's own `set -uo pipefail` ever runs, and `set -uo` does
          # not clear it. A bare `bicep build-params …` followed by `MUT_RC=$?`
          # therefore KILLED THE STEP the instant the mutation worked: the
          # control could only pass by failing to fail. Measured on run
          # 35173056079 — BCP259 fired exactly as designed and the job still
          # went red at that line. A command in an `if` condition is exempt from
          # errexit, so this shape is correct under `-e` and without it.
          if bicep build-params "$TARGET" --outfile "$SBX/mutated.json"; then
            MUT_RC=0
          else
            MUT_RC=$?
          fi
          echo "mutated copy exit code: $MUT_RC"
          if [ "$MUT_RC" -eq 0 ]; then
            echo "::error::NEGATIVE CONTROL FAILED — bicep build-params returned 0 for a params file assigning 'zzzGateNegativeControlUndeclaredParam', which platform/fiab/bicep/main.bicep does not declare. This gate cannot distinguish a broken param file from a good one, so its pass below would mean nothing. Do NOT weaken or delete this control to get green: fix the compile invocation (or pin a CLI version that type-checks params files)."
            exit 1
          fi

          echo "--- proving the tracked tree was never written to ---"
          AFTER=$(git status --porcelain -- platform/fiab/bicep)
          if [ "$AFTER" != "$BEFORE" ]; then
            echo "::error::The negative control modified the TRACKED tree, which it must never do (assertion-design.md: mutate a sandbox copy, never the tracked tree). git status under platform/fiab/bicep changed during this step. Before:"
            printf '%s\n' "$BEFORE"
            echo "After:"
            printf '%s\n' "$AFTER"
            exit 1
          fi
          rm -rf "$SBX"
          echo "Negative control OK: clean copy rc=0, mutated copy rc=$MUT_RC, tracked tree unchanged by this step."

      - name: Compile every tracked .bicepparam
        run: |
          set -uo pipefail
          # `git ls-files` for the same reasons the .bicep job gives: tracked
          # files only, deterministic, cannot wander into node_modules. NO
          # exclusion filter — every tracked param file compiles clean today and
          # check-bicepparam-compiled.mjs fails if one is ever excluded here.
          git ls-files '*.bicepparam' > /tmp/bicepparam-files.txt
          COUNT=$(wc -l < /tmp/bicepparam-files.txt)
          # FAIL CLOSED on an empty population. A renamed directory or a changed
          # extension would otherwise make this step exit 0 having compiled
          # nothing, which is the exact defect #4466 is about wearing a green
          # tick. Same fail-closed shape as check-postgres-quota-gate.mjs's
          # zero-corpus check.
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::git ls-files matched ZERO .bicepparam files — the corpus drifted. Nothing was compiled, so no verdict is reported."
            exit 1
          fi
          echo "=== Compiling $COUNT Bicep param files across $(nproc) workers ==="
          cat /tmp/bicepparam-files.txt

          # Exported for the same reason the .bicep job exports it: the `sh -c`
          # workers are separate processes and inherit only the environment.
          export FAIL_DIR OUT_DIR
          FAIL_DIR=$(mktemp -d)
          # --outfile, never --stdout: --stdout crashes on the Unicode these
          # param files carry. Output goes OUTSIDE the checkout so the run
          # cannot litter the tree with sibling .json artifacts.
          OUT_DIR=$(mktemp -d)

          # The `sh -c '…'` body is single-quoted ON PURPOSE: it must be
          # expanded by the WORKER, not by this shell, so that `$1` is the
          # filename xargs passes and `$OUT_DIR`/`$FAIL_DIR` are read from the
          # exported environment. SC2016 is exactly the observation "these do
          # not expand here", which is the intent — suppressed rather than
          # baselined, so `validate.yml` stays at its recorded 1 finding
          # (scripts/ci/workflow-actionlint-baseline.json) and the
          # workflow-actionlint ratchet keeps its teeth.
          # shellcheck disable=SC2016
          xargs -d '\n' -P "$(nproc)" -n1 sh -c '
            f="$1"
            flat=$(printf "%s" "$f" | tr "/" "_")
            if ! out=$(bicep build-params "$f" --outfile "$OUT_DIR/$flat.json" 2>&1); then
              printf "%s\n" "$out"
              printf "::error file=%s::bicep build-params failed\n" "$f"
              touch "$FAIL_DIR/$flat"
            fi
          ' _ < /tmp/bicepparam-files.txt

          FAILED=$(find "$FAIL_DIR" -type f | wc -l)
          rm -rf "$FAIL_DIR" "$OUT_DIR"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED Bicep param file(s) failed to compile"
            exit 1
          fi
          echo "All $COUNT Bicep param files compiled clean."

  # -------------------------------------------------------------------------
  # Secret Scanning
  # -------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact --no-banner

  # -------------------------------------------------------------------------
  # IaC Security Scanning
  # -------------------------------------------------------------------------
  security-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Run Checkov
        # Checkov runs in advisory mode (soft_fail: true) while the brownfield
        # backlog is worked down.  See ``.checkov.yaml`` at the repo root for
        # the explicit skip-list with one-line rationale per check ID; PR #103
        # closed 33 findings and PR #104 closed another ~50.  When the residual
        # parser-limitation findings clear we will flip soft_fail off.
        uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8 # v12
        with:
          directory: deploy/
          config_file: .checkov.yaml
          framework: bicep,arm
          soft_fail: true
          output_format: sarif
          output_file_path: results.sarif
          skip_path: deploy/bicep/landing-zone-alz

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # v3
        with:
          sarif_file: results.sarif
        continue-on-error: true  # Gracefully skip if code scanning is not enabled

  # -------------------------------------------------------------------------
  # PowerShell Linting
  # -------------------------------------------------------------------------
  powershell-lint:
    name: PowerShell Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter "*.ps1" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'node_modules|\.venv|dbt-env|codeqlDB' }
          $allResults = @()
          foreach ($file in $files) {
            Write-Host "Analyzing: $($file.FullName)"
            $results = Invoke-ScriptAnalyzer -Path $file.FullName -Severity Warning,Error
            if ($results) {
              $results | Format-Table -AutoSize
              $allResults += $results
            }
          }
          $errors = $allResults | Where-Object { $_.Severity -eq 'Error' }
          if ($errors) {
            Write-Host "::error::PSScriptAnalyzer found $($errors.Count) error(s)"
            exit 1
          }

  # -------------------------------------------------------------------------
  # Python Linting
  # -------------------------------------------------------------------------
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install ruff

      - name: Lint Python files
        # NOT `ruff check domains/ scripts/ csa_platform/ tools/`. That form asks
        # ruff to WALK those directories, and ruff respects .gitignore, whose
        # line 34 is `data/` - so it silently skipped the nine tracked
        # scripts/data/*.py files carrying 216 findings (10 of them F401).
        # Measured: adding --no-respect-gitignore to the old command flipped it
        # from RC=0 to RC=1 with exactly 216 errors.
        #
        # python_lint_scope.py passes ruff EXPLICIT tracked paths instead, and
        # asserts every run that ruff opened all of them. It is the SAME module
        # dev-loop/gates/validate-python.ps1 and test.yml run, so the three can
        # no longer grade different files. See #3811; debt ratchet in #3990.
        run: |
          python scripts/ci/python_lint_scope.py

  # -------------------------------------------------------------------------
  # Repository Hygiene Check
  # -------------------------------------------------------------------------
  hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Check for large files
        run: |
          # Notebook outputs are stripped via .gitattributes + nbstripout
          # so monitor notebooks no longer need a size exclusion.
          echo "=== Files larger than 5MB ==="
          FOUND_LARGE=0
          while read -r file; do
            SIZE=$(du -sh "$file" | cut -f1)
            echo "::warning::Large file: $file ($SIZE)"
            FOUND_LARGE=1
          done < <(find . -type f -size +5M -not -path "./.git/*")
          if [ "$FOUND_LARGE" -eq 1 ]; then
            echo "::error::Found files larger than 5MB"
            exit 1
          fi

      - name: Check for committed secrets patterns
        run: |
          echo "=== Checking for common secret patterns ==="
          PATTERNS="password|secret|api_key|apikey|access_key|private_key|client_secret"
          MATCHES=$(grep -rni "$PATTERNS" --include="*.json" --include="*.yaml" --include="*.yml" \
            --include="*.ps1" --include="*.py" \
            --exclude="*.bicep" \
            --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=codeqlDB \
            --exclude-dir=.git --exclude-dir=.github \
            . | grep -v "askForPassword" | grep -v "savePassword" \
            | grep -v ".gitignore" | grep -v "secretStorage" \
            | grep -v "# nosec" | grep -v "noqa" | head -20) || true
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::Found potential secret patterns in committed files"
            exit 1
          fi
          echo "No patterns found"

      - name: Check for committed venvs/node_modules
        run: |
          FAILED=0
          for dir in node_modules .venv venv dbt-env __pycache__; do
            FOUND=$(find . -type d -name "$dir" -not -path "./.git/*" 2>/dev/null)
            if [ -n "$FOUND" ]; then
              echo "::error::Found committed $dir directory: $FOUND"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
