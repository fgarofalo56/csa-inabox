# ==============================================================================
# CSA-in-a-Box: Bicep Validation & Security Scanning
# Runs on PRs and pushes to main
# ==============================================================================

name: Validate & Scan

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**/*.bicep'
      - 'deploy/**/*.json'
      - '*.bicep'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  # REQUIRED-CHECK DISPATCH (#3393). release-please's PR is authored by
  # GITHUB_TOKEN and GitHub suppresses the `pull_request` trigger on it, so the
  # four required contexts published here (Secret Scan, PowerShell Lint, Python
  # Lint, Repo Hygiene) never ran and were replaced by synthetic statuses.
  # `workflow_dispatch` is the documented exception GITHUB_TOKEN *may* trigger,
  # so release-please.yml dispatches this workflow against the release branch.
  # None of those four jobs read PR context, and none of them `needs:` the
  # `changes` job, so they behave identically under a dispatch.
  workflow_dispatch:

concurrency:
  # #3426 — per-SHA on push/dispatch. This lane publishes FOUR required
  # contexts (PowerShell Lint, Python Lint, Repo Hygiene, Secret Scan), and with
  # a ref-keyed group + cancel-in-progress:true every merge cancelled the
  # previous commit's run: 4 of the last 30 main runs cancelled (2026-08-14).
  # A cancelled required check is an ABSENCE, not a pass. See
  # scripts/ci/check-required-lane-concurrency.mjs, which now enforces this.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  # -------------------------------------------------------------------------
  # Bicep Linting & Validation
  #
  # The lint + build steps walk every .bicep file and take ~10 min.
  # That tax doesn't need to land on every PR — only the ones that
  # actually touch IaC. The ``changes`` job below detects that and
  # gates the heavy ``bicep-lint`` job. Other jobs in this workflow
  # (Secret Scan, Repo Hygiene, Python Lint, etc.) still run on every
  # PR because they're fast enough and Secret Scan is a required check.
  # -------------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      bicep: ${{ steps.filter.outputs.bicep }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            bicep:
              - '**/*.bicep'
              - 'deploy/**/*.json'
              - '.github/workflows/validate.yml'

  bicep-lint:
    name: Bicep Lint
    needs: changes
    if: needs.changes.outputs.bicep == 'true'
    runs-on: ubuntu-latest
    # This job HIT its 30-minute ceiling and was killed on PR #2641 — a
    # bicep-heavy PR, i.e. exactly the PR it exists to guard. A timed-out gate
    # reports `failure` without having checked anything, and because the job is
    # path-filtered it shows `skipped` (green) on main, so the ceiling was
    # invisible until a bicep PR needed it. Same shape as the hollow gates in
    # #2585 / #2656: a check that looks like it works because it never runs.
    #
    # Two measured causes, both fixed below:
    #   1. It ran `bicep lint` over every file AND then `bicep build` over every
    #      file. Those two passes are BEHAVIOURALLY IDENTICAL on exit code —
    #      verified against bicep 0.45.15:
    #        broken (BCP057)  -> lint exit 1, build exit 1
    #        warning-only     -> lint exit 0, build exit 0   (SAME warning text)
    #        clean            -> lint exit 0, build exit 0
    #      `bicep build` runs the linter and emits the identical diagnostics, so
    #      the lint pass bought zero signal for half the job's wall-clock.
    #   2. Both passes were serial — 263 in-scope files x 2 = 526 sequential CLI
    #      invocations, each a cold .NET start. The big orchestrators are not
    #      cheap: `platform/fiab/bicep/main.bicep` alone measures ~14s.
    #
    # So: one pass instead of two, run in parallel. Keeps FULL coverage (every
    # in-scope file is still compiled) rather than the "scope to changed files"
    # shortcut the old comment proposed — narrowing to changed files is what
    # lets cross-module drift like #2540/#2541 through, since editing a module
    # breaks its CONSUMERS, which are by definition unchanged files.
    #
    # 20 min, not 30: the new shape should land well inside it, so a timeout
    # again becomes real news rather than the steady state.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/

      - name: Build every Bicep file (compile + lint in one pass)
        run: |
          set -uo pipefail
          # `git ls-files` rather than `find`: tracked files only, so it cannot
          # wander into node_modules, and it is deterministic. The exclusion
          # list is unchanged from the previous `find -not -path` chain:
          #   landing-zone-alz/    ALZ accelerator, vendored + lint-incompatible
          #   gov/main.bicep       policy defs using dynamic expressions
          #   alerts/              threshold expressions -> false positives
          #   example-vertical/    cookiecutter {{ }} Jinja, not valid until rendered
          git ls-files '*.bicep' \
            | grep -vE '^codeqlDB/|/node_modules/|landing-zone-alz/|gov/main\.bicep$|/alerts/|templates/example-vertical/' \
            > /tmp/bicep-files.txt
          COUNT=$(wc -l < /tmp/bicep-files.txt)
          echo "=== Compiling $COUNT Bicep files across $(nproc) workers ==="

          # EXPORTED, not a plain shell var: the `sh -c` workers below are
          # separate processes spawned by xargs and inherit only the
          # environment. A non-exported FAIL_DIR would arrive empty there and
          # every `touch` would target /<name> instead — failures would be
          # recorded nowhere and the gate would report success on a broken tree.
          export FAIL_DIR
          FAIL_DIR=$(mktemp -d)

          # -d '\n' so paths containing spaces stay intact; `sh -c ... _` passes
          # the filename as $1 rather than interpolating it into the script.
          # --stdout >/dev/null: the old form wrote a sibling .json for all 263
          # files, littering the checkout mid-run. We want the diagnostics on
          # stderr, never the ARM output.
          xargs -d '\n' -P "$(nproc)" -n1 sh -c '
            f="$1"
            if ! out=$(bicep build "$f" --no-restore --stdout 2>&1 >/dev/null); then
              printf "%s\n" "$out"
              printf "::error file=%s::bicep build failed\n" "$f"
              touch "$FAIL_DIR/$(printf "%s" "$f" | tr "/" "_")"
            fi
          ' _ < /tmp/bicep-files.txt

          FAILED=$(find "$FAIL_DIR" -type f | wc -l)
          rm -rf "$FAIL_DIR"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED Bicep file(s) failed to compile"
            exit 1
          fi
          echo "All $COUNT Bicep files compiled clean."

  # -------------------------------------------------------------------------
  # Secret Scanning
  # -------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact --no-banner

  # -------------------------------------------------------------------------
  # IaC Security Scanning
  # -------------------------------------------------------------------------
  security-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Run Checkov
        # Checkov runs in advisory mode (soft_fail: true) while the brownfield
        # backlog is worked down.  See ``.checkov.yaml`` at the repo root for
        # the explicit skip-list with one-line rationale per check ID; PR #103
        # closed 33 findings and PR #104 closed another ~50.  When the residual
        # parser-limitation findings clear we will flip soft_fail off.
        uses: bridgecrewio/checkov-action@de2bfaecd21d58ef232e0d2a3391c33c32c460d7 # v12
        with:
          directory: deploy/
          config_file: .checkov.yaml
          framework: bicep,arm
          soft_fail: true
          output_format: sarif
          output_file_path: results.sarif
          skip_path: deploy/bicep/landing-zone-alz

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@7d9249f5a57288b8a472ddd9cc3ece1921f7dc38 # v3
        with:
          sarif_file: results.sarif
        continue-on-error: true  # Gracefully skip if code scanning is not enabled

  # -------------------------------------------------------------------------
  # PowerShell Linting
  # -------------------------------------------------------------------------
  powershell-lint:
    name: PowerShell Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter "*.ps1" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'node_modules|\.venv|dbt-env|codeqlDB' }
          $allResults = @()
          foreach ($file in $files) {
            Write-Host "Analyzing: $($file.FullName)"
            $results = Invoke-ScriptAnalyzer -Path $file.FullName -Severity Warning,Error
            if ($results) {
              $results | Format-Table -AutoSize
              $allResults += $results
            }
          }
          $errors = $allResults | Where-Object { $_.Severity -eq 'Error' }
          if ($errors) {
            Write-Host "::error::PSScriptAnalyzer found $($errors.Count) error(s)"
            exit 1
          }

  # -------------------------------------------------------------------------
  # Python Linting
  # -------------------------------------------------------------------------
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install ruff

      - name: Lint Python files
        run: |
          ruff check domains/ scripts/ csa_platform/ tools/

  # -------------------------------------------------------------------------
  # Repository Hygiene Check
  # -------------------------------------------------------------------------
  hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Check for large files
        run: |
          # Notebook outputs are stripped via .gitattributes + nbstripout
          # so monitor notebooks no longer need a size exclusion.
          echo "=== Files larger than 5MB ==="
          FOUND_LARGE=0
          while read -r file; do
            SIZE=$(du -sh "$file" | cut -f1)
            echo "::warning::Large file: $file ($SIZE)"
            FOUND_LARGE=1
          done < <(find . -type f -size +5M -not -path "./.git/*")
          if [ "$FOUND_LARGE" -eq 1 ]; then
            echo "::error::Found files larger than 5MB"
            exit 1
          fi

      - name: Check for committed secrets patterns
        run: |
          echo "=== Checking for common secret patterns ==="
          PATTERNS="password|secret|api_key|apikey|access_key|private_key|client_secret"
          MATCHES=$(grep -rni "$PATTERNS" --include="*.json" --include="*.yaml" --include="*.yml" \
            --include="*.ps1" --include="*.py" \
            --exclude="*.bicep" \
            --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=codeqlDB \
            --exclude-dir=.git --exclude-dir=.github \
            . | grep -v "askForPassword" | grep -v "savePassword" \
            | grep -v ".gitignore" | grep -v "secretStorage" \
            | grep -v "# nosec" | grep -v "noqa" | head -20) || true
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::Found potential secret patterns in committed files"
            exit 1
          fi
          echo "No patterns found"

      - name: Check for committed venvs/node_modules
        run: |
          FAILED=0
          for dir in node_modules .venv venv dbt-env __pycache__; do
            FOUND=$(find . -type d -name "$dir" -not -path "./.git/*" 2>/dev/null)
            if [ -n "$FOUND" ]; then
              echo "::error::Found committed $dir directory: $FOUND"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
