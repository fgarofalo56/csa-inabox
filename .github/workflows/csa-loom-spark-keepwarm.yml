name: csa-loom-spark-keepwarm

# ---------------------------------------------------------------------------
# Keep a Synapse/Databricks Spark session PERPETUALLY WARM so notebook runs are
# instant instead of paying the multi-minute cold start — AND drive Spark
# reliability maintenance on the SAME durable heartbeat.
#
# The console's in-process warm-pool sweeper (`spark-session-pool.ts`) is
# unreliable in a serverless Container App — the Node process only lives while
# serving requests, replicas recycle, and every roll resets the pool to cold.
# This external heartbeat is the SOLE durable driver on ACA: pinging the
# internal-token-gated keep-warm endpoint every 5 minutes (the SAME pattern the
# scheduler tick uses) makes each hit (a) start the sweeper after a recycle,
# (b) re-adopt cross-replica warm sessions, (c) top the pool back up to `min`,
# and (d) run the A11 auto-recovery tick — detect a FAULTED / "Succeeded but
# can't launch" Spark pool and delete+recreate it (thrash-guarded, operator-
# alerted; gated by the a11-spark-autorecover runtime flag + the
# LOOM_SPARK_AUTORECOVER_ENABLED env). The #1796 leaked-session reaper + the A12
# session-quota hard-kill ride the same in-request sweep. So a warm session is
# always standing by AND a faulted pool self-heals within one cycle.
#
# Auth: LOOM_INTERNAL_TOKEN (GitHub secret) as a Bearer token. The console is
# reachable via Front Door; the console itself reaches Livy in-VNet.
# ---------------------------------------------------------------------------

on:
  schedule:
    # DECLARED */5. MEASURED median 51m, min 25m, max 140m over 59 consecutive
    # intervals (2026-08-08 -> 2026-08-11) — 10.2x the declared cadence. GitHub
    # delays and drops high-frequency schedules on busy repositories; this has
    # NEVER run at 5-minute cadence.
    #
    # The old comment here said "5m keeps min=1 topped up". That is false: a 15m
    # idle TTL expires ~3x between consecutive runs at the median and ~9x at the
    # observed max, so the keep-warm cannot do the thing it claims. The defect is
    # the DESIGN that assumed the declared number, not the workflow — recorded
    # here so nobody designs against */5 again. See #3226 for the options, which
    # trade money against latency and are an operator decision.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      console_url:
        description: 'Console base URL (default the Commercial vanity)'
        type: string
        default: 'https://csa-loom.limitlessdata.ai'
        required: false

concurrency:
  group: spark-keepwarm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  keepwarm:
    name: 'Spark keep-warm heartbeat'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping keep-warm
        env:
          CONSOLE_URL: ${{ inputs.console_url || 'https://csa-loom.limitlessdata.ai' }}
          INTERNAL_TOKEN: ${{ secrets.LOOM_INTERNAL_TOKEN }}
        run: |
          if [ -z "$INTERNAL_TOKEN" ]; then
            echo "::warning::LOOM_INTERNAL_TOKEN secret not set — cannot keep the Spark pool warm. Add it to repo secrets."
            exit 0
          fi
          code=$(curl -sS -o /tmp/kw.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $INTERNAL_TOKEN" \
            -H 'Content-Type: application/json' \
            --max-time 90 \
            "${CONSOLE_URL}/api/internal/spark/keep-warm" || echo 000)
          echo "keep-warm HTTP $code"
          cat /tmp/kw.json 2>/dev/null | head -c 600 || true
          echo ""
          # A 200 (warmed/topped-up) or an honest skip is success; auth/others fail loudly.
          case "$code" in
            200) echo "warm pool topped up";;
            401) echo "::error::keep-warm 401 — LOOM_INTERNAL_TOKEN mismatch between the secret and the console env"; exit 1;;
            000) echo "::warning::console unreachable ($CONSOLE_URL) — transient; next tick retries";;
            *)   echo "::warning::keep-warm returned $code — see body above";;
          esac
