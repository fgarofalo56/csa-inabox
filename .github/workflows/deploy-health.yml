name: deploy-health

# CSA Loom Health Data Services (LHDS) - deploys platform/fiab/bicep/health.bicep, its
# own subscription-level unit (stamp W1-1 + control plane W1-3), apart from main.bicep.
# Dispatch-only: no schedule, so nothing here runs unless an operator asks.
#
# BOUNDARIES. Commercial and GCC-High. IL5 and DoD are supported in code through
# health-params/il5-health.bicepparam and are deliberately not offered here (never exercised).
# GCC is not claimed (no GCC tenant exists; cloud-parity.md). Neither offered boundary
# has a deploy receipt until this lane has run an apply on it.
#
# MODES. whatif-only (default) previews health.bicep and applies NOTHING. full APPLIES it.
# healthEnabled is false in every param file; this workflow is the only thing that
# passes healthEnabled=true, and only in the what-if/apply steps below.
#
# ESTATE PAUSE (#5111, #5113, #5114). The control plane creates a Container App on the
# hub environment, which a paused estate must not have rewritten. A full run STANDS DOWN
# (applies nothing, says so) unless BOTH the checked-in declaration and the observed
# Estate Power state say the estate is not paused. This lane is stricter than the
# commercial dispatch path: an UNKNOWN verdict (the gate job failed, timed out or was
# skipped) also stands the apply down, because a missed apply is cheap and can be
# repeated, and override_estate_pause is the explicit way past it. A what-if is
# read-only, so it is not gated.
#
# FAILURES are classified (permission / not found / transient / quota-capacity / template)
# with a concrete remediation, and nothing here discards a result: no continue-on-error,
# no `|| true`. A stood-down or what-if-only run is titled DRY RUN so it is never read
# as a deployed SHA (deploy-integrity.md R2/R3).

run-name: deploy-health ${{ inputs.boundary }}${{ inputs.run_mode != 'full' && ' - DRY RUN (whatif-only, applies nothing)' || '' }}

on:
  workflow_dispatch:
    inputs:
      boundary:
        description: 'Cloud boundary. Commercial or GCC-High. IL5/DoD are supported in code only and are not offered.'
        type: choice
        default: Commercial
        options:
          - Commercial
          - GCC-High
      run_mode:
        description: 'whatif-only PREVIEWS health.bicep and applies NOTHING. full APPLIES it: creates the stamp resource group and, when control_plane_audiences is set, the control plane.'
        type: choice
        default: whatif-only
        options:
          - whatif-only
          - full
      control_plane_audiences:
        description: 'Comma-separated accepted token audiences (app id URI and/or client id) for loom-health-cp. Empty = resolved for you: repository variable LOOM_HEALTH_CP_APP_CLIENT_ID, else an Entra lookup of the app loom-health-cp by display name that must find exactly one, giving <appId>,api://<appId>. A full run that cannot resolve it FAILS; it never deploys without the control plane.'
        type: string
        required: false
        default: ''
      control_plane_platform:
        description: 'auto = containerApps on these boundaries. aks = Deployment on the stamp cluster (the IL5 path; allowed here for testing).'
        type: choice
        default: auto
        options:
          - auto
          - containerApps
          - aks
      control_plane_as_client_id:
        description: 'Optional client id (GUID) of the authorization-server Entra app loom-health-cp-as. Empty = repository variable LOOM_HEALTH_CP_AS_CLIENT_ID, else an Entra lookup by display name that must find exactly one app. The issuer URL and FHIR edge base are derived from the stamp ingress, not supplied.'
        type: string
        required: false
        default: ''
      allow_existing_hub:
        description: 'Reconcile an LHDS stamp that already exists in this subscription. Default false: if an rg-csa-loom-health-* group exists the run refuses rather than silently adopting or duplicating it (deploy-integrity R5). The hub itself (registry + Container Apps environment) must already exist either way.'
        type: boolean
        default: false
      override_estate_pause:
        description: 'Apply even though the estate is PAUSED or its state is unknown. Default false: a full run then stands down and applies nothing. true = you accept that.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-health-${{ inputs.boundary }}
  cancel-in-progress: false

jobs:
  precheck:
    name: Verify ${{ inputs.boundary }} secrets are configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          BOUNDARY: ${{ inputs.boundary }}
          C: ${{ inputs.boundary == 'GCC-High' && secrets.AZURE_GOV_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          S: ${{ inputs.boundary == 'GCC-High' && secrets.AZURE_GOV_CLIENT_SECRET || secrets.AZURE_CLIENT_SECRET }}
          T: ${{ inputs.boundary == 'GCC-High' && secrets.AZURE_GOV_TENANT_ID || secrets.AZURE_TENANT_ID }}
          U: ${{ inputs.boundary == 'GCC-High' && secrets.AZURE_GOV_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [[ -z "$C" || -z "$S" || -z "$T" || -z "$U" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::The $BOUNDARY deploy credentials (client id, secret, tenant, subscription) are not all configured, so nothing can be read or deployed. Bootstrap per docs/fiab/runbooks/secrets-bootstrap.md."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

  # The DECLARATION half of the estate-pause verdict, computed with no Azure.
  pause-declaration:
    name: Is the ${{ inputs.boundary }} estate DECLARED paused?
    runs-on: ubuntu-latest
    outputs:
      declared: ${{ steps.read.outputs.declared_paused }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: read
        env:
          BOUNDARY: ${{ inputs.boundary }}
        run: node scripts/ci/estate-pause-declared.mjs --boundary "$BOUNDARY"

  # The OBSERVED half: the console's Estate Power state, read as the deploy principal.
  estate-gate:
    name: Estate pause gate
    needs: precheck
    if: ${{ needs.precheck.outputs.configured == 'true' }}
    uses: ./.github/workflows/estate-pause-gate.yml
    secrets: inherit
    with:
      boundary: ${{ inputs.boundary }}
      override_estate_pause: ${{ inputs.override_estate_pause == true }}

  # The GCC-High apply keeps the manual approval the GCC-High deploy lane has
  # (environment gcc-high-deploy). Commercial has no environment on its deploy lane,
  # so this job is skipped there and the deploy job below does not wait on it.
  approve-gov:
    name: Approve the GCC-High apply
    needs: precheck
    if: ${{ inputs.boundary == 'GCC-High' && inputs.run_mode == 'full' && needs.precheck.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: gcc-high-deploy
    steps:
      - run: echo "Approved GCC-High apply of platform/fiab/bicep/health.bicep."

  deploy:
    name: ${{ inputs.run_mode == 'full' && 'Deploy' || 'What-if' }} LHDS (${{ inputs.boundary }})
    needs: [precheck, pause-declaration, estate-gate, approve-gov]
    # !cancelled() so a failed or skipped gate still reaches the verdict step, which
    # fails closed; without it a gate failure would skip this job and read as a pass.
    # approve-gov is skipped on Commercial and on what-if; a REJECTED approval fails it.
    if: ${{ !cancelled() && needs.precheck.result == 'success' && (needs.approve-gov.result == 'success' || needs.approve-gov.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BOUNDARY: ${{ inputs.boundary }}
      RUN_MODE: ${{ inputs.run_mode }}
      AUDIENCES: ${{ inputs.control_plane_audiences }}
      CP_PLATFORM_INPUT: ${{ inputs.control_plane_platform }}
      ALLOW_EXISTING: ${{ inputs.allow_existing_hub }}
      OVERRIDE_PAUSE: ${{ inputs.override_estate_pause }}
      DECLARED: ${{ needs.pause-declaration.outputs.declared }}
      GATE_RESULT: ${{ needs.estate-gate.result }}
      GATE_STANDDOWN: ${{ needs.estate-gate.outputs.standdown }}
      GATE_STATE: ${{ needs.estate-gate.outputs.state }}
      ADMIN_GROUP: ${{ inputs.boundary == 'GCC-High' && secrets.FIAB_GOV_ADMIN_GROUP_ID || secrets.FIAB_ADMIN_GROUP_ID }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Azure login (Commercial)
        if: ${{ inputs.boundary == 'Commercial' }}
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Azure login (Gov)
        if: ${{ inputs.boundary == 'GCC-High' }}
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment

      - name: Set Azure cloud to Gov
        if: ${{ inputs.boundary == 'GCC-High' }}
        run: az cloud set --name AzureUSGovernment

      - name: Resolve parameters and compile health.bicep
        id: params
        run: |
          set -euo pipefail
          mkdir -p temp
          case "$BOUNDARY" in
            Commercial) PF=platform/fiab/bicep/health-params/commercial-health.bicepparam ;;
            GCC-High)   PF=platform/fiab/bicep/health-params/gcc-high-health.bicepparam ;;
            *) echo "::error::Boundary '$BOUNDARY' is not offered by this lane (Commercial and GCC-High only)."; exit 1 ;;
          esac
          az bicep install
          az bicep build -f platform/fiab/bicep/health.bicep --outfile temp/health.json
          az bicep build-params -f "$PF" --stdout > temp/params.json
          # build-params --stdout emits {"parametersJson":"<escaped JSON string>", ...}, so decode it first.
          HUB_LOCATION=$(jq -r '.parametersJson | fromjson | .parameters.location.value' temp/params.json)
          if [ -z "$HUB_LOCATION" ] || [ "$HUB_LOCATION" = "null" ]; then
            echo "::error::$PF does not set a location, so the hub resource group cannot be named."
            exit 1
          fi
          PLATFORM="$CP_PLATFORM_INPUT"
          if [ "$PLATFORM" = "auto" ]; then PLATFORM=containerApps; fi
          {
            echo "pf=$PF"
            echo "hub_location=$HUB_LOCATION"
            echo "platform=$PLATFORM"
          } >> "$GITHUB_OUTPUT"

      # The apply verdict. FAIL-CLOSED on anything but a positive "not paused": the
      # checked-in declaration must read exactly 'false', and the observed gate must
      # have SUCCEEDED and said standdown == 'false'. A missing or failed verdict is an
      # unknown, and an unknown is not a no.
      - name: Estate pause verdict
        id: verdict
        run: |
          set -euo pipefail
          STAND=false
          REASON=""
          if [ "$RUN_MODE" = "full" ] && [ "$OVERRIDE_PAUSE" != "true" ]; then
            if [ "$DECLARED" != "false" ]; then
              STAND=true
              if [ "$DECLARED" = "true" ]; then
                REASON="$BOUNDARY is DECLARED paused in scripts/ci/estate-pause-declaration.json."
              else
                REASON="the declaration job published no verdict (got '${DECLARED}'), which is an unknown, not a no."
              fi
            elif [ "$GATE_RESULT" != "success" ]; then
              STAND=true
              REASON="the Estate pause gate did not succeed (result '${GATE_RESULT}'), so the observed state was not established."
            elif [ "$GATE_STANDDOWN" != "false" ]; then
              STAND=true
              REASON="the Estate Power state is '${GATE_STATE}' (stand-down '${GATE_STANDDOWN}')."
            fi
          fi
          echo "standdown=$STAND" >> "$GITHUB_OUTPUT"
          if [ "$STAND" = "true" ]; then
            echo "::notice::Stood down: ${REASON} This run applies NOTHING and is UNMEASURED, not clean. Resume the estate, or dispatch with override_estate_pause=true."
            {
              echo "### deploy-health: STOOD DOWN ($BOUNDARY)"
              echo
              echo "Reason: ${REASON}"
              echo
              echo "Nothing was applied. This run is not a deployed SHA and is UNMEASURED, not clean."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # AUTO-BIND (#5346): the control plane's token audiences used to be typed in by hand, and an empty
      # input gave a GREEN run with no control plane and no TLS (run 44235231240). Same order as the
      # authorization-server app below: dispatch input, then repository variable
      # LOOM_HEALTH_CP_APP_CLIENT_ID (the variable the post-deploy bootstrap already reads), then an Entra
      # lookup by display name that must find EXACTLY one app. A full run that cannot resolve it FAILS; a
      # what-if says so and continues, because it applies nothing.
      - name: Resolve the control plane token audiences
        id: audiences
        if: ${{ steps.verdict.outputs.standdown != 'true' }}
        env:
          AUD_INPUT: ${{ inputs.control_plane_audiences }}
          CP_APP_VAR: ${{ vars.LOOM_HEALTH_CP_APP_CLIENT_ID || '' }}
        run: |
          set -uo pipefail
          # The runner shell is `bash -e` and `set -uo pipefail` does not clear it: without this, a failing
          # `az ... 2> file` ends the script on that line and the RC check below never runs (run 43067631148).
          set +e
          mkdir -p temp
          GUID='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          problem() { # $1 = message
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            echo "audiences=" >> "$GITHUB_OUTPUT"
            if [ "$RUN_MODE" = "full" ]; then echo "::error::$1"; exit 1; fi
            echo "::warning::$1 (what-if continues WITHOUT the control plane; a full run would stop here)."
            exit 0
          }
          AUD=""; SRC=""
          if [ -n "$AUD_INPUT" ]; then AUD="$AUD_INPUT"; SRC="dispatch input control_plane_audiences"
          else
            APP=""
            if [ -n "$CP_APP_VAR" ]; then APP="$CP_APP_VAR"; SRC="repository variable LOOM_HEALTH_CP_APP_CLIENT_ID"
            else
              az ad app list --filter "displayName eq 'loom-health-cp'" --query "[].appId" -o json > temp/cp-app.json 2> temp/cp-app.err
              RC=$?
              if [ "$RC" != "0" ]; then
                problem "could not read Entra to find the app loom-health-cp (az exit $RC: $(head -c 300 temp/cp-app.err)). Whether it exists is UNKNOWN. Set the repository variable LOOM_HEALTH_CP_APP_CLIENT_ID or the dispatch input control_plane_audiences, or grant the deploy identity Graph Application.Read.All."
              fi
              N=$(jq 'length' temp/cp-app.json 2> /dev/null)
              if ! printf '%s' "$N" | grep -Eq '^[0-9]+$'; then
                problem "az returned output for the loom-health-cp lookup that could not be parsed as a JSON list (got '$(head -c 120 temp/cp-app.json)'), so whether the app exists is UNKNOWN (not a claim that it is missing). Set the repository variable LOOM_HEALTH_CP_APP_CLIENT_ID or the dispatch input control_plane_audiences."
              fi
              if [ "$N" != "1" ]; then
                problem "found $N Entra apps named loom-health-cp; exactly 1 is required and this lane will not guess (and will not deploy without a control plane). Create the app registration, or set LOOM_HEALTH_CP_APP_CLIENT_ID / control_plane_audiences."
              fi
              APP=$(jq -r '.[0]' temp/cp-app.json); SRC="Entra lookup by display name loom-health-cp"
            fi
            if ! printf '%s' "$APP" | grep -Eq "$GUID"; then
              problem "the control plane app client id from the $SRC is not a GUID."
            fi
            AUD="$APP,api://$APP"
          fi
          echo "resolved=true" >> "$GITHUB_OUTPUT"
          echo "audiences=$AUD" >> "$GITHUB_OUTPUT"
          echo "::notice::control plane audiences resolved from the $SRC (app ids and URIs, not secrets)."

      - name: Discover the hub (registry and Container Apps environment)
        id: hub
        if: ${{ steps.verdict.outputs.standdown != 'true' }}
        env:
          HUB_LOCATION: ${{ steps.params.outputs.hub_location }}
          PLATFORM: ${{ steps.params.outputs.platform }}
          AUDIENCES: ${{ steps.audiences.outputs.audiences }}
        run: |
          set -uo pipefail
          HUB_RG="rg-csa-loom-admin-${HUB_LOCATION}"
          # The stamp location in the params file need not be the hub region. If the
          # derived name is absent, DISCOVER the hub: accept exactly one admin group,
          # never guess between several (deploy-integrity R5).
          az group exists -n "$HUB_RG" > temp/rgx.txt 2> temp/rgx.err || { echo "::error::Could not check whether $HUB_RG exists: $(head -c 400 temp/rgx.err)"; exit 1; }
          if [ "$(tr -d '\r\n' < temp/rgx.txt)" != "true" ]; then
            az group list --query "[?starts_with(name, 'rg-csa-loom-admin-')].name" -o json > temp/hubrg.json 2> temp/hubrg.err || { echo "::error::Could not list resource groups to discover the hub: $(head -c 400 temp/hubrg.err)"; exit 1; }
            if [ "$(jq 'length' temp/hubrg.json)" = "1" ]; then
              HUB_RG=$(jq -r '.[0]' temp/hubrg.json)
              echo "::notice::there is no rg-csa-loom-admin-${HUB_LOCATION}; using the only one in this subscription: $HUB_RG."
            else
              echo "::error::NOT FOUND: no rg-csa-loom-admin-${HUB_LOCATION} and the subscription has $(jq 'length' temp/hubrg.json) admin groups ($(jq -r 'join(", ")' temp/hubrg.json)), so the hub cannot be chosen unambiguously."
              exit 1
            fi
          fi
          fail() { # $1 = err file, $2 = what we were reading
            if grep -qiE 'AuthorizationFailed|does not have authorization' "$1"; then
              echo "::error::PERMISSION: the deploy principal cannot read $2 in $HUB_RG. Grant it Reader on the subscription: az role assignment create --assignee <deploy-sp-app-id> --role Reader --scope /subscriptions/<subscription-id>"
            elif grep -qiE 'ResourceGroupNotFound|could not be found' "$1"; then
              echo "::error::NOT FOUND: resource group $HUB_RG does not exist in this subscription, so $2 could not be read. LHDS needs the Loom hub first: run deploy-fiab-commercial.yml or deploy-fiab-gcch.yml, then re-run this lane."
            elif grep -qiE 'timed out|Max retries|Connection|Name or service not known|ServiceUnavailable|TooManyRequests' "$1"; then
              echo "::error::TRANSIENT: ARM did not answer while reading $2. Nothing was established about the hub; re-run this lane."
            else
              echo "::error::UNCLASSIFIED failure reading $2: $(head -c 400 "$1")"
            fi
            exit 1
          }
          az resource list -g "$HUB_RG" --resource-type Microsoft.ContainerRegistry/registries --query '[].name' -o json > temp/acr.json 2> temp/acr.err || fail temp/acr.err "the container registry"
          N=$(jq 'length' temp/acr.json)
          if [ "$N" != "1" ]; then
            echo "::error::Expected exactly 1 container registry in $HUB_RG, found $N. $( [ "$N" = "0" ] && echo 'The hub registry does not exist yet.' || echo 'More than one is ambiguous and this lane will not guess which to pull from.')"
            exit 1
          fi
          ACR=$(jq -r '.[0]' temp/acr.json)
          az acr show -n "$ACR" -g "$HUB_RG" --query loginServer -o tsv > temp/acr.ls 2> temp/acr.ls.err || fail temp/acr.ls.err "the registry login server"
          LOGIN=$(tr -d '\r\n' < temp/acr.ls)
          CAE=""
          if [ "$PLATFORM" = "containerApps" ]; then
            az resource list -g "$HUB_RG" --resource-type Microsoft.App/managedEnvironments --query '[].id' -o json > temp/cae.json 2> temp/cae.err || fail temp/cae.err "the Container Apps environment"
            M=$(jq 'length' temp/cae.json)
            if [ "$M" != "1" ]; then
              echo "::error::Expected exactly 1 Container Apps environment in $HUB_RG, found $M. The containerApps control plane needs one; use control_plane_platform=aks to host it on the stamp cluster instead."
              exit 1
            fi
            CAE=$(jq -r '.[0]' temp/cae.json)
          fi
          # ISSUER VIA FRONT DOOR (#5410). The control plane is in the INTERNAL hub environment and the
          # stamp Application Gateway has no path to it, so the authorization-server issuer is served by the
          # EXISTING Front Door Premium profile in the hub resource group (route /auth/* only). Resolve it
          # here and hand it to health.bicep as controlPlaneConfig.frontDoor. Exactly one profile is used;
          # several are ambiguous and fail (never guess); none is a LOUD warning, never silent.
          FD_JSON='{}'
          FD_NAME=""
          if [ "$PLATFORM" = "containerApps" ]; then
            az afd profile list -g "$HUB_RG" --query '[].name' -o json > temp/fd.json 2> temp/fd.err || fail temp/fd.err "the Front Door profiles"
            K=$(jq 'length' temp/fd.json)
            if [ "$K" = "1" ]; then
              FD_NAME=$(jq -r '.[0]' temp/fd.json)
              FD_JSON=$(jq -n --arg p "$FD_NAME" --arg rg "$HUB_RG" '{ profileName: $p, resourceGroup: $rg }')
              echo "::notice::Issuer will be served through Front Door profile $FD_NAME in $HUB_RG (route /auth/* only)."
            elif [ "$K" = "0" ]; then
              echo "::warning::issuer unreachable: no Front Door on this boundary (no Microsoft.Cdn profile in $HUB_RG). The issuer URL falls back to the stamp ingress URL, which has no path to the control plane; the issuer route is supported-in-code only here, follow-up (an App Gateway path, #5410). Nothing in this run makes the issuer reachable."
            else
              echo "::error::Expected at most 1 Front Door profile in $HUB_RG, found $K ($(jq -r 'join(", ")' temp/fd.json)). This lane will not guess which one serves the issuer; set controlPlaneConfig.frontDoor.profileName by hand."
              exit 1
            fi
          fi
          jq -n --arg aud "$AUDIENCES" --arg platform "$PLATFORM" --arg acr "$ACR" --arg rg "$HUB_RG" \
               --arg login "$LOGIN" --arg env "$CAE" --argjson fd "$FD_JSON" \
               '{ audiences: ($aud | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))),
                  controlPlane: $platform, acrName: $acr, acrResourceGroup: $rg, acrLoginServer: $login, environmentId: $env }
                + (if ($fd | length) > 0 then { frontDoor: $fd } else {} end)' > temp/cp.json
          {
            echo "acr=$ACR"
            echo "cae_id=$CAE"
            echo "fd_profile=$FD_NAME"
            echo "hub_rg=$HUB_RG"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Hub: registry $ACR, resource group $HUB_RG, control plane audiences $(jq '.audiences | length' temp/cp.json)."

      # W1b-1 (#5151): the authorization-server Entra app client id has no ARM source (it is an Entra
      # object), so it is resolved HERE and handed to health.bicep as controlPlaneConfig.authAsClientId.
      # The issuer and the FHIR edge base are derived inside health.bicep from the stamp ingress FQDN.
      # Order: dispatch input, then repo variable LOOM_HEALTH_CP_AS_CLIENT_ID, then an Entra lookup by
      # display name that must find EXACTLY one app (never guess between several). A full run that
      # cannot resolve it FAILS here rather than deploying a control plane that crash-loops.
      - name: Resolve the authorization-server Entra app client id
        id: asclient
        if: ${{ steps.verdict.outputs.standdown != 'true' && steps.audiences.outputs.resolved == 'true' }}
        env:
          AS_INPUT: ${{ inputs.control_plane_as_client_id }}
          AS_VAR: ${{ vars.LOOM_HEALTH_CP_AS_CLIENT_ID || '' }}
        run: |
          set -uo pipefail
          # The runner shell is `bash -e` and `set -uo pipefail` does not clear it: without this, a failing
          # `az ... 2> file` ends the script on that line and the RC check below never runs (run 43067631148).
          set +e
          GUID='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          problem() { # $1 = message
            if [ "$RUN_MODE" = "full" ]; then echo "::error::$1"; exit 1; fi
            echo "::warning::$1 (what-if continues; a full run would stop here)."
            exit 0
          }
          AS=""; SRC=""
          if [ -n "$AS_INPUT" ]; then AS="$AS_INPUT"; SRC="dispatch input control_plane_as_client_id"
          elif [ -n "$AS_VAR" ]; then AS="$AS_VAR"; SRC="repository variable LOOM_HEALTH_CP_AS_CLIENT_ID"
          else
            az ad app list --filter "displayName eq 'loom-health-cp-as'" --query "[].appId" -o json > temp/as-app.json 2> temp/as-app.err
            RC=$?
            if [ "$RC" != "0" ]; then
              problem "could not read Entra to find the app loom-health-cp-as (az exit $RC: $(head -c 300 temp/as-app.err)). Whether it exists is UNKNOWN. Set the repository variable LOOM_HEALTH_CP_AS_CLIENT_ID or the dispatch input control_plane_as_client_id, or grant the deploy identity Graph Application.Read.All."
            fi
            N=$(jq 'length' temp/as-app.json)
            if [ "$N" != "1" ]; then
              problem "found $N Entra apps named loom-health-cp-as; exactly 1 is required and this lane will not guess. Create it, or set LOOM_HEALTH_CP_AS_CLIENT_ID / control_plane_as_client_id."
            fi
            AS=$(jq -r '.[0]' temp/as-app.json); SRC="Entra lookup by display name loom-health-cp-as"
          fi
          if ! printf '%s' "$AS" | grep -Eq "$GUID"; then
            problem "the authorization-server client id from the $SRC is not a GUID."
          fi
          jq --arg id "$AS" '. + {authAsClientId: $id}' temp/cp.json > temp/cp.next.json || { echo "::error::could not add authAsClientId to temp/cp.json"; exit 1; }
          mv temp/cp.next.json temp/cp.json
          echo "::notice::authorization-server client id resolved from the $SRC (an app registration id, not a secret)."

      # PDP APPLYING PRINCIPAL (#5422). The manifest is applied through `az aks command invoke` as the service principal this
      # run signs in as, and the cluster uses Azure RBAC (Owner carries no Kubernetes data role). Its object id goes to
      # health.bicep as controlPlaneConfig.pdpApplyPrincipalId so the template grants it Azure Kubernetes Service RBAC
      # Cluster Admin (the manifest creates a Namespace and a RoleBinding). The PDP's bundle verification key is NOT an
      # input any more: the control plane signs bundles with a Key Vault key and serves its public half, fetched below.
      - name: Resolve the PDP applying principal
        id: pdpinputs
        if: ${{ steps.verdict.outputs.standdown != 'true' && steps.audiences.outputs.resolved == 'true' }}
        run: |
          set -uo pipefail
          set +e
          problem() { # $1 = message
            if [ "$RUN_MODE" = "full" ]; then echo "::error::$1"; exit 1; fi
            echo "::warning::$1 (what-if continues WITHOUT the PDP grant; a full run would stop here)."
            exit 0
          }
          RC=0; CLIENT=$(az account show --query user.name -o tsv 2> temp/acct.err) || RC=$?
          if [ "$RC" != "0" ] || [ -z "$CLIENT" ]; then problem "could not read the signed-in principal (az: $(head -c 300 temp/acct.err)), so the PDP apply cannot be authorised."; fi
          RC=0; OID=$(az ad sp show --id "$CLIENT" --query id -o tsv 2> temp/sp.err) || RC=$?
          if [ "$RC" != "0" ] || ! printf '%s' "$OID" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
            problem "could not resolve the object id of the signed-in service principal $CLIENT (az: $(head -c 300 temp/sp.err)). The deploy identity needs Graph Application.Read.All, or no PDP manifest can be applied."
          fi
          jq --arg oid "$OID" '. + {pdpApplyPrincipalId: $oid}' temp/cp.json > temp/cp.next.json || { echo "::error::could not add pdpApplyPrincipalId to temp/cp.json"; exit 1; }
          mv temp/cp.next.json temp/cp.json
          echo "::notice::PDP applying principal resolved (an object id, not a secret)."

      - name: Refuse to adopt or duplicate an existing LHDS stamp
        if: ${{ steps.verdict.outputs.standdown != 'true' && inputs.allow_existing_hub != true }}
        run: |
          set -uo pipefail
          az group list --query "[?starts_with(name, 'rg-csa-loom-health-')].name" -o json > temp/health-rg.json 2> temp/health-rg.err || {
            echo "::error::Could not list resource groups to check for an existing LHDS stamp: $(head -c 400 temp/health-rg.err). Nothing was established; re-run, or dispatch with allow_existing_hub=true to skip this check."
            exit 1
          }
          N=$(jq 'length' temp/health-rg.json)
          if [ "$N" != "0" ]; then
            echo "::error::An LHDS stamp already exists in this subscription ($(jq -r 'join(", ")' temp/health-rg.json)). Dispatch with allow_existing_hub=true to reconcile it in place; this lane will not silently adopt or duplicate it."
            exit 1
          fi

      - name: Image preflight - loom-health-cp tag exists in the registry
        if: ${{ steps.verdict.outputs.standdown != 'true' && inputs.run_mode == 'full' && steps.audiences.outputs.resolved == 'true' }}
        env:
          ACR: ${{ steps.hub.outputs.acr }}
          HUB_RG: ${{ steps.hub.outputs.hub_rg }}
        run: |
          set -uo pipefail
          bash scripts/ci/assert-acr-image-tags.sh --acr "$ACR" --rg "$HUB_RG" --lease "loom-health-cp:v0.1"
          RC=$?
          case "$RC" in
            0) ;;
            3) echo "::error::MISSING: the registry answered and loom-health-cp:v0.1 is not in it. Build it first: full-app-deploy-commercial.yml (Commercial) or gov-provision-dataplane-images.yml with apply=true (GCC-High)."; exit 1 ;;
            4) echo "::error::UNPROVEN: the registry could not be read, so whether loom-health-cp:v0.1 exists is unknown. This is not a claim that it is missing; re-run."; exit 1 ;;
            5) echo "::error::The tag was verified present but re-locking the registry firewall is unproven; check the registry network rules before continuing."; exit 1 ;;
            *) echo "::error::assert-acr-image-tags.sh exited $RC (usage or unclassified)."; exit 1 ;;
          esac

      - name: Bicep what-if
        if: ${{ steps.verdict.outputs.standdown != 'true' && inputs.run_mode != 'full' }}
        env:
          PF: ${{ steps.params.outputs.pf }}
          HUB_LOCATION: ${{ steps.params.outputs.hub_location }}
        run: |
          set -uo pipefail
          CP_ARG=()
          if [ -f temp/cp.json ]; then CP_ARG=(--parameters controlPlaneConfig=@temp/cp.json); fi
          az deployment sub what-if --name "lhds-whatif-${GITHUB_RUN_ID}" --location "$HUB_LOCATION" \
            --template-file platform/fiab/bicep/health.bicep --parameters "$PF" \
            --parameters healthEnabled=true adminEntraGroupId="$ADMIN_GROUP" "${CP_ARG[@]}" > temp/whatif.out 2> temp/whatif.err
          RC=$?
          cat temp/whatif.out
          if [ "$RC" != "0" ]; then
            echo "::error::What-if failed ($(head -c 600 temp/whatif.err))"
            exit 1
          fi

      - name: Deploy health.bicep
        id: apply
        if: ${{ steps.verdict.outputs.standdown != 'true' && inputs.run_mode == 'full' }}
        env:
          PF: ${{ steps.params.outputs.pf }}
          HUB_LOCATION: ${{ steps.params.outputs.hub_location }}
        run: |
          set -uo pipefail
          # The runner shell is `bash -e`, and `set -uo pipefail` does not clear -e. Without
          # this, a failing `az deployment sub create` ends the script ON THAT LINE, the RC
          # classifier below never runs and apply.err is never printed (run 43067631148).
          set +e
          CP_ARG=()
          if [ -f temp/cp.json ]; then CP_ARG=(--parameters controlPlaneConfig=@temp/cp.json); fi
          az deployment sub create --name "lhds-${GITHUB_RUN_ID}" --location "$HUB_LOCATION" \
            --template-file platform/fiab/bicep/health.bicep --parameters "$PF" \
            --parameters healthEnabled=true adminEntraGroupId="$ADMIN_GROUP" "${CP_ARG[@]}" \
            --query properties.outputs -o json > temp/outputs.json 2> temp/apply.err
          RC=$?
          if [ "$RC" != "0" ]; then
            echo "::group::subscription-scope deployment stderr (exit $RC)"
            cat temp/apply.err
            echo "::endgroup::"
            # apply.err on a failed nested deployment only says DeploymentFailed. The real
            # error codes live on the failed operations of the nested deployments, so walk them
            # (bounded depth) and classify on stderr plus those operations.
            : > temp/ops.txt
            walk_ops() { # $1 = group ("" for subscription scope), $2 = deployment name, $3 = depth
              local OPS
              if [ -z "$1" ]; then
                OPS=$(az deployment operation sub list -n "$2" -o json 2>> temp/ops.err)
              else
                OPS=$(az deployment operation group list -g "$1" -n "$2" -o json 2>> temp/ops.err)
              fi
              [ -n "$OPS" ] || return 0
              echo "$OPS" | jq -r '.[] | select(.properties.provisioningState=="Failed" and .properties.targetResource.resourceType!="Microsoft.Resources/deployments") | "FAILED-OPERATION " + (.properties.targetResource.resourceType // "?") + " " + (.properties.targetResource.resourceName // "?") + " " + (.properties.statusMessage | tostring | .[0:600])' >> temp/ops.txt 2>/dev/null
              [ "$3" -lt 4 ] || return 0
              echo "$OPS" | jq -r '.[] | select(.properties.provisioningState=="Failed" and .properties.targetResource.resourceType=="Microsoft.Resources/deployments") | (.properties.targetResource.id | capture("resourceGroups/(?<g>[^/]+)/").g // "") + " " + .properties.targetResource.resourceName' 2>/dev/null \
                | while read -r G N; do
                    [ -n "$N" ] && walk_ops "$G" "$N" $(( $3 + 1 ))
                  done
            }
            walk_ops "" "lhds-${GITHUB_RUN_ID}" 0
            echo "::group::failed operations of lhds-${GITHUB_RUN_ID} (nested)"
            if [ -s temp/ops.txt ]; then cat temp/ops.txt; else echo "none readable (operation listing failed or empty: $(head -c 300 temp/ops.err 2>/dev/null))"; fi
            echo "::endgroup::"
            cat temp/apply.err temp/ops.txt > temp/classify.txt 2>/dev/null
            if grep -qiE 'AuthorizationFailed|does not have authorization|LinkedAuthorizationFailed' temp/classify.txt; then
              echo "::error::PERMISSION: the deploy principal lacks a role this template needs (it creates resource groups and writes role assignments). Grant Owner or Contributor plus User Access Administrator on the subscription. Detail: $(grep -iE 'Authorization' temp/classify.txt | head -n 2 | head -c 500)"
            elif grep -qiE 'QuotaExceeded|SkuNotAvailable|OfferRestricted|NotAvailableForSubscription|InsufficientCapacity|ZonalAllocationFailed|AvailabilityZoneNotSupported|Version should be in' temp/classify.txt; then
              echo "::error::QUOTA/CAPACITY/REGION: the stamp region refused a SKU, quota or availability zone (PostgreSQL Flexible is offer-restricted in several regions; AKS zones differ per region; node pools need regional vCPU quota). Run az postgres flexible-server list-skus and az vm list-skus --zone for the stamp region, then set the params file location or healthConfig.location. Detail: $(grep -iE 'Quota|Sku|Offer|Capacity|Zone|Version should' temp/classify.txt | head -n 3 | head -c 700)"
            elif grep -qiE 'InvalidTemplate|InvalidParameter|ParameterOutOfRange|InvalidMaxRequestBody|out of range|BCP[0-9]+|InvalidTemplateDeployment' temp/classify.txt; then
              echo "::error::TEMPLATE/PARAMETER defect, not transient (a retry cannot help). Detail: $(grep -iE 'InvalidTemplate|InvalidParameter|ParameterOutOfRange|InvalidMaxRequestBody|out of range|BCP' temp/classify.txt | head -n 3 | head -c 900)"
            elif grep -qiE 'timed out|Max retries|Connection|ServiceUnavailable|TooManyRequests|RetryableError' temp/classify.txt; then
              echo "::error::TRANSIENT: ARM did not complete the deployment. Check the deployment lhds-${GITHUB_RUN_ID} in the portal for what was created, then re-run with allow_existing_hub=true."
            else
              echo "::error::UNCLASSIFIED deployment failure: $(head -c 700 temp/classify.txt)"
            fi
            exit 1
          fi

      # ISSUER VIA FRONT DOOR (#5410). Front Door raises a Private Link connection on the hub environment
      # for the new origin; it is Pending until approved, and ARM does not approve it. Same script the
      # console path uses (scripts/csa-loom/approve-cae-private-endpoints.sh): idempotent, every az exit
      # classified, an unreadable list is an UNKNOWN that exits non-zero (never "nothing pending").
      # --require-one: Front Door is known to be in play, so zero connections is a defect, not a no-op.
      - name: Approve the Front Door private-endpoint connection on the hub environment
        id: fdapprove
        if: ${{ steps.verdict.outputs.standdown != 'true' && inputs.run_mode == 'full' && steps.hub.outputs.fd_profile != '' }}
        env:
          CAE_ID: ${{ steps.hub.outputs.cae_id }}
        run: |
          set -uo pipefail
          if [ "$(jq -r '.healthIssuerState.value.viaFrontDoor' temp/outputs.json)" != "true" ]; then
            echo "::error::A Front Door profile was resolved but the deployment reports the issuer is NOT served through it: $(jq -c '.healthIssuerState.value' temp/outputs.json | head -c 600)"
            exit 1
          fi
          bash scripts/csa-loom/approve-cae-private-endpoints.sh --cae-id "$CAE_ID" --require-one
          # The script exits 0 only when no connection remains Pending (it re-reads the list).
          echo "::notice::Front Door private-endpoint connection(s) on the hub environment approved; none pending."

      # Prove the issuer answers through Front Door (the receipt for #5410), with a negative control:
      # the route is /auth/* only, so /api/health/* must NOT be served on the same host. Bounded wait (Front
      # Door applies a new route and a newly approved Private Link asynchronously); fails closed.
      - name: Verify the issuer through Front Door
        id: fdverify
        if: ${{ steps.verdict.outputs.standdown != 'true' && inputs.run_mode == 'full' && steps.hub.outputs.fd_profile != '' }}
        run: |
          set -uo pipefail
          set +e
          HOST=$(jq -r '.healthIssuerState.value.frontDoorEndpointHost // ""' temp/outputs.json)
          ISSUER=$(jq -r '.healthIssuerState.value.issuerUrl // ""' temp/outputs.json)
          if [ -z "$HOST" ] || [ -z "$ISSUER" ]; then
            echo "::error::The deploy outputs carry no Front Door issuer host (host='$HOST', issuer='$ISSUER'), so the issuer cannot be verified."
            exit 1
          fi
          CODE=000
          for i in $(seq 1 "${VERIFY_ATTEMPTS:-40}"); do
            CODE=$(curl -sS -o temp/oidc.json -w '%{http_code}' --max-time 20 "https://$HOST/auth/.well-known/openid-configuration" 2> temp/oidc.err)
            [ "$CODE" = "200" ] && break
            echo "attempt $i: HTTP $CODE (Front Door and the Private Link apply asynchronously)"
            sleep 15
          done
          if [ "$CODE" != "200" ]; then
            echo "::error::https://$HOST/auth/.well-known/openid-configuration answered HTTP $CODE after ${VERIFY_ATTEMPTS:-40} attempts 15s apart (curl: $(head -c 200 temp/oidc.err)). The deployment succeeded; the issuer is NOT verified reachable. Check the origin health in Front Door and the connection state on the hub environment."
            exit 1
          fi
          GOT=$(jq -r '.issuer // ""' temp/oidc.json)
          if [ "$GOT" != "$ISSUER" ]; then
            echo "::error::The issuer metadata is served but its issuer is '$GOT', not the configured '$ISSUER'."
            exit 1
          fi
          # The route also carries /api/health/pdp/* (#5422). Without a token the control plane must answer 401. A newly added
          # route takes Front Door's edge about 10 minutes to propagate (measured live, run 44973459903: 404 for ~9 minutes after ARM
          # reported the route Succeeded), and until then the edge answers 404 with its OWN page. So this probe retries, bounded, on 404
          # ONLY (propagation shows up as 404, same as the issuer check above). Any other answer ends the loop at once: 401 passes;
          # 200 means no authentication and 403 or anything else means the authentication in front of it is not what it should be.
          STAMP=$(jq -r '.healthStamp.value.stampName // ""' temp/outputs.json)
          if [ -z "$STAMP" ]; then echo "::error::The deploy outputs carry no stamp name, so the PDP path cannot be probed."; exit 1; fi
          PDPCODE=000
          PDP_START=$SECONDS
          for i in $(seq 1 "${VERIFY_ATTEMPTS:-40}"); do
            PDPCODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$HOST/api/health/pdp/stamps/$STAMP/verification-key" 2> temp/pdpneg.err)
            [ "$PDPCODE" != "404" ] && break
            echo "attempt $i: HTTP 404 on the PDP path (a new Front Door route takes minutes to reach the edge)"
            sleep 15
          done
          PDP_ELAPSED=$((SECONDS - PDP_START))
          if [ "$PDPCODE" = "404" ]; then
            echo "::error::https://$HOST/api/health/pdp/stamps/$STAMP/verification-key still answered HTTP 404 to an unauthenticated request after ${VERIFY_ATTEMPTS:-40} attempts (about ${PDP_ELAPSED}s). Most likely cause (NOT proven): the Front Door route has not propagated to the edge yet (seen to take about 10 minutes); the other possibility is that the route does not carry /api/health/pdp/*. Check the route patterns in the portal, then re-run. curl: $(head -c 200 temp/pdpneg.err)"
            exit 1
          fi
          if [ "$PDPCODE" != "401" ]; then
            echo "::error::https://$HOST/api/health/pdp/stamps/$STAMP/verification-key answered HTTP $PDPCODE to an UNAUTHENTICATED request; expected 401 from the control plane (200 = no authentication). Not retried: only 404 is a propagation signal. curl: $(head -c 200 temp/pdpneg.err)"
            exit 1
          fi
          # NEGATIVE CONTROL, deliberately AFTER the PDP probe and deliberately single-shot: 404 is its PASS condition, so a retry
          # could only turn a real 401/200 into a pass by waiting. It runs once the PDP path has answered 401, so it reads the
          # propagated route configuration rather than a stale one.
          NEG=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$HOST/api/health/tenants" 2> temp/neg.err)
          if [ "$NEG" = "200" ] || [ "$NEG" = "401" ] || [ "$NEG" = "403" ]; then
            echo "::error::NEGATIVE CONTROL FAILED: https://$HOST/api/health/tenants answered HTTP $NEG, so the control plane API is reachable on the issuer endpoint. The route must match /auth/* only."
            exit 1
          fi
          echo "::notice::Issuer verified through Front Door: https://$HOST/auth/.well-known/openid-configuration returned 200 with issuer $GOT; /api/health/tenants answered HTTP $NEG (not served); /api/health/pdp/* answered HTTP $PDPCODE without a token (served, authenticated)."

      # PDP BUNDLE VERIFICATION KEY (#5422, operator decision 6). The control plane signs PDP bundles with a
      # non-exportable Key Vault key and serves the PUBLIC half at /api/health/pdp/stamps/<stamp>/verification-key.
      # The stamp vault is private, so this runner cannot read it; the control plane is reached through Front Door
      # (the route that serves /api/health/pdp/*), as the deploy principal, which holds HealthCP.Admin and a caller
      # allowlist entry from csa-loom-post-deploy-bootstrap. The key then goes to the phase-2 deploy as
      # pdpBundleVerificationPublicKeyPem. Bounded wait (the control plane registers the stamp and reads the key
      # after it starts). The token is masked and never printed.
      #
      # THIS STEP DOES NOT FAIL THE JOB. On a greenfield run bootstrap has not granted the deploy principal anything
      # yet, so a 403 is expected, and failing here would skip TLS phase 2, which has nothing to do with the PDP
      # (a regression from before the PDP existed). Instead a failure records fetched=false and a one-line TRUE reason,
      # raises a ::warning:: and a step-summary entry, and the job FAILS LAST in "Fail the run when the PDP was not
      # deployed" below, after TLS, the console bind and the rest have run. Chosen over a warning alone because a
      # green run over an undeployed PDP is exactly the silent-green deploy-integrity R2 forbids.
      - name: Fetch the PDP bundle verification key through Front Door
        id: pdpkey
        if: ${{ steps.verdict.outputs.standdown != 'true' && inputs.run_mode == 'full' && steps.hub.outputs.fd_profile != '' }}
        env:
          AUDIENCES: ${{ steps.audiences.outputs.audiences }}
          KEY_ATTEMPTS: ${{ vars.LOOM_HEALTH_PDP_KEY_ATTEMPTS || '20' }}
        run: |
          set -uo pipefail
          set +e
          skip_pdp() { # $1 = one-line reason. Never fails the step: TLS and the console bind must still run.
            MSG=$(printf '%s' "$1" | tr '\r\n' '  ' | head -c 900)
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            echo "reason=$MSG" >> "$GITHUB_OUTPUT"
            echo "::warning::PDP NOT deployed by this run: $MSG"
            {
              echo "### deploy-health: PDP NOT deployed ($BOUNDARY)"
              echo
              echo "$MSG"
              echo
              echo "TLS phase 2 and the console bind still run. This job is failed at its end so the run is not read as a deployed PDP."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          if [ "$(jq -r '.healthControlPlaneState.value.deployed' temp/outputs.json)" != "true" ]; then
            skip_pdp "the control plane was not deployed by this run ($(jq -r '.healthControlPlaneState.value.reason // "no reason reported"' temp/outputs.json)), so there is no bundle key to fetch."
          fi
          HOST=$(jq -r '.healthIssuerState.value.frontDoorEndpointHost // ""' temp/outputs.json)
          STAMP=$(jq -r '.healthStamp.value.stampName // ""' temp/outputs.json)
          AUD=$(printf '%s' "$AUDIENCES" | tr ',' '\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' | grep -E '^api://' | head -n 1)
          [ -n "$AUD" ] || AUD=$(printf '%s' "$AUDIENCES" | tr ',' '\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' | grep -v '^$' | head -n 1)
          if [ -z "$HOST" ] || [ -z "$STAMP" ] || [ -z "$AUD" ]; then
            skip_pdp "the deploy outputs gave host='$HOST', stamp='$STAMP', audience='$AUD', so the verification key cannot be requested (template defect)."
          fi
          RC=0; TOKEN=$(az account get-access-token --resource "$AUD" --query accessToken -o tsv 2> temp/tok.err) || RC=$?
          if [ "$RC" != "0" ] || [ -z "$TOKEN" ]; then
            skip_pdp "could not get a token for the control plane audience $AUD as the deploy principal (az: $(head -c 300 temp/tok.err))."
          fi
          echo "::add-mask::$TOKEN"
          umask 077
          printf 'authorization: Bearer %s\n' "$TOKEN" > temp/pdp-hdr.txt
          URL="https://$HOST/api/health/pdp/stamps/$STAMP/verification-key"
          CODE=000
          for i in $(seq 1 "$KEY_ATTEMPTS"); do
            CODE=$(curl -sS -o temp/pdp-key.json -w '%{http_code}' --max-time 20 -H @temp/pdp-hdr.txt "$URL" 2> temp/pdp-key.err)
            [ "$CODE" = "200" ] && break
            ERRCODE=$(jq -r '.error.code // ""' temp/pdp-key.json 2> temp/pdp-key.jqerr)
            case "$CODE" in
              401) skip_pdp "the control plane answered 401 for the deploy principal's token (audience $AUD): the token was not accepted. Check LOOM_HEALTH_CP_AUDIENCE on loom-health-cp against $AUD." ;;
              403) skip_pdp "the control plane answered 403: the deploy principal lacks the HealthCP role or its client id is not on the caller allowlist. On a first (greenfield) run csa-loom-post-deploy-bootstrap has not granted the CI service principal HealthCP.Admin yet: run it, then re-run this lane." ;;
            esac
            echo "attempt $i/$KEY_ATTEMPTS: HTTP $CODE ${ERRCODE:+(code $ERRCODE)} (404 = stamp not self-registered yet; 503 = key not readable yet; Front Door applies asynchronously)"
            sleep 15
          done
          if [ "$CODE" != "200" ]; then
            skip_pdp "GET $URL answered HTTP $CODE ${ERRCODE:+(code $ERRCODE)} after $KEY_ATTEMPTS attempts 15s apart (curl: $(head -c 200 temp/pdp-key.err)). Established: the control plane was deployed. NOT established: why. 404 means the stamp is not registered (check the control plane logs for stamp.self_register); 503 bundle_key_unconfigured means LOOM_HEALTH_CP_PDP_SIGNING_KEY_ID is not set on it; 503 bundle_key_unavailable means it could not read the Key Vault key (the identity needs Key Vault Crypto User on lhds-pdp-bundle-sign and a private-endpoint path to the vault)."
          fi
          jq -r '.data.publicKeyPem // ""' temp/pdp-key.json > temp/pdp-key.pub
          KEYID=$(jq -r '.data.keyId // ""' temp/pdp-key.json)
          if [ "$KEYID" != "global" ]; then skip_pdp "the control plane reports bundle key id '$KEYID', but the PDP is configured to verify with key id 'global' (engines.bicep): a PDP deployed now could never verify a bundle."; fi
          if ! openssl pkey -pubin -noout -text -in temp/pdp-key.pub > temp/pdp-key.txt 2> temp/pdp-key.oerr; then skip_pdp "the control plane returned something that is not a PEM public key ($(head -c 200 temp/pdp-key.oerr))."; fi
          if ! grep -qE 'prime256v1|P-256' temp/pdp-key.txt; then skip_pdp "the control plane's bundle key is not EC P-256; bundle signatures are ES256."; fi
          jq --rawfile pem temp/pdp-key.pub '. + {pdpBundleVerificationPublicKeyPem: $pem}' temp/cp.json > temp/cp.next.json || skip_pdp "could not add the PDP verification key to temp/cp.json."
          mv temp/cp.next.json temp/cp.json
          rm -f temp/pdp-hdr.txt
          echo "fetched=true" >> "$GITHUB_OUTPUT"
          echo "::notice::PDP bundle verification key fetched through Front Door (EC P-256, key id global); it goes to the phase-2 deploy."

      # INGRESS TLS, two phases (#5345). Phase 1 (the step above) deployed the stamp WITHOUT a TLS
      # listener and the control plane, which issues the ingress certificate in the stamp vault (a
      # deploymentScript cannot run where policy forces storage shared-key access off). The gateway
      # resolves its Key Vault secret at creation, so the listener is built only once the secret exists.
      # Existence is read from the ARM management plane (Microsoft.KeyVault/vaults/secrets GET works on
      # a private vault; the runner cannot reach the data plane). Fails closed after a bounded wait.
      - name: Wait for the control-plane-issued ingress certificate (phase 1 to 2)
        id: tlswait
        if: ${{ steps.verdict.outputs.standdown != 'true' && inputs.run_mode == 'full' }}
        run: |
          set -uo pipefail
          set +e
          MODE=$(jq -r '.healthStamp.value.ingressTlsMode // "unknown"' temp/outputs.json)
          if [ "$MODE" != "selfSignedPending" ]; then
            echo "::notice::Ingress TLS mode is $MODE: no control-plane-issued certificate is awaited (supplied certificate, self-signed TLS off, or the listener already exists)."
            echo "wait=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(jq -r '.healthControlPlaneState.value.deployed' temp/outputs.json)" != "true" ]; then
            echo "::warning::The stamp has NO TLS listener: the control plane issues the ingress certificate and it was not deployed ($(jq -r '.healthControlPlaneState.value.reason' temp/outputs.json)). Set control_plane_audiences or healthConfig.tlsCertificateSecretUri. Port 80 only redirects until then."
            echo "wait=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KV_ID=$(jq -r '.healthStamp.value.keyVaultId' temp/outputs.json)
          CERT=$(jq -r '.healthStamp.value.ingressTlsCertificateName' temp/outputs.json)
          URI=$(jq -r '.healthStamp.value.ingressTlsExpectedIssuedSecretUri' temp/outputs.json)
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ] || [ -z "$CERT" ] || [ "$CERT" = "null" ] || [ -z "$URI" ] || [ "$URI" = "null" ]; then
            echo "::error::The stamp manifest has no keyVaultId / ingressTlsCertificateName / ingressTlsExpectedIssuedSecretUri, so the certificate cannot be looked up. This is a template defect."
            exit 1
          fi
          N=60
          for i in $(seq 1 "$N"); do
            MSYS_NO_PATHCONV=1 az resource show --ids "$KV_ID/secrets/$CERT" --api-version 2024-11-01 -o json > temp/tls-secret.json 2> temp/tls-secret.err
            RC=$?
            if [ "$RC" = "0" ]; then
              if [ "$(jq -r '.properties.attributes.enabled' temp/tls-secret.json)" = "true" ]; then
                echo "Certificate secret $CERT exists and is enabled (attempt $i)."
                echo "wait=true" >> "$GITHUB_OUTPUT"
                echo "uri=$URI" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "attempt $i: secret $CERT exists but is not enabled yet"
            elif grep -qiE 'ResourceNotFound|NotFound|could not be found|was not found' temp/tls-secret.err; then
              echo "attempt $i: secret $CERT not in the vault yet (the control plane issues it at startup)"
            else
              echo "::error::Could not read the vault secret through ARM, so whether the certificate exists is UNKNOWN (not a claim that it is missing). Exit $RC: $(head -c 500 temp/tls-secret.err). The deploy principal needs Microsoft.KeyVault/vaults/secrets/read on the stamp vault."
              exit 1
            fi
            sleep 20
          done
          echo "::error::The ingress certificate secret $CERT is not in the stamp vault after about $((N * 20 / 60)) minutes, per the ARM management plane. Established: the control plane was deployed. NOT established: whether it ran. Check, in order: the control-plane logs for tls.ingress_cert_error (a 403 names the missing Key Vault Certificates Officer role; a network error names the private endpoint path); that the loom-health-cp image was built from a commit that contains apps/loom-health-cp/src/tls (full-app-deploy-commercial.yml / gov-provision-dataplane-images.yml) and the app rolled onto it."
          exit 1

      # Phase 2 carries up to two inputs that only exist after phase 1: the issued TLS secret URI (#5345) and the PDP
      # bundle verification key (#5422). Both ride ONE az deployment (roll-race pins the write count of this workflow).
      - name: Deploy health.bicep phase 2 (TLS listener on the issued certificate, stamp PDP)
        id: phase2
        if: ${{ steps.verdict.outputs.standdown != 'true' && inputs.run_mode == 'full' && (steps.tlswait.outputs.wait == 'true' || steps.pdpkey.outputs.fetched == 'true') }}
        env:
          PF: ${{ steps.params.outputs.pf }}
          HUB_LOCATION: ${{ steps.params.outputs.hub_location }}
          TLS_URI: ${{ steps.tlswait.outputs.uri }}
          PDP_FETCHED: ${{ steps.pdpkey.outputs.fetched }}
        run: |
          set -uo pipefail
          set +e
          CP_ARG=()
          if [ -f temp/cp.json ]; then CP_ARG=(--parameters controlPlaneConfig=@temp/cp.json); fi
          TLS_ARG=()
          if [ -n "$TLS_URI" ]; then TLS_ARG=(--parameters issuedTlsSecretUri="$TLS_URI"); fi
          az deployment sub create --name "lhds-${GITHUB_RUN_ID}-tls" --location "$HUB_LOCATION" \
            --template-file platform/fiab/bicep/health.bicep --parameters "$PF" \
            --parameters healthEnabled=true adminEntraGroupId="$ADMIN_GROUP" "${TLS_ARG[@]}" "${CP_ARG[@]}" \
            --query properties.outputs -o json > temp/outputs-phase2.json 2> temp/apply2.err
          RC=$?
          if [ "$RC" != "0" ]; then
            echo "::error::Phase 2 (TLS listener: ${TLS_URI:-not requested}; PDP key: ${PDP_FETCHED:-no}) failed with exit $RC: $(head -c 900 temp/apply2.err). Phase 1 succeeded, so the stamp exists without what phase 2 adds; re-run with allow_existing_hub=true after fixing the cause."
            exit 1
          fi
          if [ -n "$TLS_URI" ]; then
            if [ "$(jq -r '.healthStamp.value.ingressTlsMode' temp/outputs-phase2.json)" != "selfSigned" ] || [ "$(jq -r '.healthStamp.value.ingressTlsConfigured' temp/outputs-phase2.json)" != "true" ]; then
              echo "::error::Phase 2 deployed but the gateway has no HTTPS listener (ingressTlsMode=$(jq -r '.healthStamp.value.ingressTlsMode' temp/outputs-phase2.json), ingressTlsConfigured=$(jq -r '.healthStamp.value.ingressTlsConfigured' temp/outputs-phase2.json))."
              exit 1
            fi
            echo "::notice::Ingress TLS listener built on $TLS_URI (versionless: renewals roll without a redeploy)."
          fi
          # The verification key was fetched, so a PDP that did NOT deploy is a defect, never a quiet skip.
          if [ "$PDP_FETCHED" = "true" ] && [ "$(jq -r '.healthPdpState.value.deployed' temp/outputs-phase2.json)" != "true" ]; then
            echo "::error::The PDP verification key was fetched but the deployment reports the PDP is NOT deployed: $(jq -r '.healthPdpState.value.reason // "no reason reported"' temp/outputs-phase2.json)"
            exit 1
          fi
          mv temp/outputs-phase2.json temp/outputs.json

      # The gateway is public: prove it presents a certificate for ITS OWN FQDN, not just that a
      # listener exists. Bounded retries (the gateway applies the new listener asynchronously).
      - name: Verify the ingress presents the issued certificate
        if: ${{ steps.verdict.outputs.standdown != 'true' && inputs.run_mode == 'full' && steps.tlswait.outputs.wait == 'true' }}
        run: |
          set -uo pipefail
          set +e
          FQDN=$(jq -r '.healthStamp.value.ingressPublicFqdn' temp/outputs.json)
          if [ -z "$FQDN" ] || [ "$FQDN" = "null" ]; then echo "::error::The stamp manifest has no ingressPublicFqdn."; exit 1; fi
          for i in $(seq 1 20); do
            echo | openssl s_client -connect "$FQDN:443" -servername "$FQDN" > temp/s_client.out 2> temp/s_client.err
            if openssl x509 -in temp/s_client.out -noout -subject -ext subjectAltName > temp/cert.txt 2> temp/cert.err; then
              if grep -qE "CN ?= ?$FQDN" temp/cert.txt && grep -q "DNS:$FQDN" temp/cert.txt; then
                echo "Ingress presents a certificate with subject CN=$FQDN and SAN DNS:$FQDN (attempt $i)."
                exit 0
              fi
              echo "::error::The ingress at $FQDN:443 presents a certificate that is NOT for that host: $(tr '\n' ' ' < temp/cert.txt | head -c 400)"
              exit 1
            fi
            echo "attempt $i: no certificate yet from $FQDN:443 ($(head -c 200 temp/s_client.err | tr '\n' ' '))"
            sleep 30
          done
          echo "::error::No TLS certificate was presented by $FQDN:443 after 10 minutes, so the HTTPS listener is not serving (or not reachable from this runner). Not established: why."
          exit 1

      # Never report success over an unverified outcome (deploy-integrity R6): the
      # template exits 0 when the control plane is SKIPPED, so read its own state back.
      - name: Verify what was deployed
        if: ${{ steps.verdict.outputs.standdown != 'true' && inputs.run_mode == 'full' }}
        env:
          AUDIENCES: ${{ steps.audiences.outputs.audiences }}
        run: |
          set -euo pipefail
          jq -e '.healthStamp.value.stampName' temp/outputs.json > /dev/null || { echo "::error::The deployment returned no stamp manifest, so no stamp was created. healthEnabled=true was passed, so this is the PostgreSQL gate (healthConfig.postgres) or a template defect."; exit 1; }
          DEPLOYED=$(jq -r '.healthControlPlaneState.value.deployed' temp/outputs.json)
          {
            echo "### deploy-health: APPLIED ($BOUNDARY)"
            echo
            echo "Stamp: $(jq -r '.healthStamp.value.stampName' temp/outputs.json) in $(jq -r '.healthStamp.value.resourceGroup' temp/outputs.json)"
            echo "Control plane: $(jq -c '.healthControlPlaneState.value' temp/outputs.json)"
            echo
            echo "Deployed, NOT verified live: no request to the control plane health route was made."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUDIENCES" != "" ] && [ "$DEPLOYED" != "true" ]; then
            echo "::error::control plane audiences were resolved but the control plane was NOT deployed: $(jq -r '.healthControlPlaneState.value.reason' temp/outputs.json)"
            exit 1
          fi
          # A control plane missing any authorization-server value crash-loops (run 43333990195).
          if [ "$DEPLOYED" = "true" ] && [ "$(jq -r '.healthControlPlaneState.value.authServerMissing | length' temp/outputs.json)" != "0" ]; then
            echo "::error::the control plane deployed WITHOUT authorization-server values and will not start: missing $(jq -c '.healthControlPlaneState.value.authServerMissing' temp/outputs.json)."
            exit 1
          fi

      # AUTO-BIND (#5346): nothing bound LOOM_HEALTH_CP_URL / LOOM_HEALTH_CP_AUDIENCE /
      # LOOM_HEALTH_DEFAULT_STAMP_ID into the console, so an operator hand-set them in /admin/env-config.
      # The producer binds them here, from what this run just deployed. Read from the deploy outputs, set
      # on the one loom-console app, read back. Idempotent: a console that already carries the three
      # values gets no new revision. DURABILITY, stated: admin-plane/main.bicep renders these three env
      # vars from observabilityConfig.healthCp*, so a later deploy-fiab-commercial that does not carry
      # those params resets them; re-running this lane re-binds. See the PR for the follow-up.
      - name: Bind the health control plane into the console
        id: bind
        if: ${{ steps.verdict.outputs.standdown != 'true' && inputs.run_mode == 'full' }}
        env:
          AUDIENCES: ${{ steps.audiences.outputs.audiences }}
        run: |
          set -uo pipefail
          set +e
          if [ "$(jq -r '.healthControlPlaneState.value.deployed' temp/outputs.json)" != "true" ]; then
            echo "::notice::The control plane was not deployed by this run, so there is nothing to bind into the console."
            exit 0
          fi
          FQDN=$(jq -r '.healthControlPlaneState.value.fqdn // ""' temp/outputs.json)
          STAMP=$(jq -r '.healthStamp.value.stampName // ""' temp/outputs.json)
          # The token scope is <audience>/.default for the FIRST audience: prefer the api:// form.
          AUD=$(printf '%s' "$AUDIENCES" | tr ',' '\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' | grep -E '^api://' | head -n 1)
          [ -n "$AUD" ] || AUD=$(printf '%s' "$AUDIENCES" | tr ',' '\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' | grep -v '^$' | head -n 1)
          if [ -z "$FQDN" ] || [ -z "$AUD" ] || [ -z "$STAMP" ]; then
            echo "::error::Cannot bind the console: the deploy outputs gave fqdn='$FQDN', stamp='$STAMP', audience='$AUD'. The control plane IS deployed; the console was NOT bound. Set LOOM_HEALTH_CP_URL, LOOM_HEALTH_CP_AUDIENCE and LOOM_HEALTH_DEFAULT_STAMP_ID by hand until this is fixed."
            exit 1
          fi
          URL="https://$FQDN"
          az containerapp list --query "[?name=='loom-console'].{id:id,rg:resourceGroup,env:properties.template.containers[0].env}" -o json > temp/console.json 2> temp/console.err
          RC=$?
          if [ "$RC" != "0" ]; then
            echo "::error::Could not LIST Container Apps to find loom-console (az exit $RC: $(head -c 300 temp/console.err)), so whether it exists is UNKNOWN. The control plane IS deployed; the console was NOT bound."
            exit 1
          fi
          N=$(jq 'length' temp/console.json 2> /dev/null)
          if ! printf '%s' "$N" | grep -Eq '^[0-9]+$'; then
            echo "::error::The loom-console lookup returned output that could not be parsed as a JSON list (got '$(head -c 120 temp/console.json)'), so whether loom-console exists is UNKNOWN. The control plane IS deployed; the console was NOT bound."
            exit 1
          fi
          if [ "$N" != "1" ]; then
            echo "::error::Found $N Container Apps named loom-console in this subscription; exactly 1 is required and this lane will not guess which to bind. The control plane IS deployed; the console was NOT bound."
            exit 1
          fi
          CRG=$(jq -r '.[0].rg' temp/console.json)
          cur() { jq -r --arg n "$1" '[.[0].env[]? | select(.name==$n) | .value] | first // ""' temp/console.json; }
          if [ "$(cur LOOM_HEALTH_CP_URL)" = "$URL" ] && [ "$(cur LOOM_HEALTH_CP_AUDIENCE)" = "$AUD" ] && [ "$(cur LOOM_HEALTH_DEFAULT_STAMP_ID)" = "$STAMP" ]; then
            echo "::notice::loom-console in $CRG already carries LOOM_HEALTH_CP_URL, LOOM_HEALTH_CP_AUDIENCE and LOOM_HEALTH_DEFAULT_STAMP_ID with these values; nothing written."
            echo "### deploy-health: console binding unchanged ($BOUNDARY)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          az containerapp update -n loom-console -g "$CRG" --set-env-vars "LOOM_HEALTH_CP_URL=$URL" "LOOM_HEALTH_CP_AUDIENCE=$AUD" "LOOM_HEALTH_DEFAULT_STAMP_ID=$STAMP" -o none 2> temp/bind.err
          RC=$?
          if [ "$RC" != "0" ]; then
            if grep -qiE 'AuthorizationFailed|does not have authorization' temp/bind.err; then
              echo "::error::PERMISSION: the deploy principal cannot update loom-console in $CRG (needs Contributor on it). The control plane IS deployed; the console was NOT bound. az said: $(head -c 300 temp/bind.err)"
            else
              echo "::error::az containerapp update on loom-console failed (exit $RC): $(head -c 400 temp/bind.err). The control plane IS deployed; the console was NOT bound."
            fi
            exit 1
          fi
          az containerapp show -n loom-console -g "$CRG" --query "properties.template.containers[0].env" -o json > temp/console-after.json 2> temp/console-after.err
          RC=$?
          if [ "$RC" != "0" ]; then
            echo "::error::The update was accepted but loom-console could not be read back (az exit $RC: $(head -c 300 temp/console-after.err)), so the binding is UNVERIFIED."
            exit 1
          fi
          after() { jq -r --arg n "$1" '[.[]? | select(.name==$n) | .value] | first // ""' temp/console-after.json; }
          BAD=""
          [ "$(after LOOM_HEALTH_CP_URL)" = "$URL" ] || BAD="$BAD LOOM_HEALTH_CP_URL"
          [ "$(after LOOM_HEALTH_CP_AUDIENCE)" = "$AUD" ] || BAD="$BAD LOOM_HEALTH_CP_AUDIENCE"
          [ "$(after LOOM_HEALTH_DEFAULT_STAMP_ID)" = "$STAMP" ] || BAD="$BAD LOOM_HEALTH_DEFAULT_STAMP_ID"
          if [ -n "$BAD" ]; then
            echo "::error::Read-back FAILED: loom-console does not carry the intended value for:$BAD."
            exit 1
          fi
          {
            echo "### deploy-health: console bound ($BOUNDARY)"
            echo
            echo "loom-console in $CRG now has LOOM_HEALTH_CP_URL=$URL, LOOM_HEALTH_CP_AUDIENCE=$AUD, LOOM_HEALTH_DEFAULT_STAMP_ID=$STAMP (read back)."
            echo "Bound, NOT verified live. The stamp id is the deployed stamp name; whether the control plane has it registered and healthy is not checked here."
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs AFTER the console bind on purpose: the first apply fails at rollout (exit 5) until a signed bundle is
      # published and the PDP identity is on the allowlist, and that must not skip the console auto-bind (#5346) or anything
      # else. A failure here still fails the job.
      # STAMP PDP DELIVERY (#5422). health.bicep deploys the PDP's ARM resources and RENDERS its manifest as the
      # output healthPdpState.manifest (single source of truth: engines.bicep). Nothing in ARM can apply a
      # manifest here (no deploymentScripts: policy forces storage shared-key off), so it is applied through
      # `az aks command invoke` by scripts/csa-loom/aks-apply-manifest.sh, which reads every exit code and
      # waits, bounded, for the Deployment to be Ready. The PDP is not Ready until a SIGNED bundle is active, so
      # a stamp with no published bundle fails HERE, loudly, and is never reported as deployed.
      - name: Apply the stamp PDP manifest (az aks command invoke)
        id: pdpapply
        if: ${{ steps.verdict.outputs.standdown != 'true' && inputs.run_mode == 'full' }}
        run: |
          set -uo pipefail
          set +e
          if [ "$(jq -r '.healthPdpState.value.deployed' temp/outputs.json)" != "true" ]; then
            echo "::warning::The stamp PDP was not deployed by this run ($(jq -r '.healthPdpState.value.reason // "no reason reported"' temp/outputs.json)), so there is no manifest to apply."
            echo "Stamp PDP: NOT deployed ($(jq -r '.healthPdpState.value.reason // "no reason reported"' temp/outputs.json))." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          RG=$(jq -r '.healthPdpState.value.resourceGroup // ""' temp/outputs.json)
          CLUSTER=$(jq -r '.healthPdpState.value.aksClusterName // ""' temp/outputs.json)
          NS=$(jq -r '.healthPdpState.value.namespace // ""' temp/outputs.json)
          DEP=$(jq -r '.healthPdpState.value.deploymentName // ""' temp/outputs.json)
          jq -r '.healthPdpState.value.manifest // ""' temp/outputs.json > temp/pdp-manifest.yaml
          if [ -z "$RG" ] || [ -z "$CLUSTER" ] || [ -z "$NS" ] || [ -z "$DEP" ] || ! grep -q '^kind: Deployment' temp/pdp-manifest.yaml; then
            echo "::error::healthPdpState says deployed but lacks what the apply needs (resourceGroup='$RG', cluster='$CLUSTER', namespace='$NS', deployment='$DEP', manifest bytes=$(wc -c < temp/pdp-manifest.yaml)). This is a template defect."
            exit 1
          fi
          bash scripts/csa-loom/aks-apply-manifest.sh --resource-group "$RG" --cluster "$CLUSTER" --namespace "$NS" --deployment "$DEP" --manifest temp/pdp-manifest.yaml
          RC=$?
          if [ "$RC" != "0" ]; then
            echo "::error::The stamp PDP manifest was NOT confirmed applied and Ready (aks-apply-manifest.sh exit $RC: 3 permission, 4 kubectl failure, 5 not Ready in time, 6 outcome unknown, 2 usage). The infrastructure deployment itself succeeded; the cause is in the step output above."
            exit 1
          fi
          echo "Stamp PDP: manifest applied and $NS/$DEP rolled out in $CLUSTER (read back from kubectl)." >> "$GITHUB_STEP_SUMMARY"

      # LAST STEP (#5422). TLS phase 2 and the console bind have run by now. If the PDP key could not be fetched the PDP was
      # not deployed, and this run must not read as a deployed PDP: fail it here with the reason the fetch step recorded.
      # (A failed manifest apply fails its own step above; this covers the case where there was nothing to apply.)
      - name: Fail the run when the PDP was not deployed
        if: ${{ !cancelled() && steps.verdict.outputs.standdown != 'true' && inputs.run_mode == 'full' && steps.pdpkey.outputs.fetched == 'false' }}
        env:
          PDP_REASON: ${{ steps.pdpkey.outputs.reason }}
        run: |
          set -uo pipefail
          echo "::error::The stamp PDP was NOT deployed: ${PDP_REASON:-no reason recorded}. The rest of the lane (infrastructure, TLS, console bind) completed; re-run after fixing the above."
          exit 1
