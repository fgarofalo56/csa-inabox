name: "CodeQL Analysis"

on:
  # The push filter MUST cover the same source globs as the pull_request filter
  # below. It did not: it listed only `**.py` and `portal/**`, so a merge that
  # changed TypeScript never re-analyzed main. JS/TS alerts on main could then
  # only refresh on the Monday cron or on an incidental Python/portal push.
  #
  # Measured 2026-07-30: main was at f70cd57e after ~23 merges that day, while
  # the newest CodeQL `/language:javascript-typescript` analysis on main was
  # 395bc151 from 09:45Z. The alert list still showed 41 js/incomplete-
  # sanitization and 31 js/polynomial-redos — the two classes #2677 had just
  # closed (79 triaged, 76 fixed). The findings were not open; the SCAN was old.
  #
  # That is worse than a slow gate. The code-scanning list is the artifact this
  # repo triages from, and for its dominant language it could be up to a week
  # behind — so fixed alerts keep being re-reported and re-worked, and genuinely
  # new ones sit unseen for the same window.
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - '**.mjs'
      - '**.cjs'
      - 'portal/**'
      - 'apps/**'
      - '.github/workflows/codeql.yml'
  # On demand: after landing a security sweep you need the alert list to reflect
  # the fix NOW, to confirm the class actually closed rather than waiting for
  # Monday and triaging against stale data.
  workflow_dispatch:
  # rel-T27 / B13: also analyze on PRs so security findings surface BEFORE merge,
  # not only after landing on main / on the weekly cron. Path-filtered to source
  # for both analyzed languages (python + javascript-typescript) so doc/bicep-only
  # PRs don't pay the ~build+analyze cost. Not wired as a required check here —
  # the orchestrator owns branch protection.
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - '**.mjs'
      - '**.cjs'
      - 'portal/**'
      - 'apps/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '37 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

# A merge burst spawned three concurrent analyses within 45 seconds on 08-03.
# With the larger JS/TS budget below that stacks badly, and only the newest
# commit actually needs analyzing. One in-progress run per ref, and a newly
# queued run supersedes any earlier *pending* one.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Per-language budget. Python interprets in ~2 minutes; JS/TS normally takes
    # 11-14 but a single pathological query can blow far past that (see below).
    # The JOB budget is deliberately larger than the ANALYSIS budget so that when
    # the analysis is killed there is still time left to REPORT it.
    timeout-minutes: ${{ matrix.jobTimeout }}

    # ── The follow-up #2876 named: WHICH remedy, decided by measurement ────────
    #
    # #2876 diagnosed the outage and made it loud, and explicitly left open
    # "deciding between a query exclusion, a --timeout, and a code change".
    # Two full `workflow_dispatch` analyses settle it. Dispatch, not
    # `pull_request`: a PR run is diff-informed (it passes
    # `--extension-packs=codeql-action/pr-diff-range`) and evaluated
    # HttpToFileAccess in 1.1s against 22–25s on the full database, so a green PR
    # check proves nothing about this.
    #
    #   run 30814347795 — `--timeout=600` ONLY
    #       "1 of 105 queries timed out."
    #       "##[error]Error running analysis for javascript: Encountered a fatal
    #        error while running codeql database run-queries …"
    #       job FAILURE, 22.9 min; analysis recorded results=0 rules=0
    #
    #   run 30816595636 — plus the query-filter below
    #       104/105 started, 104 done, "Successfully uploaded results"
    #       job SUCCESS, 13.0 min; analysis recorded results=96 rules=102
    #
    # So `--timeout` alone does NOT restore the scan: `run-queries` exits
    # non-zero when any query times out, and the upload is still empty. It is
    # kept anyway, one rung below the 90-minute step budget, because it turns a
    # future pathological query red in ~23 minutes instead of ~90 and stops us
    # paying an hour and a half of runner time to learn the same thing.
    env:
      CODEQL_ACTION_EXTRA_OPTIONS: '{"database":{"run-queries":["--timeout=600"]}}'

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            analysisTimeout: 25
            jobTimeout: 35
          - language: javascript-typescript
            analysisTimeout: 90
            jobTimeout: 100

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # THE REMEDY THAT ACTUALLY RESTORES THE SCAN (measured — see the env
          # block above). An `exclude` filter removes the query from the set that
          # RUNS rather than filtering its output, which is the only reason it
          # helps: the problem is evaluation time, not results.
          #
          # js/http-to-file-access evaluated in 22–25s for months and stopped
          # terminating at 8022cec6 — the commit that CLOSED it (#2842). It then
          # took the whole javascript analysis down with it for 24 consecutive
          # commits. With it excluded the other 104 queries complete in 13.0 min,
          # back to the 12.9–14.1 min baseline, and the alert list comes back.
          #
          # There are currently ZERO open alerts of this rule (#2842 closed both),
          # so what is given up is future instances only — and it is given up
          # explicitly, in the tree, with a reason, rather than silently by a
          # timeout that also discards the other 104.
          #
          # CONTAINMENT, NOT A ROOT CAUSE. Delete this filter once the blow-up in
          # the #2842 build-context writer (apps/loom-cli/src/safe-path.ts,
          # commands/apps.ts) is diagnosed.
          config: |
            query-filters:
              - exclude:
                  id: js/http-to-file-access

      - name: Autobuild
        uses: github/codeql-action/autobuild@e46ed2cbd01164d986452f91f178727624ae40d7 # v3

      # The timeout lives on the STEP, not only the job. A job-level timeout
      # CANCELS the job: conclusion `cancelled`, no chance to report, and grey in
      # the checks list. A step-level timeout FAILS the step and leaves the job
      # budget to run the assertion below, which turns the whole run red.
      - name: Perform CodeQL Analysis
        id: analyze
        timeout-minutes: ${{ matrix.analysisTimeout }}
        uses: github/codeql-action/analyze@e46ed2cbd01164d986452f91f178727624ae40d7 # v3
        with:
          category: "/language:${{ matrix.language }}"

      # WHY THIS EXISTS — the 2026-08-03 silent scan outage.
      #
      # `Security/CWE-912/HttpToFileAccess.ql` went from 22.4s at 8c0b10b1 to
      # >17m56s and never terminated, so query 105/105 was still running when the
      # 30-minute job timeout fired. On that timeout the action uploads
      # `codeql-failed-run.sarif` (results_count 0 / rules_count 0 / error
      # "unsuccessful execution"). GitHub records it, correctly refuses to retire
      # alerts from it, and the alert list FREEZES at the last real scan while
      # still reading as current.
      #
      # 24 consecutive JS/TS runs died that way over ~10 hours. Every one showed
      # as `cancelled`, CodeQL is not a required check, so nothing blocked and
      # nothing paged — and six js/log-injection alerts that #2850 had already
      # fixed sat "open", inviting a second, redundant fix for code that was
      # never the problem.
      #
      # A scan that did not finish must look like a FAILURE, not a shrug.
      - name: Assert the analysis actually completed
        if: always()
        env:
          OUTCOME: ${{ steps.analyze.outcome }}
          LANGUAGE: ${{ matrix.language }}
          BUDGET: ${{ matrix.analysisTimeout }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ]; then
            echo "[codeql] ${LANGUAGE}: analysis completed and results were uploaded."
            exit 0
          fi
          echo "::error title=CodeQL ${LANGUAGE} analysis did not complete::outcome=${OUTCOME}. No results were evaluated, so a 'failed run' SARIF (0 rules / 0 results) was uploaded instead. GitHub does NOT retire alerts from that upload: the code-scanning list for ${LANGUAGE} is now FROZEN at the last real scan and will read as current while every merge since goes unscanned. Do not triage ${LANGUAGE} alerts until this is green. If this timed out at ${BUDGET}m, find the query that stopped terminating in the 'Perform CodeQL Analysis' log (the last 'Starting evaluation of' with no matching 'Evaluation done')."
          exit 1

