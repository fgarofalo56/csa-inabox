name: gov-provision-streaming-migrate

# CSA Loom — Gov IMAGE PRODUCER + provisioner for the two DEFAULT-ON data-plane
# Container Apps that close the `svc-loom-migrate` and `svc-loom-risingwave`
# gates:
#
#   apps/loom-migrate     → data-plane/loom-migrate-aca.bicep     → LOOM_MIGRATE_URL
#   apps/loom-risingwave  → data-plane/loom-risingwave-aca.bicep  → LOOM_RISINGWAVE_URL
#
# WHY THIS EXISTS. As of 2026-07-28 both modules are wired into
# admin-plane/main.bicep and deploy BY DEFAULT in every Container Apps boundary —
# Commercial, GCC, GCC-High and IL5 (params/{gcc-high,il5}.bicepparam both set
# containerPlatform='containerApps' + deployAppsEnabled=true). A Gov deploy
# therefore stands both apps up and sets both env vars with NO manual step,
# PROVIDED the images are already in the Gov ACR — the same precondition the
# Console image has. The canonical from-scratch order (no-vaporware.md) is:
#   1. provision infra with deployAppsEnabled=false
#   2. BUILD IMAGES  ← this workflow (mode=build-only), or
#      build-fiab-images-acr-tasks.yml with boundary=GCC-High for the full set
#   3. redeploy with apps enabled
#
# `az acr build` runs SERVER-SIDE inside Azure. That is the only mechanism that
# reaches a Gov ACR provisioned with publicNetworkAccess=Disabled — the
# docker/build-push-action matrix in build-fiab-images.yml authenticates with the
# COMMERCIAL service principal and pushes client-side, so it cannot produce a Gov
# image at all. Do not point operators at it for Gov.
#
# TAGS. Each image is pushed under THREE tags: the DEPLOY tag (`image_tag`,
# default v0.1 — the tag admin-plane/main.bicep resolves through
# appImageTags.{loomMigrate,risingwave}, whose .bicepparam default is 'v0.1'),
# the commit SHA, and :latest. Pushing only :<sha>/:latest — as the first cut of
# this workflow did — leaves the next full Gov `az deployment sub create`
# resolving `loom-migrate:v0.1` → MANIFEST_UNKNOWN. The deploy steps below use
# the SAME deploy tag, so a later full deploy is a no-op reconcile, not a flap.
#
# COLLISION. Both Container Apps are created with the same names, in the same RG
# and the same CAE, that admin-plane/main.bicep declares (`loom-migrate` /
# `loom-risingwave`, `uami-loom-{migrate,risingwave}-<location>`). That is
# deliberate ADOPTION, not a race: a subsequent full deploy reconciles the same
# resources rather than creating a duplicate, and re-running is idempotent. The
# "create-vs-adopt" step below says which of the two is happening.
#
# Mirrors gov-provision-wrangler.yml / gov-provision-dbt.yml.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'whatif = safe preview; build-only = produce the two Gov images and stop (phase 2 of a from-scratch install); build-and-deploy = images + Container Apps + env wiring.'
        type: choice
        default: whatif
        options:
          - whatif
          - build-only
          - build-and-deploy
      boundary:
        description: 'Gov boundary (selects the DEFAULT region only; both use the AZURE_GOV_* secret set, and discovery falls back to a prefix match).'
        type: choice
        default: GCC-High
        options:
          - GCC-High
          - IL5
      image_tag:
        description: 'Deploy tag to push AND deploy. MUST match appImageTags.{loomMigrate,risingwave} in the boundary .bicepparam (default v0.1).'
        type: string
        default: v0.1
  workflow_call:
    inputs:
      mode:
        type: string
        default: build-only
      boundary:
        type: string
        default: GCC-High
      image_tag:
        type: string
        default: v0.1
permissions:
  contents: read
env:
  MODE: ${{ inputs.mode || 'whatif' }}
  BOUNDARY: ${{ inputs.boundary || 'GCC-High' }}
  IMAGE_TAG: ${{ inputs.image_tag || 'v0.1' }}
  # Default region. Both Gov boundaries currently deploy into usgovvirginia
  # (deploy-fiab-gcch.yml AZURE_LOCATION, deploy-fiab-il5.yml AZURE_LOCATION, and
  # params/il5.bicepparam `param location`), so the default is the same for both;
  # the discovery step below falls back to a PREFIX match anyway, so a fresh Gov
  # subscription in another sovereign region still resolves. Nothing is hardcoded
  # to the one existing Gov estate any more.
  AZURE_LOCATION: usgovvirginia
  CONSOLE_APP: loom-console
  MIGRATE_APP: loom-migrate
  RISINGWAVE_APP: loom-risingwave
  # AcrPull — cloud-invariant built-in role id.
  ACRPULL_ROLE: 7f951dda-4ed3-4680-a7ca-43fe172d538d
  # Storage Blob Data Contributor — cloud-invariant built-in role id.
  BLOB_CONTRIB_ROLE: ba92f5b4-2d11-453d-a403-e96b0029c9fe
jobs:
  provision:
    name: Build + provision loom-migrate + loom-risingwave (Gov)
    runs-on: ubuntu-latest
    outputs:
      estate: ${{ steps.discover.outputs.estate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Verify the Gov credential set is configured
        env:
          C: ${{ secrets.AZURE_GOV_CLIENT_ID }}
          S: ${{ secrets.AZURE_GOV_CLIENT_SECRET }}
          T: ${{ secrets.AZURE_GOV_TENANT_ID }}
          U: ${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}
        run: |
          if [[ -z "$C" || -z "$S" || -z "$T" || -z "$U" ]]; then
            echo "::error::AZURE_GOV_* secrets are not configured (docs/fiab/runbooks/secrets-bootstrap.md)."
            exit 1
          fi
      - name: Azure Gov Login
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment
      - name: Set Azure cloud to Gov
        run: az cloud set --name AzureUSGovernment

      # ── Discovery, entirely by PREFIX ───────────────────────────────────────
      # The first cut of this workflow hardcoded RG=rg-csa-loom-admin-usgovvirginia
      # and ACR=acrloomdcmt6cqoezlgs, i.e. it only ever worked against the ONE
      # existing Gov estate. A fresh Gov subscription gets a uniqueString-derived
      # ACR name, so nothing resolved and there was no Gov image path at all.
      - name: Discover admin RG + ACR (works on a fresh Gov subscription)
        id: discover
        run: |
          set -euo pipefail
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          if ! az group show -n "$RG" -o none 2>/dev/null; then
            RG=$(az group list --query "[?starts_with(name, 'rg-csa-loom-admin')] | [0].name" -o tsv | tr -d '\r')
          fi
          if [[ -z "$RG" ]]; then
            # PHASE-ORDER, not an error, when this is the phase-2 image helper: a
            # from-scratch install has not run the infra phase yet, so there is no
            # ACR to build into. Say so and stop cleanly; every other mode fails.
            if [[ "$MODE" == "build-only" ]]; then
              echo "estate=absent" >> "$GITHUB_OUTPUT"
              echo "::warning::No admin RG (prefix rg-csa-loom-admin) in this subscription yet — nothing to build into. Run the infra phase (deployAppsEnabled=false) first, then re-run this workflow."
              exit 0
            fi
            echo "::error::No admin RG (prefix rg-csa-loom-admin) in this subscription. Run the infra phase first (deployAppsEnabled=false)."
            exit 1
          fi
          LOCATION=$(az group show -n "$RG" --query location -o tsv | tr -d '\r' | tr '[:upper:]' '[:lower:]' | tr -d ' ')
          ACR=$(az acr list -g "$RG" --query "[?starts_with(name,'acrloom')]|[0].name" -o tsv | tr -d '\r')
          if [[ -z "$ACR" ]]; then echo "::error::No acrloom* registry in $RG."; exit 1; fi
          ACR_LOGIN=$(az acr show -n "$ACR" -g "$RG" --query loginServer -o tsv | tr -d '\r')
          { echo "RG=$RG"; echo "LOCATION=$LOCATION"; echo "ACR=$ACR"; echo "ACR_LOGIN=$ACR_LOGIN"; } >> "$GITHUB_ENV"
          echo "estate=present" >> "$GITHUB_OUTPUT"
          echo "::notice::boundary=$BOUNDARY rg=$RG location=$LOCATION acr=$ACR login=$ACR_LOGIN tag=$IMAGE_TAG mode=$MODE"

      - name: Discover CAE + lake account + Key Vault + Console identity
        if: ${{ env.MODE != 'build-only' }}
        run: |
          set -euo pipefail
          CAE_ID=$(az containerapp env list -g "$RG" --query "[?starts_with(name,'cae-')]|[0].id" -o tsv 2>/dev/null | tr -d '\r' || echo "")
          if [[ -z "$CAE_ID" ]]; then
            CAE_ID=$(az containerapp show -n "$CONSOLE_APP" -g "$RG" --query properties.environmentId -o tsv 2>/dev/null | tr -d '\r' || echo "")
          fi
          # The streaming SINK writes Delta/Iceberg to the DLZ lake. Read the
          # account the Console is already bound to rather than guessing a name.
          LAKE=$(az containerapp show -n "$CONSOLE_APP" -g "$RG" \
            --query "properties.template.containers[0].env[?name=='LOOM_ADLS_ACCOUNT'].value | [0]" -o tsv 2>/dev/null | tr -d '\r' || echo "")
          # The Loom vault holds the MANDATORY RisingWave root credential. Named
          # kv-loom-<hash> by admin-plane/keyvault.bicep; discovered by prefix so
          # this works on any estate, not just the one that exists today.
          KV=$(az keyvault list -g "$RG" --query "[?starts_with(name,'kv-loom')]|[0].name" -o tsv 2>/dev/null | tr -d '\r' || echo "")
          # The Console's user-assigned identity — needed as the `identityref` of
          # its Key-Vault-backed secret (it already holds Key Vault Secrets
          # Officer from the main deploy, which includes read).
          CONSOLE_UAMI=$(az containerapp show -n "$CONSOLE_APP" -g "$RG" \
            --query "keys(identity.userAssignedIdentities)|[0]" -o tsv 2>/dev/null | tr -d '\r' || echo "")
          { echo "CAE_ID=$CAE_ID"; echo "LAKE=$LAKE"; echo "KV=$KV"; echo "CONSOLE_UAMI=$CONSOLE_UAMI"; } >> "$GITHUB_ENV"
          echo "::notice::CAE=$CAE_ID lake=${LAKE:-<none>} keyvault=${KV:-<none>} consoleUami=${CONSOLE_UAMI:-<none>}"
          [ -n "$CAE_ID" ] || { echo "::error::No Container Apps environment in $RG — run the infra phase first."; exit 1; }
          if [[ "$MODE" == "build-and-deploy" && -z "$KV" ]]; then
            echo "::error::No kv-loom* Key Vault in $RG. loom-risingwave REQUIRES a Postgres-wire root credential (its entrypoint refuses to start without one, because RisingWave's built-in root user has no password and the code-execution apps share this Container Apps environment). Run the infra phase first."
            exit 1
          fi

      - name: Report create-vs-adopt for both Container Apps
        if: ${{ env.MODE != 'build-only' }}
        run: |
          set -euo pipefail
          for APP in "$MIGRATE_APP" "$RISINGWAVE_APP"; do
            if az containerapp show -n "$APP" -g "$RG" -o none 2>/dev/null; then
              CUR=$(az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].image" -o tsv | tr -d '\r')
              echo "::notice::$APP ALREADY EXISTS in $RG (image $CUR) — this run ADOPTS it. Same name / RG / CAE that admin-plane/main.bicep declares, so a later full deploy reconciles it instead of duplicating."
            else
              echo "::notice::$APP does not exist in $RG — creating."
            fi
          done

      # ── The image producer ─────────────────────────────────────────────────
      - name: Build both images on the Gov ACR
        if: ${{ env.MODE != 'whatif' && steps.discover.outputs.estate == 'present' }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short=8 HEAD)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          # #2603: lease the ACR firewall rather than a bare toggle so this run's
          # re-lock cannot deny another run's in-flight push.
          bash scripts/csa-loom/acr-firewall-lease.sh acquire --acr "$ACR"
          # #3210 — this loop had NO verdict (`&& break` with no failure path)
          # and `az acr login` is the wrong oracle anyway: it authenticates via
          # an ARM-mediated token exchange and returns 0 while the registry is
          # still denying the runner by IP. acr-dataplane-ready.sh probes
          # `GET https://<acr><suffix>/v2/` on the same HTTP path the data-plane
          # tools use, and derives the suffix from the active cloud so it works
          # unchanged in .azurecr.us (.claude/rules/cloud-parity.md).
          bash "${LOOM_ACR_DATAPLANE_READY_SCRIPT:-scripts/ci/acr-dataplane-ready.sh}" --acr "$ACR" --timeout-seconds 180             || echo "::warning::ACR data plane not confirmed reachable; the next data-plane call may be denied."
          bash scripts/ci/acr-login-retry.sh --acr "$ACR"
          # The DEPLOY tag ($IMAGE_TAG, default v0.1) is what bicep resolves. It
          # MUST be pushed or the next full Gov deploy 404s on the manifest.
          az acr build --registry "$ACR" --no-logs \
            --image "loom-migrate:$IMAGE_TAG" \
            --image "loom-migrate:$SHA" \
            --image "loom-migrate:latest" \
            apps/loom-migrate
          az acr build --registry "$ACR" --no-logs \
            --image "loom-risingwave:$IMAGE_TAG" \
            --image "loom-risingwave:$SHA" \
            --image "loom-risingwave:latest" \
            apps/loom-risingwave

      - name: Prove both manifests exist at the deploy tag
        if: ${{ env.MODE != 'whatif' && steps.discover.outputs.estate == 'present' }}
        run: |
          set -euo pipefail
          # #3117 (deploy-integrity R7). Every failure class used to land in the
          # `else` here, which asserted BOTH that the tag 'is NOT in $ACR' and a
          # specific downstream error (MANIFEST_UNKNOWN) it had never established.
          # `2>/dev/null` threw away the evidence that would have told them apart.
          # The R7-correct `lookup` helper further down THIS FILE is the model:
          # absent and unreadable are different answers and must read differently.
          RC=0
          for IMG in loom-migrate loom-risingwave; do
            set +e
            D=$(bash "$GITHUB_WORKSPACE/scripts/ci/resolve-acr-digest.sh" \
                  --acr "$ACR" --image "$IMG:$IMAGE_TAG")
            DRC=$?
            set -e
            if [ $DRC -eq 0 ] && [ -n "$D" ]; then
              echo "::notice::$ACR_LOGIN/$IMG:$IMAGE_TAG → $D"
            elif [ $DRC -eq 3 ]; then
              echo "::error::$IMG:$IMAGE_TAG is NOT in $ACR — the registry ANSWERED not-found on every attempt. An apps-enabled Gov deploy would fail the Container App PUT with MANIFEST_UNKNOWN. Build it first (gov-provision-streaming-migrate mode=build-and-deploy)."
              RC=1
            else
              echo "::error::could NOT READ $ACR for $IMG:$IMAGE_TAG (see the resolver output above). Its existence is UNPROVEN, not disproven — this says nothing about whether a deploy would fail. Most likely the ACR firewall is closed to this runner or a change has not propagated."
              RC=1
            fi
          done
          exit $RC

      # Runs after the manifest proof (which needs the data plane open) and even
      # when a step above failed — never leave a sovereign registry reachable.
      - name: Release the ACR firewall lease (always)
        if: always()
        run: |
          if [ -n "${ACR:-}" ]; then
            bash scripts/csa-loom/acr-firewall-lease.sh release --acr "$ACR"
          fi

      - name: Stop after the image phase
        if: ${{ env.MODE == 'build-only' && steps.discover.outputs.estate == 'present' }}
        run: echo "::notice::mode=build-only — both Gov images are in $ACR at :$IMAGE_TAG. Now run the full Gov deploy with deployAppsEnabled=true; admin-plane/main.bicep creates both Container Apps and wires LOOM_MIGRATE_URL / LOOM_RISINGWAVE_URL itself."

      - name: Provision the least-privilege UAMIs (same names the orchestrator declares)
        if: ${{ env.MODE == 'build-and-deploy' }}
        run: |
          set -euo pipefail
          SUB=$(az account show --query id -o tsv | tr -d '\r')
          ACR_ID=$(az acr show -n "$ACR" -g "$RG" --query id -o tsv | tr -d '\r')
          for NAME in "uami-loom-migrate-$LOCATION" "uami-loom-risingwave-$LOCATION"; do
            az identity show -n "$NAME" -g "$RG" -o none 2>/dev/null \
              || az identity create -n "$NAME" -g "$RG" -l "$LOCATION" -o none
          done
          MIG_ID=$(az identity show -n "uami-loom-migrate-$LOCATION" -g "$RG" --query id -o tsv | tr -d '\r')
          MIG_PID=$(az identity show -n "uami-loom-migrate-$LOCATION" -g "$RG" --query principalId -o tsv | tr -d '\r')
          RW_ID=$(az identity show -n "uami-loom-risingwave-$LOCATION" -g "$RG" --query id -o tsv | tr -d '\r')
          RW_PID=$(az identity show -n "uami-loom-risingwave-$LOCATION" -g "$RG" --query principalId -o tsv | tr -d '\r')
          RW_CID=$(az identity show -n "uami-loom-risingwave-$LOCATION" -g "$RG" --query clientId -o tsv | tr -d '\r')
          {
            echo "MIG_ID=$MIG_ID"; echo "RW_ID=$RW_ID"; echo "RW_CID=$RW_CID"
          } >> "$GITHUB_ENV"
          # AcrPull on the Loom ACR — the migrate identity's ONLY role, and one of
          # the risingwave identity's two. `az role assignment create` is
          # idempotent (RoleAssignmentExists is tolerated).
          for PID in "$MIG_PID" "$RW_PID"; do
            az role assignment create --assignee-object-id "$PID" --assignee-principal-type ServicePrincipal \
              --role "$ACRPULL_ROLE" --scope "$ACR_ID" -o none 2>/dev/null || true
          done
          # Storage Blob Data Contributor for the streaming sink (risingwave only).
          if [ -n "${LAKE:-}" ]; then
            LAKE_ID=$(az storage account list --subscription "$SUB" \
              --query "[?name=='$LAKE'].id | [0]" -o tsv | tr -d '\r')
            if [ -n "$LAKE_ID" ]; then
              az role assignment create --assignee-object-id "$RW_PID" --assignee-principal-type ServicePrincipal \
                --role "$BLOB_CONTRIB_ROLE" --scope "$LAKE_ID" -o none 2>/dev/null || true
              echo "::notice::granted Storage Blob Data Contributor on $LAKE to uami-loom-risingwave-$LOCATION"
            else
              echo "::warning::lake account '$LAKE' not found in this subscription — skipping the sink grant. RisingWave still runs on single-node local state and serves the Postgres wire; only CREATE SINK to the lake would gate."
            fi
          fi

      # ── The MANDATORY RisingWave root credential ────────────────────────────
      # Written as an ARM resource, not `az keyvault secret set`: the Loom vault
      # is publicNetworkAccess=Disabled + defaultAction=Deny, so a GitHub-hosted
      # runner has no route to its DATA plane. The control plane works regardless
      # of the firewall (same mechanism keyvault.bicep already uses for the
      # built-in MCP key). The value is generated here, passed as a @secure()
      # parameter (ARM redacts it from deployment history), and never printed.
      - name: Provision the RisingWave root credential in Key Vault
        if: ${{ env.MODE == 'build-and-deploy' }}
        run: |
          set -euo pipefail
          RW_PID=$(az identity show -n "uami-loom-risingwave-$LOCATION" -g "$RG" --query principalId -o tsv | tr -d '\r')
          READERS="[\"$RW_PID\"]"
          if [ -n "${CONSOLE_UAMI:-}" ]; then
            CONSOLE_PID=$(az identity show --ids "$CONSOLE_UAMI" --query principalId -o tsv 2>/dev/null | tr -d '\r' || echo "")
            [ -n "$CONSOLE_PID" ] && READERS="[\"$RW_PID\",\"$CONSOLE_PID\"]"
          fi
          # 32 URL/SQL-safe characters. `openssl rand` is a CSPRNG; the value is
          # never echoed and never reaches a log or an env literal.
          RW_PASSWORD=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 32)
          [ ${#RW_PASSWORD} -ge 24 ] || { echo "::error::password generation failed"; exit 1; }
          echo "::add-mask::$RW_PASSWORD"
          az deployment group create -g "$RG" -n "loom-risingwave-secret-$(date -u +%Y%m%d%H%M%S)" \
            -f platform/fiab/bicep/modules/admin-plane/risingwave-root-secret.bicep \
            -p vaultName="$KV" \
               secretName=loom-risingwave-root-password \
               rootPassword="$RW_PASSWORD" \
               readerPrincipalIds="$READERS" \
            --mode Incremental -o none
          KV_URI=$(az keyvault show -n "$KV" -g "$RG" --query properties.vaultUri -o tsv | tr -d '\r')
          echo "RW_SECRET_URI=${KV_URI}secrets/loom-risingwave-root-password" >> "$GITHUB_ENV"
          echo "::notice::root credential written to $KV (readers: loom-risingwave UAMI + Console UAMI only — loom-script-runner / loom-udf-runtime hold no role on this vault)"

      - name: What-if both deployments
        if: ${{ env.MODE != 'build-only' }}
        run: |
          set -euo pipefail
          # MEASURED (run 31239331967, the first dispatch this workflow ever
          # had): `VAR="${VAR:-$(az … 2>/dev/null | tr -d '\r')}"` under
          # `set -euo pipefail` ABORTS THE WHOLE STEP with the az exit code when
          # the lookup fails — the assignment inherits the substitution's status
          # — and `2>/dev/null` has already destroyed the reason. Reproduced
          # locally: the construct exits 3 having printed nothing.
          #
          # The consequence is worse than a bad message: the `if [ -z "$MIG_ID" ]`
          # honest-skip immediately below was UNREACHABLE. The author wrote the
          # correct behaviour for a not-yet-provisioned estate — skip with a
          # named remediation — and the shell killed the step before it could
          # ever run. That is why this lane's only run ended in a bare
          # "Process completed with exit code 3".
          #
          # Look each identity up in a form that can report "absent" as a VALUE
          # rather than as a fatal signal, and that distinguishes absent from
          # unreadable (deploy-integrity R7).
          lookup() {
            local what="$1" name="$2" field="$3" out rc
            set +e
            out=$(az identity show -n "$name" -g "$RG" --query "$field" -o tsv 2>&1)
            rc=$?
            set -e
            if [ $rc -eq 0 ]; then printf '%s' "$out" | tr -d '\r'; return 0; fi
            if printf '%s' "$out" | grep -qiE "was not found|ResourceNotFound|could not be found"; then
              return 0   # genuinely absent -> empty value, handled below
            fi
            echo "::error::could NOT read $what ('$name') in $RG — its existence is UNPROVEN, not disproven. Azure said:" >&2
            printf '%s\n' "$out" >&2
            return 1
          }
          MIG_ID="${MIG_ID:-$(lookup 'loom-migrate UAMI' "uami-loom-migrate-$LOCATION" id)}"
          RW_ID="${RW_ID:-$(lookup 'loom-risingwave UAMI' "uami-loom-risingwave-$LOCATION" id)}"
          RW_CID="${RW_CID:-$(lookup 'loom-risingwave UAMI clientId' "uami-loom-risingwave-$LOCATION" clientId)}"
          if [ -z "$MIG_ID" ] || [ -z "$RW_ID" ]; then
            echo "::notice::UAMIs do not exist yet (mode=whatif). Skipping what-if — re-dispatch with mode=build-and-deploy to provision them first."
            exit 0
          fi

          # deploy-integrity R1/R7 (FINISHLINE G2). This step used to end both
          # what-ifs in `2>&1 | tail -30 || true`, which DISCARDED the verdict:
          # an ARM error and a clean preview were indistinguishable, so the
          # "What-if both deployments" step could not fail for the reason it
          # exists. Meanwhile the KV lookup below carried `2>/dev/null` inside a
          # `$( )` under `set -euo pipefail`, so when `az keyvault show` returned
          # non-zero the assignment aborted the whole step with a bare
          # "Process completed with exit code 3" and NO message at all — the
          # error text having been thrown away. Measured on run 31239331967
          # (2026-08-08), the first dispatch this workflow ever had.
          # Both halves are now fail-closed and self-explaining.
          WHATIF_FAILED=0
          run_whatif() {
            local label="$1"; shift
            echo "::group::what-if — $label"
            set +e
            local out; out=$("$@" --mode Incremental 2>&1); local rc=$?
            set -e
            printf '%s\n' "$out" | tail -60
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              echo "::error::what-if FAILED for $label (exit $rc). This is not a preview of no-change — nothing was predicted. Azure's output is in the group above."
              WHATIF_FAILED=1
            fi
          }

          run_whatif "loom-migrate" \
            az deployment group what-if -g "$RG" \
            -f platform/fiab/bicep/modules/data-plane/loom-migrate-aca.bicep \
            -p location="$LOCATION" \
               migrateConfig="{\"environmentId\":\"$CAE_ID\",\"uamiId\":\"$MIG_ID\",\"acrLoginServer\":\"$ACR_LOGIN\",\"image\":\"$ACR_LOGIN/loom-migrate:$IMAGE_TAG\",\"minReplicas\":0,\"maxReplicas\":2}" \
               complianceTags="{\"env\":\"gov\",\"boundary\":\"$LOCATION\",\"app\":\"loom-migrate\"}"

          # The RisingWave what-if needs the root-credential URI. In
          # mode=whatif the credential step has not run, so RW_SECRET_URI is
          # unset and we must resolve the vault URI here. Classify the lookup
          # rather than swallowing it: "vault absent" (expected on a
          # not-yet-provisioned estate) and "cannot read the vault" (a real
          # blocker, usually a missing role on the deploy SP) are DIFFERENT
          # findings and previously both vanished into exit code 3.
          if [ -z "${RW_SECRET_URI:-}" ]; then
            if [ -z "${KV:-}" ]; then
              echo "::warning::no Key Vault was discovered for this estate, so the RisingWave root-credential URI cannot be resolved. Skipping the loom-risingwave what-if — it would preview against a placeholder. Re-dispatch with mode=build-and-deploy to provision the vault and the credential."
            else
              set +e
              KV_OUT=$(az keyvault show -n "$KV" -g "$RG" --query properties.vaultUri -o tsv 2>&1)
              KV_RC=$?
              set -e
              KV_URI=$(printf '%s' "$KV_OUT" | tr -d '\r')
              if [ $KV_RC -ne 0 ]; then
                KV_URI=""
                if printf '%s' "$KV_OUT" | grep -qiE "was not found|ResourceNotFound|could not be found"; then
                  echo "::warning::Key Vault '$KV' does not exist in $RG yet. Skipping the loom-risingwave what-if. Re-dispatch with mode=build-and-deploy to provision it."
                else
                  echo "::error::could NOT read Key Vault '$KV' in $RG — so the RisingWave credential URI is UNRESOLVED, not absent. This is a blocker, not a skip. Azure said:"
                  printf '%s\n' "$KV_OUT"
                  echo "::error::If this is an authorization failure, the Gov deploy SP needs 'Key Vault Reader' on that vault (control-plane read only — the secret VALUE is never read here)."
                  exit 1
                fi
              fi
              [ -n "$KV_URI" ] && RW_SECRET_URI="${KV_URI}secrets/loom-risingwave-root-password"
            fi
          fi

          if [ -n "${RW_SECRET_URI:-}" ]; then
            run_whatif "loom-risingwave" \
              az deployment group what-if -g "$RG" \
              -f platform/fiab/bicep/modules/data-plane/loom-risingwave-aca.bicep \
              -p location="$LOCATION" \
                 risingwaveConfig="{\"environmentId\":\"$CAE_ID\",\"uamiId\":\"$RW_ID\",\"uamiClientId\":\"$RW_CID\",\"acrLoginServer\":\"$ACR_LOGIN\",\"image\":\"$ACR_LOGIN/loom-risingwave:$IMAGE_TAG\",\"lakeStorageAccountName\":\"${LAKE:-}\",\"assignLakeRole\":false,\"cpu\":\"2.0\",\"memory\":\"4.0Gi\",\"minReplicas\":1,\"maxReplicas\":1,\"rootPasswordSecretUri\":\"$RW_SECRET_URI\"}" \
                 complianceTags="{\"env\":\"gov\",\"boundary\":\"$LOCATION\",\"app\":\"loom-risingwave\"}"
          fi

          if [ "$WHATIF_FAILED" -ne 0 ]; then
            echo "::error::at least one what-if could not be evaluated — this run predicts NOTHING about the resulting estate. Failing closed."
            exit 1
          fi

      # ── IMAGE PREFLIGHT (blocking) ─────────────────────────────────────────
      # Re-asserted immediately before the deploy steps, not only after the
      # build. A Container App PUT that names a tag with no manifest fails with
      # MANIFEST_UNKNOWN — and where the app already exists this deployment
      # ADOPTS it, so pointing a live Gov app at a non-existent image would take
      # a running service down. Fail loudly here instead.
      - name: Image preflight — both deploy tags must resolve before any PUT
        if: ${{ env.MODE == 'build-and-deploy' }}
        run: |
          set -euo pipefail
          bash scripts/csa-loom/acr-firewall-lease.sh acquire --acr "$ACR"
          RC=0
          for IMG in loom-migrate loom-risingwave; do
            # R7: capture stderr and CLASSIFY it. `2>/dev/null || echo ""` made a
            # registry that could not be READ indistinguishable from a tag that
            # genuinely is not there, and the message below asserted the second.
            # Absence is claimed only when the registry ANSWERED.
            set +e
            SHOW_OUT=$(az acr repository show -n "$ACR" --image "$IMG:$IMAGE_TAG" --query digest -o tsv 2>&1)
            SHOW_RC=$?
            set -e
            if [ $SHOW_RC -eq 0 ]; then
              D=$(printf '%s' "$SHOW_OUT" | tr -d '\r')
            else
              D=""
              if ! node scripts/ci/deploy-classify.mjs --text "$SHOW_OUT" \
                     --assert-signal config.image-tag-absent >/dev/null 2>&1; then
                echo "::error::Could not READ $ACR_LOGIN/$IMG:$IMAGE_TAG. $(node scripts/ci/deploy-classify.mjs --text "$SHOW_OUT" --query) This is NOT proof the tag is missing — refusing to deploy on an UNPROVEN preflight."
                RC=1
                continue
              fi
            fi
            if [ -z "$D" ]; then
              echo "::error::PREFLIGHT FAILED — $ACR_LOGIN/$IMG:$IMAGE_TAG has no manifest. Refusing to deploy: the Container App PUT would fail with MANIFEST_UNKNOWN, and where the app already exists this run ADOPTS it, so it would point a live Gov service at an image that does not exist. Run this workflow with mode=build-only first."
              RC=1
            else
              echo "::notice::preflight ok — $ACR_LOGIN/$IMG:$IMAGE_TAG -> $D"
            fi
          done
          exit $RC

      - name: Deploy loom-migrate + wire LOOM_MIGRATE_URL
        if: ${{ env.MODE == 'build-and-deploy' }}
        run: |
          set -euo pipefail
          # Deploy the SAME tag bicep resolves, so the next full Gov deploy is a
          # no-op reconcile instead of flapping the image back to :v0.1.
          az deployment group create -g "$RG" -n "loom-migrate-$(date -u +%Y%m%d%H%M%S)" \
            -f platform/fiab/bicep/modules/data-plane/loom-migrate-aca.bicep \
            -p location="$LOCATION" \
               migrateConfig="{\"environmentId\":\"$CAE_ID\",\"uamiId\":\"$MIG_ID\",\"acrLoginServer\":\"$ACR_LOGIN\",\"image\":\"$ACR_LOGIN/loom-migrate:$IMAGE_TAG\",\"minReplicas\":0,\"maxReplicas\":2}" \
               complianceTags="{\"env\":\"gov\",\"boundary\":\"$LOCATION\",\"app\":\"loom-migrate\"}" \
            --mode Incremental -o none
          FQDN=$(az containerapp show -n "$MIGRATE_APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv | tr -d '\r')
          echo "::notice::loom-migrate FQDN: $FQDN"
          az containerapp update -n "$CONSOLE_APP" -g "$RG" --set-env-vars "LOOM_MIGRATE_URL=https://$FQDN" -o none

      - name: Deploy loom-risingwave + wire LOOM_RISINGWAVE_URL
        if: ${{ env.MODE == 'build-and-deploy' }}
        run: |
          set -euo pipefail
          [ -n "${RW_SECRET_URI:-}" ] || { echo "::error::RW_SECRET_URI is empty — the credential step did not run. loom-risingwave will not start without it (by design)."; exit 1; }
          az deployment group create -g "$RG" -n "loom-risingwave-$(date -u +%Y%m%d%H%M%S)" \
            -f platform/fiab/bicep/modules/data-plane/loom-risingwave-aca.bicep \
            -p location="$LOCATION" \
               risingwaveConfig="{\"environmentId\":\"$CAE_ID\",\"uamiId\":\"$RW_ID\",\"uamiClientId\":\"$RW_CID\",\"acrLoginServer\":\"$ACR_LOGIN\",\"image\":\"$ACR_LOGIN/loom-risingwave:$IMAGE_TAG\",\"lakeStorageAccountName\":\"${LAKE:-}\",\"assignLakeRole\":false,\"cpu\":\"2.0\",\"memory\":\"4.0Gi\",\"minReplicas\":1,\"maxReplicas\":1,\"rootPasswordSecretUri\":\"$RW_SECRET_URI\"}" \
               complianceTags="{\"env\":\"gov\",\"boundary\":\"$LOCATION\",\"app\":\"loom-risingwave\"}" \
            --mode Incremental -o none
          FQDN=$(az containerapp show -n "$RISINGWAVE_APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv | tr -d '\r')
          echo "::notice::loom-risingwave FQDN: $FQDN"
          # The engine boots TWICE (sealed on loopback to install the credential,
          # then serving), so allow ~5 min rather than the previous ~5 x 15s.
          for i in $(seq 1 30); do
            REV=$(az containerapp show -n "$RISINGWAVE_APP" -g "$RG" --query properties.latestRevisionName -o tsv | tr -d '\r')
            RS=$(az containerapp revision show -n "$RISINGWAVE_APP" -g "$RG" --revision "$REV" --query properties.runningState -o tsv 2>/dev/null | tr -d '\r')
            H=$(az containerapp revision show -n "$RISINGWAVE_APP" -g "$RG" --revision "$REV" --query properties.healthState -o tsv 2>/dev/null | tr -d '\r')
            echo "loom-risingwave running=$RS health=$H"; { [ "$H" = "Healthy" ] || [ "$RS" = "Running" ]; } && break; sleep 15
          done
          # The Console presents the SAME credential. A Key-Vault-backed SECRET,
          # then a secretRef env — never a plain env literal, and never a value on
          # an `az containerapp update` command line (that lands in ARM history).
          az containerapp secret set -n "$CONSOLE_APP" -g "$RG" \
            --secrets "loom-risingwave-password=keyvaultref:$RW_SECRET_URI,identityref:$CONSOLE_UAMI" -o none
          # Postgres wire, not HTTP — the client parses host / host:port / postgres://.
          az containerapp update -n "$CONSOLE_APP" -g "$RG" \
            --set-env-vars "LOOM_RISINGWAVE_URL=$FQDN:4566" "LOOM_RISINGWAVE_PASSWORD=secretref:loom-risingwave-password" -o none
          echo "::notice::wired LOOM_MIGRATE_URL + LOOM_RISINGWAVE_URL + the LOOM_RISINGWAVE_PASSWORD secretRef — re-run gov-selfaudit to confirm svc-loom-migrate + svc-loom-risingwave."
