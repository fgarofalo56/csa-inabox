name: loom-aca runner secret-hygiene probe

# PROVES the repo-admin PAT is no longer reachable from job code.
#
# It WAS reachable. `GITHUB_PAT` is injected into the runner container as an env
# var (secretref), entrypoint.sh is PID 1, and `./run.sh` used to be its CHILD —
# so every `run:` block inherited a PAT scoped `Administration: Read & Write`.
# It is not a GitHub Actions secret, so the log masker does not redact it, and
# this repository is PUBLIC. Two independent reviewers found it separately.
#
# THIS PROBE NEVER PRINTS A SECRET. It reports PRESENCE and LENGTH only — never
# a value, never a prefix, never a hash that could be brute-forced against a
# known token shape. That restriction is the whole design: a probe that proved
# the leak by exhibiting the credential would BE the leak.
#
# Three reachability paths are checked, because fixing one leaves the others:
#   1. the step's own inherited environment  (what `unset` fixes)
#   2. /proc/1/environ                       (what `unset` does NOT fix — it is
#                                             a snapshot taken at process start,
#                                             which is why the remedy is `exec
#                                             env -u`, replacing the image)
#   3. every other process's environ         (the runner agent, its children)
#
# EVERY PATH DISTINGUISHES THREE OUTCOMES, NOT TWO: reachable, not reachable,
# and COULD NOT ANSWER -- and the third fails the job. Until 2026-09-26 paths 2
# and 3 collapsed the third into the second: an unreadable /proc entry and an
# erroring `grep` both produced the output of a clean search, so this probe
# reported "not reachable" over a question it had not asked. A control that
# cannot tell "searched and found nothing" from "could not search" is not a
# control, and this one exists to prove a repo-admin PAT is not on disk on a
# PUBLIC repo. See deploy-integrity.md R7.
#
# WHY THERE IS NO `push:` TRIGGER, AND NO `|| ubuntu-latest` FALLBACK.
#
# A fallback would make this probe UNKILLABLE. There is no `GITHUB_PAT` on a
# GitHub-hosted runner at all, so on `ubuntu-latest` all three paths below
# report "not reachable" no matter what the fleet's image does -- a guard that
# reports NOT REACHABLE whatever is true. The only machine on which this
# question has an answer is the fleet.
#
# It used to fire on `push: chore/runner-probe**`. With the fleet scaled to zero
# that produced the worst available shape: the job QUEUED, sat for the full 24h
# expiry, then reported CANCELLED -- indistinguishable from a human cancel,
# blocking the advisory arm of the merge gate on every head while measuring
# nothing on any of them. `timeout-minutes` cannot bound that: it starts
# counting when a job STARTS. Nor can a preflight -- listing self-hosted runners
# needs `administration: read`, which a workflow `permissions:` block cannot
# grant.
#
# So it is DISPATCH-ONLY. Run it deliberately, when the fleet is up, against the
# head you intend to claim a receipt for. A verdict is pinned to the sha it
# measured.
#
# THE LAST VERDICT THIS PROBE PRODUCED WAS AT `05c3a46d7`, NOT `64c71db5`.
# Re-measured 2026-09-26 over the whole recorded population, 9 runs: run
# 36156415606, 2026-09-25T15:46:18Z, `success`, its single job ran 6 steps on
# fleet runner `loom-aca-gh-aca-runner-cjdfl-2tkb6`, and it printed
# "NOT REACHABLE by any of the three paths checked". An earlier revision of this
# header named `64c71db5` and called it four commits before the identity swap;
# that was wrong in the reassuring direction twice over, because a NEWER fleet
# verdict existed and it post-dates the identity swap rather than preceding it.
#
# AND THAT VERDICT DOES NOT ESTABLISH WHAT IT SAYS. It was produced by the
# version of step 3 whose search could not tell "found nothing" from "could not
# look", and by the version of step 2 that counted unreadable environs as
# searched. Its on-disk line reads "ok: no token-shaped value under
# /home/runner/actions-runner" and its /proc line "searched 6 process(es)" --
# both from code that had no way to report the third outcome. Fixed in the
# steps below; the fix has NO fleet receipt of its own yet.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-hygiene:
    name: the runner PAT is not reachable from job code
    runs-on: [self-hosted, loom-aca]
    timeout-minutes: 10
    steps:
      - name: Is GITHUB_PAT in this step's environment
        id: inherited
        run: |
          echo "## 1. inherited environment"
          if [ -n "${GITHUB_PAT:-}" ]; then
            echo "  FAIL: GITHUB_PAT is set in this step (length ${#GITHUB_PAT})"
            echo "leaked=true" >> "$GITHUB_OUTPUT"
          else
            echo "  ok: GITHUB_PAT is not set in this step"
            echo "leaked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Is it readable from another process environ
        id: procfs
        run: |
          echo "## 2. /proc/<pid>/environ across every readable process"
          # No backticks in these strings. Inside double quotes they are COMMAND
          # SUBSTITUTION, not quoting: the first draft wrote "the path `unset`
          # does NOT close" and bash duly RAN `unset`, and then tried to run
          # `exec env -u` -- which would have replaced this step's shell. It
          # printed prose with the words missing. shellcheck SC2006 caught it as
          # style; it was a defect.
          echo "     (this is the path that 'unset' does NOT close: /proc/N/environ"
          echo "      is a snapshot from process START. Only replacing the"
          echo "      process image, as 'exec env -u' does, removes it.)"
          hits=0
          read_ok=0
          denied=0
          vanished=0
          for envfile in /proc/[0-9]*/environ; do
            [ -e "$envfile" ] || continue
            pid="${envfile#/proc/}"; pid="${pid%/environ}"
            # A PROCESS WHOSE ENVIRON COULD NOT BE READ IS NOT A CLEAN PROCESS.
            # This loop used to pipe `tr '\0' '\n' < "$envfile" 2>/dev/null`
            # straight into `grep -q`: an unreadable environ produced an EMPTY
            # stream, grep reported no match, and the pid was still counted into
            # the "searched N process(es)" line. A root-owned process carrying
            # the PAT therefore read exactly like a clean one -- the same defect
            # as the on-disk step below, in the same control (R7).
            #
            # `-r` is the discriminator: /proc/N/environ is mode 0400 owned by
            # the process owner, so it is unreadable to a non-owner and readable
            # to root. The runner runs as root TODAY (recorded in the
            # Dockerfile), so `denied` is expected to be 0; if that ever stops
            # being true this arm goes RED rather than silently narrowing its
            # population, which is the intended coupling.
            if [ ! -r "$envfile" ]; then
              if [ -e "$envfile" ]; then
                denied=$((denied + 1))
                echo "  CANNOT ANSWER: pid $pid — its environ exists but is not readable here"
              else
                vanished=$((vanished + 1))
              fi
              continue
            fi
            # NUL-separated blob -> lines; presence only, never the value. The
            # redirect is inside a group so a failed OPEN is caught here too,
            # rather than escaping as shell noise.
            if ! blob="$( { tr '\0' '\n' < "$envfile"; } 2>/dev/null )"; then
              vanished=$((vanished + 1))
              continue
            fi
            read_ok=$((read_ok + 1))
            if printf '%s\n' "$blob" | grep -q '^GITHUB_PAT='; then
              comm="$(tr -d '\0' < "/proc/$pid/comm" 2>/dev/null || echo '?')"
              echo "  FAIL: pid $pid ($comm) carries GITHUB_PAT in its environ"
              hits=$((hits + 1))
            fi
          done
          if [ "$denied" -gt 0 ]; then
            echo "  CANNOT ANSWER for $denied process(es) — failing closed."
            echo "  'not readable' is not 'does not carry it'."
            echo "leaked=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$read_ok" -eq 0 ]; then
            echo "  CANNOT ANSWER: zero process environs were read — clean over"
            echo "  nothing — failing closed"
            echo "leaked=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$hits" -eq 0 ]; then
            # $read_ok counts environs this step actually READ, rather than
            # every /proc entry it merely enumerated, so the number reported is
            # exactly the population examined -- not a second, separate
            # measurement that could disagree with it (and not, as before, the
            # attempted population passed off as the searched one).
            echo "  ok: none of the $read_ok process environ(s) READ carries GITHUB_PAT"
            echo "     ($vanished process(es) exited mid-scan and were not read)"
            echo "leaked=false" >> "$GITHUB_OUTPUT"
          else
            echo "leaked=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Is a token-shaped VALUE on disk in the runner directory
        id: ondisk
        run: |
          echo "## 3. the runner working directory"
          # KEYED TO THE VALUE SHAPE, NOT THE VARIABLE NAME.
          #
          # The first version of this step ran `grep -rIl "GITHUB_PAT"` and
          # reported a leak — because `entrypoint.sh` is COPIED to exactly this
          # path by the Dockerfile and names that variable 25+ times in code and
          # comments. That is #4467's defect inverted: a guard matching RAW
          # SOURCE, satisfied by a mention. It failed the gate over a script
          # doing precisely what it should.
          #
          # A credential is a VALUE. GitHub's token formats are prefixed and
          # documented, so match those. Still presence-only: the count is
          # printed, never the match.
          #
          # A SEARCH THAT ERRORED IS NOT A SEARCH THAT FOUND NOTHING.
          #
          # This step used to end its grep with
          #     2>/dev/null | grep -v '/_work/' | head -5 || true
          # and both halves destroyed the evidence. `2>/dev/null` threw away
          # every "Permission denied"; the pipe made the captured status come
          # from `head`, which succeeds on anything. So a tree that could not be
          # read and a tree with nothing in it produced byte-identical output,
          # and this step printed "no token-shaped value under ..." over a
          # search that never happened. An independent reviewer confirmed it
          # with a positive control: a planted PAT-shaped value fired, an
          # unreadable path reported CLEAN.
          #
          # That is deploy-integrity.md R7 -- a message asserting what the code
          # did not establish -- in the one arm whose purpose is proving a
          # repo-admin PAT is not on disk, on a PUBLIC repo. A control that
          # cannot tell "searched and found nothing" from "could not search" is
          # not a control. grep's own status is now read (0 matched, 1 no match,
          # >=2 ERROR), its stderr is kept and PRINTED, and either signal FAILS
          # this step instead of passing it.
          root=/home/runner/actions-runner
          if [ ! -d "$root" ]; then
            echo "  CANNOT ANSWER: $root does not exist — failing closed"
            echo "leaked=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          matches="$(mktemp)"
          errs="$(mktemp)"
          trap 'rm -f "$matches" "$errs"' EXIT
          set +e
          # POPULATION FIRST, because "no match" over an EMPTY tree is the other
          # way this step could report a result it did not establish. This counts
          # FILES; the grep below counts MATCHES -- two different quantities on
          # purpose, not one answer derived twice.
          #
          # `_work` is skipped DURING both walks rather than filtered out of the
          # results afterwards. With a post-filter, an unreadable path inside the
          # job checkout would fail a step that discards its hits anyway, so
          # "could not read" stays scoped to paths this step actually judges.
          seen="$(find "$root" -type d -name _work -prune -o -type f -print 2>>"$errs" \
                    | wc -l | tr -d '[:space:]')"
          # ghp_ classic PAT · github_pat_ fine-grained · gho_/ghu_/ghs_/ghr_ app+oauth
          grep -rIlE --exclude-dir=_work \
            'gh[pousr]_[A-Za-z0-9]{16,}|github_pat_[A-Za-z0-9_]{20,}' \
            "$root" >"$matches" 2>>"$errs"
          rc=$?
          set -e
          if [ "$rc" -ge 2 ] || [ -s "$errs" ]; then
            echo "  CANNOT ANSWER: the search over $root did not complete (grep rc=$rc)."
            echo "  This is NOT 'clean', it is 'not searched'. What could not be read:"
            while IFS= read -r line; do
              printf '    %s\n' "$line"
            done < "$errs"
            echo "leaked=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$seen" -eq 0 ]; then
            echo "  CANNOT ANSWER: $root holds no regular file outside _work, so a"
            echo "  'no match' here would be clean over nothing — failing closed"
            echo "leaked=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          n="$(wc -l < "$matches" | tr -d '[:space:]')"
          if [ "$n" -gt 0 ]; then
            echo "  FAIL: a token-shaped value appears in $n of the $seen file(s) searched:"
            # printf per line rather than `sed 's/^/    /'` (SC2001) -- the
            # indent is formatting, and a regex is the wrong tool for it.
            while IFS= read -r hit; do
              printf '    %s\n' "$hit"
            done < "$matches"
            echo "leaked=true" >> "$GITHUB_OUTPUT"
          else
            echo "  ok: no token-shaped value in any of the $seen file(s) searched under $root"
            echo "     (the runner's own .credentials holds a RUNNER token, which"
            echo "      is scoped to this one ephemeral registration — not the PAT)"
            echo "leaked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse if the PAT is reachable by any path
        # A step that CANNOT ANSWER now exits 1 at its own site, naming what it
        # could not read, so this step is SKIPPED on that path and the job is
        # red there rather than here. That is deliberate: the reason belongs
        # next to the search that failed. This step remains the decision point
        # for the case where every step answered.
        run: |
          echo "## verdict"
          bad=0
          for r in "${{ steps.inherited.outputs.leaked }}" \
                   "${{ steps.procfs.outputs.leaked }}" \
                   "${{ steps.ondisk.outputs.leaked }}"; do
            [ "$r" = "true" ] && bad=1
          done
          # FAIL CLOSED on an unset output too: a step that did not report is a
          # question that was not answered, and this gate must not pass on one.
          for r in "${{ steps.inherited.outputs.leaked }}" \
                   "${{ steps.procfs.outputs.leaked }}" \
                   "${{ steps.ondisk.outputs.leaked }}"; do
            if [ -z "$r" ]; then
              echo "  a probe step reported nothing — failing closed"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "  REACHABLE — a repo-admin PAT is readable from job code on a PUBLIC repo."
            exit 1
          fi
          echo "  NOT REACHABLE by any of the three paths checked."
