name: deploy-fiab-gcch

# CSA Loom — nightly deploy validation against GCC-High / IL4
# (Azure Government). Per PRP-11.
#
# Manual approval gate (per environment protection rule) since this
# deploys into a Gov sub.

# The `Provision (with full Gov dispatch)` step below is gated
# `if: github.event_name == 'schedule' || inputs.run_mode == 'full'`, and
# run_mode DEFAULTS to whatif-only — so the DEFAULT dispatch of this workflow
# SUCCEEDS having applied nothing to GCC-High.
#
# This lane is now a WATCHED entry in scripts/ci/check-deploy-staleness.mjs, and
# that watchdog clears an entry's drift on its newest SUCCESSFUL run. Until this
# line existed the workflow had no `run-name` at all, so every run — apply or
# not — was titled "deploy-fiab-gcch" and one default dispatch would have
# silenced a sovereign deploy gap it did not close: the precise "green on
# nothing" shape that watchdog exists to catch.
#
# The marker string is DRY_RUN_MARKER ('DRY RUN') in check-deploy-staleness.mjs,
# which filters those runs out of the last-success search. Schedule runs
# provision, so they carry no marker. Same contract, same wording, as
# deploy-fiab-commercial.yml.
run-name: deploy-fiab-gcch${{ (github.event_name == 'workflow_dispatch' && inputs.run_mode != 'full') && ' — DRY RUN (whatif-only, applies nothing)' || '' }}

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC daily
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'whatif-only PREVIEWS the Bicep and applies NOTHING. full APPLIES the template: it provisions/reconciles the infrastructure AND creates or updates the Container Apps (loom-console + siblings), re-rendering every LOOM_* env var on them, then smokes the estate. It does NOT tear anything down (keep_resources defaults true). There is no separate apps flag on this lane — gcc-high.bicepparam sets deployAppsEnabled=true, so full always includes the app tier.'
        type: choice
        default: whatif-only
        options:
          - whatif-only
          - full
      topology:
        description: 'Explicit topology (audit-t156). Overrides deployment_mode. single-sub=dev/demo; tenant=DMLZ console+shared only; dlz-attach=landing zone only (no second console). Empty=derive.'
        type: choice
        default: ''
        options:
          - ''
          - single-sub
          - tenant
          - dlz-attach
      target_subscription:
        description: 'dlz-attach: the NEW subscription the DLZ is provisioned into.'
        type: string
        required: false
      keep_resources:
        description: 'Keep the estate up and RECONCILE in place (the safe default, and what a real install wants). TRUE reconfigures and adds services without destroying anything, so a full run is IDEMPOTENT and can be repeated safely. Setting it FALSE makes this a TEARDOWN run — only do that for a deliberate clean-slate rebuild.'
        type: boolean
        default: true
      allow_existing_hub:
        description: 'topology=tenant only: bypass the "hub already exists in target sub" guard to idempotently reconcile/retry an existing or partially-deployed Gov hub. Does NOT stamp a second Console — the incremental deploy reconciles the existing admin RG. Leave false for first-run installs. (Cloud parity: deploy-fiab-commercial.yml has had this since audit-t157; the Gov lanes did not, so once a Gov hub existed this workflow could never succeed again.)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

env:
  AZURE_CLOUD: AzureUSGovernment
  AZURE_LOCATION: usgovvirginia
  CSA_LOOM_BOUNDARY: GCC-High
  CSA_LOOM_DEPLOYMENT_MODE: single-sub   # CI default; multi-sub via dispatch input
  CSA_LOOM_TOPOLOGY: ${{ inputs.topology || '' }}
  CSA_LOOM_CAPACITY_SKU: F8
  CSA_LOOM_TARGET_SUBSCRIPTION: ${{ inputs.target_subscription }}

jobs:
  precheck:
    name: Verify Gov secrets are configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          C: ${{ secrets.AZURE_GOV_CLIENT_ID }}
          S: ${{ secrets.AZURE_GOV_CLIENT_SECRET }}
          T: ${{ secrets.AZURE_GOV_TENANT_ID }}
          U: ${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}
        run: |
          if [[ -z "$C" || -z "$S" || -z "$T" || -z "$U" ]]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::AZURE_GOV_* secrets not configured — skipping."
            echo "::warning::Bootstrap per docs/fiab/runbooks/secrets-bootstrap.md"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

  # IMAGE PHASE (no-vaporware.md two-phase contract). admin-plane/main.bicep
  # deploys loom-migrate + loom-risingwave DEFAULT-ON in every Container Apps
  # boundary, GCC-High included, and params/gcc-high.bicepparam sets
  # deployAppsEnabled=true — so those two manifests must be in the sovereign ACR
  # before the deploy below, or their Container App PUTs fail MANIFEST_UNKNOWN.
  # `az acr build` runs server-side, the only mechanism that reaches a
  # publicNetworkAccess=Disabled Gov registry. On a from-scratch subscription
  # there is no ACR yet; the reusable workflow warns and exits 0 in build-only
  # mode, and the images get built in the documented phase 2 instead — which is
  # why deploy-validate below runs with `always()` rather than on success.
  build-gov-images:
    name: Build the DEFAULT-ON data-plane images (GCC-High ACR)
    needs: precheck
    if: needs.precheck.outputs.configured == 'true' && (github.event_name == 'schedule' || inputs.run_mode == 'full')
    uses: ./.github/workflows/gov-provision-streaming-migrate.yml
    secrets: inherit
    with:
      mode: build-only
      boundary: GCC-High
      image_tag: v0.1

  deploy-validate:
    name: Deploy + validate CSA Loom in GCC-High
    needs: [precheck, build-gov-images]
    if: always() && needs.precheck.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: gcc-high-deploy   # requires manual approval
    # Coordinates exported for the chained Gov post-deploy bootstrap (rel-T32).
    outputs:
      admin_sub: ${{ steps.bootstrap_coords.outputs.admin_sub }}
      dlz_sub: ${{ steps.bootstrap_coords.outputs.dlz_sub }}
      region: ${{ steps.bootstrap_coords.outputs.region }}

    # ── IMAGE TAGS: THE DEPLOY MEASURES THEM, NOBODY TYPES THEM (#3449) ─────
    # gcc-high.bicepparam resolves all seventeen `appImageTags` entries with
    # `readEnvironmentVariable('LOOM_<X>_TAG', 'v0.1')`, which CANNOT FAIL — the
    # default is the point of the second argument. #3161 put those variables in
    # scope here as `${{ vars.LOOM_<X>_TAG || 'v0.1' }}`, which closed the "not
    # in scope" half and left the harder one open: with the repo variables unset
    # (their normal state) every SCHEDULED reconcile still proposed the param
    # file's own default over whatever the estate was running. Run 31793715708
    # is the receipt — the silent-revert gate refused three tags (loom-console
    # on `28de89fb`, loom-wrangler-host on `7ba2ec0f`, loom-unity digest-pinned)
    # and this lane failed on EVERY scheduled run (#3449).
    #
    # The gate was right. Its remedy was not: "set the repo variable" asks a
    # human for a value the platform had already measured — the gate reads the
    # running tag in order to compare against it. auto-bind-by-default.md §5:
    # "'Set LOOM_X' as the terminal user-facing state is a violation — the value
    # must be produced by the deploy."
    #
    # So the seventeen literals are GONE and `Adopt the image tags…` below is
    # the SINGLE WRITER of every LOOM_*_TAG, exporting into $GITHUB_ENV the tag
    # each app is ACTUALLY running (or the param file's own default where there
    # is nothing to preserve). What remains here is only the REQUEST channel.
    #
    # WHY THE REQUEST VARIABLES ARE NOT NAMED `LOOM_*_TAG`. Two independent
    # reasons, either fatal:
    #   1. a job-level `env:` key BEATS a `$GITHUB_ENV` write (GitHub docs,
    #      Variables: "the variable at the lowest level takes precedence"), so
    #      keeping the name here would silently discard every adopted value —
    #      the adoption would run, print, and change nothing.
    #   2. `${{ vars.X }}` with X unset is the EMPTY STRING, not absent, and
    #      `readEnvironmentVariable('LOOM_CONSOLE_TAG','v0.1')` returns that
    #      empty string rather than the default — image ref `<acr>/loom-console:`.
    # One name reaches bicep, one thing writes it.
    env:
      REQUESTED_LOOM_ACTIVATOR_TAG: ${{ vars.LOOM_ACTIVATOR_TAG }}
      REQUESTED_LOOM_CONSOLE_TAG: ${{ vars.LOOM_CONSOLE_TAG }}
      # loom-directlake (#3291) — a SEPARATE key from LOOM_DIRECTLAKE_TAG below,
      # which pins loom-direct-lake-shim: two apps, two repos.
      REQUESTED_LOOM_DIRECTLAKE_SVC_TAG: ${{ vars.LOOM_DIRECTLAKE_SVC_TAG }}
      REQUESTED_LOOM_DIRECTLAKE_TAG: ${{ vars.LOOM_DIRECTLAKE_TAG }}
      REQUESTED_LOOM_DUCKDB_TAG: ${{ vars.LOOM_DUCKDB_TAG }}
      REQUESTED_LOOM_MAF_TAG: ${{ vars.LOOM_MAF_TAG }}
      REQUESTED_LOOM_MCP_BRIDGE_TAG: ${{ vars.LOOM_MCP_BRIDGE_TAG }}
      REQUESTED_LOOM_MCP_TAG: ${{ vars.LOOM_MCP_TAG }}
      REQUESTED_LOOM_MIGRATE_TAG: ${{ vars.LOOM_MIGRATE_TAG }}
      REQUESTED_LOOM_MIRRORING_TAG: ${{ vars.LOOM_MIRRORING_TAG }}
      REQUESTED_LOOM_ORCHESTRATOR_TAG: ${{ vars.LOOM_ORCHESTRATOR_TAG }}
      REQUESTED_LOOM_RISINGWAVE_TAG: ${{ vars.LOOM_RISINGWAVE_TAG }}
      REQUESTED_LOOM_SCRIPT_RUNNER_TAG: ${{ vars.LOOM_SCRIPT_RUNNER_TAG }}
      REQUESTED_LOOM_SETUP_ORCHESTRATOR_TAG: ${{ vars.LOOM_SETUP_ORCHESTRATOR_TAG }}
      REQUESTED_LOOM_TRINO_TAG: ${{ vars.LOOM_TRINO_TAG }}
      REQUESTED_LOOM_UNITY_TAG: ${{ vars.LOOM_UNITY_TAG }}
      REQUESTED_LOOM_WRANGLER_TAG: ${{ vars.LOOM_WRANGLER_TAG }}

    steps:
      - uses: actions/checkout@v7

      - name: Azure login (Gov sub) — limitlessdata_deploy SP
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment

      - name: Set Azure cloud to Gov
        run: az cloud set --name AzureUSGovernment

      - name: Setup Bicep
        run: az bicep install

      # audit-t157: same "second Console is impossible" invariant as Commercial,
      # enforced at the CI layer. topology=tenant is rejected when an Admin Plane
      # (hub) RG already exists in the target sub; dlz-attach must name a NEW
      # subscription via target_subscription.
      # Remove the CAUSE of the stderr banner, not just its effect. When
      # `az graph query` runs without the extension present, the CLI
      # dynamic-installs it and prints a preview banner; installing it
      # explicitly first means that banner never fires during the probe. The
      # stream separation in the guard below is the belt — this is the braces.
      # Fail-closed: no `|| true`. If the extension cannot be installed, the
      # hub-existence probe cannot run, and that must stop the deploy rather
      # than proceed on an unverifiable answer.
      - name: Pre-install the resource-graph CLI extension
        run: |
          set -e
          az extension add --name resource-graph --upgrade --only-show-errors -o none
          echo "resource-graph version: $(az extension show --name resource-graph --query version -o tsv | tr -d '\r')"

      - name: Topology guard
        id: topology_guard
        env:
          INPUT_ALLOW_EXISTING_HUB: ${{ inputs.allow_existing_hub }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -e
          TOPOLOGY="${CSA_LOOM_TOPOLOGY:-tenant}"
          echo "topology=$TOPOLOGY"
          if [ "$TOPOLOGY" = "dlz-attach" ]; then
            if [ -z "$CSA_LOOM_TARGET_SUBSCRIPTION" ]; then
              echo "::error::dlz-attach requires target_subscription (the new DLZ subscription)."; exit 1
            fi
          else
            # Scope the hub check to the ACTIVE (deploy) subscription, not the
            # whole tenant, so a deliberate migration to a new hub sub is not
            # blocked by an old hub still running elsewhere as a UAT ring
            # (audit-t156 D3/Q10). Still blocks an accidental double-stamp into
            # the same sub.
            #
            # FAIL CLOSED ON UNKNOWN (deploy-integrity.md R6/R7). The original
            # form ended `2>/dev/null || echo "0"`, which converted an auth
            # failure, a missing resource-graph extension or a throttle into the
            # string "0" — i.e. "no hub exists" — and let a FIRST-RUN tenant
            # stamp proceed against a subscription that might already hold one.
            # An unreadable estate is UNKNOWN, and UNKNOWN must refuse, not guess.
            #
            # REACHABILITY (fixed 2026-08-07). The first fix wrote
            #   if ! EXISTING=$(az graph query … | tr -d '\r'); then
            # which CANNOT FIRE: a pipeline's exit status is the LAST command's,
            # so `tr` (always 0) masked az's failure and the informative branch
            # below was dead code — the assertion-that-cannot-fail class this
            # repo has been burned by repeatedly. Proven with a failing `az`
            # stand-in: BRANCH_TAKEN=no. Capture FIRST, transform AFTER, so the
            # `if !` observes az's own status.
            SCOPE_SUB=$(az account show --query id -o tsv 2>&1) || {
              echo "::error::Could not resolve the active subscription (az account show failed), so the hub-existence check cannot even be scoped. Refusing — under 'set -e' this previously aborted the step with no explanation at all. Detail: ${SCOPE_SUB:-<no output>}"
              exit 1
            }
            SCOPE_SUB=$(printf '%s' "$SCOPE_SUB" | tr -d '\r\n')
            # STREAM SEPARATION (2026-08-08). The previous form captured with
            # `2>&1`, which merged az's stderr INTO the numeric capture. The
            # Azure CLI writes its preview-extension banner to stderr, so on a
            # runner where `resource-graph` dynamic-installs, EXISTING became
            # "WARNING: Preview version …3" — non-numeric — and the guard below
            # refused. The guard was RIGHT to refuse an unparseable answer; the
            # bug was upstream, in contaminating the channel it reads.
            #
            # The fix is NOT `2>/dev/null`. Discarding stderr is the construct
            # that turned a permission denial into a false "the tag does not
            # exist" (R7) and made streaming-migrate's honest-skip unreachable.
            # stderr is redirected to a FILE, kept, and surfaced in BOTH failure
            # messages — so the number is clean AND the diagnosis survives.
            HUB_PROBE_ERR=$(mktemp)
            if ! HUB_PROBE_RAW=$(az graph query ${SCOPE_SUB:+--subscriptions "$SCOPE_SUB"} -q "ResourceContainers | where type == 'microsoft.resources/subscriptions/resourcegroups' | where name startswith 'rg-csa-loom-admin-' | project name" --query "data | length(@)" -o tsv 2>"$HUB_PROBE_ERR"); then
              HUB_PROBE_STDERR=$(head -c 2000 "$HUB_PROBE_ERR" | tr -d '\r')
              rm -f "$HUB_PROBE_ERR"
              echo "::error::Could NOT read the target subscription to determine whether a CSA Loom hub already exists, so the answer is UNKNOWN — not 'none'. Refusing rather than risk stamping a second Console. Resolve the read (Reader on the subscription for the Gov deploy SP, and the resource-graph CLI extension) and re-run. Detail: ${HUB_PROBE_STDERR:-<no stderr>}"
              exit 1
            fi
            HUB_PROBE_STDERR=$(head -c 2000 "$HUB_PROBE_ERR" | tr -d '\r')
            rm -f "$HUB_PROBE_ERR"
            EXISTING=$(printf '%s' "$HUB_PROBE_RAW" | tr -d '\r\n')
            # Second, independent gate: even a zero-exit az must return a NUMBER.
            # Kept FATAL and kept strict — it is what caught the contamination in
            # the first place. Any tolerance added here must be for a KNOWN shape
            # only; an unrecognised value still refuses.
            case "$EXISTING" in
              ''|*[!0-9]*)
                echo "::error::The hub-existence probe exited 0 but returned a non-numeric result (${EXISTING:-<empty>}), so whether a hub exists is UNVERIFIED. Refusing. az stderr was: ${HUB_PROBE_STDERR:-<empty>}"; exit 1 ;;
            esac
            if [ "$EXISTING" != "0" ]; then
              # CLOUD PARITY (.claude/rules/cloud-parity.md) + deploy-integrity R4:
              # brownfield must be a first-class path in BOTH clouds.
              # deploy-fiab-commercial.yml has carried `allow_existing_hub` since
              # audit-t157, and lets its SCHEDULED reconcile through on the
              # trigger — "the scheduled reconcile, whose whole purpose is to run
              # against the existing hub". The Gov lanes had NEITHER, so once the
              # Gov hub existed this workflow could never succeed again: measured
              # 2026-08-03 (run 30815034083) failing on exactly this line, and RED
              # on its 10:00 UTC cron every day for 16 days. That is not a broken
              # deploy — the guard was right — it is a MISSING brownfield path,
              # and it blocks the only lane that deploys the Gov Iceberg REST
              # catalog and wires LOOM_ICEBERG_CATALOG_URL.
              if [ "${INPUT_ALLOW_EXISTING_HUB:-false}" = "true" ]; then
                echo "::notice::A CSA Loom hub already exists in this subscription ($EXISTING rg-csa-loom-admin-* RG) and allow_existing_hub=true — reconciling the EXISTING admin RG incrementally. No second Console is stamped."
              elif [ "$TRIGGER" = "schedule" ]; then
                echo "::notice::Scheduled reconcile against the existing Gov hub ($EXISTING rg-csa-loom-admin-* RG) — proceeding incrementally, as deploy-fiab-commercial.yml does on its schedule. An operator DISPATCH against an existing hub still requires allow_existing_hub=true."
              else
                echo "::error::A CSA Loom hub already exists in the target subscription (found $EXISTING rg-csa-loom-admin-* RG). A second Console cannot be stamped into the same sub. To reconcile/retry the EXISTING hub, re-dispatch with allow_existing_hub=true. To add a NEW landing zone, use topology=dlz-attach with target_subscription."; exit 1
              fi
            fi
          fi

      # SIGN-IN DURABILITY (found while tracing svc-loom-unity-authz's phase-3
      # dependency). An Entra app registration is a Microsoft Graph object ARM
      # cannot create, so the bicepparam reads it from LOOM_MSAL_CLIENT_ID —
      # and GCC-High passed NOTHING at all. An ACA template rewrite drops every
      # env var it does not declare, so each re-run of this deploy re-rendered an
      # EMPTY client id and took sign-in dark, undoing what the post-deploy
      # bootstrap had wired. Resolve the estate's existing registration first —
      # Key Vault record, then the live Console app, then the repo secret. Empty
      # is the correct answer on a genuinely fresh subscription.
      - name: Resolve the existing MSAL client id (sign-in durability)
        env:
          LOOM_GOV_MSAL_CLIENT_ID: ${{ secrets.LOOM_GOV_MSAL_CLIENT_ID }}
        run: |
          set -euo pipefail
          CID="$(bash scripts/csa-loom/resolve-msal-client-id.sh --rg "rg-csa-loom-admin-${AZURE_LOCATION}" || true)"
          if [ -z "${CID:-}" ]; then CID="${LOOM_GOV_MSAL_CLIENT_ID:-}"; fi
          echo "LOOM_MSAL_CLIENT_ID=${CID}" >> "$GITHUB_ENV"
          if [ -n "${CID:-}" ]; then
            echo "::notice::MSAL client id resolved for this estate — sign-in stays wired across this deploy."
          else
            echo "::warning::No Entra app registration for this estate yet. Sign-in stays unconfigured until csa-loom-post-deploy-bootstrap (bootstrap-msal-app-reg.sh) runs; it records the client id in Key Vault so later deploys stay pinned."
          fi

      # ── ADOPT THE IMAGE TAGS THIS ESTATE IS RUNNING (#3449) ────────────────
      # THE SINGLE WRITER of every LOOM_*_TAG this job uses. It must run before
      # the first consumer, because four steps downstream all resolve image tags
      # and must resolve the SAME ones: the adopted-image preflight, the
      # what-if an operator approves, the ACR tag assertion, and the apply.
      #
      # Read-only (`az containerapp list`). Per key it exports, in order:
      #   REQUESTED_LOOM_<X>_TAG if the operator set the repo variable — intent
      #     outranks the estate, so a deliberate roll forward is never undone by
      #     a reconcile;
      #   otherwise the tag the app is ACTUALLY running — which is what makes a
      #     scheduled reconcile a no-op for the image and removes the human step
      #     the silent-revert gate used to demand;
      #   otherwise gcc-high.bicepparam's OWN declared default — the honest case
      #     where nothing is running that repository, so there is nothing to
      #     preserve and deploying it CREATES the app.
      #
      # It never invents a tag. A digest-pinned app, one repository running at
      # two tags, or a failed query are reported UNRESOLVED and left at the param
      # default WITHOUT any claim that writing it is safe — the revert gate below
      # re-reads the estate itself and decides that, from its own measurement.
      #
      # NOT gated on run_mode: `whatif-only` is this lane's DEFAULT, and a
      # preview that resolves different tags than the apply is a lying preview
      # (deploy-integrity R7).
      #
      # NOT gated on topology either, unlike the two sibling gates below. Those
      # skip on dlz-attach because nothing is ADOPTED there; this step is not a
      # gate, it is the producer of a variable other steps read under `set -u`
      # ("Image preflight — Gov ACR …" interpolates `${LOOM_DUCKDB_TAG}` bare and
      # has no topology guard). Skipping here would abort that step instead of
      # relaxing anything. It reads the same hub RG that preflight asserts
      # against, so the two cannot describe different estates.
      - name: Adopt the image tags this estate is running (no repo variable required)
        run: |
          set -euo pipefail
          node scripts/ci/adopt-image-tags.mjs \
            --param-file platform/fiab/bicep/params/gcc-high.bicepparam \
            --rg "rg-csa-loom-admin-${AZURE_LOCATION}"

      # ADOPTED-IMAGE PREFLIGHT. This deploy ADOPTS the Container Apps that are
      # already running in rg-csa-loom-admin-<loc> and rewrites their image
      # references to the tags the .bicepparam pulls. An ARM PUT naming a tag that
      # is not in the registry SUCCEEDS, and the new revision then fails its image
      # pull — i.e. the deploy takes a live federal app down. Verify first.
      # Greenfield (no such Container App yet) passes: a missing tag is the
      # expected state of the documented two-phase image path.
      #
      # `loom-unity` IS in the require list as of #2681: admin-plane/main.bicep
      # now deploys the Unity-Catalog-compatible OSS metastore DEFAULT-ON on
      # every boundary, so this deploy ADOPTS the live GCC-High `loom-unity`
      # Container App and rewrites its image reference. That app is the sovereign
      # catalog — Databricks Unity Catalog has no Gov endpoint — so repointing it
      # at a tag the Gov ACR does not hold takes the catalog down. The producer
      # is .github/workflows/gov-build-images.yml (apps=loom-unity), which pushes
      # `:v0.1` by default; export LOOM_UNITY_TAG to pin something else and this
      # check follows it.
      - name: Image preflight — never adopt a live app onto a missing tag
        run: |
          set -euo pipefail
          # dlz-attach deploys only a landing zone into a DIFFERENT subscription
          # and never touches the hub's admin-plane apps, so nothing is adopted —
          # checking the hub's registry would be a false stop.
          if [ "${CSA_LOOM_TOPOLOGY:-}" = "dlz-attach" ]; then
            echo "::notice::topology=dlz-attach — no admin-plane Container App is adopted; skipping the image preflight."
            exit 0
          fi
          bash scripts/csa-loom/preflight-image-tags.sh \
            --rg "rg-csa-loom-admin-${AZURE_LOCATION}" \
            --require "loom-console:${LOOM_CONSOLE_TAG:-v0.1}" \
            --require "loom-unity:${LOOM_UNITY_TAG:-v0.1}"

      # #3056 — adopt the estate's LIVE internal trust token instead of letting
      # bicep re-mint it (`loomGeneratedSecretSeed` defaults to `newGuid()`, so
      # every deploy rotated it and stranded every holder outside the
      # deployment). On the GCC-High AKS boundary the console is not a Container
      # App, so the resolver honestly reports greenfield and warns rather than
      # inventing a value — that case is UNVERIFIED here and is called out in
      # docs/fiab/runbooks/internal-token-ownership.md.
      - name: Adopt the estate's live internal trust token (never re-mint it)
        run: bash scripts/csa-loom/resolve-internal-token.sh --export > /dev/null

      # ── ADOPT THE DATA LANDING ZONE (#3380) ────────────────────────────────
      #
      # CLOUD PARITY, MEASURED. params/gcc-high.bicepparam:66 reads
      #   param adopt = union(legacyAdoptFromEnv, json(readEnvironmentVariable('LOOM_ADOPT_JSON', '{}')))
      # exactly as commercial.bicepparam does — so the CONSUMER has always been
      # here. The PRODUCER was not: `discover-dlz-adopt-plan` / `LOOM_ADOPT_JSON`
      # appeared 11 times in deploy-fiab-commercial.yml and ZERO times in this
      # lane, in deploy-fiab-il5 and in deploy-fiab-gcc. Brownfield adoption and
      # the cross-subscription grant pass were therefore Commercial-only BY
      # CONSTRUCTION: every sovereign deploy resolved `{}` and behaved as if the
      # estate owned nothing, whatever it actually owned. cloud-parity.md calls
      # that INCOMPLETE, and deploy-integrity.md R5 makes brownfield a
      # first-class path in BOTH clouds, not a Commercial convenience.
      #
      # THIS BOUNDARY NEEDS IT MOST. Databricks Unity Catalog has no Azure
      # Government endpoint, so the lake wiring this plan carries is not a parity
      # checkbox here — it is the catalog and federation story for GCC-High.
      #
      # WHAT AN EMPTY PLAN COSTS. main.bicep composes `loomStorageAccount` from
      # the adopt plan, and the console env array in modules/admin-plane/main.bicep
      # is CONDITIONAL on that string (`!empty(loomStorageAccount) ? [ … ] : []`).
      # An empty binding does not leave the lake variables alone — it REMOVES
      # LOOM_BRONZE_URL, LOOM_SILVER_URL, LOOM_GOLD_URL, LOOM_LANDING_URL,
      # LOOM_CSV_IMPORTS_URL, LOOM_SAMPLE_ADLS and LOOM_RECYCLE_RETENTION_DAYS
      # from a running console (#3701).
      #
      # MUST PRECEDE THE WHAT-IF. `readEnvironmentVariable` resolves at BICEP
      # COMPILE time — i.e. inside `az deployment sub what-if` / `create`, not
      # when this step runs. Exporting it afterwards is a no-op, and a preview
      # that resolves a different adopt plan than the apply is a lying preview
      # (deploy-integrity R7). It also runs UNGATED by run_mode for that reason:
      # `whatif-only` is this lane's DEFAULT and its preview is the artifact an
      # operator approves. Discovery is read-only — it never creates and never
      # grants — so running it on a dry run mutates nothing.
      #
      # THE EXIT CODE IS CLASSIFIED, NEVER SWALLOWED (R6/R7). resolve-dlz-
      # coordinates.mjs states the contract this port keeps intact: 0 resolved /
      # 1 not-found / 2 usage / 3 unreadable / 4 ambiguous. A single `|| echo`
      # that collapses all four non-zero codes into one sentence ASSERTS a
      # measurement the script did not make — the defect #3701/#3703 removed from
      # the Commercial lane. UNKNOWN (3) and AMBIGUOUS (4) refuse rather than
      # compose an empty plan; only a MEASURED not-found continues.
      #
      # $AZURE_LOCATION is a workflow-level literal on this lane (usgovvirginia),
      # not a value measured from the estate, so the empty-region trap that made
      # the Commercial nightly discover against `--region ""` on every scheduled
      # run cannot occur here. The guard below is kept anyway.
      - name: Adopt the DLZ (discover what the estate already owns — #3380)
        id: dlz_adopt
        env:
          ADMIN_SUB: ${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          REGION="${AZURE_LOCATION:-}"
          if [ -z "$REGION" ]; then
            echo "::error::[dlz-adopt] No region is available: \$AZURE_LOCATION is empty. Refusing rather than discovering against no region — that is what silently produced 'adopting: (none)' on the Commercial lane and stripped the lake env vars off the console (#3701)."
            exit 1
          fi
          if [ -z "${ADMIN_SUB:-}" ]; then
            echo "::error::[dlz-adopt] No admin subscription: the AZURE_GOV_SUBSCRIPTION_ID repository secret is empty, so Resource Graph cannot be scoped and NOTHING would be established about this estate. Refusing rather than composing an empty adopt plan."
            exit 1
          fi
          RESOLVED="$RUNNER_TEMP/dlz-coords.env"; : > "$RESOLVED"
          RC=0
          node scripts/csa-loom/resolve-dlz-coordinates.mjs \
            --region "$REGION" \
            --admin-subscription "$ADMIN_SUB" \
            --github-env "$RESOLVED" || RC=$?
          case "$RC" in
            0)
              echo "[dlz-adopt] resolver RESOLVED a landing zone for region '$REGION'."
              ;;
            1)
              # EXIT 1 IS ALSO NODE'S CODE FOR AN UNCAUGHT THROW, so the code
              # alone cannot tell "Resource Graph was read and nothing matched"
              # from "this script died before measuring anything". Require the
              # positive DLZ_STATUS marker the resolver writes on every MEASURED
              # path rather than inferring a measurement from an exit code.
              if grep -q '^DLZ_STATUS=not-found$' "$RESOLVED"; then
                echo "::notice::[dlz-adopt] resolver read Azure Resource Graph SUCCESSFULLY and no landing zone matched region '$REGION'. Continuing without adoption — that is the correct greenfield answer, and it is a measurement, not a fallback."
              else
                echo "::error::[dlz-adopt] resolve-dlz-coordinates exited 1 but did NOT write 'DLZ_STATUS=not-found'. Exit 1 is also node's code for an uncaught throw or a module-load failure, so nothing here establishes that the estate was read. Refusing rather than reporting a greenfield negative nobody measured (#3701/#3703)."
                exit 1
              fi
              ;;
            2)
              echo "::error::[dlz-adopt] resolve-dlz-coordinates exited USAGE (2): this workflow passed it invalid arguments (region='$REGION'). NOTHING was established about the estate. Refusing — continuing would compose an EMPTY adopt plan, and an empty plan does not skip the lake binding, it DELETES the seven LOOM_*_URL/LOOM_SAMPLE_ADLS env vars from the running console (#3701)."
              exit 1
              ;;
            3)
              if [ "${CSA_LOOM_TOPOLOGY:-}" = "dlz-attach" ]; then
                echo "::warning::[dlz-adopt] resolve-dlz-coordinates exited UNREADABLE (3): the Azure Resource Graph query FAILED, so whether this estate has a landing zone is UNKNOWN. Continuing ONLY because topology=dlz-attach deploys no admin plane (main.bicep:1114), so no console env variable can be removed by an empty adopt plan. Discovery still measured nothing — check that the Gov deploy identity can read Resource Graph across this estate's subscriptions."
              else
                echo "::error::[dlz-adopt] resolve-dlz-coordinates exited UNREADABLE (3): the Azure Resource Graph query FAILED, so whether this estate has a landing zone is UNKNOWN — it is NOT 'no'. Refusing rather than deploying an empty adopt plan that would strip the lake env vars off the console. Check that the Gov deploy identity can read Resource Graph across this estate's subscriptions (Reader at the DLZ subscription is the usual gap)."
                exit 1
              fi
              ;;
            4)
              if [ "${CSA_LOOM_TOPOLOGY:-}" = "dlz-attach" ]; then
                echo "::warning::[dlz-adopt] resolve-dlz-coordinates exited AMBIGUOUS (4): more than one landing zone matches region '$REGION' and none was chosen. Continuing ONLY because topology=dlz-attach deploys no admin plane, so nothing can be stripped."
              else
                echo "::error::[dlz-adopt] resolve-dlz-coordinates exited AMBIGUOUS (4): more than one landing zone matches region '$REGION' and this deploy wires exactly one, so NOTHING was chosen. Failing closed. Name the intended DLZ explicitly, or remove the duplicate resource group."
                exit 1
              fi
              ;;
            *)
              echo "::error::[dlz-adopt] resolve-dlz-coordinates exited with the undocumented code $RC. Its contract is 0 resolved / 1 not-found / 2 usage / 3 unreadable / 4 ambiguous, so nothing it printed can be read as a verdict about this estate. Refusing."
              exit 1
              ;;
          esac
          DLZ_SUB="$(grep '^DLZ_SUB=' "$RESOLVED" | tail -1 | cut -d= -f2- || true)"
          DLZ_RG="$(grep  '^DLZ_RG='  "$RESOLVED" | tail -1 | cut -d= -f2- || true)"
          [ -n "${DLZ_SUB:-}" ] && echo "::add-mask::$DLZ_SUB"

          PLAN='{}'
          if [ -n "${DLZ_SUB:-}" ] && [ -n "${DLZ_RG:-}" ]; then
            PLAN="$(bash scripts/csa-loom/discover-dlz-adopt-plan.sh \
                      --dlz-subscription "$DLZ_SUB" --dlz-rg "$DLZ_RG")"
          fi

          # An EXPLICIT plan always wins over a discovered one — the operator
          # said what to adopt, and discovery must not override a deliberate
          # decision. Discovery only fills keys nobody chose.
          if [ -n "${LOOM_ADOPT_JSON:-}" ] && [ "${LOOM_ADOPT_JSON}" != "{}" ]; then
            PLAN="$(PLAN="$PLAN" EXPLICIT="$LOOM_ADOPT_JSON" python -c 'import json,os; d=json.loads(os.environ["PLAN"]); d.update(json.loads(os.environ["EXPLICIT"])); print(json.dumps(d,separators=(",",":")))')"
            echo "::notice::[dlz-adopt] merged discovery UNDER the explicitly supplied LOOM_ADOPT_JSON (explicit wins)."
          fi

          echo "LOOM_ADOPT_JSON=$PLAN" >> "$GITHUB_ENV"
          KEYS="$(PLAN="$PLAN" python -c 'import json,os; print(",".join(sorted(json.loads(os.environ["PLAN"]))) or "(none)")')"
          echo "::notice::[dlz-adopt] adopting: $KEYS"
          echo "adopted=$KEYS" >> "$GITHUB_OUTPUT"

      # ── IMMUTABLE-PROPERTY DISCOVERY (#3754) ──────────────────────────────
      # `Microsoft.Network/dnsResolvers/inboundEndpoints` treats
      # `privateIpAllocationMethod` as IMMUTABLE: ARM rejects a deployment that
      # names a method differing from the live one, and that rejection kills the
      # whole nested `network` template — taking every unrelated change in the
      # same `az deployment sub create` with it.
      #
      # network.bicep has now been broken by a hard-coded literal in BOTH
      # directions. `Static` broke Commercial (#2775, live endpoint was Dynamic);
      # #2881 flipped it to `Dynamic` to fix Commercial, and that flip is what has
      # failed every run of THIS lane since — run 32126019475 reported
      #   `ipAllocationMethod=Dynamic, existingIpAllocationMethod=Static`
      # on dnspr-loom-usgovvirginia. Both literals were measured; each was correct
      # for one estate and wrong for the other. Per deploy-integrity.md R5.3 the
      # value is now DISCOVERED from the live resource rather than assumed, and an
      # unreadable control plane REFUSES instead of defaulting (R7 — "I could not
      # read it" must never render as "it is not there").
      #
      # RUNS BEFORE THE WHAT-IF ON PURPOSE. The immutability check is a PREFLIGHT
      # error, so it can fail the preview as well as the apply; and this lane's
      # stated principle is that the preview an operator approves and the apply
      # that follows describe the same deployment. One resolved value feeds both.
      #
      # dlz-attach stamps a landing zone into a DIFFERENT subscription and skips
      # the admin plane entirely, so there is no hub resolver to converge on; the
      # step no-ops and `${LOOM_DNS_INBOUND_STATIC_IP:+…}` below then omits the
      # parameter, leaving bicep's own default — which is exactly today's
      # behaviour for that topology. That branch is taken in BASH, from the
      # resolved CSA_LOOM_TOPOLOGY env, never from `inputs.` in an `if:` — a
      # `schedule` event carries no inputs, and deciding a run-shape question by
      # reading one is precisely the defect #2881 removed from this family of
      # workflows.
      - name: Resolve the hub DNS resolver's IMMUTABLE IP allocation method
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ "${CSA_LOOM_TOPOLOGY:-}" = "dlz-attach" ]; then
            echo "::notice::topology=dlz-attach deploys no admin plane, so there is no hub DNS resolver inbound endpoint to converge on."
            exit 0
          fi
          DEPLOY_SUB="${CSA_LOOM_TARGET_SUBSCRIPTION:-$AZURE_SUBSCRIPTION_ID}"
          if [ -z "$DEPLOY_SUB" ]; then
            echo "::error::No target subscription, so the live DNS resolver inbound endpoint cannot be located. It comes from the AZURE_GOV_SUBSCRIPTION_ID repository secret (or the target_subscription input on dlz-attach); both are empty."
            exit 1
          fi
          node scripts/ci/resolve-dns-inbound-allocation.mjs \
            --subscription "$DEPLOY_SUB" \
            --rg "rg-csa-loom-admin-${AZURE_LOCATION}" \
            --location "$AZURE_LOCATION"

      # #3161 round 2 — THE PREVIEW MUST RESOLVE THE SAME TAGS AS THE APPLY.
      # `whatif-only` is this lane's DEFAULT run_mode, so this step's output IS
      # the artifact an operator reads before approving a full run. It resolved
      # `appImageTags` from the bicepparam defaults while the apply used
      # `vars.LOOM_*_TAG`, so with any tag pinned the what-if showed image churn
      # that would not happen — or hid churn that would. A preview that asserts
      # something it did not establish is deploy-integrity.md R7 applied to the
      # artifact people actually read. `Adopt the image tags…` above is now the
      # single writer that feeds this preview, the preflights and the apply.
      # ── ADX MUST BE RUNNING BEFORE WHAT-IF **AND** THE APPLY (#3754, #3449) ──
      # admin-plane/adx-cluster.bicep declares two
      # `Microsoft.Kusto/clusters/principalAssignments` children (the Console
      # UAMI's AllDatabasesAdmin and the Activator's AllDatabasesViewer). Those
      # are ADX DATA-plane roles, so the Kusto RP must reach the engine to write
      # them — and on a stopped cluster it cannot. Run 32126019475 and every run
      # since died on exactly that leaf:
      #
      #   ClusterNotValidForPrincipals on 'adx-csa-loom-fmezxj/console-uami-alldatabasesadmin':
      #   [BadRequest] Cluster is in state 'Stopped', cannot retrieve list of principals
      #
      # ORDERING — why this sits ABOVE `Bicep what-if` (#3449). This step landed
      # in #3779 placed just before `Provision`, which is where "the apply" is.
      # But `az deployment sub what-if` EVALUATES those same principalAssignment
      # leaves, so it hits ClusterNotValidForPrincipals first and exits 1 — and
      # this preflight, six steps below it, never ran at all. The remediation was
      # correct and unreachable: deploy-fiab-gcch failed 6/6 daily scheduled runs
      # (2026-08-17 → 2026-08-22, latest head 2ea8252e) with the script present
      # and wired the whole time. Preflight must precede the first thing that
      # reads the resource, not the first thing that writes it.
      #
      # WHY START IT RATHER THAN SKIP THE GRANTS. Skipping would turn a loud
      # failure into a silent one — a green deploy with a Console UAMI holding no
      # ADX rights, and every Eventhouse / KQL surface in the boundary failing
      # later with a permission error nobody could trace back here.
      # auto-bind-by-default.md §5 and deploy-integrity.md R6 both say the
      # platform performs a remediation it is capable of; starting a cluster it
      # already owns is squarely that. gcc-high.bicepparam sets `adxEnabled =
      # true`, so a stopped cluster is ALSO a live capability gap in this
      # boundary, independent of the deploy. `enableAutoStop: true` on the
      # cluster caps the cost: Azure stops it again once it idles.
      #
      # It runs on the same trigger as the apply, so a whatif-only DRY RUN — a
      # run that by definition applies nothing — never mutates the estate. That
      # condition is deliberately UNCHANGED by the move, and it leaves one known
      # residual: a dry run against a stopped cluster still fails what-if. That
      # is the correct trade — starting a cluster is a mutation, and a dry run
      # must not mutate. Every failing run in #3449 is a `schedule` run, which
      # this condition covers.
      #
      # deploy-fiab-commercial carries the IDENTICAL latent failure with no such
      # preflight (adxEnabled=true + the same unconditional enableAutoStop), and
      # is deliberately NOT changed here: it is the only working infra-deploy
      # path in the repo and destabilising it to pre-empt a latent fault would
      # trade one P0 for a worse one. Tracked in #3786.
      - name: ADX preflight — a stopped cluster cannot take its principal assignments
        if: github.event_name == 'schedule' || inputs.run_mode == 'full'
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          # dlz-attach deploys no admin plane, so it declares no principal
          # assignments on the hub cluster and has nothing to start.
          if [ "${CSA_LOOM_TOPOLOGY:-}" = "dlz-attach" ]; then
            echo "::notice::topology=dlz-attach deploys no admin-plane ADX cluster; nothing to start."
            exit 0
          fi
          DEPLOY_SUB="${CSA_LOOM_TARGET_SUBSCRIPTION:-$AZURE_SUBSCRIPTION_ID}"
          if [ -z "$DEPLOY_SUB" ]; then
            echo "::error::No target subscription, so the estate's ADX cluster cannot be located. It comes from the AZURE_GOV_SUBSCRIPTION_ID repository secret; it is empty."
            exit 1
          fi
          node scripts/ci/ensure-adx-cluster-running.mjs \
            --subscription "$DEPLOY_SUB" \
            --rg "rg-csa-loom-admin-${AZURE_LOCATION}"

      - name: Bicep what-if
        run: |
          az deployment sub what-if \
            --name csa-loom-gcch-ci-${{ github.run_id }} \
            --location $AZURE_LOCATION \
            ${CSA_LOOM_TARGET_SUBSCRIPTION:+--subscription "$CSA_LOOM_TARGET_SUBSCRIPTION"} \
            --template-file platform/fiab/bicep/main.bicep \
            --parameters platform/fiab/bicep/params/gcc-high.bicepparam \
            --parameters adminEntraGroupId=${{ secrets.FIAB_GOV_ADMIN_GROUP_ID }} \
            --parameters loomTenantAdminGroupId=${{ secrets.FIAB_GOV_ADMIN_GROUP_ID }} \
            ${LOOM_INTERNAL_TOKEN:+--parameters loomInternalTokenValue="$LOOM_INTERNAL_TOKEN"} \
            ${CSA_LOOM_TOPOLOGY:+--parameters topology="$CSA_LOOM_TOPOLOGY"} \
            ${LOOM_DNS_INBOUND_STATIC_IP:+--parameters dnsResolverInboundStaticIp="$LOOM_DNS_INBOUND_STATIC_IP"} \
            ${CSA_LOOM_TARGET_SUBSCRIPTION:+--parameters targetSubscriptionId="$CSA_LOOM_TARGET_SUBSCRIPTION"}

      - name: Deploy-verification evidence receipt (§7)
        # Captures the GCC-High deploy-verification acceptance receipt as an
        # artifact: deterministic ARM tests + sovereign-endpoint sweep + the §4
        # host matrix, plus a live what-if line (already on the Gov sub + bicep).
        # Live full-stack smoke is honestly BLOCKED by runbook gap #2 (no in-repo
        # AKS workload deployment for the Loom apps). Never fails the job.
        run: |
          bash scripts/csa-loom/gov-verify-evidence.sh \
            --boundary gcc-high --live \
            --out "$RUNNER_TEMP/gov-verify-receipt-gcch-${{ github.run_id }}.txt" || true

      - name: Upload GCC-High verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: gov-verify-receipt-gcch-${{ github.run_id }}
          path: ${{ runner.temp }}/gov-verify-receipt-gcch-${{ github.run_id }}.txt
          if-no-files-found: warn

      # ── IMAGE PREFLIGHT (round-3, PR #2640) ───────────────────────────────
      # This deploy is subscription-scoped and ADOPTS every app already running
      # in the live GCC-High estate (loom-console, loom-unity, …). admin-plane/
      # main.bicep now creates `loom-duckdb` by default from
      # `<acr>/loom-duckdb:${appImageTags.duckdb}` (LOOM_DUCKDB_TAG, default
      # v0.1). The producer for that image —
      # .github/workflows/gov-provision-dataplane-images.yml — HAS NEVER BEEN
      # RUN, so "a build lane exists" is not evidence the tags exist. Prove it,
      # or refuse: a Container App that cannot pull fails its nested deployment
      # and takes the live-estate-adopting deployment down with it.
      #
      # --skip-if-registry-absent keeps the genuine FROM-SCRATCH path working:
      # no ACR yet means nothing live to adopt, and the two-phase image path
      # (no-vaporware.md) builds the registry contents in the next phase.
      - name: Image preflight — Gov ACR must already hold every referenced tag
        if: github.event_name == 'schedule' || inputs.run_mode == 'full'
        # The two LOOM_*_TAG values this step reads come from `Adopt the image
        # tags…` (#3449) — the same $GITHUB_ENV the what-if and the apply read.
        # They were once declared here, on this step only, so a pinned repo
        # variable was asserted by the preflight and then ignored by the deploy:
        # the preflight passing READ AS "the pin took effect" when it had not.
        # They are interpolated BARE under `set -u`, which is why the adopter
        # exports a value for every declared tag rather than only the running
        # ones — an unexported variable would abort this step.
        run: |
          set -uo pipefail
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          # R7 (#3090): see the long note in deploy-fiab-commercial.yml. The
          # discovery read used to be `2>/dev/null` + `[ -z "$ACR" ] && exit 0`,
          # so an unreadable control plane was reported as "from-scratch deploy,
          # nothing live to adopt" and the entire image gate was SKIPPED on a
          # LIVE sovereign estate. `az acr list` on a missing RG exits non-zero;
          # an existing-but-empty RG exits 0. Keep the two facts apart.
          set +e
          ACR_OUT=$(az acr list -g "$RG" --query "[?starts_with(name,'acrloom')]|[0].name" -o tsv 2>&1)
          ACR_RC=$?
          set -e
          if [ $ACR_RC -ne 0 ]; then
            if node scripts/ci/deploy-classify.mjs --text "$ACR_OUT" \
                 --assert-signal config.resource-group-not-found >/dev/null 2>&1; then
              echo "::notice::image-preflight: ARM answered ResourceGroupNotFound for $RG — from-scratch deploy, nothing live to adopt. Skipping."
              exit 0
            fi
            echo "::error::image-preflight: could NOT enumerate registries in $RG, so it is NOT established whether this estate has an ACR. Refusing to treat an unreadable control plane as 'nothing to adopt' and skip the gate. $(node scripts/ci/deploy-classify.mjs --text "$ACR_OUT" --query)"
            exit 1
          fi
          ACR=$(printf '%s' "$ACR_OUT" | tr -d '\r' | head -1)
          [ "$ACR" = "None" ] && ACR=""
          if [ -z "$ACR" ]; then
            echo "::notice::image-preflight: ARM ANSWERED and $RG contains no acrloom* registry — from-scratch deploy, nothing live to adopt. Skipping."
            exit 0
          fi
          # loom-unity joined this list in #2681 — admin-plane/main.bicep deploys
          # the sovereign catalog DEFAULT-ON, and on GCC-High this deploy ADOPTS
          # the one that is already running. NOTE what this proves and what it
          # does not: it proves the TAG EXISTS, not that the image behind it is
          # current. An adopted image built before the unitycatalog-server 0.5.1
          # overlay (#2974) enforces authorization and then 500s on
          # GET /permissions. Run gov-build-images.yml (apps=loom-unity) first.
          #
          # `${VAR:?msg}`, not a bare `${VAR}`. These names are produced by the
          # adopt step's $GITHUB_ENV write, so a bare read under `set -u` would
          # abort here with the shell's terse "unbound variable" if adoption
          # were ever skipped or errored — and an empty expansion would send
          # `loom-duckdb:` to the registry probe. The `:?` form fails CLOSED and
          # names the producer that should have run (deploy-integrity R6).
          bash scripts/ci/assert-acr-image-tags.sh --acr "$ACR" --rg "$RG" --lease \
            --skip-if-registry-absent \
            "loom-duckdb:${LOOM_DUCKDB_TAG:?not exported — the 'Adopt the image tags this estate is running' step must run before this preflight (#3449)}" \
            "loom-unity:${LOOM_UNITY_TAG:?not exported — the 'Adopt the image tags this estate is running' step must run before this preflight (#3449)}"

      # ── RE-PIN TO WHAT IS RUNNING RIGHT NOW (#3683, the #3676 re-pin half) ──
      #
      # CLOUD PARITY, MEASURED. `pin-refresh` appeared 5 times in
      # deploy-fiab-commercial.yml and ZERO times in this lane and in
      # deploy-fiab-il5. #3676 is a RACE, and the race is not Commercial-only:
      # `Adopt the image tags…` reads the estate near the TOP of this job, the
      # apply happens many minutes later, and any console/data-plane roll that
      # lands in between (gov-console-roll.yml runs on `push`) leaves this deploy
      # about to write a tag that was current when it was measured and is stale
      # by the time ARM sees it. Re-reading immediately before the apply narrows
      # that window to seconds.
      #
      # IT REACHES THE APPLY WITHOUT TOUCHING ANY ARGUMENT LIST. pin-refresh
      # writes `LOOM_<APP>_TAG=<running>` to $GITHUB_ENV, and
      # params/gcc-high.bicepparam resolves `readEnvironmentVariable('LOOM_*_TAG',
      # …)` at BICEP-COMPILE time — i.e. inside `az deployment sub create`, not
      # when this job started. That is what makes a late re-pin possible at all.
      #
      # ONLY PINNED KEYS ARE EMITTED. A key with nothing running is left to the
      # param file's own default on purpose — there is no running image to
      # preserve and inventing one would be a guess. `vanished` is reported as a
      # notice, not a refusal: writing the tag an app is no longer running
      # CREATES it, which is not a revert.
      #
      # UNREADABLE IS NOT EMPTY. stdout and stderr are captured SEPARATELY and
      # neither is discarded: `2>&1` would splice az's warnings into the JSON and
      # `2>/dev/null` is what once turned a permission denial into an empty
      # string and then into a false claim (R7). A failed list is handed to
      # `--read-error` so the policy decides, rather than being read as "no apps
      # are running".
      #
      # IT RUNS ABOVE THE REVERT GATE, NOT BELOW IT — the same order
      # deploy-fiab-commercial.yml uses. The gate must judge the tag set the
      # apply will ACTUALLY write, and this step's $GITHUB_ENV write is the last
      # thing that changes it. Below the gate, the gate would be judging a tag
      # set that no longer exists by the time ARM sees it.
      #
      # THE OTHER HALF OF #3683 IS NOT HERE, AND THAT IS STATED RATHER THAN
      # IMPLIED. `assert-estate-not-behind-roll` cannot be ported to this lane
      # yet: reconcile-policy.mjs decides the last console writer from a FROZEN
      # `CONSOLE_ROLL_SOURCES` table naming only loom-roll-and-validate.yml and
      # full-app-deploy-commercial.yml, and `selectLastConsoleRoll` returns
      # `unknown` for any workflow absent from it — "an unrecognised writer is not
      # a pass". Feeding it this boundary's writer (gov-console-roll.yml) would
      # therefore fail the gate on a HEALTHY estate every time a Gov roll landed
      # in the window, and a false red is how a gate gets switched off. That
      # table lives in scripts/ci/reconcile-policy.mjs, which this change does not
      # own. Tracked as the remaining half of #3683.
      - name: Re-pin appImageTags to the RUNNING images (narrows the roll race — #3683)
        id: repin
        if: github.event_name == 'schedule' || inputs.run_mode == 'full'
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}
        run: |
          set -uo pipefail
          # dlz-attach provisions a landing zone into a DIFFERENT subscription and
          # never touches the hub's admin-plane apps, so there is no pin to
          # refresh and the hub's registry is not this deploy's business.
          if [ "${CSA_LOOM_TOPOLOGY:-}" = "dlz-attach" ]; then
            echo "::notice::topology=dlz-attach — no admin-plane Container App is adopted; there is no pin to refresh."
            exit 0
          fi
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          CONTAINERS="$RUNNER_TEMP/repin-containers.json"
          LIST_ERR="$RUNNER_TEMP/repin-list.err"
          : > "$LIST_ERR"

          # Truncation uses parameter expansion, never `| head -c`. GitHub runs
          # `run:` under `bash -e` and `pipefail` is set above, so `cmd | head -c N`
          # kills `cmd` with SIGPIPE on any input longer than N and takes the whole
          # STEP down — a guard that aborts on the error path it exists to report
          # is a guard that never reports.
          trim400() { local s; s="$(tr '\n' ' ' < "$1")"; printf '%s' "${s:0:400}"; }

          set +e
          az containerapp list -g "$RG" \
            --query '[].{name:name, image:properties.template.containers[0].image}' \
            -o json > "$CONTAINERS" 2> "$LIST_ERR"
          LIST_RC=$?
          set -e
          if [ $LIST_RC -ne 0 ]; then
            node scripts/ci/reconcile-policy.mjs pin-refresh \
              --deploy-apps-enabled true \
              --read-error "az containerapp list exited ${LIST_RC}: $(trim400 "$LIST_ERR")"
            exit $?
          fi
          if [ -s "$LIST_ERR" ]; then
            echo "::warning::pin-refresh: az wrote to stderr while SUCCEEDING; recording it rather than hiding it: $(trim400 "$LIST_ERR")"
          fi
          node scripts/ci/reconcile-policy.mjs pin-refresh \
            --deploy-apps-enabled true --containers "$CONTAINERS"

      # ── SILENT-REVERT GATE (#3161, the runtime half) ────────────────────────
      # Having the tag in scope is necessary and NOT sufficient. In scope with
      # the value `v0.1` is precisely the state that flattened this estate: the
      # static guard passes and the deploy still writes the mutable default over
      # a SHA-pinned app. Only a live read tells the two apart, so this step
      # reads what every Container App is ACTUALLY running (read-only
      # `az containerapp list`) and REFUSES when a tag sourced from the param
      # file's own default would overwrite an app running something else.
      #
      # It cannot fire on an intentional roll forward (a set repo variable reads
      # as an explicit pin), on a greenfield install (nothing running to
      # revert), or on Gov's rolled `:v0.1` (running tag equals tag-to-write).
      # The only state it refuses is the one nobody chose.
      #
      # It PRINTS EVERY TAG even when it passes — value, source, running tag,
      # verdict — to the log and the step summary. #3161 survived the entire
      # life of this lane because nothing ever stated which tags a deploy was
      # about to write.
      - name: Image-tag revert gate — never flatten a pinned app to the default
        if: github.event_name == 'schedule' || inputs.run_mode == 'full'
        run: |
          set -euo pipefail
          # dlz-attach provisions a landing zone into a DIFFERENT subscription
          # and never touches the hub's admin-plane apps, so there is nothing
          # adopted and nothing to revert.
          if [ "${CSA_LOOM_TOPOLOGY:-}" = "dlz-attach" ]; then
            echo "::notice::topology=dlz-attach — no admin-plane Container App is adopted; no tag can be reverted."
            exit 0
          fi
          node scripts/ci/assert-no-silent-image-tag-revert.mjs \
            --param-file platform/fiab/bicep/params/gcc-high.bicepparam \
            --rg "rg-csa-loom-admin-${AZURE_LOCATION}"

      - name: Provision (with full Gov dispatch)
        id: provision
        if: github.event_name == 'schedule' || inputs.run_mode == 'full'
        # #3161 — gcc-high.bicepparam reads sixteen image tags with
        # readEnvironmentVariable(), and this step had NO env: block at all. So
        # every full Gov deploy fell back to the default and wrote the MUTABLE
        # `v0.1` onto loom-unity, iceberg-catalog (same image) and loom-trino —
        # silently reverting any SHA-pinned roll of those apps, with nothing in
        # the log to say it had happened. #3161 put them in scope; #3449 made
        # the deploy MEASURE them — `Adopt the image tags…` writes all seventeen
        # into $GITHUB_ENV from the running estate, shared with the preflights
        # and the what-if so every step names the same tag and none of them
        # needs an operator to type one.
        env:
          # THE azd BRANCH IS GONE (#3415). Until this change, every topology
          # except `dlz-attach` — i.e. the DEFAULT sovereign path — ran
          # `azd provision --no-prompt` against platform/fiab/bicep/main.bicep.
          # azd binds Bicep parameters through `<module>.parameters.json` with
          # `${VAR}` substitution (Learn, "Explore the azd up workflow" and
          # "Use environment secrets with the Azure Developer CLI"), and this
          # repo has NO platform/fiab/bicep/main.parameters.json — nor a
          # main.bicepparam beside the module. main.bicep declares 22 parameters
          # with no default, and main.bicep calls readEnvironmentVariable zero
          # times (it is a .bicepparam-only compile-time function), so the
          # `azd env set CSA_LOOM_*` calls that branch made had no path into the
          # template at all. Nothing could bind those 22 parameters.
          #
          # This step now runs the SAME `az deployment sub create` on every
          # topology, against the SAME gcc-high.bicepparam the what-if above
          # already previews — which is where the 22 parameters actually come
          # from, and which makes the LOOM_*_TAG job env below reach the deploy
          # on every topology instead of only on dlz-attach (#3161).
          #
          # WHERE THE DELETED `azd env set` VALUES GO — accounted for, not
          # dropped. Each was inert (nothing bound it), and each is already
          # declared in params/gcc-high.bicepparam at the SAME value the branch
          # was trying to set: CSA_LOOM_BOUNDARY -> `boundary = 'GCC-High'`,
          # CSA_LOOM_DEPLOYMENT_MODE -> `deploymentMode = 'multi-sub'`,
          # CSA_LOOM_CAPACITY_SKU -> `capacitySku = 'F8'`,
          # CSA_LOOM_OPENAI_LOCATION -> `openaiLocation = 'usgovvirginia'`,
          # CSA_LOOM_EMBEDDINGS_LOCATION -> `openaiEmbeddingsLocation =
          # 'usgovarizona'`, AZURE_LOCATION -> `location = 'usgovvirginia'`.
          # CSA_LOOM_ADMIN_GROUP_ID is passed inline as `adminEntraGroupId` (as
          # the what-if and the dlz-attach branch already did), and
          # CSA_LOOM_TOPOLOGY is passed inline as `topology` only when non-empty
          # — empty still means DERIVE, exactly as the input's help says.
          # AZURE_CLOUD is an azd concept; `az cloud set --name
          # AzureUSGovernment` above is the az-CLI equivalent and already runs.
          #
          # AZURE_SUBSCRIPTION_ID is still required and still cannot be derived
          # (#3137): it is the subscription this deploy targets when no
          # dlz-attach target subscription was named. The guard below is now
          # written against `az deployment sub create`, because that is what
          # runs — an error message must not assert a cause it did not
          # establish (deploy-integrity R7).
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}
        run: |
          set -e
          # RETRY WITH CLASSIFICATION (#3017, deploy-integrity R6). This ran
          # bare on every Gov path while Commercial had the full harness: a 429,
          # a DeploymentActive from a concurrent run, or an Entra replication
          # lag failed the whole Gov deploy outright with no classification —
          # and the failure notifier below reads deploy-failure.json, which
          # NOTHING on this workflow produced. deploy-retry.mjs retries ONLY
          # transient/eventual-consistency, fails closed on exhaustion, writes
          # the classified artifact, and --arm-deployment drills into the ARM
          # leaf errors instead of handing the classifier bicep linter noise.
          #
          # ONE INVOCATION, EVERY TOPOLOGY (#3415). The topology-specific parts
          # are now PARAMETERS, not a second deploy path: which subscription is
          # targeted, whether `topology`/`targetSubscriptionId` are passed, and
          # how hard the retry tries. The template file, the param file and the
          # inline overrides are the SAME ones the `az deployment sub what-if`
          # above previews, so the preview an operator approves and the apply
          # that follows describe the same deployment. The one deliberate
          # difference is `--subscription`: the what-if passes it only when a
          # target subscription was named, this passes the RESOLVED value
          # always, so the apply can never land at an ambient default the log
          # does not name.
          #
          # WHICH SUBSCRIPTION. dlz-attach provisions the DLZ directly INTO the
          # new target sub so `subscription()` resolves to it (per main.bicep's
          # dlz-attach scope) — the DLZ RG/module uses single-arg
          # resourceGroup(), so deploying from the hub sub would land it in the
          # wrong subscription. Every other topology targets the hub sub. The
          # `:-` fallback is the SAME precedence the what-if uses, so both
          # commands target the same place.
          DEPLOY_SUB="${CSA_LOOM_TARGET_SUBSCRIPTION:-$AZURE_SUBSCRIPTION_ID}"
          # #3137, restated for the command that actually runs. `az deployment
          # sub create` is subscription-scoped and this passes `--subscription`
          # EXPLICITLY rather than relying on the ambient az login context, so
          # an empty value here would send the deploy nowhere (or, worse, at the
          # login default while the log claimed otherwise). Fail loudly, before
          # anything is attempted.
          if [ -z "${DEPLOY_SUB:-}" ]; then
            echo "::error::No target subscription. az deployment sub create is subscription-scoped and cannot derive one. On topology=dlz-attach this comes from the target_subscription input; otherwise from the AZURE_GOV_SUBSCRIPTION_ID repository secret. Both are empty."
            exit 1
          fi
          # RETRY TUNING, PRESERVED PER TOPOLOGY. dlz-attach stamps a landing
          # zone into a fresh subscription and rides Entra/RP replication lag, so
          # it gets 4 attempts on a 45s base (unchanged). Every other topology
          # reconciles the whole hub: idempotent, but not cheap — 2 attempts on
          # 60s, the tuning the branch this replaced carried, kept deliberately
          # rather than silently widened.
          if [ "$CSA_LOOM_TOPOLOGY" = "dlz-attach" ]; then
            MAX_ATTEMPTS=4; BACKOFF=45
          else
            MAX_ATTEMPTS=2; BACKOFF=60
          fi
          # --arm-deployment now applies on EVERY topology. The azd branch had
          # no drill-down at all (azd names its own nested deployment), so a
          # failed default-topology Gov deploy handed the classifier bicep linter
          # noise instead of the ARM leaf errors. Same deployment name as the
          # what-if, so the artifact names the thing that was previewed.
          node "$GITHUB_WORKSPACE/scripts/ci/deploy-retry.mjs" \
            --class-allow transient,eventual-consistency \
            --max-attempts "$MAX_ATTEMPTS" --backoff "$BACKOFF" --jitter 0.3 --wall-clock 110m \
            --step "az deployment sub create (gcch ${CSA_LOOM_TOPOLOGY:-derived})" \
            --artifact "$GITHUB_WORKSPACE/deploy-failure.json" \
            --remediate \
            --arm-deployment "csa-loom-gcch-ci-${{ github.run_id }}" --arm-scope sub \
            --arm-subscription "$DEPLOY_SUB" \
            -- az deployment sub create \
            --name csa-loom-gcch-ci-${{ github.run_id }} \
            --location "$AZURE_LOCATION" \
            --subscription "$DEPLOY_SUB" \
            --template-file "$GITHUB_WORKSPACE/platform/fiab/bicep/main.bicep" \
            --parameters "$GITHUB_WORKSPACE/platform/fiab/bicep/params/gcc-high.bicepparam" \
            --parameters adminEntraGroupId=${{ secrets.FIAB_GOV_ADMIN_GROUP_ID }} \
            --parameters loomTenantAdminGroupId=${{ secrets.FIAB_GOV_ADMIN_GROUP_ID }} \
            ${LOOM_INTERNAL_TOKEN:+--parameters loomInternalTokenValue="$LOOM_INTERNAL_TOKEN"} \
            ${CSA_LOOM_TOPOLOGY:+--parameters topology="$CSA_LOOM_TOPOLOGY"} \
            ${LOOM_DNS_INBOUND_STATIC_IP:+--parameters dnsResolverInboundStaticIp="$LOOM_DNS_INBOUND_STATIC_IP"} \
            ${CSA_LOOM_TARGET_SUBSCRIPTION:+--parameters targetSubscriptionId="$CSA_LOOM_TARGET_SUBSCRIPTION"}

          # ── The smoke test's target: RESOLVED, never assumed (#3137) ────────
          # The smoke step below used to carry
          #     env:
          #       CONSOLE_URL: $(azd env get-values | grep CONSOLE_URL | cut -d= -f2)
          # A workflow `env:` value is a LITERAL — Actions substitutes GitHub
          # expressions during workflow processing and passes the rest through
          # verbatim, and nothing in that path is a shell. So the smoke script
          # received that TEXT as its console URL. Non-empty, so its own
          # `${CONSOLE_URL:?CONSOLE_URL must be set}` guard passed, and every
          # probe curled a nonsense address: a step that runs and cannot pass.
          # It had never fired because this lane had never got past THIS step.
          # Two more defects sat behind it — the smoke step has no
          # `working-directory`, so azd would have run outside the project; and
          # main.bicep declares `output consoleUrl` (camelCase), which azd writes
          # back under the name AS DECLARED, so `grep CONSOLE_URL` could never
          # have matched. Guard: scripts/ci/check-workflow-env-substitution.mjs.
          # (#3415 removed azd from this lane entirely; the outputs are now read
          # from the ARM deployment. The history above is kept because the
          # LITERAL-`env:` defect it describes is language-level, not azd's.)
          #
          # WHICH url — consoleUrl is `https://loom-console.<caeDefaultDomain>`
          # and container-platform.bicep creates the managed environment with
          # `internal: true`, so it resolves through Private DNS inside the hub
          # VNet and nowhere else. This job runs on ubuntu-latest. Probing it
          # would report connection failures as Console failures, which is
          # exactly what redeploy-gov.sh Phase 4 refuses to do. The resolver
          # therefore answers only with a PUBLIC ingress and fails closed
          # otherwise; on this lane gcc-high.bicepparam sets frontDoorEnabled and
          # deployAppsEnabled true, so one exists by construction.
          PARAMS="$GITHUB_WORKSPACE/platform/fiab/bicep/params/gcc-high.bicepparam"
          # An UNREADABLE param file is UNKNOWN, not "apps are off": `grep` inside
          # an `if` is exempt from `set -e`, so a missing path would silently take
          # the else branch and skip the smoke test with a confident wrong reason.
          if [ ! -r "$PARAMS" ]; then
            echo "::error::cannot read $PARAMS, so it is NOT established whether this deploy stands up a Console. Refusing to skip the smoke test on an unread file."
            exit 1
          fi
          if grep -qE '^[[:space:]]*param[[:space:]]+deployAppsEnabled[[:space:]]*=[[:space:]]*true' "$PARAMS"; then
            EXPECT_CONSOLE=true
          else
            EXPECT_CONSOLE=false
          fi
          if [ "$CSA_LOOM_TOPOLOGY" = "dlz-attach" ]; then
            echo "console_url=" >> "$GITHUB_OUTPUT"
            echo "::notice::topology=dlz-attach stamps no Console, so there is no endpoint to smoke-test."
          elif [ "$EXPECT_CONSOLE" != "true" ]; then
            echo "console_url=" >> "$GITHUB_OUTPUT"
            echo "::warning::$(basename "$PARAMS") does not set deployAppsEnabled=true, so this deploy stands up no Console. The external smoke test is skipped and this run does NOT establish that the boundary serves Loom."
          else
            # Two separate command substitutions, not a pipeline: each one's
            # failure is its own and `set -e` stops on either.
            #
            # SOURCE CHANGED WITH #3415: this read `azd env get-values --output
            # json`, which only ever existed because the deploy above ran under
            # azd. There is no azd environment now, so the outputs come from the
            # ARM deployment itself — the same `output consoleUrl` /
            # `vanityPublicUrl` / `frontDoorPublicUrl` main.bicep declares, read
            # back from the deployment this step just created. `az deployment sub
            # show` returns them ARM-shaped ({"type":…,"value":…}); the resolver
            # accepts that shape as well as the flat azd one.
            ARM_OUTPUTS=$(az deployment sub show \
              --name "csa-loom-gcch-ci-${{ github.run_id }}" \
              --subscription "$DEPLOY_SUB" \
              --query properties.outputs -o json)
            SMOKE_URL=$(printf '%s' "$ARM_OUTPUTS" | node "$GITHUB_WORKSPACE/scripts/ci/resolve-smoke-console-url.mjs")
            echo "console_url=$SMOKE_URL" >> "$GITHUB_OUTPUT"
            echo "::notice::smoke-test target (public ingress): $SMOKE_URL"
          fi

      # ── ACR COMPLIANCE TAGS — APPLIED HERE, NOT BY THE TEMPLATE (#3714) ────
      # CLOUD PARITY: identical to the step in deploy-fiab-commercial.yml. The
      # admin-plane ACR carries the firewall-lease mutex as out-of-band ARM tags
      # (`loomAcrFw*`), so the template cannot own its tag dictionary:
      #   #3676  `tags: complianceTags` PUT-replaced the dict and erased the live
      #          lease mid-apply, denying an in-flight `az acr build`.
      #   #3714  a declarative `Microsoft.Resources/tags` resource read its OWN
      #          id and ARM rejected the whole template with "Circular dependency
      #          detected", breaking every `az deployment sub create`.
      # `az tag update --operation Merge` adds the keys server-side and touches
      # nothing else. This lane's tag set (Environment=GCC-High, DISA_IL=IL4,
      # Data_Classification=CUI, M365_Boundary=GCC-High, …) comes from
      # gcc-high.bicepparam, so it cannot drift from what the deployment used.
      - name: Apply ACR compliance tags (merge-patch, out-of-band — #3714)
        if: steps.provision.conclusion == 'success'
        run: |
          set -uo pipefail
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          ACR_ERR="$RUNNER_TEMP/acr-tag-resolve.err"
          : > "$ACR_ERR"
          ACR=$(az acr list -g "$RG" --query "[?starts_with(name,'acrloom')]|[0].name" -o tsv 2> "$ACR_ERR" | tr -d '\r')
          ACR_RC=$?
          if [ "$ACR_RC" -ne 0 ]; then
            echo "::error::Could not LIST registries in $RG (az exited $ACR_RC), so whether this estate has an ACR to tag is UNKNOWN. Raw stderr:"
            sed -n '1,20p' "$ACR_ERR" >&2
            exit 1
          fi
          if [ -z "$ACR" ]; then
            echo "::error::Provision succeeded but no 'acrloom*' registry exists in $RG. The admin-plane ACR is not optional."
            exit 1
          fi
          bash scripts/csa-loom/apply-acr-compliance-tags.sh \
            --acr "$ACR" \
            --params-file platform/fiab/bicep/params/gcc-high.bicepparam

      # Front Door -> ACA env Private Link approval (#3203). CLOUD PARITY: the
      # sovereign lanes previously passed an EMPTY scriptIdentityId so the ARM
      # deploymentScript never ran, and the documented substitute was the
      # operator clicking Approve in the portal. That is exactly what
      # auto-bind-by-default.md forbids, applied to the boundary that can least
      # afford a manual step. Same script, same behaviour, every cloud.
      - name: Approve the Front Door -> ACA private-endpoint connection
        if: github.event_name == 'schedule' || inputs.run_mode == 'full'
        run: |
          set -euo pipefail
          CAE_ID=$(az containerapp env show -n "cae-csa-loom-${{ env.AZURE_LOCATION }}" -g "rg-csa-loom-admin-${{ env.AZURE_LOCATION }}" --query id -o tsv | tr -d '[:space:]')
          if [ -z "$CAE_ID" ]; then
            echo "::error::could not resolve the Container Apps managed environment id in rg-csa-loom-admin-${{ env.AZURE_LOCATION }} - cannot approve the Front Door private-endpoint connection, and Front Door answers 504 while it is Pending."
            exit 1
          fi
          bash scripts/csa-loom/approve-cae-private-endpoints.sh --cae-id "$CAE_ID" --timeout-seconds 600

      - name: Export bootstrap coordinates (for the chained Gov bootstrap)
        id: bootstrap_coords
        if: (github.event_name == 'schedule' || inputs.run_mode == 'full')
        run: |
          ADMIN_SUB=$(az account show --query id -o tsv)
          echo "admin_sub=$ADMIN_SUB" >> "$GITHUB_OUTPUT"
          # dlz_sub ONLY when a DISTINCT DLZ subscription was named (#3143) —
          # same reasoning as deploy-fiab-commercial.yml. Defaulting to
          # $ADMIN_SUB asserted a single-subscription layout the deploy had not
          # established, and now that the callee DISCOVERS the landing zone that
          # assertion would narrow discovery to the wrong subscription.
          echo "dlz_sub=${CSA_LOOM_TARGET_SUBSCRIPTION:-}" >> "$GITHUB_OUTPUT"
          echo "region=$AZURE_LOCATION" >> "$GITHUB_OUTPUT"

      # dlz-brownfield (Gov): publish the compiled main.json + wire
      # LOOM_DLZ_TEMPLATE_URI / LOOM_SETUP_TEMPLATE_URI so the day-one in-product
      # "Add landing zone" deploy works on GCC-High too (see the Commercial
      # publish-dlz-template job for the rationale). Sovereign endpoints are
      # resolved from the account (primaryEndpoints.blob). Idempotent + best-effort.
      - name: Publish DLZ template + wire deploy env (Gov)
        if: (github.event_name == 'schedule' || inputs.run_mode == 'full') && inputs.keep_resources
        run: |
          set -e
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          CONTAINER=arm-templates
          az bicep build -f platform/fiab/bicep/main.bicep --outfile main.json
          SA=$(az storage account list -g "$RG" --query "[?starts_with(name,'stloom')||starts_with(name,'saloom')||starts_with(name,'stcsaloom')].name | [0]" -o tsv 2>/dev/null || echo "")
          if [[ -z "$SA" ]]; then SA=$(az storage account list -g "$RG" --query "[0].name" -o tsv 2>/dev/null || echo ""); fi
          if [[ -z "$SA" ]]; then echo "::warning::No storage account in $RG — day-one Gov deploy stays gated."; exit 0; fi
          BLOB_BASE=$(az storage account show -g "$RG" -n "$SA" --query "primaryEndpoints.blob" -o tsv)
          BLOB_URL="${BLOB_BASE}${CONTAINER}/main.json"
          KEY=$(az storage account keys list -g "$RG" -n "$SA" --query "[0].value" -o tsv 2>/dev/null || echo "")
          az storage container create --account-name "$SA" --name "$CONTAINER" ${KEY:+--account-key "$KEY"} -o none 2>/dev/null || true
          az storage blob upload --account-name "$SA" --container-name "$CONTAINER" --name main.json --file main.json ${KEY:+--account-key "$KEY"} --overwrite -o none || { echo "::warning::main.json upload failed — day-one Gov deploy stays gated."; exit 0; }
          EXPIRY=$(date -u -d '+3 years' '+%Y-%m-%dT%H:%MZ' 2>/dev/null || date -u -v+3y '+%Y-%m-%dT%H:%MZ')
          SAS=""
          if [[ -n "$KEY" ]]; then SAS=$(az storage blob generate-sas --account-name "$SA" --account-key "$KEY" --container-name "$CONTAINER" --name main.json --permissions r --expiry "$EXPIRY" -o tsv 2>/dev/null || echo ""); fi
          CONSOLE_VARS="LOOM_DLZ_TEMPLATE_URI=$BLOB_URL LOOM_SETUP_TEMPLATE_URI=$BLOB_URL"
          if [[ -n "$SAS" ]]; then CONSOLE_VARS="$CONSOLE_VARS LOOM_DLZ_TEMPLATE_QUERY_STRING=?$SAS"; fi
          az containerapp update -g "$RG" -n loom-console --set-env-vars $CONSOLE_VARS -o none || echo "::warning::could not set loom-console template env"
          if az containerapp show -g "$RG" -n loom-setup-orchestrator -o none 2>/dev/null; then
            ORCH_VARS="LOOM_SETUP_TEMPLATE_URI=$BLOB_URL"
            if [[ -n "$SAS" ]]; then ORCH_VARS="$ORCH_VARS LOOM_DLZ_TEMPLATE_QUERY_STRING=?$SAS"; fi
            az containerapp update -g "$RG" -n loom-setup-orchestrator --set-env-vars $ORCH_VARS -o none || echo "::warning::could not set loom-setup-orchestrator template env"
          fi
          echo "::notice::Gov: published main.json → $BLOB_URL and wired day-one Add-landing-zone deploy env."

      - name: Smoke test (Gov-specific)
        # Runs only when the Provision step RESOLVED a reachable target. That
        # output is empty in exactly two DECLARED states — topology=dlz-attach
        # (no Console is stamped) and a param file that deploys no apps — and
        # the resolver FAILS the provision step rather than emitting an empty
        # value in every other case, so this condition cannot silently absorb a
        # resolution defect.
        if: (github.event_name == 'schedule' || inputs.run_mode == 'full') && steps.provision.outputs.console_url != ''
        run: bash .github/scripts/fiab-smoke-test.sh
        env:
          CONSOLE_URL: ${{ steps.provision.outputs.console_url }}
          BOUNDARY: GCC-High

      # NEVER ON THE SCHEDULE. This condition used to read
      #   (github.event_name == 'schedule' || inputs.run_mode == 'full')
      # so the DAILY 10:00 UTC cron tore the GCC-High estate down on every
      # successful run: a scheduled event carries no inputs, so
      # `!inputs.keep_resources` is `!''` = TRUE and nothing stopped it.
      #
      # The Commercial lane has always guarded `github.event_name != 'schedule'`
      # for exactly this reason. The sovereign lanes inverted it.
      #
      # This is why re-enabling `deploy-fiab-gcch` was unsafe: the lane is
      # `disabled_manually`, and the first thing turning it back on would have
      # done is arm an unattended sovereign teardown. Twelve of GCC-High's 16
      # blocked capabilities are merged fixes waiting on this lane to run, so
      # "just re-enable it" was a genuinely tempting and genuinely destructive
      # move. Fixed here FIRST, so enabling the lane is a safe act.
      - name: Teardown
        if: success() && github.event_name != 'schedule' && inputs.run_mode == 'full' && !inputs.keep_resources
        run: bash .github/scripts/fiab-teardown.sh
        env:
          RG_NAME: rg-csa-loom-admin-${{ env.AZURE_LOCATION }}

      - name: Note dry-run completion
        if: success() && inputs.run_mode == 'whatif-only'
        run: |
          echo "✅ whatif-only run complete. Bicep + auth validated; no resources provisioned."

      - name: Notify on failure (dedicated, OPEN issue - never a closed one)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Was: a comment on `issue_number: 279` - "CSA Loom - v1 build roadmap",
        # state CLOSED, 289 comments - with the body "Check workflow logs". That
        # is the literal mechanism by which 47 days of daily deploy failure
        # stayed invisible (deploy-integrity.md). The notifier now opens/updates
        # ONE dedicated OPEN issue per failing workflow, renders the classified
        # failure from deploy-failure.json, and FAILS if it cannot notify.
        run: |
          node .github/scripts/deploy-notify-failure.mjs \
            --workflow deploy-fiab-gcch \
            --result "${{ job.status }}" \
            --failure-json "$GITHUB_WORKSPACE/deploy-failure.json"

  # rel-T32 (B8): Gov post-deploy bootstrap. The SAME reusable bootstrap the
  # Commercial workflow calls, but with boundary=GCC-High so it runs
  # `az cloud set --name AzureUSGovernment` + logs in with the AZURE_GOV_* secret
  # set. Only when a real, KEPT Gov deploy stands (keep_resources=true skips
  # teardown). This is the automated all-Gov-day-one path — no copy-pasted logic.
  post-deploy-bootstrap:
    name: Post-deploy bootstrap (GCC-High)
    needs: deploy-validate
    if: ${{ inputs.keep_resources && (github.event_name == 'schedule' || inputs.run_mode == 'full') && needs.deploy-validate.result == 'success' }}
    uses: ./.github/workflows/csa-loom-post-deploy-bootstrap.yml
    secrets: inherit
    with:
      boundary: GCC-High
      region: ${{ needs.deploy-validate.outputs.region }}
      admin_subscription: ${{ needs.deploy-validate.outputs.admin_sub }}
      dlz_subscription: ${{ needs.deploy-validate.outputs.dlz_sub }}
