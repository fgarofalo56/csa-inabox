name: Test Suite

on:
  pull_request:
    branches: [main]
    # No paths filter — branch protection requires these checks on every PR.
  push:
    branches: [main]
    # THE SINGLE SOURCE OF TRUTH for "is this change Python-relevant?" (#3862).
    # The PR-side detector below does NOT carry a second copy of this list; it
    # parses THIS list out of THIS file via scripts/ci/python_trigger_scope.py.
    # There used to be two lists and they disagreed in BOTH directions -
    # apps/fiab-setup-orchestrator was here and not there, tools/ was there and
    # not here - so three REQUIRED contexts reported success over unexecuted
    # code. Two lists that must agree cannot be kept in agreement by review.
    paths:
      # SHAPE, NOT SPELLING. This head matches any Python file ANYWHERE in the
      # repo - at ANY depth, INCLUDING the repo root, and under directories
      # nobody has created yet - so a directory can no longer be omitted by
      # being forgotten, which is the entire defect #3862 reported
      # (apps/copilot: 137 tracked .py, matched by nothing).
      # Do NOT "tidy" these to '**/*.py'. That form drops depth 0, and this repo
      # has ZERO root-level tracked .py, so the population test over the tree
      # cannot see the difference - measured. A conftest.py / setup.py /
      # noxfile.py added later would match nothing and three REQUIRED contexts
      # would report success over an unexecuted suite. Root-level probes in
      # tests/repo/test_python_trigger_scope.py hold this shape.
      # .ipynb is here because python_lint_scope.LINTABLE_SUFFIXES lints
      # notebooks too and six tracked ones are in its population.
      - '**.py'
      - '**.ipynb'
      # The directories the jobs below actually READ, IN FULL - the head above
      # covers their Python but not their NON-Python inputs (dbt's .sql/.yml
      # models under domains/, pytest fixtures under tests/ and portal_tests/,
      # an app's Dockerfile). Every entry names WHICH reader requires it, and
      # tests/repo/test_python_trigger_scope.py derives those readers
      # mechanically - from python_lint_scope.SCOPE_DIRS, pyproject's
      # `testpaths`, the bandit argv below, PIP_CONSTRAINT, and the app the
      # fresh-resolve job names - so widening a reader without widening this
      # list turns that test RED rather than quietly leaving a hole.
      - 'csa_platform/**'      # ruff scope + bandit scope + pytest testpath
      - 'dev-loop/**'          # ruff scope
      - 'domains/**'           # ruff scope + bandit scope + the dbt jobs below
      - 'governance/**'        # ruff scope
      - 'scripts/**'           # ruff scope + bandit scope
      - 'tools/**'             # ruff scope
      - 'tests/**'             # pytest testpath
      - 'portal/shared/portal_tests/**'   # pytest testpath (271 tests)
      # apps/loom-duckdb is a deployed container app whose ONLY automated
      # signal is tests/loom_duckdb (#2543). Its requirements.txt pins duckdb
      # and pyarrow, so a dependency bump has to reach this lane.
      - 'apps/loom-duckdb/**'
      # apps/fiab-setup-orchestrator is a default-ON Container App in Commercial
      # and a GitOps workload on GCC-High / IL5. Its Dockerfile fresh-resolves
      # its own pyproject on every image build and apps/** is NOT in the root
      # `testpaths`, so the app-fresh-resolve job below is its ONLY automated
      # signal (story 3063).
      - 'apps/fiab-setup-orchestrator/**'
      # The dependency inputs that DECIDE what this suite installs.
      # requirements/ci-constraints.txt is PIP_CONSTRAINT below - it bounds all
      # ~22 independent pip resolutions this job performs - and the install
      # step's `find . -name requirements.txt` reaches every requirements file
      # in the tree. Neither reached any lane before #3862.
      - 'pyproject.toml'
      - 'requirements/**'
      - 'requirements*.txt'
      - '**/requirements*.txt'
      - '.github/workflows/test.yml'
  schedule:
    - cron: '37 3 * * 1'
  # REQUIRED-CHECK DISPATCH (#3393). release-please opens its PR with
  # GITHUB_TOKEN, and GitHub *intentionally* suppresses the downstream
  # `pull_request` trigger on such PRs — the runs are never created, so the four
  # required contexts this workflow publishes (Python Tests 3.10/3.11/3.12 and
  # dbt Compile shared/finance/inventory/sales) never report and used to be
  # replaced by SYNTHETIC statuses that no test produced.
  # `workflow_dispatch` (with `repository_dispatch`) is the ONE documented
  # exception to that suppression — GITHUB_TOKEN *can* trigger it — so
  # release-please.yml dispatches this workflow against the release branch and
  # gets REAL results. Under a dispatch `github.event_name != 'pull_request'`,
  # so the change-detection step below takes its "always run" branch: the FULL
  # suite runs, which is the conservative direction.
  workflow_dispatch:
  # MERGE QUEUE. This lane publishes SEVEN of the fifteen required contexts
  # (Python Tests 3.10/3.11/3.12, dbt Compile shared/finance/inventory/sales).
  # A merge group is gated on the same required set as a PR, and a context that
  # never reports leaves the group PENDING — the queue does not fail it, it times
  # out and ejects the PR — so a missing trigger here would stall every merge.
  #
  # BARE ON PURPOSE: the `paths:` list above is attached to `push:`, and it must
  # NOT be inherited here. A merge group whose batch touched no Python path would
  # then never produce these seven contexts.
  #
  # THREE THINGS TO KNOW ABOUT HOW THE JOBS BEHAVE HERE, all verified against the
  # bodies below rather than assumed:
  #   * `python-tests` gates its heavy steps on a step-level check that reads
  #     `github.event_name != 'pull_request'` -> under `merge_group` that is TRUE,
  #     so `run=true` and the FULL suite runs. That is the conservative direction
  #     and it is the one we want: the merge-group tree is a combination of PRs
  #     that were never tested together. Do NOT "optimise" this into a
  #     merge-group-aware diff — a wrong range here reports a REQUIRED check green
  #     over an unexamined tree.
  #   * `dbt-compile` has no `if:` and no event dependency at all.
  #   * `pr-summary` IS gated `github.event_name == 'pull_request'` and therefore
  #     skips here. That is CORRECT, not an oversight: it posts a comment via
  #     `context.issue.number`, which does not exist in a merge group, and "PR
  #     Summary" is not a required context.
  merge_group:

concurrency:
  # #3426 — per-SHA on push/dispatch. This lane is the WORST case measured: it
  # publishes SEVEN required contexts (Python Tests 3.10/3.11/3.12 and dbt
  # Compile shared/finance/inventory/sales), and with a ref-keyed group +
  # cancel-in-progress:true, 11 of its last 30 main runs were cancelled
  # (2026-08-14) — 11 commits on main with no verdict from seven mandatory
  # checks. A cancelled required check is an ABSENCE, not a pass. See
  # scripts/ci/check-required-lane-concurrency.mjs, which now enforces this.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Needed to post/update coverage and summary comments on PRs.
  pull-requests: write

jobs:
  python-tests:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # 15 WAS NOT ENOUGH, AND IT RAN OUT SILENTLY. A job that exceeds
    # `timeout-minutes` is reported as `cancelled`, not `failure`, so a REQUIRED
    # context died against the clock and read as a flake. Measured on #4491's
    # four heads, same job, same 3.10 leg (the mutation matrix is pinned there):
    #
    #   bf9e3450f57  matrix 336s  job 844s   56s of headroom
    #   003afb915f   matrix 358s  job 878s   22s
    #   4ba18cfc475  matrix 383s  job 871s   29s
    #   693a75a9f2c  matrix 396s  job 918s   CANCELLED at the 900s wall
    #
    # Not a flake: four monotonic rows into a fixed ceiling. Both multiplicands
    # grow together -- arms and tests -- because every arm runs the whole suite,
    # so the curve is superlinear and a re-run at a ~2% margin is a coin flip.
    # A required context that passes on a coin flip is the "green over nothing"
    # shape this repo refuses, so the budget is raised rather than retried.
    #
    # Raised rather than SPLIT deliberately -- AND THAT DECISION IS NOW
    # REVERSED; see SPLIT, 2026-09-19 at the foot of this block. The argument
    # was that moving the matrix to its own job would take it OUT of the
    # required set until branch protection is updated in the same change -- a
    # guard that silently stops blocking, which is worse than a slow one. That
    # risk was real and is not waved away: what changed is that raising the
    # ceiling did not work either (twice more, below), so the risk is now
    # ANSWERED at the new job rather than avoided by not splitting.
    #
    # 30 WAS NOT ENOUGH EITHER, AND THE ARGUMENT ABOVE PREDICTED IT. Three more
    # cancellations, the last one fully instrumented -- job 104280343412, head
    # ff4562eca21:
    #
    #   job     06:42:25 .. 07:12:42  = 30m17s  CANCELLED at the wall
    #   setup   06:42:25 .. 06:51:36  =  9m11s
    #   matrix  06:51:36 .. 07:12:38  = 21m02s  cut off mid-run
    #
    #   CONTROL rc=0  430 passed, 3 skipped, 1 deselected in 5.47s
    #   225 arm executions, 225 distinct ids, EVERY ONE killed, zero survivors
    #   5.48 s/arm -- i.e. exactly the CONTROL suite runtime, because each arm
    #   re-runs the whole suite
    #   247 arms are declared; it reached 225 and ran out of clock
    #
    #   247 x 5.48s = 22.6 min matrix + 9.2 min setup = 31.8 min vs a 30 wall
    #
    # THE 225 WAS WRITTEN AS 220 IN THREE PLACES HERE, AND WAS WRONG IN ALL
    # THREE -- including "220 distinct ids", which was wrong about the count AND
    # about there being a gap between executions and ids. Re-measured from the
    # cited job's own log: 225 lines matching `KILLED   `, 225 distinct arm-id
    # tokens, zero duplicates, zero BLIND SPOT, zero NOT A KILL, zero SKIP. A
    # reviewer measured it first and I reproduced it before editing. This is the
    # second stale number in this block; see the 240 note below.
    #
    # THAT ARM COUNT WAS FIRST WRITTEN AS 240 AND WAS WRONG -- it came from a
    # grep over the arm literals, which undercounts. `len(ARMS)` is the only
    # authority and it reads 247 at this head (an independent reviewer measured
    # 243 at d39907a5421, and four arms have landed since; both are right at
    # their own sha). Corrected here, in the comment that exists because a
    # number in prose nothing enforces is how this job ran out of clock twice.
    #
    # ~6% over, which is the same coin-flip margin the 15-minute ceiling died
    # at. The guard is WORKING -- 225/225 killed. What ran out was the budget,
    # and a job that exceeds `timeout-minutes` reports as `cancelled` rather
    # than `failure`, so it reads as a flake three times over.
    #
    # 45 WAS CHOSEN FOR HEADROOM, NOT FOR FIT -- AND IT DIED ANYWAY, TWO HEADS
    # AFTER IT LANDED. The paragraph this replaces projected ~33.3 min against
    # the 45 wall and called it "~35% headroom", while flagging that the floor
    # it scaled from had gone stale one commit after being written. It went
    # stale again, faster. Measured on the two most recent 3.10 legs:
    #
    #   2843bd3cc49 (#4555 final)  03:32:24 .. 04:17:24 = 45m00s  success, 0s
    #   33856071b2c (#4591)        04:47:57 .. 05:33:15 = 45m18s  CANCELLED
    #
    # `len(ARMS)` reads 330 at 58e800233ac against the 247 that justified 45 --
    # +34% with the wall unmoved -- and #4591, #4593, #4596, #4613 and #4625
    # were all blocked behind a REQUIRED context that had run out of clock.
    # Three ceilings (15, 30, 45) and four cancellations: the ceiling was never
    # the variable.
    #
    # SPLIT, 2026-09-19 (#4555). The matrix moved to the `drain-mutation-matrix`
    # job below, which is where the budget arithmetic now lives. The sibling
    # legs -- these same steps minus that one -- measured 8m29s (3.11) and
    # 13m04s (3.12) at 2843bd3cc49, so that is the scale this context returns
    # to. MEASURED AFTER THE SPLIT, run 35469150763 at 7d1708db097, all three
    # legs green in the same run: 3.10 = 9m29s, 3.11 = 8m29s, 3.12 = 11m10s.
    # So 45m00s -> 9m29s, and this leg now sits MID-PACK among its siblings
    # instead of at 3.4x the largest of them.
    #
    # 45 IS LEFT UNCHANGED HERE, DELIBERATELY, AS UNFITTED HEADROOM. It is now
    # ~3.5x the largest sibling rather than a number derived from this job's
    # cost, and it is NOT evidence about what this leg costs -- read the sibling
    # durations for that. Tightening it is a separate change with its own
    # measurement: the defect being fixed here is a REQUIRED context dying
    # against a wall, and narrowing that wall in the same commit that removes
    # the thing which hit it would risk re-creating the outage on a number that
    # is still a projection.
    #
    # WHAT THE SPLIT DOES NOT FIX. Every arm still re-runs the WHOLE suite, so
    # the matrix costs arms x suite and both multiplicands grow. The split buys
    # this required lane its clock back; it does not make the matrix cheap, and
    # the new job's own budget is therefore on the same treadmill. The real fix
    # -- most arms are killed by a handful of named assertions -- is tracked
    # separately, because narrowing an arm's test selection is precisely how a
    # GREEN arm becomes ambiguous between "blind test" and "wrong subset".
    timeout-minutes: 45
    env:
      # This job builds ONE environment out of ~22 INDEPENDENT pip resolutions
      # (the pyproject extras, then 20 per-domain requirements.txt, then
      # apps/loom-duckdb). No single resolution sees the whole graph, so pip
      # cannot detect a cross-file conflict — it warns and proceeds, and the
      # version that survives is whichever installed LAST. That order comes from
      # `find`, i.e. directory-traversal order, which is not stable across
      # machines. PIP_CONSTRAINT applies the same ceiling to every one of those
      # resolutions, which is the only way to make the end state deterministic
      # without installing the locks (deliberately excluded — see #3485 and the
      # comment above the install step).
      #
      # It bounds protobuf only. See requirements/ci-constraints.txt for the
      # measured reason (#4077): dbt-core 1.8.9 fences protobuf<6.0 while
      # googleapis-common-protos>=1.75.1 demands protobuf>=6.33.5, and when the
      # loop happened to leave protobuf at 5.29.6 the 6.33.5 gencode in
      # google/rpc/error_details_pb2.py raised VersionError and failed
      # COLLECTION for the whole suite.
      PIP_CONSTRAINT: ${{ github.workspace }}/requirements/ci-constraints.txt
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Need the PR base in history to diff changed paths below.
          fetch-depth: 0

      # The Python suite is a REQUIRED check on every PR (branch protection),
      # but it has nothing to test on a TS-only / docs-only PR — yet it spends
      # ~15 min installing the full Python stack + running pytest/mypy/bandit.
      # That made every apps/fiab-console PR wait on irrelevant work and was the
      # main merge-queue blocker. Detect whether any Python-relevant path
      # changed; if not, the job still runs + reports SUCCESS (so the required
      # check is satisfied) but skips the heavy steps. Pushes / schedule always
      # run the full suite. This is a step-level gate (not a job `if:`) so the
      # check can never get stuck "pending" and block a merge.
      # MERGE GROUPS LAND ON THE "always run" BRANCH BELOW, deliberately. A merge
      # group is a combination of PRs that were never tested together, and its
      # `github.event.pull_request` payload is empty — so there is no honest range
      # to narrow with, and running the full suite is the only answer that cannot
      # report this REQUIRED check green over an unexamined tree. Do NOT add a
      # merge-group-aware diff here to save minutes; `merge_group.base_sha` would
      # be the range, but getting it wrong reports seven required contexts green
      # on code nothing executed.
      # THIS STEP IS A DELEGATE, and the tests below now enforce that
      # BEHAVIOURALLY. It may force-run - `run=true` for a non-PR event, a
      # failed diff, an empty diff, an unwritable temp file, a module that could
      # not answer, or a change to this file itself; every one of those errs
      # toward RUNNING MORE. It may NOT decide to skip. Do not add a cheap
      # pre-filter "to save a python3 start": a 103-byte extension test spliced
      # in above the module call flipped pyproject.toml,
      # requirements/ci-constraints.txt, dbt's .sql models, an app Dockerfile,
      # a pytest fixture and apps/loom-duckdb's requirements.txt to run=false -
      # measured, with the whole guard green, because that guard only scanned
      # this script for DIRECTORY LITERALS and an extension test carries none.
      # tests/repo/test_python_trigger_scope.py now EXTRACTS this step, RUNS it
      # in bash against probe paths, and diffs its verdict against the module's,
      # so any narrowing is RED whatever it is written with.
      #
      # (Prose lives here rather than inside the `run:` body on purpose — see the
      # note further down about actionlint piping each script through shellcheck.)
      - name: Detect Python-relevant changes
        id: relevant
        run: |
          # Always run for non-PR events (push to main / schedule / merge_group).
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          # FAIL OPEN, and say WHICH failure happened. These two conditions used
          # to share one branch behind a `2>/dev/null`, so "git could not diff"
          # and "the diff was empty" printed the same sentence and git's own
          # reason was discarded - the shape deploy-integrity R7 forbids.
          if ! changed="$(git diff --name-only "$base"...HEAD)"; then
            echo "::warning::git diff against the PR base FAILED (its stderr is in this log) - running the full Python suite (fail-open)."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$changed" ]; then
            echo "::warning::The changed-file list came back EMPTY - running the full Python suite (fail-open)."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tmp="${RUNNER_TEMP:-/tmp}/python-trigger-changed.txt"
          if ! printf '%s\n' "$changed" > "$tmp"; then
            echo "::warning::Could not write the changed-path list to $tmp - running the full Python suite (fail-open)."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # SELF-REFERENCE, hard-coded HERE and deliberately OUTSIDE the parsed
          # list. '.github/workflows/test.yml' is ALSO an entry in on.push.paths,
          # but membership alone is self-defeating: a PR that DELETED that entry
          # would be judged by the list it had just deleted from, take the skip
          # branch, and carry the test that guards this file out of the run with
          # it. This line is the one thing editing the list cannot switch off.
          if grep -qxF '.github/workflows/test.yml' "$tmp"; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # ONE list. The patterns are on.push.paths, READ OUT OF THIS FILE -
          # not a second copy of it that has to be kept in agreement by review.
          # rc is captured on the line immediately after the assignment, not
          # after a pipe, so it is this command's status and not some tail's.
          verdict="$(python3 scripts/ci/python_trigger_scope.py --changed-file "$tmp" --explain)"
          rc=$?
          if [ "$rc" -ne 0 ] || [ -z "$verdict" ]; then
            echo "::warning::python_trigger_scope.py could not answer (rc=$rc) - running the full Python suite (fail-open)."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$verdict" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = "run=false" ]; then
            echo "::notice::No Python-relevant changes in this PR - skipping the Python test suite (reporting success)."
          fi

      - name: Set up Python
        if: steps.relevant.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # WHY `./requirements/locks/*` IS EXCLUDED FROM THE PER-DOMAIN LOOP BELOW
      # (#3485). This reasoning lives in a YAML comment rather than inside the
      # `run:` body on purpose — see the note at the end.
      #
      # Those ten files are the compiled, hash-pinned locks: 495 exact pins
      # across the whole extras surface, including a `starlette==` and a
      # `fastapi==`. Installed into this single shared environment they would
      # decide what tests/loom_duckdb measures, which is the #2615 defect
      # verbatim. The guard written for #2615 could not see it either:
      # scripts/ci/assert_installed_pins.py read ZERO pins from all ten,
      # because every pin line in a --generate-hashes lock ends in a
      # continuation and its `_PIN` regex is anchored with `$`. So the static
      # model in tests/repo/test_python_ci_dependency_order.py read an EMPTY
      # file while `pip install -r` applied all 495 at runtime — green over the
      # exact hazard it exists for. Measured: this loop's population goes 20 ->
      # 30 without the exclusion. Both halves are fixed; the parser can now see
      # such a file, and that test asserts the exclusion is present AND that the
      # locks it excludes really do pin fastapi/starlette.
      #
      # They also do not belong here on their own terms: the locks are compiled
      # for Python 3.12 and this job is a 3.10/3.11/3.12 matrix, so two of the
      # three legs would emit ten spurious "pip install FAILED" annotations. The
      # extras this job needs are installed above, from pyproject.toml, as
      # FLOORS.
      #
      # KEEP LONG PROSE OUT OF THE `run:` BODY. actionlint pipes each `run:`
      # script through shellcheck, and adding this block INSIDE the script made
      # `actionlint .github/workflows/test.yml` stop terminating — measured, 90s
      # with no result versus ~2s without it, and no single line was the
      # trigger (removing any one still hung; removing the block did not). A
      # lint that HANGS is worse than one that fails: it burns the job timeout
      # and reports nothing. YAML comments are never handed to shellcheck.
      - name: Install dependencies
        if: steps.relevant.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          # Install the project with dev + governance + functions extras so
          # ruff / pytest / pytest-cov / mypy and all Azure SDK deps come
          # from pyproject.toml. `serving` adds duckdb + pyarrow + fastapi for
          # tests/loom_duckdb (#2543) — a FLOOR only; the app's own
          # requirements.txt below re-pins them to the exact runtime versions,
          # which is what makes a dependabot bump a real signal.
          pip install -e ".[dev,governance,functions,portal,bff,postgres,tutorials,streaming,serving]"
          # Install any additional per-domain requirements. These stay tolerant
          # (many are optional/experimental runners not under test here), but a
          # failure is now SURFACED as a CI annotation + a job-summary line
          # instead of vanishing into `|| true`.
          failed_reqs=""
          # requirements/locks/* is excluded — see the YAML comment above this
          # step for why (#3485). Do not re-add it.
          for req in $(find . -name "requirements.txt" -not -path "*/dbt-env/*" -not -path "*/.venv/*" -not -path "./apps/loom-duckdb/*" -not -path "./requirements/locks/*"); do
            if ! pip install -r "$req"; then
              echo "::warning file=${req#./}::pip install -r ${req#./} FAILED - its dependencies are absent from the test environment."
              failed_reqs="${failed_reqs} ${req#./}"
            fi
          done
          if [ -n "$failed_reqs" ]; then
            echo "### :warning: requirements.txt installs that failed" >> "$GITHUB_STEP_SUMMARY"
            for req in $failed_reqs; do echo "- \`$req\`" >> "$GITHUB_STEP_SUMMARY"; done
          fi
          # mypy >= 1.16 added a hard dependency on pathspec and imports
          # `pathspec.patterns.gitignore`, which only exists in pathspec >= 0.12.
          # The per-domain requirements loop above can pull an older transitive
          # pathspec, breaking `mypy` at import time ("No module named
          # 'pathspec.patterns.gitignore'"). Force the modern version so the
          # mypy step always finds the expected module layout. See
          # https://github.com/python/mypy/issues/19275. (Independent of the
          # loom-duckdb install below — nothing there touches pathspec.)
          pip install -U 'pathspec>=0.12.1'
          # ---------------------------------------------------------------
          # apps/loom-duckdb/requirements.txt goes LAST. It describes the
          # container image that actually SHIPS, and tests/loom_duckdb is its
          # ONLY automated signal (#2543), so it must be the file that decides
          # the stack under test — not `find` order.
          #
          # This used to run BEFORE the loop, which silently lost (#2615): six
          # other requirements files pin fastapi 0.115.x, and fastapi 0.115.x
          # (starlette<0.42) and fastapi 0.140.13 (starlette>=0.46) are mutually
          # exclusive, so the loop downgraded fastapi and a trailing
          # `starlette>=0.40,<0.42` pin locked the downgrade in. Only duckdb and
          # pyarrow were re-asserted, so the HTTP tier was exercised against a
          # FastAPI the image never runs — and the suite passed on both stacks,
          # which is why it produced no signal at all.
          #
          # Verified before/after in a clean venv: tests/loom_duckdb (99) and
          # portal/shared/portal_tests (271) are green on fastapi 0.140.13 +
          # starlette 1.3.1. The five apps pinned at fastapi 0.115.x have no
          # collected test that imports their FastAPI app (tests/fiab_dbt_runner
          # and tests/loom_transform_runner load the dependency-free redact.py by
          # path), so nothing under test constructs a 0.115-era app. That is what
          # retires the old starlette pin: the `on_startup` TypeError it guarded
          # against is a fastapi-0.115 constructor behaviour, and 0.115 is no
          # longer the resolved fastapi.
          #
          # NO `|| true`: a swallowed failure here is exactly the bug this lane
          # exists to catch.
          pip install -r apps/loom-duckdb/requirements.txt
          # Assert it actually won. Prints every pinned distribution with its
          # resolved version and FAILS the step on any mismatch, so a new
          # requirements.txt landing later in `find` order, or a future
          # reordering, is loud instead of silent (#2615).
          python scripts/ci/assert_installed_pins.py \
            apps/loom-duckdb/requirements.txt \
            --label 'apps/loom-duckdb (the image tests/loom_duckdb must measure)'

      - name: Lint with ruff
        if: steps.relevant.outputs.run == 'true'
        # NOT `ruff check domains/ scripts/ csa_platform/ tools/`. That form asks
        # ruff to WALK those directories, and ruff respects .gitignore, whose
        # line 34 is `data/` - so it silently skipped the nine tracked
        # scripts/data/*.py files carrying 216 findings (10 of them F401).
        # Measured: adding --no-respect-gitignore to the old command flipped it
        # from RC=0 to RC=1 with exactly 216 errors. This lane was blind in the
        # same way `make validate` was, so those findings were enforced by
        # nothing, anywhere.
        #
        # python_lint_scope.py passes ruff EXPLICIT tracked paths instead, and
        # asserts every run that ruff opened all of them. It is the SAME module
        # dev-loop/gates/validate-python.ps1 runs, so CI and `make validate` can
        # no longer grade different files. See #3811; debt ratchet in #3990.
        run: |
          python scripts/ci/python_lint_scope.py --output-format github

      - name: Security scan with Bandit
        if: steps.relevant.outputs.run == 'true'
        run: |
          bandit -r csa_platform/ domains/ scripts/ -c pyproject.toml

      - name: Typecheck with mypy (strict)
        if: steps.relevant.outputs.run == 'true'
        run: |
          # The default mypy config covers csa_platform.governance + tests. The three
          # Function apps each ship a flat function_app.py file, so they
          # are checked with explicit invocations (one per app) to avoid
          # module-path collisions.
          mypy
          mypy csa_platform/functions/aiEnrichment/functions/function_app.py
          mypy csa_platform/functions/eventProcessing/functions/function_app.py
          mypy csa_platform/functions/secretRotation/functions/function_app.py

      - name: Validate data product contracts
        if: steps.relevant.outputs.run == 'true'
        run: |
          python -m csa_platform.governance.contracts.contract_validator --ci --repo-root .

      - name: Check dbt schema drift against contracts
        if: steps.relevant.outputs.run == 'true'
        run: |
          python -m csa_platform.governance.contracts.dbt_test_generator --repo-root . --check

      - name: Run pytest with coverage
        if: steps.relevant.outputs.run == 'true'
        env:
          ENVIRONMENT: local
        run: |
          # --cov-fail-under is the ENFORCED gate (the pytest-cov CLI flag
          # overrides pyproject.toml's fail_under). Keep this in lockstep with
          # `fail_under` in pyproject.toml [tool.coverage.report]. Raised
          # 60 → 75 on 2026-07-20 (WS-F3); measured gated coverage was 81.33%.
          pytest \
            --cov \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=75

      # THE DRAIN MUTATION MATRIX USED TO BE A STEP HERE, gated
      # `steps.relevant.outputs.run == 'true' && matrix.python-version ==
      # '3.10'`. It moved to the `drain-mutation-matrix` job below on
      # 2026-09-19 (#4555) -- see the timeout block at the top of this job for
      # the measurement that forced it. Do NOT re-add it here: it was ~70% of
      # this REQUIRED context's runtime and it is what killed three successive
      # ceilings.

      - name: Upload coverage report (xml + html)
        if: always() && steps.relevant.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

      - name: Coverage summary
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11' && steps.relevant.outputs.run == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const xml = fs.readFileSync('coverage.xml', 'utf8');
            const match = xml.match(/line-rate="([\d.]+)"/);
            const pct = match ? (parseFloat(match[1]) * 100).toFixed(1) : 'N/A';
            const body = `## 📊 Coverage Report\n\nLine coverage: **${pct}%**\n\n> Full report available in the [coverage artifact](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;

            const marker = '## 📊 Coverage Report';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  # ------------------------------------------------------------------
  # THE DRAIN MUTATION MATRIX, ON THE OLDEST SUPPORTED PYTHON.
  #
  # `tools/drain/mutate_gates.py` is what certifies that the drain's test suite
  # is not BLIND: it reintroduces defects that actually happened and requires
  # the suite to go red on every one. A green suite without it is ambiguous --
  # it means either the tests discriminate or they do not. The arm count is
  # deliberately NOT written into the step: it moves every round (155 -> 205 ->
  # 209 -> 213 across #4487 alone, 247 -> 330 since), and a number in a comment
  # that nothing checks is the stale-count defect this package keeps finding in
  # its own files. `mutate_gates.py` prints and enforces its own total.
  #
  # Before #4487 NOTHING RAN IT. `grep -rn mutate_gates .github/workflows
  # Makefile` returned nothing, so "every arm KILLED" was a claim producible
  # only by hand, on whichever interpreter the author happened to have. That is
  # how `Path.read_text(newline=...)` -- a 3.13-only keyword -- shipped in the
  # runner's own normalisation loop: it ran green on three 3.13 workstations and
  # aborted before scoring a single arm on the Pythons CI runs. The control that
  # certifies the gate was the one control in the package that nothing verified.
  # That history is why the paragraph below is written the way it is.
  #
  # ---- WHY THIS IS ITS OWN JOB (#4555, 2026-09-19) -------------------------
  # It was a step in the 3.10 leg of `python-tests`, which publishes the
  # REQUIRED context `Python Tests (3.10)`. At 396s of a 918s job it was
  # already the dominant cost; at 330 arms it was ~70% of the leg, and the leg
  # hit its wall on two consecutive heads (45m00s with zero margin, then 45m18s
  # CANCELLED). A job that exceeds `timeout-minutes` reports as `cancelled`,
  # which is RED to the merge gate, so five PRs were blocked by a required
  # check that had simply run out of clock. Full measurement + the three dead
  # ceilings: the `timeout-minutes` block on `python-tests` above.
  #
  # ---- THIS IS NOT A REQUIRED CONTEXT, AND THAT IS THE RISK --------------
  # Branch protection is not a workflow file, so this split MOVES the matrix
  # out of the blocking set: `Drain Mutation Matrix (3.10)` is absent from
  # `main`'s required checks and from `tools/drain/required_contexts.json`, and
  # a red here will NOT block a merge until branch protection is changed
  # separately. No REQUIRED CONTEXT NAME MOVED -- `Python Tests (3.10)` keeps
  # its name and its job key, and this job adds a name rather than renaming one
  # -- but the SIGNAL moved from a blocking check to an advisory one, and that
  # is the exact objection the pre-split comment raised against splitting.
  #
  # It is answered three ways, none of which is "we will remember":
  #   1. The job is UNCONDITIONAL. No job-level `if:`, no change detector, no
  #      `if:` on the matrix step -- so it runs on every PR, every push, every
  #      merge group and every dispatch. It deliberately does NOT reuse
  #      `python-tests`'s `Detect Python-relevant changes` gate: a second copy
  #      of that delegation would be guarded by nothing (the tests that enforce
  #      it are scoped to `jobs["python-tests"]`), and two lists that must agree
  #      is defect #3862 verbatim. Running it on a docs-only PR costs minutes;
  #      a silently-narrowed mutation matrix costs the guarantee.
  #   2. `tests/repo/test_drain_mutation_matrix_job.py` ASSERTS all of that
  #      against this file, so re-adding a gate is RED rather than quiet.
  #   3. It is in `pr-summary`'s `needs` and its table, so its result is
  #      visible on every PR instead of only to someone who opens the run.
  #
  # ---- THE BUDGET: MEASURED, NOT PROJECTED -------------------------------
  # Measured at 7d1708db097, run 35469150763, on a GitHub Linux runner:
  #
  #   job                              21:01:52 .. 21:21:15  = 19m23s  SUCCESS
  #   checkout + setup-python + wheels 21:01:53 .. 21:02:02  =     9s
  #   matrix step                      21:02:02 .. 21:21:12  = 19m10s
  #
  # 1150s over `len(ARMS)` == 330 = 3.48 s/arm, every arm KILLED.
  #
  # THE PROJECTION THAT PRECEDED THIS SAID ~41 MIN AND WAS WRONG BY 2.1x, and
  # the reason is load-bearing rather than embarrassing. It scaled the 5.48
  # s/arm recorded inside the OLD job by the suite's growth (430 -> 581 tests)
  # and got 7.4 s/arm. The measured figure is 3.48 s/arm -- LOWER than the old
  # one despite a 35% bigger suite -- because per-arm cost is dominated by
  # interpreter and plugin startup, not by the tests, and the old number was
  # measured inside the 3.10 leg's heavy environment: ~22 pip resolutions, the
  # Azure SDK surface, pytest-cov/anyio/asyncio all loading on every one of 330
  # pytest subprocesses. Stripping the environment to two wheels cut per-arm
  # cost by ~36%. The split bought a second saving nobody planned for, and the
  # model that missed it assumed arms x tests when the real term is
  # arms x (startup + tests).
  #
  # An earlier draft budgeted 90 off that 41-min projection. Left standing it
  # would have been a comment asserting a floor 2.2x the job's real duration,
  # in the file whose entire history is stale numbers -- so it is corrected
  # here and the correction is kept, because the next person to raise this
  # number should have to argue with the measurement rather than with a guess.
  #
  # 45 = ~2.3x the measured 19m23s, i.e. room to ~740 arms at 3.48 s/arm,
  # against the +34% arm growth that killed the old ceiling in four days.
  # Deliberately wider than a fitted number because this lane is ADVISORY: an
  # overrun is a loud red advisory, not a merge freeze, so generosity costs
  # runner minutes while tightness costs another round of this. It is still NOT
  # a ceiling to grow into -- every arm still re-runs the whole suite, so the
  # next raise should be refused in favour of fixing that.
  drain-mutation-matrix:
    name: Drain Mutation Matrix (3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          # 3.10 is the FLOOR `pyproject.toml` declares, and the leg a
          # version-gated API breaks on first -- which is not hypothetical here
          # (see the 3.13-only keyword above). Pinned to one version on purpose:
          # every arm re-runs the whole suite, so a three-way matrix would
          # triple the dominant cost of the thing that just outgrew its wall.
          python-version: '3.10'

      - name: Install the matrix's dependencies
        # DELIBERATELY MINIMAL, and this is a claim with a value that breaks it:
        # if the drain package or its `__tests__` ever import a third name, the
        # sandbox control errors and `mutate_gates.py` returns non-zero BEFORE
        # scoring an arm. It fails closed and loudly; it cannot report a green
        # matrix over a missing dependency.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Drain mutation matrix (every arm must be KILLED)
        # NO `if:`. See the block above -- this is the whole point of the job.
        run: python tools/drain/mutate_gates.py

  # ------------------------------------------------------------------
  # FRESH-RESOLVE LEG (story 3063)
  #
  # apps/** is NOT in the root pyproject's `testpaths`, so no job above ever
  # collects apps/fiab-setup-orchestrator/tests. The only workflow references to
  # that app are image builds. Its Dockerfile does a bare `pip install .` with no
  # lockfile, so every image build fresh-resolves the app's own specifiers -- and
  # an uncapped azure-mgmt-resource pin resolved to 26.0.0, which no longer
  # provides Deployment / DeploymentProperties / DeploymentMode / TemplateLink or
  # even ResourceManagementClient. The Setup Wizard's Deploy path shipped broken
  # in every rebuilt image and nothing in CI could see it.
  #
  # This leg reproduces the Dockerfile's resolution in a clean venv and imports
  # what the source imports. It is keyed to the MISMATCH between the app's source
  # and its resolved environment -- not to a version string, so it stays live on
  # files that already carry the fix. It refuses to pass on an empty population
  # (missing app dir, zero third-party imports, zero resolved distributions, zero
  # image builders) and it fails on SKIPPED tests, because test_orchestrator.py
  # importorskips azure.mgmt.resource and a skip there would hide exactly this.
  #
  # CLOUD PARITY -- stated as measured, not as assumed:
  #   * There is ONE pyproject.toml and ONE Dockerfile for this app. Four
  #     workflows build that same context: build-fiab-images.yml and
  #     build-fiab-images-acr-tasks.yml and full-app-deploy-commercial.yml (the
  #     customer's private ACR) and publish-ghcr-images.yml (the public GHCR
  #     channel the in-product updater pulls). So the break shipped identically
  #     wherever the image ran, and the fix lands identically wherever it is
  #     rebuilt. The guard enumerates those builders and FAILS on zero, so a
  #     boundary-specific fork of the build context cannot slip past unnoticed.
  #   * COMMERCIAL + GCC: loom-setup-orchestrator is a live Container App
  #     (admin-plane/main.bicep `setupOrchestratorActive`), so this leg is the
  #     guard on a running deploy path there.
  #   * GCC-High + IL5: `setupOrchestratorActive` explicitly excludes those two
  #     boundaries today (`boundary != 'GCC-High' && boundary != 'IL5'`), and the
  #     comment above that var records that the image is not published to the
  #     sovereign ACR. Grepping platform/ deploy/ gitops/ helm/ charts/ found no
  #     manifest that deploys it either, so this change is NOT verified against a
  #     running GCC-High / IL5 orchestrator -- there does not appear to be one to
  #     verify against. That sovereign gap is pre-existing and untouched here;
  #     what this leg does guarantee is that when the image IS published to those
  #     boundaries, it will not carry this defect.
  app-fresh-resolve:
    name: App Fresh-Resolve (setup-orchestrator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          # Matches apps/fiab-setup-orchestrator/Dockerfile (python:3.12-slim), so
          # the resolution this leg observes is the resolution the image gets.
          python-version: '3.12'

      - name: Fresh-resolve guard (clean venv, import what the source imports)
        run: python scripts/ci/check_app_fresh_resolve.py apps/fiab-setup-orchestrator

      - name: Install the app + dev extras into a clean venv
        run: |
          set -euo pipefail
          python -m venv .venv-orch
          .venv-orch/bin/python -m pip install --disable-pip-version-check -q --upgrade pip
          .venv-orch/bin/python -m pip install --disable-pip-version-check -q './apps/fiab-setup-orchestrator[dev]'
          echo "resolved azure-mgmt-resource:"
          # NOT `pip show ... | head`: head closes the pipe after 2 lines, pip gets
          # EPIPE and exits 120, and under `set -o pipefail` that fails the STEP -
          # observed on this PR's first run, where the resolve itself had already
          # succeeded (24.0.0). A diagnostic must not fail the job it diagnoses.
          .venv-orch/bin/python -m pip show azure-mgmt-resource | sed -n '1,2p'

      - name: Run the Setup Orchestrator's own tests (never collected elsewhere)
        run: |
          set -euo pipefail
          .venv-orch/bin/python -m pytest apps/fiab-setup-orchestrator/tests \
            -o addopts= --tb=short --junitxml=orchestrator-junit.xml

      - name: Assert the run measured something and skipped nothing
        run: python scripts/ci/assert_pytest_junit.py orchestrator-junit.xml --min-tests 31

  dbt-compile:
    name: dbt Compile (${{ matrix.domain }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        domain: [shared, finance, inventory, sales]
    defaults:
      run:
        working-directory: domains/${{ matrix.domain }}/dbt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dbt
        run: |
          pip install dbt-databricks dbt-core

      - name: dbt deps
        run: dbt deps --profiles-dir . || echo "dbt deps skipped (no packages)"

      - name: Compile dbt models
        run: |
          if [ -n "$DBT_DATABRICKS_HOST" ]; then
            dbt compile --project-dir . --profiles-dir .
          else
            echo "::notice::Skipping dbt compile — no DBT_DATABRICKS_HOST configured. Compilation requires a live connection."
          fi
        env:
          DBT_DATABRICKS_HOST: ${{ secrets.DBT_DATABRICKS_HOST }}
          DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
          DBT_DATABRICKS_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}

  dbt-integration:
    name: dbt Integration (${{ matrix.domain }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        domain: [shared, finance, inventory, sales]
    defaults:
      run:
        working-directory: domains/${{ matrix.domain }}/dbt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dbt + DuckDB adapter
        run: |
          pip install dbt-core dbt-duckdb

      - name: Create DuckDB profile
        run: |
          mkdir -p ~/.dbt
          # Use a persistent DuckDB file (not :memory:) so seed data
          # survives across the separate dbt seed / dbt run / dbt test
          # steps.  The file is ephemeral — cleaned up when the runner
          # exits.
          cat > ~/.dbt/profiles.yml << 'PROFILE'
          csa_analytics:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: "ci_test.duckdb"
                schema: main
          PROFILE

      - name: dbt deps
        run: dbt deps || echo "dbt deps skipped (no packages)"

      - name: dbt seed
        run: dbt seed --target ci --profiles-dir ~/.dbt --vars '{"bronze_database":"","silver_database":"","gold_database":""}'

      - name: dbt run
        run: |
          dbt run --target ci --profiles-dir ~/.dbt \
            --vars '{"bronze_database":"","silver_database":"","gold_database":""}'

      - name: dbt test
        run: |
          # Exclude snapshot tests — dbt snapshot is not run in DuckDB CI
          # so snapshot tables don't exist and their tests would fail.
          dbt test --target ci --profiles-dir ~/.dbt \
            --vars '{"bronze_database":"","silver_database":"","gold_database":""}' \
            --exclude "snp_customers_history" "snp_products_history"

  pr-summary:
    name: PR Summary
    if: github.event_name == 'pull_request' && always()
    needs: [python-tests, drain-mutation-matrix, app-fresh-resolve, dbt-compile, dbt-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const jobs = [
              { name: 'Python Tests', id: 'python-tests' },
              // ADVISORY, not required — see the block above the job. It is
              // listed here so a matrix that stops being green is visible on
              // the PR rather than only to someone who opens the run.
              { name: 'Drain Mutation Matrix', id: 'drain-mutation-matrix' },
              { name: 'App Fresh-Resolve', id: 'app-fresh-resolve' },
              { name: 'dbt Compile', id: 'dbt-compile' },
              { name: 'dbt Integration', id: 'dbt-integration' },
            ];
            const needs = ${{ toJSON(needs) }};
            const rows = jobs.map(j => {
              const result = needs[j.id]?.result || 'skipped';
              const emoji = { success: '✅', failure: '❌', skipped: '⏭️', cancelled: '🚫' }[result] || '❓';
              return `| ${j.name} | ${emoji} ${result} |`;
            }).join('\n');

            const body = [
              '## 🧪 CI Test Summary',
              '',
              '| Job | Status |',
              '|-----|--------|',
              rows,
              '',
              `> Run: [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const marker = '## 🧪 CI Test Summary';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

