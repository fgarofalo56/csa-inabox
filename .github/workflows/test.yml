name: Test Suite

on:
  pull_request:
    branches: [main]
    # No paths filter — branch protection requires these checks on every PR.
  push:
    branches: [main]
    paths:
      - 'csa_platform/**'
      - 'domains/**'
      - 'scripts/**'
      - 'tests/**'
      # apps/loom-duckdb is a deployed container app whose ONLY automated
      # signal is tests/loom_duckdb (#2543). Its requirements.txt pins duckdb
      # and pyarrow, so a dependency bump has to reach this lane.
      - 'apps/loom-duckdb/**'
      # apps/fiab-setup-orchestrator is a default-ON Container App in Commercial
      # and a GitOps workload on GCC-High / IL5. Its Dockerfile fresh-resolves
      # its own pyproject on every image build and apps/** is NOT in the root
      # `testpaths`, so the app-fresh-resolve job below is its ONLY automated
      # signal (story 3063).
      - 'apps/fiab-setup-orchestrator/**'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  schedule:
    - cron: '37 3 * * 1'
  # REQUIRED-CHECK DISPATCH (#3393). release-please opens its PR with
  # GITHUB_TOKEN, and GitHub *intentionally* suppresses the downstream
  # `pull_request` trigger on such PRs — the runs are never created, so the four
  # required contexts this workflow publishes (Python Tests 3.10/3.11/3.12 and
  # dbt Compile shared/finance/inventory/sales) never report and used to be
  # replaced by SYNTHETIC statuses that no test produced.
  # `workflow_dispatch` (with `repository_dispatch`) is the ONE documented
  # exception to that suppression — GITHUB_TOKEN *can* trigger it — so
  # release-please.yml dispatches this workflow against the release branch and
  # gets REAL results. Under a dispatch `github.event_name != 'pull_request'`,
  # so the change-detection step below takes its "always run" branch: the FULL
  # suite runs, which is the conservative direction.
  workflow_dispatch:

concurrency:
  # #3426 — per-SHA on push/dispatch. This lane is the WORST case measured: it
  # publishes SEVEN required contexts (Python Tests 3.10/3.11/3.12 and dbt
  # Compile shared/finance/inventory/sales), and with a ref-keyed group +
  # cancel-in-progress:true, 11 of its last 30 main runs were cancelled
  # (2026-08-14) — 11 commits on main with no verdict from seven mandatory
  # checks. A cancelled required check is an ABSENCE, not a pass. See
  # scripts/ci/check-required-lane-concurrency.mjs, which now enforces this.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Needed to post/update coverage and summary comments on PRs.
  pull-requests: write

jobs:
  python-tests:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Need the PR base in history to diff changed paths below.
          fetch-depth: 0

      # The Python suite is a REQUIRED check on every PR (branch protection),
      # but it has nothing to test on a TS-only / docs-only PR — yet it spends
      # ~15 min installing the full Python stack + running pytest/mypy/bandit.
      # That made every apps/fiab-console PR wait on irrelevant work and was the
      # main merge-queue blocker. Detect whether any Python-relevant path
      # changed; if not, the job still runs + reports SUCCESS (so the required
      # check is satisfied) but skips the heavy steps. Pushes / schedule always
      # run the full suite. This is a step-level gate (not a job `if:`) so the
      # check can never get stuck "pending" and block a merge.
      - name: Detect Python-relevant changes
        id: relevant
        run: |
          # Always run for non-PR events (push to main / schedule).
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          # FAIL OPEN: if we cannot reliably compute the changed-file list, run
          # the full suite. Never let a diff hiccup silently SKIP Python tests
          # on a PR that actually changes Python.
          if ! changed="$(git diff --name-only "$base"...HEAD 2>/dev/null)" || [ -z "$changed" ]; then
            echo "::warning::Could not compute changed files reliably — running the full Python suite (fail-open)."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$changed" \
              | grep -qE '^(csa_platform/|domains/|scripts/|tests/|tools/|apps/loom-duckdb/|pyproject\.toml|\.github/workflows/test\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Python-relevant changes in this PR — skipping the Python test suite (reporting success)."
          fi

      - name: Set up Python
        if: steps.relevant.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # WHY `./requirements/locks/*` IS EXCLUDED FROM THE PER-DOMAIN LOOP BELOW
      # (#3485). This reasoning lives in a YAML comment rather than inside the
      # `run:` body on purpose — see the note at the end.
      #
      # Those ten files are the compiled, hash-pinned locks: 495 exact pins
      # across the whole extras surface, including a `starlette==` and a
      # `fastapi==`. Installed into this single shared environment they would
      # decide what tests/loom_duckdb measures, which is the #2615 defect
      # verbatim. The guard written for #2615 could not see it either:
      # scripts/ci/assert_installed_pins.py read ZERO pins from all ten,
      # because every pin line in a --generate-hashes lock ends in a
      # continuation and its `_PIN` regex is anchored with `$`. So the static
      # model in tests/repo/test_python_ci_dependency_order.py read an EMPTY
      # file while `pip install -r` applied all 495 at runtime — green over the
      # exact hazard it exists for. Measured: this loop's population goes 20 ->
      # 30 without the exclusion. Both halves are fixed; the parser can now see
      # such a file, and that test asserts the exclusion is present AND that the
      # locks it excludes really do pin fastapi/starlette.
      #
      # They also do not belong here on their own terms: the locks are compiled
      # for Python 3.12 and this job is a 3.10/3.11/3.12 matrix, so two of the
      # three legs would emit ten spurious "pip install FAILED" annotations. The
      # extras this job needs are installed above, from pyproject.toml, as
      # FLOORS.
      #
      # KEEP LONG PROSE OUT OF THE `run:` BODY. actionlint pipes each `run:`
      # script through shellcheck, and adding this block INSIDE the script made
      # `actionlint .github/workflows/test.yml` stop terminating — measured, 90s
      # with no result versus ~2s without it, and no single line was the
      # trigger (removing any one still hung; removing the block did not). A
      # lint that HANGS is worse than one that fails: it burns the job timeout
      # and reports nothing. YAML comments are never handed to shellcheck.
      - name: Install dependencies
        if: steps.relevant.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          # Install the project with dev + governance + functions extras so
          # ruff / pytest / pytest-cov / mypy and all Azure SDK deps come
          # from pyproject.toml. `serving` adds duckdb + pyarrow + fastapi for
          # tests/loom_duckdb (#2543) — a FLOOR only; the app's own
          # requirements.txt below re-pins them to the exact runtime versions,
          # which is what makes a dependabot bump a real signal.
          pip install -e ".[dev,governance,functions,portal,bff,postgres,tutorials,streaming,serving]"
          # Install any additional per-domain requirements. These stay tolerant
          # (many are optional/experimental runners not under test here), but a
          # failure is now SURFACED as a CI annotation + a job-summary line
          # instead of vanishing into `|| true`.
          failed_reqs=""
          # requirements/locks/* is excluded — see the YAML comment above this
          # step for why (#3485). Do not re-add it.
          for req in $(find . -name "requirements.txt" -not -path "*/dbt-env/*" -not -path "*/.venv/*" -not -path "./apps/loom-duckdb/*" -not -path "./requirements/locks/*"); do
            if ! pip install -r "$req"; then
              echo "::warning file=${req#./}::pip install -r ${req#./} FAILED - its dependencies are absent from the test environment."
              failed_reqs="${failed_reqs} ${req#./}"
            fi
          done
          if [ -n "$failed_reqs" ]; then
            echo "### :warning: requirements.txt installs that failed" >> "$GITHUB_STEP_SUMMARY"
            for req in $failed_reqs; do echo "- \`$req\`" >> "$GITHUB_STEP_SUMMARY"; done
          fi
          # mypy >= 1.16 added a hard dependency on pathspec and imports
          # `pathspec.patterns.gitignore`, which only exists in pathspec >= 0.12.
          # The per-domain requirements loop above can pull an older transitive
          # pathspec, breaking `mypy` at import time ("No module named
          # 'pathspec.patterns.gitignore'"). Force the modern version so the
          # mypy step always finds the expected module layout. See
          # https://github.com/python/mypy/issues/19275. (Independent of the
          # loom-duckdb install below — nothing there touches pathspec.)
          pip install -U 'pathspec>=0.12.1'
          # ---------------------------------------------------------------
          # apps/loom-duckdb/requirements.txt goes LAST. It describes the
          # container image that actually SHIPS, and tests/loom_duckdb is its
          # ONLY automated signal (#2543), so it must be the file that decides
          # the stack under test — not `find` order.
          #
          # This used to run BEFORE the loop, which silently lost (#2615): six
          # other requirements files pin fastapi 0.115.x, and fastapi 0.115.x
          # (starlette<0.42) and fastapi 0.140.13 (starlette>=0.46) are mutually
          # exclusive, so the loop downgraded fastapi and a trailing
          # `starlette>=0.40,<0.42` pin locked the downgrade in. Only duckdb and
          # pyarrow were re-asserted, so the HTTP tier was exercised against a
          # FastAPI the image never runs — and the suite passed on both stacks,
          # which is why it produced no signal at all.
          #
          # Verified before/after in a clean venv: tests/loom_duckdb (99) and
          # portal/shared/portal_tests (271) are green on fastapi 0.140.13 +
          # starlette 1.3.1. The five apps pinned at fastapi 0.115.x have no
          # collected test that imports their FastAPI app (tests/fiab_dbt_runner
          # and tests/loom_transform_runner load the dependency-free redact.py by
          # path), so nothing under test constructs a 0.115-era app. That is what
          # retires the old starlette pin: the `on_startup` TypeError it guarded
          # against is a fastapi-0.115 constructor behaviour, and 0.115 is no
          # longer the resolved fastapi.
          #
          # NO `|| true`: a swallowed failure here is exactly the bug this lane
          # exists to catch.
          pip install -r apps/loom-duckdb/requirements.txt
          # Assert it actually won. Prints every pinned distribution with its
          # resolved version and FAILS the step on any mismatch, so a new
          # requirements.txt landing later in `find` order, or a future
          # reordering, is loud instead of silent (#2615).
          python scripts/ci/assert_installed_pins.py \
            apps/loom-duckdb/requirements.txt \
            --label 'apps/loom-duckdb (the image tests/loom_duckdb must measure)'

      - name: Lint with ruff
        if: steps.relevant.outputs.run == 'true'
        run: |
          ruff check domains/ scripts/ csa_platform/ tools/ --output-format github

      - name: Security scan with Bandit
        if: steps.relevant.outputs.run == 'true'
        run: |
          bandit -r csa_platform/ domains/ scripts/ -c pyproject.toml

      - name: Typecheck with mypy (strict)
        if: steps.relevant.outputs.run == 'true'
        run: |
          # The default mypy config covers csa_platform.governance + tests. The three
          # Function apps each ship a flat function_app.py file, so they
          # are checked with explicit invocations (one per app) to avoid
          # module-path collisions.
          mypy
          mypy csa_platform/functions/aiEnrichment/functions/function_app.py
          mypy csa_platform/functions/eventProcessing/functions/function_app.py
          mypy csa_platform/functions/secretRotation/functions/function_app.py

      - name: Validate data product contracts
        if: steps.relevant.outputs.run == 'true'
        run: |
          python -m csa_platform.governance.contracts.contract_validator --ci --repo-root .

      - name: Check dbt schema drift against contracts
        if: steps.relevant.outputs.run == 'true'
        run: |
          python -m csa_platform.governance.contracts.dbt_test_generator --repo-root . --check

      - name: Run pytest with coverage
        if: steps.relevant.outputs.run == 'true'
        env:
          ENVIRONMENT: local
        run: |
          # --cov-fail-under is the ENFORCED gate (the pytest-cov CLI flag
          # overrides pyproject.toml's fail_under). Keep this in lockstep with
          # `fail_under` in pyproject.toml [tool.coverage.report]. Raised
          # 60 → 75 on 2026-07-20 (WS-F3); measured gated coverage was 81.33%.
          pytest \
            --cov \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=75

      - name: Upload coverage report (xml + html)
        if: always() && steps.relevant.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

      - name: Coverage summary
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11' && steps.relevant.outputs.run == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const xml = fs.readFileSync('coverage.xml', 'utf8');
            const match = xml.match(/line-rate="([\d.]+)"/);
            const pct = match ? (parseFloat(match[1]) * 100).toFixed(1) : 'N/A';
            const body = `## 📊 Coverage Report\n\nLine coverage: **${pct}%**\n\n> Full report available in the [coverage artifact](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;

            const marker = '## 📊 Coverage Report';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  # ------------------------------------------------------------------
  # FRESH-RESOLVE LEG (story 3063)
  #
  # apps/** is NOT in the root pyproject's `testpaths`, so no job above ever
  # collects apps/fiab-setup-orchestrator/tests. The only workflow references to
  # that app are image builds. Its Dockerfile does a bare `pip install .` with no
  # lockfile, so every image build fresh-resolves the app's own specifiers -- and
  # an uncapped azure-mgmt-resource pin resolved to 26.0.0, which no longer
  # provides Deployment / DeploymentProperties / DeploymentMode / TemplateLink or
  # even ResourceManagementClient. The Setup Wizard's Deploy path shipped broken
  # in every rebuilt image and nothing in CI could see it.
  #
  # This leg reproduces the Dockerfile's resolution in a clean venv and imports
  # what the source imports. It is keyed to the MISMATCH between the app's source
  # and its resolved environment -- not to a version string, so it stays live on
  # files that already carry the fix. It refuses to pass on an empty population
  # (missing app dir, zero third-party imports, zero resolved distributions, zero
  # image builders) and it fails on SKIPPED tests, because test_orchestrator.py
  # importorskips azure.mgmt.resource and a skip there would hide exactly this.
  #
  # CLOUD PARITY -- stated as measured, not as assumed:
  #   * There is ONE pyproject.toml and ONE Dockerfile for this app. Four
  #     workflows build that same context: build-fiab-images.yml and
  #     build-fiab-images-acr-tasks.yml and full-app-deploy-commercial.yml (the
  #     customer's private ACR) and publish-ghcr-images.yml (the public GHCR
  #     channel the in-product updater pulls). So the break shipped identically
  #     wherever the image ran, and the fix lands identically wherever it is
  #     rebuilt. The guard enumerates those builders and FAILS on zero, so a
  #     boundary-specific fork of the build context cannot slip past unnoticed.
  #   * COMMERCIAL + GCC: loom-setup-orchestrator is a live Container App
  #     (admin-plane/main.bicep `setupOrchestratorActive`), so this leg is the
  #     guard on a running deploy path there.
  #   * GCC-High + IL5: `setupOrchestratorActive` explicitly excludes those two
  #     boundaries today (`boundary != 'GCC-High' && boundary != 'IL5'`), and the
  #     comment above that var records that the image is not published to the
  #     sovereign ACR. Grepping platform/ deploy/ gitops/ helm/ charts/ found no
  #     manifest that deploys it either, so this change is NOT verified against a
  #     running GCC-High / IL5 orchestrator -- there does not appear to be one to
  #     verify against. That sovereign gap is pre-existing and untouched here;
  #     what this leg does guarantee is that when the image IS published to those
  #     boundaries, it will not carry this defect.
  app-fresh-resolve:
    name: App Fresh-Resolve (setup-orchestrator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          # Matches apps/fiab-setup-orchestrator/Dockerfile (python:3.12-slim), so
          # the resolution this leg observes is the resolution the image gets.
          python-version: '3.12'

      - name: Fresh-resolve guard (clean venv, import what the source imports)
        run: python scripts/ci/check_app_fresh_resolve.py apps/fiab-setup-orchestrator

      - name: Install the app + dev extras into a clean venv
        run: |
          set -euo pipefail
          python -m venv .venv-orch
          .venv-orch/bin/python -m pip install --disable-pip-version-check -q --upgrade pip
          .venv-orch/bin/python -m pip install --disable-pip-version-check -q './apps/fiab-setup-orchestrator[dev]'
          echo "resolved azure-mgmt-resource:"
          # NOT `pip show ... | head`: head closes the pipe after 2 lines, pip gets
          # EPIPE and exits 120, and under `set -o pipefail` that fails the STEP -
          # observed on this PR's first run, where the resolve itself had already
          # succeeded (24.0.0). A diagnostic must not fail the job it diagnoses.
          .venv-orch/bin/python -m pip show azure-mgmt-resource | sed -n '1,2p'

      - name: Run the Setup Orchestrator's own tests (never collected elsewhere)
        run: |
          set -euo pipefail
          .venv-orch/bin/python -m pytest apps/fiab-setup-orchestrator/tests \
            -o addopts= --tb=short --junitxml=orchestrator-junit.xml

      - name: Assert the run measured something and skipped nothing
        run: python scripts/ci/assert_pytest_junit.py orchestrator-junit.xml --min-tests 31

  dbt-compile:
    name: dbt Compile (${{ matrix.domain }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        domain: [shared, finance, inventory, sales]
    defaults:
      run:
        working-directory: domains/${{ matrix.domain }}/dbt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dbt
        run: |
          pip install dbt-databricks dbt-core

      - name: dbt deps
        run: dbt deps --profiles-dir . || echo "dbt deps skipped (no packages)"

      - name: Compile dbt models
        run: |
          if [ -n "$DBT_DATABRICKS_HOST" ]; then
            dbt compile --project-dir . --profiles-dir .
          else
            echo "::notice::Skipping dbt compile — no DBT_DATABRICKS_HOST configured. Compilation requires a live connection."
          fi
        env:
          DBT_DATABRICKS_HOST: ${{ secrets.DBT_DATABRICKS_HOST }}
          DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
          DBT_DATABRICKS_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}

  dbt-integration:
    name: dbt Integration (${{ matrix.domain }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        domain: [shared, finance, inventory, sales]
    defaults:
      run:
        working-directory: domains/${{ matrix.domain }}/dbt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dbt + DuckDB adapter
        run: |
          pip install dbt-core dbt-duckdb

      - name: Create DuckDB profile
        run: |
          mkdir -p ~/.dbt
          # Use a persistent DuckDB file (not :memory:) so seed data
          # survives across the separate dbt seed / dbt run / dbt test
          # steps.  The file is ephemeral — cleaned up when the runner
          # exits.
          cat > ~/.dbt/profiles.yml << 'PROFILE'
          csa_analytics:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: "ci_test.duckdb"
                schema: main
          PROFILE

      - name: dbt deps
        run: dbt deps || echo "dbt deps skipped (no packages)"

      - name: dbt seed
        run: dbt seed --target ci --profiles-dir ~/.dbt --vars '{"bronze_database":"","silver_database":"","gold_database":""}'

      - name: dbt run
        run: |
          dbt run --target ci --profiles-dir ~/.dbt \
            --vars '{"bronze_database":"","silver_database":"","gold_database":""}'

      - name: dbt test
        run: |
          # Exclude snapshot tests — dbt snapshot is not run in DuckDB CI
          # so snapshot tables don't exist and their tests would fail.
          dbt test --target ci --profiles-dir ~/.dbt \
            --vars '{"bronze_database":"","silver_database":"","gold_database":""}' \
            --exclude "snp_customers_history" "snp_products_history"

  pr-summary:
    name: PR Summary
    if: github.event_name == 'pull_request' && always()
    needs: [python-tests, app-fresh-resolve, dbt-compile, dbt-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const jobs = [
              { name: 'Python Tests', id: 'python-tests' },
              { name: 'App Fresh-Resolve', id: 'app-fresh-resolve' },
              { name: 'dbt Compile', id: 'dbt-compile' },
              { name: 'dbt Integration', id: 'dbt-integration' },
            ];
            const needs = ${{ toJSON(needs) }};
            const rows = jobs.map(j => {
              const result = needs[j.id]?.result || 'skipped';
              const emoji = { success: '✅', failure: '❌', skipped: '⏭️', cancelled: '🚫' }[result] || '❓';
              return `| ${j.name} | ${emoji} ${result} |`;
            }).join('\n');

            const body = [
              '## 🧪 CI Test Summary',
              '',
              '| Job | Status |',
              '|-----|--------|',
              rows,
              '',
              `> Run: [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const marker = '## 🧪 CI Test Summary';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

