name: loom-ui-verify

# Unattended CSA Loom console verification — no MFA, no user credentials.
#
# Auth chain:
#   1. OIDC federated credential → azure/login@v2 (no client secret on disk)
#   2. az keyvault secret show → SESSION_SECRET (masked immediately)
#   3. Playwright global-setup mints a loom_session cookie from SESSION_SECRET
#   4. `verify` project tests run against the live console URL
#
# One-time setup per docs/fiab/agent-unattended-access.md:
#   - Create/choose a service principal (e.g. loom-ui-verify-sp)
#   - Add a GitHub OIDC federated credential for this repo + this workflow
#   - Grant it: Key Vault Secrets User on the loom KV (for SESSION_SECRET)
#               AND Reader on the admin RG (to read the console's tenant-admin
#               binding — see LOOM_AUTOMATION_OID below)
#   - Set GH secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   - Set GH vars:    LOOM_VERIFY_URL, LOOM_AUTOMATION_UPN,
#                     LOOM_AUTOMATION_NAME, LOOM_KV_NAME (default: auto-discover)
#   - LOOM_AUTOMATION_OID is NOT a setup step (#3373). It is DERIVED at run time
#     from the console's own LOOM_TENANT_ADMIN_OID, which the deploy produces.
#     The repo var is an optional OVERRIDE.

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Azure region the admin plane was deployed to'
        type: string
        default: 'centralus'
      console_url:
        description: 'Loom console URL to verify (leave blank to use LOOM_VERIFY_URL var)'
        type: string
        default: ''
      admin_rg:
        description: 'Admin-plane resource group (for auto-discovering the KV when LOOM_KV_NAME is not set)'
        type: string
        default: ''
      kv_name:
        description: 'Key Vault name containing the session-secret (overrides auto-discovery)'
        type: string
        default: ''
      target_route:
        description: 'Optional: capture a browser-E2E RECEIPT (light+dark screenshot + trace) for this route, e.g. /admin/readiness. Blank = smoke-only.'
        type: string
        default: ''
      target_slug:
        description: 'Optional artifact slug for the receipt (derived from target_route when blank)'
        type: string
        default: ''
      extra_projects:
        description: 'Optional comma-separated Playwright projects to ALSO run in-VNet after verify (e.g. "route-smoke" for the full page-by-page sweep, or "route-smoke,visual-wide"). Blank = none.'
        type: string
        default: ''

  schedule:
    # Weekly on Monday at 06:00 UTC — early morning before the business day
    - cron: '0 6 * * 1'

permissions:
  id-token: write   # OIDC token for azure/login
  contents: read
  checks: write     # allows annotating the check run (optional)

env:
  # --- resolve console URL: workflow input → repo var → hardcoded default ---
  LOOM_URL: ${{ inputs.console_url || vars.LOOM_VERIFY_URL || 'https://csa-loom.limitlessdata.ai' }}
  # --- automation identity (baked into the minted session cookie) -----------
  # LOOM_AUTOMATION_OID is DELIBERATELY NOT SET HERE (#3373). It is DERIVED from
  # the console's own LOOM_TENANT_ADMIN_OID by the "Resolve automation identity"
  # step below, which writes it to $GITHUB_ENV — so every `${{ env.LOOM_AUTOMATION_OID }}`
  # further down reads the produced value, and this workflow needs no repo
  # variable to run. `vars.LOOM_AUTOMATION_OID` survives as an explicit OVERRIDE
  # only. Setting it at workflow scope again would re-create the collision the
  # rename removed.
  LOOM_AUTOMATION_OID_OVERRIDE: ${{ vars.LOOM_AUTOMATION_OID || '' }}
  LOOM_AUTOMATION_UPN:  ${{ vars.LOOM_AUTOMATION_UPN  || 'loom-verify@automation.local' }}
  LOOM_AUTOMATION_NAME: ${{ vars.LOOM_AUTOMATION_NAME || 'Loom Verify [automation]' }}
  # --- Key Vault / secret names (stable across deployments per bicep) -------
  # The KV secret for SESSION_SECRET is always named 'session-secret' (set in
  # platform/fiab/bicep/modules/admin-plane/entra-app-registration.bicep:68).
  KV_SECRET_NAME: 'session-secret'

jobs:
  # ---------------------------------------------------------------------------
  # QUEUE WATCHDOG (added 2026-08-07, FINISHLINE C13).
  #
  # `timeout-minutes` on the verify job below only starts counting once a runner
  # has PICKED THE JOB UP. A job that never gets a runner is not covered by it at
  # all: run 31123017609 sat queued for 79 minutes against the scale-to-zero
  # in-VNet gh-aca-runner and only ended because a human cancelled it. A run that
  # can only be ended by hand produces NO verdict — and per
  # `csa_loom_unknown_as_negative_class`, "no verdict" is routinely misread as
  # "nothing wrong". That is a gate that cannot fail.
  #
  # This job converts an unbounded queue wait into a bounded, RED, self-diagnosed
  # outcome. It polls this run's own jobs and fails closed if `verify` is still
  # queued past MAX_QUEUE_MINUTES, naming the KEDA/ACA runner as the thing to
  # look at. It exits 0 the moment verify leaves the queue, so it costs seconds
  # on the happy path and never gates the suite's own result.
  #
  # Honest limit, stated rather than implied: this watchdog runs on a
  # GitHub-hosted runner. During a platform-wide Actions incident (as on
  # 2026-08-06T15:22Z–2026-08-07T02:04Z) it may itself fail to start, in which
  # case nothing is reported — strictly better than the unbounded wait it
  # replaces, but not a guarantee.
  # ---------------------------------------------------------------------------
  queue-watchdog:
    name: 'Queue watchdog (bounded wait for the in-VNet runner)'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
    steps:
      - name: Fail closed if the in-VNet verify job never starts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          MAX_QUEUE_MINUTES: '20'
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + MAX_QUEUE_MINUTES * 60 ))
          echo "Watching run $RUN_ID for the 'Loom UI verify (unattended)' job to leave the queue."
          echo "Bound: ${MAX_QUEUE_MINUTES} minutes. A still-queued job past that point FAILS this check."
          while :; do
            # `status` is queued | in_progress | completed. Anything other than
            # `queued` means a runner took it, which is all this watchdog cares
            # about — the suite's own pass/fail is the verify job's business.
            status=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
                       --jq '.jobs[] | select(.name | startswith("Loom UI verify")) | .status' \
                     | head -n1 | tr -d '\r' || true)
            if [ -z "$status" ]; then
              echo "  … verify job not listed yet (run still materializing)"
            elif [ "$status" != "queued" ]; then
              echo "OK — verify job status='$status'; a runner picked it up. Watchdog done."
              exit 0
            else
              echo "  … still queued ($(( (deadline - $(date +%s)) / 60 ))m of budget left)"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::verify job STILL QUEUED after ${MAX_QUEUE_MINUTES} minutes — no in-VNet runner picked it up."
              cat <<'EOF'
          [queue-watchdog] FAIL — the job never started, so this run produced NO
          verification verdict. This is not a pass.

          ESTABLISHED: the job sat in `queued` for the whole budget with labels
          [self-hosted, loom-aca]. Nothing is known about the console.

          What to check, in order:
            1. The gh-aca-runner ACA Job (KEDA scale-to-zero) — is the scaler
               firing? `az containerapp job execution list -n gh-aca-runner`.
            2. githubstatus.com — a platform Actions incident stalls job
               assignment even when runners are healthy.
            3. Whether another loom-ui-verify run is holding the single runner.
          EOF
              exit 1
            fi
            sleep 20
          done

  verify:
    name: 'Loom UI verify (unattended)'
    # Run on the in-VNet scale-to-zero self-hosted runner (gh-aca-runner) — the
    # SESSION_SECRET Key Vault is private-endpoint-locked, so a cloud
    # ubuntu-latest runner cannot reach it (AzureServices bypass excludes public
    # GH runners). The `loom-aca` label wakes the ACA-Job runner via KEDA.
    runs-on: [self-hosted, loom-aca]
    timeout-minutes: 20

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # 1b. NORMALIZE + VALIDATE `target_route` UP FRONT (FINISHLINE C13).
      #
      #     Every receipt in this program is dispatched from Git Bash on Windows.
      #     MSYS POSIX path conversion rewrites `-f target_route=/admin/readiness`
      #     into `C:/Program Files/Git/admin/readiness` BEFORE gh ever sends it,
      #     so the workflow input arrives already corrupt. Run 31122589186 spent
      #     6 minutes running the full verify + publish-version suite, then failed
      #     the receipt step and printed a diagnosis blaming the VPN, private-link
      #     and LOOM_URL — none of which were true or measured.
      #
      #     Validating here means a corrupt dispatch is rejected in ~1 second with
      #     the exact remediation, and a recoverable one is REPAIRED so the run
      #     the operator asked for still produces its receipt. The same logic
      #     lives in scripts/csa-loom/e2e-receipt.mjs (normalizeRoute) for local
      #     runs; this step is the CI-side guard so no compute is wasted first.
      # -----------------------------------------------------------------------
      - name: Normalize + validate target_route
        id: route
        if: ${{ inputs.target_route != '' }}
        env:
          RAW_ROUTE: ${{ inputs.target_route }}
        run: bash scripts/ci/normalize-target-route.sh

      # -----------------------------------------------------------------------
      # 2. Azure OIDC login — no client secret on disk.
      #    The SP must have a GitHub OIDC federated credential targeting this
      #    repo (see docs/fiab/agent-unattended-access.md §one-time-setup).
      # -----------------------------------------------------------------------
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------------------------
      # 2b. LOGIN-HEALTH PREFLIGHT — catch the exact P0 that this minted-session
      #     verify CANNOT see: an MSAL client-secret expiry/drift (AADSTS7000215)
      #     silently breaks EVERY real sign-in while the cookie-minted UI stays
      #     green (live outage 2026-07-19). Two independent, non-blocking checks:
      #       (a) the console's ACA logs carry an invalid_client callback error
      #           in the recent window (the smoking gun), and
      #       (b) the MSAL app's soonest credential expiry is < 30 days out.
      #     THIS STEP CAN FAIL, AND MUST (#2837). It previously carried BOTH
      #     `continue-on-error: true` AND a trailing hard `exit 0`, so it printed
      #     "::error::LOGIN BROKEN" and then concluded success. On the weekly
      #     cron the job conclusion is the entire signal, so a live sign-in
      #     outage rendered as a green check. Same class as #2787, two steps
      #     below in this same file.
      #     The original rationale ("so a missing perm never fails the whole
      #     verify") is preserved WITHOUT the mask: scripts/ci/login-health-
      #     verdict.sh exits 0 on every "could not check" path (unresolvable
      #     workspace, unreadable count, missing Application.Read.All) and 1
      #     ONLY on evidence in hand that sign-in is broken. The az reads stay
      #     here; the verdict is a pure, unit-tested script.
      #
      #     ORDERING FIX (refs #2871). Because this step sits AHEAD of the
      #     Playwright projects, a hard failure here aborted the job before a
      #     single browser test ran — so while the estate carries a live
      #     AADSTS7000215 signal there was NO obtainable browser-E2E receipt for
      #     main at all, for any change, and a UI regression could land unseen.
      #     One true signal was masking a second, independent one.
      #     This is NOT a skip switch and NOT a re-added continue-on-error: the
      #     step still runs first and still emits its ::error:: annotations, but
      #     it RECORDS its verdict and lets the browser suite produce its own
      #     result. `Enforce login-health verdict…` at the END of this job turns
      #     a BROKEN verdict back into a red run, so the job's pass/fail outcome
      #     is unchanged and the run simply carries both signals. Enforcement is
      #     DEFERRED, NEVER DROPPED — deleting that step re-opens #2837, and
      #     scripts/ci/__tests__/ui-verify-gate.test.mjs fails if it goes away.
      # -----------------------------------------------------------------------
      - name: Login-health preflight (MSAL secret expiry + callback errors)
        id: login_health
        env:
          MSAL_APP_ID: ${{ vars.LOOM_MSAL_CLIENT_ID || '5c59f3f3-e26d-4122-a707-a04e21ff5255' }}
          CONSOLE_RG: ${{ vars.LOOM_ADMIN_RG || format('rg-csa-loom-admin-{0}', inputs.region) }}
        run: |
          set +e
          LAW=$(az monitor log-analytics workspace list -g "$CONSOLE_RG" --query "[?contains(name,'loom')].customerId | [0]" -o tsv 2>/dev/null | tr -d '\r')
          HITS_RAW=""
          if [ -n "$LAW" ]; then
            # NO `|| echo 0` here, on purpose: an empty result means the query did
            # not run, and the verdict script reports that as unknown rather than
            # as a clean zero (the second half of #2837).
            HITS_RAW=$(az monitor log-analytics query --workspace "$LAW" \
              --analytics-query "ContainerAppConsoleLogs_CL | where TimeGenerated > ago(7d) | where ContainerAppName_s == 'loom-console' | where Log_s contains '[auth/callback] exception:' and Log_s has 'invalid_client' | count" \
              -o tsv 2>/dev/null | tr -d '\r')
            # #3160 — the count alone cannot tell a CURRENT outage from one that
            # was rotated away days ago. Carry the newest hit's timestamp so the
            # verdict can compare it against the newest MSAL credential.
            HITS_LAST=$(az monitor log-analytics query -w "$LAW" \
              --analytics-query "ContainerAppConsoleLogs_CL | where TimeGenerated > ago(7d) | where ContainerAppName_s == 'loom-console' | where Log_s contains '[auth/callback] exception:' and Log_s has 'invalid_client' | summarize last=max(TimeGenerated) | project tostring(last)" \
              -o tsv 2>/dev/null | tr -d '\r')
          fi
          MINEND=$(az ad app credential list --id "$MSAL_APP_ID" --query "min([].endDateTime)" -o tsv 2>/dev/null | tr -d '\r')
          CREDNEW=$(az ad app credential list --id "$MSAL_APP_ID" --query "max([].startDateTime)" -o tsv 2>/dev/null | tr -d '\r')

          LH_LAW="$LAW" LH_HITS_RAW="$HITS_RAW" LH_MIN_END="$MINEND" \
          LH_HITS_LAST="${HITS_LAST:-}" LH_CRED_NEWEST="${CREDNEW:-}" \
          LH_APP_ID="$MSAL_APP_ID" LH_CONSOLE_RG="$CONSOLE_RG" \
            bash scripts/ci/login-health-verdict.sh
          rc=$?

          # login-health-verdict.sh writes `verdict=ok|unknown|broken` to
          # $GITHUB_OUTPUT itself. Record its raw exit status as a SECOND,
          # independent signal: the enforcing step fails closed if the two ever
          # disagree, or if no verdict was recorded at all.
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

          echo "Recorded login-health rc=$rc. Enforcement is DEFERRED to 'Enforce login-health verdict + blocking suite results' at the end of this job (refs #2871) so the browser E2E below still runs and yields its own receipt. A BROKEN verdict still fails this run."
          exit 0

      # -----------------------------------------------------------------------
      # 3. Resolve Key Vault name, then fetch + mask SESSION_SECRET.
      #    Priority:  workflow input → repo var → auto-discover from admin RG.
      # -----------------------------------------------------------------------
      - name: Resolve Key Vault + fetch SESSION_SECRET
        id: secrets
        env:
          INPUT_KV:       ${{ inputs.kv_name }}
          VAR_KV:         ${{ vars.LOOM_KV_NAME }}
          INPUT_ADMIN_RG: ${{ inputs.admin_rg }}
          VAR_ADMIN_RG:   ${{ vars.LOOM_ADMIN_RG }}
        run: |
          set -euo pipefail

          # --- resolve KV name ---
          KV="${INPUT_KV:-${VAR_KV:-}}"
          if [[ -z "$KV" ]]; then
            # Auto-discover: look in the admin RG for a KV whose name starts with kv-loom
            ADMIN_RG="${INPUT_ADMIN_RG:-${VAR_ADMIN_RG:-}}"
            if [[ -z "$ADMIN_RG" ]]; then
              # Last resort: list all KVs in the subscription and find the loom one
              echo "No admin RG provided; searching subscription for loom Key Vault..."
              KV=$(az keyvault list \
                     --query "[?starts_with(name,'kv-loom') || starts_with(name,'loom-kv')].name | [0]" \
                     -o tsv 2>/dev/null || true)
            else
              echo "Auto-discovering KV in resource group: $ADMIN_RG"
              KV=$(az keyvault list -g "$ADMIN_RG" \
                     --query "[0].name" -o tsv 2>/dev/null || true)
            fi
          fi

          if [[ -z "$KV" ]]; then
            echo "::error::Could not resolve a Key Vault name. Set the LOOM_KV_NAME repo variable or pass kv_name as a workflow input."
            exit 1
          fi
          echo "Using Key Vault: $KV"

          # --- fetch SESSION_SECRET ---
          SS=$(az keyvault secret show \
                 --vault-name "$KV" \
                 --name "$KV_SECRET_NAME" \
                 --query value -o tsv 2>/dev/null || true)

          if [[ -z "$SS" ]]; then
            # Try alternate name loom-session-secret for older deployments
            SS=$(az keyvault secret show \
                   --vault-name "$KV" \
                   --name "loom-session-secret" \
                   --query value -o tsv 2>/dev/null || true)
          fi

          if [[ -z "$SS" ]]; then
            echo "::error::Could not read '$KV_SECRET_NAME' (or 'loom-session-secret') from Key Vault $KV. Ensure the SP has Key Vault Secrets User on this KV."
            exit 1
          fi

          # MASK immediately — never echoed after this point
          echo "::add-mask::$SS"
          echo "SESSION_SECRET=$SS" >> "$GITHUB_ENV"
          echo "Fetched and masked SESSION_SECRET from $KV/$KV_SECRET_NAME"

      # -----------------------------------------------------------------------
      # 4. Node.js + pnpm setup
      # -----------------------------------------------------------------------
      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # -----------------------------------------------------------------------
      # 4b. RESOLVE THE AUTOMATION IDENTITY — PRODUCED, never requested (#3373).
      #
      #     This workflow used to read `vars.LOOM_AUTOMATION_OID` with no
      #     fallback, and NOTHING in this repo could ever write that variable
      #     (`gh variable set` / the actions/variables API appear nowhere in the
      #     tree). So the lane that produces every browser-E2E receipt was gated
      #     on a value a human had to type into repo settings — verbatim the
      #     state `auto-bind-by-default.md` §5 forbids.
      #
      #     The value is not free-form. The minted cookie carries no `groups`
      #     claim, so apps/fiab-console/lib/auth/feature-gate.ts can only admit
      #     it via `session.claims.oid === LOOM_TENANT_ADMIN_OID` on the console
      #     container app — and THAT is produced by the deploy
      #     (FIAB_TENANT_ADMIN_OID -> loomTenantAdminOid -> effectiveTenantAdminOid).
      #     So it is read back from the producer here instead of retyped.
      #
      #     The repo variable is retained as an explicit override, and the
      #     refusal is kept: the script never substitutes the runner's own
      #     service-principal object id, which is a GUID that matches nobody
      #     (#3109). It fails closed with a classified, concrete remediation.
      # -----------------------------------------------------------------------
      - name: Resolve automation identity (derive from the console's tenant-admin binding)
        id: automation_oid
        env:
          EXPLICIT_OID: ${{ env.LOOM_AUTOMATION_OID_OVERRIDE }}
          # Blank is fine — the script then discovers the console's resource
          # group with `az containerapp list` rather than guessing a region into
          # a name. No `format('rg-…-{0}', inputs.region)` fallback here: on the
          # weekly cron `inputs.region` is EMPTY, which would build a resource
          # group name that cannot exist and turn a resolvable state into a red
          # run.
          CONSOLE_RG: ${{ inputs.admin_rg || vars.LOOM_ADMIN_RG }}
        run: node scripts/ci/resolve-automation-oid.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install console dependencies
        run: pnpm -C apps/fiab-console install --frozen-lockfile

      # -----------------------------------------------------------------------
      # 5. Install Playwright + Chromium only (lightweight)
      #    SKIPPED when the runner image bakes the browsers (in-VNet gh-aca-runner:
      #    PLAYWRIGHT_BROWSERS_PATH=/ms-playwright). The runner's firewall egress
      #    blocks the browser CDN, so a runtime download would fail anyway.
      # -----------------------------------------------------------------------
      - name: Install Playwright browsers (Chromium)
        run: |
          if [ -d "/ms-playwright" ]; then
            echo "Browsers baked into the runner image (/ms-playwright) — skipping install"
          else
            pnpm -C apps/fiab-console exec playwright install --with-deps chromium
          fi

      # -----------------------------------------------------------------------
      # 6. Run the `verify` project
      #    - `mint` setup project runs first (global-setup.ts) → writes
      #      e2e/.auth/loom-state.json (gitignored, ephemeral in CI)
      #    - `verify` tests run with the minted storageState
      # -----------------------------------------------------------------------
      - name: Run loom-ui-verify (--project=verify)
        id: verify_project
        run: |
          # Prefer the baked browsers when the runner image carries them.
          if [ -d "/ms-playwright" ]; then export PLAYWRIGHT_BROWSERS_PATH=/ms-playwright; fi
          pnpm -C apps/fiab-console exec playwright test --project=verify
        env:
          SESSION_SECRET:       ${{ env.SESSION_SECRET }}
          LOOM_URL:             ${{ env.LOOM_URL }}
          LOOM_AUTOMATION_OID:  ${{ env.LOOM_AUTOMATION_OID }}
          LOOM_AUTOMATION_UPN:  ${{ env.LOOM_AUTOMATION_UPN }}
          LOOM_AUTOMATION_NAME: ${{ env.LOOM_AUTOMATION_NAME }}
          CI: 'true'

      # -----------------------------------------------------------------------
      # 6a1. Optional extra projects (apex A4): the full page-by-page sweep
      #      (`route-smoke` asserts a clean mount + zero console errors + zero
      #      5xx on EVERY app/**/page.tsx route) and any other project, run
      #      in-VNet with the SAME minted session. continue-on-error so a
      #      sweep finding annotates the run and uploads its report instead of
      #      masking the core verify gate; the report artifact is the receipt.
      #
      #      PER-PROJECT OUTPUT DIR (fix 2026-07-28): playwright CLEANS its
      #      outputDir at the START of every run. With every project sharing the
      #      config default (test-results/uat/artifacts), the LAST project to run
      #      deleted the traces, screenshots and error-context.md of every
      #      project before it — run 30330893902 uploaded only publish-version's
      #      report.json, so the two route-smoke failures had no artifacts at all.
      #      Each project now writes to test-results/<project>/ and survives.
      # -----------------------------------------------------------------------
      - name: Run extra Playwright projects
        id: extra_projects
        # `!cancelled()`, NOT `continue-on-error`. These two are opposites and
        # confusing them is how #2787 happened.
        #
        # THE PROBLEM (F1, run 31229730356). `verify` is the BASE smoke suite. A
        # single unrelated flake in it — that run: "MIP sensitivity labels → 503",
        # with the other three governance probes returning 200 — failed the step,
        # and GitHub then SKIPPED every later step. So the
        # `external-engine-federation` receipt the run was dispatched to collect
        # never executed. An intermittent 503 in one probe made an independent
        # receipt unobtainable for ANY change.
        #
        # THE FIX IS ORDERING, NOT TOLERANCE — the same remedy this workflow
        # already applies to the login-health preflight one step above, and for
        # the identical reason recorded there: "one true signal was masking a
        # second, independent one."
        #
        # This does NOT make the base suite non-blocking, which would be the
        # gates-that-cannot-fail pattern:
        #   - `verify` has no continue-on-error, so its failure still fails the job;
        #   - the always() gate below re-asserts `verify=failure` as a blocking
        #     cause by name (ui-verify-gate-verdict.sh treats `failure` as
        #     blocking and `skipped` as not);
        #   - THIS step also stays blocking — its own failure is enforced there too.
        # The job's pass/fail is unchanged. The run simply now contains both
        # results instead of only the first.
        if: ${{ !cancelled() && inputs.extra_projects != '' }}
        # NO continue-on-error. It hid every result this step produced — a real
        # /admin/tenant-settings mount failure was reported as a green run
        # (#2787). route-smoke now carries retries: 2, so an intermittent
        # first-paint timeout is reported FLAKY and exits 0, while a route that
        # fails every attempt fails this step — the behaviour the sweep exists
        # for.
        run: |
          if [ -d "/ms-playwright" ]; then export PLAYWRIGHT_BROWSERS_PATH=/ms-playwright; fi
          IFS=',' read -ra PROJS <<< "${{ inputs.extra_projects }}"
          rc=0
          for p in "${PROJS[@]}"; do
            p="$(echo "$p" | tr -d '[:space:]')"
            [ -z "$p" ] && continue
            echo "::group::playwright --project=$p"
            PLAYWRIGHT_JSON_OUTPUT_NAME="test-results/$p/report.json" \
              pnpm -C apps/fiab-console exec playwright test --project="$p" \
                --output="test-results/$p/artifacts" || rc=1
            echo "::endgroup::"
          done
          exit $rc
        env:
          SESSION_SECRET:       ${{ env.SESSION_SECRET }}
          LOOM_URL:             ${{ env.LOOM_URL }}
          LOOM_AUTOMATION_OID:  ${{ env.LOOM_AUTOMATION_OID }}
          LOOM_AUTOMATION_UPN:  ${{ env.LOOM_AUTOMATION_UPN }}
          LOOM_AUTOMATION_NAME: ${{ env.LOOM_AUTOMATION_NAME }}
          CI: 'true'

      # -----------------------------------------------------------------------
      # 6a2. Publish-version E2E (task #7) — live front-end version-history +
      #      restore across publishing object types, with the SAME minted
      #      session. Separate project so its heavier per-type create/save flow
      #      is its own signal.
      #
      #      THIRD OCCURRENCE OF THE SAME DEFECT, IN THIS SAME FILE (refs #2875).
      #      This step carried `continue-on-error: true` AND had no `id:`, so its
      #      outcome was not merely tolerated — it was UNREFERENCEABLE. The final
      #      gate below could not have consumed it even if someone had thought
      #      to. Run 30824614880 therefore concluded SUCCESS while Playwright
      #      printed "1 failed, 6 passed" for `version timeline + restore —
      #      report`. #2787 fixed exactly this shape on the sibling step 30 lines
      #      up and did not look at this one; that is how the class recurred.
      #
      #      The flag is gone AND the ambiguity it existed for is gone: the
      #      publish-version project now carries `retries: 2`
      #      (apps/fiab-console/playwright.config.ts), so a per-type selector
      #      hiccup is reported FLAKY and exits 0, while a type that fails every
      #      attempt fails this step. Removing the flag WITHOUT the retries would
      #      have traded a silent-green for a noisy-red and someone would have
      #      put the flag back.
      #
      #      `id:` + inclusion in the gate's UVG_BLOCKING is belt-and-braces: the
      #      step failing is already enough to fail the job, and the gate
      #      re-asserts it so that re-adding tolerance here cannot silently undo
      #      this fix a fourth time.
      # -----------------------------------------------------------------------
      - name: Run publish-version E2E (--project=publish-version)
        id: publish_version
        # Same reasoning as the extra-projects step above (F1): an unrelated
        # failure in `verify` used to SKIP this independent suite, so its result
        # became unobtainable. It still blocks — the gate below consumes its
        # outcome — it just is no longer silently skipped by someone else's flake.
        if: ${{ !cancelled() }}
        run: |
          if [ -d "/ms-playwright" ]; then export PLAYWRIGHT_BROWSERS_PATH=/ms-playwright; fi
          PLAYWRIGHT_JSON_OUTPUT_NAME="test-results/publish-version/report.json" \
            pnpm -C apps/fiab-console exec playwright test --project=publish-version \
              --output="test-results/publish-version/artifacts"
        env:
          SESSION_SECRET:       ${{ env.SESSION_SECRET }}
          LOOM_URL:             ${{ env.LOOM_URL }}
          LOOM_AUTOMATION_OID:  ${{ env.LOOM_AUTOMATION_OID }}
          LOOM_AUTOMATION_UPN:  ${{ env.LOOM_AUTOMATION_UPN }}
          LOOM_AUTOMATION_NAME: ${{ env.LOOM_AUTOMATION_NAME }}
          CI: 'true'

      # -----------------------------------------------------------------------
      # 6b. Optional browser-E2E RECEIPT (G1 / no-vaporware.md).
      #     Runs only when `target_route` is set. Uses the SAME minted-session
      #     path (scripts/csa-loom/e2e-receipt.mjs shares the exact cookie mint)
      #     to capture a light+dark screenshot + Playwright trace of the route
      #     against the live console, into apps/fiab-console/test-results/receipts/.
      #
      #     Its `continue-on-error: true` is gone too (refs #2875) — same sweep,
      #     same reasoning as the step above. The stated rationale ("so an
      #     UNREACHABLE/REJECTED receipt annotates the run but does not mask the
      #     smoke-verify result above") did not hold: a failing step never masked
      #     an earlier one, GitHub reports both. What it actually did was discard
      #     a real verdict. scripts/csa-loom/e2e-receipt.mjs exits 2 on
      #     UNREACHABLE and 3 on SESSION REJECTED — a route the operator
      #     explicitly asked to receipt failing to load, or bouncing a valid
      #     minted session to sign-in, is precisely the finding this dispatch
      #     exists to surface, not noise to swallow. The artifact upload below is
      #     `if: always()`, so the screenshots and trace are still collected on
      #     the failing path; nothing diagnostic is lost by letting it go red.
      # -----------------------------------------------------------------------
      - name: Capture browser-E2E receipt (optional)
        id: receipt
        # `!cancelled()` for the same reason as the two steps above (F1): a
        # receipt the operator explicitly asked for must not be skipped because
        # an unrelated base-suite probe flaked. Still blocking via the gate.
        if: ${{ !cancelled() && inputs.target_route != '' }}
        env:
          # The NORMALIZED route from the validation step above — never the raw
          # input. Passed through env rather than interpolated into the shell so
          # a route containing shell metacharacters cannot alter the command.
          RECEIPT_ROUTE: ${{ steps.route.outputs.route }}
          RECEIPT_SLUG:  ${{ inputs.target_slug }}
          SESSION_SECRET:       ${{ env.SESSION_SECRET }}
          LOOM_URL:             ${{ env.LOOM_URL }}
          LOOM_AUTOMATION_OID:  ${{ env.LOOM_AUTOMATION_OID }}
          LOOM_AUTOMATION_UPN:  ${{ env.LOOM_AUTOMATION_UPN }}
          LOOM_AUTOMATION_NAME: ${{ env.LOOM_AUTOMATION_NAME }}
          CI: 'true'
        run: |
          set -euo pipefail
          if [ -d "/ms-playwright" ]; then export PLAYWRIGHT_BROWSERS_PATH=/ms-playwright; fi
          if [ -z "$RECEIPT_ROUTE" ]; then
            echo "::error::the normalize step produced no route — refusing to guess one."
            exit 1
          fi
          if [ -n "$RECEIPT_SLUG" ]; then
            node scripts/csa-loom/e2e-receipt.mjs --route "$RECEIPT_ROUTE" --slug "$RECEIPT_SLUG"
          else
            node scripts/csa-loom/e2e-receipt.mjs --route "$RECEIPT_ROUTE"
          fi

      # -----------------------------------------------------------------------
      # 7. Upload Playwright HTML report + any receipts as artifact (always).
      #    The whole test-results/ tree, not just test-results/uat/ — every
      #    project now has its own subdirectory (see 6a1), and the traces /
      #    screenshots / error-context.md of a FAILING extra project are the
      #    only receipt that explains it.
      # -----------------------------------------------------------------------
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loom-ui-verify-report-${{ github.run_id }}
          path: |
            apps/fiab-console/playwright-report/
            apps/fiab-console/test-results/
          retention-days: 14

      # -----------------------------------------------------------------------
      # 8. FINAL GATE (refs #2871) — this is where a BROKEN login-health verdict
      #    becomes a red run. It MUST stay last and MUST keep `if: always()`:
      #    the whole point of recording the preflight verdict instead of
      #    failing on it is that the browser suite gets to run and report, and
      #    that only holds if the enforcement still happens afterwards
      #    unconditionally. A gate that is skipped when an earlier step fails is
      #    the same mask in a new place.
      #
      #    NO continue-on-error here, ever. This step is the teeth for #2837.
      #    Deleting it, skipping it, or tolerating its failure restores exactly
      #    the defect that made a live sign-in outage render as a green check.
      #    scripts/ci/__tests__/ui-verify-gate.test.mjs asserts all of that
      #    against this file, so the invariant is enforced, not just documented.
      #
      #    It does NOT swallow the suite's own status: a failed Playwright step
      #    has already failed the job on its own, and the outcomes are passed in
      #    so a red suite is re-reported here alongside the login-health verdict
      #    — both causes visible, neither hiding the other.
      #
      #    EVERY browser step in this job is listed (refs #2875). It used to list
      #    only the two that had ids, with a comment saying "publish-version and
      #    the optional receipt keep their deliberate continue-on-error
      #    tolerance" — which described the very hole that let run 30824614880
      #    conclude green over a failed Playwright test. Both are now blocking
      #    steps with ids, and check-ui-verify-step-teeth.mjs fails the build if
      #    a browser step is ever added here without one, or if one acquires
      #    tolerance without the gate consuming its outcome.
      # -----------------------------------------------------------------------
      - name: Enforce login-health verdict + blocking suite results
        if: always()
        env:
          UVG_PREFLIGHT_OUTCOME: ${{ steps.login_health.outcome }}
          UVG_VERDICT: ${{ steps.login_health.outputs.verdict }}
          UVG_RC: ${{ steps.login_health.outputs.rc }}
          UVG_BLOCKING: 'verify=${{ steps.verify_project.outcome }},extra-projects=${{ steps.extra_projects.outcome }},publish-version=${{ steps.publish_version.outcome }},receipt=${{ steps.receipt.outcome }}'
        run: bash scripts/ci/ui-verify-gate-verdict.sh
