name: apiplane-w0-gov-probe

# CSA Loom - API & AI Gateway Plane W0 measurement, AZURE GOVERNMENT / GCC-HIGH half
# (PRPs/active/loom-api-gateway-plane/apigw-W00-measurement-spike.md, items W0-1, W0-2,
# W0-3, W0-4, W0-6, W0-7; one measurement shared with #4442 Wave 0 tasks 1-3 / #4460).
#
# WHAT IT DOES. Runs scripts/measure/apiplane/w0-apim-probe.mjs, one step per family
# (telemetry, policies, mcp, identity, latency, foundry), against the ONE APIM instance in
# the Gov subscription. The logic is in the .mjs (tests: scripts/measure/apiplane/__tests__/);
# this file only authenticates, calls it, merges the results and uploads them.
#
# WHAT IT TOUCHES. Reads: APIM, Monitor, Log Analytics, Graph, Cognitive Services. Writes:
# ONLY objects named `w0-apiplane-*` (named values, policy fragments, APIs), swept before and
# after every family and listed at the end; every delete goes through one function that throws
# on any other name. Nothing is retained. Expected cost: a few APIM management calls and, in the
# latency family, up to 2 x latency_poll_seconds of polling.
#
# WHY GOV RUNS HERE AND NEVER FROM A WORKSTATION: cloud-parity.md item 4 - Gov facts come from a
# GitHub Actions run. The Gov gateway is VNet-internal (apim.bicep sets virtualNetworkType
# 'Internal') and this runner is GitHub-hosted, so data-plane cells (latency, gateway
# reachability) are expected to read not-measured:gateway-unreachable-from-runner and the DNS cell
# not-measured:no-in-boundary-runner. That is a recorded finding, not a failure.
#
# FAILS CLOSED, EVEN ON DISPATCH. deploy-fiab-gcc.yml:130-150 skips green on a manual dispatch
# when its secrets are missing. For a MEASUREMENT that is the "green over nothing" shape this
# repo forbids (deploy-integrity.md R3): a run that measured nothing must not look like a pass. So
# the precheck below exits 1 on any missing secret or malformed input, on every trigger.
#
# EXIT CODES (per family step; any non-zero fails the job, and the aggregate step re-checks):
#   0  controls passed, every required cell measured or not-measured
#   2  a CONTROL FAILED or the script crashed - that family is INVALID, publish none of its cells
#   3  a required cell is unknown (e.g. a 403 naming the role), or scratch objects were left behind
#
# TIMEOUT vs CAP. The `probe` job has timeout-minutes 90 and the latency family waits latency_poll_seconds up to
# TWICE (value A, then value B), so the cap is 1800: 2 x 30 min + ~15 min for the rest of the job stays under 90. A
# timeout kill skips the probe's `finally` sweep and would leave the scratch API and named value live on the gateway.
# A test derives this relationship from the files, so raising the cap or lowering the timeout turns it red.
#
# PUBLIC REPO: Actions logs and artifacts are world-readable. The probe prints names, resource
# groups, SKUs and states only and runs everything through scripts/ci/_azure-redact.mjs.
#
# ONE APPROVAL: a single `probe` job in the gcc-high-deploy environment (manual approval, as
# governance-w0-measure.yml), one step per family with `if: always()` so a failing family does
# not hide the others. No step uses continue-on-error, `|| true`, or discards stderr.
#
# Dispatch:
#   gh workflow run apiplane-w0-gov-probe.yml
#   gh workflow run apiplane-w0-gov-probe.yml -f families=telemetry,policies -f apim_name=<name>
#   gh workflow run apiplane-w0-gov-probe.yml -f latency_poll_seconds=300

run-name: apiplane-w0-gov-probe gov families=${{ inputs.families }}

on:
  workflow_dispatch:
    inputs:
      apim_name:
        description: 'APIM service name. Empty = the single APIM in the Gov subscription (the probe refuses to guess when there are several).'
        type: string
        required: false
        default: ''
      families:
        description: 'Comma-separated families to run, or "all": telemetry,policies,mcp,identity,latency,foundry'
        type: string
        required: false
        default: all
      latency_poll_seconds:
        description: 'Cap in seconds on EACH named-value propagation wait (30-1800). A value never seen within the cap is recorded as not observed, never as a number.'
        type: string
        required: false
        default: '900'

permissions:
  contents: read

concurrency:
  group: apiplane-w0-gov-probe
  cancel-in-progress: false

jobs:
  precheck:
    name: Verify Gov secrets and inputs (fails closed)
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on a missing secret or a malformed input
        env:
          GOV_C: ${{ secrets.AZURE_GOV_CLIENT_ID }}
          GOV_S: ${{ secrets.AZURE_GOV_CLIENT_SECRET }}
          GOV_T: ${{ secrets.AZURE_GOV_TENANT_ID }}
          GOV_U: ${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}
          IN_APIM: ${{ inputs.apim_name }}
          IN_FAMILIES: ${{ inputs.families }}
          IN_POLL: ${{ inputs.latency_poll_seconds }}
        run: |
          set -uo pipefail
          missing=""
          [[ -z "$GOV_C" ]] && missing="$missing AZURE_GOV_CLIENT_ID"
          [[ -z "$GOV_S" ]] && missing="$missing AZURE_GOV_CLIENT_SECRET"
          [[ -z "$GOV_T" ]] && missing="$missing AZURE_GOV_TENANT_ID"
          [[ -z "$GOV_U" ]] && missing="$missing AZURE_GOV_SUBSCRIPTION_ID"
          if [[ -n "$missing" ]]; then
            echo "::error::apiplane-w0-gov-probe cannot authenticate - missing secret(s):$missing. Failing instead of reporting a green run that measured nothing, on every trigger including a manual dispatch."
            exit 1
          fi
          if [[ -n "$IN_APIM" ]] && ! [[ "$IN_APIM" =~ ^[a-zA-Z]([a-zA-Z0-9-]{0,48}[a-zA-Z0-9])?$ ]]; then
            echo "::error::apim_name is not a valid APIM service name"
            exit 1
          fi
          # 1800 is the largest cap whose worst case fits the job: the latency family waits the cap up to TWICE (value A, then
          # value B), so 2 x 1800 s = 60 min plus ~15 min for everything else stays under timeout-minutes 90. A timeout kill
          # skips the probe's `finally` sweep and would leave the scratch API and named value live on the gateway. The digits are
          # bounded (2-4, no leading zero) so the arithmetic is always sane: bash reads 0900 as octal, and a 20-digit value wraps.
          if ! [[ "$IN_POLL" =~ ^[1-9][0-9]{1,3}$ ]] || (( IN_POLL < 30 || IN_POLL > 1800 )); then
            echo "::error::latency_poll_seconds must be an integer from 30 to 1800"
            exit 1
          fi
          if [[ -z "$IN_FAMILIES" ]]; then
            echo "::error::families must not be empty (use all, or a comma-separated list of telemetry,policies,mcp,identity,latency,foundry)"
            exit 1
          fi
          if [[ "$IN_FAMILIES" != "all" ]]; then
            IFS=',' read -ra wanted <<< "$IN_FAMILIES"
            for f in "${wanted[@]}"; do
              case "$f" in
                telemetry|policies|mcp|identity|latency|foundry) ;;
                *) echo "::error::unknown family '$f' (use all, or a comma-separated list of telemetry,policies,mcp,identity,latency,foundry)"; exit 1 ;;
              esac
            done
          fi
          echo "precheck ok: 4 Gov secrets present, inputs valid"

  probe:
    name: Probe the Gov APIM (one approval, one step per family)
    needs: [precheck]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: gcc-high-deploy   # requires manual approval (same gate as governance-w0-measure.yml)
    env:
      FAMILIES: ${{ inputs.families }}
      APIM_NAME: ${{ inputs.apim_name }}
      POLL_SECONDS: ${{ inputs.latency_poll_seconds }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Azure login (Gov sub) - limitlessdata_deploy SP
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment

      - name: Set Azure cloud to Gov
        run: az cloud set --name AzureUSGovernment

      - name: Prepare the output directory
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/apiplane-w0-gov"
          mkdir -p "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: telemetry (W0-1) - diagnostic categories, Log Analytics tables
        if: ${{ always() && (env.FAMILIES == 'all' || contains(env.FAMILIES, 'telemetry')) }}
        run: |
          set -uo pipefail
          args=(--cloud gov --family telemetry --runner hosted --out "$OUT")
          [[ -n "$APIM_NAME" ]] && args+=(--apim-name "$APIM_NAME")
          node scripts/measure/apiplane/w0-apim-probe.mjs "${args[@]}"

      - name: policies (W0-2) - llm-* family and friends, with controls
        if: ${{ always() && (env.FAMILIES == 'all' || contains(env.FAMILIES, 'policies')) }}
        run: |
          set -uo pipefail
          args=(--cloud gov --family policies --runner hosted --out "$OUT")
          [[ -n "$APIM_NAME" ]] && args+=(--apim-name "$APIM_NAME")
          node scripts/measure/apiplane/w0-apim-probe.mjs "${args[@]}"

      - name: mcp (W0-3) - MCP API type, mcpProperties, .well-known
        if: ${{ always() && (env.FAMILIES == 'all' || contains(env.FAMILIES, 'mcp')) }}
        run: |
          set -uo pipefail
          args=(--cloud gov --family mcp --runner hosted --out "$OUT")
          [[ -n "$APIM_NAME" ]] && args+=(--apim-name "$APIM_NAME")
          node scripts/measure/apiplane/w0-apim-probe.mjs "${args[@]}"

      - name: identity (W0-4) - Graph reads with the run's own identity
        if: ${{ always() && (env.FAMILIES == 'all' || contains(env.FAMILIES, 'identity')) }}
        run: |
          set -uo pipefail
          args=(--cloud gov --family identity --runner hosted --out "$OUT")
          [[ -n "$APIM_NAME" ]] && args+=(--apim-name "$APIM_NAME")
          node scripts/measure/apiplane/w0-apim-probe.mjs "${args[@]}"

      - name: latency (W0-6) - named-value propagation at the gateway
        if: ${{ always() && (env.FAMILIES == 'all' || contains(env.FAMILIES, 'latency')) }}
        run: |
          set -uo pipefail
          args=(--cloud gov --family latency --runner hosted --out "$OUT" --latency-poll-seconds "$POLL_SECONDS")
          [[ -n "$APIM_NAME" ]] && args+=(--apim-name "$APIM_NAME")
          node scripts/measure/apiplane/w0-apim-probe.mjs "${args[@]}"

      - name: foundry (W0-7) - Anthropic-on-Foundry models and DNS
        if: ${{ always() && (env.FAMILIES == 'all' || contains(env.FAMILIES, 'foundry')) }}
        run: |
          set -uo pipefail
          args=(--cloud gov --family foundry --runner hosted --out "$OUT")
          [[ -n "$APIM_NAME" ]] && args+=(--apim-name "$APIM_NAME")
          node scripts/measure/apiplane/w0-apim-probe.mjs "${args[@]}"

      - name: Aggregate the receipt (redacted), append it to the summary, fail if any family failed
        if: ${{ always() }}
        run: |
          set -uo pipefail
          test -n "${OUT:-}" || { echo "::error::the output directory was never prepared; nothing ran"; exit 1; }
          expect="$FAMILIES"
          [[ "$expect" == "all" ]] && expect="telemetry,policies,mcp,identity,latency,foundry"
          node scripts/measure/apiplane/w0-apim-probe.mjs --aggregate "$OUT" --expect "$expect" --cloud gov --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload receipt and per-family JSON (names, resource groups, SKUs, states only)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apiplane-w0-gov
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 14
