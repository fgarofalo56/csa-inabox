name: Trivy

# CSA-0032 — Trivy vulnerability scanning.
#
# Three surfaces covered:
#   1. Filesystem scan of requirements/locks/*/requirements.txt (Python CVEs).
#      This is the cheapest surface and runs on every PR touching a lock file.
#   2. Docker image scans for the two portal images built from
#      portal/kubernetes/docker/{backend,frontend}/Dockerfile.
#   3. IaC/config scan of the repo (Dockerfiles, compose, k8s manifests)
#      — separately gated so a misconfiguration does not block an
#      otherwise-clean dependency PR.
#
# #3485 — THE LOCK-FILE SCAN EXAMINED NOTHING, FOR AS LONG AS IT HAD EXISTED.
# Run 31834443174 logged `Number of language-specific files  num=0` and the
# report table was empty: the CRITICAL-gated check named "Trivy Filesystem (lock
# files)" had never looked at a single package. Trivy's pip analyzer keys on the
# FILENAME, and `requirements/portal.lock` matched nothing it looks for. The
# locks now live at `requirements/locks/<extra>/requirements.txt` — a filename
# both Trivy and Syft recognise with no configuration, so there is no pattern
# config here to silently regress. The `locks/` level is also load-bearing:
# Trivy's default skip list is ROOT-ANCHORED and includes `dev`, so with the
# scan rooted at `requirements/` a `requirements/dev/requirements.txt` was
# dropped while its nine siblings were scanned (measured).
#
# The rename alone would not have been enough, because nothing would have
# noticed it regressing. The `lock-scan-coverage` step below is the assertion
# that was missing on day one: every tracked lock must appear in the report with
# a package count matching the pins it declares. It is what caught the `dev`
# skip.
#
# PR gating rules (enforced via the `severity` / `exit-code` knobs):
#   • CRITICAL findings fail the PR.
#   • HIGH findings are posted as a PR comment but do not block.
#   • MEDIUM and below go to the workflow summary only.
#
# SARIF output from the image scans is uploaded to GitHub Code Scanning
# so findings surface alongside CodeQL alerts.

on:
  pull_request:
    branches: [main]
    paths:
      - 'requirements/**'
      - 'pyproject.toml'
      - 'portal/kubernetes/docker/**'
      - 'scripts/ci/check-lock-scan-coverage.mjs'
      - '.github/workflows/trivy.yml'
  push:
    branches: [main]
  schedule:
    # Weekly full re-scan to catch newly-disclosed CVEs in unchanged deps.
    - cron: '19 4 * * 2'
  workflow_dispatch:

concurrency:
  # #3423 — this was `group: <workflow>-<ref>` + `cancel-in-progress: true`.
  # Every push to main shares `refs/heads/main`, so each merge CANCELLED the
  # previous commit's scan, and a cancelled job never runs its `if: always()`
  # SARIF upload steps either. Measured: 20 of 81 image-scan jobs cancelled
  # across 30 runs; 7 of the last 25 commits on main carry a "produced NO
  # verdict" summary — permanently unscanned, with no Code Scanning entry.
  #
  # On a PR only the head commit matters, so superseding by ref is right. On main
  # every commit is a thing that shipped and its verdict is the only record that
  # it was scanned, so main runs get a PER-SHA group and never contend.
  #
  # Merely flipping `cancel-in-progress` to false would NOT have fixed this:
  # GitHub holds only one PENDING run per group and documents that "any existing
  # pending job or workflow in the same concurrency group will be canceled", so
  # under a fast merge cadence commits would still lose their scan — just while
  # queued rather than mid-run. The per-SHA group is what actually guarantees a
  # verdict per commit.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Upload SARIF results to Code Scanning.
  security-events: write
  # Post PR comment with HIGH findings.
  pull-requests: write

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # 1. Lock-file CVE scan — fast, runs first.  Fails on CRITICAL.
  # ───────────────────────────────────────────────────────────────────────
  trivy-fs:
    name: Trivy Filesystem (lock files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # The coverage guard's own control, run BEFORE any real report exists. It
      # feeds the analyser an empty report, an under-read target and an empty
      # population and requires each to FAIL. A gate that cannot fail must not be
      # the thing that certifies the scan (#3485).
      - name: lock-scan-coverage self-test (the coverage assertion must be able to fail)
        run: node scripts/ci/check-lock-scan-coverage.mjs --selftest

      # A full-severity JSON report used ONLY to prove the scan parsed the locks.
      # exit-code 0 deliberately: this step's job is coverage, not the verdict —
      # the CRITICAL gate below is what decides the check.
      - name: Trivy filesystem scan — full report (coverage evidence)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        env:
          # Populate Results[].Packages so the coverage guard can count what was
          # actually parsed rather than inferring it from vulnerability counts —
          # zero findings is a legitimate state, zero packages never is.
          TRIVY_LIST_ALL_PKGS: 'true'
        with:
          scan-type: fs
          scan-ref: requirements/
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: false
          format: json
          output: trivy-fs-coverage.json
          vuln-type: library

      # THE POPULATION FLOOR. Every tracked lock must appear in that report with
      # a package count equal to the pins it declares. Without this, `num=0`
      # reads exactly like `no vulnerabilities` — which is how this job passed
      # for its entire existence.
      - name: lock-scan-coverage (the scan must have PARSED every lock — #3485)
        run: node scripts/ci/check-lock-scan-coverage.mjs --trivy trivy-fs-coverage.json

      # Fail the job on CRITICAL.
      - name: Trivy filesystem scan — fail on CRITICAL
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: requirements/
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          vuln-type: library

      # Non-blocking scan for HIGH — emits SARIF for code-scanning + JSON
      # for the PR-comment step.
      - name: Trivy filesystem scan — HIGH (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: requirements/
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          vuln-type: library

      - name: Upload SARIF to Code Scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@d97b3428e8eebbb1810cf454d6397886d136b4ba # v3.27.5
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Trivy filesystem scan — JSON (for PR comment)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: requirements/
          severity: HIGH
          exit-code: '0'
          ignore-unfixed: true
          format: json
          output: trivy-fs-high.json
          vuln-type: library

      - name: Post HIGH findings to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let findings = [];
            try {
              const raw = fs.readFileSync('trivy-fs-high.json', 'utf8');
              const report = JSON.parse(raw);
              for (const result of report.Results || []) {
                for (const vuln of result.Vulnerabilities || []) {
                  findings.push({
                    pkg: vuln.PkgName,
                    id: vuln.VulnerabilityID,
                    severity: vuln.Severity,
                    installed: vuln.InstalledVersion,
                    fixed: vuln.FixedVersion || 'n/a',
                    target: result.Target,
                  });
                }
              }
            } catch (e) {
              core.info(`No trivy-fs-high.json or parse error: ${e.message}`);
            }

            const marker = '## Trivy — HIGH findings (lock files)';
            let body;
            if (findings.length === 0) {
              body = `${marker}\n\nNo HIGH-severity CVEs detected in lock files.`;
            } else {
              const rows = findings
                .map(f => `| ${f.target} | ${f.pkg} | ${f.id} | ${f.severity} | ${f.installed} | ${f.fixed} |`)
                .join('\n');
              body = [
                marker,
                '',
                'The following HIGH-severity vulnerabilities were detected.',
                'They do **not** block this PR, but should be addressed.',
                '',
                '| File | Package | CVE | Severity | Installed | Fixed |',
                '|------|---------|-----|----------|-----------|-------|',
                rows,
                '',
                '> CRITICAL findings (if any) have already failed the PR check.',
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ───────────────────────────────────────────────────────────────────────
  # 2. Docker image scans.
  # ───────────────────────────────────────────────────────────────────────
  trivy-image:
    name: Trivy Image (${{ matrix.component }})
    runs-on: ubuntu-latest
    # Per-component: the console image is a full Next.js build (6.5 GB heap,
    # ~30 min) and does not fit the portal images' 25-minute budget.
    timeout-minutes: ${{ matrix.timeout || 25 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: portal-backend
            dockerfile: portal/kubernetes/docker/backend/Dockerfile
            context: .
          - component: portal-frontend
            dockerfile: portal/kubernetes/docker/frontend/Dockerfile
            # Frontend Dockerfile uses repo-root-relative COPY paths
            # (`COPY portal/react-webapp/...`, `COPY portal/kubernetes/docker/frontend/nginx.conf`),
            # so the build context must be the repo root, not portal/react-webapp.
            # Previously this was set to portal/react-webapp which made the
            # COPY paths resolve to portal/react-webapp/portal/react-webapp/... and
            # the build failed before Trivy could scan the image.
            context: .
          # THE PRODUCT. Everything shipped to customers runs in this image, and
          # until now it was the ONE image the recurring scan did not cover —
          # only the two portal images were. That is why the #2729 CVE floors
          # going inert (they were declared where the pnpm-9 builder cannot read
          # them, #2781) could not have been caught here: nothing ever scanned
          # the artifact those floors were meant to protect.
          #
          # Build context MUST be apps/fiab-console — its Dockerfile COPYs
          # `package.json pnpm-lock.yaml* pnpm-workspace.yaml*` relative to the
          # project dir, not the repo root.
          - component: loom-console
            dockerfile: apps/fiab-console/Dockerfile
            context: apps/fiab-console
            timeout: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Stage Copilot RAG corpus (loom-console only)
        if: matrix.component == 'loom-console'
        shell: bash
        run: |
          # #2929 — scan the image we actually SHIP. The console Dockerfile COPYs
          # ./copilot-corpus (staged from repo-root docs/ + PRPs/, which sit
          # outside the apps/fiab-console build context). Skipping the staging
          # here would scan a materially different image from the deployed one,
          # which is the same "the gate does not cover the artifact" gap the
          # matrix comment above describes.
          # Enforced by scripts/ci/check-console-corpus-staged.mjs.
          bash scripts/csa-loom/stage-copilot-corpus.sh

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: csa/${{ matrix.component }}:trivy-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan — fail on CRITICAL
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: csa/${{ matrix.component }}:trivy-${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Trivy image scan — HIGH+CRITICAL (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: csa/${{ matrix.component }}:trivy-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: sarif
          output: trivy-image-${{ matrix.component }}.sarif

      - name: Upload SARIF to Code Scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@d97b3428e8eebbb1810cf454d6397886d136b4ba # v3.27.5
        with:
          sarif_file: trivy-image-${{ matrix.component }}.sarif
          category: trivy-image-${{ matrix.component }}

  # ───────────────────────────────────────────────────────────────────────
  # 3. Config scan (Dockerfile + k8s manifests).  Never blocks a PR on
  #    its own — reports only.
  # ───────────────────────────────────────────────────────────────────────
  trivy-config:
    name: Trivy Config (Dockerfile + k8s)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: config
          scan-ref: portal/kubernetes/
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: sarif
          output: trivy-config.sarif

      - name: Upload config SARIF to Code Scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@d97b3428e8eebbb1810cf454d6397886d136b4ba # v3.27.5
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ───────────────────────────────────────────────────────────────────────
  # 4. Summary — aggregates the three scans into one reportable verdict.
  #
  # NOT a required status check. This comment previously claimed it was the
  # "single required check for branch protection"; measured against main on
  # 2026-08-13 that is false — `Trivy Summary` is absent from all 14 contexts in
  # classic branch protection, and the only ruleset (15128883) carries no
  # `required_status_checks` rule at all. Whether it SHOULD gate is an open
  # posture question in #3423, deliberately sequenced after the concurrency fix
  # above: this check fails closed on a cancelled scan (#3368, correctly), so
  # requiring it while a quarter of scans were being cancelled would have
  # blocked merges on concurrency alone.
  # ───────────────────────────────────────────────────────────────────────
  trivy-summary:
    name: Trivy Summary
    if: always()
    needs: [trivy-fs, trivy-image, trivy-config]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Evaluate results
        env:
          CFG_RESULT: ${{ needs.trivy-config.result }}
        run: |
          set -euo pipefail
          echo "trivy-config (informational, not gated): ${CFG_RESULT}"
          # Only the CRITICAL gates (fs + image) decide this check.
          # Config scan is informational and is allowed to fail on its own.
          #
          # #3368 — this WAS `if [[ "$FS_RESULT" != "success" || ... ]]; then
          # echo "::error::Trivy CRITICAL gate failed."`. This job is
          # `if: always()`, so on a CANCELLED run the results are `cancelled`,
          # `!= "success"` was true, and a required security check asserted a
          # scan FAILURE over a scan that never ran — a claim it had not
          # established (deploy-integrity.md R7).
          #
          # --require-verdict keeps the EXIT STATUS identical to before: a
          # cancelled or skipped scan still fails this check closed, because
          # letting it pass would hide a real gap. What changes is the claim.
          node scripts/ci/run-outcome.mjs \
            --require-verdict \
            --what 'Trivy CRITICAL gate (fs + image)' \
            --result '${{ needs.trivy-fs.result }}' \
            --result '${{ needs.trivy-image.result }}'
