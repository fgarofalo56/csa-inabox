name: build-fiab-images-acr-tasks

# CSA Loom — image build via Azure Container Registry Tasks.
#
# THE image producer for BOTH clouds. `boundary` selects the estate:
#   Commercial (default) → AZURE_* secrets, rg-csa-loom-admin-eastus2
#   GCC-High / IL5       → AZURE_GOV_* secrets + `az cloud set --name
#                          AzureUSGovernment`, rg-csa-loom-admin-usgovvirginia
# Everything else is identical, because the mechanism is identical: `az acr
# build` runs SERVER-SIDE inside Azure.
#
# Why this exists alongside build-fiab-images.yml: the customer's
# Loom ACR is provisioned with publicNetworkAccess=Disabled (private
# endpoint only), so external GitHub runners can't reach it for
# `docker push`. ACR Tasks run *inside* Azure and reach ACR via
# its internal network — this avoids the chicken-and-egg of needing
# a self-hosted runner inside the VNet just to push images. That is doubly true
# in Gov, where the registry has never been publicly reachable:
# build-fiab-images.yml's docker/build-push-action matrix CANNOT produce Gov
# images (it authenticates with the Commercial SP and pushes client-side), so
# THIS workflow is the only Gov image path. Run it with boundary=GCC-High before
# any apps-enabled Gov deploy — a Container App whose image is absent from the
# boundary's ACR fails its PUT with MANIFEST_UNKNOWN.
#
# Each app is built via `az acr build`. The source is uploaded as a
# tar archive to the Task and Docker builds inside ACR.
#
# SC1 (supply-chain enforcement on the REAL deploy path): after each image is
# built, this workflow now (1) Trivy-scans the pushed image and FAILS the build
# on CRITICAL CVEs, and (2) cosign-signs the image digest keylessly via GitHub
# Actions OIDC (Sigstore Fulcio + Rekor — no long-lived signing key to manage).
# The roll workflows (loom-roll-and-validate / gov-console-roll /
# full-app-deploy-commercial) cosign-VERIFY the signature before rolling, so an
# image that skipped this gate is rejected at deploy time. Emergency valve:
# the `skip_supply_chain` dispatch input or repo variable
# LOOM_BUILD_SKIP_SUPPLY_CHAIN=true skips scan+sign (loud warning) — the
# resulting UNSIGNED image will then be refused by the roll gates unless their
# own valves are also used. See docs/SUPPLY_CHAIN.md §7.

on:
  workflow_dispatch:
    inputs:
      boundary:
        description: 'Which cloud/boundary ACR to build into. Commercial uses the AZURE_* secret set; GCC-High / IL5 use AZURE_GOV_* + `az cloud set --name AzureUSGovernment`.'
        type: choice
        default: Commercial
        options:
          - Commercial
          - GCC-High
          - IL5
      tag_override:
        description: 'Image tag (default: v0.1)'
        type: string
        default: v0.1
      apps:
        description: 'Comma-separated app list, or "all"'
        type: string
        default: all
      submit_mode:
        description: 'poll (default): submit with --no-wait and decide from the ACR run status (immune to the ~70 min log-stream SAS expiry). legacy: the previous bare az acr build whose log stream is the verdict (rollback).'
        type: choice
        default: poll
        options:
          - poll
          - legacy
      pool_apps:
        description: 'Apps to build on the dedicated pool (--agent-pool): comma list, or "default" (loom-console,loom-directlake), or "none" (every app on default agents). Lets the operator flip routing at dispatch without a code change.'
        type: string
        default: default
      pool_agent_count:
        description: 'Agents to scale the loom-console build pool UP to for this run (clamped 1..4 by scripts/ci/acr-build-pool.mjs). Blank = 2 on Commercial, 1 on GCC-High/IL5. The pool_release job scales it back to 0 and reads the count back.'
        type: string
        default: ''
      skip_supply_chain:
        description: 'EMERGENCY VALVE — skip the Trivy CRITICAL gate + cosign signing (e.g. Trivy DB / Sigstore outage). The unsigned image will be REJECTED by the roll gates unless their skip valves are also set.'
        type: boolean
        default: false
  # Callable so a boundary deploy workflow can produce its OWN images as a job
  # (deploy-fiab-gcch.yml / deploy-fiab-il5.yml call this between the infra phase
  # and the apps-enabled phase). Call sites must pass `secrets: inherit`.
  workflow_call:
    inputs:
      boundary:
        type: string
        default: Commercial
      tag_override:
        type: string
        default: v0.1
      apps:
        type: string
        default: all
      skip_supply_chain:
        type: boolean
        default: false
      pool_agent_count:
        type: string
        default: ''
      pool_apps:
        type: string
        default: default
      submit_mode:
        type: string
        default: poll
  push:
    branches: [main]
    paths:
      - 'apps/fiab-*/**'
      # loom-unity lives at ./apps/<name> (not the ./apps/fiab-* convention) and
      # is now in the default "all" build matrix, because admin-plane/main.bicep
      # deploys it on every boundary (svc-loom-unity-authz). Its entrypoint owns
      # the fail-closed authorization posture, so a change there must produce a
      # new image.
      # loom-copilot-maf builds from ./apps/copilot-maf — it does NOT follow the
      # ./apps/fiab-* convention, so the glob above never matched it. It is in the
      # default "all" matrix, i.e. a push WOULD build it; the trigger simply could
      # not fire. A change to the MAF Copilot tier merged green and never produced
      # an image, with no failure anywhere to notice. Caught by
      # scripts/ci/check-build-trigger-covers-matrix.mjs, which now compares the
      # two lists mechanically.
      - 'apps/copilot-maf/**'
      - 'apps/loom-unity/**'
      # loom-trino is the N7e Federated SQL engine, now DEFAULT-ON
      # (admin-plane/main.bicep -> data-plane/loom-trino-aca.bicep). Without its
      # image in ACR the Container App cannot start and LOOM_TRINO_URL would be
      # wired to an endpoint that never serves.
      - 'apps/loom-trino/**'
      # DEFAULT-ON data-plane Container Apps that live at ./apps/<name> rather
      # than the ./apps/fiab-* convention. admin-plane/main.bicep now deploys
      # both on every apps-enabled deploy, so their images must exist in ACR.
      - 'apps/loom-migrate/**'
      - 'apps/loom-risingwave/**'
      # loom-directlake is the HYP-5 Direct Lake columnar scan/frame service,
      # DEFAULT-ON since #3291 wired compute/loom-directlake-app.bicep into
      # admin-plane/main.bicep and bound LOOM_DIRECTLAKE_URL. Same reason as the
      # two above: without its image in ACR the Container App cannot start.
      - 'apps/loom-directlake/**'
      - '.github/workflows/build-fiab-images-acr-tasks.yml'

permissions:
  contents: read
  # SC1: keyless cosign signing exchanges the Actions OIDC token for a
  # short-lived Fulcio certificate.
  id-token: write


# Serialize all runs of this workflow. Two parallel runs would race on
# the ACR publicNetworkAccess + networkRuleSet toggle — one would
# disable while the other's matrix builds were still mid-push, denying
# late finishers with "client with IP ... not allowed access". With
# cancel-in-progress=false we queue subsequent runs instead of dropping
# them, so every commit still gets its image build.
#
# #2603: this guard is necessary but NOT sufficient. It only covers two
# *running* instances of THIS workflow. It does not cover (a) a CANCELLED run,
# whose `acr_restore` job still executes under `if: always()` after GitHub has
# already released the concurrency slot to the next run, nor (b) the ~19 other
# call sites — other workflows, the Gov estate, and the deploy-*-job.sh scripts
# a human runs from a laptop — that toggle the same registry. Ownership of the
# firewall now lives in scripts/csa-loom/acr-firewall-lease.sh: acr_enable
# ACQUIRES a lease recorded as ARM tags on the registry, and acr_restore only
# re-locks if this run is still the recorded holder. See
# docs/fiab/acr-firewall-lease.md.
concurrency:
  # Per-BOUNDARY: Commercial and Gov toggle DIFFERENT registries, so serialising
  # them against each other would only add latency. Two runs against the SAME
  # registry still queue.
  group: build-fiab-images-acr-tasks-${{ inputs.boundary || 'Commercial' }}
  cancel-in-progress: false
env:
  # Boundary-aware. `push`/default = Commercial; GCC-High + IL5 resolve the
  # sovereign region and log in with the AZURE_GOV_* secret set. This is what
  # makes the workflow a REAL Gov image producer: `az acr build` runs SERVER-SIDE
  # inside Azure, which is the only mechanism that reaches a Gov ACR provisioned
  # with publicNetworkAccess=Disabled (a client-side `docker push` from a
  # GitHub-hosted runner cannot). Same mechanism gov-console-roll.yml and
  # gov-provision-wrangler.yml have used in production.
  BOUNDARY: ${{ inputs.boundary || 'Commercial' }}
  AZURE_LOCATION: ${{ (inputs.boundary == 'GCC-High' || inputs.boundary == 'IL5') && 'usgovvirginia' || 'eastus2' }}
  # This workflow is the longest-lived holder (console compile + matrix builds +
  # Trivy scan + cosign sign). Size the lease so a legitimate run never expires
  # mid-push and gets its registry swept out from under it.
  LOOM_ACR_LEASE_TTL_MINUTES: '180'
  # 180 = build job timeout (150) + the acr_enable -> build gap and margin. The
  # lease is taken in acr_enable BEFORE the build queues, so it must outlive
  # queue + the 105-min run poll + scan/sign, or a sweeper/second holder could
  # re-lock the registry under a live build. (acr-firewall-lease.sh has no
  # renew verb.) Cost: after a crash that skips release, the scheduled sweeper
  # re-locks up to 60 min later than at 120.
  # Rollback switch for the build submit path: dispatch with submit_mode=legacy,
  # or set repo variable LOOM_ACR_SUBMIT_MODE=legacy. Default poll.
  SUBMIT_MODE: ${{ inputs.submit_mode || vars.LOOM_ACR_SUBMIT_MODE || 'poll' }}
  # Build-pool size for the loom-console compile (the only app on the dedicated
  # pool). Raw value; clamped to 1..4 by `acr-build-pool.mjs clamp` at use.
  # Commercial defaults to 2; Gov lanes stay at 1 (the same guaranteed
  # scale-down applies to them, but the 2026-10-21 decision was Commercial).
  POOL_AGENT_COUNT: ${{ inputs.pool_agent_count || ((inputs.boundary == 'GCC-High' || inputs.boundary == 'IL5') && '1' || '2') }}
  BUILD_POOL_NAME: loombuild2
  # Apps built on the dedicated S3 pool (--agent-pool): the two long poles.
  # loom-console (Next.js compile, OOMs the 8 GB default agent) and
  # loom-directlake (Rust release build; sat 52 min queued on the shared default
  # agents, ACR run cj90w, 2026-10-21). Everything else stays on default agents:
  # moving all 14 would only re-serialize them behind POOL_AGENT_COUNT agents.
  # Comma-separated, exact names. Sized with POOL_AGENT_COUNT=2 = one agent per
  # heavy app (Learn documents S3 = 8 CPU / 16 GB PER INSTANCE and does not state
  # how many task runs one instance executes concurrently, so we assume 1).
  POOL_APPS_DEFAULT: loom-console,loom-directlake
  # Raw operator override: 'default' | 'none' | comma list. Resolved (and
  # shape-validated) by `acr-build-pool.mjs pool-apps`; push runs have no
  # inputs so they get 'default'.
  POOL_APPS_INPUT: ${{ inputs.pool_apps || 'default' }}

jobs:
  resolve:
    name: Resolve ACR + filter apps
    runs-on: ubuntu-latest
    # actions: read -- the matrix step asks which push run last SUCCEEDED (the diff
    # base for the changed-app plan). The workflow-level block grants neither.
    permissions:
      contents: read
      actions: read
    outputs:
      acr_name: ${{ steps.acr.outputs.acr_name }}
      acr_login_server: ${{ steps.acr.outputs.acr_login_server }}
      app_matrix: ${{ steps.matrix.outputs.matrix }}
      # JSON array of the apps NOT rebuilt on this push; carry_forward re-tags
      # each one's current image to <sha>. '[]' on dispatch / call / build-all.
      carry_apps: ${{ steps.matrix.outputs.carry_apps }}
      build_count: ${{ steps.matrix.outputs.build_count }}
    steps:
      # The matrix resolver probes ./apps/<name> to decide each build context, so this
      # job needs the tree. It had no checkout before — the probe silently evaluated
      # false for every app and everything fell through to the ./apps/fiab-* convention.
      - uses: actions/checkout@v7.0.1
        with:
          # Full history: the changed-app plan diffs <last successful push run>..sha.
          fetch-depth: 0
      # Fail LOUDLY rather than silently building into the wrong cloud: a Gov
      # dispatch with no AZURE_GOV_* secret set would otherwise fall through to
      # an unauthenticated `az` and report a confusing "ACR not found".
      - name: Verify the boundary's credential set is configured
        env:
          GC: ${{ secrets.AZURE_GOV_CLIENT_ID }}
          GS: ${{ secrets.AZURE_GOV_CLIENT_SECRET }}
          GT: ${{ secrets.AZURE_GOV_TENANT_ID }}
          GU: ${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}
          CC: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [[ "$BOUNDARY" == "Commercial" ]]; then
            [[ -n "$CC" ]] || { echo "::error::AZURE_CLIENT_ID is not configured."; exit 1; }
          else
            if [[ -z "$GC" || -z "$GS" || -z "$GT" || -z "$GU" ]]; then
              echo "::error::boundary=$BOUNDARY needs the AZURE_GOV_* secret set (see docs/fiab/runbooks/secrets-bootstrap.md)."
              exit 1
            fi
          fi
      - name: Azure login (Commercial)
        if: env.BOUNDARY == 'Commercial'
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }
      # GCC-High / IL5. Same SP set every other gov-* workflow uses, with the
      # sovereign ARM/AAD endpoints; `az cloud set` afterwards so every plain
      # `az` call later in the job (acr build, acr repository show, acr login)
      # targets the Government cloud too.
      - name: Azure login (Gov)
        if: env.BOUNDARY != 'Commercial'
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment
      - name: Set Azure cloud to Gov
        if: env.BOUNDARY != 'Commercial'
        run: az cloud set --name AzureUSGovernment
      - id: acr
        run: |
          # Resolve the admin RG by PREFIX — it may or may not carry a region
          # suffix (rg-csa-loom-admin OR rg-csa-loom-admin-usgovvirginia). Try the
          # AZURE_LOCATION-suffixed name first, else fall back to the first
          # 'rg-csa-loom-admin' prefix match (mirrors console-bluegreen-roll).
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          if ! az group show -n "$RG" -o none 2>/dev/null; then
            RG=$(az group list --query "[?starts_with(name, 'rg-csa-loom-admin')] | [0].name" -o tsv | tr -d '\r')
          fi
          if [[ -z "$RG" ]]; then echo "::error::Admin RG not found (prefix rg-csa-loom-admin)."; exit 1; fi
          echo "::notice::admin RG = $RG"
          ACR=$(az acr list --resource-group "$RG" --query "[?starts_with(name, 'acrloom')]|[0].name" -o tsv)
          if [[ -z "$ACR" ]]; then echo "::error::ACR not found"; exit 1; fi
          echo "acr_name=$ACR" >> "$GITHUB_OUTPUT"
          # Read the login server from ARM instead of appending '.azurecr.io':
          # the Government suffix is '.azurecr.us', and the Trivy/cosign steps
          # below address the image by login server. Hardcoding the Commercial
          # suffix is what makes a "Gov build" silently scan/sign nothing.
          ACR_LOGIN=$(az acr show -n "$ACR" -g "$RG" --query loginServer -o tsv | tr -d '\r')
          if [[ -z "$ACR_LOGIN" ]]; then echo "::error::could not read the login server for $ACR"; exit 1; fi
          echo "acr_login_server=$ACR_LOGIN" >> "$GITHUB_OUTPUT"
          echo "::notice::boundary=$BOUNDARY acr=$ACR login=$ACR_LOGIN"
      - id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INPUT="${{ inputs.apps || 'all' }}"
          if [[ "$INPUT" == "all" ]]; then
            # loom-uat is deliberately NOT in "all": it is a ~2 GB Playwright
            # image whose only consumers are the loom-uat job and the default-ON
            # loom-synthetic-monitor job, so rebuilding it on every console push
            # would add ~10 min to each one for no benefit. It IS in the
            # from-scratch app phase (full-app-deploy-commercial.yml), and it can
            # be built on demand here with `apps: loom-uat`.
            APPS='[{"name":"loom-console","ctx":"./apps/fiab-console"},{"name":"loom-setup-orchestrator","ctx":"./apps/fiab-setup-orchestrator"},{"name":"loom-mcp","ctx":"./apps/fiab-mcp-config"},{"name":"loom-mcp-bridge","ctx":"./apps/fiab-mcp-bridge"},{"name":"loom-activator","ctx":"./apps/fiab-activator-engine"},{"name":"loom-mirroring","ctx":"./apps/fiab-mirroring-engine"},{"name":"loom-direct-lake-shim","ctx":"./apps/fiab-direct-lake-shim"},{"name":"loom-copilot-maf","ctx":"./apps/copilot-maf"},{"name":"loom-unity","ctx":"./apps/loom-unity"},{"name":"loom-migrate","ctx":"./apps/loom-migrate"},{"name":"loom-risingwave","ctx":"./apps/loom-risingwave"},{"name":"loom-trino","ctx":"./apps/loom-trino"},{"name":"loom-directlake","ctx":"./apps/loom-directlake"}]'
          elif [[ "$INPUT" == "loom-copilot-maf" ]]; then
            # MAF tier lives at ./apps/copilot-maf (not the ./apps/fiab-* convention).
            APPS='[{"name":"loom-copilot-maf","ctx":"./apps/copilot-maf"}]'
          else
            # Resolve each app to its build context. The ./apps/fiab-* convention
            # covers most images, but not all — loom-copilot-maf, loom-duckdb,
            # loom-transform-runner and loom-migrate live at ./apps/<name>. The old
            # jq-only mapping ALWAYS produced ./apps/fiab-<stem>, so asking this
            # workflow for one of those resolved to a directory that does not exist
            # and the only way to build them was full-app-deploy-commercial.yml,
            # which rebuilds and rolls the entire estate. Prefer a real directory;
            # fall back to the convention.
            APPS="[]"
            IFS="," read -ra REQ <<< "$INPUT"
            for APP in "${REQ[@]}"; do
              APP="$(echo "$APP" | tr -d '[:space:]')"
              [ -z "$APP" ] && continue
              FILE=""
              if [ "$APP" = "loom-uat" ]; then
                # The Playwright UAT / synthetic-journey runner is a SECOND image
                # out of the console context (Dockerfile.uat) — there is no
                # ./apps/loom-uat directory. It is what the default-ON
                # loom-synthetic-monitor job runs.
                CTX="./apps/fiab-console"
                FILE="./apps/fiab-console/Dockerfile.uat"
              elif [ -d "./apps/$APP" ]; then
                CTX="./apps/$APP"
              else
                # Legacy ./apps/fiab-* convention, with the handful of names whose
                # directory stem does not match the image name.
                case "$APP" in
                  loom-mcp)                 STEM=mcp-config ;;
                  loom-setup-orchestrator)  STEM=setup-orchestrator ;;
                  loom-activator)           STEM=activator-engine ;;
                  loom-mirroring)           STEM=mirroring-engine ;;
                  loom-direct-lake-shim)    STEM=direct-lake-shim ;;
                  *)                        STEM="${APP#loom-}" ;;
                esac
                CTX="./apps/fiab-$STEM"
              fi
              if [ ! -f "${FILE:-$CTX/Dockerfile}" ]; then
                echo "::error::no Dockerfile for '$APP' at ${FILE:-$CTX/Dockerfile} — check the app name."
                exit 1
              fi
              APPS=$(jq -c --arg n "$APP" --arg c "$CTX" --arg f "$FILE" \
                '. + [(if $f == "" then {name:$n, ctx:$c} else {name:$n, ctx:$c, file:$f} end)]' <<< "$APPS")
              echo "::notice::$APP -> $CTX (${FILE:-$CTX/Dockerfile})"
            done
          fi
          # ── CHANGED-APP PLAN (push to main only) ──────────────────────────────
          # A push builds only the apps whose inputs changed since the last
          # SUCCESSFUL push run; the rest are carried forward (re-tagged to this
          # SHA by the carry_forward job) so <app>:<sha> exists for every app and
          # the rolls never reference a missing tag. Dispatch and workflow_call
          # (github.workflow is the CALLER's name there) keep building exactly
          # what they asked for. FAIL CLOSED: any failure to compute the plan
          # builds ALL, loudly. Logic + tests: scripts/ci/plan-image-builds.mjs.
          CARRY='[]'
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_WORKFLOW" == "build-fiab-images-acr-tasks" && "$INPUT" == "all" ]]; then
            ERRF="${RUNNER_TEMP:-/tmp}/plan-base.err"
            BASE=""
            if ! BASE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-fiab-images-acr-tasks.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' 2>"$ERRF"); then
              echo "::warning::could not read the last successful push run ($(head -c 300 "$ERRF")) - the plan will fail closed to ALL."
              BASE=""
            fi
            PLAN=""
            if PLAN=$(node scripts/ci/plan-image-builds.mjs --matrix "$APPS" --sha "$GITHUB_SHA" --base "$BASE") \
               && jq -e '.build and .carry and .mode' <<< "$PLAN" > /dev/null; then
              BUILD_NAMES=$(jq -c '.build' <<< "$PLAN")
              CARRY=$(jq -c '.carry' <<< "$PLAN")
              APPS=$(jq -c --argjson b "$BUILD_NAMES" '[.[] | select(.name as $n | $b | index($n))]' <<< "$APPS")
            else
              echo "::warning::image build planner failed or returned an unusable plan - building ALL (fail closed)."
              CARRY='[]'
            fi
          else
            echo "::notice::changed-app plan not applied (event=$GITHUB_EVENT_NAME workflow=$GITHUB_WORKFLOW apps=$INPUT) - building exactly the requested set."
          fi
          {
            echo "carry_apps=$CARRY"
            echo "build_count=$(jq 'length' <<< "$APPS")"
            echo "matrix={\"include\":$APPS}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }} via ACR Tasks
    needs: [resolve, acr_enable, pool_acquire]
    # pool_acquire may be skipped (no pool app in this run) or FAIL (ARM). Either
    # way default-agent images must still build, so the job does not require
    # pool_acquire to succeed; a pool-routed leg checks its result in the build
    # step and fails LOUDLY itself. !cancelled() (not always()) so a cancelled
    # run does not start new builds.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.acr_enable.result == 'success' && needs.resolve.outputs.build_count != '0' }}
    runs-on: ubuntu-latest
    # A hung build must not hold billed pool agents indefinitely. The retry
    # harness caps the build at 110m wall-clock (the run poll gives up at 105m:
    # a measured default-agent queue + Rust compile was ~89m); 150m covers
    # checkout, scan and sign. On timeout the job fails and pool_release
    # (if: always()) still runs.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.app_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Azure login (Commercial)
        if: env.BOUNDARY == 'Commercial'
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }
      # GCC-High / IL5. Same SP set every other gov-* workflow uses, with the
      # sovereign ARM/AAD endpoints; `az cloud set` afterwards so every plain
      # `az` call later in the job (acr build, acr repository show, acr login)
      # targets the Government cloud too.
      - name: Azure login (Gov)
        if: env.BOUNDARY != 'Commercial'
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment
      - name: Set Azure cloud to Gov
        if: env.BOUNDARY != 'Commercial'
        run: az cloud set --name AzureUSGovernment

      - name: Stage Copilot RAG corpus (loom-console only)
        if: matrix.name == 'loom-console'
        shell: bash
        run: |
          # #2929 — WITHOUT THIS THE CONSOLE IMAGE SHIPS AN EMPTY COPILOT INDEX.
          # The corpus lives at repo-root docs/ + PRPs/, which are OUTSIDE the
          # apps/fiab-console build context, so the Dockerfile can only COPY what
          # this script stages into apps/fiab-console/copilot-corpus (that dir is
          # otherwise just a tracked .gitkeep). Until 2026-08-04 only
          # full-app-deploy-commercial.yml ran it, so every image built HERE — the
          # routine path — carried a corpus of exactly zero files, and
          # POST /api/help-copilot/reindex answered 502 "No corpus chunks
          # discovered" in ~160ms while the eval measured a stale index.
          # Enforced by scripts/ci/check-console-corpus-staged.mjs.
          bash scripts/csa-loom/stage-copilot-corpus.sh

      - name: Build + push via ACR Tasks
        run: |
          set -e
          TAG="${{ inputs.tag_override || 'v0.1' }}"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          ACR="${{ needs.resolve.outputs.acr_name }}"
          # v3.28: pass LOOM_BUILD_SHA + LOOM_BUILD_TIMESTAMP as build args
          # so the Dockerfile stamps /public/build-marker.txt with the actual
          # commit being built. deploy-validation reads this file and refuses
          # to declare success unless the SHA matches.
          # 2026-07-16: the console compile outgrew the DEFAULT ACR Task agent
          # (8 GB) — five consecutive builds were cgroup-OOM-SIGKILLed with no
          # code change (runs cjdq..cjdv). The console builds on a dedicated
          # 16 GB S3 pool (scaled 0↔1 around the build; proven on run cjdy).
          # Other app images stay on default agents.
          #
          # #2706 — the pool is `loombuild2`, NOT `loombuild`. boundary=GCC-High
          # and boundary=IL5 both resolve usgovvirginia with the AZURE_GOV_*
          # secret set, i.e. the SAME Gov registry whose original `loombuild`
          # pool has a backing queue stuck in "being deleted" (409): builds
          # submitted to it sit ~60min and `az acr build` exits 0 having pushed
          # NOTHING (runs 30552543683, 30558316496). #2938 moved gov-console-roll
          # + gov-build-images off it and MISSED this lane. One name across both
          # boundaries keeps every console builder on the same proven pool and
          # removes the branch that let this one silently inherit the dead queue;
          # the `show || create` below makes it self-healing on Commercial, where
          # the pool is simply created on first use.
          POOL="$BUILD_POOL_NAME"
          POOL_ARGS=""
          POOL_APPS=$(node "$GITHUB_WORKSPACE/scripts/ci/acr-build-pool.mjs" pool-apps --input "$POOL_APPS_INPUT" --default "$POOL_APPS_DEFAULT")
          case ",$POOL_APPS," in *",${{ matrix.name }},"*)
            # The pool is scaled up ONCE by the pool_acquire job (no per-leg
            # race). A pool app whose acquire did not succeed fails here, loudly,
            # instead of queueing on a pool at count 0.
            if [ "${{ needs.pool_acquire.result }}" != "success" ]; then
              echo "::error::${{ matrix.name }} is routed to pool $POOL but pool_acquire result was '${{ needs.pool_acquire.result }}', so the pool is not known to be scaled up. Failing this image; default-agent images are unaffected. Re-run, or dispatch with pool_apps=none to build it on default agents."
              exit 1
            fi
            POOL_ARGS="--agent-pool $POOL"
            echo "::notice::#2706 - building ${{ matrix.name }} on ACR agent pool: $POOL (boundary=$BOUNDARY; scale-down is the pool_release job)"
            ;;
          esac
          # loom-uat carries the Playwright specs, but apps/fiab-console/.dockerignore
          # excludes e2e/ + tests/ to keep the CONSOLE image lean — and ACR Tasks
          # does not honour a per-Dockerfile <Dockerfile>.dockerignore. Drop those
          # two exclusions for this build only. Each matrix job has its own
          # disposable checkout, so this cannot leak into the console image.
          if [ "${{ matrix.name }}" = "loom-uat" ]; then
            grep -vxE 'e2e|tests' apps/fiab-console/.dockerignore > /tmp/di && mv /tmp/di apps/fiab-console/.dockerignore
            echo "::notice::loom-uat build — e2e/ + tests/ un-ignored for this context"
          fi
          # RETRY WITH CLASSIFICATION (#3212, deploy-integrity R6). This ran BARE
          # on the ONLY producer of every app image, so one dropped TCP
          # connection failed the build outright. Measured on run 31460135118:
          #     ERROR: ('Connection aborted.', ConnectionResetError(104, 'Connection reset by peer'))
          # loom-unity's build died mid-upload, the roll for that SHA reported
          # `skipped`, and the Commercial estate sat a commit behind main until a
          # human re-ran it. R6 names that case explicitly: retry what is
          # genuinely transient, with bounded backoff, and fail closed on
          # exhaustion.
          #
          # deploy-retry.mjs is the repo's retry primitive and its own header
          # says it replaces exactly this shape -- it had simply never been
          # adopted here. It retries ONLY the classes named in --class-allow, so
          # a QuotaExceeded or an OOM-killed compile still fails on attempt 1
          # rather than burning three attempts and then reporting a less accurate
          # error. An unclassifiable failure fails closed.
          # THE VERDICT IS THE ACR RUN STATUS, NOT THE LOG STREAM. `az acr build`
          # streams the task log over a SAS that expires ~70 min after submission.
          # Run 39634317953: loom-directlake queued 52 min, SUCCEEDED and pushed
          # :v0.1, but the stream died with AuthenticationFailed, the step went red
          # and the Trivy gate + cosign signing were SKIPPED on an already-pushed
          # image.
          #
          # SUBMIT_MODE=poll (default): `submit` queues the run (--no-wait) UNDER
          # deploy-retry.mjs - a failure there happened before any ACR run
          # existed, so a retry cannot duplicate a build. `wait` then runs
          # OUTSIDE the retry harness: once a run id exists the outcome is final
          # for this job (a re-submit would race the first run, which can still
          # push :v0.1). It polls `az acr task show-run`, streams logs
          # best-effort, and CANCELS the run on a poll limit / cancel / error.
          # SUBMIT_MODE=legacy: the previous bare `az acr build` (log stream is
          # the verdict) under the same retry harness - the rollback switch.
          BUILD_ARGS=(--registry "$ACR" $POOL_ARGS \
            --image "${{ matrix.name }}:${TAG}" \
            --image "${{ matrix.name }}:${{ github.sha }}" \
            --image "${{ matrix.name }}:latest" \
            --file "${{ matrix.file || format('{0}/Dockerfile', matrix.ctx) }}" \
            --build-arg "LOOM_BUILD_SHA=${{ github.sha }}" \
            --build-arg "LOOM_BUILD_TIMESTAMP=${STAMP}" \
            "${{ matrix.ctx }}")
          if [ "$SUBMIT_MODE" = "legacy" ]; then
            node "$GITHUB_WORKSPACE/scripts/ci/deploy-retry.mjs" \
              --class-allow transient \
              --max-attempts 3 --backoff 45 --jitter 0.3 --wall-clock 90m \
              --step "az acr build (${{ matrix.name }})" \
              --artifact "$GITHUB_WORKSPACE/deploy-failure.json" \
              -- az acr build "${BUILD_ARGS[@]}"
          else
            RUN_FILE="${RUNNER_TEMP:-/tmp}/acr-run-id-${{ matrix.name }}"
            rm -f "$RUN_FILE"
            node "$GITHUB_WORKSPACE/scripts/ci/deploy-retry.mjs" \
              --class-allow transient \
              --max-attempts 3 --backoff 45 --jitter 0.3 --wall-clock 30m \
              --step "az acr build submit (${{ matrix.name }})" \
              --artifact "$GITHUB_WORKSPACE/deploy-failure.json" \
              -- node "$GITHUB_WORKSPACE/scripts/ci/acr-build-run.mjs" submit \
              --run-file "$RUN_FILE" -- "${BUILD_ARGS[@]}"
            RUN_ID=$(tr -d '\r\n' < "$RUN_FILE")
            node "$GITHUB_WORKSPACE/scripts/ci/acr-build-run.mjs" wait \
              --registry "$ACR" --run-id "$RUN_ID" --max-minutes 105 --poll-seconds 30
          fi
          echo "::notice::Built ${{ matrix.name }}:${TAG} via ACR Tasks (sha=${{ github.sha }})"
          # Export coordinates for the SC1 scan/sign steps below.
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "ACR_NAME=$ACR" >> "$GITHUB_ENV"
          echo "ACR_LOGIN_SERVER=${{ needs.resolve.outputs.acr_login_server }}" >> "$GITHUB_ENV"
          # No in-step scale-down: a line in this shell is skipped by a failed
          # build, a cancel or a timeout (the 2026-10-19 leak). The final
          # pool_release job (if: always()) owns it and reads the count back.

      # Ported from gov-provision-runner-images.yml (#3416) to this lane (#4461):
      # this is THE producer of every production app image, Commercial and Gov
      # both, and it had no equivalent — a failed `az acr build` here gave the
      # operator only the generic client-side pointer (RunStatus.FAILED), never
      # the task's own log, so a firewall denial and a genuine Dockerfile break
      # were indistinguishable without a manual `az acr task logs` pull. This
      # step is purely diagnostic: it prints the redacted task log for a human
      # to read. It does NOT re-run deploy-retry.mjs's classification or change
      # the retry/exit-code decision already made above — see the failure-
      # taxonomy.json entry for `defect.acr-task-run-failed` (#4461) for the
      # precedence fix that keeps a firewall-denial log from being outranked by
      # the generic RunStatus text once both are visible to a human reading it.
      - name: Diagnose a failed ACR build — fetch the task run log (#3416, #4461)
        if: failure()
        env:
          # The build step above resolves ACR into a LOCAL shell variable
          # (`ACR="${{ needs.resolve.outputs.acr_name }}"`, line ~379) and never
          # exports it to $GITHUB_ENV — it only exports ACR_LOGIN_SERVER, and
          # only on the SUCCESS path. A separate step's shell does not inherit
          # another step's local variables, so this step read the job output
          # directly instead (independent review on #4920 caught this: without
          # it, $ACR was always empty here and every failure silently took the
          # "no registry name" branch, never fetching the log).
          ACR: ${{ needs.resolve.outputs.acr_name }}
          ART: ${{ github.workspace }}/deploy-failure.json
        run: |
          set -uo pipefail

          # Same unbound-variable guard as the ported step: this is `if:
          # failure()`, so it also runs when an earlier step in this job (ACR
          # login, boundary resolve) failed before $ACR was ever set.
          ACR="${ACR:-}"
          if [ -z "$ACR" ]; then
            echo "::warning::No registry name is set on this runner, so this run failed at or before the registry was resolved — i.e. before any ACR build was attempted. There is no task log to fetch and none is claimed to exist. This says WHERE the run stopped, not anything about an image build: the cause is in the failing step above."
            exit 0
          fi

          RUN_IDS=""

          # 1. The authoritative source. deploy-retry.mjs writes the child
          #    command's full stderr to a file and names that file in the
          #    artifact as .stderrPath, on exactly the path taken here (the
          #    write happens in the `if (!decision.retry)` branch, before the
          #    unclassified-exit). az prints the run id inside its own error.
          if [ -f "$ART" ]; then
            STDERR_PATH=$(jq -r ".stderrPath // empty" "$ART")
            RC=$?
            if [ "$RC" != "0" ]; then
              echo "::warning::Could not read $ART with jq (exit $RC). That is a statement about THIS file, not about the build. Falling back to the registry run list below."
              STDERR_PATH=""
            fi
            if [ -n "$STDERR_PATH" ] && [ -f "$STDERR_PATH" ]; then
              RUN_IDS=$(grep -oE "run with ID .[A-Za-z0-9_-]+" "$STDERR_PATH" | grep -oE "[A-Za-z0-9_-]+$" | sort -u | tr "\n" " ")
              if [ -z "$RUN_IDS" ]; then
                echo "::warning::The captured stderr exists but names no ACR run id, so this build did not fail inside an ACR task run — it failed before one was queued (auth, firewall, context upload). The stderr is already printed in full by the build step above; nothing further to fetch."
              fi
            elif [ -n "$STDERR_PATH" ]; then
              echo "::warning::The artifact names a captured-stderr file that is not present on this runner. No run id could be extracted; falling back to the registry run list below."
            fi
          else
            echo "::warning::No $ART on this runner, so the failure did not come through deploy-retry.mjs. Falling back to the registry run list below."
          fi

          # 2. Fallback. The registry knows its own recent failures. This does
          #    NOT assert which of them is ours — saying so is the whole point
          #    (R7): a run listed here may belong to another lane sharing this
          #    registry.
          if [ -z "$RUN_IDS" ]; then
            echo "::notice::Listing the registry's own recent FAILED task runs. This lane does NOT claim any of these is the build that just failed — it is a starting point, not an identification."
            az acr task list-runs -r "$ACR" --run-status Failed --top 5 -o table
            RC=$?
            if [ "$RC" != "0" ]; then
              echo "::error::Could not list failed task runs on $ACR (az exit $RC, output above). The build failure therefore remains undiagnosed from inside this run — read it manually with: az acr task logs -r $ACR --run-id <id>"
            fi
            exit 0
          fi

          echo "::notice::Fetching the ACR task log for run id(s): $RUN_IDS (matrix: ${{ matrix.name }})"
          for ID in $RUN_IDS; do
            LOG="${RUNNER_TEMP:-/tmp}/acr-task-$ID.log"
            az acr task logs -r "$ACR" --run-id "$ID" > "$LOG"
            RC=$?
            if [ "$RC" != "0" ]; then
              echo "::error::az acr task logs -r $ACR --run-id $ID exited $RC, so the build output could NOT be retrieved. This is not evidence about the build; it is evidence the log fetch failed. Retry it manually."
              continue
            fi
            if [ ! -s "$LOG" ]; then
              echo "::warning::The ACR task log for run $ID came back EMPTY. The registry answered, so this is not a fetch failure — the task produced no log, which usually means it never started (agent pool, quota, or a rejected context)."
              continue
            fi
            echo "───── ACR task log: run $ID, image ${{ matrix.name }} (redacted) ─────"
            node -e "const fs=require('fs');import('./scripts/ci/_azure-redact.mjs').then(m=>process.stdout.write(m.redact(fs.readFileSync(process.argv[1],'utf8')))).catch(e=>{console.error(String(e&&e.message||e));process.exit(9);});" "$LOG"
            RC=$?
            if [ "$RC" != "0" ]; then
              echo "::error::The ACR task log for run $ID was fetched but the redactor could not be loaded (exit $RC), so it is deliberately NOT printed — this repository is public and an unredacted Azure log is a publication surface. It is on this runner at $LOG; re-read it with: az acr task logs -r $ACR --run-id $ID"
              continue
            fi
            echo "──────────────────────────────────────────"
            echo "::notice::The lines above are the ACTUAL build failure for $ID. If the taxonomy still could not classify it, add the signal to apps/fiab-console/lib/deploy/failure-taxonomy.json using them."
          done

      # ── SC1: supply-chain gate — Trivy CRITICAL scan + keyless cosign sign ──
      # The ACR data plane is OPEN at this point (acr_enable ran before the
      # build matrix and acr_restore only runs after it), so the runner can
      # pull the just-pushed image to scan it and push the signature artifact.
      - name: Resolve supply-chain gate + image digest
        id: sc
        run: |
          set -e
          SKIP="false"
          if [[ "${{ inputs.skip_supply_chain }}" == "true" || "${{ vars.LOOM_BUILD_SKIP_SUPPLY_CHAIN }}" == "true" ]]; then
            SKIP="true"
            echo "::warning::skip_supply_chain/LOOM_BUILD_SKIP_SUPPLY_CHAIN is set — SKIPPING the Trivy CRITICAL gate AND cosign signing for ${{ matrix.name }}. This image is UNSIGNED and will be rejected by the roll verification gates unless their skip valves are also used."
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          if [[ "$SKIP" == "true" ]]; then exit 0; fi
          # Authenticate docker (Trivy + cosign both read ~/.docker/config.json).
          # Via the retry helper (#3230): the AAD→ACR token exchange fails
          # transiently with CONNECTIVITY_REFRESH_TOKEN_ERROR / 403 for a window
          # after the firewall opens, and a bare login turns that into a red
          # build. The helper retries ONLY that named set and fails closed.
          bash scripts/ci/acr-login-retry.sh --acr "$ACR_NAME"
          DIGEST=$(az acr repository show --name "$ACR_NAME" --image "${{ matrix.name }}:${{ github.sha }}" --query digest -o tsv | tr -d '\r')
          if [[ -z "$DIGEST" ]]; then
            echo "::error::Could not resolve the manifest digest for ${{ matrix.name }}:${{ github.sha }} — cannot scan/sign. The image build reported success but the manifest is unreadable."
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "::notice::${{ matrix.name }}:${{ github.sha }} → $DIGEST"

      - name: Trivy gate — fail on CRITICAL CVEs (pushed image)
        id: trivy
        if: steps.sc.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # Vulnerability gating ONLY: trivy's secret scanner on minified Next.js
          # bundles flags UI placeholder strings (e.g. the GCS shortcut wizard's
          # example service-account JSON) as credentials — a known FP class.
          # Secret hygiene is covered by the repo Secret Scan lane on source.
          scanners: vuln
          # Reviewed baseline of base-image/vendored CVEs with burn-down notes.
          trivyignores: .trivyignore
          format: table

      # #4464 — `az acr build` pushes server-side BEFORE this gate runs (there is
      # no `--no-push`), so a red Trivy gate used to leave a CRITICAL-flagged
      # image live and pullable under 3 mutable tags, :latest included. This
      # does not make the push atomic with the scan (the smaller, safer fix the
      # issue asked for) — it UNTAGS what was just pushed the moment the gate
      # refuses it, so the registry stops serving the flagged image under any
      # name a caller would reasonably pull. Untag, not delete-manifest: a tag
      # can share a digest with an earlier, clean build, and untagging only
      # removes THIS build's pointer to it.
      - name: Delete the pushed tags the Trivy gate just refused (#4464)
        if: failure() && steps.trivy.outcome == 'failure'
        run: |
          set -uo pipefail
          FAILED_UNTAG=0
          for T in "$IMAGE_TAG" "${{ github.sha }}" "latest"; do
            echo "::warning::Trivy CRITICAL gate failed for ${{ matrix.name }}:$T -- untagging it so the registry stops serving a flagged image under a mutable tag."
            if az acr repository untag --name "$ACR_NAME" --image "${{ matrix.name }}:$T"; then
              echo "::notice::${{ matrix.name }}:$T untagged."
            else
              echo "::error::Could not untag ${{ matrix.name }}:$T -- it may still be pullable. Remove it manually: az acr repository untag --name $ACR_NAME --image ${{ matrix.name }}:$T"
              FAILED_UNTAG=1
            fi
          done
          exit $FAILED_UNTAG

      - name: Install cosign
        if: steps.sc.outputs.skip != 'true'
        # PIN THE CLI. cosign-installer v4 defaults to Cosign v3.0.5 — a MAJOR
        # upgrade of the tool that signs every image this repo ships. Every
        # workflow that runs `cosign sign` / `cosign verify` is DISPATCH-ONLY, so
        # PR CI never exercises it: a green PR proves nothing about signing, and
        # the failure mode that matters is an image that signs fine and fails
        # `verify` AT ROLL TIME, which stops deploys (deploy-integrity R1).
        # Upstream discourages pinning "unless you have a specific reason";
        # not silently changing the signature format on a path CI cannot run is
        # a specific reason. Cosign v3 gets its own change, with a real receipt.
        # RETRY THE DOWNLOAD (#4156). This used to be a bare
        # `sigstore/cosign-installer` step: a single-attempt binary fetch from
        # github.com whose only failure mode is to fail the job. On 2026-08-28 a TCP
        # reset during it (`curl: (35) Recv failure`) reverted a HEALTHY image on a
        # P0 roll -- run 33138606218, whose only two `##[error]` lines were that curl
        # failure and its exit code. The roll never reached a gate, so NOTHING was
        # verified; that is a different statement from a signature failing, and the
        # helper's messages keep the two distinguishable (deploy-integrity R7).
        # The helper retries the fetch, verifies the binary against the release's
        # cosign_checksums.txt, and fails closed. Enforced at all 7 sites by
        # scripts/ci/check-cosign-install-retry-adoption.mjs.
        run: bash scripts/ci/cosign-install-retry.sh --version v2.6.1

      - name: Cosign sign (keyless OIDC)
        if: steps.sc.outputs.skip != 'true'
        run: |
          set -e
          REF="${ACR_LOGIN_SERVER}/${{ matrix.name }}@${{ steps.sc.outputs.digest }}"
          echo "Signing $REF keylessly (GitHub Actions OIDC → Fulcio/Rekor) ..."
          # BOUNDED RETRY AT THE STEP LEVEL, and it must be at THIS level (R6).
          #
          # cosign has its own internal retry, and on run 31496454872 that
          # internal retry is what turned a transient into a failure:
          #
          #   13:36:32  error fetching GitHub OIDC token (will retry):
          #             … net/http: TLS handshake timeout
          #   13:41:35  Error: … getting key from Fulcio: retrieving cert:
          #             error obtaining token: expired_token
          #
          # It retried for five minutes against a token with a short lifetime, so
          # the terminal error class MUTATED from a network timeout into
          # `expired_token` — which reads like a credential problem and is not
          # one. Re-invoking `cosign sign` fresh re-requests a NEW OIDC token
          # from ACTIONS_ID_TOKEN_REQUEST_URL; cosign's internal retry cannot,
          # because it is still holding the old one.
          #
          # Fails closed after 3 attempts: an image that cannot be signed stays
          # unsigned and the roll gates reject it. The retry can fail.
          bash scripts/ci/cosign-sign-retry.sh --ref "$REF"
          echo "::notice::Signed $REF (signature stored in ACR alongside the image; verified at roll time by loom-roll-and-validate / gov-console-roll / full-app-deploy-commercial)."

  # v3.41: toggle ACR publicNetworkAccess so `az acr build` can upload the
  # source tarball from the GHA runner. The ACR is provisioned with
  # publicNetworkAccess=Disabled by default (private endpoint), which was
  # blocking every build with "client with IP ... is not allowed access".
  #
  # #2603: the open is now a LEASE ACQUISITION, not a bare toggle. The lease is
  # recorded as ARM tags on the registry and names this run; only this run may
  # re-lock. If another run legitimately holds it (a Gov roll, a human's
  # deploy-*-job.sh), this job waits — bounded, 25 min by default — and then
  # fails loudly naming the holder rather than stomping on it.
  # ONE scale-up for the whole run. Both pool-routed build legs used to scale
  # the pool themselves at the same instant (show + update --count N), so a
  # concurrent-update 409 from ARM could fail an image. This job scales once,
  # tolerates an in-progress update by re-reading the count (bounded retry in
  # acr-build-pool.mjs acquire), reads it back, and fails loudly if the pool
  # never reaches the wanted count.
  pool_acquire:
    name: Scale build pool up (read back)
    needs: [resolve, acr_enable]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.acr_enable.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Azure login (Commercial)
        if: env.BOUNDARY == 'Commercial'
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }
      - name: Azure login (Gov)
        if: env.BOUNDARY != 'Commercial'
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment
      - name: Set Azure cloud to Gov
        if: env.BOUNDARY != 'Commercial'
        run: az cloud set --name AzureUSGovernment
      - name: Scale the build pool up and read the count back
        env:
          ACR: ${{ needs.resolve.outputs.acr_name }}
          MATRIX: ${{ needs.resolve.outputs.app_matrix }}
        run: |
          set -uo pipefail
          POOL_APPS=$(node scripts/ci/acr-build-pool.mjs pool-apps --input "$POOL_APPS_INPUT" --default "$POOL_APPS_DEFAULT") || exit 1
          NEED=$(jq -r --arg a ",$POOL_APPS," '[.include[].name | select($a | contains("," + . + ","))] | length' <<< "$MATRIX")
          if [ "${NEED:-0}" = "0" ]; then
            echo "No app in this run is routed to the pool (pool apps: ${POOL_APPS:-none}); pool left untouched."
            exit 0
          fi
          WANT=$(node scripts/ci/acr-build-pool.mjs clamp "$POOL_AGENT_COUNT")
          node scripts/ci/acr-build-pool.mjs acquire --acr "$ACR" --pool "$BUILD_POOL_NAME" --count "$WANT"

  acr_enable:
    name: Acquire ACR firewall lease + open (temp)
    needs: resolve
    runs-on: ubuntu-latest
    # ACR_LEASE_STATE MUST CROSS THE JOB BOUNDARY (#3676).
    #
    # acr-firewall-lease.sh keeps `ACR_LEASE_STATE` so that `release` can tell
    # "I held this and lost it" from "I never had it". Acquire and release are
    # SEPARATE JOBS here, on separate runners, so that variable was always back
    # at its default by release time and the distinction did not exist. On
    # 2026-08-17 run 32004290228 acquired the lease at 07:11:16 with a 120-minute
    # TTL and its own release step at 07:35:07 reported the recorded owner as
    # 'none' — the lease had been ERASED by a concurrent `az deployment sub
    # create` re-rendering the registry resource — and the log had no way to say
    # so. It read like ordinary tidy-up while five of six images had just failed
    # to push. Carrying the state forward is what lets the release name it.
    outputs:
      lease_state: ${{ steps.acquire.outputs.lease_state }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Azure login (Commercial)
        if: env.BOUNDARY == 'Commercial'
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }
      # GCC-High / IL5. Same SP set every other gov-* workflow uses, with the
      # sovereign ARM/AAD endpoints; `az cloud set` afterwards so every plain
      # `az` call later in the job (acr build, acr repository show, acr login)
      # targets the Government cloud too.
      - name: Azure login (Gov)
        if: env.BOUNDARY != 'Commercial'
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment
      - name: Set Azure cloud to Gov
        if: env.BOUNDARY != 'Commercial'
        run: az cloud set --name AzureUSGovernment
      - name: Acquire the ACR firewall lease (opens the registry)
        id: acquire
        run: |
          set -uo pipefail
          # The script writes `lease_state=<state>` straight to $GITHUB_OUTPUT.
          # It is NOT re-derived here, and that is deliberate: this step used to
          # read `${ACR_LEASE_STATE:-none}` from its own shell after invoking the
          # script as a CHILD, which always expanded to `none` and made the whole
          # hand-off inert (measured — the lease was HELD, the output said
          # `none`). A step's outputs are collected from the file at step end, so
          # the child's append is what publishes the truth.
          bash scripts/csa-loom/acr-firewall-lease.sh acquire \
            --acr "${{ needs.resolve.outputs.acr_name }}"

  # Unchanged apps on a push: re-tag the digest already behind <app>:<TAG> to
  # <app>:<sha> so every roll that addresses <app>:<head_sha> finds it. The
  # manifest is COPIED, not rebuilt: same digest, so the Trivy result and the
  # cosign signature (stored against the digest) carry over untouched.
  # FAILS CLOSED: a missing source tag or a digest that differs after the copy
  # fails this job loudly - it never reports a tag it did not verify (R7).
  carry_forward:
    name: Carry forward unchanged images (re-tag to this SHA)
    needs: [resolve, acr_enable]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.acr_enable.result == 'success' && needs.resolve.outputs.carry_apps != '' && needs.resolve.outputs.carry_apps != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Azure login (Commercial)
        if: env.BOUNDARY == 'Commercial'
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }
      - name: Azure login (Gov)
        if: env.BOUNDARY != 'Commercial'
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment
      - name: Set Azure cloud to Gov
        if: env.BOUNDARY != 'Commercial'
        run: az cloud set --name AzureUSGovernment
      - name: Re-tag each unchanged image to the new SHA and verify the digest
        env:
          ACR: ${{ needs.resolve.outputs.acr_name }}
          LOGIN: ${{ needs.resolve.outputs.acr_login_server }}
          CARRY: ${{ needs.resolve.outputs.carry_apps }}
          SRC_TAG: ${{ inputs.tag_override || 'v0.1' }}
        run: |
          set -uo pipefail
          bash scripts/ci/acr-login-retry.sh --acr "$ACR" || exit 1
          FAILED=0
          for APP in $(jq -r '.[]' <<< "$CARRY"); do
            SRC=$(bash scripts/ci/resolve-acr-digest.sh --acr "$ACR" --image "$APP:$SRC_TAG")
            RC=$?
            if [ "$RC" != "0" ] || [ -z "$SRC" ]; then
              echo "::error::$APP: could not read $APP:$SRC_TAG (resolver exit $RC; 3 = registry answered and the tag is absent, 4 = could not be read). Nothing was re-tagged for $APP. Dispatch this workflow with apps=$APP to build it."
              FAILED=1; continue
            fi
            if ! docker buildx imagetools create --tag "$LOGIN/$APP:${{ github.sha }}" "$LOGIN/$APP:$SRC_TAG"; then
              echo "::error::$APP: imagetools create failed re-tagging $APP:$SRC_TAG to $APP:${{ github.sha }} (output above). Dispatch with apps=$APP to build it."
              FAILED=1; continue
            fi
            DST=$(bash scripts/ci/resolve-acr-digest.sh --acr "$ACR" --image "$APP:${{ github.sha }}")
            RC=$?
            if [ "$RC" != "0" ] || [ "$DST" != "$SRC" ]; then
              echo "::error::$APP: after the re-tag, $APP:${{ github.sha }} reads '${DST}' (resolver exit $RC) but $APP:$SRC_TAG is '$SRC'. The new tag is NOT verified; do not roll it."
              FAILED=1; continue
            fi
            echo "::notice::$APP: carried forward $SRC_TAG to ${{ github.sha }} ($SRC)"
          done
          exit $FAILED

  acr_restore:
    name: Release ACR firewall lease (re-lock if still the holder)
    needs: [resolve, build, acr_enable, carry_forward]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Azure login (Commercial)
        if: env.BOUNDARY == 'Commercial'
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }
      # GCC-High / IL5. Same SP set every other gov-* workflow uses, with the
      # sovereign ARM/AAD endpoints; `az cloud set` afterwards so every plain
      # `az` call later in the job (acr build, acr repository show, acr login)
      # targets the Government cloud too.
      - name: Azure login (Gov)
        if: env.BOUNDARY != 'Commercial'
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment
      - name: Set Azure cloud to Gov
        if: env.BOUNDARY != 'Commercial'
        run: az cloud set --name AzureUSGovernment
      # #2603: THE fix. This job also runs when the workflow is CANCELLED, and
      # by then GitHub may already have started the next run — which is why the
      # old unconditional `az acr update --default-action Deny` killed a healthy
      # 14-minute build at its push step. `release` re-reads the lease owner and
      # re-locks ONLY if this run still holds it. If another run holds it, the
      # registry is left open for them (they release it; the scheduled
      # acr-firewall-sweeper re-locks if they die). If NOBODY holds it, this
      # re-locks anyway — never leave a registry publicly reachable.
      # ACR_LEASE_STATE comes from acr_enable's output (#3676) so this job knows
      # whether it EVER held the lease. Without it the script cannot distinguish
      # "the lease was taken from me" from "I never had one", and it emits
      # ordinary tidy-up wording over an incident. `build` failing does not skip
      # this job (`if: always()` above), and acr_enable failing yields an empty
      # output, which resolves to 'none' — the same conservative default as
      # before. The holder id is NOT carried: it derives identically in both
      # jobs of one run, and setting LOOM_ACR_LEASE_OWNER here would override
      # that derivation rather than confirm it.
      - name: Release the ACR firewall lease
        env:
          ACR_LEASE_STATE: ${{ needs.acr_enable.outputs.lease_state || 'none' }}
        run: |
          bash scripts/csa-loom/acr-firewall-lease.sh release \
            --acr "${{ needs.resolve.outputs.acr_name }}"

  # Guaranteed scale-down of the build pool. Runs on success, failure, cancel
  # and build timeout (always()); needs EVERY job that can scale the pool up.
  # It reads the count back and FAILS the run if the pool is still billing.
  # It will not kill in-flight work from another lane (queue or active runs on
  # the pool): it says so and leaves it to acr-agentpool-reaper.yml.
  pool_release:
    name: Scale build pool to 0 (read back)
    needs: [resolve, acr_enable, pool_acquire, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Azure login (Commercial)
        if: env.BOUNDARY == 'Commercial'
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }
      - name: Azure login (Gov)
        if: env.BOUNDARY != 'Commercial'
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment
      - name: Set Azure cloud to Gov
        if: env.BOUNDARY != 'Commercial'
        run: az cloud set --name AzureUSGovernment
      - name: Scale the build pool to 0 and read the count back
        env:
          ACR: ${{ needs.resolve.outputs.acr_name }}
        run: |
          if [ -z "$ACR" ]; then
            echo "::warning::resolve produced no registry name, so no build job could have scaled a pool. Nothing to release."
            exit 0
          fi
          node scripts/ci/acr-build-pool.mjs release --acr "$ACR" --pool "$BUILD_POOL_NAME"
