name: deploy-staleness

# "merged ≠ deployed" watchdog (#2775), extended 2026-08-05 to cover the LIVE
# ESTATE and FAILING/DISABLED deploy paths.
#
# #2775: the #2643 Gov authorization fix merged 2026-07-31 while the
# dispatch-only workflow that APPLIES it last ran 2026-07-15 — so the exposure
# stayed live behind an all-green wall: code on main, tests passing, guardrails
# passing, PR closed, issue closed. Nothing asserted that a deploy workflow had
# actually run since its own code changed.
#
# 2026-08-05, the operator: "I have been looking at unchanged gates for two
# weeks while PRs merged green, because nothing surfaces 'the estate is N
# commits behind' or 'the last infra deploy failed'." Both were true and
# neither was visible:
#   - deploy-fiab-commercial.yml (the ONLY lane that applies main.bicep to
#     Commercial) had 8 consecutive failed nightlies AND was switched off, so
#     every merged bicep change was inert;
#   - full-app-deploy-commercial.yml (the app-image build + Container App roll)
#     had failed 6 times running since its last success on 2026-06-19 and was
#     not watched at all;
#   - and the check never looked at what was actually serving traffic.
# The check now compares the live /build-marker.txt sha against main, reports
# consecutive-failure streaks, and reports a disabled workflow as disabled.
#
# It is READ-ONLY — it never dispatches a deploy, because deciding to start a
# production deploy is an operator call, not a CI side effect. It only makes the
# drift visible.
#
# Deliberately NOT a required PR check: staleness is a property of the ESTATE,
# not of a pull request, and blocking unrelated PRs on it would train people to
# ignore it (the failure mode this whole class is about). Visibility comes from
# the DAILY schedule, the job summary below, and the /admin/readiness banner the
# operator actually looks at (/api/admin/deploy-status).

on:
  schedule:
    # DAILY, not weekly. Weekly was the cadence while this only watched
    # dispatch-only Gov lanes where a fortnight of lag is ordinary. It now also
    # watches a daily reconcile and the live estate, where a week of silence is
    # the whole problem being solved. 13:47 UTC — off the hour so it does not
    # pile onto the top-of-hour scheduler surge.
    - cron: '47 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read     # required: the check reads workflow RUN history via gh.

jobs:
  staleness:
    name: Deploy staleness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history — the check compares commit dates)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      # The verdict is written to the RUN SUMMARY as well as the log. A control
      # whose output is buried twelve steps into a log is a control nobody
      # reads, which is the failure mode this lane exists to prevent — so the
      # answer renders on the run page itself. `tee` keeps the log copy; the
      # step still fails on a non-zero exit because the pipe is not swallowed
      # (pipefail is on by default for `run:` under bash -eo pipefail).
      - name: Check the live estate + every watched deploy path
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '## Deploy staleness — live estate vs main'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci/check-deploy-staleness.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Close the summary code fence
        if: always()
        run: |
          {
            echo '```'
            echo
            echo 'A merged fix is not a deployed fix. See `/admin/readiness` in the Console for the'
            echo 'same verdict in-product (`GET /api/admin/deploy-status`).'
          } >> "$GITHUB_STEP_SUMMARY"
