name: gov-bff-verify

# Minted-session BFF verification of the Gov console's governance backends —
# the non-interactive analog of the browser walk (the Gov MSAL sign-in needs a
# human; this proves the same BFF routes the browser calls return REAL data).
#
#   • /api/catalog/metastores   → Unity Catalog path (OSS loom-unity in Gov)
#   • /api/governance/catalog   → Purview-backed governance catalog
#   • /api/admin/domains/purview-status → Purview wiring status (admin-gated)
#
# Mints the same encrypted loom_session cookie the browser carries (session
# crypto + SESSION_SECRET from the console app's own secret store), so every
# probe exercises the full session → BFF → Azure backend path. Fails when a
# route reports a config gate for a backend this repo has wired (UC/Purview).
#
# Each probe is scoped to ITS OWN subsystem's response fields (#3842): these
# routes return several backends' state in one envelope, and a single
# cross-cutting matcher could — and did — fail a probe for a finding belonging
# to a different backend than its label names. See the probe table below.
#
# ── NOW RUNS AFTER EVERY GOV ROLL (#3730) ──────────────────────────────────
# Same reasoning as gov-gates.yml: Commercial's roll validates what it shipped in
# the same run, Gov's verification lanes existed but nothing triggered them — this
# one last succeeded 2026-07-24, twenty-five days before #3730. Now every
# successful gov-console-roll is followed by a real minted-session BFF probe of
# the image it just shipped.
#
# SAFE TO AUTO-TRIGGER because this workflow takes NO inputs (`workflow_dispatch: {}`),
# so there is no dispatch `default:` to silently become the empty string on a
# non-dispatch trigger.
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ['gov-console-roll']
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  RG: rg-csa-loom-admin-usgovvirginia
  APP: loom-console
  BASE: https://loom-console-dcmt6cqoezlgs-agg6h9e5cjamh5h2.z01.azurefd.us

jobs:
  verify:
    name: Minted-session BFF probes (Gov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only verify a roll that actually shipped — a failed roll has already
    # reported itself, and probing after it would grade the PREVIOUS image while
    # attributing the result to the new commit's run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # This job ran WITHOUT a checkout until 2026-08-21. Every step used `az`
      # or node `fetch`, so nothing needed the repo on disk — until "Resolve
      # automation identity" was added by 416e64a4 (#3395) on 2026-08-13 and
      # invoked `scripts/ci/resolve-automation-oid.mjs` from an empty
      # workspace. It has failed on `Cannot find module` for 22 consecutive
      # runs since 049349a9 (#3745) gave Gov its workflow_run trigger, i.e.
      # every Gov roll since 2026-08-18. Last green: 3640b36a on 2026-07-24,
      # before that step existed. Not a required context, so nothing surfaced it.
      #
      # The count was re-measured 2026-08-22 (`gh run list --limit 30`): the
      # streak runs 049349a9 → 6ae714ce and is bounded BELOW by a success, so it
      # is complete rather than truncated by the page size. An earlier revision
      # of this comment said 18; that was stale, and a saturated `--limit` is
      # exactly how such a count goes wrong, hence the bound is stated here.
      #
      # NOTE: actionlint CANNOT catch this class — `main` lints clean with the
      # checkout missing. Only the run log shows it.
      #
      # DO NOT add `ref:` here. This job runs on `workflow_run` and holds Gov
      # secrets; `ref: ${{ github.event.workflow_run.head_sha }}` would make it
      # execute checked-out code from an arbitrary triggering commit alongside
      # those secrets. The default ref (the base branch) is the safe one, and
      # the 5 sibling workflows that invoke this same script all rely on it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Azure login (Gov sub) — deploy SP
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment

      - name: Set Azure cloud to Gov
        run: az cloud set --name AzureUSGovernment

      - name: Fetch SESSION_SECRET (never printed)
        run: |
          set -euo pipefail
          # `az containerapp secret show` returns the RAW value for inline secrets
          # but the KV URI for keyvaultref-backed secrets — resolve those via KV
          # (the 401s on the first run were the cookie minted with the URI string).
          J=$(az containerapp secret show -n "$APP" -g "$RG" --secret-name session-secret -o json)
          SS=$(echo "$J" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('value') or '')")
          KVURL=$(echo "$J" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('keyVaultUrl') or '')")
          if [ -z "$SS" ] && [ -n "$KVURL" ]; then
            echo "session-secret is a keyvaultref — resolving via Key Vault"
            SS=$(az keyvault secret show --id "$KVURL" --query value -o tsv | tr -d '\r')
          fi
          case "$SS" in https://*) KVURL="$SS"; echo "value IS a KV URI — resolving"; SS=$(az keyvault secret show --id "$KVURL" --query value -o tsv | tr -d '\r');; esac
          [ -n "$SS" ] || { echo "::error::session-secret unreadable"; exit 1; }
          echo "::add-mask::$SS"
          echo "SS=$SS" >> "$GITHUB_ENV"

      - name: loom-unity diagnostics (revision state, platform logs)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # READ-ONLY: every Azure call is a show/list/query; `az extension
          # add` changes only this runner.
          #
          # This repository's Actions logs are PUBLIC, so the step prints an
          # ALLOWLIST rather than filtering app output:
          #  - platform fields picked with --query / KQL `project`: revision and
          #    replica state, role names, activity-log operation/status/error
          #    code, system-log type/reason/count and the platform's message;
          #  - from CONSOLE logs (app content) only lines the loom-unity
          #    entrypoint writes (`[loom-unity] ...`) and Java exception CLASS
          #    names, never their message; every other console line is counted;
          #  - identities by kind and UAMI name only, never principal, client or
          #    resource ids.
          # `redact` runs over all of it as defence in depth. It is a denylist
          # over free text and cannot be complete: the allowlist is the control.
          # Each block of Azure-sourced text is wrapped in `::stop-commands::`
          # with a fresh random token, so no line in it is parsed as a workflow
          # command. This step's own annotations are printed outside the blocks.
          # A name used in a heading or in KQL must match [A-Za-z0-9._-].
          redact() {
            sed -E \
              -e "s#eyJ[A-Za-z0-9_-]{8,}(\.[A-Za-z0-9_-]+){0,2}#[REDACTED-JWT]#g" \
              -e "s#(bearer[[:space:]]+)[A-Za-z0-9._~+/=-]{8,}#\1[REDACTED]#Ig" \
              -e "s#((jdbc:[A-Za-z0-9]+(:[A-Za-z0-9]+)*|postgres|postgresql)://)([^@[:space:]\"']*@)?([^/:;?@[:space:]\"']+)[^[:space:]\"']*#\1\5[REDACTED]#Ig" \
              -e "s#(jdbc:[A-Za-z0-9]+:)[^/[:space:]\"'][^[:space:]\"']*#\1[REDACTED]#Ig" \
              -e "s#(\"[A-Za-z0-9_]*(password|passwd|pwd|secret|token|key|credential)[A-Za-z0-9_]*\"[[:space:]]*:[[:space:]]*\")[^\"]+#\1[REDACTED]#Ig" \
              -e "s#([A-Za-z0-9_]*(password|passwd|pwd|secret|token|key)[A-Za-z0-9_]*=)(\"[^\"]+\"|'[^']+'|[^&;,[:space:]\"']+)#\1[REDACTED]#Ig" \
              -e "s#((^|[^A-Za-z0-9_])(sig|se|st|sv|sp|sr|spr|srt|ss|sip|skoid|sktid|skt|ske|sks|skv|sdd)=)[^&;,[:space:]\"']+#\1[REDACTED]#Ig" \
              -e "s#[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}#[GUID]#g"
          }
          shield() {
            sh_t=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
            printf '::stop-commands::%s\n' "$sh_t"
            redact
            printf '::%s::\n' "$sh_t"
          }
          # val LABEL CMD...: runs CMD in this shell and sets VAL (stdout, CR
          # stripped) and VAL_RC. On failure: a warning naming LABEL and the
          # exit code, CMD's stderr in a shielded block, and VAL empty.
          val() {
            v_l="$1"; shift; v_e=$(mktemp); VAL_RC=0
            VAL=$("$@" 2>"$v_e" </dev/null) || VAL_RC=$?
            VAL=$(printf '%s' "$VAL" | tr -d '\r')
            if [ "$VAL_RC" -ne 0 ]; then
              echo "::warning::${v_l}: exited ${VAL_RC}; stderr follows"
              head -n 20 "$v_e" | shield
              VAL=""
            fi
            rm -f "$v_e"
          }
          # diag LABEL CMD...: CMD's stdout in a shielded block; on failure the
          # same warning and shielded stderr as val.
          diag() {
            d_l="$1"; shift; d_e=$(mktemp); d_rc=0
            { "$@" 2>"$d_e" </dev/null | shield; } || d_rc=$?
            if [ "$d_rc" -ne 0 ]; then
              echo "::warning::${d_l}: exited ${d_rc}; stderr follows"
              head -n 20 "$d_e" | shield
            fi
            rm -f "$d_e"
          }
          name_ok() { case "$1" in *[!A-Za-z0-9._-]*) return 1 ;; esac; }
          # Console rows arrive as `<time> <revision><TAB><message>`; the query
          # turns CR, LF and TAB inside the message into spaces, so one row is
          # one line and the first TAB is the query's own.
          console_filter() {
            awk -F'\t' '
              NF < 2 || $1 ~ /[^0-9a-z: -]/ || $1 !~ /^[0-9]/ { n++; next }
              { m = substr($0, length($1) + 2) }
              substr(m, 1, 13) == "[loom-unity] " { print $1 " " m; next }
              match(m, /(Caused by: )?[a-z][a-z0-9_]*(\.[A-Za-z0-9_$]+)+(Exception|Error)/) {
                print $1 " exception: " substr(m, RSTART, RLENGTH); next }
              { n++ }
              END { print (n + 0) " other console lines not printed" }'
          }

          echo "=== loom-unity revisions: newest 10 of --all (inactive and failed included), oldest first ==="
          diag "revision list" az containerapp revision list -n loom-unity -g "$RG" --all \
            --query "sort_by([], &properties.createdTime)[-10:].{name:name,active:properties.active,created:properties.createdTime,provisioning:properties.provisioningState,provisioningError:properties.provisioningError,running:properties.runningState,health:properties.healthState,replicas:properties.replicas,image:properties.template.containers[0].image}" -o json
          echo "=== app ==="
          diag "containerapp show" az containerapp show -n loom-unity -g "$RG" \
            --query "{provisioning:properties.provisioningState,runningStatus:properties.runningStatus,revisionsMode:properties.configuration.activeRevisionsMode,latestRevision:properties.latestRevisionName,latestReadyRevision:properties.latestReadyRevisionName}" -o json
          val "newest revision" az containerapp revision list -n loom-unity -g "$RG" --all --query "sort_by([], &properties.createdTime)[-1].name" -o tsv
          TARGET=$VAL; name_ok "$TARGET" || TARGET=""
          val "latestReadyRevisionName" az containerapp show -n loom-unity -g "$RG" --query "properties.latestReadyRevisionName || ''" -o tsv
          SERVING=$VAL; name_ok "$SERVING" || SERVING=""
          TARGET_CREATED=""
          if [ -n "$TARGET" ]; then
            val "createdTime" az containerapp revision show -n loom-unity -g "$RG" --revision "$TARGET" --query properties.createdTime -o tsv
            TARGET_CREATED=$VAL
            echo "=== replicas of the newest revision, $TARGET ==="
            diag "replica list" az containerapp replica list -n loom-unity -g "$RG" --revision "$TARGET" \
              --query "[].{name:name,running:properties.runningState,containers:properties.containers[].{name:name,ready:ready,started:started,restarts:restartCount,state:runningState,details:runningStateDetails}}" -o json
          else
            echo "(newest revision name not resolved, so the replica section did not run)"
          fi

          echo "=== registry pull identity: kind, UAMI name, AcrPull on the registry ==="
          val "registries" az containerapp show -n loom-unity -g "$RG" --query "properties.configuration.registries[].[server, identity || '']" -o tsv
          [ -n "$VAL" ] || echo "(no registries returned, so this section did not run)"
          while IFS=$'\t' read -r R_SRV R_ID; do
            [ -n "${R_SRV:-}" ] || continue
            name_ok "$R_SRV" || { echo "(a registry server name with unexpected characters was withheld)"; continue; }
            UAMI=""
            case "${R_ID:-}" in
              /subscriptions/*|/SUBSCRIPTIONS/*) KIND=user-assigned; UAMI="${R_ID##*/}"; name_ok "$UAMI" || UAMI="<withheld>" ;;
              ""|None) KIND="none (admin credentials or anonymous pull)" ;;
              system) KIND=system-assigned ;;
              *) KIND=other ;;
            esac
            PULL="not checked for identity kind '$KIND'"
            ROLES=""
            if [ "$KIND" = user-assigned ]; then
              val "principal of the pull identity" az identity show --ids "$R_ID" --query principalId -o tsv; PID=$VAL
              val "registry lookup" az acr list --query "[?loginServer=='$R_SRV'].id | [0]" -o tsv; AID=$VAL
              if [ -z "$PID" ]; then
                PULL="could-not-read: the identity's principal was not resolved"
              elif [ -z "$AID" ]; then
                PULL="could-not-read: no registry with login server $R_SRV is visible to the deploy principal"
              else
                val "role assignments on the registry" az role assignment list --scope "$AID" --include-inherited \
                  --fill-principal-name false --query "[?principalId=='$PID'].[roleDefinitionName, scope]" -o tsv
                if [ "$VAL_RC" -ne 0 ]; then
                  PULL="could-not-read: the role query exited $VAL_RC (stderr above)"
                else
                  ROLES=$VAL
                  if [ "$(printf '%s\n' "$ROLES" | awk -F'\t' '$1 == "AcrPull" { f = 1 } END { print f + 0 }')" = 1 ]; then
                    PULL=yes
                  else
                    PULL="no: none visible to the deploy principal (group-inherited assignments are not listed)"
                  fi
                fi
              fi
            fi
            {
              echo "registry=$R_SRV identity-kind=$KIND uami=${UAMI:-n/a} acrpull=$PULL"
              printf '%s\n' "$ROLES" | awk -F'\t' 'NF {
                l = "other"
                if ($2 ~ /\/registries\/[^\/]+$/) l = "registry"
                else if ($2 ~ /\/resourceGroups\/[^\/]+$/) l = "resource group"
                else if ($2 ~ /^\/subscriptions\/[^\/]+$/) l = "subscription"
                r = $1; if (r ~ /[^A-Za-z0-9 ._()-]/) r = "<withheld>"
                print "  role: " r " @ " l }'
            } | shield
          done <<< "$VAL"

          echo "=== activity log: failed operations on loom-unity, newest 200 events of 7 days ==="
          val "app id" az containerapp show -n loom-unity -g "$RG" --query id -o tsv
          if [ -n "$VAL" ]; then
            val "activity-log list" az monitor activity-log list --resource-id "$VAL" --offset 7d --max-events 200 \
              --query "[].[eventTimestamp, status.value || '', operationName.value || '', subStatus.value || '', properties.statusMessage || '']" -o tsv
            if [ "$VAL_RC" -eq 0 ]; then
              printf '%s\n' "$VAL" | awk -F'\t' '
                NF { n++ }
                $2 == "Failed" {
                  c = "-"
                  if (match($5, /"code" *: *"[A-Za-z0-9_.-]*"/)) { c = substr($5, RSTART, RLENGTH); sub(/^"code" *: *"/, "", c); sub(/"$/, "", c) }
                  print $1 " " $3 " " $2 " " $4 " code=" c }
                END { print "events read: " (n + 0) " (cap 200" (n >= 200 ? ", reached: older failures are not shown)" : ")") }' | shield
            fi
          else
            echo "(app id not resolved, so the activity log was not read)"
          fi

          echo "=== Log Analytics: the workspace the environment logs to ==="
          val "environment id" az containerapp show -n loom-unity -g "$RG" --query properties.environmentId -o tsv
          CAE_ID=$VAL; DEST=""; LAW=""
          if [ -n "$CAE_ID" ]; then
            val "log destination" az containerapp env show --ids "$CAE_ID" --query "properties.appLogsConfiguration.destination || ''" -o tsv; DEST=$VAL
            val "workspace customerId" az containerapp env show --ids "$CAE_ID" --query "properties.appLogsConfiguration.logAnalyticsConfiguration.customerId || ''" -o tsv; LAW=$VAL
            if [ -z "$LAW" ]; then
              val "diagnostic settings" az monitor diagnostic-settings list --resource "$CAE_ID" --query "[?workspaceId] | [0].workspaceId || ''" -o tsv
              if [ -n "$VAL" ]; then
                val "workspace show" az monitor log-analytics workspace show --ids "$VAL" --query customerId -o tsv; LAW=$VAL
              fi
            fi
          fi
          case "$DEST" in *[!a-z-]*) DEST="" ;; esac
          case "$LAW" in *[!0-9a-fA-F-]*) LAW="" ;; esac
          echo "destination=${DEST:-<unresolved>} workspace=$([ -n "$LAW" ] && echo resolved || echo '<unresolved>')"
          if [ -z "$LAW" ]; then
            echo "(workspace not resolved, so no Log Analytics query ran)"
          else
            diag "extension add log-analytics" az extension add -n log-analytics -y --only-show-errors
            # la_q LABEL TABLE APPCOL WHERE TIME LINE [con]: prints the matched
            # count, then the newest rows oldest-first as one `line` column;
            # console rows (`con`) go through console_filter.
            la_q() {
              q="$2 | where $5 | where $3 == 'loom-unity' | where $4"
              val "$1: count" az monitor log-analytics query -w "$LAW" -o tsv --query "[0].Count" --analytics-query "$q | count"
              case "$VAL" in ""|*[!0-9]*) echo "--- $1: count not read"; return 0 ;; esac
              echo "--- $1: $VAL rows matched"
              [ "$VAL" != 0 ] || return 0
              if [ "${7:-}" = con ]; then
                val "$1: rows" az monitor log-analytics query -w "$LAW" -o tsv --query "[].line" --analytics-query "$q | top 300 by TimeGenerated desc | order by TimeGenerated asc | project line=$6"
                [ "$VAL_RC" -ne 0 ] || printf '%s\n' "$VAL" | console_filter | shield
              else
                diag "$1: rows" az monitor log-analytics query -w "$LAW" -o tsv --query "[].line" --analytics-query "$q | top 150 by TimeGenerated desc | order by TimeGenerated asc | project line=$6"
              fi
            }
            # Window A: 1h before to 24h after the newest revision's creation,
            # so a later dispatch still sees it; datetime() gets the documented
            # ISO 8601 `...Z` form, and only from a UTC createdTime.
            TC19="${TARGET_CREATED:0:19}"
            if [[ "$TC19" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$ ]] && [[ "${TARGET_CREATED:19}" =~ ^(\.[0-9]+)?(Z|\+00:00)$ ]]; then
              A_WIN="TimeGenerated >= datetime(${TC19}Z) - 1h and TimeGenerated <= datetime(${TC19}Z) + 24h"
              A_DESC="1h before to 24h after $TARGET was created (${TC19}Z)"
            else
              A_WIN="TimeGenerated > ago(24h)"
              A_DESC="the last 24h (the newest revision's createdTime was not a UTC timestamp)"
            fi
            if [ -n "$SERVING" ]; then
              echo "filter: A) revisions other than the serving one ($SERVING), $A_DESC; B) the serving revision's system log, last 1h"
            else
              echo "filter: A) every revision, $A_DESC (serving revision not resolved); B) skipped"
            fi
            T="format_datetime(TimeGenerated,'yyyy-MM-dd HH:mm:ss')"
            case "$DEST" in
              log-analytics) SHAPES=cl ;;
              azure-monitor) SHAPES=rs ;;
              *) SHAPES="cl rs"; echo "(destination not resolved: both table shapes are queried and the absent one fails)" ;;
            esac
            for S in $SHAPES; do
              if [ "$S" = cl ]; then
                SYS=ContainerAppSystemLogs_CL; CON=ContainerAppConsoleLogs_CL; AC=ContainerAppName_s; RC=RevisionName_s
                SYS_L="strcat($T,' ',RevisionName_s,' ',tostring(column_ifexists('ReplicaName_s','')),' ',tostring(column_ifexists('Type_s','')),' ',tostring(column_ifexists('Reason_s','')),' x',tostring(column_ifexists('Count_d','')),' ',translate('\r\n\t',' ',Log_s))"
                CON_L="strcat($T,' ',RevisionName_s,'\t',translate('\r\n\t',' ',Log_s))"
              else
                SYS=ContainerAppSystemLogs; CON=ContainerAppConsoleLogs; AC=ContainerAppName; RC=RevisionName
                SYS_L="strcat($T,' ',RevisionName,' ',ReplicaName,' ',Type,' ',Reason,' x',tostring(Count),' ',translate('\r\n\t',' ',Log))"
                CON_L="strcat($T,' ',RevisionName,'\t',translate('\r\n\t',' ',Log))"
              fi
              if [ -n "$SERVING" ]; then OTHER="$RC != '$SERVING'"; else OTHER="isnotempty($RC)"; fi
              la_q "A system $SYS" "$SYS" "$AC" "$OTHER" "$A_WIN" "$SYS_L"
              la_q "A console $CON" "$CON" "$AC" "$OTHER" "$A_WIN" "$CON_L" con
              if [ -n "$SERVING" ]; then
                la_q "B system $SYS, serving revision" "$SYS" "$AC" "$RC == '$SERVING'" "TimeGenerated > ago(1h)" "$SYS_L"
              fi
            done
          fi

      - name: Front Door WAF — recent blocks (operator browser 'request is blocked')
        run: |
          set -euo pipefail
          az extension add -n log-analytics -y 2>/dev/null || true
          LAW=$(az monitor log-analytics workspace list -g "$RG" --query "[0].customerId" -o tsv 2>/dev/null | tr -d '\r')
          echo "LAW=$LAW"
          if [ -n "$LAW" ]; then
            az monitor log-analytics query -w "$LAW" --analytics-query "AzureDiagnostics | where Category == 'FrontDoorWebApplicationFirewallLog' | where TimeGenerated > ago(2h) | where action_s in ('Block','block') | project TimeGenerated, ruleName_s, action_s, requestUri_s, details_matches_s, details_msg_s | order by TimeGenerated desc | take 20" -o json 2>&1 | python3 -c "
          import json,sys
          raw=sys.stdin.read()
          try:
              rows=json.loads(raw)
              if not rows: print('no WAF blocks in the window')
              for r in rows: print(r.get('TimeGenerated','')[:19], r.get('ruleName_s',''), (r.get('details_msg_s') or '')[:120], '|', (r.get('details_matches_s') or '')[:160])
          except Exception:
              print('WAF query failed:', raw[:400])
          " || true
            echo '--- also try the resource-specific table ---'
            az monitor log-analytics query -w "$LAW" --analytics-query "union isfuzzy=true AGWFirewallLogs, FrontDoorWebApplicationFirewallLog | where TimeGenerated > ago(2h) | take 10" -o json 2>&1 | head -c 400 || true
          fi

      # RESOLVE THE AUTOMATION IDENTITY — produced, never requested (#3373).
      #
      # This step also closes a CLOUD-PARITY defect (cloud-parity.md). This lane
      # used to read `vars.LOOM_AUTOMATION_OID` — a single repo-wide variable
      # shared with the COMMERCIAL workflows. Commercial and Gov are different
      # Entra tenants, so one object id cannot be the tenant admin in both: the
      # admin-gated probe below (/api/admin/domains/purview-status) could only
      # ever pass in one of them. Deriving from the GOV console's own
      # LOOM_TENANT_ADMIN_OID gives each boundary its own correct identity, with
      # no repo variable and nothing hard-coded per cloud — `az containerapp
      # show` follows whatever `az cloud set` selected above.
      #
      # If the Gov deploy lanes bind only loomTenantAdminGroupId (they did as of
      # #3109) this step FAILS CLOSED and says so precisely, because the group
      # arm of feature-gate.ts `isTenantAdmin` needs a `groups` claim that a
      # minted session never carries. That is a true, actionable red rather than
      # today's silent 403 on the admin probe.
      - name: Resolve automation identity (derive from the Gov console's tenant-admin binding)
        id: automation_oid
        env:
          EXPLICIT_OID: ${{ vars.LOOM_GOV_AUTOMATION_OID }}
          CONSOLE_APP: ${{ env.APP }}
          CONSOLE_RG: ${{ env.RG }}
        run: node scripts/ci/resolve-automation-oid.mjs

      - name: Probe BFF routes with a minted session
        env:
          OID: ${{ env.LOOM_AUTOMATION_OID }}
        run: |
          set -euo pipefail
          node - <<'EOF'
          const crypto = require('node:crypto');
          const S = process.env.SS, B = process.env.BASE, O = process.env.OID;
          const K = Buffer.from(crypto.hkdfSync('sha256', Buffer.from(S, 'utf-8'), Buffer.alloc(32), Buffer.from('loom-session-v1'), 32));
          const p = { claims: { oid: O, name: 'gov-bff-verify', email: 'verify@automation.inv', upn: 'gov-bff-verify@automation' }, exp: Math.floor(Date.now() / 1000) + 3600 };
          const iv = crypto.randomBytes(12), c = crypto.createCipheriv('aes-256-gcm', K, iv);
          const e = Buffer.concat([c.update(Buffer.from(JSON.stringify(p))), c.final()]);
          const cookie = 'loom_session=' + Buffer.concat([iv, c.getAuthTag(), e]).toString('base64url');
          // ── PER-PROBE SUBSYSTEM SCOPING (#3842) ───────────────────────────
          // Each probe declares the TOP-LEVEL response keys it owns. `gates` are
          // GRADED — the predicate returns the finding's classification string,
          // or false. `info` keys are carried by the same envelope but belong to
          // a DIFFERENT subsystem, or are data rather than a verdict.
          //
          // A top-level key in NEITHER list FAILS THE PROBE. Scoping by
          // inclusion alone is how a scoped check goes blind the day a route
          // grows a new gate field, so this one fails closed and demands the key
          // be classified here.
          //
          // The single cross-cutting regex this replaces was
          //   /"gate"\s*:\s*(true|\{)|not configured|Set LOOM_(UNITY_URL|PURVIEW_ACCOUNT)/i
          // and it was wrong three ways, each MEASURED against the routes' real
          // response bodies rather than inferred:
          //
          //  1. OVER-BROAD. /api/catalog/metastores carries Unity AND Purview
          //     AND OneLake AND Cosmos AND ARM fields in one envelope. That
          //     route emits `purviewError: 'LOOM_PURVIEW_ACCOUNT not configured'`
          //     when Purview is unwired — which matched `not configured` and
          //     failed the probe LABELLED "unity-catalog", for a PURVIEW env
          //     var. Latent today only because Purview IS configured in Gov.
          //  2. INVERTED. `"gate"` cannot match `"gated"` — the closing quote
          //     falls after the `d`. Against purview-status's two real shapes
          //     the regex returns FALSE for the REAL gate (configured:false +
          //     gated:true — Purview is provisioned but the Console UAMI lacks
          //     a Data Map data-plane role on the root collection) and TRUE for
          //     the benign "set LOOM_PURVIEW_ACCOUNT" hint. The probe was blind
          //     to the one class it exists to catch, and fired on the other.
          //  3. VACUOUS. /api/governance/catalog emits no gate marker on ANY
          //     path, so that probe's gate assertion had ZERO population.
          //
          // `gate(why)` fires on presence; `gateNonEmpty(why)` on a non-empty
          // array (an empty `unityWorkspaceErrors` is not a finding).
          const gate = (why) => (v) => (v === undefined || v === null ? false : why);
          const gateNonEmpty = (why) => (v) => (Array.isArray(v) ? v.length > 0 : v !== undefined && v !== null) && why;
          // `ok:false` on a 2xx is an ERROR ENVELOPE, not data. Every 2xx path of
          // all three routes emits `ok:true` — metastores/route.ts:115,
          // governance/catalog/route.ts:121,135,204, purview-status/route.ts:89 —
          // and `ok:false` only ever ships with a non-2xx status. So a 2xx
          // carrying `ok:false` is a contract break wherever it appears.
          // It was classified `info` on all three probes, i.e. PRINTED AND NEVER
          // GRADED, while the governance-catalog comment below asserted the
          // contract as if it were enforced. Measured on the pre-fix step:
          // `{"ok":false}` on a 200 produced `::notice:: OK (200)` and exit 0
          // (#4000; deploy-integrity.md R7 — a comment must not assert an
          // enforcement the code does not perform).
          const okTrue = (v) =>
            v === true ? false : `ok is not true on a 2xx — the route returned an error envelope (ok=${JSON.stringify(v)})`;
          // `required` names the top-level keys the route's 2xx contract emits on
          // EVERY path. It is graded separately from `gates`, because the gate
          // loop walks `Object.keys(body)` and therefore cannot see a key that is
          // not there — which is why purview's own "missing from the envelope"
          // arm could fire for a present-but-null value and never for the missing
          // key it names. Measured on the pre-fix step: a `{"ok":true}` body from
          // the purview-status route produced `::notice::purview wiring status:
          // OK (200)` and exit 0 (#4000).
          const probes = [
            {
              path: '/api/catalog/metastores',
              label: 'unity-catalog (OSS loom-unity)',
              // `ok` and `purview` are on EVERY 2xx path of that route
              // (`const result: any = { ok: true }` at :115, and :213-220 sets
              // `result.purview` to an object or to null in both branches), so
              // an envelope missing either is unreadable, not clean.
              required: ['ok', 'purview'],
              gates: {
                ok: okTrue,
                unityError: gate('unity catalog error'),
                unityHint: gate('unity catalog NOT CONFIGURED (missing hostnames env)'),
                unityWorkspaceErrors: gateNonEmpty('one or more Unity workspaces failed to list'),
                accountAdminGate: gate('UC not enabled / metastore not listable (account-admin gate)'),
                accountMetastoresError: gate('UC account-plane metastore read failed'),
              },
              // Owned by another subsystem, or data rather than a verdict:
              // purview* is the purview-status probe's, onelake* is OneLake's,
              // registrations/degraded/warning are Cosmos', discover* is ARM's.
              // accountApiHint is the Databricks ACCOUNT API — a Commercial-only
              // convenience the route itself says registration and catalog
              // listing work without, and which Gov's OSS Unity has no account
              // for, so it is present there BY DESIGN.
              info: [
                'unity', 'unityHosts', 'registrations', 'degraded', 'warning',
                'accountApiConfigured', 'accountMetastores', 'accountApiHint',
                'discoverableWorkspaces', 'discoveryError', 'onelake', 'onelakeError',
                'purview', 'purviewError',
              ],
            },
            {
              path: '/api/governance/catalog',
              label: 'purview governance catalog',
              // This route emits NO gate marker on any path — hence defect 3
              // above. Its real contract is 2xx + `ok:true`, and that contract is
              // now GRADED rather than merely asserted here (`ok: okTrue`);
              // `error` appears only on the 500 the status ladder already owns.
              // `source:'cosmos'` is the honest AI-Search-absent fallback, NOT a
              // gate, so it is printed and not failed. The fail-closed rule below
              // is what gives this probe teeth the day the route grows a gate
              // field.
              //
              // `facets` is deliberately NOT required: the callerWorkspaceIds==0
              // branch (:135) omits it while the other two 2xx branches emit it.
              // Requiring a key the producer does not always emit would turn a
              // legitimate response into a false finding.
              required: ['ok', 'total', 'assets', 'workspaces', 'source'],
              gates: {
                ok: okTrue,
                error: gate('route returned an error envelope on a 2xx'),
              },
              info: ['total', 'assets', 'facets', 'workspaces', 'source', 'code'],
            },
            {
              path: '/api/admin/domains/purview-status',
              label: 'purview wiring status',
              // The gate here is NESTED, which is why a top-level key scan alone
              // cannot grade this route. Both non-configured states are findings
              // on an estate whose deploy wires Purview — but each is now
              // reported AS THE ONE IT IS. The old message called the env-unset
              // case "still gated" while the payload said `gated:false`, and
              // stayed silent on the case that actually says `gated:true`
              // (deploy-integrity.md R7: an error must not assert what it has
              // not established).
              // The route's 2xx is exactly `{ ok: true, purview }` (:89), so both
              // keys are required. ABSENCE of `purview` is graded by the required
              // rule, NOT by the predicate below — which is the whole of #4000:
              // the predicate's own "missing from the envelope" string could only
              // ever be reached with the key PRESENT.
              required: ['ok', 'purview'],
              gates: {
                ok: okTrue,
                purview: (v) => {
                  // Reachable only with the key present, so this arm must not
                  // claim absence (deploy-integrity.md R7). A present-but-null /
                  // non-object value is a status that could not be READ.
                  if (v === null || typeof v !== 'object' || Array.isArray(v)) {
                    const kind = v === null ? 'null' : Array.isArray(v) ? 'an array' : `a ${typeof v}`;
                    return `purview is present but is ${kind}, not a status object — the Purview wiring state could not be read from it`;
                  }
                  if (v.configured === true) return false;
                  return v.gated === true
                    ? 'purview.gated=true — provisioned, but the Console UAMI lacks a Purview Data Map data-plane role on the ROOT collection'
                    : 'purview.configured=false — the Purview mirror is not wired (LOOM_PURVIEW_ACCOUNT unset, or the account was unreachable)';
                },
              },
              info: ['error'],
            },
          ];
          // This job holds Gov secrets and prints response bytes to TWO distinct
          // publication surfaces on a PUBLIC repo — the run log and `::error::`
          // annotations. Redact before either sees the body. GUIDs cover
          // subscription / tenant / object ids, which is what a Gov error body
          // most often carries.
          const redact = (s) => String(s)
            .replace(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi, '<guid>')
            .replace(/eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9._-]+/g, '<jwt>')
            .replace(/(bearer|access_token|id_token|client_secret)(["'\s:=]+)[A-Za-z0-9._~+/=-]{8,}/gi, '$1$2<redacted>');
          // Collapse ALL whitespace, not just \n: a body carrying tabs or CRLF
          // rendered ragged and could push the match off the visible line.
          const flat = (s) => redact(s).replace(/\s+/g, ' ');
          const excerpt = (s, i, back, fwd) => {
            const a = Math.max(0, i - back), b = Math.min(s.length, i + fwd);
            return (a > 0 ? '...' : '') + flat(s.slice(a, b)) + (b < s.length ? '...' : '');
          };
          // The verdict and the evidence printed for it come from the SAME
          // lookup, so a failure can no longer show a window that does not
          // contain what it is reporting (#3842/#3854). Structural, not "print
          // more": the excerpt is ANCHORED at the owning field's real offset and
          // runs FORWARD through its value, so the verdict and its proof cannot
          // drift apart again however long the body grows or wherever in it the
          // deciding field lands. Asymmetric on purpose — a centred window
          // spends half its budget on the bytes BEFORE the field, which are by
          // definition not what decided. Truncation is marked, never silent.
          // A failed locate says so; it never reports offset 0, which would read
          // as "at the very start of the body".
          const evidence = (t, key) => {
            const i = t.indexOf(JSON.stringify(key));
            return i < 0
              ? `field ${JSON.stringify(key)} (offset unknown — the key is not literally present in the raw body): ${flat(t.slice(0, 280))}`
              : `field ${JSON.stringify(key)} at offset ${i} of ${t.length}: ${excerpt(t, i, 40, 660)}`;
          };
          // POPULATION FLOOR for the required rule, checked before any request.
          // A probe with an empty `required` list cannot detect an EMPTIED
          // envelope at all — it would grade `{}` as clean, which is the exact
          // shape #4000 measured. And a `required` key classified in neither
          // `gates` nor `info` would fail every run on the unclassified arm
          // instead of on the missing-key arm, hiding what actually broke. Both
          // are defects in THIS table, so they abort the job loudly rather than
          // silently reducing what it watches.
          let tableBad = 0;
          for (const p of probes) {
            if (!Array.isArray(p.required) || p.required.length === 0) {
              console.log(`::error::probe table defect: ${p.label} declares no required top-level keys, so an EMPTY 2xx envelope from ${p.path} would be graded clean. List the keys that route emits on every 2xx path.`);
              tableBad++;
              continue;
            }
            for (const k of p.required) {
              if (!Object.prototype.hasOwnProperty.call(p.gates, k) && !p.info.includes(k)) {
                console.log(`::error::probe table defect: ${p.label} requires ${JSON.stringify(k)} but classifies it in neither gates nor info — a present one would then fail on the UNCLASSIFIED arm instead of being graded.`);
                tableBad++;
              }
            }
          }
          (async () => {
            let bad = tableBad;
            for (const { path, label, gates, info, required } of probes) {
              try {
                const r = await fetch(B + path, { headers: { cookie } });
                const t = await r.text();
                console.log(`\n=== ${label} — GET ${path} -> ${r.status}\n${flat(t.slice(0, 260))}`);
                // STATUS FIRST. A 401/403/5xx body is an error page, not a
                // subsystem verdict, and grading one as a gate is how a probe
                // reports the wrong cause (deploy-integrity.md R7).
                //
                // ANY non-2xx is a failure. The ladder once caught only >=500
                // and 401, so a 403 / 404 / 3xx fell through to the `OK` arm and
                // printed `::notice:: OK (404)` — a probe reporting success over
                // a dead endpoint, which is the one thing this job exists to
                // catch. `r.ok` is 200-299, so that arm closes the whole gap.
                if (r.status >= 500) { console.log(`::error::${label}: HTTP ${r.status}`); bad++; continue; }
                if (r.status === 401) { console.log(`::error::${label}: 401 — minted session rejected`); bad++; continue; }
                if (!r.ok) { console.log(`::error::${label}: HTTP ${r.status} — expected 2xx`); bad++; continue; }
                let body;
                try { body = JSON.parse(t); } catch { body = undefined; }
                if (!body || typeof body !== 'object' || Array.isArray(body)) {
                  console.log(`::error::${label}: 2xx body is not a JSON object — cannot be scoped, so it is NOT assumed clean: ${flat(t.slice(0, 280))}`);
                  bad++; continue;
                }
                const findings = [];
                // REQUIRED FIRST — and NOT inside the loop below, which walks
                // `Object.keys(body)` and so is structurally incapable of seeing
                // an ABSENT key. That is the defect: a declared gate whose own
                // message named a missing key could never fire for one (#4000).
                for (const k of required) {
                  if (!Object.prototype.hasOwnProperty.call(body, k)) {
                    findings.push(`${label}: MISSING required top-level key ${JSON.stringify(redact(k))} — this route emits it on every 2xx path, so an envelope without it is UNVERIFIED, not clean: ${evidence(t, k)}`);
                  }
                }
                for (const k of Object.keys(body)) {
                  if (Object.prototype.hasOwnProperty.call(gates, k)) {
                    const why = gates[k](body[k]);
                    if (why) findings.push(`${label}: GATED — ${why}: ${evidence(t, k)}`);
                  } else if (!info.includes(k)) {
                    // FAIL CLOSED. An unclassified key is an UNKNOWN, and an
                    // unknown reported as a pass is how a scoped check quietly
                    // stops watching. Classify it in this probe's `gates`/`info`.
                    findings.push(`${label}: UNCLASSIFIED top-level key ${JSON.stringify(redact(k))} — add it to this probe's gates (a real gate) or info (another subsystem's / data): ${evidence(t, k)}`);
                  }
                }
                if (findings.length) { for (const f of findings) console.log(`::error::${f}`); bad++; }
                else console.log(`::notice::${label}: OK (${r.status})`);
              } catch (x) { console.log(`::error::${label}: ${redact(x.message)}`); bad++; }
            }
            // Set the code and let the loop drain instead of `process.exit()`.
            // Two reasons, one of them not cosmetic:
            //   • This job's entire product is `::error::` lines on a PIPE, and
            //     node documents process.exit() as able to truncate stdout
            //     writes that have not flushed — i.e. it can drop the very
            //     annotation the run exists to emit.
            //   • On Windows, process.exit() after a fetch aborts the process
            //     with a libuv assertion (`UV_HANDLE_CLOSING`, src/win/async.c)
            //     and a 0xC0000409 code, so the exit code could not be measured
            //     at all by the control suite that grades this step.
            // The watchdog is unref'd: it cannot hold the process open, and it
            // only fires if something ELSE does — in which case the run still
            // ends with the verdict it computed rather than hanging to timeout.
            process.exitCode = bad ? 1 : 0;
            setTimeout(() => process.exit(bad ? 1 : 0), 30000).unref();
          })();
          EOF
