name: deploy-fiab-il5

# CSA Loom — deploy validation against DoD IL5 (Azure Government, IL5-accredited
# services only). Sibling of deploy-fiab-gcch.yml (A-4 / PMF-64).
#
# whatif-only  — validates Bicep + Gov auth without provisioning (default, safe).
# full         — teardown -> redeploy -> RBAC grants -> smoke via the
#                scripts/csa-loom/redeploy-gov.sh orchestration, i.e. the
#                acceptance "teardown->redeploy in a clean Gov sub" run.
#
# Manual approval gate (il5-deploy environment protection) since this deploys
# into an IL5 Gov subscription.

# The `Teardown -> redeploy -> smoke` step below is gated `if: inputs.run_mode ==
# 'full'`, and run_mode DEFAULTS to whatif-only — so the DEFAULT dispatch of this
# workflow SUCCEEDS having applied nothing to IL5.
#
# check-deploy-staleness.mjs clears a WATCHED entry's drift on its newest
# SUCCESSFUL run, and until this line existed the workflow had no `run-name` at
# all: every run — apply or not — was titled "deploy-fiab-il5", so ONE default
# dispatch would have silenced an IL5 deploy gap it did not close. That is the
# "green on nothing" shape the watchdog exists to catch, and it is why this line
# has to land BEFORE the IL5 WATCHED entry rather than with it.
#
# The marker string is DRY_RUN_MARKER ('DRY RUN') in check-deploy-staleness.mjs,
# which filters those runs out of the last-success search.
#
# WHY THE `workflow_dispatch` TEST IS STILL CORRECT ON A LANE WITH NO CRON. The
# sibling lanes carry the same expression because a `schedule` run provisions and
# must therefore NOT be marked. This workflow has no `schedule:` trigger at all,
# so `github.event_name` is always `workflow_dispatch` here and the left-hand
# clause is always true — the marker is decided purely by run_mode, which is the
# intended behaviour. The clause is kept rather than simplified so the four lanes
# share one auditable literal; it is stated here rather than left to imply that
# this lane has a cron it does not have (deploy-integrity R7).
run-name: deploy-fiab-il5${{ (github.event_name == 'workflow_dispatch' && inputs.run_mode != 'full') && ' — DRY RUN (whatif-only, applies nothing)' || '' }}

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'whatif-only PREVIEWS the Bicep and applies NOTHING. full APPLIES the template: it provisions/reconciles the infrastructure AND creates or updates the Container Apps (loom-console + siblings), re-rendering every LOOM_* env var on them, then smokes the estate. With keep_resources=true (the default) it RECONCILES in place and tears nothing down. There is no separate apps flag on this lane — il5.bicepparam sets deployAppsEnabled=true, so full always includes the app tier.'
        type: choice
        default: whatif-only
        options:
          - whatif-only
          - full
      topology:
        description: 'tenant = first-run install (deploys the hub + DLZ). dlz-attach = add ONE DLZ to an existing hub (no Console).'
        type: choice
        default: tenant
        options:
          - tenant
          - dlz-attach
      target_subscription:
        description: 'dlz-attach: the NEW subscription the DLZ is provisioned into.'
        type: string
        required: false
      keep_resources:
        description: 'Keep the estate up and RECONCILE in place (the safe default, and what a real install wants). TRUE passes --skip-teardown so a full run reconfigures and adds services without destroying anything, making it IDEMPOTENT and safe to repeat. Setting it FALSE makes this a TEARDOWN->REDEPLOY run — only for a deliberate clean-slate rebuild.'
        type: boolean
        default: true
      allow_existing_hub:
        description: 'topology=tenant only: bypass the "hub already exists in target sub" guard to idempotently reconcile/retry an existing or partially-deployed IL5 hub. Does NOT stamp a second Console — the incremental deploy reconciles the existing admin RG. Leave false for first-run installs. (Cloud parity: deploy-fiab-commercial.yml has had this since audit-t157; the Gov lanes did not, so once a Gov hub existed this workflow could never succeed again.)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

env:
  AZURE_CLOUD: AzureUSGovernment
  AZURE_LOCATION: usgovvirginia
  CSA_LOOM_BOUNDARY: IL5
  CSA_LOOM_TOPOLOGY: ${{ inputs.topology || 'tenant' }}
  CSA_LOOM_TARGET_SUBSCRIPTION: ${{ inputs.target_subscription }}

jobs:
  precheck:
    name: Verify Gov secrets are configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          C: ${{ secrets.AZURE_GOV_CLIENT_ID }}
          S: ${{ secrets.AZURE_GOV_CLIENT_SECRET }}
          T: ${{ secrets.AZURE_GOV_TENANT_ID }}
          U: ${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}
        run: |
          if [[ -z "$C" || -z "$S" || -z "$T" || -z "$U" ]]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::AZURE_GOV_* secrets not configured — skipping."
            echo "::warning::Bootstrap per docs/fiab/runbooks/secrets-bootstrap.md"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

  # IMAGE PHASE (no-vaporware.md two-phase contract). admin-plane/main.bicep
  # deploys loom-migrate + loom-risingwave DEFAULT-ON in every Container Apps
  # boundary, IL5 included, and params/il5.bicepparam sets containerPlatform=
  # 'containerApps' + deployAppsEnabled=true — so those two manifests must be in
  # the sovereign ACR before the deploy below, or their Container App PUTs fail
  # MANIFEST_UNKNOWN. `az acr build` runs server-side, the only mechanism that
  # reaches a publicNetworkAccess=Disabled Gov registry. On a from-scratch
  # subscription there is no ACR yet; the reusable workflow warns and exits 0 in
  # build-only mode and the images get built in the documented phase 2 instead —
  # which is why deploy-validate runs with `always()` rather than on success.
  build-gov-images:
    name: Build the DEFAULT-ON data-plane images (IL5 ACR)
    needs: precheck
    if: needs.precheck.outputs.configured == 'true' && inputs.run_mode == 'full'
    uses: ./.github/workflows/gov-provision-streaming-migrate.yml
    secrets: inherit
    with:
      mode: build-only
      boundary: IL5
      image_tag: v0.1

  deploy-validate:
    name: Deploy + validate CSA Loom in IL5
    needs: [precheck, build-gov-images]
    if: always() && needs.precheck.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: il5-deploy   # requires manual approval
    # Coordinates exported for the chained Gov post-deploy bootstrap (rel-T32).
    outputs:
      admin_sub: ${{ steps.bootstrap_coords.outputs.admin_sub }}
      dlz_sub: ${{ steps.bootstrap_coords.outputs.dlz_sub }}
      region: ${{ steps.bootstrap_coords.outputs.region }}

    # ── IMAGE TAGS: THE DEPLOY MEASURES THEM, NOBODY TYPES THEM (#3449) ─────
    # il5.bicepparam resolves all seventeen `appImageTags` entries with
    # `readEnvironmentVariable('LOOM_<X>_TAG', '<default>')`, which CANNOT FAIL.
    # #3161 put those variables in scope here as `${{ vars.LOOM_<X>_TAG ||
    # '<default>' }}`, which closed the "not in scope" half and left the harder
    # one open: with the repo variables unset (their normal state) every deploy
    # still proposed the param file's own default over whatever the apps were
    # running. On GCC-High that made the silent-revert gate refuse EVERY
    # scheduled run (#3449); IL5 carries the identical shape and is fixed with
    # it, because a fix on one boundary only is what cloud-parity.md calls
    # INCOMPLETE rather than done.
    #
    # The seventeen literals are GONE and `Adopt the image tags…` below is the
    # SINGLE WRITER of every LOOM_*_TAG, exporting into $GITHUB_ENV the tag each
    # app is ACTUALLY running (or il5.bicepparam's own declared default where
    # there is nothing to preserve). Reading the FILE also retires the hazard
    # this boundary shipped: #3303 wrote `|| 'v0.1'` on all sixteen while SIX of
    # IL5's declared defaults are not v0.1 (loom-console is 'v3.0', which
    # gov-build-images.yml builds expressly for this boundary), silently
    # overriding the param file. A literal cannot drift from a file it does not
    # read.
    #
    # WHY THE REQUEST VARIABLES ARE NOT NAMED `LOOM_*_TAG`. Two independent
    # reasons, either fatal:
    #   1. a job-level `env:` key BEATS a `$GITHUB_ENV` write (GitHub docs,
    #      Variables: "the variable at the lowest level takes precedence"), so
    #      keeping the name here would silently discard every adopted value;
    #   2. `${{ vars.X }}` with X unset is the EMPTY STRING, not absent, and
    #      `readEnvironmentVariable('LOOM_CONSOLE_TAG','v3.0')` returns that
    #      empty string rather than the default — image ref `<acr>/loom-console:`.
    env:
      REQUESTED_LOOM_ACTIVATOR_TAG: ${{ vars.LOOM_ACTIVATOR_TAG }}
      REQUESTED_LOOM_CONSOLE_TAG: ${{ vars.LOOM_CONSOLE_TAG }}
      # loom-directlake (#3291) — a SEPARATE key from LOOM_DIRECTLAKE_TAG below,
      # which pins loom-direct-lake-shim: two apps, two repos.
      REQUESTED_LOOM_DIRECTLAKE_SVC_TAG: ${{ vars.LOOM_DIRECTLAKE_SVC_TAG }}
      REQUESTED_LOOM_DIRECTLAKE_TAG: ${{ vars.LOOM_DIRECTLAKE_TAG }}
      REQUESTED_LOOM_DUCKDB_TAG: ${{ vars.LOOM_DUCKDB_TAG }}
      REQUESTED_LOOM_MAF_TAG: ${{ vars.LOOM_MAF_TAG }}
      REQUESTED_LOOM_MCP_BRIDGE_TAG: ${{ vars.LOOM_MCP_BRIDGE_TAG }}
      REQUESTED_LOOM_MCP_TAG: ${{ vars.LOOM_MCP_TAG }}
      REQUESTED_LOOM_MIGRATE_TAG: ${{ vars.LOOM_MIGRATE_TAG }}
      REQUESTED_LOOM_MIRRORING_TAG: ${{ vars.LOOM_MIRRORING_TAG }}
      REQUESTED_LOOM_ORCHESTRATOR_TAG: ${{ vars.LOOM_ORCHESTRATOR_TAG }}
      REQUESTED_LOOM_RISINGWAVE_TAG: ${{ vars.LOOM_RISINGWAVE_TAG }}
      REQUESTED_LOOM_SCRIPT_RUNNER_TAG: ${{ vars.LOOM_SCRIPT_RUNNER_TAG }}
      REQUESTED_LOOM_SETUP_ORCHESTRATOR_TAG: ${{ vars.LOOM_SETUP_ORCHESTRATOR_TAG }}
      REQUESTED_LOOM_TRINO_TAG: ${{ vars.LOOM_TRINO_TAG }}
      REQUESTED_LOOM_UNITY_TAG: ${{ vars.LOOM_UNITY_TAG }}
      REQUESTED_LOOM_WRANGLER_TAG: ${{ vars.LOOM_WRANGLER_TAG }}

    steps:
      - uses: actions/checkout@v7

      - name: Azure login (Gov sub) — limitlessdata_deploy SP
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment

      - name: Set Azure cloud to Gov
        run: az cloud set --name AzureUSGovernment

      - name: Setup Bicep
        run: az bicep install

      # audit-t157: same "second Console is impossible" invariant as Commercial,
      # enforced at the CI layer. topology=tenant is rejected when an Admin Plane
      # (hub) RG already exists in the target sub; dlz-attach must name a NEW
      # subscription via target_subscription.
      - name: Topology guard
        id: topology_guard
        env:
          INPUT_ALLOW_EXISTING_HUB: ${{ inputs.allow_existing_hub }}
        run: |
          set -e
          TOPOLOGY="${CSA_LOOM_TOPOLOGY:-tenant}"
          echo "topology=$TOPOLOGY"
          if [ "$TOPOLOGY" = "dlz-attach" ]; then
            if [ -z "$CSA_LOOM_TARGET_SUBSCRIPTION" ]; then
              echo "::error::dlz-attach requires target_subscription (the new DLZ subscription)."; exit 1
            fi
          else
            # Scope the hub check to the ACTIVE (deploy) subscription, not the
            # whole tenant, so a deliberate migration to a new hub sub is not
            # blocked by an old hub still running elsewhere as a UAT ring
            # (audit-t156 D3/Q10). Still blocks an accidental double-stamp into
            # the same sub.
            #
            # FAIL CLOSED ON UNKNOWN (deploy-integrity.md R6/R7). The original
            # form ended `2>/dev/null || echo "0"`, which converted an auth
            # failure, a missing resource-graph extension or a throttle into the
            # string "0" — i.e. "no hub exists" — and let a FIRST-RUN tenant
            # stamp proceed against a subscription that might already hold one.
            # An unreadable estate is UNKNOWN, and UNKNOWN must refuse, not guess.
            #
            # REACHABILITY (fixed 2026-08-07). The first fix wrote
            #   if ! EXISTING=$(az graph query … | tr -d '\r'); then
            # which CANNOT FIRE: a pipeline's exit status is the LAST command's,
            # so `tr` (always 0) masked az's failure and the informative branch
            # below was dead code — the assertion-that-cannot-fail class this
            # repo has been burned by repeatedly. Proven with a failing `az`
            # stand-in: BRANCH_TAKEN=no. Capture FIRST, transform AFTER, so the
            # `if !` observes az's own status.
            SCOPE_SUB=$(az account show --query id -o tsv 2>&1) || {
              echo "::error::Could not resolve the active subscription (az account show failed), so the hub-existence check cannot even be scoped. Refusing — under 'set -e' this previously aborted the step with no explanation at all. Detail: ${SCOPE_SUB:-<no output>}"
              exit 1
            }
            SCOPE_SUB=$(printf '%s' "$SCOPE_SUB" | tr -d '\r\n')
            if ! HUB_PROBE_RAW=$(az graph query ${SCOPE_SUB:+--subscriptions "$SCOPE_SUB"} -q "ResourceContainers | where type == 'microsoft.resources/subscriptions/resourcegroups' | where name startswith 'rg-csa-loom-admin-' | project name" --query "data | length(@)" -o tsv 2>&1); then
              echo "::error::Could NOT read the target subscription to determine whether a CSA Loom hub already exists, so the answer is UNKNOWN — not 'none'. Refusing rather than risk stamping a second Console. Resolve the read (Reader on the subscription for the Gov deploy SP, and the resource-graph CLI extension) and re-run. Detail: ${HUB_PROBE_RAW:-<no output>}"
              exit 1
            fi
            EXISTING=$(printf '%s' "$HUB_PROBE_RAW" | tr -d '\r\n')
            # Second, independent gate: even a zero-exit az must return a NUMBER.
            case "$EXISTING" in
              ''|*[!0-9]*)
                echo "::error::The hub-existence probe exited 0 but returned a non-numeric result (${EXISTING:-<empty>}), so whether a hub exists is UNVERIFIED. Refusing."; exit 1 ;;
            esac
            if [ "$EXISTING" != "0" ]; then
              # CLOUD PARITY (.claude/rules/cloud-parity.md) + deploy-integrity R4:
              # brownfield must be a first-class path in BOTH clouds.
              # deploy-fiab-commercial.yml has carried `allow_existing_hub` since
              # audit-t157; the Gov lanes had no equivalent, so once a Gov hub
              # existed this workflow could never succeed again. IL5 is
              # dispatch-only (no cron), so there is no scheduled-reconcile
              # branch here — the operator flag is the whole brownfield path.
              if [ "${INPUT_ALLOW_EXISTING_HUB:-false}" = "true" ]; then
                echo "::notice::A CSA Loom hub already exists in this subscription ($EXISTING rg-csa-loom-admin-* RG) and allow_existing_hub=true — reconciling the EXISTING admin RG incrementally. No second Console is stamped."
              else
                echo "::error::A CSA Loom hub already exists in the target subscription (found $EXISTING rg-csa-loom-admin-* RG). A second Console cannot be stamped into the same sub. To reconcile/retry the EXISTING hub, re-dispatch with allow_existing_hub=true. To add a NEW landing zone, use topology=dlz-attach with target_subscription."; exit 1
              fi
            fi
          fi

      # #3056 — adopt the estate's LIVE internal trust token instead of letting
      # bicep re-mint it (`loomGeneratedSecretSeed` defaults to `newGuid()`, so
      # every deploy rotated it and stranded every holder outside the
      # deployment). On the IL5 AKS boundary the console is not a Container App,
      # so the resolver honestly reports greenfield and warns rather than
      # inventing a value — UNVERIFIED here, see
      # docs/fiab/runbooks/internal-token-ownership.md.
      - name: Adopt the estate's live internal trust token (never re-mint it)
        run: bash scripts/csa-loom/resolve-internal-token.sh --export > /dev/null

      # ── ADOPT THE IMAGE TAGS THIS ESTATE IS RUNNING (#3449) ────────────────
      # THE SINGLE WRITER of every LOOM_*_TAG this job uses, and the same shape
      # as the internal-token step immediately above: resolve the value the
      # estate already carries instead of letting the deploy substitute one.
      # It must run before the first consumer — the what-if an operator
      # approves, the ACR tag assertion, the revert gate and the apply all
      # resolve image tags and must resolve the SAME ones.
      #
      # Read-only (`az containerapp list`). Per key it exports, in order:
      # REQUESTED_LOOM_<X>_TAG when the operator set the repo variable (intent
      # outranks the estate, so a deliberate roll forward is never undone by a
      # reconcile); otherwise the tag the app is ACTUALLY running; otherwise
      # il5.bicepparam's OWN declared default — including loom-console's 'v3.0',
      # read from the file rather than restated in this workflow.
      #
      # It never invents a tag. A digest-pinned app, one repository running at
      # two tags, or a failed query are UNRESOLVED and left at the param default
      # WITHOUT any claim that writing it is safe; the revert gate below decides
      # that from its own independent read.
      #
      # NOT gated on run_mode or topology. `whatif-only` is this lane's DEFAULT
      # and a preview that resolves different tags than the apply is a lying
      # preview (deploy-integrity R7); and "Image preflight — IL5 ACR …"
      # interpolates `${LOOM_DUCKDB_TAG}` bare under `set -u`, so skipping here
      # would abort that step rather than relax anything.
      - name: Adopt the image tags this estate is running (no repo variable required)
        run: |
          set -euo pipefail
          node scripts/ci/adopt-image-tags.mjs \
            --param-file platform/fiab/bicep/params/il5.bicepparam \
            --rg "rg-csa-loom-admin-${AZURE_LOCATION}"

      # ── ADOPT THE DATA LANDING ZONE (#3380) ────────────────────────────────
      #
      # CLOUD PARITY, MEASURED. params/il5.bicepparam:63 reads
      #   param adopt = union(legacyAdoptFromEnv, json(readEnvironmentVariable('LOOM_ADOPT_JSON', '{}')))
      # exactly as commercial.bicepparam does — so the CONSUMER has always been
      # here. The PRODUCER was not: `discover-dlz-adopt-plan` / `LOOM_ADOPT_JSON`
      # appeared 11 times in deploy-fiab-commercial.yml and ZERO times in this
      # lane, in deploy-fiab-gcch and in deploy-fiab-gcc. Brownfield adoption and
      # the cross-subscription grant pass were therefore Commercial-only BY
      # CONSTRUCTION: every sovereign deploy resolved `{}` and behaved as if the
      # estate owned nothing, whatever it actually owned. cloud-parity.md calls
      # that INCOMPLETE, and deploy-integrity.md R5 makes brownfield a
      # first-class path in BOTH clouds, not a Commercial convenience.
      #
      # WHAT AN EMPTY PLAN COSTS. main.bicep composes `loomStorageAccount` from
      # the adopt plan, and the console env array in modules/admin-plane/main.bicep
      # is CONDITIONAL on that string (`!empty(loomStorageAccount) ? [ … ] : []`).
      # An empty binding does not leave the lake variables alone — it REMOVES
      # LOOM_BRONZE_URL, LOOM_SILVER_URL, LOOM_GOLD_URL, LOOM_LANDING_URL,
      # LOOM_CSV_IMPORTS_URL, LOOM_SAMPLE_ADLS and LOOM_RECYCLE_RETENTION_DAYS
      # from a running console (#3701). On a boundary with no Databricks Unity
      # Catalog to fall back to, that is the whole lake story.
      #
      # MUST PRECEDE THE WHAT-IF. `readEnvironmentVariable` resolves at BICEP
      # COMPILE time — i.e. inside `az deployment sub what-if` / `create`, not
      # when this step runs. Exporting it afterwards is a no-op, and a preview
      # that resolves a different adopt plan than the apply is a lying preview
      # (deploy-integrity R7).
      #
      # THE EXIT CODE IS CLASSIFIED, NEVER SWALLOWED (R6/R7). resolve-dlz-
      # coordinates.mjs states the contract this port keeps intact: 0 resolved /
      # 1 not-found / 2 usage / 3 unreadable / 4 ambiguous. A single `|| echo`
      # that collapses all four non-zero codes into one sentence ASSERTS a
      # measurement the script did not make — the defect #3701/#3703 removed from
      # the Commercial lane. UNKNOWN (3) and AMBIGUOUS (4) refuse rather than
      # compose an empty plan; only a MEASURED not-found continues.
      #
      # $AZURE_LOCATION is a workflow-level literal on this lane (usgovvirginia),
      # not a value measured from the estate, so the empty-region trap that made
      # the Commercial nightly discover against `--region ""` cannot occur here.
      # The guard below is kept anyway, because a silent empty region is exactly
      # what produced "adopting: (none)" on every scheduled Commercial run.
      - name: Adopt the DLZ (discover what the estate already owns — #3380)
        id: dlz_adopt
        env:
          ADMIN_SUB: ${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          REGION="${AZURE_LOCATION:-}"
          if [ -z "$REGION" ]; then
            echo "::error::[dlz-adopt] No region is available: \$AZURE_LOCATION is empty. Refusing rather than discovering against no region — that is what silently produced 'adopting: (none)' on the Commercial lane and stripped the lake env vars off the console (#3701)."
            exit 1
          fi
          if [ -z "${ADMIN_SUB:-}" ]; then
            echo "::error::[dlz-adopt] No admin subscription: the AZURE_GOV_SUBSCRIPTION_ID repository secret is empty, so Resource Graph cannot be scoped and NOTHING would be established about this estate. Refusing rather than composing an empty adopt plan."
            exit 1
          fi
          RESOLVED="$RUNNER_TEMP/dlz-coords.env"; : > "$RESOLVED"
          RC=0
          node scripts/csa-loom/resolve-dlz-coordinates.mjs \
            --region "$REGION" \
            --admin-subscription "$ADMIN_SUB" \
            --github-env "$RESOLVED" || RC=$?
          case "$RC" in
            0)
              echo "[dlz-adopt] resolver RESOLVED a landing zone for region '$REGION'."
              ;;
            1)
              # EXIT 1 IS ALSO NODE'S CODE FOR AN UNCAUGHT THROW, so the code
              # alone cannot tell "Resource Graph was read and nothing matched"
              # from "this script died before measuring anything". Require the
              # positive DLZ_STATUS marker the resolver writes on every MEASURED
              # path rather than inferring a measurement from an exit code.
              if grep -q '^DLZ_STATUS=not-found$' "$RESOLVED"; then
                echo "::notice::[dlz-adopt] resolver read Azure Resource Graph SUCCESSFULLY and no landing zone matched region '$REGION'. Continuing without adoption — that is the correct greenfield answer, and it is a measurement, not a fallback."
              else
                echo "::error::[dlz-adopt] resolve-dlz-coordinates exited 1 but did NOT write 'DLZ_STATUS=not-found'. Exit 1 is also node's code for an uncaught throw or a module-load failure, so nothing here establishes that the estate was read. Refusing rather than reporting a greenfield negative nobody measured (#3701/#3703)."
                exit 1
              fi
              ;;
            2)
              echo "::error::[dlz-adopt] resolve-dlz-coordinates exited USAGE (2): this workflow passed it invalid arguments (region='$REGION'). NOTHING was established about the estate. Refusing — continuing would compose an EMPTY adopt plan, and an empty plan does not skip the lake binding, it DELETES the seven LOOM_*_URL/LOOM_SAMPLE_ADLS env vars from the running console (#3701)."
              exit 1
              ;;
            3)
              if [ "${CSA_LOOM_TOPOLOGY:-}" = "dlz-attach" ]; then
                echo "::warning::[dlz-adopt] resolve-dlz-coordinates exited UNREADABLE (3): the Azure Resource Graph query FAILED, so whether this estate has a landing zone is UNKNOWN. Continuing ONLY because topology=dlz-attach deploys no admin plane (main.bicep:1114), so no console env variable can be removed by an empty adopt plan. Discovery still measured nothing — check that the Gov deploy identity can read Resource Graph across this estate's subscriptions."
              else
                echo "::error::[dlz-adopt] resolve-dlz-coordinates exited UNREADABLE (3): the Azure Resource Graph query FAILED, so whether this estate has a landing zone is UNKNOWN — it is NOT 'no'. Refusing rather than deploying an empty adopt plan that would strip the lake env vars off the console. Check that the Gov deploy identity can read Resource Graph across this estate's subscriptions (Reader at the DLZ subscription is the usual gap)."
                exit 1
              fi
              ;;
            4)
              if [ "${CSA_LOOM_TOPOLOGY:-}" = "dlz-attach" ]; then
                echo "::warning::[dlz-adopt] resolve-dlz-coordinates exited AMBIGUOUS (4): more than one landing zone matches region '$REGION' and none was chosen. Continuing ONLY because topology=dlz-attach deploys no admin plane, so nothing can be stripped."
              else
                echo "::error::[dlz-adopt] resolve-dlz-coordinates exited AMBIGUOUS (4): more than one landing zone matches region '$REGION' and this deploy wires exactly one, so NOTHING was chosen. Failing closed. Name the intended DLZ explicitly, or remove the duplicate resource group."
                exit 1
              fi
              ;;
            *)
              echo "::error::[dlz-adopt] resolve-dlz-coordinates exited with the undocumented code $RC. Its contract is 0 resolved / 1 not-found / 2 usage / 3 unreadable / 4 ambiguous, so nothing it printed can be read as a verdict about this estate. Refusing."
              exit 1
              ;;
          esac
          DLZ_SUB="$(grep '^DLZ_SUB=' "$RESOLVED" | tail -1 | cut -d= -f2- || true)"
          DLZ_RG="$(grep  '^DLZ_RG='  "$RESOLVED" | tail -1 | cut -d= -f2- || true)"
          [ -n "${DLZ_SUB:-}" ] && echo "::add-mask::$DLZ_SUB"

          PLAN='{}'
          if [ -n "${DLZ_SUB:-}" ] && [ -n "${DLZ_RG:-}" ]; then
            PLAN="$(bash scripts/csa-loom/discover-dlz-adopt-plan.sh \
                      --dlz-subscription "$DLZ_SUB" --dlz-rg "$DLZ_RG")"
          fi

          # An EXPLICIT plan always wins over a discovered one — the operator
          # said what to adopt, and discovery must not override a deliberate
          # decision. Discovery only fills keys nobody chose.
          if [ -n "${LOOM_ADOPT_JSON:-}" ] && [ "${LOOM_ADOPT_JSON}" != "{}" ]; then
            PLAN="$(PLAN="$PLAN" EXPLICIT="$LOOM_ADOPT_JSON" python -c 'import json,os; d=json.loads(os.environ["PLAN"]); d.update(json.loads(os.environ["EXPLICIT"])); print(json.dumps(d,separators=(",",":")))')"
            echo "::notice::[dlz-adopt] merged discovery UNDER the explicitly supplied LOOM_ADOPT_JSON (explicit wins)."
          fi

          echo "LOOM_ADOPT_JSON=$PLAN" >> "$GITHUB_ENV"
          KEYS="$(PLAN="$PLAN" python -c 'import json,os; print(",".join(sorted(json.loads(os.environ["PLAN"]))) or "(none)")')"
          echo "::notice::[dlz-adopt] adopting: $KEYS"
          echo "adopted=$KEYS" >> "$GITHUB_OUTPUT"

      # ── ADX MUST BE RUNNING BEFORE WHAT-IF **AND** THE APPLY (#3883, #3449) ──
      # admin-plane/adx-cluster.bicep declares two
      # `Microsoft.Kusto/clusters/principalAssignments` children (the Console
      # UAMI's AllDatabasesAdmin and the Activator's AllDatabasesViewer). Those
      # are ADX DATA-plane roles, so the Kusto RP must reach the engine to write
      # them — and on a STOPPED cluster it cannot:
      #
      #   ClusterNotValidForPrincipals on '<cluster>/console-uami-alldatabasesadmin':
      #   [BadRequest] Cluster is in state 'Stopped', cannot retrieve list of principals
      #
      # THIS LANE CARRIES #3449 UNMITIGATED. Measured on this tree:
      # params/il5.bicepparam:366 sets `param adxEnabled = true`, this workflow
      # runs `az deployment sub what-if`, adx-cluster.bicep sets
      # `enableAutoStop: true` unconditionally (L124) — and there was no ADX
      # preflight anywhere in the file. deploy-fiab-il5 has NEVER RUN, so this is
      # a CODE-IDENTITY fix rather than a measured-failure fix, and it is stated
      # as such: the defect is the same defect in the same template, and leaving
      # it would mean enabling this lane onto a deploy path already known to fail
      # the moment its cluster idles. Per cloud-parity.md a fix on one boundary
      # only is INCOMPLETE rather than done.
      #
      # ORDERING IS THE ENTIRE CONTENT OF #3449. `az deployment sub what-if`
      # EVALUATES those principalAssignment leaves, so it hits
      # ClusterNotValidForPrincipals and exits 1 BEFORE any step that merely
      # precedes the apply. #3779 shipped this remediation for GCC-High placed
      # just above `Provision`, and deploy-fiab-gcch still failed 6/6 daily
      # scheduled runs with the script present and wired the whole time, because
      # the what-if sat six steps above it (#3880). A preflight must precede the
      # first step that READS the resource, not the first that WRITES it.
      #
      # THE TRIGGER CONDITION DIFFERS FROM GCC-HIGH'S, DELIBERATELY. That lane
      # reads `github.event_name == 'schedule' || inputs.run_mode == 'full'`
      # because it has a cron; this lane is workflow_dispatch-ONLY (no `schedule:`
      # key above), so `schedule` can never be true here and the clause would be
      # dead weight that implies a trigger this workflow does not have. The
      # PROPERTY is preserved exactly: it runs on the same trigger as the apply,
      # so a whatif-only DRY RUN never mutates the estate. Same stated residual as
      # GCC-High — a dry run against a stopped cluster still fails what-if, which
      # is the correct trade because starting a cluster is a mutation.
      - name: ADX preflight — a stopped cluster cannot take its principal assignments (#3883)
        if: inputs.run_mode == 'full'
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          # dlz-attach deploys no admin plane, so it declares no principal
          # assignments on the hub cluster and has nothing to start.
          if [ "${CSA_LOOM_TOPOLOGY:-}" = "dlz-attach" ]; then
            echo "::notice::topology=dlz-attach deploys no admin-plane ADX cluster; nothing to start."
            exit 0
          fi
          DEPLOY_SUB="${CSA_LOOM_TARGET_SUBSCRIPTION:-$AZURE_SUBSCRIPTION_ID}"
          if [ -z "$DEPLOY_SUB" ]; then
            echo "::error::No target subscription, so the estate's ADX cluster cannot be located. It comes from the AZURE_GOV_SUBSCRIPTION_ID repository secret; it is empty."
            exit 1
          fi
          node scripts/ci/ensure-adx-cluster-running.mjs \
            --subscription "$DEPLOY_SUB" \
            --rg "rg-csa-loom-admin-${AZURE_LOCATION}"

      # #3161 round 2 — THE PREVIEW MUST RESOLVE THE SAME TAGS AS THE APPLY.
      # `whatif-only` is this lane's DEFAULT run_mode, so this step's output IS
      # the artifact an operator reads before approving a full run, and it
      # resolved `appImageTags` from a different source than the apply. Both now
      # read the $GITHUB_ENV `Adopt the image tags…` writes above (#3449).
      - name: Bicep what-if (IL5 params)
        run: |
          az deployment sub what-if \
            --name csa-loom-il5-ci-${{ github.run_id }} \
            --location $AZURE_LOCATION \
            ${CSA_LOOM_TARGET_SUBSCRIPTION:+--subscription "$CSA_LOOM_TARGET_SUBSCRIPTION"} \
            --template-file platform/fiab/bicep/main.bicep \
            --parameters platform/fiab/bicep/params/il5.bicepparam \
            --parameters adminEntraGroupId=${{ secrets.FIAB_GOV_ADMIN_GROUP_ID }} \
            --parameters loomTenantAdminGroupId=${{ secrets.FIAB_GOV_ADMIN_GROUP_ID }} \
            ${LOOM_INTERNAL_TOKEN:+--parameters loomInternalTokenValue="$LOOM_INTERNAL_TOKEN"} \
            --parameters topology="$CSA_LOOM_TOPOLOGY" \
            ${CSA_LOOM_TARGET_SUBSCRIPTION:+--parameters targetSubscriptionId="$CSA_LOOM_TARGET_SUBSCRIPTION"}

      - name: Deploy-verification evidence receipt (§7)
        # Captures the IL5 deploy-verification acceptance receipt as an artifact:
        # deterministic ARM tests + sovereign-endpoint sweep + the §4 host matrix,
        # plus a live what-if line (we are already on the Gov sub + bicep here).
        # Honestly records the live full-stack smoke as BLOCKED by runbook gap #2
        # until the in-repo AKS workload deployment for the Loom apps lands.
        # Never fails the job (|| true) — the receipt is evidence, not a gate.
        run: |
          bash scripts/csa-loom/gov-verify-evidence.sh \
            --boundary il5 --live \
            --out "$RUNNER_TEMP/gov-verify-receipt-il5-${{ github.run_id }}.txt" || true

      - name: Upload IL5 verification receipt
        uses: actions/upload-artifact@v7
        with:
          name: gov-verify-receipt-il5-${{ github.run_id }}
          path: ${{ runner.temp }}/gov-verify-receipt-il5-${{ github.run_id }}.txt
          if-no-files-found: warn

      # ── IMAGE PREFLIGHT (round-3, PR #2640) ───────────────────────────────
      # Same contract as deploy-fiab-gcch.yml. admin-plane/main.bicep now creates
      # `loom-duckdb` by default from `<acr>/loom-duckdb:${appImageTags.duckdb}`
      # (LOOM_DUCKDB_TAG, default v0.1). The IL5 producer
      # (.github/workflows/gov-provision-dataplane-images.yml, boundary=il5) has
      # NEVER been executed. Prove the tags exist before a deploy that adopts a
      # live estate — or refuse. --skip-if-registry-absent keeps the genuine
      # from-scratch path (no ACR yet, nothing to adopt) working.
      - name: Image preflight — IL5 ACR must already hold every referenced tag
        if: inputs.run_mode == 'full'
        # The LOOM_*_TAG values this step reads come from `Adopt the image
        # tags…` (#3449) — the same $GITHUB_ENV the what-if and the apply read.
        # They were once declared here, on this step only, so a pinned repo
        # variable was asserted by the preflight and then resolved differently
        # by the deploy: the preflight passing READ AS "the pin took effect"
        # when it had not. They are interpolated BARE under `set -u`, which is
        # why the adopter exports a value for every declared tag rather than
        # only the running ones — an unexported variable would abort this step.
        run: |
          set -uo pipefail
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          # R7 (#3090): see the long note in deploy-fiab-commercial.yml. The
          # discovery read used to be `2>/dev/null` + `[ -z "$ACR" ] && exit 0`,
          # so an unreadable control plane was reported as "from-scratch deploy,
          # nothing live to adopt" and the entire image gate was SKIPPED on a
          # LIVE sovereign estate. `az acr list` on a missing RG exits non-zero;
          # an existing-but-empty RG exits 0. Keep the two facts apart.
          set +e
          ACR_OUT=$(az acr list -g "$RG" --query "[?starts_with(name,'acrloom')]|[0].name" -o tsv 2>&1)
          ACR_RC=$?
          set -e
          if [ $ACR_RC -ne 0 ]; then
            if node scripts/ci/deploy-classify.mjs --text "$ACR_OUT" \
                 --assert-signal config.resource-group-not-found >/dev/null 2>&1; then
              echo "::notice::image-preflight: ARM answered ResourceGroupNotFound for $RG — from-scratch deploy, nothing live to adopt. Skipping."
              exit 0
            fi
            echo "::error::image-preflight: could NOT enumerate registries in $RG, so it is NOT established whether this estate has an ACR. Refusing to treat an unreadable control plane as 'nothing to adopt' and skip the gate. $(node scripts/ci/deploy-classify.mjs --text "$ACR_OUT" --query)"
            exit 1
          fi
          ACR=$(printf '%s' "$ACR_OUT" | tr -d '\r' | head -1)
          [ "$ACR" = "None" ] && ACR=""
          if [ -z "$ACR" ]; then
            echo "::notice::image-preflight: ARM ANSWERED and $RG contains no acrloom* registry — from-scratch deploy, nothing live to adopt. Skipping."
            exit 0
          fi
          # loom-unity joined this list in #2681: admin-plane/main.bicep now
          # deploys the Unity-Catalog-compatible OSS metastore DEFAULT-ON on
          # every boundary, so an IL5 deploy pulls `loom-unity:$LOOM_UNITY_TAG`
          # and — on an estate that already runs one — ADOPTS the live catalog.
          # Databricks Unity Catalog has no Gov endpoint, so that app is the only
          # catalog IL5 has; repointing it at an absent tag is an outage. The
          # producer is .github/workflows/gov-build-images.yml (apps=loom-unity).
          #
          # `${VAR:?msg}`, not a bare `${VAR}`. These names are produced by the
          # adopt step's $GITHUB_ENV write, so a bare read under `set -u` would
          # abort here with the shell's terse "unbound variable" if adoption
          # were ever skipped or errored — and an empty expansion would send
          # `loom-duckdb:` to the registry probe. The `:?` form fails CLOSED and
          # names the producer that should have run (deploy-integrity R6).
          bash scripts/ci/assert-acr-image-tags.sh --acr "$ACR" --rg "$RG" --lease \
            --skip-if-registry-absent \
            "loom-duckdb:${LOOM_DUCKDB_TAG:?not exported — the 'Adopt the image tags this estate is running' step must run before this preflight (#3449)}" \
            "loom-unity:${LOOM_UNITY_TAG:?not exported — the 'Adopt the image tags this estate is running' step must run before this preflight (#3449)}"

      # svc-loom-unity-authz (round 2) — DURABILITY. IL5 already passes
      # LOOM_GOV_MSAL_CLIENT_ID, but that secret can be unset/stale while the
      # estate has a real registration; an empty render blanks sign-in AND
      # re-SEALS the Loom Unity catalog on every reconcile. Prefer the estate's
      # own record (Key Vault → live Console app), fall back to the secret.
      - name: Resolve the existing MSAL client id (Loom Unity audience durability)
        if: inputs.run_mode == 'full'
        env:
          LOOM_GOV_MSAL_CLIENT_ID: ${{ secrets.LOOM_GOV_MSAL_CLIENT_ID }}
        run: |
          set -euo pipefail
          CID="$(bash scripts/csa-loom/resolve-msal-client-id.sh --rg "rg-csa-loom-admin-${AZURE_LOCATION}" || true)"
          if [ -z "${CID:-}" ]; then CID="${LOOM_GOV_MSAL_CLIENT_ID:-}"; fi
          echo "LOOM_RESOLVED_MSAL_CLIENT_ID=${CID}" >> "$GITHUB_ENV"
          if [ -z "${CID:-}" ]; then
            echo "::warning::No Entra app registration for this estate yet — sign-in stays unconfigured until csa-loom-post-deploy-bootstrap runs."
          fi

      # The ADOPTED-IMAGE PREFLIGHT for this lane lives inside
      # scripts/csa-loom/redeploy-gov.sh, not here, and fires only on
      # the --skip-teardown (reconcile) path. Reason: this step's default mode
      # TEARS THE ESTATE DOWN first, so nothing is adopted and a missing tag is
      # the normal post-teardown state; a preflight here would fail the nightly
      # ring for a non-problem. The dlz-attach branch below targets a brand-new
      # subscription, which is greenfield by definition.
      # ── SILENT-REVERT GATE (#3161, the runtime half) ────────────────────────
      # Same gate as the gcc-high lane, on the same boundary-parity reasoning.
      # Having the tag in scope is necessary and NOT sufficient: in scope with
      # the param default is exactly the state that reverts a pinned app. This
      # reads what the estate is ACTUALLY running (read-only
      # `az containerapp list`) and refuses only the state nobody chose — a
      # default-sourced tag about to overwrite an app running something else.
      #
      # SCOPED TO THE RECONCILE PATH. With keep_resources=false this lane TEARS
      # THE ESTATE DOWN before redeploying, so nothing is adopted and a
      # different (or missing) running tag is the normal post-teardown state —
      # gating there would fail the ring for a non-problem, the same reasoning
      # that keeps the adopted-image preflight inside redeploy-gov.sh's
      # --skip-teardown branch.
      - name: Image-tag revert gate — never flatten a pinned app to the default
        if: inputs.run_mode == 'full' && inputs.keep_resources && inputs.topology != 'dlz-attach'
        run: |
          set -euo pipefail
          node scripts/ci/assert-no-silent-image-tag-revert.mjs \
            --param-file platform/fiab/bicep/params/il5.bicepparam \
            --rg "rg-csa-loom-admin-${AZURE_LOCATION}"

      # ── RE-PIN TO WHAT IS RUNNING RIGHT NOW (#3683, the #3676 re-pin half) ──
      #
      # CLOUD PARITY, MEASURED. `pin-refresh` appeared 5 times in
      # deploy-fiab-commercial.yml and ZERO times in this lane and in
      # deploy-fiab-gcch. #3676 is a RACE, and the race is not Commercial-only:
      # `Adopt the image tags…` reads the estate near the TOP of this job, the
      # apply happens many minutes later, and any console/data-plane roll that
      # lands in between leaves this deploy about to write a tag that was current
      # when it was measured and is stale by the time ARM sees it. Re-reading
      # immediately before the apply narrows that window to seconds.
      #
      # IT REACHES THE APPLY WITHOUT TOUCHING ANY ARGUMENT LIST. pin-refresh
      # writes `LOOM_<APP>_TAG=<running>` to $GITHUB_ENV, and
      # params/il5.bicepparam resolves `readEnvironmentVariable('LOOM_*_TAG', …)`
      # at BICEP-COMPILE time — i.e. inside `az deployment sub create`, which is
      # also true through scripts/csa-loom/redeploy-gov.sh on the reconcile path,
      # since the env is inherited by the child process. That is what makes a
      # late re-pin possible at all.
      #
      # ONLY PINNED KEYS ARE EMITTED. A key with nothing running is left to the
      # param file's own default on purpose — there is no running image to
      # preserve and inventing one would be a guess. `vanished` is reported as a
      # notice, not a refusal: writing the tag an app is no longer running
      # CREATES it, which is not a revert.
      #
      # UNREADABLE IS NOT EMPTY. stdout and stderr are captured SEPARATELY and
      # neither is discarded: `2>&1` would splice az's warnings into the JSON and
      # `2>/dev/null` is what once turned a permission denial into an empty
      # string and then into a false claim (R7). A failed list is handed to
      # `--read-error` so the policy decides, rather than being read as "no apps
      # are running".
      #
      # IT IS THE LAST STEP BEFORE THE APPLY, AND THAT IS AN INVARIANT, NOT A
      # PREFERENCE. roll-race.test.mjs asserts ADJACENCY on the Commercial lane —
      # `Re-pin appImageTags…` must be the step IMMEDIATELY before the apply,
      # because "a measurement is only as fresh as the last thing that happens
      # before it is used". The revert gate above therefore sits ABOVE this step
      # rather than between it and the apply: the gate does its own
      # `az containerapp list` and registry reads, and its duration would be added
      # straight onto the staleness of this pin. The ACR lease step caused exactly
      # that defect on Commercial once, with a bounded wait of EIGHT MINUTES.
      #
      # The gate's verdict survives this step. pin-refresh only ever moves a tag
      # TOWARD what is currently running, so it cannot manufacture the one state
      # the gate refuses (a param-file DEFAULT about to overwrite a live app
      # running something else) — it can only make the write more conservative.
      #
      # SCOPED TO THE RECONCILE PATH, like the gate below it. With
      # keep_resources=false this lane TEARS THE ESTATE DOWN before redeploying,
      # so nothing is running to re-pin to and a stale pin cannot be written over
      # a live app.
      - name: Re-pin appImageTags to the RUNNING images (narrows the roll race — #3683)
        id: repin
        if: inputs.run_mode == 'full' && inputs.keep_resources && inputs.topology != 'dlz-attach'
        run: |
          set -uo pipefail
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          CONTAINERS="$RUNNER_TEMP/repin-containers.json"
          LIST_ERR="$RUNNER_TEMP/repin-list.err"
          : > "$LIST_ERR"

          # Truncation uses parameter expansion, never `| head -c`. GitHub runs
          # `run:` under `bash -e` and `pipefail` is set above, so `cmd | head -c N`
          # kills `cmd` with SIGPIPE on any input longer than N and takes the whole
          # STEP down — a guard that aborts on the error path it exists to report
          # is a guard that never reports.
          trim400() { local s; s="$(tr '\n' ' ' < "$1")"; printf '%s' "${s:0:400}"; }

          set +e
          az containerapp list -g "$RG" \
            --query '[].{name:name, image:properties.template.containers[0].image}' \
            -o json > "$CONTAINERS" 2> "$LIST_ERR"
          LIST_RC=$?
          set -e
          if [ $LIST_RC -ne 0 ]; then
            node scripts/ci/reconcile-policy.mjs pin-refresh \
              --deploy-apps-enabled true \
              --read-error "az containerapp list exited ${LIST_RC}: $(trim400 "$LIST_ERR")"
            exit $?
          fi
          if [ -s "$LIST_ERR" ]; then
            echo "::warning::pin-refresh: az wrote to stderr while SUCCEEDING; recording it rather than hiding it: $(trim400 "$LIST_ERR")"
          fi
          node scripts/ci/reconcile-policy.mjs pin-refresh \
            --deploy-apps-enabled true --containers "$CONTAINERS"

      - name: Teardown -> redeploy -> smoke (full mode only)
        # `id` added by #3714 so the ACR compliance-tag step below can gate on
        # this step having actually SUCCEEDED, rather than inferring it from the
        # run_mode input (which says what was ASKED for, not what happened).
        id: provision
        if: inputs.run_mode == 'full'
        env:
          FIAB_GOV_ADMIN_GROUP_ID: ${{ secrets.FIAB_GOV_ADMIN_GROUP_ID }}
          LOOM_MSAL_CLIENT_ID: ${{ env.LOOM_RESOLVED_MSAL_CLIENT_ID }}
          LOOM_MSAL_CLIENT_SECRET: ${{ secrets.LOOM_GOV_MSAL_CLIENT_SECRET }}
          # #3161 — il5.bicepparam reads sixteen image tags with
          # readEnvironmentVariable() and they were absent here, so every full
          # IL5 deploy would have fallen back to the default and rewritten
          # loom-unity / iceberg-catalog / loom-trino off any pinned tag,
          # silently. Same defect as the gcc-high lane; fixed in both, because a
          # fix in one boundary only is exactly what cloud-parity.md calls
          # INCOMPLETE rather than done. #3161 put them in scope; #3449 made the
          # deploy MEASURE them — `Adopt the image tags…` writes all seventeen
          # into $GITHUB_ENV from the running estate, shared with the what-if,
          # so the preview and the apply cannot resolve different tags and
          # neither of them needs an operator to type one.
          #
          # keep_resources=true (the default) RECONCILES in place; false is an
          # explicit teardown->redeploy. Empty string = no flag = teardown.
          SKIP_TEARDOWN_FLAG: ${{ inputs.keep_resources && '--skip-teardown' || '' }}
        run: |
          set -e
          # RETRY WITH CLASSIFICATION (#3017, deploy-integrity R6): same harness
          # as Commercial — bounded retry of transient/eventual-consistency only,
          # fail-closed on exhaustion, classified deploy-failure.json artifact,
          # ARM leaf drill-down on the direct deployment.
          if [ "$CSA_LOOM_TOPOLOGY" = "dlz-attach" ]; then
            # dlz-attach adds ONE DLZ to an existing hub — it must NOT teardown the
            # hub (redeploy-gov.sh is teardown->redeploy and would wipe it). Deploy
            # the DLZ directly INTO the new target sub so subscription() resolves to
            # it (per main.bicep's dlz-attach scope), mirroring Commercial.
            node scripts/ci/deploy-retry.mjs \
              --class-allow transient,eventual-consistency \
              --max-attempts 4 --backoff 45 --jitter 0.3 --wall-clock 110m \
              --step "az deployment sub create (il5 $CSA_LOOM_TOPOLOGY)" \
              --artifact "$GITHUB_WORKSPACE/deploy-failure.json" \
              --remediate \
              --arm-deployment "csa-loom-il5-ci-${{ github.run_id }}" --arm-scope sub \
              --arm-subscription "$CSA_LOOM_TARGET_SUBSCRIPTION" \
              -- az deployment sub create \
              --name csa-loom-il5-ci-${{ github.run_id }} \
              --location "$AZURE_LOCATION" \
              --subscription "$CSA_LOOM_TARGET_SUBSCRIPTION" \
              --template-file "$GITHUB_WORKSPACE/platform/fiab/bicep/main.bicep" \
              --parameters "$GITHUB_WORKSPACE/platform/fiab/bicep/params/il5.bicepparam" \
              --parameters adminEntraGroupId="$FIAB_GOV_ADMIN_GROUP_ID" \
              --parameters loomTenantAdminGroupId="$FIAB_GOV_ADMIN_GROUP_ID" \
              ${LOOM_INTERNAL_TOKEN:+--parameters loomInternalTokenValue="$LOOM_INTERNAL_TOKEN"} \
              --parameters topology="$CSA_LOOM_TOPOLOGY" \
              --parameters targetSubscriptionId="$CSA_LOOM_TARGET_SUBSCRIPTION"
          else
            # redeploy-gov.sh is a full teardown->redeploy: idempotent but not
            # cheap, so 2 attempts — the value here is the CLASSIFIED artifact
            # and the honest final message, not the second try.
            # Array, not an unquoted variable: quoting "$SKIP_TEARDOWN_FLAG"
            # directly would pass an EMPTY ARGUMENT when keep_resources=false,
            # and leaving it unquoted is SC2086. An empty array expands to
            # nothing at all (bash 4.4+), which is the behaviour we want.
            RG_ARGS=()
            [ -n "${SKIP_TEARDOWN_FLAG:-}" ] && RG_ARGS+=("${SKIP_TEARDOWN_FLAG}")
            node scripts/ci/deploy-retry.mjs \
              --class-allow transient,eventual-consistency \
              --max-attempts 2 --backoff 60 --jitter 0.3 --wall-clock 110m \
              --step "redeploy-gov.sh (il5 reconcile-or-redeploy)" \
              --artifact "$GITHUB_WORKSPACE/deploy-failure.json" \
              --remediate \
              -- bash scripts/csa-loom/redeploy-gov.sh --boundary il5 --yes "${RG_ARGS[@]}"
          fi

      # ── ACR COMPLIANCE TAGS — APPLIED HERE, NOT BY THE TEMPLATE (#3714) ────
      # CLOUD PARITY: identical to the step in deploy-fiab-commercial.yml. The
      # admin-plane ACR carries the firewall-lease mutex as out-of-band ARM tags
      # (`loomAcrFw*`), so the template cannot own its tag dictionary:
      #   #3676  `tags: complianceTags` PUT-replaced the dict and erased the live
      #          lease mid-apply, denying an in-flight `az acr build`.
      #   #3714  a declarative `Microsoft.Resources/tags` resource read its OWN
      #          id and ARM rejected the whole template with "Circular dependency
      #          detected", breaking every `az deployment sub create`.
      # `az tag update --operation Merge` adds the keys server-side and touches
      # nothing else. This lane's tag set (Environment=IL5, DISA_IL=IL5,
      # Data_Classification=CUI-SP, M365_Boundary=IL5, …) comes from
      # il5.bicepparam, so it cannot drift from what the deployment used.
      - name: Apply ACR compliance tags (merge-patch, out-of-band — #3714)
        if: steps.provision.conclusion == 'success'
        run: |
          set -uo pipefail
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          ACR_ERR="$RUNNER_TEMP/acr-tag-resolve.err"
          : > "$ACR_ERR"
          ACR=$(az acr list -g "$RG" --query "[?starts_with(name,'acrloom')]|[0].name" -o tsv 2> "$ACR_ERR" | tr -d '\r')
          ACR_RC=$?
          if [ "$ACR_RC" -ne 0 ]; then
            echo "::error::Could not LIST registries in $RG (az exited $ACR_RC), so whether this estate has an ACR to tag is UNKNOWN. Raw stderr:"
            sed -n '1,20p' "$ACR_ERR" >&2
            exit 1
          fi
          if [ -z "$ACR" ]; then
            echo "::error::Provision succeeded but no 'acrloom*' registry exists in $RG. The admin-plane ACR is not optional."
            exit 1
          fi
          bash scripts/csa-loom/apply-acr-compliance-tags.sh \
            --acr "$ACR" \
            --params-file platform/fiab/bicep/params/il5.bicepparam

      - name: Export bootstrap coordinates (for the chained Gov bootstrap)
        id: bootstrap_coords
        # IL5 `full` runs teardown->redeploy and LEAVES the stack up, so the
        # bootstrap chains after it on the tenant (console-bearing) path.
        if: inputs.run_mode == 'full' && inputs.topology != 'dlz-attach'
        run: |
          ADMIN_SUB=$(az account show --query id -o tsv)
          echo "admin_sub=$ADMIN_SUB" >> "$GITHUB_OUTPUT"
          # dlz_sub ONLY when a DISTINCT DLZ subscription was named (#3143) —
          # same reasoning as deploy-fiab-commercial.yml. Defaulting to
          # $ADMIN_SUB asserted a single-subscription layout the deploy had not
          # established, and now that the callee DISCOVERS the landing zone that
          # assertion would narrow discovery to the wrong subscription.
          echo "dlz_sub=${CSA_LOOM_TARGET_SUBSCRIPTION:-}" >> "$GITHUB_OUTPUT"
          echo "region=$AZURE_LOCATION" >> "$GITHUB_OUTPUT"

      - name: Note dry-run completion
        if: success() && inputs.run_mode == 'whatif-only'
        run: echo "✅ whatif-only run complete. IL5 Bicep + auth validated; no resources provisioned."

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v9
        env:
          # Parameterized: set the repo/org variable FIAB_GOV_DEPLOY_TRACKING_ISSUE
          # to an OPEN tracking issue. Previously hard-coded to #279 ("CSA Loom — v1
          # build roadmap"), which is CLOSED and generic — comments there were lost.
          # When unset, the step logs a warning instead of posting (the job is still
          # marked failed by `if: failure()`).
          TRACKING_ISSUE: ${{ vars.FIAB_GOV_DEPLOY_TRACKING_ISSUE }}
        with:
          script: |
            const issue = parseInt(process.env.TRACKING_ISSUE || '', 10);
            const body = `❌ deploy-fiab-il5 failed in run ${context.runId}. Federal CSU should investigate.`;
            if (Number.isInteger(issue) && issue > 0) {
              await github.rest.issues.createComment({
                issue_number: issue,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              core.warning('FIAB_GOV_DEPLOY_TRACKING_ISSUE repo variable not set — skipping issue comment. ' + body);
            }

  # rel-T32 (B8): IL5 post-deploy bootstrap — the SAME reusable bootstrap the
  # Commercial + GCC-High workflows call, boundary=IL5 (az cloud set
  # AzureUSGovernment + AZURE_GOV_* login + Gov BYO-MSAL secret). IL5 `full`
  # leaves the redeployed stack up, so the bootstrap chains after a tenant
  # (console-bearing) full run. dlz-attach adds no console → no bootstrap.
  post-deploy-bootstrap:
    name: Post-deploy bootstrap (IL5)
    needs: deploy-validate
    if: ${{ inputs.run_mode == 'full' && inputs.topology != 'dlz-attach' && needs.deploy-validate.result == 'success' }}
    uses: ./.github/workflows/csa-loom-post-deploy-bootstrap.yml
    secrets: inherit
    with:
      boundary: IL5
      region: ${{ needs.deploy-validate.outputs.region }}
      admin_subscription: ${{ needs.deploy-validate.outputs.admin_sub }}
      dlz_subscription: ${{ needs.deploy-validate.outputs.dlz_sub }}
