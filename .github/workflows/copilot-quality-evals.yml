name: copilot-quality-evals

# E4 (PRPs/active/loom-next-level/ws-copilot-cost.md) — the in-product Copilot
# quality-eval trigger + gate. NEW name on purpose: the legacy copilot-evals.yml
# covers the Python apps/copilot (pydantic-ai DryRunAgent), NOT this harness.
#
# What it does:
#   1. stages the corpus (manifest = corpusCommit + counts) and lints the E1
#      golden sets — fail-fast BEFORE spending any judge tokens;
#   2. starts ONE execution of the in-VNet `loom-copilot-evaluator` Container
#      App Job with the requested surfaces, waits for it to finish, and lifts
#      the `::eval-run::{json}` receipt out of its console logs (B-FN,
#      2026-07-27: the evaluator was a Y1 Function with an HTTP trigger; Y1 is
#      structurally broken on this estate, and a job has no ingress. A job also
#      has no ~230s load-balancer response ceiling, so ONE execution now covers
#      every surface instead of one POST per surface);
#   3. gates the merged artifact with scripts/csa-loom/check-eval-regression.mjs
#      (E3): below-floor = fail; > EVAL_REGRESSION_DELTA-point one-run drop
#      above floor = warn; judge-'deferred' = no-change (E2 cap contract);
#   4. sticky PR comment with the per-surface score/delta table + uploads the
#      run artifact (the NEXT run downloads it as the delta baseline).
#
# Change gating: the corpus paths below ARE the change filter — CI runners are
# fresh, so stage-copilot-corpus.sh has no incremental baseline to diff against
# (its .corpus-manifest.json 'copied' count is always the full tree here); the
# nightly schedule runs unconditionally with --strict-missing.
#
# Token spend: bounded by E2's LOOM_COPILOT_EVAL_JUDGE_DAILY_CAP (default 500
# judged Q/day, Cosmos-ledgered cross-replica) — a busy docs day degrades to
# judge-'deferred' retrieval-only scoring, never uncapped spend (round-3 F1).
#
# Per-cloud: Commercial-first (centralus estate). Gov rides the same script
# against the .us job via the csa-loom-gov-deploy SP (tracked follow-up —
# see the PR's per-cloud table). IL5: in-enclave scheduled task replaces
# GitHub-hosted cron (design note in ws-copilot-cost.md E4).

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'PRPs/active/**'
      - 'PRPs/completed/csa-loom-pillar/**'
      - 'content/evals/**'
      - '.github/workflows/copilot-quality-evals.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'PRPs/active/**'
      - 'PRPs/completed/csa-loom-pillar/**'
      - 'content/evals/**'
  schedule:
    # Nightly full run (UTC). Offset from the Function's own 07:00 timer so the
    # two runs don't share a burst window against the AOAI judge TPM.
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      surfaces:
        description: 'Comma-separated surface subset (default: every content/evals/*.jsonl)'
        type: string
        required: false
      region:
        description: 'Azure region of the target Admin Plane'
        type: string
        default: centralus

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # sticky PR comment with per-surface deltas
  actions: read # download the previous run artifact (delta baseline)

env:
  AZURE_LOCATION: ${{ inputs.region || 'centralus' }}

jobs:
  evals:
    name: Run + gate Copilot quality evals
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Secrets (Azure SP) are required to reach the Function — fork PRs have
    # none; run only for same-repo events.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage corpus + lint eval sets (fail-fast before any token spend)
        id: stage
        run: |
          set -euo pipefail
          bash scripts/csa-loom/stage-copilot-corpus.sh
          node scripts/csa-loom/lint-eval-sets.mjs
          COMMIT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('apps/fiab-console/copilot-corpus/.corpus-manifest.json','utf-8')).sourceCommit || 'unknown')")
          echo "corpus_commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "::notice::corpus manifest commit $COMMIT"

      - name: Azure login
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Discover the copilot-evaluator job (honest-gate if absent)
        id: func
        run: |
          set -euo pipefail
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          JOB=loom-copilot-evaluator
          if ! az containerapp job show -g "$RG" -n "$JOB" >/dev/null 2>&1; then
            # G2-honest gate, not a red X: the svc-copilot-evaluator gate names
            # the bicep module that deploys it. Nightly runs surface this as a
            # warning until the job exists.
            echo "::warning::copilot-evaluator job ($JOB) not found in $RG - svc-copilot-evaluator gate unresolved. Deploy platform/fiab/bicep/modules/admin-plane/copilot-evaluator-job.bicep and build its image with scripts/csa-loom/deploy-copilot-evaluator-job.sh. Skipping the eval run."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "rg=$RG" >> "$GITHUB_OUTPUT"
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "::notice::Container App Job $JOB in $RG"

      - name: Run evals (start ONE job execution; lift the run receipt from its logs)
        id: run
        if: steps.func.outputs.found == 'true'
        run: |
          set -uo pipefail
          RG='${{ steps.func.outputs.rg }}'
          JOB='${{ steps.func.outputs.job }}'
          # 'corpus' when a corpus change triggered us; anything else is
          # 'manual' (the nightly schedule is the job's own cron).
          case '${{ github.event_name }}' in
            push|pull_request) TRIGGER=corpus ;;
            *) TRIGGER=manual ;;
          esac
          SURFACES='${{ inputs.surfaces }}'
          if [ -z "$SURFACES" ]; then
            SURFACES=$(ls content/evals/*.jsonl | xargs -n1 basename | sed 's/\.jsonl$//' | grep -v '^_' | paste -sd, -)
          fi
          echo "surfaces: $SURFACES (trigger $TRIGGER)"
          echo '{"ok":false,"surfaces":[]}' > eval-run.json

          # Start ONE execution with the run knobs overridden. Unlike the
          # retired HTTP trigger there is no ~230s response ceiling, so a single
          # execution covers every surface.
          EXEC=$(az containerapp job start -g "$RG" -n "$JOB" \
            --env-vars "COPILOT_EVAL_MODE=copilot" "COPILOT_EVAL_TRIGGER=$TRIGGER" "COPILOT_EVAL_SURFACES=$SURFACES" \
            --query name -o tsv 2>/dev/null | tr -d '\r' || true)
          if [ -z "$EXEC" ]; then
            echo "::warning::could not start a $JOB execution (the image may not be built yet, or the CI principal lacks Contributor on the job) - skipping the eval run."
            echo "started=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::execution $EXEC started"
          echo "started=true" >> "$GITHUB_OUTPUT"

          # Poll for completion (replicaTimeout is 45 min; cap the wait at 50).
          STATUS=Running
          for _ in $(seq 1 200); do
            sleep 15
            STATUS=$(az containerapp job execution show -g "$RG" -n "$JOB" --job-execution-name "$EXEC" \
              --query properties.status -o tsv 2>/dev/null | tr -d '\r' || echo Unknown)
            case "$STATUS" in
              Succeeded|Failed|Stopped|Degraded) break ;;
            esac
          done
          echo "execution status: $STATUS"

          # Lift the machine-readable receipt out of the execution's console
          # logs. Log Analytics ingestion lags a little, so retry briefly.
          RECEIPT=""
          for _ in 1 2 3 4 5 6; do
            LOGS=$(az containerapp job logs show -g "$RG" -n "$JOB" --container evaluator \
              --execution "$EXEC" --tail 500 2>/dev/null || true)
            RECEIPT=$(printf '%s\n' "$LOGS" | grep -o '::eval-run::.*' | tail -n1 | sed 's/^::eval-run:://' || true)
            [ -n "$RECEIPT" ] && break
            sleep 20
          done
          if [ -n "$RECEIPT" ] && printf '%s' "$RECEIPT" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$RECEIPT" > eval-run.json
            node -e "const r=require('./eval-run.json');for(const s of r.surfaces||[])console.log(\`  \${s.surface}: \${s.questions} Q, hit-rate \${s.retrievalHitRate}, grounding \${s.groundingAvg ?? 'deferred'}, pass-rate \${s.passRate}\`)"
          else
            echo "::warning::no ::eval-run:: receipt in the execution logs (status $STATUS) - the run may have honest-gated on config, or the logs have not landed in Log Analytics yet. Gating on an empty artifact."
          fi
          echo "merged $(jq '.surfaces | length' eval-run.json) surface run(s) into eval-run.json"

      - name: Fetch the previous run artifact (delta baseline, best-effort)
        if: steps.func.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          RUN_ID=$(gh run list --workflow copilot-quality-evals.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" -n copilot-quality-eval-run -D prev/ \
              && echo "delta baseline: run $RUN_ID" \
              || echo "::notice::no previous artifact downloadable — delta check will be skipped"
          else
            echo "::notice::no previous successful run — delta check will be skipped"
          fi
          exit 0

      - name: Gate — check-eval-regression (floors + delta)
        id: gate
        if: steps.func.outputs.found == 'true'
        env:
          EVAL_REGRESSION_DELTA: '5'
        run: |
          set -euo pipefail
          ARGS=(--artifact eval-run.json --summary eval-summary.md)
          [ -f prev/eval-run.json ] && ARGS+=(--previous prev/eval-run.json)
          # nightly = full run: a floored surface with no scores is a failure
          [ '${{ github.event_name }}' = 'schedule' ] && ARGS+=(--strict-missing)
          node scripts/csa-loom/check-eval-regression.mjs "${ARGS[@]}"

      - name: Upload the run artifact (next run's delta baseline)
        if: always() && steps.func.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: copilot-quality-eval-run
          path: |
            eval-run.json
            eval-summary.md
          retention-days: 90

      - name: Sticky PR comment with per-surface deltas
        if: always() && github.event_name == 'pull_request' && steps.func.outputs.found == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: copilot-quality-evals
          path: eval-summary.md

      - name: Sticky PR comment (evaluator job honest-gated)
        if: always() && github.event_name == 'pull_request' && steps.func.outputs.found != 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: copilot-quality-evals
          message: |
            ## Copilot quality evals — honest gate

            The `loom-copilot-evaluator` Container App Job is not deployed in this
            estate, so no eval run was executed for this corpus change
            (`svc-copilot-evaluator` gate). Deploy
            `platform/fiab/bicep/modules/admin-plane/copilot-evaluator-job.bicep`
            and build its image with `scripts/csa-loom/deploy-copilot-evaluator-job.sh`,
            then re-run the workflow.
