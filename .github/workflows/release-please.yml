name: release-please

# Why this workflow also posts commit statuses
# ---------------------------------------------
# release-please opens its release PR using GITHUB_TOKEN. GitHub *intentionally*
# withholds downstream workflows on PRs created by GITHUB_TOKEN (to prevent
# infinite loops). The result: branch protection's required checks (Python
# Tests, dbt Compile, etc.) do not report on the release PR, so it can never
# merge — 0 checks, BLOCKED state.
#
# PRECISION (measured 2026-08-13 on PR #3382, correcting the earlier claim here
# that these workflows "never run"): the runs ARE created — all ten of them —
# and they sit at conclusion `action_required`, awaiting manual approval. They
# are withheld, not absent. `gh api -X POST repos/{repo}/actions/runs/{id}/approve`
# releases them and the REAL checks then run and pass.
#
# So the order of preference below is: APPROVE the held runs (real results), and
# only fall back to posting synthetic statuses when there was nothing to approve.
#
# Why the fallback's context list is hardcoded rather than derived: deriving it
# from `repos/{repo}/branches/main/protection/required_status_checks` was tried
# and is IMPOSSIBLE with GITHUB_TOKEN. That endpoint needs admin, and the
# corresponding `administration` scope is not a valid workflow `permissions:` key
# at all (actionlint rejects it: the allowed set is actions, artifact-metadata,
# attestations, checks, contents, deployments, …). The rulesets endpoint
# (`/rules/branches/main`) IS readable without admin but returns
# required_status_checks: [] here, because these 14 contexts live in CLASSIC
# branch protection, not a ruleset. There is no token-compatible source, so the
# list stays hand-maintained — and the post-verify step below exists to make its
# staleness LOUD, since it has now drifted twice in silence (PR #815, and again
# on 2026-08-13 when `guardrails` and `vitest (node 20)` were missing).
#
# The canonical fix is a PAT (RELEASE_PLEASE_TOKEN). We don't have one and
# don't want a long-lived one stored in repo secrets.
#
# Instead, after release-please creates/updates its PR, this workflow uses
# its own GITHUB_TOKEN (which CAN write commit statuses) to mark every
# required check on the PR head SHA as a success with a clear note that
# release PRs only modify version metadata files (CHANGELOG.md,
# pyproject.toml, .release-please-manifest.json, and the version-only bump in
# apps/fiab-console/package.json via extra-files) and therefore none of the
# code/data/IaC checks are meaningful for them.
#
# This is honest — we're not faking results from real test runs that failed.
# The PR diff is reviewable in seconds and only ever touches three files.

on:
  push:
    branches:
      - main
  # Allow manual re-runs to re-post statuses if the head SHA drifts after a
  # rebase (release-please's `prs` output captures the SHA at action time, but
  # a subsequent rebase by release-please itself can land a *different* SHA on
  # the PR — leaving the previously-posted statuses pinned to a stale commit).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write
  # Needed to APPROVE the runs GitHub withholds on GITHUB_TOKEN-authored PRs
  # (see header). Approval produces REAL check results; the auto-pass fallback
  # only runs when there was nothing to approve.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark required checks as passed on every open release PR
        # Always run — discover open release PRs from the API rather than
        # trusting `steps.release.outputs.prs`, which is empty on no-op runs
        # and stale on rebased runs. This makes the step idempotent and
        # safe to re-trigger via workflow_dispatch.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          RUN_URL="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"

          # Hand-maintained mirror of branch protection's required contexts.
          # See the header for WHY this cannot be derived with GITHUB_TOKEN.
          # It has drifted twice; the post-verify at the end of the loop is the
          # control that makes a third drift fail loudly instead of silently.
          # Last reconciled against protection: 2026-08-13 (14 contexts).
          REQUIRED_CONTEXTS=(
            "PowerShell Lint"
            "Python Lint"
            "Python Tests (3.10)"
            "Python Tests (3.11)"
            "Python Tests (3.12)"
            "Repo Hygiene"
            "Secret Scan"
            "dbt Compile (finance)"
            "dbt Compile (inventory)"
            "dbt Compile (sales)"
            "dbt Compile (shared)"
            "guardrails"
            "next build (node 20)"
            "vitest (node 20)"
          )

          # Find every open PR opened by github-actions[bot] whose head branch
          # matches the release-please naming scheme. Resolve each to its
          # *current* head SHA at runtime — never a cached value.
          mapfile -t RELEASE_PRS < <(
            gh pr list --repo "${REPO}" --state open --author 'app/github-actions' --json number,headRefName \
              | jq -r '.[] | select(.headRefName | startswith("release-please--")) | .number'
          )

          if [ "${#RELEASE_PRS[@]}" -eq 0 ]; then
            echo "No open release-please PRs found — nothing to do."
            exit 0
          fi

          for num in "${RELEASE_PRS[@]}"; do
            sha=$(gh api "repos/${REPO}/pulls/${num}" --jq '.head.sha')
            branch=$(gh api "repos/${REPO}/pulls/${num}" --jq '.head.ref')
            echo ""
            echo "=== Release PR #${num} (${branch}) head SHA ${sha} ==="

            # Sanity-check: release PRs must only touch version-metadata files.
            # If they touch anything else, abort — we don't want to auto-pass
            # checks for a PR that actually changes code.
            files=$(gh api "repos/${REPO}/pulls/${num}/files" --jq '.[].filename' | sort -u)
            echo "Files changed:"
            printf '  %s\n' $files
            unexpected=$(printf '%s\n' $files | grep -Ev '^(CHANGELOG\.md|pyproject\.toml|\.release-please-manifest\.json|apps/fiab-console/package\.json)$' || true)
            if [ -n "$unexpected" ]; then
              echo "::error::Release PR #${num} touches non-metadata files; refusing to auto-pass required checks:"
              echo "$unexpected"
              exit 1
            fi

            # PREFERRED PATH: release the runs GitHub is withholding. These
            # produce REAL check results, so nothing has to be taken on faith.
            mapfile -t HELD < <(
              gh api "repos/${REPO}/actions/runs?head_sha=${sha}&per_page=100" \
                --jq '.workflow_runs[] | select(.status=="action_required") | .id'
            )
            approved=0
            for rid in "${HELD[@]:-}"; do
              [ -z "$rid" ] && continue
              if gh api -X POST "repos/${REPO}/actions/runs/${rid}/approve" >/dev/null 2>&1; then
                approved=$((approved + 1))
              else
                echo "  ! could not approve held run ${rid}"
              fi
            done
            if [ "$approved" -gt 0 ]; then
              echo "  approved ${approved} held run(s) — REAL checks are now running on ${sha}."
              echo "  Not posting synthetic statuses: doing so would let this PR merge"
              echo "  BEFORE those real checks report, which is exactly the"
              echo "  green-that-measured-nothing failure this repo forbids."
              continue
            fi
            echo "  no held runs could be approved (${#HELD[@]} found) — falling back to auto-pass."

            for ctx in "${REQUIRED_CONTEXTS[@]}"; do
              echo "  - posting success status: ${ctx}"
              gh api -X POST "repos/${REPO}/statuses/${sha}" \
                -f state=success \
                -f context="${ctx}" \
                -f description="Auto-passed: release PR only modifies version metadata" \
                -f target_url="${RUN_URL}" >/dev/null
            done

            # DRIFT CONTROL. We just marked every context we KNOW about as green
            # and nothing is failing, so this PR should be mergeable. If GitHub
            # still reports BLOCKED, the most likely explanation is that
            # protection requires a context missing from the list above — the
            # exact silent failure that has already happened twice. This cannot
            # be confirmed from here (GITHUB_TOKEN cannot read protection), so
            # the message says what was measured and stops short of asserting a
            # cause it did not establish.
            state=""
            for _ in 1 2 3 4; do
              sleep 15
              state=$(gh pr view "${num}" --repo "${REPO}" --json mergeStateStatus --jq '.mergeStateStatus')
              [ "$state" != "UNKNOWN" ] && [ "$state" != "BLOCKED" ] && break
            done
            echo "  post-verify: mergeStateStatus=${state}"
            if [ "$state" = "BLOCKED" ]; then
              failing=$(gh pr view "${num}" --repo "${REPO}" --json statusCheckRollup \
                --jq '[.statusCheckRollup[]? | select((.conclusion // .state) as $c | $c=="FAILURE" or $c=="ERROR" or $c=="CANCELLED") | .name // .context] | join(", ")')
              if [ -n "$failing" ]; then
                echo "::warning::Release PR #${num} is BLOCKED with failing checks: ${failing}. That is a real failure, not list drift."
              else
                echo "::error::Release PR #${num} is still BLOCKED after posting all ${#REQUIRED_CONTEXTS[@]}"
                echo "::error::contexts this workflow knows about, and NO check is failing. This"
                echo "::error::workflow cannot read branch protection to confirm why, but the"
                echo "::error::known cause of this exact signal is REQUIRED_CONTEXTS having gone"
                echo "::error::stale (it has drifted twice: PR #815, and 2026-08-13). Compare"
                echo "::error::'gh api repos/${REPO}/branches/main/protection/required_status_checks'"
                echo "::error::against the list in this file and add what is missing."
                exit 1
              fi
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        if: ${{ steps.release.outputs.release_created }}
      - name: Log release info
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "Tagged: ${{ steps.release.outputs.tag_name }}"
          echo "Version: ${{ steps.release.outputs.version }}"
