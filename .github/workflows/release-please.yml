name: release-please

# How a release PR gets its required checks
# -----------------------------------------
# release-please opens its release PR using GITHUB_TOKEN. GitHub *intentionally*
# suppresses downstream workflow triggers on events caused by GITHUB_TOKEN (to
# prevent infinite loops). The result: branch protection's 14 required checks
# (Python Tests, dbt Compile, next build, guardrails, …) do not report on the
# release PR, so it can never merge — 0 checks, BLOCKED state.
#
# CORRECTED 2026-08-13 (#3393). An earlier revision of this header claimed the
# runs "ARE created — all ten of them — and sit at conclusion action_required,
# awaiting manual approval", and #3387 built an approve-the-held-runs path on
# that claim. That path found zero every time it ran. What was MEASURED then:
# on PR #3391 (run 31743342098, head f4e5677f) and again on PR #3402 / 0.96.0
# (head ee77fae4), **0 CheckRuns, 14 StatusContexts** — every "check" was a
# synthetic status this workflow posted to itself. The approve-branch has been
# REMOVED (#3393 option 3).
#
# RE-CORRECTED 2026-08-14. The explanation this header then gave for that zero —
# "the runs are NEVER created; suppression is not a hold state; action_required
# is a different mechanism, the approval hold for fork PRs from first-time
# contributors" — is FALSE. It is left visible here rather than quietly edited,
# because it was asserted without being established, which is the same R7
# failure this file keeps correcting in other people's code. Measured on release
# PR #3447, head 3a21f6e0:
#
#   actions/runs?head_sha=3a21f6e0  -> 10 runs, ALL event=pull_request,
#                                      status=completed, conclusion=action_required
#   commits/3a21f6e0/check-runs     -> total_count = 0
#
# So the `pull_request` runs ARE created for a GITHUB_TOKEN-authored release PR,
# and they DO sit at `action_required`. #3387's premise was right about that
# much. What is ALSO true, and is the part that actually matters: a held run has
# never EXECUTED, so it publishes NO check run and grades NOTHING. Both facts
# have to be held at once. Each previous header kept one and discarded the
# other, and each built the wrong thing on the half it kept — #3387 an approve
# path for runs it could not find, and #3448 a dispatch-skip probe that counted
# those same held runs as evidence and DEADLOCKED the lane (see step 1).
#
# Whether GITHUB_TOKEN can approve a held run is NOT established here and is not
# assumed anywhere below. Dispatch does not need the answer.
#
# THE FIX (#3393 option 1): `workflow_dispatch` and `repository_dispatch` are
# the ONE documented exception to the GITHUB_TOKEN suppression rule — GITHUB_TOKEN
# *can* trigger them (GitHub Actions changelog 2022-09-08; docs "GITHUB_TOKEN"
# and "Triggering a workflow"). So this workflow now DISPATCHES each producing
# workflow against the release branch. Those runs are real, they EXECUTE, their
# check runs land on the PR's head SHA, and their results are real results.
#
#   required context                 published by                job
#   -------------------------------  --------------------------  ------------------
#   Python Lint                      validate.yml                python-lint
#   PowerShell Lint                  validate.yml                powershell-lint
#   Secret Scan                      validate.yml                secret-scan
#   Repo Hygiene                     validate.yml                hygiene
#   Python Tests (3.10|3.11|3.12)    test.yml                    python-tests (matrix)
#   dbt Compile (shared|finance|      test.yml                   dbt-compile (matrix)
#                inventory|sales)
#   next build (node 20)             fiab-console-ci.yml         build
#   vitest (node 20)                 fiab-console-ci.yml         vitest
#   guardrails                       loom-guardrails.yml         guardrails (no `name:`)
#
# All 14 contexts have a producer — reconfirmed against LIVE branch protection on
# 2026-08-14, which returned exactly these 14 and no others. So the synthetic
# path had a population of ZERO and could only ever fire on a context that lost
# its producer. It has been DELETED (#3393): a required context with no producer
# now posts a `failure` status and fails this run. Fail-closed, no allowlist to
# go stale, and — by construction — this workflow can no longer post a `success`
# status that a real check run on this exact commit did not justify.
#
# WHAT #3419 ACTUALLY DID, AND WHY THE TIMEOUT NOW FAILS (measured 2026-08-14)
# ---------------------------------------------------------------------------
# Run 31786503229 dispatched all four producers against PR #3419's head SHA
# 1c80ca70. All four ran for real and concluded success. But the wait budget was
# 120 x 15s = 30 min, and fiab-console-ci.yml concluded at 09:41:45 — 78 seconds
# AFTER the step gave up at 09:40:27. So the step `continue`d, posted NOTHING for
# any of the 14 contexts, and **the job still concluded `success`**. A run that
# verified nothing reported green: the repo's #1 recorded defect class, sitting
# inside the fix for the previous instance of it.
#
# The commit then merged at 09:43:28 with ZERO commit statuses AND zero approving
# reviews against `required_approving_review_count: 1` — i.e. by an admin bypass
# (`enforce_admins: false`), not because any gate was satisfied. That is the real
# shape of the residual risk: not a synthetic green, but a gate that produces
# nothing and a human who then has to go around it.
#
# Two changes follow from that measurement:
#   * The budget is sized from evidence, not guessed: over the last 10 successful
#     runs of each producer the slowest observed was fiab-console-ci at 2083s
#     (34m43s). The budget is 180 x 15s = 45 min, and `timeout-minutes` 60.
#   * An unverified outcome is a FAILED run. Timing out, or bridging nothing, now
#     exits non-zero. The PR still cannot merge on it either way — but the lane
#     now SAYS so where the operator looks, instead of showing green.
#
# One consequence, stated rather than discovered later: `concurrency` keeps at
# most one pending run, so pushes to main during a long wait collapse into a
# single follow-up run. Nothing is lost — release-please recomputes the whole
# commit range every time — and a head SHA that stops moving is precisely what
# lets a 35-minute CI cycle finish at all under `strict: true`.
#
# THE OTHER HALF OF #3393: A RELEASE MERGE MUST CLOSE NOTHING
# ----------------------------------------------------------
# release-please's PR body is the aggregated changelog, and conventional-changelog
# renders every footer reference as ", closes #N" whatever action word the author
# wrote. PR #3431 deliberately wrote `Refs #3429`; the body said `closes [#3429]`;
# merging PR #3419 closed #3429 — an open P0 — two seconds later. Across the whole
# committed CHANGELOG.md, 37 of 66 `closes` claims name an issue the attributed
# commit never asked to close.
#
# The step below rewrites those keywords to `refs` in the PR body BEFORE anything
# else can happen, and then reads the body back to confirm none survived. Per R2
# and task-tracking.md an issue closes on DEPLOYED-and-verified, never on a merge,
# so a release merge closing nothing is the correct behaviour and not a trade-off.
#
# WHY A COMMIT STATUS IS STILL POSTED — and why that is NOT the old auto-pass
# --------------------------------------------------------------------------
# MEASURED 2026-08-13 on PR #3407 (head b4bd723e), because assuming it would
# have been exactly the mistake #3387 made. `license-scan.yml` was dispatched
# against the PR branch — chosen because its `pull_request` path filter means
# the PR event does NOT trigger it, so there was no confound. Result:
#   * run 31752006228, event=workflow_dispatch, head_sha = the PR head SHA;
#   * concluded `success`;
#   * its check run IS on the commit
#     (GET /commits/{sha}/check-runs -> "license gate + THIRD-PARTY-NOTICES");
#   * its check suite 86143211123 IS associated with the PR (pull_requests:[3407]);
#   * and it is STILL ABSENT from `gh pr view --json statusCheckRollup`
#     (28 entries before and after; the commit had 29 check runs).
# So GitHub does not fold a workflow_dispatch check suite into the PR's rollup,
# which is the same surface branch protection evaluates. Scoping that honestly:
# the context measured is not itself a REQUIRED one, so what is established is
# "the rollup omits it", not "protection provably ignores it" — but the rollup
# is what protection reads, so the design does not bet on the difference.
#
# Therefore the dispatched run supplies the RESULT, and this workflow carries
# that result across as a commit status whose `target_url` points AT THE REAL
# JOB that produced it. The difference from what #3393 records:
#   BEFORE: a status posted for every context unconditionally, backed by nothing.
#   NOW:    a status posted ONLY for a context whose own check run, on this exact
#           commit, concluded `success`. A red or absent result posts nothing and
#           fails this run.
# If the bridge ever becomes unnecessary (GitHub starts folding dispatch suites
# into the rollup, or the repo moves to #3393 option 2's GitHub App token, whose
# PRs trigger workflows natively), delete step 4 — the dispatch keeps working.
#
# WHY THIS IS NOT "a dispatched run whose result is discarded":
#   * A failed `gh workflow run` aborts the job (the error text is captured and
#     printed, never `2>/dev/null`'d away).
#   * A dispatch that produces NO run inside the polling budget is an `::error::`
#     + exit 1. An absent result is not a green one.
#   * A required context whose real check run did not conclude `success` gets NO
#     status posted and fails this run — so it blocks the release both ways.
#   * Nothing here uses `continue-on-error`, `|| true`, or `2>/dev/null`.
#
# Dispatch is IDEMPOTENT: if a run of a producing workflow already exists on the
# PR's current head SHA, it is not re-dispatched. release-please only changes
# that SHA when it updates the PR, so pushes to main do not re-burn CI minutes.
#
# Why the required-context list is hardcoded rather than derived: deriving it
# from `repos/{repo}/branches/main/protection/required_status_checks` was tried
# and is IMPOSSIBLE with GITHUB_TOKEN. That endpoint needs admin, and the
# corresponding `administration` scope is not a valid workflow `permissions:` key
# at all (actionlint rejects it: the allowed set is actions, artifact-metadata,
# attestations, checks, contents, deployments, …). The rulesets endpoint
# (`/rules/branches/main`) IS readable without admin but returns
# required_status_checks: [] here, because these 14 contexts live in CLASSIC
# branch protection, not a ruleset. There is no token-compatible source, so the
# list stays hand-maintained — and the post-verify step below exists to make its
# staleness LOUD, since it has now drifted twice in silence (PR #815, and again
# on 2026-08-13 when `guardrails` and `vitest (node 20)` were missing).
#
# MEASURED PROTECTION STATE (2026-08-13, read with an operator token that CAN
# reach the protection endpoint — recorded here so nobody re-derives it):
#   required_status_checks.strict      = true   (=> release PRs go BEHIND on any
#                                                main push and must be updated)
#   required_status_checks.contexts    = the same 14 listed below; the
#                                         hand-maintained array was verified
#                                         EXACTLY equal to protection on this date
#   required_approving_review_count    = 1      (=> every release PR is BLOCKED
#                                                until a human approves; a bot
#                                                cannot approve, so this gate is
#                                                permanent, not a defect)
#   required_linear_history            = true   (=> squash or rebase, never a
#                                                merge commit)
#   required_conversation_resolution   = false
#   enforce_admins                     = false
#
# The approving-review requirement is why a release PR can sit at BLOCKED with
# all 14 contexts green. The post-verify below distinguishes that case from
# "real checks still running" and from context drift instead of guessing
# (deploy-integrity.md R7).

on:
  push:
    branches:
      - main
  # Allow manual re-runs to re-evaluate / re-dispatch if the head SHA drifts
  # after a rebase (release-please's `prs` output captures the SHA at action
  # time, but a subsequent rebase by release-please itself can land a *different*
  # SHA on the PR — leaving the previous run's checks pinned to a stale commit).
  workflow_dispatch:

# Serialize: two concurrent runs would both see "no run on this SHA" and
# double-dispatch every producing workflow. `cancel-in-progress: false` because
# this job creates git tags and GitHub releases — it must not be killed mid-flight.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: write
  # `gh workflow run` POSTs to actions/workflows/{file}/dispatches, and the
  # dispatch-verification poll reads actions/runs — both need actions:write.
  actions: write
  # The coverage measurement reads repos/{repo}/commits/{sha}/check-runs. Without
  # this the read 403s and we would be guessing at coverage instead of measuring it.
  checks: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Raised from 45: the step below dispatches the producing workflows and then
    # WAITS for them to conclude before bridging any result. The budget is sized
    # from the slowest observed producer run (fiab-console-ci, 2083s) plus
    # headroom for queueing. It is deliberately long — a status must never be
    # posted ahead of the run that justifies it.
    timeout-minutes: 60
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # The neutralizer below is a repo script, so the tree has to be here
          # before it runs. Nothing else in this job needs the checkout.
          persist-credentials: false

      - name: A release merge must close NOTHING — strip closing keywords from the PR body
        # Runs BEFORE the required-checks step, and before that step's
        # metadata-allowlist abort, so a release PR is never left sitting with a
        # live closing keyword in its body no matter how the rest of the job goes.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"

          mapfile -t RELEASE_PRS < <(
            gh pr list --repo "${REPO}" --state open --author 'app/github-actions' --json number,headRefName \
              | jq -r '.[] | select(.headRefName | startswith("release-please--")) | .number'
          )
          if [ "${#RELEASE_PRS[@]}" -eq 0 ]; then
            echo "No open release-please PRs — nothing to neutralize."
            exit 0
          fi

          for num in "${RELEASE_PRS[@]}"; do
            echo "=== PR #${num}: closing-keyword sweep ==="
            gh api "repos/${REPO}/pulls/${num}" --jq '.body' > body.raw.txt
            # An unreadable/empty body is NOT a clean one. release-please always
            # writes a body; zero bytes means the read failed, and calling that
            # "no keywords found" is the exact unknown-as-negative class.
            if [ ! -s body.raw.txt ]; then
              echo "::error::PR #${num}: read back a ZERO-BYTE body. That is an unreadable"
              echo "::error::signal, not a clean one — refusing to declare it free of closing"
              echo "::error::keywords on the strength of a read that produced nothing."
              exit 1
            fi
            # A JSON-null body is a real (if surprising) state, not a read
            # failure — a failed `gh api` would have aborted this step already.
            # It carries no text and therefore no closing keyword, so it is
            # reported and skipped rather than treated as an error.
            if [ "$(cat body.raw.txt)" = "null" ]; then
              echo "  PR #${num} has a null body — nothing to neutralize."
              continue
            fi

            node scripts/ci/neutralize-release-close-keywords.mjs body.raw.txt > body.clean.txt
            if cmp -s body.raw.txt body.clean.txt; then
              echo "  no closing keywords present — body left byte-identical."
            else
              echo "  closing keyword(s) found; rewriting them to 'refs':"
              # `diff` exits 1 precisely BECAUSE the files differ, which is the
              # expected case in this branch. Written as an explicit `if` rather
              # than `diff … || true`: a `|| true` in a step is the shape this
              # repo has been burned by, and it would also swallow diff's exit 2
              # (a real error) alongside the benign 1.
              if ! diff -u body.raw.txt body.clean.txt; then
                :
              fi
              gh pr edit "${num}" --repo "${REPO}" --body-file body.clean.txt
            fi

            # READ IT BACK. Do not assert the edit worked (R7) — establish it.
            gh api "repos/${REPO}/pulls/${num}" --jq '.body' > body.verify.txt
            if [ ! -s body.verify.txt ]; then
              echo "::error::PR #${num}: verification read returned a ZERO-BYTE body."
              exit 1
            fi
            node scripts/ci/neutralize-release-close-keywords.mjs --check body.verify.txt
            echo "  verified on the LIVE body: 0 closing keywords remain on PR #${num}."
          done
          rm -f body.raw.txt body.clean.txt body.verify.txt

      - name: Run the required checks for real on every open release PR
        # Always run — discover open release PRs from the API rather than
        # trusting `steps.release.outputs.prs`, which is empty on no-op runs
        # and stale on rebased runs. This makes the step idempotent and
        # safe to re-trigger via workflow_dispatch.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          RUN_URL="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"

          # Hand-maintained mirror of branch protection's required contexts,
          # each paired with the workflow FILE whose job publishes it.
          # See the header for WHY this cannot be derived with GITHUB_TOKEN.
          # It has drifted twice; the post-verify at the end of the loop is the
          # control that makes a third drift fail loudly instead of silently.
          # Last reconciled against protection: 2026-08-13 (14 contexts).
          #
          # The producer was established by READING each workflow's job `name:`
          # (a matrix job's check-run name is `<name> (<matrix values>)`; a job
          # with no `name:` reports under its job id — that is why `guardrails`
          # is spelled lowercase).
          #
          # An EMPTY producer means "no workflow in this repo publishes this
          # context". Those — and ONLY those — still get a synthetic status, and
          # each one is named in a ::warning:: so the residue cannot go quiet.
          REQUIRED_CHECKS=(
            "PowerShell Lint|validate.yml"
            "Python Lint|validate.yml"
            "Python Tests (3.10)|test.yml"
            "Python Tests (3.11)|test.yml"
            "Python Tests (3.12)|test.yml"
            "Repo Hygiene|validate.yml"
            "Secret Scan|validate.yml"
            "dbt Compile (finance)|test.yml"
            "dbt Compile (inventory)|test.yml"
            "dbt Compile (sales)|test.yml"
            "dbt Compile (shared)|test.yml"
            "guardrails|loom-guardrails.yml"
            "next build (node 20)|fiab-console-ci.yml"
            "vitest (node 20)|fiab-console-ci.yml"
          )

          # Derive the unique producer set from the table above — one source of
          # truth, so adding a context can never forget to dispatch its workflow.
          # NOTE ON `set -e` IN THIS STEP: every early-exit below is written as an
          # explicit `if`, never `[ … ] && break`. A failing `[ … ]` at the head
          # of an && list is exempt from errexit, but that exemption is subtle
          # enough that this repo has been bitten by the neighbouring case
          # (a failure skipping later guards, which then read as passes).
          PRODUCERS=()
          for entry in "${REQUIRED_CHECKS[@]}"; do
            wf="${entry#*|}"
            if [ -z "$wf" ]; then continue; fi
            already=0
            for seen in ${PRODUCERS[@]+"${PRODUCERS[@]}"}; do
              if [ "$seen" = "$wf" ]; then already=1; break; fi
            done
            if [ "$already" -eq 0 ]; then PRODUCERS+=("$wf"); fi
          done
          echo "Producing workflows: ${PRODUCERS[*]}"

          # Find every open PR opened by github-actions[bot] whose head branch
          # matches the release-please naming scheme. Resolve each to its
          # *current* head SHA at runtime — never a cached value.
          mapfile -t RELEASE_PRS < <(
            gh pr list --repo "${REPO}" --state open --author 'app/github-actions' --json number,headRefName \
              | jq -r '.[] | select(.headRefName | startswith("release-please--")) | .number'
          )

          if [ "${#RELEASE_PRS[@]}" -eq 0 ]; then
            echo "No open release-please PRs found — nothing to do."
            exit 0
          fi

          # THE ONE SOURCE OF EVIDENCE. name <TAB> status <TAB> conclusion <TAB>
          # url for every CHECK RUN on a SHA.
          #
          # WHY THIS REPLACED A WORKFLOW-RUN PROBE (deadlock, 2026-08-14)
          # ------------------------------------------------------------
          # The dispatch decision used to read `actions/runs?head_sha=…` while the
          # verdict read `commits/{sha}/check-runs`. On PR #3447, head
          # 3a21f6e0, those two sources disagreed catastrophically:
          #
          #   actions/runs?head_sha=3a21f6e0      -> 10 runs
          #   commits/3a21f6e0/check-runs         -> total_count = 0
          #
          # All ten were `event: pull_request`, `status: completed`,
          # `conclusion: action_required` — GitHub's approval hold. A held run has
          # been CREATED but has never EXECUTED, so it publishes no check run. The
          # dispatch half read "a run exists" and skipped; the verdict half read
          # "nothing graded" and failed; and because the skip is deterministic the
          # lane could never recover on its own. A gate that cannot pass is as
          # broken as a gate that cannot fail.
          #
          # Both halves now read THIS function, so they cannot disagree about what
          # counts as evidence.
          check_runs_tsv() {
            gh api --paginate "repos/${REPO}/commits/$1/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // ""), .html_url] | @tsv'
          }
          # Workflow runs THIS JOB DISPATCHED, pinned to both the SHA and the
          # event. Used ONLY to confirm a dispatch created something — never as
          # evidence that a context was graded. `event=workflow_dispatch` is the
          # load-bearing part: without it this query also returns the held
          # `pull_request` runs above, which is the whole defect.
          dispatch_runs_for_sha() {
            gh api --paginate "repos/${REPO}/actions/runs?head_sha=$1&event=workflow_dispatch&per_page=100" \
              --jq '.workflow_runs[].path'
          }

          # UNVERIFIED counts release PRs this run failed to render a full verdict
          # for. It is checked AFTER the loop and turns the job red. On 2026-08-14
          # run 31786503229 hit exactly this case and concluded `success` — a run
          # that verified nothing, showing green in `gh run list`, which is the
          # signal the operator actually reads.
          UNVERIFIED=0

          # POLL BUDGETS. Defaults are the production values: 15s between polls,
          # 180 polls (45 min) for the check-run wait, 12 (3 min) for the
          # dispatch confirmation. They are env-overridable ONLY so the test
          # suite can drive this exact step body against a stubbed `gh` without
          # burning 45 minutes per scenario.
          #
          # This seam cannot weaken the gate, and that is a property not a hope:
          # every one of these bounds a WAIT. Shortening a wait can only produce
          # MORE UNVERIFIED — that is, more red — never a status that was not
          # bridged from a real check run. Lengthening one only waits longer.
          # Neither direction can post a success.
          POLL_SLEEP="${RP_POLL_SLEEP:-15}"
          WAIT_POLLS="${RP_WAIT_POLLS:-180}"
          DISPATCH_POLLS="${RP_DISPATCH_POLLS:-12}"

          for num in "${RELEASE_PRS[@]}"; do
            sha=$(gh api "repos/${REPO}/pulls/${num}" --jq '.head.sha')
            branch=$(gh api "repos/${REPO}/pulls/${num}" --jq '.head.ref')
            echo ""
            echo "=== Release PR #${num} (${branch}) head SHA ${sha} ==="

            # Sanity-check: release PRs must only touch version-metadata files.
            # If they touch anything else, abort — we don't want to drive this
            # release path for a PR that actually changes code. The allowlist is
            # UNCHANGED and deliberately NOT widened (#3393 requirement).
            #
            # Written as an explicit loop rather than `grep -Ev … || true`: the
            # `|| true` was there only because `grep -v` exits 1 when it filters
            # everything out (the GOOD case), but a `|| true` in a gate is the
            # shape this repo has been burned by, so it is gone.
            files="$(gh api "repos/${REPO}/pulls/${num}/files" --jq '.[].filename' | sort -u)"
            if [ -z "$files" ]; then
              echo "::error::Release PR #${num} reported ZERO changed files. That is an"
              echo "::error::UNREADABLE signal, not a green one — refusing to proceed rather"
              echo "::error::than treating 'I could not see any' as 'there are none'."
              exit 1
            fi
            mapfile -t file_list <<< "$files"
            echo "Files changed:"
            printf '  %s\n' "${file_list[@]}"
            allowed_re='^(CHANGELOG\.md|pyproject\.toml|\.release-please-manifest\.json|apps/fiab-console/package\.json)$'
            unexpected=""
            for f in "${file_list[@]}"; do
              if ! printf '%s' "$f" | grep -Eq "$allowed_re"; then
                unexpected="${unexpected}${f} "
              fi
            done
            if [ -n "$unexpected" ]; then
              echo "::error::Release PR #${num} touches non-metadata files; refusing to auto-pass required checks:"
              echo "  ${unexpected}"
              exit 1
            fi

            # ---------------------------------------------------------------
            # 1. DISPATCH the producing workflows against the release branch.
            #
            #    The skip test asks the SAME question the verdict asks: does a
            #    CHECK RUN for each required context this workflow publishes
            #    already exist on this exact SHA? Not "does a workflow run
            #    exist" — a held (`action_required`) or cancelled run exists and
            #    grades nothing, and treating it as evidence is what deadlocked
            #    PR #3447.
            #
            #    The test is deliberately asymmetric: it skips ONLY on positive
            #    evidence that every context is already covered. Anything it
            #    cannot establish — an unreadable list, a partially covered
            #    producer — dispatches. Dispatching redundantly costs CI minutes;
            #    skipping wrongly costs the release.
            # ---------------------------------------------------------------
            cr_names="$(check_runs_tsv "${sha}" | cut -f1)"
            have_check_run() {
              printf '%s\n' "${cr_names}" | grep -qxF "$1"
            }
            dispatched=()
            for wf in "${PRODUCERS[@]}"; do
              uncovered=""
              for entry in "${REQUIRED_CHECKS[@]}"; do
                ctx="${entry%%|*}"
                if [ "${entry#*|}" != "${wf}" ]; then continue; fi
                if ! have_check_run "${ctx}"; then
                  uncovered="${uncovered}${ctx}; "
                fi
              done
              if [ -z "${uncovered}" ]; then
                echo "  = ${wf}: every required context it publishes already has a check run on ${sha} — not re-dispatching."
                continue
              fi
              echo "  > dispatching ${wf} against ${branch} (no check run yet for: ${uncovered})"
              # stderr is CAPTURED, never discarded: a dispatch that fails must
              # say why (deploy-integrity R7), and must stop the job.
              if ! dispatch_err="$(gh workflow run "${wf}" --repo "${REPO}" --ref "${branch}" 2>&1)"; then
                echo "::error::Dispatching ${wf} against ${branch} FAILED: ${dispatch_err}"
                echo "::error::This is fatal — without it the required contexts that ${wf}"
                echo "::error::publishes would have no real result, and posting a synthetic one"
                echo "::error::in their place is the exact defect #3393 records."
                echo "::error::If the message mentions a missing workflow_dispatch trigger, the"
                echo "::error::release branch was cut from a main commit that predates the"
                echo "::error::trigger being added: close PR #${num} and let release-please"
                echo "::error::recreate it from current main."
                exit 1
              fi
              dispatched+=("${wf}")
            done

            # ---------------------------------------------------------------
            # 2. CONFIRM each dispatch actually produced a workflow_dispatch run
            #    ON THIS SHA. A dispatch that creates nothing is a FAILURE.
            #
            #    `gh workflow run --ref <branch>` targets a BRANCH, so if the
            #    branch head moved between the dispatch and this poll the run
            #    lands on the NEW head and legitimately will not appear here.
            #    That is SHA churn, not a failed dispatch, and saying "no run
            #    appeared" would assert a cause this code did not establish (R7).
            # ---------------------------------------------------------------
            if [ "${#dispatched[@]}" -gt 0 ]; then
              missing=("${dispatched[@]}")
              for _ in $(seq 1 "${DISPATCH_POLLS}"); do
                sleep "${POLL_SLEEP}"
                existing_paths="$(dispatch_runs_for_sha "${sha}")"
                still=()
                for wf in "${missing[@]}"; do
                  if ! printf '%s\n' "${existing_paths}" | grep -qxF ".github/workflows/${wf}"; then
                    still+=("${wf}")
                  fi
                done
                missing=(${still[@]+"${still[@]}"})
                if [ "${#missing[@]}" -eq 0 ]; then break; fi
              done
              if [ "${#missing[@]}" -gt 0 ]; then
                now_sha=$(gh api "repos/${REPO}/pulls/${num}" --jq '.head.sha')
                if [ "${now_sha}" != "${sha}" ]; then
                  echo "::error::PR #${num}: dispatched ${missing[*]}, and no workflow_dispatch run"
                  echo "::error::appeared on ${sha} — because the head SHA moved to ${now_sha} while"
                  echo "::error::this step was working. The runs exist; they belong to the new head."
                  echo "::error::This is SHA churn (branch protection strict=true rebuilds the PR on"
                  echo "::error::every push to main), NOT a failed dispatch. The next run of this"
                  echo "::error::workflow will grade ${now_sha}."
                else
                  echo "::error::PR #${num}: dispatched ${missing[*]} against ${branch}, the head SHA"
                  echo "::error::is still ${sha}, and NO workflow_dispatch run appeared on it within"
                  echo "::error::3 minutes. The dispatch produced nothing. An absent result is NOT a"
                  echo "::error::green one, so nothing is posted (#3393)."
                fi
                UNVERIFIED=$((UNVERIFIED + 1))
                continue
              fi
              echo "  all ${#dispatched[@]} dispatched workflow(s) produced a run on ${sha}."
            fi

            # ---------------------------------------------------------------
            # 3. WAIT until every REQUIRED CONTEXT has a completed CHECK RUN on
            #    this SHA — the same evidence step 4 grades, so the two halves
            #    cannot disagree about what "ready" means.
            #
            #    Waiting on workflow RUNS instead was the second half of the
            #    #3447 deadlock: the ten held `pull_request` runs report
            #    `status: completed`, so the wait declared "every producing run
            #    has concluded" one second in, having graded nothing.
            #
            #    Early exit: if every check run on the commit is terminal and a
            #    required context is still missing, more waiting cannot help.
            #    That state must hold for 4 consecutive polls (60s) so a job
            #    that simply has not registered its check run yet is not
            #    mistaken for one that never will.
            # ---------------------------------------------------------------
            missing_ctx=""; inflight_ctx=""; total_crs=0; quiescent_stable=0
            for _ in $(seq 1 "${WAIT_POLLS}"); do
              cr_now="$(check_runs_tsv "${sha}")"
              total_crs=$(printf '%s' "${cr_now}" | grep -c . || true)
              missing_ctx=""; inflight_ctx=""
              for entry in "${REQUIRED_CHECKS[@]}"; do
                ctx="${entry%%|*}"
                line="$(printf '%s\n' "${cr_now}" | awk -F'\t' -v n="${ctx}" '$1==n {print; exit}')"
                if [ -z "${line}" ]; then
                  missing_ctx="${missing_ctx}${ctx}; "
                elif [ "$(printf '%s' "${line}" | cut -f2)" != "completed" ]; then
                  inflight_ctx="${inflight_ctx}${ctx}; "
                fi
              done
              if [ -z "${missing_ctx}" ] && [ -z "${inflight_ctx}" ]; then break; fi

              # Is the whole commit quiescent — nothing at all still running?
              nonterminal=$(printf '%s\n' "${cr_now}" | awk -F'\t' '$1!="" && $2!="completed" {n++} END {print n+0}')
              if [ -n "${missing_ctx}" ] && [ -z "${inflight_ctx}" ] && [ "${nonterminal}" -eq 0 ] && [ "${total_crs}" -gt 0 ]; then
                quiescent_stable=$((quiescent_stable + 1))
                if [ "${quiescent_stable}" -ge 4 ]; then break; fi
              else
                quiescent_stable=0
              fi
              sleep "${POLL_SLEEP}"
            done

            if [ -n "${missing_ctx}" ] || [ -n "${inflight_ctx}" ]; then
              # Nothing is posted: an unfinished or never-produced check run is
              # not a green one and the PR stays blocked, which is correct. What
              # is NOT correct is this job then reporting success — run
              # 31786503229 did exactly that on 2026-08-14.
              #
              # THREE DISTINGUISHABLE STATES, said apart (deploy-integrity R7).
              # The previous wording collapsed them into "the producing workflow
              # ran but published no check run under that exact name — a
              # REQUIRED_CHECKS mapping defect", which on PR #3447 was FALSE:
              # `commits/3a21f6e0/check-runs` returned total_count=0, so nothing
              # had run at all. That message sent the diagnosis at the mapping
              # table instead of at the dispatch.
              now_sha=$(gh api "repos/${REPO}/pulls/${num}" --jq '.head.sha')
              if [ "${now_sha}" != "${sha}" ]; then
                echo "::error::PR #${num}: head SHA moved from ${sha} to ${now_sha} WHILE this"
                echo "::error::step was waiting. Every run it was waiting on belongs to a commit"
                echo "::error::that is no longer the PR head, so none of them can be bridged."
                echo "::error::Cause is SHA churn, not slow CI: branch protection has strict=true,"
                echo "::error::so release-please rebuilds this PR on every push to main. A release"
                echo "::error::needs a quiet window on main long enough for one CI cycle (~35 min)."
              elif [ "${total_crs}" -eq 0 ]; then
                echo "::error::PR #${num}: ZERO check runs exist on ${sha}. Nothing has run — this"
                echo "::error::is NOT a REQUIRED_CHECKS mapping problem and NOT a red result."
                echo "::error::What this establishes is only that no job has published anything"
                echo "::error::against this commit. Look at the DISPATCH, not at the mapping table:"
                echo "::error::  gh api repos/${REPO}/actions/runs?head_sha=${sha} --jq '.workflow_runs[]|[.path,.event,.status,.conclusion]|@tsv'"
                echo "::error::A run listed there with conclusion 'action_required' has been created"
                echo "::error::but never EXECUTED — GitHub's approval hold — and publishes no check"
                echo "::error::run. That is why this workflow dispatches instead of relying on it."
              elif [ -n "${inflight_ctx}" ]; then
                echo "::error::PR #${num}: real check runs on ${sha} had NOT completed after 45 min:"
                echo "::error::${inflight_ctx}"
                echo "::error::They are running, not failing. No status was posted for ANY required"
                echo "::error::context — an unfinished run is not a green one. Re-run this workflow"
                echo "::error::once they finish and their results will be bridged onto ${sha}."
              else
                echo "::error::PR #${num}: ${total_crs} check run(s) exist on ${sha} and all are"
                echo "::error::terminal, but these required contexts have NO check run under that"
                echo "::error::exact name: ${missing_ctx}"
                echo "::error::THIS one is a REQUIRED_CHECKS mapping defect — the producing workflow"
                echo "::error::ran and published under different names. The names actually present:"
                printf '%s\n' "${cr_now}" | cut -f1 | sort -u | sed 's/^/::error::  /'
                echo "::error::Reconcile the table in this file against those names."
              fi
              echo "::error::This run verified NOTHING for PR #${num}, so it fails rather than"
              echo "::error::reporting green (#3393)."
              UNVERIFIED=$((UNVERIFIED + 1))
              continue
            fi
            echo "  every required context has a completed check run on ${sha}."

            # ---------------------------------------------------------------
            # 4. BRIDGE each REAL result onto the head SHA as a commit status.
            #
            #    WHY A BRIDGE IS STILL NEEDED — measured 2026-08-13, see header:
            #    a workflow_dispatch check run lands on the commit and its check
            #    suite is even associated with the PR, but it does NOT appear in
            #    the PR's statusCheckRollup, so branch protection does not count
            #    it. So the dispatched run supplies the RESULT and this step
            #    carries that result across, naming the run that produced it.
            #    This is NOT the old auto-pass: nothing is posted for a context
            #    whose real check run did not conclude `success`.
            # ---------------------------------------------------------------
            cr_tsv="$(gh api --paginate "repos/${REPO}/commits/${sha}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // ""), .html_url] | @tsv')"
            declare -A CR_CONCL=() CR_URL=()
            while IFS=$'\t' read -r cr_name cr_status cr_concl cr_url; do
              if [ -z "${cr_name}" ]; then continue; fi
              CR_CONCL["${cr_name}"]="${cr_status}/${cr_concl}"
              CR_URL["${cr_name}"]="${cr_url}"
            done <<< "${cr_tsv}"

            bridged=(); broken=(); producerless=()
            for entry in "${REQUIRED_CHECKS[@]}"; do
              ctx="${entry%%|*}"; wf="${entry#*|}"
              if [ -z "${wf}" ]; then producerless+=("${ctx}"); continue; fi
              verdict="${CR_CONCL[${ctx}]:-ABSENT}"
              if [ "${verdict}" != "completed/success" ]; then
                echo "    NOT-GREEN ${ctx} -> ${verdict}"
                # Post an explicit FAILURE rather than merely withholding a
                # success. Withholding alone would leave any status a PREVIOUS
                # run of this workflow bridged for the same SHA standing — so a
                # job that was green and is now red (a re-run, a flake) could
                # still be sitting green on the commit. Overwrite it.
                gh api -X POST "repos/${REPO}/statuses/${sha}" \
                  -f state=failure \
                  -f context="${ctx}" \
                  -f description="Real run on this commit did not conclude success (${verdict})" \
                  -f target_url="${CR_URL[${ctx}]:-${RUN_URL}}" >/dev/null
                broken+=("${ctx}=${verdict}")
                continue
              fi
              echo "    GREEN     ${ctx} -> ${CR_URL[${ctx}]}"
              gh api -X POST "repos/${REPO}/statuses/${sha}" \
                -f state=success \
                -f context="${ctx}" \
                -f description="Real run on this exact commit concluded success — see target URL" \
                -f target_url="${CR_URL[${ctx}]}" >/dev/null
              bridged+=("${ctx}")
            done

            if [ "${#broken[@]}" -gt 0 ]; then
              echo "::error::PR #${num}: ${#broken[@]} required context(s) did NOT conclude success"
              echo "::error::on ${sha}: ${broken[*]}"
              echo "::error::Step 3 only reaches here once EVERY required context has a completed"
              echo "::error::check run on this commit, so each of these is a REAL red result from a"
              echo "::error::real run — the release is broken and must not merge. Each was posted as"
              echo "::error::a FAILURE status on ${sha}, which is the point."
              echo "::error::('ABSENT' here would mean the check run vanished between step 3 and"
              echo "::error::this read. It is not reachable by a missing mapping — step 3 diagnoses"
              echo "::error::that case separately and never gets here.)"
              exit 1
            fi
            echo "  bridged ${#bridged[@]} real result(s) onto ${sha}."

            # ---------------------------------------------------------------
            # 5. A REQUIRED CONTEXT WITH NO PRODUCER IS A HARD FAILURE.
            #
            #    This used to post a SYNTHETIC `success` for such a context and
            #    shout about it in a ::warning::. A warning does not stop a merge;
            #    a green status is a green status however loudly it is annotated,
            #    and #3393 is on file precisely because release PRs merged on
            #    statuses no test produced. The synthetic path is GONE.
            #
            #    The population is zero today — all 14 required contexts, read
            #    from live branch protection on 2026-08-14, have a producer — so
            #    deleting it removes no working behaviour. If protection later
            #    adds a context this file has no producer for, the release stops
            #    dead with a red status and a named remediation. Fail closed.
            # ---------------------------------------------------------------
            if [ "${#producerless[@]}" -gt 0 ]; then
              for ctx in "${producerless[@]}"; do
                echo "::error::PR #${num}: required context '${ctx}' has NO producing workflow."
                gh api -X POST "repos/${REPO}/statuses/${sha}" \
                  -f state=failure \
                  -f context="${ctx}" \
                  -f description="No workflow in this repo publishes this context — nothing can verify it" \
                  -f target_url="${RUN_URL}" >/dev/null
              done
              echo "::error::${#producerless[@]} required context(s) cannot be verified by any run:"
              echo "::error::${producerless[*]}"
              echo "::error::This workflow will NOT invent a success for them. Either add the"
              echo "::error::workflow that publishes each one and map it in REQUIRED_CHECKS, or"
              echo "::error::remove the context from branch protection. Until then the release is"
              echo "::error::blocked, which is the correct state for something nothing tests."
              exit 1
            fi
            echo "::notice::0 synthetic statuses posted for PR #${num} — all ${#bridged[@]} required contexts were bridged from real runs that concluded success on ${sha}."

            # DRIFT / DIAGNOSIS CONTROL. Distinguish, without guessing, between
            # (a) a real failing check, (b) real checks still running, (c) the
            # permanent human-approval gate, and (d) REQUIRED_CHECKS drift.
            state=""
            for _ in 1 2 3 4; do
              sleep "${POLL_SLEEP}"
              state=$(gh pr view "${num}" --repo "${REPO}" --json mergeStateStatus --jq '.mergeStateStatus')
              if [ "$state" != "UNKNOWN" ] && [ "$state" != "BLOCKED" ]; then break; fi
            done
            echo "  post-verify: mergeStateStatus=${state}"
            if [ "$state" = "BLOCKED" ]; then
              # Scope the diagnosis to the REQUIRED contexts. A non-required job
              # going red must not be reported as "BLOCKED with failing required
              # checks" — that would assert a cause this code did not establish.
              req_json="$(printf '%s\n' "${REQUIRED_CHECKS[@]}" | cut -d'|' -f1 \
                | jq -R -s -c 'split("\n") | map(select(length > 0))')"
              rollup=$(gh pr view "${num}" --repo "${REPO}" --json statusCheckRollup --jq '.statusCheckRollup')
              failing=$(printf '%s' "$rollup" | jq -r --argjson req "$req_json" \
                '[.[]? | select((.name // .context) as $n | ($req | index($n)) != null)
                       | select(((.conclusion // .state) == "FAILURE") or ((.conclusion // .state) == "ERROR") or ((.conclusion // .state) == "CANCELLED") or ((.conclusion // .state) == "TIMED_OUT"))
                       | .name // .context] | unique | join(", ")')
              inflight=$(printf '%s' "$rollup" | jq -r --argjson req "$req_json" \
                '[.[]? | select((.name // .context) as $n | ($req | index($n)) != null)
                       | select(((.status // "") == "QUEUED") or ((.status // "") == "IN_PROGRESS") or ((.state // "") == "PENDING"))
                       | .name // .context] | unique | join(", ")')
              # The most common BLOCKED cause: branch protection requires an
              # approving review (required_approving_review_count=1 as of
              # 2026-08-13). GITHUB_TOKEN cannot read branch protection, but
              # reviewDecision lives on the PULL REQUEST object and IS readable
              # here — so this case is distinguished, not guessed at. Blaming
              # REQUIRED_CHECKS drift for a missing approval would be exactly the
              # R7 violation this post-verify exists to prevent.
              review=$(gh pr view "${num}" --repo "${REPO}" --json reviewDecision --jq '.reviewDecision // ""')
              if [ -n "$failing" ]; then
                echo "::error::Release PR #${num} is BLOCKED with FAILING required contexts: ${failing}."
                echo "::error::Every status this workflow posts is bridged from a real run that"
                echo "::error::concluded success on this exact commit, so a red one here is a"
                echo "::error::genuine result — the release is broken and must not merge."
                exit 1
              elif [ -n "$inflight" ]; then
                echo "::notice::Release PR #${num} is BLOCKED because required contexts are still pending: ${inflight}. Nothing was bridged for them, which is correct — they will be picked up by the next run of this workflow once their real runs conclude."
              elif [ "$review" = "REVIEW_REQUIRED" ]; then
                echo "::notice::Release PR #${num} is BLOCKED solely because branch protection requires an approving review, and no check is failing. This is the expected steady state — GITHUB_TOKEN cannot approve a PR. A human (or a PAT-backed reviewer) must approve #${num} to release. NOT context drift."
              else
                echo "::error::Release PR #${num} is still BLOCKED. No required context is"
                echo "::error::failing, none is pending, and reviewDecision is '${review}' so a"
                echo "::error::missing approval is NOT the cause either. The known cause of THIS"
                echo "::error::narrowed signal is REQUIRED_CHECKS having gone stale (it has drifted"
                echo "::error::twice: PR #815, and 2026-08-13) — protection requires a context this"
                echo "::error::file does not know about, so nothing was ever posted for it. Compare"
                echo "::error::'gh api repos/${REPO}/branches/main/protection/required_status_checks'"
                echo "::error::against the table in this file and add what is missing."
                echo "::error::This workflow cannot read branch protection to confirm that, so it"
                echo "::error::names the known cause without asserting it is the only one."
                exit 1
              fi
            fi
          done

          # THE VERDICT OF THIS RUN. A release PR that could not be fully graded
          # leaves this job RED. It used to leave it green: run 31786503229 timed
          # out 78 seconds early on 2026-08-14, bridged nothing for any of the 14
          # required contexts, and reported success — and the release then merged
          # on an admin bypass carrying zero statuses. A run that verified nothing
          # must not look like a run that verified everything (#3393).
          if [ "${UNVERIFIED}" -ne 0 ]; then
            echo "::error::${UNVERIFIED} release PR(s) were NOT fully verified by this run."
            echo "::error::No required context was bridged for them, so they cannot merge on"
            echo "::error::anything this workflow produced — and this run fails so that fact is"
            echo "::error::visible in the run list instead of showing as a green release lane."
            exit 1
          fi

      - name: Log release info
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "Tagged: ${{ steps.release.outputs.tag_name }}"
          echo "Version: ${{ steps.release.outputs.version }}"
