name: release-please

# Why this workflow also posts commit statuses
# ---------------------------------------------
# release-please opens its release PR using GITHUB_TOKEN. GitHub *intentionally*
# withholds downstream workflows on PRs created by GITHUB_TOKEN (to prevent
# infinite loops). The result: branch protection's required checks (Python
# Tests, dbt Compile, etc.) do not report on the release PR, so it can never
# merge — 0 checks, BLOCKED state.
#
# PRECISION (measured 2026-08-13 on PR #3382, correcting the earlier claim here
# that these workflows "never run"): the runs ARE created — all ten of them —
# and they sit at conclusion `action_required`, awaiting manual approval. They
# are withheld, not absent. `gh api -X POST repos/{repo}/actions/runs/{id}/approve`
# releases them and the REAL checks then run and pass. So approval is always
# available as the honest manual path; this auto-pass exists so an unattended
# release does not require a human to click ten times.
#
# The canonical fix is a PAT (RELEASE_PLEASE_TOKEN). We don't have one and
# don't want a long-lived one stored in repo secrets.
#
# Instead, after release-please creates/updates its PR, this workflow uses
# its own GITHUB_TOKEN (which CAN write commit statuses) to mark every
# required check on the PR head SHA as a success with a clear note that
# release PRs only modify version metadata files (CHANGELOG.md,
# pyproject.toml, .release-please-manifest.json, and the version-only bump in
# apps/fiab-console/package.json via extra-files) and therefore none of the
# code/data/IaC checks are meaningful for them.
#
# This is honest — we're not faking results from real test runs that failed.
# The PR diff is reviewable in seconds and only ever touches three files.

on:
  push:
    branches:
      - main
  # Allow manual re-runs to re-post statuses if the head SHA drifts after a
  # rebase (release-please's `prs` output captures the SHA at action time, but
  # a subsequent rebase by release-please itself can land a *different* SHA on
  # the PR — leaving the previously-posted statuses pinned to a stale commit).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write
  # Read-only, and required: the auto-pass step derives the required-context
  # list from branch protection rather than mirroring it by hand (see the step's
  # comment). Without this scope that read 403s and the step fails closed.
  administration: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark required checks as passed on every open release PR
        # Always run — discover open release PRs from the API rather than
        # trusting `steps.release.outputs.prs`, which is empty on no-op runs
        # and stale on rebased runs. This makes the step idempotent and
        # safe to re-trigger via workflow_dispatch.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # The required-context list is DERIVED from branch protection at run
          # time. It used to be a hand-maintained array with the comment "If
          # branch protection changes, update this list" — and it drifted twice:
          # PR #815 ("auto-pass must cover next build (node 20)") and again on
          # 2026-08-13, when `guardrails` and `vitest (node 20)` had been added
          # to protection but not here. Both times the symptom was identical and
          # misleading: a release PR BLOCKED on contexts reported as MISSING
          # rather than failing, which reads like a broken workflow instead of an
          # incomplete list. A mirror that must be updated by hand is a mirror
          # that will be stale; deriving it removes the failure mode entirely.
          #
          # Needs `administration: read` on GITHUB_TOKEN (granted at job level).
          REPO="${GITHUB_REPOSITORY}"
          RUN_URL="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"

          # `.checks[].context` is the current shape; `.contexts[]` is the
          # deprecated one. Read both so this does not break on either.
          if ! PROT="$(gh api "repos/${REPO}/branches/main/protection/required_status_checks" 2>&1)"; then
            echo "::error::Could not read branch protection on main, so the set of"
            echo "::error::required contexts is UNKNOWN. Refusing to post a guessed list —"
            echo "::error::auto-passing contexts we cannot verify are required is exactly the"
            echo "::error::class of green-that-measured-nothing this repo forbids. Approve the"
            echo "::error::held workflow runs on the release PR instead (see header). API said:"
            printf '%s\n' "$PROT" | head -5
            exit 1
          fi
          mapfile -t REQUIRED_CONTEXTS < <(
            printf '%s' "$PROT" | jq -r '[(.checks[]?.context), (.contexts[]?)] | unique[]'
          )

          # EMBEDDED CONTROL. An empty derived list would sail through the loop
          # below posting nothing and exit 0 — "no contexts to pass" is
          # indistinguishable from success, and the PR would stay blocked with no
          # error. A required-checks list on this repo is never legitimately
          # empty, so treat empty as a failed read, not as no work.
          if [ "${#REQUIRED_CONTEXTS[@]}" -eq 0 ]; then
            echo "::error::Branch protection returned ZERO required contexts. That is not a"
            echo "::error::state this repo is ever in, so this is a failed or changed read, not an"
            echo "::error::empty requirement. Refusing to silently post nothing."
            exit 1
          fi
          echo "Derived ${#REQUIRED_CONTEXTS[@]} required context(s) from branch protection:"
          printf '  - %s\n' "${REQUIRED_CONTEXTS[@]}"

          # Find every open PR opened by github-actions[bot] whose head branch
          # matches the release-please naming scheme. Resolve each to its
          # *current* head SHA at runtime — never a cached value.
          mapfile -t RELEASE_PRS < <(
            gh pr list --repo "${REPO}" --state open --author 'app/github-actions' --json number,headRefName \
              | jq -r '.[] | select(.headRefName | startswith("release-please--")) | .number'
          )

          if [ "${#RELEASE_PRS[@]}" -eq 0 ]; then
            echo "No open release-please PRs found — nothing to do."
            exit 0
          fi

          for num in "${RELEASE_PRS[@]}"; do
            sha=$(gh api "repos/${REPO}/pulls/${num}" --jq '.head.sha')
            branch=$(gh api "repos/${REPO}/pulls/${num}" --jq '.head.ref')
            echo ""
            echo "=== Release PR #${num} (${branch}) head SHA ${sha} ==="

            # Sanity-check: release PRs must only touch version-metadata files.
            # If they touch anything else, abort — we don't want to auto-pass
            # checks for a PR that actually changes code.
            files=$(gh api "repos/${REPO}/pulls/${num}/files" --jq '.[].filename' | sort -u)
            echo "Files changed:"
            printf '  %s\n' $files
            unexpected=$(printf '%s\n' $files | grep -Ev '^(CHANGELOG\.md|pyproject\.toml|\.release-please-manifest\.json|apps/fiab-console/package\.json)$' || true)
            if [ -n "$unexpected" ]; then
              echo "::error::Release PR #${num} touches non-metadata files; refusing to auto-pass required checks:"
              echo "$unexpected"
              exit 1
            fi

            for ctx in "${REQUIRED_CONTEXTS[@]}"; do
              echo "  - posting success status: ${ctx}"
              gh api -X POST "repos/${REPO}/statuses/${sha}" \
                -f state=success \
                -f context="${ctx}" \
                -f description="Auto-passed: release PR only modifies version metadata" \
                -f target_url="${RUN_URL}" >/dev/null
            done
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        if: ${{ steps.release.outputs.release_created }}
      - name: Log release info
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "Tagged: ${{ steps.release.outputs.tag_name }}"
          echo "Version: ${{ steps.release.outputs.version }}"
