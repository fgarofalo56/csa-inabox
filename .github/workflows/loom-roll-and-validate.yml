name: loom-roll-and-validate

# #2963 — SAY WHICH SHA THIS RUN ROLLS.
#
# A `workflow_run`-triggered run is stamped by GitHub with `github.sha`, i.e.
# the DEFAULT-BRANCH HEAD at trigger time — NOT the SHA it is about to roll
# (that is `github.event.workflow_run.head_sha`, the SHA of the image build
# that fired it). With no `run-name`, `gh run list` and the Actions UI show
# only that misleading head_sha, so every automatic roll appears to be "for"
# a commit it never touched. Live 2026-08-04, twice within the hour:
#   run 30961850347  stamped 75e7bf48  ROLLED 57c01e95
#   run 30963436640  stamped 8935fa43  ROLLED 75e7bf48
# Both deployed exactly the SHA they were given; both were read as deploying
# the wrong image, and #2963 was filed (and then auto-closed, see the
# auto-close step) off that misreading. The run title now states the truth.
run-name: >-
  roll ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.image_tag }}
  (${{ github.event_name == 'workflow_run' && 'build-triggered' || 'manual dispatch' }})

# Roll a built loom-console image to the Container App and validate the live
# URL actually serves it. Per user feedback after the 2026-05-26 incident
# where the image-build workflow succeeded but stale code shipped: every
# rollout now has to PROVE the new build is live before declaring success.
#
# ROLL-GATE SEQUENCE (rel-T22 / blocker B13):
#   1. Gate — vitest: confirm the `vitest (node 20)` required check CONCLUDED
#      success for the commit being rolled (cheap + exact, via the check-runs
#      API). An untested/failed commit is refused BEFORE anything ships.
#      The gate WAITS for a verdict rather than reading once: vitest is slower
#      than the image build that triggers this roll, so a single read lands
#      while the check is still in_progress (#2819). Three states, kept apart —
#      passed → proceed, failed → refuse, not-yet → keep waiting up to
#      LOOM_ROLL_VITEST_WAIT_MINUTES (default 50). A TIMEOUT IS A REFUSAL.
#   2. Roll the image → wait for revision health → purge Front Door. The purge
#      DISCOVERS the endpoint that backs the URL about to be validated (by
#      hostName or routed custom domain) rather than assuming a name, and an
#      unresolvable endpoint is a failure rather than a swallowed error — for
#      months it was neither, so the purge never once ran (#2828).
#   3. Validate the live URL (unauthenticated /health + /build-marker curls).
#   4. Gate — in-VNet UAT: start the `loom-uat` Container App Job (a full-visual
#      Playwright suite that runs INSIDE the console VNet, minting a session — no
#      MFA) and poll its execution to completion. A real UAT failure fails the
#      roll, which the Rollback step catches and reverts to the prior revision.
#   The pre-existing auto-rollback on live-validation failure remains the
#   BACKSTOP.
#
# The decision logic for gate 1 and for ':latest' image resolution lives in
# scripts/ci/roll-gate-decision.mjs with a node:test suite, because both
# previously collapsed "I could not determine this" into "the answer is no" and
# then stated the negative as fact. See scripts/ci/__tests__/.
#
# EMERGENCY VALVE: both test gates (vitest confirmation + UAT) are SKIPPABLE via
# the `skip_uat` dispatch input OR the repo variable `LOOM_ROLL_SKIP_UAT=true`,
# so a broken UAT harness (or a missing check-run on a legacy image) can never
# PERMANENTLY block an emergency roll. When skipped, the roll ships WITHOUT test
# verification and only the live-URL validation + auto-rollback protect it — a
# loud warning is emitted. A loom-uat job that is simply not deployed in this
# estate is treated the same way (loud warning, gate skipped) for the same
# reason.
#
# SC1 SUPPLY-CHAIN GATE (verify-before-roll): before anything ships, the image
# digest is cosign-VERIFIED against the keyless GitHub-Actions identity of the
# trusted build workflows (build-fiab-images-acr-tasks / full-app-deploy-
# commercial / gov-console-roll). An image that was not built+signed by that
# gated CI path (or that skipped its Trivy CRITICAL scan via the build valve)
# is REFUSED with a loud actionable error BEFORE the roll. Mirroring skip_uat,
# the `skip_signature_verify` dispatch input OR repo variable
# `LOOM_ROLL_SKIP_VERIFY=true` is the emergency valve. If the ACR data plane
# is unreachable (network-locked and the temporary open fails), the gate
# degrades to a loud warning — unreachable is not the same as unsigned, and an
# infra hiccup must never permanently block an emergency roll (same policy as
# the missing-loom-uat case). See docs/SUPPLY_CHAIN.md §7.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to roll (e.g. d07f330d094b10147945a086026119cdb18f409d, or "latest")'
        type: string
        required: true
        default: latest
      expected_sha:
        description: 'Expected SHA prefix (8 chars) — validation will check /api/version and /build-marker.txt contain this. Leave blank to skip.'
        type: string
        default: ''
      url:
        description: 'Public URL to probe'
        type: string
        default: 'https://csa-loom.limitlessdata.ai'
      skip_uat:
        description: 'EMERGENCY VALVE — skip the test gates (vitest confirmation + in-VNet UAT). The roll ships WITHOUT test verification; live-URL validation + auto-rollback remain.'
        type: boolean
        default: false
      skip_signature_verify:
        description: 'EMERGENCY VALVE — skip the SC1 cosign signature verification gate (mirrors skip_uat). The roll ships an image WITHOUT supply-chain verification.'
        type: boolean
        default: false
      uat_timeout_minutes:
        description: 'Minutes to wait for the loom-uat job before failing the UAT gate. Blank = auto (12 for the default slice, 100 for uat_grep=all).'
        type: string
        default: ''
      uat_grep:
        description: 'Playwright --grep slice for the UAT gate. Blank = the proven 13-test roll slice (~3.5 min). "all" = the whole functional suite (~84 min — exceeds the roll budget; use the scheduled run instead). Matches file paths as well as titles.'
        type: string
        default: ''
      uat_min_tests:
        description: 'Minimum tests the UAT run must COLLECT or the gate fails (guards against a stale/mangled grep silently narrowing the suite). Blank = auto (13 for the default slice).'
        type: string
        default: ''
  workflow_run:
    workflows: ['build-fiab-images-acr-tasks']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write
  # Read the `vitest (node 20)` check-run conclusion for the rolled commit.
  checks: read

# SERIALIZE ROLLS AGAINST THE SAME CONTAINER APP (#3159).
#
# This workflow had NO concurrency group, so two rolls could run
# `az containerapp update` against loom-console at the same time. The build
# lane serializes per-boundary, which staggers when rolls START but does not
# bound how long they OVERLAP: a roll's documented sequence is vitest gate
# (waits up to LOOM_ROLL_VITEST_WAIT_MINUTES, default 50) -> roll -> revision
# health -> Front Door purge -> live URL validate -> a full loom-uat Playwright
# suite. Build N+1 finishes and fires roll N+1 while roll N is still gating.
#
# Observed 2026-08-11: three build-triggered rolls of 92d18007 were in flight
# at once (two reported `skipped`, one ran). Concurrent updates return
# ContainerAppOperationInProgress, which is an unclassified failure in a deploy
# path under deploy-integrity.md R6 — and the loser of the race can trip the
# auto-rollback backstop, reverting a GOOD revision because of a collision.
#
# The group names the ROLL TARGET (resource group + app), not github.ref:
# rolls for different SHAs all target the SAME Container App, so a ref-keyed
# group would not serialize the thing that actually collides. It is a literal
# because GitHub does not expose the `env` context to a workflow-level
# `concurrency:` — and scripts/ci/__tests__/roll-image-attribution.test.mjs
# asserts the literal still matches env.RG_NAME + env.APP_NAME, so the two
# cannot drift apart silently.
#
# cancel-in-progress is FALSE, deliberately. Killing a roll mid-`az containerapp
# update` is how ContainerAppOperationInProgress gets left behind (recorded
# gotcha: never cancel a same-SHA auto-roll). A queued run that is superseded by
# a newer one has done nothing yet, and rolling the newer SHA is strictly better
# than rolling the older — that is GitHub's default pending-run behaviour and it
# is the correct one here.
concurrency:
  group: loom-roll-rg-csa-loom-admin-centralus-loom-console
  cancel-in-progress: false
env:
  AZURE_LOCATION: centralus
  RG_NAME: rg-csa-loom-admin-centralus
  ACR_NAME: acrloomk6mvh5sm6z7do
  APP_NAME: loom-console

jobs:
  # ── WHY THIS GATE JOB EXISTS (#3260) ────────────────────────────────────────
  #
  # The upstream image build is a matrix of ~12 INDEPENDENT images, so the RUN's
  # conclusion is the AND of all of them. Gating the roll on it froze the estate
  # whenever ANY image broke, even though loom-console had built fine and was
  # sitting in ACR. Measured 2026-08-11: loom-mcp failed for most of the day and
  # deploy-staleness reported the estate 5 commits behind, while every gate that
  # matters to the console was green.
  #
  # This job decides ONE thing — should the roll proceed? — and on the
  # workflow_run path it decides it by asking whether the loom-console job
  # succeeded. Nothing about the roll's own gates changes: image-exists, cosign
  # verify, vitest, health, version, build-marker and the in-VNet UAT all still
  # have to pass. Whether a SIBLING image built says nothing about whether this
  # console image is fit to deploy.
  #
  # It is a separate job so that "the console image is also broken" SKIPS the
  # roll rather than reddening it — that case is already reported by the build
  # workflow and does not need a second red run saying the same thing.
  #
  # ── ON workflow_dispatch THIS JOB DOES NOT ESTABLISH THAT A BUILD RAN (#3388) ─
  #
  # A dispatch names a TAG, not an upstream run, so there is no `workflow_run`
  # payload to read. This job used to short-circuit dispatch straight to
  # proceed=true under the name "Did the console image build?" — a green check
  # asserting a fact it had never looked up, in violation of deploy-integrity R7
  # ("an error must not state as fact something it did not establish"). Since
  # essentially every roll in this repo is dispatched, that meant the check was
  # green on the one path where it measured nothing, and run 31740009089 spent
  # its diagnostic time downstream discovering "the specified tag does not
  # exist".
  #
  # It now GOES AND LOOKS: for a 40-hex tag it queries the producer
  # (build-fiab-images-acr-tasks) for that head SHA and reports what the
  # loom-console matrix job actually concluded. When it cannot resolve an
  # answer — a "latest"/prefix tag, no completed producer run for the SHA, an
  # unreadable API — it says UNKNOWN in exactly those words rather than
  # implying yes.
  #
  # It still proceeds in every dispatch case, deliberately: a dispatch is the
  # emergency valve (roll an older good tag, roll an image rebuilt out of band)
  # and this job is not the enforcement point. `Gate — the image must EXIST in
  # ACR (unskippable)` is, and it is authoritative — it is what caught
  # 31740009089. What changes here is that the log states the assumption
  # instead of hiding it.
  gate:
    name: Should this roll proceed?
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      # What this job actually ESTABLISHED about the console image build, as
      # opposed to what it assumed. One of: success | failed | not-applicable
      # (workflow_run success — the run conclusion already covers it) |
      # unknown-*. Surfaced as an output so a reader (or a later step) sees the
      # evidence class, not just the yes/no.
      console_build: ${{ steps.check.outputs.console_build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          PRODUCER: build-fiab-images-acr-tasks.yml
        run: |
          set -uo pipefail
          ERR="$(mktemp)"

          # Read the loom-console matrix job's conclusion(s) out of a run.
          # Echoes one of: the conclusions, or an empty string. Returns non-zero
          # ONLY when the API itself could not be read — an empty answer is a
          # distinct case the callers below handle explicitly, because an empty
          # list reading as "not found" is this repo's recurring defect (#2819).
          console_conclusions() {
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$1/jobs?per_page=100" \
              --jq '.jobs[] | select(.name | test("loom-console")) | .conclusion' 2>"$ERR"
          }

          # ── DISPATCH: look it up, and say UNKNOWN when it cannot be looked up ──
          if [ "$EVENT" = 'workflow_dispatch' ]; then
            # The roll proceeds either way — see the header. The ACR image-exists
            # gate is the enforcement point; this is evidence, reported honestly.
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            TAG="${IMAGE_TAG:-}"

            if ! printf '%s' "$TAG" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "console_build=unknown-tag-not-a-sha" >> "$GITHUB_OUTPUT"
              echo "::notice::UNKNOWN whether a console image was built: the dispatched tag '${TAG}' is not a 40-hex commit SHA, so there is no producer run to look up. That is not a 'no' — a floating tag like 'latest' is a perfectly normal roll. The ACR image-exists gate below is what establishes there is something to roll (#3388)."
              exit 0
            fi

            if ! PRUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${PRODUCER}/runs?head_sha=${TAG}&per_page=100" --jq '[.workflow_runs[] | select(.status == "completed")] | sort_by(.run_started_at) | last | .id // empty' 2>"$ERR")"; then
              echo "console_build=unknown-producer-unreadable" >> "$GITHUB_OUTPUT"
              echo "::notice::UNKNOWN whether a console image was built for ${TAG}: could not read ${PRODUCER} runs. Detail: $(head -c 400 "$ERR")"
              exit 0
            fi

            if [ -z "${PRUN//[[:space:]]/}" ]; then
              echo "console_build=unknown-no-producer-run" >> "$GITHUB_OUTPUT"
              echo "::notice::UNKNOWN whether a console image was built for ${TAG}: ${PRODUCER} has no COMPLETED run for that head SHA. The image may still exist (built out of band, or retagged); it may equally never have been built. The ACR image-exists gate below decides (#3388)."
              exit 0
            fi

            if ! JOBS="$(console_conclusions "$PRUN")"; then
              echo "console_build=unknown-jobs-unreadable" >> "$GITHUB_OUTPUT"
              echo "::notice::UNKNOWN whether a console image was built for ${TAG}: found producer run ${PRUN} but could not read its jobs. Detail: $(head -c 400 "$ERR")"
              exit 0
            fi

            if [ -z "${JOBS//[[:space:]]/}" ]; then
              echo "console_build=unknown-no-console-job" >> "$GITHUB_OUTPUT"
              echo "::notice::UNKNOWN whether a console image was built for ${TAG}: producer run ${PRUN} reported NO job matching 'loom-console'. Either that matrix job was renamed or this query is wrong — either way nothing here establishes a build (#3388)."
              exit 0
            fi

            echo "loom-console conclusion(s) in producer run ${PRUN}: ${JOBS}"
            if printf '%s' "$JOBS" | grep -qvx 'success'; then
              echo "console_build=failed" >> "$GITHUB_OUTPUT"
              echo "::warning::The console image build for ${TAG} did NOT succeed (producer run ${PRUN}: ${JOBS}). Rolling anyway because a dispatch is the emergency valve and an image may exist from an earlier build of this tag — but if the next gate says 'the specified tag does not exist', THIS is why (#3388)."
            else
              echo "console_build=success" >> "$GITHUB_OUTPUT"
              echo "::notice::Console image for ${TAG} built successfully (producer run ${PRUN})."
            fi
            exit 0
          fi

          # ── workflow_run: unchanged behaviour ────────────────────────────────
          # The upstream run's own conclusion already answers this when it is a
          # success; only a failed run needs the per-job lookup.
          if [ "$CONCLUSION" = 'success' ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "console_build=not-applicable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # FAILS CLOSED on an unreadable answer. An empty list previously read as
          # "not found" across this repo (#2819); here it means UNKNOWN, and
          # unknown must not roll.
          if ! JOBS="$(console_conclusions "$RUN_ID")"; then
            echo "::error::Could not read the jobs of upstream run ${RUN_ID}, so whether loom-console built is UNKNOWN — refusing to roll. Detail: $(head -c 400 "$ERR")"
            exit 1
          fi
          if [ -z "${JOBS//[[:space:]]/}" ]; then
            echo "::error::Upstream run ${RUN_ID} reported NO job matching 'loom-console'. Either that matrix job was renamed or this query is wrong; either way nothing here establishes that a console image was built. Refusing."
            exit 1
          fi
          echo "loom-console conclusion(s): ${JOBS}"
          if printf '%s' "$JOBS" | grep -qvx 'success'; then
            echo "::notice::Upstream run ${RUN_ID} failed and loom-console is part of why — nothing new to roll. The build workflow already reports this; not reddening a second run for it."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "console_build=failed" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Upstream run ${RUN_ID} failed on a SIBLING image, but loom-console SUCCEEDED — rolling. A broken sibling does not make this console image unfit; the roll's own gates still decide that (#3260)."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "console_build=success" >> "$GITHUB_OUTPUT"
          fi

  roll-and-validate:
    name: Roll image + validate live URL
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    steps:
      - uses: actions/checkout@v7

      # The roll gates run as node scripts (scripts/ci/roll-*.mjs) so their
      # decision logic is unit-tested rather than living in untestable inline
      # YAML — see #2819. Pin the runtime rather than relying on whatever the
      # runner image happens to ship.
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Azure login
        uses: azure/login@v2.3.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Resolve inputs
        id: vars
        env:
          # #2819: this step calls `gh api` to list recent image builds and had
          # NO token, so the call failed, `2>/dev/null` ate the error, the
          # candidate loop ran ZERO times, and the workflow announced
          # "No recent main commit has a loom-console image in <acr>" — a claim
          # about a registry it never contacted (the whole step took 164ms).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # Upstream image-build runs on push-to-main; use that SHA.
            TAG="${{ github.event.workflow_run.head_sha }}"
            EXPECTED="${TAG:0:8}"
          else
            TAG="${{ inputs.image_tag }}"
            EXPECTED="${{ inputs.expected_sha }}"
            # ':latest' is NOT deterministic — it races the ACR image build (a roll
            # dispatched minutes after a merge re-deploys the PREVIOUS image and
            # reports success; happened live 2026-07-22). Resolve 'latest' to the
            # newest main SHA whose image build actually CONCLUDED success, and
            # roll that immutable SHA tag instead.
            if [[ "$TAG" == "latest" ]]; then
              # A successful build RUN does not imply THIS app was built: the
              # workflow takes an `apps:` input, so a subset dispatch (e.g.
              # apps=loom-risingwave,loom-unity) concludes success at a SHA for
              # which no loom-console image exists. Taking runs[0] blind then
              # resolved a tag that is not in ACR and the roll died at the digest
              # lookup (observed live on 02481198, issue #2646). Walk back through
              # recent successful runs and pick the newest whose image ACTUALLY
              # EXISTS in the registry.
              #
              # #2819: this loop used to be inline here, with
              # `az … >/dev/null 2>&1`, so "the registry says no" and "we could
              # not ask the registry" were the same branch — and the error
              # message asserted the former. The logic now lives in a tested
              # script that keeps found / absent / UNREACHABLE apart and refuses
              # rather than inventing a verdict. See
              # scripts/ci/__tests__/roll-gate-decision.test.mjs.
              # NOTE the redirect-to-file rather than `node … | tail -n1`: in a
              # pipeline $? is TAIL's status, so a refusing resolver would have
              # looked like a success and handed back its warning text. (The
              # SHA-shape check below would still have failed closed, but with
              # the wrong message — and depending on a second check to catch the
              # first one's silence is how this class of bug survives.)
              RESOLVE_LOG=$(mktemp)
              if node scripts/ci/roll-resolve-image-tag.mjs \
                   --acr "${{ env.ACR_NAME }}" --app "${{ env.APP_NAME }}" >"$RESOLVE_LOG" 2>&1; then
                cat "$RESOLVE_LOG"
                BUILT_SHA=$(tail -n 1 "$RESOLVE_LOG")
              else
                cat "$RESOLVE_LOG"
                echo "::error::Could not resolve ':latest' to a built ${{ env.APP_NAME }} image (reason above). Pass an explicit SHA image_tag."
                exit 1
              fi
              if ! [[ "$BUILT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::':latest' resolution returned '$BUILT_SHA', which is not a commit SHA — refusing to roll."
                exit 1
              fi
              if [[ "$BUILT_SHA" != "${{ github.sha }}" ]]; then
                echo "::warning::Newest completed image build is $BUILT_SHA, but main HEAD is ${{ github.sha }} — the HEAD image is not built yet. Rolling the newest BUILT image ($BUILT_SHA) deterministically."
              fi
              TAG="$BUILT_SHA"
              [[ -z "$EXPECTED" ]] && EXPECTED="${BUILT_SHA:0:8}"
              echo "::notice::Resolved ':latest' → immutable tag $TAG (newest successfully built main commit)."
            fi
          fi

          # #2963 — THE VALIDATION THAT WAS OPTIONAL ON THE RECOVERY PATH.
          #
          # `expected_sha` is a dispatch input that DEFAULTS TO EMPTY, and the
          # only place EXPECTED was ever derived from TAG was inside the
          # ':latest' branch above. So the operator's own emergency path —
          # dispatch with an explicit 40-hex image_tag, leave expected_sha
          # blank — reached loom-validate-live.sh with EXPECTED="", where BOTH
          # SHA assertions are conditional on it:
          #     if [[ -n "$EXPECTED_SHA" ]] && grep -q "sha=${EXPECTED_SHA}"
          #   → else "build-marker.txt is present (no SHA check requested)" PASS
          #     else "no expected SHA passed … (informational)"            PASS
          # i.e. the roll reported SUCCESS having proven nothing about which
          # image is live — exactly the property #2963 says must never hold.
          # A tag that IS a commit SHA always carries its own expectation.
          if [[ -z "$EXPECTED" && "$TAG" =~ ^[0-9a-f]{40}$ ]]; then
            EXPECTED="${TAG:0:8}"
            echo "::notice::No expected_sha given — derived '$EXPECTED' from the rolled tag. The live build-marker MUST carry it or this roll fails."
          fi
          if [[ -z "$EXPECTED" ]]; then
            echo "::error::Refusing to roll '$TAG' with no expected SHA to validate against: the live-URL gate would pass without proving which image is serving (#2963). Dispatch with a 40-hex commit SHA as image_tag, or set expected_sha."
            exit 1
          fi

          URL="${{ inputs.url }}"
          [[ -z "$URL" ]] && URL='https://csa-loom.limitlessdata.ai'
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:$TAG" >> "$GITHUB_OUTPUT"
          echo "previous_revision=$(az containerapp show -n ${{ env.APP_NAME }} -g ${{ env.RG_NAME }} --query properties.latestRevisionName -o tsv)" >> "$GITHUB_OUTPUT"

          # Full 40-hex commit SHA to check the vitest conclusion against.
          #  - workflow_run: the upstream image build ran on push-to-main → head_sha.
          #  - workflow_dispatch: use the rolled tag if it is itself a full SHA,
          #    else fall back to the checked-out ref (a "latest"/prefix tag can't
          #    be resolved to a commit — the vitest gate degrades to a warning).
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          elif [[ "$TAG" =~ ^[0-9a-f]{40}$ ]]; then
            COMMIT_SHA="$TAG"
          else
            COMMIT_SHA="${{ github.sha }}"
          fi
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

          # Emergency valve: skip the test gates (vitest + UAT) when the dispatch
          # input OR the repo variable LOOM_ROLL_SKIP_UAT is set true.
          SKIP_UAT="false"
          if [[ "${{ inputs.skip_uat }}" == "true" || "${{ vars.LOOM_ROLL_SKIP_UAT }}" == "true" ]]; then
            SKIP_UAT="true"
          fi
          echo "skip_uat=$SKIP_UAT" >> "$GITHUB_OUTPUT"

          # SC1 emergency valve: skip the cosign signature verification gate
          # when the dispatch input OR the repo variable LOOM_ROLL_SKIP_VERIFY
          # is set true (mirrors skip_uat).
          SKIP_VERIFY="false"
          if [[ "${{ inputs.skip_signature_verify }}" == "true" || "${{ vars.LOOM_ROLL_SKIP_VERIFY }}" == "true" ]]; then
            SKIP_VERIFY="true"
          fi
          echo "skip_verify=$SKIP_VERIFY" >> "$GITHUB_OUTPUT"

      - name: Gate — the image must EXIST in ACR (unskippable)
        id: imageexists
        # #2963 — ADOPT THE PREFLIGHT THE DEPLOY LANES ALREADY USE.
        #
        # scripts/ci/assert-acr-image-tags.sh has proven "this tag is really in
        # that registry" for deploy-fiab-{commercial,gcch,il5} since #2640, with
        # its own test (scripts/ci/test-assert-acr-image-tags.sh). The roll —
        # the one lane that mutates the LIVE console — never adopted it. The
        # only thing standing between a roll and a nonexistent image was a
        # side-effect of the SC1 cosign gate (its empty-digest branch), and that
        # gate is SKIPPABLE by `skip_signature_verify` / LOOM_ROLL_SKIP_VERIFY.
        # "I could not verify the signature" is a fine reason to skip signature
        # verification; it is not a reason to stop asking whether the image
        # exists at all. This step therefore carries NO `if:` — the emergency
        # valves cannot switch it off.
        #
        # THREE STATES, KEPT APART (the #2819 lesson — do not let "could not
        # ask" collapse into "the answer is no", or the reverse):
        #   present     → proceed
        #   absent      → REFUSE. Nothing to roll; rolling would create a
        #                 revision that can never pull.
        #   unreachable → loud WARNING, proceed. Unreachable ≠ absent, and a
        #                 locked registry must not permanently block an
        #                 emergency roll. This is SAFE because the post-roll
        #                 build-marker assertion is now unconditional (see the
        #                 EXPECTED derivation above): if a nonexistent image
        #                 were somehow rolled, traffic stays on the old
        #                 revision, the marker will not carry the expected SHA,
        #                 and Validate live URL fails + rolls back. The
        #                 end-to-end invariant "never green having deployed a
        #                 different SHA" holds without this step guessing.
        #
        # #3090 — HOW THIS STEP READS THE VERDICT.
        #
        # It used to split the two failure states by grepping the helper's PROSE:
        #
        #     if grep -q 'could not READ registry' <<<"$OUT"; then …proceed…
        #     else …REFUSE TO ROLL… fi
        #
        # Two ways that was wrong. (1) A guard that matches on a MESSAGE is one
        # copy-edit away from silently inverting — the same class as the route
        # guards that matched prose instead of behaviour. (2) It inherited the
        # helper's own misclassification: assert-acr-image-tags.sh was mapping
        # unreadable refs to MISSING, so the string never appeared, the `else`
        # fired, and the roll REFUSED with "does not exist in the registry"
        # about images that were in the registry. Measured on run 31228790204,
        # which blocked a merged federation fix from reaching the estate.
        #
        # The helper now exits 3 for ABSENT and 4 for UNPROVEN and that contract
        # is asserted by scripts/ci/test-assert-acr-image-tags.sh, so this reads
        # the EXIT CODE. No prose is matched.
        env:
          LOOM_ACR_LEASE_TTL_MINUTES: '15'
        run: |
          set -uo pipefail
          REF="${{ env.APP_NAME }}:${{ steps.vars.outputs.tag }}"
          set +e
          bash scripts/ci/assert-acr-image-tags.sh \
            --acr "${{ env.ACR_NAME }}" --rg "${{ env.RG_NAME }}" --lease "$REF"
          STATUS=$?
          set -e
          case "$STATUS" in
            0)
              echo "::notice::image-exists gate PASSED — ${{ env.ACR_NAME }}/$REF is in the registry."
              exit 0
              ;;
            4|5)
              # UNPROVEN (4), or present-but-re-lock-unverified (5). Neither is
              # evidence the image is missing, so neither may be reported as
              # such (deploy-integrity.md R7). Proceed with a loud warning: the
              # post-roll build-marker assertion is the definitive check.
              echo "::warning::Could not establish whether $REF exists in ${{ env.ACR_NAME }} (preflight exit $STATUS — the registry never answered the question; see its output above). This is UNPROVEN, NOT disproven, and it is NOT a reason to rebuild the image. Proceeding; the post-roll build-marker assertion (expected SHA ${{ steps.vars.outputs.expected }}) is the definitive check and will fail + roll back if the wrong image ends up serving."
              exit 0
              ;;
            3)
              echo "::error::REFUSING TO ROLL — the registry ANSWERED and ${{ env.ACR_NAME }}/$REF does not exist. The image build for this commit has not finished (or built a different app subset). Nothing to deploy; a roll would create a revision that can never pull. Wait for build-fiab-images-acr-tasks to finish this SHA, or dispatch with an image_tag that is built."
              exit 1
              ;;
          esac
          # Any other code is the PREFLIGHT failing, not a verdict about the
          # image (exit 2 is a usage error — i.e. a Loom bug in this step's
          # arguments). Fail closed, and claim nothing about the tag.
          echo "::error::REFUSING TO ROLL — the image-exists preflight itself failed with exit $STATUS, which is not one of its verdicts (0 present / 3 absent / 4 unproven / 5 re-lock unverified). Nothing is established about $REF. This is a defect in the gate invocation, not a statement about the registry; see scripts/ci/assert-acr-image-tags.sh."
          exit 1

      - name: Gate — require vitest (node 20) success for the rolled commit
        id: vitest_gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLL_VITEST_WAIT_MINUTES: ${{ vars.LOOM_ROLL_VITEST_WAIT_MINUTES || '50' }}
        # #2819: this gate used to read the check-run conclusion ONCE and refuse
        # when it was empty — but `.conclusion` is null while a check is QUEUED
        # or IN_PROGRESS, so "still running" was reported as
        #     "No 'vitest (node 20)' check-run found … Re-run CI on this commit"
        # That is not an edge case. The roll is triggered by the image build
        # completing, and vitest is SLOWER than the image build: on 5d51f961 the
        # build finished 11:23:11Z, this gate read at 11:23:30Z, and vitest ran
        # 11:05:25Z → 11:33:32Z and PASSED. Every console-touching commit hit it,
        # and the advice ("re-run CI") could not have helped.
        #
        # It now WAITS for a verdict. The three states are distinct:
        #   passed  → proceed        failed → refuse        not yet → keep waiting
        # and waiting is bounded — a timeout is a REFUSAL, never a silent pass.
        # Decision logic + tests: scripts/ci/roll-gate-decision.mjs.
        run: |
          set -e
          if [[ "${{ steps.vars.outputs.skip_uat }}" == "true" ]]; then
            echo "::warning::skip_uat/LOOM_ROLL_SKIP_UAT is set — SKIPPING the vitest confirmation gate. This roll is NOT test-verified."
            exit 0
          fi
          SHA="${{ steps.vars.outputs.commit_sha }}"
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::No resolvable commit SHA for tag '${{ steps.vars.outputs.tag }}' — cannot confirm vitest. Skipping this gate (dispatch of a non-SHA tag)."
            exit 0
          fi
          node scripts/ci/roll-vitest-gate.mjs "$SHA"

      - name: Install cosign
        if: steps.vars.outputs.skip_verify != 'true'
        uses: sigstore/cosign-installer@v4.1.2
        # PIN THE CLI. cosign-installer v4 defaults to Cosign v3.0.5 — a MAJOR
        # upgrade of the tool that signs every image this repo ships. Every
        # workflow that runs `cosign sign` / `cosign verify` is DISPATCH-ONLY, so
        # PR CI never exercises it: a green PR proves nothing about signing, and
        # the failure mode that matters is an image that signs fine and fails
        # `verify` AT ROLL TIME, which stops deploys (deploy-integrity R1).
        # Upstream discourages pinning "unless you have a specific reason";
        # not silently changing the signature format on a path CI cannot run is
        # a specific reason. Cosign v3 gets its own change, with a real receipt.
        with:
          cosign-release: v2.6.1

      - name: Gate — cosign signature verify (SC1 supply chain)
        id: sigverify
        # Verify-before-roll: the image must carry a keyless cosign signature
        # from a trusted build workflow (which only signs AFTER its Trivy
        # CRITICAL gate passed). Unsigned/unknown-identity images are REFUSED
        # before anything ships. The ACR is publicNetworkAccess=Disabled at
        # rest, and both the digest resolution and the cosign signature fetch
        # are data-plane calls — so the gate temporarily opens the ACR.
        #
        # #2603: "the restore step below re-locks it ONLY if this step opened
        # it" was NOT enough. Opening is not owning: this step could open a
        # registry a concurrent build had ALREADY opened and then re-lock it
        # under that build's in-flight push. The open is now a lease
        # acquisition, so the restore step re-locks only if this RUN is still
        # the recorded holder. See docs/fiab/acr-firewall-lease.md.
        if: steps.vars.outputs.skip_verify != 'true'
        run: |
          set -e
          TAG="${{ steps.vars.outputs.tag }}"
          echo "acr_opened=false" >> "$GITHUB_OUTPUT"

          # ── Is the ACR data plane open to this runner? ASK THE CONTROL PLANE.
          #
          # #2980/#2982 — this used to ask `az acr login`, and that is the WRONG
          # ORACLE. The step immediately before this one (the unskippable
          # image-exists gate, #2967) takes the shared ACR firewall lease and
          # RE-LOCKS the registry on exit — assert-acr-image-tags.sh carries
          # `trap release_lease EXIT`, and its output is swallowed by
          # `>/dev/null 2>&1`, so the re-lock is invisible in the log.
          #
          # ACR firewall changes take 30–90s to reach the DATA plane. So for the
          # first few seconds after that re-lock, `az acr login` still SUCCEEDS
          # against a stale-open data plane. This step therefore concluded
          # "reachable — no lease needed", skipped the lease, and the digest read
          # that followed was DENIED — and reported as "the tag does not exist",
          # about images whose digest the PREVIOUS STEP had printed seconds
          # earlier. An UNKNOWN rendered as a NEGATIVE (the #2819 class).
          #
          # Whether a roll hit it came down to how long the vitest gate in
          # between happened to take. Gap between the image-exists gate and this
          # one, 2026-08-05:
          #     7869d434   2.8s -> FAILED        30af2cee    36.6s -> passed
          #     e69a7763   7.6s -> FAILED        678b53bc   406s   -> passed
          #     248dbc83   2.2s -> FAILED        e07eaca8   503s   -> passed
          # Clean separation at the propagation window. The three that passed
          # each logged "ACR data plane unreachable (publicNetworkAccess=
          # Disabled)" — i.e. they got the RIGHT answer only because they asked
          # late enough.
          #
          # The CONTROL plane has no such lag: the re-lock is a synchronous ARM
          # write that completed inside the previous step. Ask it instead.
          PNA=$(az acr show -n "${{ env.ACR_NAME }}" --query publicNetworkAccess -o tsv | tr -d '\r' || echo "")
          DA=$(az acr show -n "${{ env.ACR_NAME }}" --query networkRuleSet.defaultAction -o tsv | tr -d '\r' || echo "")
          echo "ACR firewall (control plane): publicNetworkAccess=${PNA:-<unreadable>}, defaultAction=${DA:-<unreadable>}"
          if [[ "$PNA" != "Enabled" || "$DA" != "Allow" ]]; then
            echo "ACR data plane is network-locked — acquiring the firewall lease for signature verification ..."
            # A short lease + short wait: this is a ~1 min data-plane read, and a
            # roll must not sit behind a 2-hour build lease. If a build holds the
            # registry we fall through to the same "cannot verify" warning below.
            if LOOM_ACR_LEASE_TTL_MINUTES=20 LOOM_ACR_LEASE_WAIT_MINUTES=5 \
               bash scripts/csa-loom/acr-firewall-lease.sh acquire --acr "${{ env.ACR_NAME }}"; then
              echo "acr_opened=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Could not take the ACR firewall lease (another build/roll holds it) — CANNOT verify the image signature. SKIPPING the SC1 gate for this roll. Re-run once the holding run finishes."
              exit 0
            fi
          fi

          # ── Wait for the OPEN to reach the data plane. On the SAME HTTP path
          # cosign uses, because `az acr login` is not that path.
          #
          # #3210 — run 31454217160 failed here, and the previous fix had the
          # mirror image of the bug it fixed. The lease opened the registry and
          # this loop declared success in the SAME SECOND:
          #
          #   03:05:48.748  [acr-lease] opening ACR (Enabled, Allow) ...
          #   03:05:48.748  ACR data plane reachable after 1 attempt(s).
          #   03:05:51.221  Error: POST …/oauth2/token: DENIED: client with IP
          #                 '20.3.215.35' is not allowed access.
          #
          # `az acr login` authenticates through an ARM-mediated token exchange
          # and returned 0 while the registry was still denying cosign by IP.
          # The 30–90s propagation lag documented above applies to the OPEN
          # direction too; `az acr login` is the wrong oracle in BOTH.
          #
          # acr-dataplane-ready.sh probes `GET https://<acr><suffix>/v2/` with
          # plain curl — same host, same source IP, same TCP path cosign takes.
          # Measured both sides 2026-08-11: closed -> HTTP 403 DENIED, open ->
          # HTTP 401 UNAUTHORIZED. Self-tested offline in
          # scripts/ci/test-acr-dataplane-ready.sh.
          if ! bash "${LOOM_ACR_DATAPLANE_READY_SCRIPT:-scripts/ci/acr-dataplane-ready.sh}" --acr "${{ env.ACR_NAME }}" --timeout-seconds 180; then
            # Unreachable ≠ unsigned. Same policy as a missing loom-uat job:
            # loud warning, gate skipped — an infra hiccup must never
            # permanently block an emergency roll.
            echo "::warning::Could not reach the ACR data plane after ~3 min — CANNOT verify the image signature. SKIPPING the SC1 gate for this roll (the image may or may not be signed). Investigate the ACR network toggle (an Azure Policy may be reverting it)."
            exit 0
          fi
          # Now mint the data-plane token cosign uses. This is a credential step,
          # not a reachability probe.
          #
          # THROUGH THE RETRY HELPER (#3230), never bare. The probe above having
          # returned READY means the NETWORK is open; it says nothing about the
          # AAD→ACR token exchange, which has its own propagation window after
          # the firewall opens. Run 31494527960 failed here with the registry
          # network confirmed open seconds earlier:
          #
          #   [acr-dataplane-ready] READY after 1 attempt(s) — HTTP 401
          #   WARNING: Unable to get AAD authorization tokens … CONNECTIVITY_REFRESH_TOKEN_ERROR
          #   Access to registry … was denied. Response code: 403.
          #
          # acr-login-retry.sh retries ONLY that named transient set and fails
          # closed on anything else, so a real credential fault still goes red.
          #
          # #3383 raised that helper's default budget from ~60s to ~180s, matching
          # the --timeout-seconds 180 the network probe above already gets. Run
          # 31732873272 exhausted the old 60s here and rolled the estate back two
          # commits; sibling roll 31730667086 minted its token in ~3s off an
          # identically-timed probe. Same code, same registry, same identity —
          # only the tail differed. Budgeting the two halves of one propagation
          # window asymmetrically, while documenting them as separate windows,
          # was the defect.
          #
          # NOT `>/dev/null`. Silencing the success path is why the failing and
          # succeeding runs looked like they took DIFFERENT code paths in the
          # logs — the success emitted nothing between the probe and cosign, so
          # the obvious (wrong) reading was that a regression had removed the
          # login entirely. A step whose quiet path is indistinguishable from an
          # absent step costs more in misdiagnosis than it saves in log noise.
          bash scripts/ci/acr-login-retry.sh --acr "${{ env.ACR_NAME }}"

          # ── Resolve the manifest digest. Bounded retry; FAILS CLOSED.
          #
          # Was: `az acr repository show … 2>/dev/null || echo ""`, then "empty
          # means the tag does not exist". That discarded the registry's answer
          # and asserted a fact it never established. scripts/ci/resolve-acr-digest.sh
          # keeps the three states apart and is self-tested
          # (scripts/ci/test-resolve-acr-digest.sh) including the mutation that
          # matters: a registry that never returns a digest comes out RED.
          #   exit 0 -> digest on stdout   exit 3 -> genuinely absent
          #   exit 4 -> could not READ the registry within the budget
          set +e
          DIGEST=$(bash scripts/ci/resolve-acr-digest.sh \
                     --acr "${{ env.ACR_NAME }}" --image "${{ env.APP_NAME }}:$TAG")
          RESOLVE_RC=$?
          set -e
          if [[ $RESOLVE_RC -eq 3 ]]; then
            echo "::error::REFUSING TO ROLL — ${{ env.APP_NAME }}:$TAG does not exist in ${{ env.ACR_NAME }}: the registry answered NOT FOUND on every attempt. Nothing to roll; check the image_tag input, or wait for build-fiab-images-acr-tasks to finish this SHA."
            exit 1
          fi
          if [[ $RESOLVE_RC -ne 0 || -z "$DIGEST" ]]; then
            echo "::error::REFUSING TO ROLL — could not READ ${{ env.ACR_NAME }} to resolve a manifest digest for ${{ env.APP_NAME }}:$TAG (see the resolver output above). This is NOT proof the tag is missing; the registry never answered. Rolling an image whose signature cannot be verified is worse than not rolling, so this gate fails closed. Most likely the ACR firewall is closed to this runner or a firewall change has not propagated."
            exit 1
          fi
          REF="${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}@$DIGEST"
          echo "Verifying cosign signature on $REF ..."
          IDENTITY_RE="^https://github\\.com/${{ github.repository }}/\\.github/workflows/(build-fiab-images-acr-tasks\\.yml|full-app-deploy-commercial\\.yml|gov-console-roll\\.yml)@"

          # ── Three outcomes, not two. `cosign verify` exits non-zero for
          # "this image is not signed by a trusted identity" AND for "I could
          # not talk to the registry", and #3210 collapsed both into the first.
          # Run 31454217160 printed, verbatim:
          #
          #   Error: POST …/oauth2/token: DENIED: client with IP … is not allowed access
          #   ::error::SC1 SUPPLY-CHAIN GATE FAILED — … has NO valid cosign signature
          #
          # The second sentence is not a fact the first sentence supports. That
          # is deploy-integrity.md R7, and it sent the roll's failure into the
          # supply-chain bucket instead of the networking one. Transport denials
          # are RETRIED (propagation is the usual cause) and, if they persist,
          # reported as what they are.
          COS_LOG="$(mktemp)"
          VERDICT=""
          for attempt in 1 2 3; do
            if cosign verify "$REF" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                --certificate-identity-regexp "$IDENTITY_RE" \
                --output text >"$COS_LOG" 2>&1; then
              VERDICT="signed"; break
            fi
            if grep -qiE "DENIED|is not allowed access|no route to host|TLS handshake|connection refused|i/o timeout|502 Bad Gateway|503 Service" "$COS_LOG"; then
              VERDICT="unreachable"
              echo "::warning::cosign attempt ${attempt}/3 could not REACH the registry (not a signature verdict): $(head -c 300 "$COS_LOG" | tr -d '\r\n')"
              sleep 30
              continue
            fi
            VERDICT="unsigned"; break
          done
          sed -n '1,80p' "$COS_LOG"

          if [[ "$VERDICT" == "signed" ]]; then
            echo "::notice::SC1 supply-chain gate PASSED — $REF is cosign-signed by a trusted build workflow (Trivy CRITICAL gate passed at build time)."
          elif [[ "$VERDICT" == "unreachable" ]]; then
            # Same policy as the readiness timeout above: an infra fault must not
            # masquerade as a supply-chain verdict, and must not permanently
            # block an emergency roll.
            echo "::warning::CANNOT VERIFY — cosign could not reach ${{ env.ACR_NAME }} on any of 3 attempts (last: $(head -c 300 "$COS_LOG" | tr -d '\r\n')). This says NOTHING about whether ${{ env.APP_NAME }}:$TAG is signed. SKIPPING the SC1 gate for this roll. Investigate the ACR firewall/propagation, not the build."
          else
            echo "::error::SC1 SUPPLY-CHAIN GATE FAILED — ${{ env.APP_NAME }}:$TAG ($DIGEST) has NO valid cosign signature from a trusted build workflow. The registry ANSWERED and the signature was absent or from an untrusted identity (see the cosign output above). This image was NOT produced by the gated CI path (or was built with skip_supply_chain, or predates SC1). Fix: rebuild the commit via build-fiab-images-acr-tasks (which scans + signs), then re-roll. Emergency only: re-dispatch this roll with skip_signature_verify=true or set repo variable LOOM_ROLL_SKIP_VERIFY=true."
            exit 1
          fi

      - name: Skip notice — signature verification
        if: steps.vars.outputs.skip_verify == 'true'
        run: |
          echo "::warning::skip_signature_verify/LOOM_ROLL_SKIP_VERIFY is set — SKIPPING the SC1 cosign verification gate. This roll ships an image WITHOUT supply-chain verification."

      - name: Restore ACR network lock (post-verify)
        if: always() && steps.sigverify.outputs.acr_opened == 'true'
        run: |
          bash scripts/csa-loom/acr-firewall-lease.sh release --acr "${{ env.ACR_NAME }}"

      - name: Roll Container App to new image
        id: roll
        run: |
          az containerapp update -n ${{ env.APP_NAME }} -g ${{ env.RG_NAME }} \
            --image "${{ steps.vars.outputs.image }}" \
            --set-env-vars "LOOM_VERSION=v-${{ steps.vars.outputs.expected }}" \
                            "NEXT_PUBLIC_LOOM_VERSION=v-${{ steps.vars.outputs.expected }}"
          NEW_REV=$(az containerapp show -n ${{ env.APP_NAME }} -g ${{ env.RG_NAME }} --query properties.latestRevisionName -o tsv)
          echo "new_revision=$NEW_REV" >> "$GITHUB_OUTPUT"
          echo "::notice::Rolled to revision $NEW_REV with image ${{ steps.vars.outputs.image }}"

      - name: Wait for revision health
        id: health
        # #2963 — THIS LOOP COULD NOT FAIL.
        #
        # It ran ten probes, `break`-ing on Healthy+Running, and then simply
        # ENDED. An image that never pulls (a tag that is not in the registry
        # → ImagePullBackOff) walked straight through a step named "Wait for
        # revision health" and reported success — the result of every probe was
        # discarded. Same class as the `|| true` purge (#2828) and the
        # 164ms ACR probe that never called ACR (#2819): a control that runs,
        # observes the bad state, and reads green.
        #
        # It now has a verdict, and the verdict has teeth. It also asserts the
        # revision is actually running THE IMAGE WE ASKED FOR — the roll's core
        # promise, checked against the control plane before we go anywhere near
        # a cached HTTP probe.
        run: |
          set -uo pipefail
          REV="${{ steps.roll.outputs.new_revision }}"
          WANT="${{ steps.vars.outputs.image }}"
          OK=false
          for i in $(seq 1 10); do
            STATE=$(az containerapp revision show -n ${{ env.APP_NAME }} -g ${{ env.RG_NAME }} \
              --revision "$REV" \
              --query "{health:properties.healthState, running:properties.runningState}" -o tsv)
            echo "[$i] $STATE"
            if [[ "$STATE" == *"Healthy"* && "$STATE" == *"Running"* ]]; then OK=true; break; fi
            sleep 10
          done
          if [[ "$OK" != "true" ]]; then
            echo "::error::Revision $REV never reached Healthy+Running after ~100s (last state: ${STATE:-<none>}). The most common cause is an image the revision cannot pull. NOT proceeding to validation on an unhealthy roll."
            exit 1
          fi

          # The revision must be running the image this run resolved. If these
          # disagree, the roll did not do what the run says it did — which is
          # the entire subject of #2963.
          GOT=$(az containerapp revision show -n ${{ env.APP_NAME }} -g ${{ env.RG_NAME }} \
            --revision "$REV" --query "properties.template.containers[0].image" -o tsv | tr -d '\r')
          if [[ "$GOT" != "$WANT" ]]; then
            echo "::error::Revision $REV is running '$GOT' but this roll resolved '$WANT'. A roll must never report success having deployed a different image than it was asked for (#2963)."
            exit 1
          fi
          echo "::notice::Revision $REV is Healthy+Running on $GOT (matches the requested image)."

      # #2828 — the purge that had NEVER executed.
      #
      # This lived at the tail of "Wait for revision health" and read:
      #
      #   FD_PROFILE=$(az afd profile list -g "$RG" --query "[0].name" -o tsv)  # discovered
      #   az afd endpoint purge --profile-name "$FD_PROFILE" -g "$RG" \
      #     --endpoint-name loom-console --content-paths '/*' --no-wait || true # ASSUMED
      #
      # The real endpoint carries a per-deployment suffix (loom-console-<suffix>),
      # so every roll's purge failed `ResourceNotFound` — and `|| true` discarded
      # the verdict inside a step that reported success, which is also why the
      # error was invisible: it was buried in a step about revision health. Same
      # class as #2819 / #2775: a control that runs, fails, and reads green.
      #
      # Both the profile AND the endpoint are now DISCOVERED, and the endpoint is
      # chosen because it BACKS THE URL WE ARE ABOUT TO VALIDATE — its own
      # hostName, or a custom domain routed to it (the live shape: the roll probes
      # the vanity domain, which no endpoint hostName equals). Never by index:
      # "[0].name" is the same assumption one line over. Selection logic +
      # unit tests: scripts/ci/fd-resolve-purge-target.mjs.
      #
      # THREE STATES, KEPT APART — the #2819 lesson applied here:
      #   not-applicable  no AFD profile in the RG. Front Door is opt-in
      #                   (frontDoorEnabled, default off), so this is a legitimate
      #                   estate shape -> ::notice::, continue.
      #   unresolved      profiles exist but none has an endpoint backing this URL
      #                   (or two-plus candidates and no match). We cannot claim
      #                   the cache was cleared, so the validation that follows
      #                   cannot be trusted -> ::error:: naming the host sought AND
      #                   every endpoint/domain that exists -> FAIL the step.
      #                   Deterministic misconfiguration; retrying cannot help.
      #   resolved        purge it. A purge API error is RETRIED (3x, backoff) and,
      #                   if it still fails, is a loud ::warning:: rather than a
      #                   roll-blocker — the same policy this file already applies
      #                   to an unreachable ACR in the SC1 gate: an infra hiccup
      #                   must never permanently block a roll, but it must never
      #                   read as success either. Unreachable != purged.
      #
      # Blast radius of a FAIL here: the run goes red and files an issue, but the
      # Rollback step keys on validate/uat outcomes, so a healthy new revision is
      # NOT reverted for a Front Door discovery problem.
      #
      # IS THE PURGE EVEN LOAD-BEARING? (#2828 follow-up.) `--no-wait` means
      # SUBMITTED, not COMPLETED, and Learn is explicit that a purge "can take up
      # to 10 minutes to propagate across all Azure Front Door POP locations" —
      # so NO sleep in this workflow can make "submitted" mean "cleared". If the
      # route caches, the validation below really can read a stale page.
      #
      # It does not, in this platform, and that was MEASURED rather than assumed
      # — three independent layers agreeing:
      #   1. TEMPLATE — modules/admin-plane/front-door.bicep declares
      #      `console-route` (patternsToMatch '/*') with NO `cacheConfiguration`
      #      property at all. For Microsoft.Cdn AFD routes, absent == caching
      #      disabled. Every estate this repo deploys inherits that.
      #   2. RESOURCE — `az afd route list` on the live centralus profile returns
      #      `cacheConfiguration: null` for `console-route`.
      #   3. BEHAVIOUR — every path this roll validates (/build-marker.txt,
      #      /api/health, /api/version, /items/notebook/new, /) answers
      #      `X-Cache: CONFIG_NOCACHE`, which Learn defines as "configured to not
      #      cache in the Front Door profile".
      # So today the purge clears an empty cache and `--no-wait` costs nothing.
      #
      # Two things that do NOT provide that guarantee, so nothing here leans on
      # them:
      #   - Origin `Cache-Control`. The HTML paths send `no-store`, but
      #     /api/health and /api/version send NO cache-control at all, and Learn
      #     says Front Door then picks its own 1–3 day TTL. Origin headers alone
      #     would leave those two cacheable.
      #   - The `?_<epoch>` cache-buster in loom-validate-live.sh. Front Door's
      #     default query-string behaviour is IGNORE query string, so every
      #     buster collapses to the same cache key. It would not bust anything in
      #     the world where busting mattered.
      #
      # The single load-bearing fact is therefore `cacheConfiguration == null`,
      # and a comment asserting it would rot the day someone enables caching for
      # a perfectly good reason (e.g. /_next/static/*). So the step READS it —
      # `caching=on|off|unknown` from the resolver — and pays for awaiting the
      # purge only where awaiting buys something:
      #   off      submit with --no-wait; nothing is cached, so completion is
      #            irrelevant. Zero added deploy time. This is today.
      #   on       AWAIT completion (no --no-wait), bounded by
      #            FD_PURGE_TIMEOUT_SECONDS (default 300) so a slow purge can
      #            never hang a roll; a timeout is a loud ::warning::, not silence.
      #   unknown  treated as `on`. Absence of evidence read as success is the
      #            #2828 defect itself; it does not get to reappear here.
      # The purge is still issued when caching is off — an unexercised purge path
      # is exactly how #2828 stayed invisible for months.
      #
      # PUBLIC REPO: `az afd route list --query "[].customDomains[].id"` returns
      # ARM ids containing the subscription. They are basenamed here and never
      # printed.
      - name: Purge Front Door (endpoint discovered, never assumed)
        id: fdpurge
        env:
          RG: ${{ env.RG_NAME }}
          PROBE_URL: ${{ steps.vars.outputs.url }}
          # Mapped from a repo variable, not just read from the shell: an
          # undeclared `${FD_PURGE_TIMEOUT_SECONDS:-300}` could only ever BE 300,
          # since nothing in Actions puts repo/org variables in the step
          # environment. That is a knob that does not turn — the same shape of
          # defect as the rest of this file's history. Set the repo variable to
          # change it; the `:-300` below is only a belt-and-braces default.
          FD_PURGE_TIMEOUT_SECONDS: ${{ vars.FD_PURGE_TIMEOUT_SECONDS || '300' }}
        run: |
          REC="$(mktemp)"
          PROFILES=$(az afd profile list -g "$RG" --query "[].name" -o tsv 2>/dev/null | tr -d '\r' || true)

          for P in $PROFILES; do
            printf 'profile\t%s\n' "$P" >> "$REC"
            CDLIST=$(az afd custom-domain list --profile-name "$P" -g "$RG" \
              --query "[].[name,hostName]" -o tsv 2>/dev/null | tr -d '\r' || true)
            EPLIST=$(az afd endpoint list --profile-name "$P" -g "$RG" \
              --query "[].[name,hostName]" -o tsv 2>/dev/null | tr -d '\r' || true)
            EPNAMES=$(printf '%s\n' "$EPLIST" | awk -F'\t' 'NF{print $1}')
            for EN in $EPNAMES; do
              EH=$(printf '%s\n' "$EPLIST" | awk -F'\t' -v n="$EN" '$1==n{print $2; exit}')
              printf 'endpoint\t%s\t%s\t%s\n' "$P" "$EN" "${EH:-}" >> "$REC"
              # Which custom domains are routed to THIS endpoint. `$EN` traces back
              # to the `az afd endpoint list` above — the shape
              # check-afd-endpoint-discovery requires. Basename the ARM ids: this
              # repo is public and those ids carry the subscription.
              CDNAMES=$(az afd route list --profile-name "$P" -g "$RG" --endpoint-name "$EN" \
                --query "[].customDomains[].id" -o tsv 2>/dev/null \
                | awk -F/ '{print $NF}' | tr -d '\r' || true)
              for CDN in $CDNAMES; do
                CDH=$(printf '%s\n' "$CDLIST" | awk -F'\t' -v n="$CDN" '$1==n{print $2; exit}')
                if [ -n "${CDH:-}" ]; then
                  printf 'domain\t%s\t%s\t%s\n' "$P" "$EN" "$CDH" >> "$REC"
                fi
              done
              # Does anything on this endpoint actually CACHE? An AFD route with
              # no cacheConfiguration does not cache at all, which is what makes
              # `--no-wait` free rather than a gap. Emitted as a count so a failed
              # query stays UNKNOWN instead of collapsing into "0 == off".
              CACHEN=$(az afd route list --profile-name "$P" -g "$RG" --endpoint-name "$EN" \
                --query "length([?cacheConfiguration!=null])" -o tsv 2>/dev/null | tr -d '\r' || true)
              if [ -n "${CACHEN:-}" ]; then
                printf 'cache\t%s\t%s\t%s\n' "$P" "$EN" "$CACHEN" >> "$REC"
              fi
            done
          done

          VERDICT="$(node scripts/ci/fd-resolve-purge-target.mjs --url "$PROBE_URL" --input "$REC")"
          STATE=$(printf '%s\n' "$VERDICT" | sed -n 's/^state=//p')
          FD_PROFILE=$(printf '%s\n' "$VERDICT" | sed -n 's/^profile=//p')
          FD_ENDPOINT=$(printf '%s\n' "$VERDICT" | sed -n 's/^endpoint=//p')
          FD_VIA=$(printf '%s\n' "$VERDICT" | sed -n 's/^via=//p')
          FD_CACHING=$(printf '%s\n' "$VERDICT" | sed -n 's/^caching=//p')
          FD_DETAIL=$(printf '%s\n' "$VERDICT" | sed -n 's/^detail=//p')

          if [[ "$STATE" == "not-applicable" ]]; then
            echo "::notice::No Front Door profile in $RG — nothing to purge (Front Door is opt-in via frontDoorEnabled). The live-URL validation below reads the origin directly."
            exit 0
          fi

          if [[ "$STATE" != "resolved" ]]; then
            echo "::error::Front Door purge target UNRESOLVED for $PROBE_URL — $FD_DETAIL. The roll cannot claim the CDN cache was cleared, so the live-URL validation that follows may be reading a cached page (this is #2828: the purge silently failed for every roll before this). The endpoints that DO exist are listed above; either point the roll's \`url\` input at a host one of them serves, or wire the custom domain to a route."
            exit 1
          fi

          echo "::notice::Front Door purge target: profile=$FD_PROFILE endpoint=$FD_ENDPOINT (via $FD_VIA — $FD_DETAIL)"

          # Await the purge only where awaiting buys something — see the header
          # comment. `off` is the measured state of every estate this repo
          # deploys, so the common path adds zero deploy time.
          PURGE_TIMEOUT="${FD_PURGE_TIMEOUT_SECONDS:-300}"
          if [[ "$FD_CACHING" == "off" ]]; then
            PURGE_ARGS=(--no-wait)
            PURGE_VERB="submitted"
            echo "::notice::Route caching is DISABLED on $FD_ENDPOINT (no route carries a cacheConfiguration), so Front Door caches nothing for this URL and answers X-Cache: CONFIG_NOCACHE. The purge is issued anyway — to keep the path exercised, which is what #2828 lacked — with --no-wait, because there is no cache whose clearing the validation below needs to wait for."
          else
            PURGE_ARGS=()
            PURGE_VERB="completed"
            if [[ "$FD_CACHING" == "on" ]]; then
              echo "::warning::Route caching is ENABLED on $FD_ENDPOINT. That makes this purge load-bearing for the live-URL validation that follows, so the roll now AWAITS its completion (bounded at ${PURGE_TIMEOUT}s) instead of firing and forgetting. Expect this roll to take longer. NOTE: completion of the control-plane operation is still not POP propagation, which Learn says can take up to 10 minutes — if validation starts flaking on stale content, that is the reason, and the fix is to exclude the validated paths from caching rather than to sleep longer."
            else
              echo "::warning::Could NOT determine whether route caching is enabled on $FD_ENDPOINT (the 'az afd route list' cacheConfiguration query returned nothing). Treating UNKNOWN as ENABLED and awaiting the purge (bounded at ${PURGE_TIMEOUT}s) — reading absence of evidence as 'nothing is cached' is the exact #2828 defect and does not get to reappear here."
            fi
          fi

          PURGED=false
          TIMED_OUT=false
          for ATTEMPT in 1 2 3; do
            ERR="$(mktemp)"
            # `|| RC=$?` and not `if ...; then`: a bare `if` whose condition fails
            # and has no else returns 0, so `$?` after the `fi` would report the
            # IF, not the purge — a control reading green off the wrong subject,
            # which is the whole reason this file has a #2828 in it.
            RC=0
            timeout "$PURGE_TIMEOUT" az afd endpoint purge --profile-name "$FD_PROFILE" -g "$RG" \
              --endpoint-name "$FD_ENDPOINT" --content-paths '/*' "${PURGE_ARGS[@]}" 2>"$ERR" || RC=$?
            if [[ "$RC" == "0" ]]; then
              PURGED=true
              echo "::notice::Front Door purge $PURGE_VERB for $FD_ENDPOINT (/*) on attempt $ATTEMPT."
              break
            fi
            echo "[fd-purge] attempt $ATTEMPT failed (exit $RC); az stderr:" >&2
            sed -e 's/^/  /' "$ERR" >&2 || true
            # 124 is `timeout` killing a purge that was still running. Retrying
            # restarts the same slow operation and burns another timeout, so stop.
            if [[ "$RC" == "124" ]]; then TIMED_OUT=true; break; fi
            if [[ "$ATTEMPT" != "3" ]]; then sleep $(( ATTEMPT * 10 )); fi
          done

          if [[ "$TIMED_OUT" == "true" ]]; then
            echo "::warning::Front Door purge did NOT complete within ${PURGE_TIMEOUT}s on $FD_ENDPOINT (profile $FD_PROFILE) — it was submitted and is very likely still running, but this roll can no longer claim the cache was cleared, so the live-URL validation below may read a cached page. Not roll-blocking (same policy as an unreachable ACR in the SC1 gate: unreachable != unsigned, incomplete != unpurged), but not silent either. Raise FD_PURGE_TIMEOUT_SECONDS if this recurs."
          elif [[ "$PURGED" != "true" ]]; then
            echo "::warning::Front Door purge FAILED after 3 attempts against the CORRECTLY RESOLVED endpoint $FD_ENDPOINT (profile $FD_PROFILE) — see the az stderr above. The endpoint is right, so this is a CDN control-plane problem, not the #2828 addressing bug; treating it the same way this workflow treats an unreachable ACR in the SC1 gate: loud, not roll-blocking. The live-URL validation below may therefore read a cached page."
          fi

          # Settle time for the revision flip, NOT purge propagation. This sleep
          # predates the purge (it sat at the tail of "Wait for revision health")
          # and 20s was never remotely enough for a POP purge — Learn says up to
          # 10 minutes. It is kept because ingress can lag a revision going
          # Healthy+Running, and removing it would be trading a proven-harmless
          # 20s for a flake class this workflow has already been burned by
          # (#1249/#1300/#1303/#1305/#1306). It is NOT the purge's guarantee.
          sleep 20

      - name: Validate live URL
        id: validate
        run: |
          chmod +x .github/scripts/loom-validate-live.sh
          bash .github/scripts/loom-validate-live.sh \
            "${{ steps.vars.outputs.url }}" \
            "${{ steps.vars.outputs.expected }}"

      - name: Gate — in-VNet UAT (loom-uat Container App Job)
        id: uat
        # Runs AFTER the new revision is serving. The loom-uat job runs a Playwright
        # slice from INSIDE the console VNet (it mints a session from the console's
        # SESSION_SECRET — no MFA/user creds) and its process exits non-zero on a
        # REAL code failure (crash/empty/non-infra bug) while exiting 0 when the
        # only failures are honest infra-gates.
        # A real failure fails THIS step → the Rollback step below reverts.
        #
        # SCOPE: this gate runs the 13-test roll slice by default, NOT the whole
        # suite — see the scope block in `run:` for the measurements behind that
        # and for why the full suite belongs on a schedule (#3164). The collected
        # count is asserted (UAT_MIN_TESTS) so a stale or mangled grep cannot
        # silently shrink the gate the way it did on 2026-08-08.
        #
        # Skippable (skip_uat / LOOM_ROLL_SKIP_UAT). A MISSING job is a loud
        # warning, not a hard block — so a not-yet-deployed harness can't
        # permanently block rolls. The authoritative signal is the job
        # EXECUTION status (Succeeded/Failed); the Log Analytics UAT_RESULT line
        # is pulled best-effort for a human-readable summary (LA ingestion lags,
        # so it is never the gate).
        env:
          RG: ${{ env.RG_NAME }}
          SKIP_UAT: ${{ steps.vars.outputs.skip_uat }}
          UAT_TIMEOUT_IN: ${{ inputs.uat_timeout_minutes || '' }}
          UAT_GREP_IN: ${{ inputs.uat_grep || '' }}
          UAT_MIN_TESTS_IN: ${{ inputs.uat_min_tests || '' }}
        run: |
          set -e
          az config set extension.use_dynamic_install=yes_without_prompt -o none 2>/dev/null || true

          if [[ "$SKIP_UAT" == "true" ]]; then
            echo "::warning::skip_uat/LOOM_ROLL_SKIP_UAT is set — SKIPPING the in-VNet UAT gate. This roll is NOT UAT-verified. Live-URL validation + auto-rollback remain the backstop."
            exit 0
          fi

          if ! az containerapp job show -n loom-uat -g "$RG" -o none 2>/dev/null; then
            echo "::warning::loom-uat Container App Job not found in $RG — the in-VNet UAT harness is not deployed in this estate. SKIPPING the UAT gate. Deploy it by dispatching the deploy-loom-uat workflow (gh workflow run deploy-loom-uat.yml --ref main -f dry_run=false) — #2816 gave that script a CI entry point, so this no longer needs a workstation. Live-URL validation + auto-rollback remain the backstop."
            exit 0
          fi

          # ---- Gate scope, computed HERE and not in `default:` -----------------
          # This workflow ALSO fires on `workflow_run` (build-fiab-images-acr-tasks
          # completed). On that trigger `inputs.*` is EMPTY and workflow_dispatch
          # `default:` values DO NOT APPLY. A slice living only in `default:` would
          # therefore cover manual dispatches and leave every AUTOMATIC roll running
          # the full suite — so the fallback is computed in this shell, which is the
          # one place both triggers pass through.
          #
          # Default = the proven 13-test roll slice. Measured live 2026-08-08 on
          # execution loom-uat-0l7o7p9: "Running 13 tests using 1 worker", 13/13 ✓,
          # 3m16s wall, UAT_RESULT pass=13 fail=0 skip=0 realFails=0 infraGated=0.
          # 12 minutes is ~3.6x that measurement.
          #
          # The FULL functional suite is deliberately NOT the roll default: measured
          # 84 minutes and pass=571 fail=37 skip=16 realFails=4. It cannot fit a roll
          # budget and currently cannot pass, so arming the roll gate on it (#3165)
          # produced a gate that could not go green at any timeout. It belongs on a
          # schedule instead (#3164); `uat_grep=all` runs it here on purpose.
          #
          # Playwright matches --grep against the test's FILE PATH as well as its
          # title, so these are spec-file selectors, not title fragments.
          UAT_GREP_DEFAULT='(admin-security|phase2-install-rbac|apps\.uat\.ts)'
          UAT_GREP="$UAT_GREP_IN"
          UAT_MIN_TESTS="$UAT_MIN_TESTS_IN"
          UAT_TIMEOUT_MINUTES="$UAT_TIMEOUT_IN"

          if [[ "$UAT_GREP" == "all" ]]; then
            # Explicit opt-in to the whole functional suite. Empty UAT_GREP is the
            # runner's "no --grep" signal; its own default floor (40) then applies.
            UAT_GREP=""
            if [[ -z "$UAT_TIMEOUT_MINUTES" ]]; then UAT_TIMEOUT_MINUTES=100; fi
          elif [[ -z "$UAT_GREP" ]]; then
            UAT_GREP="$UAT_GREP_DEFAULT"
            if [[ -z "$UAT_MIN_TESTS" ]]; then UAT_MIN_TESTS=13; fi
            if [[ -z "$UAT_TIMEOUT_MINUTES" ]]; then UAT_TIMEOUT_MINUTES=12; fi
          else
            # A caller-supplied slice. No floor is INVENTED for it — the caller
            # names one with uat_min_tests if it wants the collected-count assertion.
            if [[ -z "$UAT_TIMEOUT_MINUTES" ]]; then UAT_TIMEOUT_MINUTES=20; fi
          fi
          echo "::notice::UAT gate scope: grep='${UAT_GREP:-<full suite>}' min_tests='${UAT_MIN_TESTS:-<runner default>}' timeout=${UAT_TIMEOUT_MINUTES}m"

          # Non-strict provisioning is the job default (infra-gates exit 0; only real
          # code bugs exit 1) — exactly the roll-gate semantics.
          #
          # `az containerapp job start --env-vars` (even with --image) REPLACES the
          # execution's whole container spec, dropping every baseline env var the
          # job needs — LOOM_URL, SESSION_SECRET, LOOM_AUTOMATION_*, results
          # account, UAMI. That made the container die in <1s with
          # "LOOM_URL is required" (pass=0 fail=2 realFails=0). Instead MERGE the
          # gate env into the job template with --set-env-vars (which preserves all
          # other env), then start PLAIN so the execution inherits the full env.
          #
          # Every var here is ALWAYS pushed — including when EMPTY. `--set-env-vars`
          # is a MERGE, so omitting a var leaves whatever the template already
          # carries. On 2026-08-08 the live loom-uat template still held a UAT_GREP
          # from an old targeted use-case-apps run:
          #   "use-case app via UI . app-(direct-lake-replacement|supercharge-streaming)"
          # which matches 2 of the declared tests. Every roll in the FINISHLINE
          # program therefore gated on pass=2 while this step's own comment claimed
          # "the full-visual Playwright suite". The same trap applies to
          # UAT_MIN_TESTS: pushing it empty is what CLEARS a stale floor.
          echo "Merging UAT gate env into loom-uat template ..."
          SET_ENV=(UAT_GREP_INVERT=tutorial "UAT_GREP=$UAT_GREP" "UAT_MIN_TESTS=$UAT_MIN_TESTS")
          UPD_ERR=$(mktemp)
          if ! az containerapp job update -n loom-uat -g "$RG" \
              --set-env-vars "${SET_ENV[@]}" -o none 2>"$UPD_ERR"; then
            echo "::error::Failed to set loom-uat gate env. az stderr:"; cat "$UPD_ERR" >&2 || true; exit 1
          fi
          echo "Starting loom-uat execution (plain start — inherits full template env) ..."
          START_ERR=$(mktemp)
          EXEC=$(az containerapp job start -n loom-uat -g "$RG" \
            --query name -o tsv 2>"$START_ERR" | tr -d '\r')
          if [[ -z "$EXEC" ]]; then
            echo "::error::Failed to start loom-uat execution. az stderr:"
            cat "$START_ERR" >&2 || true
            exit 1
          fi
          echo "::notice::Started loom-uat execution: $EXEC"

          DEADLINE=$(( $(date +%s) + UAT_TIMEOUT_MINUTES * 60 ))
          STATUS="Running"
          while :; do
            # Use `execution list` + filter (only `list` is documented CLI-stable).
            STATUS=$(az containerapp job execution list -n loom-uat -g "$RG" \
              --query "[?name=='$EXEC'].properties.status | [0]" -o tsv 2>/dev/null | tr -d '\r' || echo "")
            [[ -z "$STATUS" ]] && STATUS="Unknown"
            echo "[uat] $(date -u +%H:%M:%S) status=$STATUS"
            case "$STATUS" in
              Succeeded) break ;;
              Failed|Degraded|Cancelled) break ;;
            esac
            if (( $(date +%s) >= DEADLINE )); then STATUS="TimedOut"; break; fi
            sleep 20
          done

          # Best-effort: surface the UAT_RESULT line from Log Analytics.
          WS=$(az monitor log-analytics workspace list -g "$RG" \
            --query "[?starts_with(name, 'law-csa-loom-')]|[0].customerId" -o tsv 2>/dev/null | tr -d '\r' || echo "")
          [[ -z "$WS" ]] && WS=$(az monitor log-analytics workspace list -g "$RG" --query "[0].customerId" -o tsv 2>/dev/null | tr -d '\r' || echo "")
          if [[ -n "$WS" ]]; then
            RESULT=$(az monitor log-analytics query -w "$WS" --analytics-query \
              "ContainerAppConsoleLogs_CL | where ContainerName_s == 'uat' | where Log_s contains 'UAT_RESULT' | order by TimeGenerated desc | take 1 | project Log_s" \
              --query "[0].Log_s" -o tsv 2>/dev/null | tr -d '\r' || echo "")
            if [[ -n "$RESULT" ]]; then
              echo "::notice::$RESULT"
              echo "loom-uat: $RESULT" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [[ "$STATUS" == "Succeeded" ]]; then
            echo "::notice::loom-uat PASSED (execution $EXEC) — UAT-verified roll."
            exit 0
          fi
          echo "::error::loom-uat gate FAILED (status=$STATUS, execution $EXEC). Rolling back. Inspect Log Analytics ContainerAppConsoleLogs_CL (ContainerName_s=='uat') for the UAT_REAL_FAILS line."
          exit 1

      - name: Rollback on validation failure
        # Roll back whenever we shipped a new revision and EITHER the live-URL
        # validation OR the in-VNet UAT gate failed. (A pre-roll vitest-gate
        # failure never reaches here — nothing was rolled.)
        #
        # #2963: `health` is in this list now. Before, the health wait could not
        # fail at all; now that it can (unhealthy revision, or a revision running
        # a different image than we asked for), it must ALSO trigger the revert
        # — otherwise making the gate honest would leave the estate parked on a
        # broken revision with no rollback, i.e. a fix that made things worse.
        if: >-
          failure() && steps.roll.outcome == 'success' &&
          (steps.validate.outcome == 'failure' || steps.uat.outcome == 'failure' ||
           steps.health.outcome == 'failure')
        run: |
          echo "::error::Post-roll gate failed (health=${{ steps.health.outcome }}, validate=${{ steps.validate.outcome }}, uat=${{ steps.uat.outcome }}) — rolling back to previous revision ${{ steps.vars.outputs.previous_revision }}"
          PREV_IMAGE=$(az containerapp revision show -n ${{ env.APP_NAME }} -g ${{ env.RG_NAME }} \
            --revision "${{ steps.vars.outputs.previous_revision }}" \
            --query "properties.template.containers[0].image" -o tsv)
          az containerapp update -n ${{ env.APP_NAME }} -g ${{ env.RG_NAME }} --image "$PREV_IMAGE"
          echo "::notice::Rolled back to $PREV_IMAGE"

      - name: File issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Dedup: comment on an existing open deploy-validation issue instead of
            // stacking a new one per run (the old behavior produced #1249/#1300/
            // #1303/#1305/#1306 for the same transient replica-death class).
            const body = [
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `Tag: \`${{ steps.vars.outputs.tag }}\``,
                `Expected SHA: \`${{ steps.vars.outputs.expected }}\``,
                `Previous revision: \`${{ steps.vars.outputs.previous_revision }}\``,
                `New revision (rolled back): \`${{ steps.roll.outputs.new_revision }}\``,
                `URL probed: ${{ steps.vars.outputs.url }}`,
                ``,
                `Check the workflow run for which gate failed (vitest confirmation / cosign signature verify / health / Front Door purge target / version / build-marker / notebook page / data-pipeline page / copilot tools / in-VNet UAT).`,
              ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deploy-validation', per_page: 50,
            });
            // #2963 — dedupe onto THIS WORKFLOW'S OWN issue. Taking `[0]` of
            // everything wearing the label meant a roll failure got appended as
            // a comment to whatever human-filed report happened to be newest,
            // burying it (the mirror image of the auto-close that closed #2963).
            const SELF_TITLE = /^loom-roll-and-validate failing\b/;
            const mine = existing.data.filter(
              (i) => !i.pull_request && i.user && i.user.login === 'github-actions[bot]' && SELF_TITLE.test(i.title),
            );
            if (mine.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: mine[0].number,
                body: `Roll failed again for tag \`${{ steps.vars.outputs.tag }}\`.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `loom-roll-and-validate failing (latest tag ${{ steps.vars.outputs.tag }})`,
                body, labels: ['csa-loom', 'deploy-validation'],
              });
            }

      - name: Auto-close stale deploy-validation issues on success
        if: success()
        uses: actions/github-script@v7
        env:
          ROLLED_TAG: ${{ steps.vars.outputs.tag }}
        with:
          script: |
            // A green roll means the live console validated — close the issues
            // THIS WORKFLOW FILED so transient past failures don't accumulate.
            //
            // #2963 — IT USED TO CLOSE ANYTHING WEARING THE LABEL, and that is
            // how it ate its own bug report. A human filed #2963 ("roll reports
            // success for a SHA it did not deploy") with the `deploy-validation`
            // label; the next green roll — for an entirely unrelated commit —
            // commented "Auto-resolved: loom-roll-and-validate is GREEN … live
            // console validated. Closing." and closed it. The workflow was
            // grading its own homework: a report ABOUT the roll's reporting
            // being untrustworthy was dismissed by that same reporting. This is
            // the "silently consumes the one signal that would reveal the
            // problem" mechanism, and it is why the defect survived long enough
            // to recur twice in an hour.
            //
            // Now: bot-authored + this workflow's own title shape ONLY. A
            // human-filed issue is never auto-closed by a machine. If the
            // deduped-comment title shape in "File issue on failure" changes,
            // change it here too — they are a pair.
            const SELF_TITLE = /^loom-roll-and-validate failing\b/;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deploy-validation', per_page: 50,
            });
            for (const iss of open.data) {
              if (iss.pull_request) continue;
              const botFiled = iss.user && iss.user.login === 'github-actions[bot]';
              if (!botFiled || !SELF_TITLE.test(iss.title)) {
                core.notice(
                  `Leaving #${iss.number} ("${iss.title}") open: it was not filed by this workflow. ` +
                  `A green roll of ${process.env.ROLLED_TAG} is evidence about THAT roll, not a verdict on a human-filed report (#2963).`,
                );
                continue;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: iss.number,
                body: `Auto-resolved: loom-roll-and-validate is GREEN for \`${process.env.ROLLED_TAG}\` (run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) — live console validated. Closing this auto-filed issue.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: iss.number, state: 'closed',
              });
            }
