name: gov-apps-diagnose

# READ-ONLY Gov diagnosis of the Container Apps behind Front Door. Refs #5123.
#
# Gov run 42341756803: Provision succeeded and Console /api/health answers 200 through
# Front Door, but MCP, Setup Orchestrator, Direct-Lake-Shim, activator-engine and
# mirroring-engine return a Front Door 404. First run of this workflow (42388902521)
# showed why: the :v0.1 revisions of loom-mcp, loom-mcp-bridge, loom-activator,
# loom-mirroring and loom-direct-lake-shim are Unhealthy/ActivationFailed, and
# loom-setup-orchestrator, loom-presidio-analyzer and loom-presidio-anonymizer are
# provisioningState Failed. This version prints WHY: per unhealthy revision the
# runningStateDetails and the system log tail, and the Front Door tree via ARM REST
# (the `az afd` commands pulled a preview `cdn` extension whose api-version Gov lacks).
#
# Every Azure call is list/show/logs. No create, update, delete or role assignment may be
# added here. A read that fails prints UNREADABLE and fails the run: it never degrades
# into "nothing found" (deploy-integrity.md R7). `az cloud set` and `az extension add`
# only change the runner's CLI profile.

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Admin-plane resource group
        default: rg-csa-loom-admin-usgovvirginia

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RG: ${{ inputs.resource_group }}
    steps:
      - name: Azure login (Gov)
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment

      - name: Set Azure cloud to Gov
        run: az cloud set --name AzureUSGovernment

      - name: Install the containerapp CLI extension
        run: az extension add --name containerapp --only-show-errors

      - name: Container Apps in the admin RG
        run: |
          set -euo pipefail
          az containerapp list -g "$RG" --query "[].{name:name, prov:properties.provisioningState, run:properties.runningStatus, rev:properties.latestReadyRevisionName, image:properties.template.containers[0].image}" -o table

      - name: Why each unhealthy revision or Failed app is not running
        run: |
          set -uo pipefail
          FAIL=0
          for app in $(az containerapp list -g "$RG" --query "[].name" -o tsv); do
            PROV=$(az containerapp show -g "$RG" -n "$app" --query properties.provisioningState -o tsv) || { echo "UNREADABLE: $app"; FAIL=1; continue; }
            BAD=$(az containerapp revision list -g "$RG" -n "$app" --query "[?properties.healthState!='Healthy' && properties.runningState!='ScaledToZero'].name" -o tsv) || { echo "UNREADABLE: revisions of $app"; FAIL=1; continue; }
            if [ "$PROV" = "Succeeded" ] && [ -z "$BAD" ]; then continue; fi
            echo "================ $app  provisioningState=$PROV"
            az containerapp show -g "$RG" -n "$app" --query "{image:properties.template.containers[0].image, cpu:properties.template.containers[0].resources.cpu, mem:properties.template.containers[0].resources.memory, ingress:properties.configuration.ingress.targetPort, registries:properties.configuration.registries[].server, identity:identity.type}" -o json || { echo "UNREADABLE: show $app"; FAIL=1; }
            for rev in $BAD; do
              echo "---- revision $rev"
              az containerapp revision show -g "$RG" -n "$app" --revision "$rev" --query "{health:properties.healthState, run:properties.runningState, details:properties.runningStateDetails, created:properties.createdTime, replicas:properties.replicas}" -o json || { echo "UNREADABLE: revision show $rev"; FAIL=1; }
            done
            # system logs only support --format json (run 42397249545: "only json logs supported")
            echo "---- system log tail (json)"
            az containerapp logs show -g "$RG" -n "$app" --type system --tail 30 --format json || echo "system log not readable for $app (not a verdict)"
            echo "---- console log tail (the app's own stdout/stderr, if a replica ever started)"
            az containerapp logs show -g "$RG" -n "$app" --type console --tail 30 --format text || echo "console log not readable for $app (not a verdict)"
          done
          exit $FAIL

      - name: Front Door profiles, endpoints, origins, routes (ARM REST)
        run: |
          set -uo pipefail
          FAIL=0
          RM=$(az cloud show --query endpoints.resourceManager -o tsv | tr -d '[:space:]'); RM=${RM%/}
          SUB=$(az account show --query id -o tsv)
          BASE="$RM/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Cdn/profiles"
          API="api-version=2021-06-01"
          PROFILES=$(az rest --method get --url "$BASE?$API" --query "value[].name" -o tsv) || { echo "UNREADABLE: front door profiles"; exit 1; }
          [ -n "$PROFILES" ] || { echo "No Front Door profile in $RG (measured absence: the list call succeeded)."; exit 0; }
          for p in $PROFILES; do
            echo "== profile $p"
            az rest --method get --url "$BASE/$p/afdEndpoints?$API" --query "value[].{name:name, host:properties.hostName, state:properties.enabledState}" -o table || { echo "UNREADABLE: endpoints"; FAIL=1; }
            for og in $(az rest --method get --url "$BASE/$p/originGroups?$API" --query "value[].name" -o tsv); do
              echo "-- origin group $og"
              az rest --method get --url "$BASE/$p/originGroups/$og/origins?$API" --query "value[].{name:name, host:properties.hostName, state:properties.enabledState, privateLink:properties.sharedPrivateLinkResource.privateLink.id}" -o table || { echo "UNREADABLE: origins of $og"; FAIL=1; }
            done
            for ep in $(az rest --method get --url "$BASE/$p/afdEndpoints?$API" --query "value[].name" -o tsv); do
              echo "-- routes of endpoint $ep"
              az rest --method get --url "$BASE/$p/afdEndpoints/$ep/routes?$API" --query "value[].{name:name, group:properties.originGroup.id, patterns:properties.patternsToMatch, state:properties.enabledState}" -o table || { echo "UNREADABLE: routes of $ep"; FAIL=1; }
            done
          done
          exit $FAIL
