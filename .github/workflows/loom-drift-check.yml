name: loom-drift-check

# V5 (loom-next-level WS-V, ground-truth #11) — scheduled live bicep-drift
# detection for BOTH live estates. Weekly (+ on demand) this workflow runs
# `az deployment sub what-if` of platform/fiab/bicep/main.bicep against:
#
#   - Commercial: sub AZURE_SUBSCRIPTION_ID, centralus,
#     params/commercial-full.bicepparam (the canonical from-scratch paramfile
#     per no-vaporware.md's three-step path)
#   - Gov (GCC-High): sub AZURE_GOV_SUBSCRIPTION_ID via the gov SP secrets
#     pattern (same creds block as gov-console-roll.yml / deploy-fiab-gcch.yml),
#     usgovvirginia, params/gcc-high.bicepparam
#
# Any Create/Delete/Modify delta = UNMANAGED DRIFT (a hand-portal change — e.g.
# an ACR "allow unsigned" toggle or a firewall rule — that silently diverged
# from IaC). The scheduled lane IS the per-cloud mechanism (one job per estate).
#
# SIGNAL QUALITY (2026-07-28, issues #2540/#2541). The raw what-if changeType is
# NOT a usable drift verdict on its own — the first scheduled run filed 11
# "deltas" that were 100% documented ARM what-if noise (9 identical UAMI
# `properties.isolationScope` reports plus Grafana/Container-App server defaults;
# Learn: properties "can be incorrectly reported as deleted when they aren't in
# the Bicep file, but are automatically set during deployment as default
# values"). The verdict now runs through scripts/ci/whatif-drift-verdict.mjs,
# which (a) suppresses ONLY allowlisted read-only/server-defaulted properties
# (scripts/ci/whatif-noise-allowlist.json — Delete/NoEffect only, all-or-nothing
# per resource, every suppression printed) and (b) surfaces the
# NestedDeploymentShortCircuited coverage gap, because what-if cannot expand
# modules whose params come from module outputs and silently marks their
# resources `Ignore` — so a bare "zero deltas" would overstate what was checked.
#
# deployAppsEnabled=false on both estates: the app plane (Container Apps) rolls
# continuously via loom-roll-and-validate.yml / gov-console-roll.yml with
# sha-tagged images that churn BY DESIGN — including them would make every run
# "drift". With incremental-mode what-if they fall to changeType Ignore; this
# lane covers the INFRA estate.
#
# ALERTING (rev-2 standard): drift notifies through the ONE shared action group
# `loom-default-alerts` (monitoring-default-alerts.bicep::defaultActionGroup,
# derived var LOOM_ALERT_ACTION_GROUP_ID) via
# `az monitor action-group test-notifications create` — the same call
# loom-synthetic-monitor.yml uses; no new channels (O1 absorbs this when the
# unified alert-dispatch lands). The dedup GitHub issue (label `bicep-drift` +
# per-cloud label) is the durable signal and auto-closes on a clean run.
#
# Tuning without code change: repo variable LOOM_DRIFT_EXTRA_PARAMS (and the
# dispatch input extra_parameters) append `--parameters k=v` overrides — e.g.
# to pin LOOM_PURVIEW_LOCATION cross-region or acknowledge a deliberate live
# divergence while its reconcile PR is in flight.
#
# IL5 / air-gapped (design only, do NOT build): the what-if runs from the
# in-enclave gh-aca-runner against the sovereign ARM endpoint; GitHub-issue
# dedup is replaced by an in-boundary report (Cosmos row + the admin page) and
# the alert sink stays in-tenant. Runbook: docs/fiab/runbooks/bicep-drift.md

on:
  schedule:
    - cron: '17 7 * * 1'   # weekly, Monday 07:17 UTC
  workflow_dispatch:
    inputs:
      cloud:
        description: 'Which live estate(s) to what-if.'
        type: choice
        default: both
        options:
          - both
          - commercial
          - gov
      extra_parameters:
        description: 'Extra `--parameters k=v` overrides appended to the what-if (live-tuning; e.g. purviewEnabled=false).'
        type: string
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: loom-drift-check
  cancel-in-progress: false

env:
  ACTION_GROUP_NAME: loom-default-alerts

jobs:
  # ------------------------------------------------------------------
  # Commercial estate
  # ------------------------------------------------------------------
  drift-commercial:
    name: What-if vs live Commercial estate
    if: github.event_name == 'schedule' || inputs.cloud == 'both' || inputs.cloud == 'commercial'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUD_LABEL: commercial
      RG_NAME: rg-csa-loom-admin-centralus
      LOCATION: centralus
      PARAMS_FILE: commercial-full.bicepparam
      FIAB_VANITY_DOMAIN: csa-loom.limitlessdata.ai
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (Commercial)
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: What-if vs live estate + drift verdict
        id: whatif
        env:
          ADMIN_GROUP_ID: ${{ secrets.FIAB_ADMIN_GROUP_ID }}
          EXTRA_PARAMS: ${{ inputs.extra_parameters }} ${{ vars.LOOM_DRIFT_EXTRA_PARAMS }}
        run: |
          az bicep install

          # Drift detection COMPARES state; it never deploys. The default
          # --validation-level Provider additionally preflight-checks that the
          # lane's SP could *deploy* every resource in the template — which is
          # how the Gov lane died on 2026-07-27 (issue #2541): the gov deploy SP
          # lacks Microsoft.Authorization/roleAssignments/write, so what-if
          # errored out before comparing a single resource and the Gov estate
          # had ZERO drift coverage. ProviderNoRbac keeps full template +
          # resource validation and drops only the deploy-permission preflight.
          # Requires az >= 2.76.0; probed so an older runner image degrades to
          # the old behaviour with a loud warning instead of breaking the lane.
          VALIDATION_ARGS=""
          AZ_VER=$(az version --query '"azure-cli"' -o tsv 2>/dev/null || echo "0.0.0")
          if [[ "$(printf '%s\n' "2.76.0" "$AZ_VER" | sort -V | head -1)" == "2.76.0" ]]; then
            VALIDATION_ARGS="--validation-level ProviderNoRbac"
          else
            echo "::warning::[$CLOUD_LABEL] az $AZ_VER < 2.76.0 — --validation-level unavailable; an RBAC preflight failure can abort the what-if before it compares anything. See docs/fiab/runbooks/bicep-drift.md."
          fi
          set +e
          az deployment sub what-if \
            --name loom-drift-${CLOUD_LABEL}-${{ github.run_id }} \
            --location "$LOCATION" \
            --template-file platform/fiab/bicep/main.bicep \
            --parameters "platform/fiab/bicep/params/$PARAMS_FILE" \
            --parameters location="$LOCATION" \
            --parameters adminEntraGroupId="$ADMIN_GROUP_ID" \
            --parameters deployAppsEnabled=false \
            --parameters loomVanityDomain="$FIAB_VANITY_DOMAIN" \
            $EXTRA_PARAMS \
            $VALIDATION_ARGS \
            --no-pretty-print --only-show-errors > whatif.json 2> whatif.err
          EXIT_CODE=$?
          set -e

          if [[ $EXIT_CODE -ne 0 ]]; then
            # #2874 / FINISHLINE G4 — a what-if that dies BEFORE comparing
            # anything must render an explicit "could not evaluate" verdict, not
            # a blank that the issue template then prints as "? real delta(s)".
            # ARM hides the actual per-resource causes in `details[]`, which the
            # CLI summary drops ("Please see details." — and then no details),
            # so re-issue the SAME what-if once with --debug to capture the raw
            # response bodies. Everything mined out of that stream is redacted
            # before it is emitted: this repo, and the drift issue, are public.
            echo "::group::Re-running the what-if with --debug to recover ARM's details[]"
            set +e
            # $EXTRA_PARAMS and $VALIDATION_ARGS are multi-word argument lists
            # and MUST word-split — the same intentional pattern as the primary
            # what-if above. Directive placed immediately before the command so
            # shellcheck scopes it to this invocation only.
            # shellcheck disable=SC2086
            az deployment sub what-if \
              --name loom-drift-${CLOUD_LABEL}-${{ github.run_id }}-diag \
              --location "$LOCATION" \
              --template-file platform/fiab/bicep/main.bicep \
              --parameters "platform/fiab/bicep/params/$PARAMS_FILE" \
              --parameters location="$LOCATION" \
              --parameters adminEntraGroupId="$ADMIN_GROUP_ID" \
              --parameters deployAppsEnabled=false \
              --parameters loomVanityDomain="$FIAB_VANITY_DOMAIN" \
              $EXTRA_PARAMS \
              $VALIDATION_ARGS \
              --no-pretty-print --debug > /dev/null 2> whatif-debug.log
            set -e
            echo "::endgroup::"
            # Renders the verdict + outputs and ALWAYS exits non-zero. There is
            # no path through this script that reports a clean estate.
            node scripts/ci/whatif-failure-verdict.mjs \
              --label "$CLOUD_LABEL" --exit-code "$EXIT_CODE" \
              --err whatif.err --json whatif.json --debug-log whatif-debug.log
          fi

          # Single-source verdict (shared with bicep-whatif.yml's PR lane):
          #   * filters DOCUMENTED ARM what-if noise — read-only / server-
          #     defaulted properties the template does not declare, which a
          #     redeploy re-applies verbatim (Learn: "considered 'noise' in the
          #     what-if response"). Allowlist + per-entry rationale:
          #     scripts/ci/whatif-noise-allowlist.json. Only propertyChangeType
          #     Delete/NoEffect on an allowlisted path is suppressible, a
          #     resource must have ALL its deltas allowlisted to drop out, and
          #     every suppression is printed.
          #   * reports the NestedDeploymentShortCircuited coverage gap so a
          #     "clean" verdict never silently covers unexpanded modules.
          # Writes status/counts/drift_count/suppressed_count/
          # shortcircuit_count/evaluated_count/coverage_note/*_list to
          # $GITHUB_OUTPUT + the markdown block to $GITHUB_STEP_SUMMARY, and
          # exits 1 on REAL drift.
          node scripts/ci/whatif-drift-verdict.mjs whatif.json --out-dir . --label "$CLOUD_LABEL"

      - name: Upload full what-if JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatif-drift-commercial-${{ github.run_id }}
          path: |
            whatif.json
            whatif.err
            drift-list.txt
            suppressed-list.txt
            summary.md
          if-no-files-found: ignore

      - name: Alert — notify the shared action group (loom-default-alerts)
        if: failure()
        run: |
          # Rev-2 alert standard: the ONE shared default action group
          # (LOOM_ALERT_ACTION_GROUP_ID → monitoring-default-alerts.bicep::
          # defaultActionGroup; email + subscription-Owner ARM-role receivers).
          # Best-effort — the dedup GitHub issue below is the durable signal.
          az monitor action-group test-notifications create \
            -g "$RG_NAME" --action-group-name "$ACTION_GROUP_NAME" \
            --alert-type log 2>/dev/null \
          || az monitor action-group test-notifications create \
            -g "$RG_NAME" --action-group-name "$ACTION_GROUP_NAME" \
            --alert-type budget 2>/dev/null \
          || echo "::warning::action-group notification failed — the dedup issue below is the durable alert."

      - name: File / update dedup drift issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const cloud = 'Commercial';
            const label = 'drift-commercial';
            const status = process.env.WHATIF_STATUS || 'Error';
            const drift = process.env.DRIFT_COUNT || '?';
            const counts = process.env.WHATIF_COUNTS || '{}';
            const suppressedCount = process.env.SUPPRESSED_COUNT || '0';
            const shortCircuitCount = process.env.SHORTCIRCUIT_COUNT || '?';
            const coverage = process.env.COVERAGE_NOTE || '(unknown — what-if failed before a verdict)';
            const list = process.env.DRIFT_LIST || '(what-if failed before a verdict — see the run logs)';
            const suppressedList = process.env.SUPPRESSED_LIST || '';
            const shortCircuitList = process.env.SHORTCIRCUIT_LIST || '';
            // #2874 / FINISHLINE G4 — see the Gov job below for the full
            // rationale. "Could not evaluate" and "found N deltas" are
            // different findings and must not share a sentence shape.
            const unevaluated = status === 'CouldNotEvaluate';
            const detail = process.env.FAILURE_DETAIL || '';
            const title = unevaluated
              ? `bicep-drift (${cloud}): NOT EVALUATED — what-if could not run`
              : `bicep-drift (${cloud}): ${drift} unmanaged delta(s) vs live estate`;
            const body = unevaluated ? [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Verdict: **COULD NOT EVALUATE** — this run compared **zero** resources against \`platform/fiab/bicep/main.bicep\`.`,
              ``,
              `**This is not a drift finding, and it is not a clean bill of health.** The ${cloud} estate is currently UNMEASURED for drift. Treat it as no coverage until the what-if runs.`,
              ``,
              detail,
              ``,
              `Triage: docs/fiab/runbooks/bicep-drift.md`,
            ].join('\n') : [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Verdict: **${status}** — ${drift} **real** Create/Delete/Modify delta(s) between \`platform/fiab/bicep/main.bicep\` and the live ${cloud} estate.`,
              `Change counts: \`${counts}\``,
              `Coverage: ${coverage}`,
              `Suppressed as documented ARM what-if noise: ${suppressedCount} (read-only / server-defaulted properties — \`scripts/ci/whatif-noise-allowlist.json\`)`,
              ``,
              '```',
              list.slice(0, 40000),
              '```',
              ``,
              suppressedList
                ? `<details><summary>Suppressed what-if noise (${suppressedCount}) — NOT drift</summary>\n\n\`\`\`\n${suppressedList.slice(0, 20000)}\n\`\`\`\n</details>\n`
                : '',
              shortCircuitList
                ? `<details><summary>⚠ Coverage gap — ${shortCircuitCount} nested deployment(s) what-if could not expand; their resources were NOT compared</summary>\n\n\`\`\`\n${shortCircuitList.slice(0, 20000)}\n\`\`\`\n</details>\n`
                : '',
              `A **real** delta means a hand-portal change diverged from IaC (or IaC merged without deploying). Reconcile by opening a PR that encodes the live state into bicep — or redeploy IaC over the estate if the live change was accidental.`,
              `Triage: docs/fiab/runbooks/bicep-drift.md · full what-if JSON + drift/suppressed lists in the run artifact.`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: `bicep-drift,${label}`, per_page: 1,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Drift still present.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title,
                body, labels: ['csa-loom', 'bicep-drift', label],
              });
            }
        env:
          DRIFT_LIST: ${{ steps.whatif.outputs.drift_list }}
          SUPPRESSED_LIST: ${{ steps.whatif.outputs.suppressed_list }}
          SHORTCIRCUIT_LIST: ${{ steps.whatif.outputs.shortcircuit_list }}
          WHATIF_STATUS: ${{ steps.whatif.outputs.status }}
          WHATIF_COUNTS: ${{ steps.whatif.outputs.counts }}
          DRIFT_COUNT: ${{ steps.whatif.outputs.drift_count }}
          SUPPRESSED_COUNT: ${{ steps.whatif.outputs.suppressed_count }}
          SHORTCIRCUIT_COUNT: ${{ steps.whatif.outputs.shortcircuit_count }}
          COVERAGE_NOTE: ${{ steps.whatif.outputs.coverage_note }}
          FAILURE_DETAIL: ${{ steps.whatif.outputs.failure_detail }}

      - name: Auto-close stale drift issues on a clean run
        if: success() && steps.whatif.outputs.status == 'Clean'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'bicep-drift,drift-commercial', per_page: 20,
            });
            for (const iss of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: iss.number,
                body: `Auto-resolved: the Commercial estate matches IaC (zero unmanaged deltas — run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}). Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: iss.number, state: 'closed',
              });
            }

  # ------------------------------------------------------------------
  # Gov (GCC-High) estate — gov SP secrets pattern (AZURE_GOV_*)
  # ------------------------------------------------------------------
  precheck-gov:
    name: Verify Gov secrets are configured
    if: github.event_name == 'schedule' || inputs.cloud == 'both' || inputs.cloud == 'gov'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          C: ${{ secrets.AZURE_GOV_CLIENT_ID }}
          S: ${{ secrets.AZURE_GOV_CLIENT_SECRET }}
          T: ${{ secrets.AZURE_GOV_TENANT_ID }}
          U: ${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}
        run: |
          if [[ -z "$C" || -z "$S" || -z "$T" || -z "$U" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AZURE_GOV_* secrets not configured — skipping the Gov drift check. Bootstrap per docs/fiab/runbooks/secrets-bootstrap.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  drift-gov:
    name: What-if vs live Gov (GCC-High) estate
    needs: precheck-gov
    if: needs.precheck-gov.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUD_LABEL: gov
      RG_NAME: rg-csa-loom-admin-usgovvirginia
      LOCATION: usgovvirginia
      PARAMS_FILE: gcc-high.bicepparam
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (Gov sub) — deploy SP
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_GOV_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_GOV_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_GOV_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}",
              "activeDirectoryEndpointUrl": "https://login.microsoftonline.us",
              "resourceManagerEndpointUrl": "https://management.usgovcloudapi.net/",
              "sqlManagementEndpointUrl": "https://management.core.usgovcloudapi.net:8443/",
              "galleryEndpointUrl": "https://gallery.usgovcloudapi.net/",
              "managementEndpointUrl": "https://management.core.usgovcloudapi.net/"
            }
          environment: AzureUSGovernment

      - name: Set Azure cloud to Gov
        run: az cloud set --name AzureUSGovernment

      - name: What-if vs live estate + drift verdict
        id: whatif
        env:
          ADMIN_GROUP_ID: ${{ secrets.FIAB_GOV_ADMIN_GROUP_ID }}
          EXTRA_PARAMS: ${{ inputs.extra_parameters }} ${{ vars.LOOM_DRIFT_EXTRA_PARAMS_GOV }}
        run: |
          az bicep install

          # Drift detection COMPARES state; it never deploys. The default
          # --validation-level Provider additionally preflight-checks that the
          # lane's SP could *deploy* every resource in the template — which is
          # how the Gov lane died on 2026-07-27 (issue #2541): the gov deploy SP
          # lacks Microsoft.Authorization/roleAssignments/write, so what-if
          # errored out before comparing a single resource and the Gov estate
          # had ZERO drift coverage. ProviderNoRbac keeps full template +
          # resource validation and drops only the deploy-permission preflight.
          # Requires az >= 2.76.0; probed so an older runner image degrades to
          # the old behaviour with a loud warning instead of breaking the lane.
          VALIDATION_ARGS=""
          AZ_VER=$(az version --query '"azure-cli"' -o tsv 2>/dev/null || echo "0.0.0")
          if [[ "$(printf '%s\n' "2.76.0" "$AZ_VER" | sort -V | head -1)" == "2.76.0" ]]; then
            VALIDATION_ARGS="--validation-level ProviderNoRbac"
          else
            echo "::warning::[$CLOUD_LABEL] az $AZ_VER < 2.76.0 — --validation-level unavailable; an RBAC preflight failure can abort the what-if before it compares anything. See docs/fiab/runbooks/bicep-drift.md."
          fi
          set +e
          az deployment sub what-if \
            --name loom-drift-${CLOUD_LABEL}-${{ github.run_id }} \
            --location "$LOCATION" \
            --template-file platform/fiab/bicep/main.bicep \
            --parameters "platform/fiab/bicep/params/$PARAMS_FILE" \
            --parameters location="$LOCATION" \
            --parameters adminEntraGroupId="$ADMIN_GROUP_ID" \
            --parameters deployAppsEnabled=false \
            $EXTRA_PARAMS \
            $VALIDATION_ARGS \
            --no-pretty-print --only-show-errors > whatif.json 2> whatif.err
          EXIT_CODE=$?
          set -e

          if [[ $EXIT_CODE -ne 0 ]]; then
            # #2874 / FINISHLINE G4 — a what-if that dies BEFORE comparing
            # anything must render an explicit "could not evaluate" verdict, not
            # a blank that the issue template then prints as "? real delta(s)".
            # ARM hides the actual per-resource causes in `details[]`, which the
            # CLI summary drops ("Please see details." — and then no details),
            # so re-issue the SAME what-if once with --debug to capture the raw
            # response bodies. Everything mined out of that stream is redacted
            # before it is emitted: this repo, and the drift issue, are public.
            echo "::group::Re-running the what-if with --debug to recover ARM's details[]"
            set +e
            # $EXTRA_PARAMS and $VALIDATION_ARGS are multi-word argument lists
            # and MUST word-split — the same intentional pattern as the primary
            # what-if above. Directive placed immediately before the command so
            # shellcheck scopes it to this invocation only.
            # shellcheck disable=SC2086
            az deployment sub what-if \
              --name loom-drift-${CLOUD_LABEL}-${{ github.run_id }}-diag \
              --location "$LOCATION" \
              --template-file platform/fiab/bicep/main.bicep \
              --parameters "platform/fiab/bicep/params/$PARAMS_FILE" \
              --parameters location="$LOCATION" \
              --parameters adminEntraGroupId="$ADMIN_GROUP_ID" \
              --parameters deployAppsEnabled=false \
              $EXTRA_PARAMS \
              $VALIDATION_ARGS \
              --no-pretty-print --debug > /dev/null 2> whatif-debug.log
            set -e
            echo "::endgroup::"
            # Renders the verdict + outputs and ALWAYS exits non-zero. There is
            # no path through this script that reports a clean estate.
            node scripts/ci/whatif-failure-verdict.mjs \
              --label "$CLOUD_LABEL" --exit-code "$EXIT_CODE" \
              --err whatif.err --json whatif.json --debug-log whatif-debug.log
          fi

          # Same single-source verdict as the Commercial job — see the comment
          # block there and scripts/ci/whatif-noise-allowlist.json.
          node scripts/ci/whatif-drift-verdict.mjs whatif.json --out-dir . --label "$CLOUD_LABEL"

      - name: Upload full what-if JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatif-drift-gov-${{ github.run_id }}
          path: |
            whatif.json
            whatif.err
            drift-list.txt
            suppressed-list.txt
            summary.md
          if-no-files-found: ignore

      - name: Alert — notify the shared action group (loom-default-alerts)
        if: failure()
        run: |
          # Same shared-action-group call as Commercial, on the Gov estate's
          # default action group (.us ARM endpoint via the Gov login above).
          az monitor action-group test-notifications create \
            -g "$RG_NAME" --action-group-name "$ACTION_GROUP_NAME" \
            --alert-type log 2>/dev/null \
          || az monitor action-group test-notifications create \
            -g "$RG_NAME" --action-group-name "$ACTION_GROUP_NAME" \
            --alert-type budget 2>/dev/null \
          || echo "::warning::action-group notification failed — the dedup issue below is the durable alert."

      - name: File / update dedup drift issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const cloud = 'Gov (GCC-High)';
            const label = 'drift-gov';
            const status = process.env.WHATIF_STATUS || 'Error';
            const drift = process.env.DRIFT_COUNT || '?';
            const counts = process.env.WHATIF_COUNTS || '{}';
            const suppressedCount = process.env.SUPPRESSED_COUNT || '0';
            const shortCircuitCount = process.env.SHORTCIRCUIT_COUNT || '?';
            const coverage = process.env.COVERAGE_NOTE || '(unknown — what-if failed before a verdict)';
            const list = process.env.DRIFT_LIST || '(what-if failed before a verdict — see the run logs)';
            const suppressedList = process.env.SUPPRESSED_LIST || '';
            const shortCircuitList = process.env.SHORTCIRCUIT_LIST || '';
            // #2874 / FINISHLINE G4 — "could not evaluate" and "found N deltas"
            // are DIFFERENT findings and must never share a sentence shape. The
            // old template rendered an unevaluated run as
            //   "bicep-drift (Gov (GCC-High)): ? unmanaged delta(s)"
            //   "Verdict: **Error** — ? **real** … delta(s)"
            // which reads as a drift finding with an unreadable count, when the
            // truth was that ZERO resources were compared and the estate had NO
            // drift coverage at all. Branch the whole report instead.
            const unevaluated = status === 'CouldNotEvaluate';
            const detail = process.env.FAILURE_DETAIL || '';
            const title = unevaluated
              ? `bicep-drift (${cloud}): NOT EVALUATED — what-if could not run`
              : `bicep-drift (${cloud}): ${drift} unmanaged delta(s) vs live estate`;
            const body = unevaluated ? [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Verdict: **COULD NOT EVALUATE** — this run compared **zero** resources against \`platform/fiab/bicep/main.bicep\`.`,
              ``,
              `**This is not a drift finding, and it is not a clean bill of health.** The ${cloud} estate is currently UNMEASURED for drift. Treat it as no coverage until the what-if runs.`,
              ``,
              detail,
              ``,
              `Triage: docs/fiab/runbooks/bicep-drift.md`,
            ].join('\n') : [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Verdict: **${status}** — ${drift} **real** Create/Delete/Modify delta(s) between \`platform/fiab/bicep/main.bicep\` and the live ${cloud} estate.`,
              `Change counts: \`${counts}\``,
              `Coverage: ${coverage}`,
              `Suppressed as documented ARM what-if noise: ${suppressedCount} (read-only / server-defaulted properties — \`scripts/ci/whatif-noise-allowlist.json\`)`,
              ``,
              '```',
              list.slice(0, 40000),
              '```',
              ``,
              suppressedList
                ? `<details><summary>Suppressed what-if noise (${suppressedCount}) — NOT drift</summary>\n\n\`\`\`\n${suppressedList.slice(0, 20000)}\n\`\`\`\n</details>\n`
                : '',
              shortCircuitList
                ? `<details><summary>⚠ Coverage gap — ${shortCircuitCount} nested deployment(s) what-if could not expand; their resources were NOT compared</summary>\n\n\`\`\`\n${shortCircuitList.slice(0, 20000)}\n\`\`\`\n</details>\n`
                : '',
              `A **real** delta means a hand-portal change diverged from IaC (or IaC merged without deploying). Reconcile by opening a PR that encodes the live state into bicep — or redeploy IaC over the estate if the live change was accidental.`,
              `Triage: docs/fiab/runbooks/bicep-drift.md · full what-if JSON + drift/suppressed lists in the run artifact.`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: `bicep-drift,${label}`, per_page: 1,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Drift still present.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title,
                body, labels: ['csa-loom', 'bicep-drift', label],
              });
            }
        env:
          DRIFT_LIST: ${{ steps.whatif.outputs.drift_list }}
          SUPPRESSED_LIST: ${{ steps.whatif.outputs.suppressed_list }}
          SHORTCIRCUIT_LIST: ${{ steps.whatif.outputs.shortcircuit_list }}
          WHATIF_STATUS: ${{ steps.whatif.outputs.status }}
          WHATIF_COUNTS: ${{ steps.whatif.outputs.counts }}
          DRIFT_COUNT: ${{ steps.whatif.outputs.drift_count }}
          SUPPRESSED_COUNT: ${{ steps.whatif.outputs.suppressed_count }}
          SHORTCIRCUIT_COUNT: ${{ steps.whatif.outputs.shortcircuit_count }}
          COVERAGE_NOTE: ${{ steps.whatif.outputs.coverage_note }}
          FAILURE_DETAIL: ${{ steps.whatif.outputs.failure_detail }}

      - name: Auto-close stale drift issues on a clean run
        if: success() && steps.whatif.outputs.status == 'Clean'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'bicep-drift,drift-gov', per_page: 20,
            });
            for (const iss of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: iss.number,
                body: `Auto-resolved: the Gov estate matches IaC (zero unmanaged deltas — run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}). Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: iss.number, state: 'closed',
              });
            }
