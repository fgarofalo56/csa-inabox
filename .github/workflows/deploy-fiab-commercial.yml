name: deploy-fiab-commercial

# CSA Loom — deploy validation against Azure Commercial.
# Per PRP-11. Uses the existing `limitlessdata_deploy` SP.

# The `Provision (idempotent)` step below is gated
# `if: github.event_name == 'schedule' || inputs.run_mode == 'full'`, so a
# whatif-only dispatch SUCCEEDS having applied nothing. That is exactly the run
# that must not be allowed to clear this workflow's deploy-staleness entry, so
# it is labelled with the marker check-deploy-staleness.mjs already filters on
# (DRY_RUN_MARKER = 'DRY RUN'). Schedule runs provision, so they carry no marker.
run-name: deploy-fiab-commercial${{ (github.event_name == 'workflow_dispatch' && inputs.run_mode != 'full') && ' — DRY RUN (whatif-only, applies nothing)' || '' }}

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'whatif-only PREVIEWS the Bicep and applies NOTHING (no spend, no change). full APPLIES the template: it provisions/reconciles the infrastructure AND — because deploy_apps_enabled now defaults true — creates or updates the Container Apps (loom-console + siblings) and re-renders every LOOM_* env var on them, then smokes the estate. It does NOT tear anything down (keep_resources defaults true).'
        type: choice
        default: whatif-only
        options:
          - whatif-only
          - full
      keep_resources:
        description: 'Keep the estate up after the smoke test (full mode only). TRUE is the safe default and is what a real install wants. Setting it FALSE makes this a TEARDOWN run: fiab-teardown.sh then deletes EVERY rg-csa-loom-* resource group in the subscription — not just this one — and purges its Key Vaults and Cognitive Services accounts. A false here is refused up front unless confirm_teardown_rg names the resource group exactly.'
        type: boolean
        default: true
      confirm_teardown_rg:
        description: 'DESTRUCTIVE — leave EMPTY unless you intend to delete the estate. To authorise the teardown that keep_resources=false performs, type the resolved admin resource group exactly (rg-csa-loom-admin-<region>). Any other value, or an empty one, REFUSES the run before anything is submitted to ARM (#3028).'
        type: string
        required: false
        default: ''
      allow_existing_hub:
        description: 'topology=tenant only: bypass the "hub already exists in target sub" guard to idempotently reconcile/retry a partially-deployed hub (e.g. after a mid-deploy failure). Does NOT stamp a second Console — the incremental deploy reconciles the existing admin RG. Leave false for first-run installs.'
        type: boolean
        default: false
      purview_enabled:
        description: 'Deploy the shared Purview governance account. Set false when the target region lacks Purview (e.g. centralus) — the Loom catalog falls back to its Azure-native backend (AI Search / Cosmos) per no-fabric-dependency; add Purview cross-region later.'
        type: boolean
        default: true
      azure_maps_enabled:
        description: 'Deploy the Azure Maps account for the Geo editors. Set false when the target region lacks Azure Maps (e.g. centralus) — the Geo editors honest-gate; add Maps cross-region later.'
        type: boolean
        default: true
      firewall_enabled:
        description: 'Deploy the hub Azure Firewall (egress filtering). Set false to skip — nothing else consumes it, and it avoids the FirewallPolicyUpdateFailed re-PUT error on idempotent reconcile passes. Add it back once the rest of the stack is stable.'
        type: boolean
        default: true
      deploy_apps_enabled:
        description: 'Create/update the Container Apps (loom-console + siblings) as part of this deploy. TRUE is the default because it is the ONLY way any LOOM_* env var reaches the running console — with FALSE, run_mode=full applies infrastructure and touches no container app at all, which is a green run that changes nothing you can see (#3332). Running images are NOT rewritten: the run pins each app to the tag it is already on, and refuses up front if any running tag is ambiguous. Set FALSE only for phase 1 of a from-scratch install, where the ACR is still EMPTY and a Container App pull could only fail.'
        type: boolean
        default: true
      skip_role_grants:
        description: 'Skip RBAC role-assignment creation (set true on a re-deploy where grants already exist, to avoid RoleAssignmentExists).'
        type: boolean
        default: false
      front_door_enabled:
        description: 'Deploy Azure Front Door (public entry + custom/vanity domain) in front of the console. Default TRUE — the Commercial estate HAS an Active Front Door profile, and this input is passed to ARM unconditionally, so a false default silently overrode params/commercial.bicepparam and disabled Front Door on every dispatch (measured: run 31409031982 composed frontDoorEnabled=false with flag-source=inputs). Set false only for an estate that genuinely has no Front Door.'
        type: boolean
        default: true
      # Setup Wizard browser-driven deploy passes these (app/api/setup/deploy → workflow_dispatch).
      topology:
        description: 'Explicit topology (audit-t156). Overrides deployment_mode. tenant = first-run hub install (DMLZ console + shared only). dlz-attach = add ONE DLZ to an existing hub (no Console is stamped). single-sub = dev/demo all-in-one. Empty = derive from deployment_mode. A second Console can never be stamped — the guard rejects topology=tenant when a hub already exists in the target sub.'
        type: choice
        default: tenant
        options:
          - ''
          - single-sub
          - tenant
          - dlz-attach
      target_subscription:
        description: 'dlz-attach: the NEW subscription the DLZ is provisioned into. The deploy identity needs Contributor here.'
        type: string
        required: false
      subscription:
        description: 'Target Azure subscription ID (from the Setup Wizard).'
        type: string
        required: false
      region:
        description: 'REQUIRED. Azure region of the estate this run targets (e.g. centralus). There is no default: the region IS the identity of the estate — rg-csa-loom-admin-<region>, vnet-csa-loom-hub-<region> and uami-loom-console-<region> are all derived from it, so a wrong region does not fail, it succeeds against a different empty estate (#3029). A value that does not match the hub already in the subscription is REFUSED before anything is submitted.'
        type: string
        required: true
      tenant_admin_oid:
        description: 'Bootstrap tenant admin — your Entra USER object id (az ad signed-in-user show --query id). Members bypass the feature-permission gate so the first human admin can open /admin/*. Optional: the admin GROUP below (repo variable FIAB_ADMIN_GROUP_ID) already binds the console by default.'
        type: string
        required: false
      tenant_admin_group_id:
        description: 'Bootstrap tenant admin GROUP — an Entra security-group object id whose members bypass the feature-permission gate (az ad group show --group "<name>" --query id). Empty → the FIAB_ADMIN_GROUP_ID repo secret, else the repo variable of the same name. This is the DEFAULT binding; supplying it here is only needed to point a deploy at a different group (brownfield, deploy-integrity.md R5).'
        type: string
        required: false
      deployment_mode:
        description: 'single-sub or multi-sub.'
        type: choice
        default: single-sub
        options:
          - single-sub
          - multi-sub
      dlz_domain_name:
        description: 'Data Landing Zone domain name(s), comma-separated.'
        type: string
        required: false
      capacity_sku:
        description: 'Fabric/OneLake capacity SKU.'
        type: choice
        default: F8
        options: [F2, F4, F8, F32, F64, F128, F512]
      vanity_domain:
        description: 'Optional vanity URL for the console (e.g. csa-loom.contoso.ai). Deploy emits the CNAME + _dnsauth TXT to add at your DNS provider.'
        type: string
        required: false

permissions:
  contents: read
  issues: write
  # #3676 — the post-apply estate gate asks the Actions API which console-rolling
  # run last actually SHIPPED an image. `contents: read` does not grant that;
  # without this the gate would fail closed on every run and read as a broken
  # deploy path rather than as a missing scope.
  actions: read

env:
  AZURE_CLOUD: AzureCloud
  # THERE IS NO DEFAULT REGION (refs #3029). This used to read
  # `${{ inputs.region || 'eastus2' }}`, so a schedule (which carries no inputs)
  # and a dispatch that left the blank field blank BOTH aimed at eastus2 while
  # the live estate is in centralus. The nightly "reconcile" would therefore
  # have stamped a SECOND estate in another region rather than reconciling the
  # one that exists — and then, per the Teardown note below, deleted both.
  #
  # It is now seeded from the input alone and may legitimately be EMPTY here.
  # `Resolve reconcile target` runs before any step that reads it and either
  # ADOPTS the region of the hub that actually exists, accepts an explicit input
  # that MATCHES it, or REFUSES the run. Nothing is ever assumed.
  # Decision logic + tests: scripts/ci/reconcile-policy.mjs.
  AZURE_LOCATION: ${{ inputs.region }}
  CSA_LOOM_BOUNDARY: Commercial
  CSA_LOOM_DEPLOYMENT_MODE: ${{ inputs.deployment_mode || 'single-sub' }}
  # audit-t156 — explicit topology; empty falls through to deployment_mode in bicep.
  CSA_LOOM_TOPOLOGY: ${{ inputs.topology || '' }}
  CSA_LOOM_CAPACITY_SKU: ${{ inputs.capacity_sku || 'F8' }}
  # Wizard-provided overrides consumed by the deploy step's -p flags.
  CSA_LOOM_TARGET_SUBSCRIPTION: ${{ inputs.target_subscription }}
  CSA_LOOM_SUBSCRIPTION_OVERRIDE: ${{ inputs.subscription }}
  CSA_LOOM_DLZ_DOMAIN_NAMES: ${{ inputs.dlz_domain_name }}
  CSA_LOOM_VANITY_DOMAIN: ${{ inputs.vanity_domain }}

jobs:
  deploy-validate:
    name: Deploy + validate CSA Loom in Commercial
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Coordinates exported for the chained post-deploy bootstrap (rel-T34).
    outputs:
      admin_sub: ${{ steps.bootstrap_coords.outputs.admin_sub }}
      dlz_sub: ${{ steps.bootstrap_coords.outputs.dlz_sub }}
      region: ${{ steps.bootstrap_coords.outputs.region }}
      # #3332 — the value that ACTUALLY reached ARM, not the raw input. The
      # post-deploy-bootstrap job below gates on "a Console Container App now
      # exists to wire", and only the resolver's verdict answers that: it is
      # what `--parameters deployAppsEnabled=…` was composed from. Reading
      # `inputs.deploy_apps_enabled` there would be a second, unmeasured copy of
      # the same decision, free to disagree with the one the deploy used.
      deploy_apps_enabled: ${{ steps.reconcile.outputs.deploy_apps_enabled }}

    steps:
      - uses: actions/checkout@v7

      - name: Azure login (Commercial)
        uses: Azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Setup azd
        uses: Azure/setup-azd@v2

      - name: Setup Bicep
        run: az bicep install

      # audit-t157: enforce the same "second Console is impossible" invariant as
      # the UI/orchestrator at the CI layer. A topology=tenant run that targets a
      # subscription already holding an Admin Plane RG is rejected; a dlz-attach
      # run must target a NEW subscription via target_subscription.
      #
      # MOVED OUT OF YAML (refs #2775). This step used to be an inline shell
      # block, and it carried two bugs that only a test could have caught:
      #
      #   1. It decided a TRIGGER question by reading an INPUT:
      #        [ "${{ inputs.allow_existing_hub }}" != "true" ]
      #      On a `schedule` event there are no inputs, so that expanded to
      #      `[ "" != "true" ]` -- always true -- and the nightly reconcile
      #      refused itself against the very hub it was scheduled to reconcile.
      #      EVERY scheduled run since this workflow was created failed here, in
      #      ~30-80s, and the last real application of the admin-plane template
      #      was 2026-07-23 (which itself Failed). This is the only workflow that
      #      runs `az deployment sub create` on main.bicep, so nothing else was
      #      applying Console configuration in the meantime.
      #
      #   2. Its hub-count query ended `... -o tsv 2>/dev/null || echo "0"`, so
      #      an az/Graph/auth failure was indistinguishable from "no hub here"
      #      and the guard PASSED. The guard's failure mode was permissive.
      #
      # The protective intent is unchanged: an operator-initiated dispatch
      # against an existing hub STILL has to pass allow_existing_hub=true, and an
      # UNKNOWN hub count now refuses on dispatch instead of proceeding. Only the
      # scheduled reconcile -- whose whole purpose is to run against the existing
      # hub -- is allowed through on the trigger.
      #
      # Decision logic + tests: scripts/ci/deploy-trigger-policy.mjs and
      # scripts/ci/__tests__/deploy-trigger-policy.test.mjs.
      - name: Topology guard + trigger-aware parameter resolution
        id: topology_guard
        env:
          INPUT_ALLOW_EXISTING_HUB: ${{ inputs.allow_existing_hub }}
          INPUT_PURVIEW_ENABLED: ${{ inputs.purview_enabled }}
          INPUT_AZURE_MAPS_ENABLED: ${{ inputs.azure_maps_enabled }}
          INPUT_FIREWALL_ENABLED: ${{ inputs.firewall_enabled }}
          INPUT_DEPLOY_APPS_ENABLED: ${{ inputs.deploy_apps_enabled }}
          INPUT_SKIP_ROLE_GRANTS: ${{ inputs.skip_role_grants }}
          INPUT_FRONT_DOOR_ENABLED: ${{ inputs.front_door_enabled }}
        run: node scripts/ci/deploy-fiab-guard.mjs

      # refs #2775 — THE STEP THAT MAKES A SCHEDULED RECONCILE ABLE TO CONFIGURE
      # THE ESTATE WITHOUT RE-IMAGING IT.
      #
      # `deployAppsEnabled` is the flag app-deployments.bicep is gated on, and
      # therefore the ONLY way any LOOM_* env var reaches the running Console.
      # It was pinned false because turning it on would ALSO rewrite every
      # Container App image to `appImageTags.<app>`, whose default is 'v0.1' in
      # both bicep files, while production runs commit-SHA tags. Infra
      # reconciled nightly; configuration never did. /admin/env-config read
      # "185 of 192 configured" for exactly that reason — LOOM_RISINGWAVE_URL
      # and LOOM_DUCKLAKE_CATALOG_URL are declared in admin-plane/main.bicep
      # behind `deployAppsEnabled`, so they had never been applied.
      #
      # This step is READ-ONLY (`az group list`, `az containerapp list`). It
      # reads the tag every app is ACTUALLY running and exports LOOM_<APP>_TAG,
      # which params/commercial.bicepparam now resolves through
      # readEnvironmentVariable(...) — the same mechanism gcc-high.bicepparam
      # already uses. The resulting ARM PUT is a no-op for every image and
      # applies everything else.
      #
      # It also fixes the region: see the AZURE_LOCATION note in `env:` above.
      #
      # FAIL-SAFE COMPOSITION. deploy-fiab-guard.mjs still resolves
      # deploy_apps_enabled to the SAFE 'false' on a schedule; this step may only
      # UPGRADE that to 'true', and only once every running image has been
      # positively identified. A digest-pinned container, two containers on one
      # repo at different tags, or an unreadable estate all resolve to UNKNOWN,
      # and UNKNOWN keeps the old infra-only behaviour instead of guessing.
      # An operator dispatch keeps whatever the operator typed.
      #
      # Decision logic + tests: scripts/ci/reconcile-policy.mjs and
      # scripts/ci/__tests__/reconcile-policy.test.mjs. Enforced by
      # scripts/ci/check-reconcile-safety.mjs.
      - name: Resolve reconcile target (region + RUNNING image tags, read-only)
        id: reconcile
        env:
          DEPLOY_SUB: ${{ steps.topology_guard.outputs.deploy_sub }}
          BASE_DEPLOY_APPS_ENABLED: ${{ steps.topology_guard.outputs.deploy_apps_enabled }}
          INPUT_REGION: ${{ inputs.region }}
        run: node scripts/ci/reconcile-resolve.mjs

      # ── INPUT SAFETY GATE — REFUSES BEFORE ANY ARM WRITE (refs #3028, #3029) ──
      #
      # Placed here deliberately: after `Resolve reconcile target` (whose only
      # Azure calls are the read-only `az group list` / `az containerapp list`
      # it needs to MEASURE the region) and before the first step that changes
      # anything — provider registration, what-if, apply, teardown.
      #
      # It exists because SKIPPING the teardown step is not enough. A run whose
      # inputs asked for destruction must not quietly become a run that happens
      # not to destroy: the operator is owed the refusal, and owed it before
      # ninety minutes of provisioning rather than after.
      #
      # The two inputs it refuses on both had the DESTRUCTIVE choice as their
      # default, and neither said so:
      #   #3028  keep_resources defaulted FALSE, so `run_mode=full` + change
      #          nothing else = provision, smoke, then run fiab-teardown.sh,
      #          which deletes every rg-csa-loom-* RG in the SUBSCRIPTION. The
      #          "USE WITH CAUTION" warning was attached to the SAFE value.
      #   #3029  region had no default on the input and `|| 'eastus2'` in env:,
      #          so an omitted region silently targeted the wrong estate.
      #
      # Decision logic + tests: scripts/ci/deploy-input-safety.mjs and
      # scripts/ci/__tests__/deploy-input-safety.test.mjs. Workflow shape is
      # held by scripts/ci/check-deploy-input-safety.mjs.
      - name: Deploy input safety gate (refuses a run that would tear down or mis-target)
        id: input_safety
        env:
          INPUT_RUN_MODE: ${{ inputs.run_mode }}
          INPUT_KEEP_RESOURCES: ${{ inputs.keep_resources }}
          INPUT_CONFIRM_TEARDOWN_RG: ${{ inputs.confirm_teardown_rg }}
          INPUT_REGION: ${{ inputs.region }}
          RESOLVED_REGION: ${{ steps.reconcile.outputs.region }}
          RESOLVED_REGION_SOURCE: ${{ steps.reconcile.outputs.region_source }}
          DEPLOY_APPS_ENABLED: ${{ steps.reconcile.outputs.deploy_apps_enabled }}
          UNKNOWN_IMAGE_KEYS: ${{ steps.reconcile.outputs.unknown_keys }}
          HUB_PRESENT: ${{ steps.reconcile.outputs.hub_present }}
        run: node scripts/ci/deploy-input-safety.mjs

      - name: Register resource providers + features (deploy sub)
        run: |
          # Best-effort: register the resource providers + the BYO-public-IP
          # feature the admin-plane/DLZ bicep needs, on the actual deploy sub.
          # A fresh subscription often has these unregistered, which surfaces as
          # SubscriptionNotRegisteredForFeature / preflight RP errors mid-deploy
          # (found on the DMLZ-hub clean rebuild). Never fails the run — the
          # provision step still surfaces anything genuinely missing.
          set +e
          DEPLOY_SUB="${{ steps.topology_guard.outputs.deploy_sub }}"
          [ -n "$DEPLOY_SUB" ] && az account set --subscription "$DEPLOY_SUB"
          echo "Registering providers on sub $(az account show --query id -o tsv)…"
          for ns in Microsoft.Network Microsoft.Web Microsoft.Kusto Microsoft.Databricks \
                    Microsoft.Synapse Microsoft.EventHub Microsoft.DocumentDB \
                    Microsoft.CognitiveServices Microsoft.App Microsoft.Cdn \
                    Microsoft.Storage Microsoft.KeyVault Microsoft.Insights \
                    Microsoft.OperationalInsights Microsoft.Purview \
                    Microsoft.MachineLearningServices Microsoft.ContainerService \
                    Microsoft.Dashboard Microsoft.ManagedIdentity Microsoft.Sql; do
            az provider register --namespace "$ns" >/dev/null 2>&1 &
          done
          wait
          # AllowBringYourOwnPublicIpAddress is a feature flag — register it, wait
          # for Registered, then re-register Microsoft.Network so it takes effect.
          STATE=$(az feature show --namespace Microsoft.Network --name AllowBringYourOwnPublicIpAddress --query properties.state -o tsv 2>/dev/null)
          if [ "$STATE" != "Registered" ]; then
            az feature register --namespace Microsoft.Network --name AllowBringYourOwnPublicIpAddress >/dev/null 2>&1
            for i in $(seq 1 30); do
              STATE=$(az feature show --namespace Microsoft.Network --name AllowBringYourOwnPublicIpAddress --query properties.state -o tsv 2>/dev/null)
              echo "[$i] AllowBringYourOwnPublicIpAddress: $STATE"
              [ "$STATE" = "Registered" ] && break
              sleep 20
            done
            az provider register --namespace Microsoft.Network >/dev/null 2>&1
          fi
          echo "Provider/feature registration complete (best-effort)."
          exit 0

      # GAP 1 FIX — dlz-attach hub coordinates (cross-sub).
      # A dlz-attach deployment is submitted AT the DLZ (target) subscription scope,
      # but the existing hub (admin plane: Console UAMI, hub VNet) lives in a
      # DIFFERENT subscription — `inputs.subscription`, the hub sub. main.bicep needs
      # these hub coordinates to (a) make the reverse hub→DLZ VNet peering land in the
      # hub VNet/sub (dlzAttachHubPeering, scope=resourceGroup(hubAdminSubscriptionId,
      # adminPlaneRgName)), (b) update the hub Console's DLZ env (dlzAttachHubConsoleEnv,
      # same scope, run as the hub Console UAMI), and (c) grant the hub Console UAMI
      # data-plane RBAC on the new DLZ resources. Without them, hubAdminSubscriptionId
      # falls back to the DEPLOYMENT (DLZ) sub and effHubVnetId/effHubConsoleUamiId are
      # empty → cross-sub peering + console-env wiring silently target the wrong sub.
      # We discover them live from the hub admin RG (rg-csa-loom-admin-<hub-region>) in
      # the HUB sub. The hub region == AZURE_LOCATION (the consistent region for the
      # whole tenant); the dlz-attach deploys into target_subscription at that region.
      # Prefer the hub deploy's topologyManifest output when a recent successful hub
      # deployment is found; otherwise query the resources directly.
      - name: Discover dlz-attach hub coordinates (hub sub)
        id: hubcoords
        if: env.CSA_LOOM_TOPOLOGY == 'dlz-attach'
        run: |
          set -uo pipefail
          HUB_SUB="${CSA_LOOM_SUBSCRIPTION_OVERRIDE}"
          if [ -z "$HUB_SUB" ]; then
            echo "::error::dlz-attach requires 'subscription' (the existing HUB/admin-plane subscription id) so the cross-sub hub peering + console env land in the right sub."; exit 1
          fi
          HUB_RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          echo "Hub sub=$HUB_SUB  hub admin RG=$HUB_RG  region=$AZURE_LOCATION"
          az account set --subscription "$HUB_SUB"

          HUB_VNET_ID=""; HUB_UAMI_PRINCIPAL=""; HUB_UAMI_CLIENT=""; HUB_UAMI_ID=""; HUB_UAMI_NAME=""
          # (1) Prefer the most-recent SUCCEEDED hub deployment's topologyManifest.hub.
          MANIFEST=""
          DEP_NAME=$(az deployment sub list --subscription "$HUB_SUB" \
            --query "sort_by([?properties.provisioningState=='Succeeded' && properties.outputs.topologyManifest != null], &properties.timestamp)[-1].name" \
            -o tsv 2>/dev/null || true)
          if [ -n "${DEP_NAME:-}" ] && [ "$DEP_NAME" != "None" ]; then
            MANIFEST=$(az deployment sub show --subscription "$HUB_SUB" --name "$DEP_NAME" \
              --query "properties.outputs.topologyManifest.value.hub" -o json 2>/dev/null || true)
          fi
          if [ -n "${MANIFEST:-}" ] && [ "$MANIFEST" != "null" ]; then
            echo "Found hub topologyManifest from deployment '$DEP_NAME'."
            HUB_VNET_ID=$(echo "$MANIFEST" | python3 -c "import sys,json;print(json.load(sys.stdin).get('hubVnetId',''))" 2>/dev/null || true)
            HUB_UAMI_PRINCIPAL=$(echo "$MANIFEST" | python3 -c "import sys,json;print(json.load(sys.stdin).get('consolePrincipalId',''))" 2>/dev/null || true)
            HUB_UAMI_CLIENT=$(echo "$MANIFEST" | python3 -c "import sys,json;print(json.load(sys.stdin).get('consoleUamiAppId',''))" 2>/dev/null || true)
            HUB_UAMI_ID=$(echo "$MANIFEST" | python3 -c "import sys,json;print(json.load(sys.stdin).get('consoleUamiResourceId',''))" 2>/dev/null || true)
            HUB_UAMI_NAME=$(echo "$MANIFEST" | python3 -c "import sys,json;print(json.load(sys.stdin).get('consoleUamiName',''))" 2>/dev/null || true)
            # #2682 — hub ACR / Container Apps env / Key Vault. Needed by any
            # dlz-attach workload that runs a container ON THE HUB (today the
            # S3-compatible ADLS gateway). main.bicep records all three in
            # topologyManifest.hub; before this they were recorded and read by
            # nobody, so the gateway's image resolved to an anonymous docker.io
            # pull on every shipped lane (PR #2640 round 4).
            HUB_ACR_LOGIN=$(echo "$MANIFEST" | python3 -c "import sys,json;print(json.load(sys.stdin).get('acrLoginServer',''))" 2>/dev/null || true)
            HUB_CAE_ID=$(echo "$MANIFEST" | python3 -c "import sys,json;print(json.load(sys.stdin).get('caeId',''))" 2>/dev/null || true)
            HUB_KV_ID=$(echo "$MANIFEST" | python3 -c "import sys,json;print(json.load(sys.stdin).get('keyVaultId',''))" 2>/dev/null || true)
          fi
          # (2) Live-query fallback for anything the manifest didn't supply.
          if [ -z "${HUB_VNET_ID:-}" ] || [ "$HUB_VNET_ID" = "null" ]; then
            HUB_VNET_ID=$(az network vnet show -g "$HUB_RG" -n "vnet-csa-loom-hub-${AZURE_LOCATION}" --query id -o tsv 2>/dev/null || true)
            [ -z "$HUB_VNET_ID" ] && HUB_VNET_ID=$(az network vnet list -g "$HUB_RG" --query "[?contains(name,'hub')].id | [0]" -o tsv 2>/dev/null || true)
          fi
          if [ -z "${HUB_UAMI_ID:-}" ] || [ "$HUB_UAMI_ID" = "null" ]; then
            UAMI_NAME=$(az identity list -g "$HUB_RG" --query "[?contains(name,'console')].name | [0]" -o tsv 2>/dev/null || true)
            [ -z "$UAMI_NAME" ] && UAMI_NAME="uami-loom-console-${AZURE_LOCATION}"
            UAMI_JSON=$(az identity show -n "$UAMI_NAME" -g "$HUB_RG" -o json 2>/dev/null || true)
            if [ -n "${UAMI_JSON:-}" ]; then
              HUB_UAMI_NAME="$UAMI_NAME"
              HUB_UAMI_PRINCIPAL=$(echo "$UAMI_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('principalId',''))" 2>/dev/null || true)
              HUB_UAMI_CLIENT=$(echo "$UAMI_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('clientId',''))" 2>/dev/null || true)
              HUB_UAMI_ID=$(echo "$UAMI_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
            fi
          fi
          if [ -z "${HUB_VNET_ID:-}" ] || [ -z "${HUB_UAMI_ID:-}" ]; then
            echo "::error::Could not discover hub coordinates in $HUB_SUB / $HUB_RG (hubVnetId='${HUB_VNET_ID:-}', consoleUamiId='${HUB_UAMI_ID:-}'). Confirm the hub (topology=tenant) is deployed in 'subscription' at region '$AZURE_LOCATION'."; exit 1
          fi
          echo "hub_admin_sub=$HUB_SUB"          >> "$GITHUB_OUTPUT"
          echo "hub_vnet_id=$HUB_VNET_ID"        >> "$GITHUB_OUTPUT"
          echo "hub_uami_principal=$HUB_UAMI_PRINCIPAL" >> "$GITHUB_OUTPUT"
          echo "hub_uami_client=$HUB_UAMI_CLIENT"       >> "$GITHUB_OUTPUT"
          echo "hub_uami_id=$HUB_UAMI_ID"        >> "$GITHUB_OUTPUT"
          echo "hub_uami_name=$HUB_UAMI_NAME"    >> "$GITHUB_OUTPUT"
          # #2682 — live-query fallback for the three hub-side workload coordinates
          # when the manifest predates them. These are NOT part of the hard-fail
          # check above on purpose: a hub whose manifest predates #2682 must still
          # be attachable. Empty simply means the hub-side S3 gateway is skipped
          # and its surface honest-gates — never a silent public-registry pull,
          # because s3-gateway-aca.bicep REQUIRES an acrLoginServer.
          if [ -z "${HUB_ACR_LOGIN:-}" ] || [ "$HUB_ACR_LOGIN" = "null" ]; then
            HUB_ACR_LOGIN=$(az acr list -g "$HUB_RG" --query "[0].loginServer" -o tsv 2>/dev/null || true)
          fi
          if [ -z "${HUB_CAE_ID:-}" ] || [ "$HUB_CAE_ID" = "null" ]; then
            HUB_CAE_ID=$(az containerapp env list -g "$HUB_RG" --query "[0].id" -o tsv 2>/dev/null || true)
          fi
          if [ -z "${HUB_KV_ID:-}" ] || [ "$HUB_KV_ID" = "null" ]; then
            HUB_KV_ID=$(az keyvault list -g "$HUB_RG" --query "[0].id" -o tsv 2>/dev/null || true)
          fi
          # Grouped redirect rather than three individual `echo … >> "$GITHUB_OUTPUT"`
          # lines: that pattern trips SC2129 and the actionlint ratchet is a
          # merge-blocker. (Note the wording — a comment line must not BEGIN with
          # the word "shellcheck" after the hash, because shellcheck reads that as
          # a malformed directive and raises SC1072/SC1073. Same trap the install
          # step in loom-guardrails.yml documents.)
          {
            echo "hub_acr_login=${HUB_ACR_LOGIN:-}"
            echo "hub_cae_id=${HUB_CAE_ID:-}"
            echo "hub_kv_id=${HUB_KV_ID:-}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Hub coords — sub=$HUB_SUB vnet=$HUB_VNET_ID uami=$HUB_UAMI_NAME ($HUB_UAMI_PRINCIPAL)"
          if [ -n "${HUB_ACR_LOGIN:-}" ] && [ -n "${HUB_CAE_ID:-}" ]; then
            echo "::notice::Hub workload coords present — the hub-side S3 gateway (#2682) will deploy from $HUB_ACR_LOGIN."
          else
            echo "::warning::Hub ACR/CAE coordinate not discovered (acr='${HUB_ACR_LOGIN:-}', cae='${HUB_CAE_ID:-}'). The hub-side S3 gateway will be SKIPPED and svc-s3-gateway will honest-gate. This is not a public-registry fallback — the module has none."
          fi

      # ── BROWNFIELD RECONCILE DISCOVERY (D4, run 31100384405 — deploy-integrity R5) ──
      # Azure permits exactly ONE Vpn-type gateway per VNet and ONE private-DNS
      # zone link per (zone, VNet) pair. The live estate carries both under
      # names that predate the current templates (vpngw-loom-centralus;
      # link-apim-console), so a create-new PUT can NEVER succeed — run
      # 31100384405 died on MultipleGatewaysOfTypeVpnUseSameVnet and the
      # azure-api.net link 409 Conflict. The deploy must ADOPT those names.
      # Bicep cannot query a scope, so the discovery runs here and feeds the
      # template params. It runs in BOTH modes so what-if previews the SAME
      # template inputs the apply uses. Three-state (R7): found → adopt name;
      # ARM-answered-absent → create-new defaults; unreadable → this step FAILS
      # (a failed read establishes nothing, and asserting "nothing exists" from
      # one is exactly how the estate got a second-gateway PUT).
      - name: Brownfield reconcile discovery (adopt estate-owned singletons — R5)
        id: reconcile_adopt
        run: |
          set -euo pipefail
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          DEPLOY_SUB="${{ steps.topology_guard.outputs.deploy_sub }}"
          OUT=$(node scripts/csa-loom/preflight-brownfield-adopt.mjs \
            --resource-group "$RG" \
            --hub-vnet-name "vnet-csa-loom-hub-${AZURE_LOCATION}" \
            ${DEPLOY_SUB:+--subscription "$DEPLOY_SUB"} --json)
          echo "$OUT"
          VPN_NAME=$(echo "$OUT" | python3 -c 'import sys,json;print(json.load(sys.stdin)["vpnGatewayName"])')
          LINK_NAME=$(echo "$OUT" | python3 -c 'import sys,json;print(json.load(sys.stdin)["apimDnsLinkName"])')
          echo "vpn_gateway_name=$VPN_NAME"    >> "$GITHUB_OUTPUT"
          echo "apim_dns_link_name=$LINK_NAME" >> "$GITHUB_OUTPUT"
          if [ -n "$VPN_NAME" ] || [ -n "$LINK_NAME" ]; then
            echo "::notice::brownfield-adopt: existing singletons will be ADOPTED — vpnGateway='${VPN_NAME:-<create-new>}', azure-api.net link='${LINK_NAME:-<create-new>}'."
          else
            echo "::notice::brownfield-adopt: no existing VPN gateway or azure-api.net link on the hub VNet — create-new defaults apply."
          fi

      # ── POLICY-RESTRICTION DISCOVERY (D5, run 31100384405 — deploy-integrity R5) ──
      # Names the Azure Policy restrictions the deploy is subject to BEFORE
      # anything is submitted (the D5 leaf: the Purview RP preflight denied by
      # the MG-scoped MCAPSGovDeployPolicies assignment requiring storage
      # publicNetworkAccess=Disabled — the template now complies by default via
      # catalog.bicep purviewManagedResourcesPublicNetworkAccess=Disabled).
      # ADVISORY by design: this is R5 discovery, not a gate — the ENFORCING
      # policy control is the RP preflight inside the what-if/validate step
      # below, which cannot be bypassed. An unreadable policy engine is
      # reported as UNKNOWN (loud ::warning), never as "no restrictions", and
      # an empty answer carries the measured caveat that MG-scoped assignments
      # outside the caller's read scope are invisible to the probe (R7).
      - name: Policy-restriction discovery (advisory — R5)
        run: |
          set -euo pipefail
          DEPLOY_SUB="${{ steps.topology_guard.outputs.deploy_sub }}"
          SUB="${DEPLOY_SUB:-$(az account show --query id -o tsv | tr -d '\r')}"
          node scripts/csa-loom/preflight-policy-restrictions.mjs \
            --subscription "$SUB" \
            --location "$AZURE_LOCATION" \
            --resource-group "rg-csa-loom-admin-${AZURE_LOCATION}" \
            --advisory

      # SIGN-IN + CATALOG-AUTHORIZATION DURABILITY (#2681), AND WHY IT IS HERE
      # RATHER THAN AFTER THE WHAT-IF (#3022).
      #
      # An Entra app registration is a Microsoft Graph object ARM cannot create,
      # so commercial.bicepparam reads it from LOOM_MSAL_CLIENT_ID — and this
      # lane passed NOTHING. An ACA template rewrite drops every env var it does
      # not declare, so each re-run re-rendered an EMPTY client id and took
      # sign-in dark, undoing what the post-deploy bootstrap had wired.
      #
      # It costs more than sign-in. admin-plane/main.bicep deploys `loom-unity`
      # DEFAULT-ON and passes this id as the catalog's `entraClientId`; with no
      # pinnable audience the module deploys SEALED (minReplicas 0, unroutable
      # audience) by design — fail-closed rather than the anonymous catalog of
      # #2643. So an unresolved client id does not merely blank sign-in, it
      # RE-SEALS a working catalog on every reconcile.
      #
      # THE ORDERING BUG (#3022). This step used to run AFTER `Bicep what-if`,
      # and only on `schedule || run_mode == full`. LOOM_MSAL_CLIENT_ID is read
      # by commercial.bicepparam at BICEP-COMPILE time, so the what-if compiled
      # the paramfile with the variable UNSET and the apply compiled it with the
      # variable SET: the preview was of a different template than the one
      # applied, for exactly the parameter family with the highest blast radius.
      # A preview that asserts "this is what will happen" while previewing
      # different inputs states something it did not establish (R7).
      #
      # It now runs on EVERY trigger, before the parameters are composed, so the
      # what-if and the apply see identical inputs. It is read-only (a Key Vault
      # secret READ and an `az containerapp show`) and never fails the caller —
      # empty is the correct answer on a genuinely fresh subscription, where the
      # catalog comes up sealed and csa-loom-post-deploy-bootstrap unseals it.
      - name: Resolve the existing MSAL client id (sign-in + Loom Unity audience durability)
        id: msal
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_APPS_ENABLED: ${{ steps.reconcile.outputs.deploy_apps_enabled }}
        run: |
          set -euo pipefail
          CID="$(bash scripts/csa-loom/resolve-msal-client-id.sh --rg "rg-csa-loom-admin-${AZURE_LOCATION}" || true)"
          echo "LOOM_MSAL_CLIENT_ID=${CID}" >> "$GITHUB_ENV"
          if [ -n "${CID:-}" ]; then
            echo "::notice::MSAL client id resolved for this estate — sign-in and the Loom Unity audience stay wired across this deploy, and the what-if below previews the SAME value the apply will use."
            exit 0
          fi
          # UNATTENDED + APPS-ENABLED + NO CLIENT ID is the one combination that
          # must not proceed silently. app-deployments.bicep would re-render
          # loom-console with an EMPTY LOOM_MSAL_CLIENT_ID (sign-in dark) and
          # re-seal loom-unity, with nobody watching. An operator dispatch may
          # still do it deliberately — that is a first install.
          if [ "${EVENT_NAME}" = "schedule" ] && [ "${DEPLOY_APPS_ENABLED}" = "true" ]; then
            echo "::error::No Entra app registration could be resolved for this estate, and this is an UNATTENDED scheduled run with deployAppsEnabled=true. Applying would re-render loom-console with an empty LOOM_MSAL_CLIENT_ID (sign-in goes dark) and re-seal loom-unity. Refusing. Run csa-loom-post-deploy-bootstrap.yml so the client id is recorded in Key Vault, then let the schedule resume."
            exit 1
          fi
          echo "::warning::No Entra app registration for this estate yet. Sign-in stays unconfigured and loom-unity deploys SEALED until csa-loom-post-deploy-bootstrap (bootstrap-msal-app-reg.sh) runs; it records the client id in Key Vault so later deploys stay pinned."

      # ── ADOPT THE ESTATE'S LIVE INTERNAL TRUST TOKEN (#3056) ──────────────
      # Exactly the same durability problem the MSAL step above solves, for the
      # secret that broke the estate THREE times in two days.
      #
      # `loomInternalToken` used to be minted here every single deploy:
      # `guid(loomGeneratedSecretSeed, …)` where loomGeneratedSecretSeed
      # defaults to `newGuid()`, which the compiled template carries as
      # `"defaultValue": "[newGuid()]"` — ARM re-evaluates it on EVERY
      # deployment. The console and the consumer jobs matched each other (same
      # deployment), and every holder OUTSIDE the deployment — the
      # `LOOM_INTERNAL_TOKEN` repo secret, any operator-rotated value — was
      # silently invalidated. Container Apps does not restart replicas on a
      # secret write, so the split sat latent and detonated when the console
      # revision cycled: 153/153 eval probes 401'd, #2929's reindex started
      # rejecting, and the #3090 residual would not clear.
      #
      # The estate now OWNS the value and this deploy ADOPTS it, so a redeploy
      # re-applies what was already live and cannot invalidate a working estate.
      # Greenfield (no console to read) resolves empty and bicep mints one —
      # day-one stays zero-touch. The value is masked and never printed; only a
      # sha256 fingerprint reaches the log.
      - name: Adopt the estate's live internal trust token (never re-mint it)
        run: |
          set -euo pipefail
          # AZURE_LOCATION is read from the SHELL at runtime rather than through
          # a step-level `env:` template expression, for the same reason the MSAL
          # step above does it that way: the reconcile step may have re-pinned the
          # region into $GITHUB_ENV, and an expression resolved against the
          # workflow-level value would look at the wrong resource group.
          export ADMIN_RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          # The script appends LOOM_INTERNAL_TOKEN to $GITHUB_ENV itself (masked
          # first). Its stdout is the `export …` form for shell callers, which we
          # discard here precisely so the value is not re-echoed into this log.
          bash scripts/csa-loom/resolve-internal-token.sh --export > /dev/null

      # ── ONE PARAMETER SOURCE FOR THE WHAT-IF AND THE APPLY (refs #3022) ──
      #
      # These two commands used to be two hand-maintained copies of the same
      # ~15-line argument list, and they had ALREADY drifted: the what-if passed
      # `--subscription "$CSA_LOOM_TARGET_SUBSCRIPTION"` (set only for
      # dlz-attach) while the apply passed `--subscription "$DEPLOY_SUB"` (the
      # topology guard's verdict, which is the `subscription` input for a
      # tenant/single-sub run). So on a dispatch that named an explicit hub
      # subscription, the preview ran against the LOGIN subscription and the
      # apply ran against a different one.
      #
      # Divergence is now IMPOSSIBLE rather than documented: the arguments are
      # composed once, into a file, and both commands expand that same file.
      # There is no second copy to drift. The file's sha256 is emitted and
      # re-asserted at apply time, so even a rewrite between the two steps is
      # caught. Enforced statically by scripts/ci/check-deploy-input-safety.mjs.
      #
      # The file lives in $RUNNER_TEMP, is never uploaded, and is printed with
      # its values redacted — adminEntraGroupId is a secret and GitHub's log
      # masking is not something a deploy path should be leaning on.
      # ── ADOPT the Data Landing Zone before composing arguments ─────────────
      #
      # Must run BEFORE the compose step: commercial.bicepparam reads
      # LOOM_ADOPT_JSON via readEnvironmentVariable at BICEP-COMPILE time, so the
      # value has to be in the environment before `az deployment … ` expands the
      # param file. Setting it afterwards is a no-op.
      #
      # WHY THIS EXISTS. main.bicep derived the lake account from the single-sub
      # convention alone, so on a multi-sub / dlz-attach estate it passed '' and
      # LOOM_ADLS_ACCOUNT rendered EMPTY. Measured on Commercial 2026-08-10: the
      # lake, Databricks, Event Hubs, Synapse and the Weave Postgres were ALL
      # deployed in the DLZ subscription while /admin/readiness reported 25
      # blocked capabilities. The documented workaround (patch-navigator-env.sh,
      # post-deploy) was both a user-performed plumbing step and self-reverting,
      # because the next deploy re-renders the container app env array.
      #
      # Discovery is best-effort BY DESIGN: no DLZ, an absent RG, or an estate
      # that simply has none of these services all yield `{}`, `adoptMode()`
      # defaults every key to 'create', and a greenfield deploy behaves exactly
      # as it did before this step existed. It never creates and never grants.
      - name: Adopt the DLZ (discover what the estate already owns)
        id: dlz_adopt
        env:
          # This workflow deliberately exposes no dlz_subscription / dlz_domain
          # inputs — it targets ONE estate identified by `region`, and the DLZ is
          # whatever that estate actually has. So the resolver runs in pure
          # DISCOVERY mode here; the bootstrap workflow keeps its explicit inputs
          # for the cases where an operator must name a DLZ by hand.
          ADMIN_SUB: ${{ steps.topology_guard.outputs.deploy_sub }}
        run: |
          set -euo pipefail
          # ── THE REGION IS READ FROM THE SHELL, NOT FROM THE TRIGGER (#3701) ──
          #
          # This step used to carry a `REGION:` entry in the `env:` block above,
          # set from the workflow's `region` INPUT. There are no inputs on a
          # `schedule` event, so it expanded to the empty string on EVERY nightly
          # run (the same trap #2775 documents for allow_existing_hub): the
          # resolver was
          # invoked with `--region ""`, exited EXIT.USAGE (2) with "--region is
          # required.", and the `|| echo` that used to sit below reported that as
          # "found no unambiguous DLZ". The run went green having measured
          # nothing.
          #
          # MEASURED, same code, same estate, only the trigger differing:
          #   31898068403  workflow_dispatch  2026-08-15  adopting:
          #                databricks,eventhubs,storage-adls,synapse
          #   31870181337  schedule           2026-08-15  --region is required.
          #   31932209496  schedule           2026-08-16  --region is required.
          #   32004118361  schedule           2026-08-17  --region is required.
          # All four conclusion=success. The three scheduled runs adopted (none).
          #
          # WHY THAT DELETES CONFIGURATION RATHER THAN MERELY SKIPPING IT. With no
          # adopted `storage-adls` and topology=tenant (the value
          # params/commercial.bicepparam pins, and the `topology=` override below
          # is only appended when CSA_LOOM_TOPOLOGY is non-empty — it is empty on a
          # schedule), main.bicep's `deployLandingZones` is false, so `useSingleDlz`
          # is false and `loomStorageAccount` composes to ''. The env array in
          # modules/admin-plane/main.bicep is CONDITIONAL on that string
          # (`!empty(loomStorageAccount) ? [ … ] : []`), so an empty value does not
          # leave the seven lake variables alone — it REMOVES LOOM_BRONZE_URL,
          # LOOM_SILVER_URL, LOOM_GOLD_URL, LOOM_LANDING_URL, LOOM_CSV_IMPORTS_URL,
          # LOOM_SAMPLE_ADLS and LOOM_RECYCLE_RETENTION_DAYS from the running
          # console, plus LOOM_ORG_VISUALS_URL from the sibling array. The nightly
          # was therefore a RATCHET: the 08-15 dispatch wired the lake and the
          # 08-16 schedule deleted it ~13 hours later. Any operator fix survived
          # until the next 06:00 UTC cron.
          #
          # $AZURE_LOCATION is the MEASURED region: `Resolve reconcile target`
          # above (scripts/ci/reconcile-resolve.mjs) writes it to $GITHUB_ENV,
          # adopting the region of the hub that actually exists, or refusing. That
          # is precisely why the MSAL resolve step and the internal-token adopt
          # step read it from the shell — see the note in that step. This step was
          # added later and did not adopt the pattern. Held by S8 in
          # scripts/ci/check-deploy-input-safety.mjs so it cannot regress.
          REGION="${AZURE_LOCATION:-}"
          if [ -z "$REGION" ]; then
            echo "::error::[dlz-adopt] No region is available: \$AZURE_LOCATION is empty after 'Resolve reconcile target', which is the step that must either MEASURE the estate's region or refuse the run. Refusing rather than discovering against no region — that is exactly what silently produced 'adopting: (none)' on every scheduled run and stripped the lake env vars off the console (#3701)."
            exit 1
          fi
          INPUT_DLZ_SUBSCRIPTION=""; INPUT_DLZ_DOMAIN=""
          RESOLVED="$RUNNER_TEMP/dlz-coords.env"; : > "$RESOLVED"
          # resolve-dlz-coordinates.mjs DISCOVERS rather than assuming the
          # `…-single-<region>` convention, which is exactly the shape this
          # estate is not.
          #
          # ITS EXIT CODE IS CLASSIFIED, NEVER SWALLOWED (deploy-integrity.md
          # R6/R7). The script's own header states the contract this step used to
          # break: "'Could not determine' and 'not present' are different answers
          # with different exit codes, and neither is ever rendered as the other".
          # A single `|| echo "…found no unambiguous DLZ…"` collapsed all four
          # non-zero codes into one sentence that ASSERTED a measurement the
          # script had not made.
          #
          #   0 resolved    a landing zone was found — adopt what is in it.
          #   1 not-found   Resource Graph WAS read and nothing matched. A genuine
          #                 negative, and the correct greenfield answer. Continue.
          #   2 usage       this caller passed invalid arguments. Our defect, and
          #                 nothing was measured. Fail.
          #   3 unreadable  the query failed; the estate is UNKNOWN, which is not
          #                 the same as "no DLZ". Fail rather than compose an empty
          #                 adopt plan off an answer nobody established.
          #   4 ambiguous   several match and nothing was chosen. Fail closed —
          #                 which is what this step's comment already claimed.
          RC=0
          node scripts/csa-loom/resolve-dlz-coordinates.mjs \
            --region "$REGION" \
            --admin-subscription "$ADMIN_SUB" \
            ${INPUT_DLZ_SUBSCRIPTION:+--dlz-subscription "$INPUT_DLZ_SUBSCRIPTION"} \
            ${INPUT_DLZ_DOMAIN:+--dlz-domain "$INPUT_DLZ_DOMAIN"} \
            --github-env "$RESOLVED" || RC=$?
          case "$RC" in
            0)
              echo "[dlz-adopt] resolver RESOLVED a landing zone for region '$REGION'."
              ;;
            1)
              # EXIT 1 IS ALSO WHAT NODE RETURNS FOR AN UNCAUGHT THROW, so the
              # code alone cannot tell "Resource Graph was read and nothing
              # matched" from "this script died before measuring anything".
              # Rename the resolver and, on the code alone, the nightly would
              # report a confident greenfield negative forever — the same R7
              # error this whole change exists to remove. The resolver now writes
              # DLZ_STATUS on every MEASURED path, so we require that positive
              # marker rather than inferring a measurement from an exit code.
              if grep -q '^DLZ_STATUS=not-found$' "$RESOLVED"; then
                echo "::notice::[dlz-adopt] resolver read Azure Resource Graph SUCCESSFULLY and no landing zone matched region '$REGION'. Continuing without adoption — that is the correct greenfield answer, and it is a measurement, not a fallback."
              else
                echo "::error::[dlz-adopt] resolve-dlz-coordinates exited 1 but did NOT write 'DLZ_STATUS=not-found'. Exit 1 is also node's code for an uncaught throw or a module-load failure, so nothing here establishes that the estate was read. Refusing rather than reporting a greenfield negative nobody measured (#3701/#3703). Check that scripts/csa-loom/resolve-dlz-coordinates.mjs exists, loads, and that its dependencies resolve."
                exit 1
              fi
              ;;
            2)
              echo "::error::[dlz-adopt] resolve-dlz-coordinates exited USAGE (2): this workflow passed it invalid arguments (region='$REGION', admin-subscription='${ADMIN_SUB:-<empty>}'). NOTHING was established about the estate. Refusing — continuing would compose an EMPTY adopt plan, and an empty plan does not skip the lake binding, it DELETES the seven LOOM_*_URL/LOOM_SAMPLE_ADLS env vars from the running console (#3701)."
              exit 1
              ;;
            3)
              # NOT FATAL ON dlz-attach. main.bicep:1114 sets
              # `deployAdminPlane = effectiveTopology != 'dlz-attach'`, and both
              # `resource adminPlaneRg` (1149) and `module adminPlane` (1159) are
              # gated on it — so on that topology the console env array is never
              # re-rendered and an empty adopt plan cannot delete anything. Before
              # #3703 this arm continued; failing it would BLOCK an attach that is
              # incapable of the harm, which is a regression, not a fix.
              if [ "${CSA_LOOM_TOPOLOGY:-}" = "dlz-attach" ]; then
                echo "::warning::[dlz-adopt] resolve-dlz-coordinates exited UNREADABLE (3): the Azure Resource Graph query FAILED, so whether this estate has a landing zone is UNKNOWN. Continuing ONLY because topology=dlz-attach deploys no admin plane (main.bicep:1114), so no console env variable can be removed by an empty adopt plan. Discovery still measured nothing — check that the deploy identity can read Resource Graph across this estate's subscriptions."
              else
                echo "::error::[dlz-adopt] resolve-dlz-coordinates exited UNREADABLE (3): the Azure Resource Graph query FAILED, so whether this estate has a landing zone is UNKNOWN — it is NOT 'no'. Refusing rather than deploying an empty adopt plan that would strip the lake env vars off the console. Check that the deploy identity can read Resource Graph across this estate's subscriptions (Reader at the DLZ subscription is the usual gap)."
                exit 1
              fi
              ;;
            4)
              if [ "${CSA_LOOM_TOPOLOGY:-}" = "dlz-attach" ]; then
                echo "::warning::[dlz-adopt] resolve-dlz-coordinates exited AMBIGUOUS (4): more than one landing zone matches region '$REGION' and none was chosen. Continuing ONLY because topology=dlz-attach deploys no admin plane (main.bicep:1114), so nothing can be stripped. Name the intended DLZ explicitly (csa-loom-post-deploy-bootstrap.yml takes dlz_subscription / dlz_domain inputs) if this attach needs a specific one."
              else
                echo "::error::[dlz-adopt] resolve-dlz-coordinates exited AMBIGUOUS (4): more than one landing zone matches region '$REGION' and this deploy wires exactly one, so NOTHING was chosen. Failing closed. Name the intended DLZ explicitly (csa-loom-post-deploy-bootstrap.yml takes dlz_subscription / dlz_domain inputs), or remove the duplicate resource group."
                exit 1
              fi
              ;;
            *)
              echo "::error::[dlz-adopt] resolve-dlz-coordinates exited with the undocumented code $RC. Its contract is 0 resolved / 1 not-found / 2 usage / 3 unreadable / 4 ambiguous, so nothing it printed can be read as a verdict about this estate. Refusing."
              exit 1
              ;;
          esac
          DLZ_SUB="$(grep '^DLZ_SUB=' "$RESOLVED" | tail -1 | cut -d= -f2- || true)"
          DLZ_RG="$(grep  '^DLZ_RG='  "$RESOLVED" | tail -1 | cut -d= -f2- || true)"
          [ -n "${DLZ_SUB:-}" ] && echo "::add-mask::$DLZ_SUB"

          PLAN='{}'
          if [ -n "${DLZ_SUB:-}" ] && [ -n "${DLZ_RG:-}" ]; then
            PLAN="$(bash scripts/csa-loom/discover-dlz-adopt-plan.sh \
                      --dlz-subscription "$DLZ_SUB" --dlz-rg "$DLZ_RG")"
          fi

          # An EXPLICIT plan always wins over a discovered one — the operator (or
          # the Setup Wizard) said what to adopt, and discovery must not override
          # a deliberate decision. Discovery only fills keys nobody chose.
          if [ -n "${LOOM_ADOPT_JSON:-}" ] && [ "${LOOM_ADOPT_JSON}" != "{}" ]; then
            PLAN="$(PLAN="$PLAN" EXPLICIT="$LOOM_ADOPT_JSON" python -c 'import json,os; d=json.loads(os.environ["PLAN"]); d.update(json.loads(os.environ["EXPLICIT"])); print(json.dumps(d,separators=(",",":")))')"
            echo "::notice::[dlz-adopt] merged discovery UNDER the explicitly supplied LOOM_ADOPT_JSON (explicit wins)."
          fi

          echo "LOOM_ADOPT_JSON=$PLAN" >> "$GITHUB_ENV"
          KEYS="$(PLAN="$PLAN" python -c 'import json,os; print(",".join(sorted(json.loads(os.environ["PLAN"]))) or "(none)")')"
          echo "::notice::[dlz-adopt] adopting: $KEYS"
          echo "adopted=$KEYS" >> "$GITHUB_OUTPUT"

      # ── A DEPLOY MAY NOT DELETE THE LAKE WIRING AND CALL IT SUCCESS (#3701) ─
      #
      # The step above is now honest about what it measured, which removes the
      # CAUSE. This is the FAIL-CLOSED backstop for the CONSEQUENCE, because the
      # consequence is silent and destructive and has more than one possible
      # cause: discover-dlz-adopt-plan.sh looks the lake up through a helper that
      # ends `2>/dev/null || true`, so an unreadable storage list there produces
      # the same empty plan as a genuinely absent one.
      #
      # What it compares (independently, never trusting the plan for both sides):
      #   1. what `loomStorageAccount` WILL compose to — mirroring main.bicep's
      #      expression against the adopt plan and the topology that actually
      #      reaches ARM;
      #   2. whether this estate ALREADY OWNS a Loom Data Lake Gen2 account, read
      #      from Resource Graph in its own query.
      #
      # Empty binding + existing lake = this apply would REMOVE LOOM_BRONZE_URL,
      # LOOM_SILVER_URL, LOOM_GOLD_URL, LOOM_LANDING_URL, LOOM_CSV_IMPORTS_URL,
      # LOOM_SAMPLE_ADLS and LOOM_RECYCLE_RETENTION_DAYS from the running console
      # (the env array is `!empty(loomStorageAccount) ? [ … ] : []`) and report
      # success. That run is refused here, before the what-if.
      #
      # Greenfield is untouched: no Loom lake in the estate ⇒ empty binding is
      # consistent ⇒ pass, silently. An UNREADABLE estate is UNKNOWN and refuses
      # rather than guessing (R7).
      #
      # Decision logic + embedded controls + tests:
      # scripts/ci/assert-lake-binding.mjs, scripts/ci/__tests__/assert-lake-binding.test.mjs.
      - name: Assert this deploy will not STRIP the lake binding (#3701)
        id: lake_binding
        run: |
          set -euo pipefail
          # Defaulted on its own line, never inline: a `${VAR:-{\}}` default needs
          # a brace escaped inside a parameter expansion, and that is exactly the
          # quoting that silently yields a LITERAL instead of an empty object —
          # the sibling step below carries the same note for the same reason.
          PLAN="${LOOM_ADOPT_JSON:-}"
          [ -n "$PLAN" ] || PLAN='{}'
          node scripts/ci/assert-lake-binding.mjs \
            --adopt-json "$PLAN" \
            --region "$AZURE_LOCATION" \
            --topology "${CSA_LOOM_TOPOLOGY:-}" \
            --deployment-mode "${CSA_LOOM_DEPLOYMENT_MODE:-}" \
            --param-file platform/fiab/bicep/params/commercial.bicepparam \
            --github-output "$GITHUB_OUTPUT"

      # ── CAN THIS DEPLOY IDENTITY ACTUALLY GRANT AT THE LAKE? (#3336) ───────
      #
      # MEASURED, never assumed, and never asked of the operator. When the lake
      # was adopted from another subscription, admin-plane's grant modules skip
      # (`loomStorageAccountSameSub` is false) and the cross-sub pass in
      # main.bicep has to make them from a `scope: resourceGroup(<lakeSub>,
      # <lakeRg>)` module. That pass needs BOTH
      # `Microsoft.Resources/deployments/write` and
      # `Microsoft.Authorization/roleAssignments/write` over there — and an
      # identity holding neither does not get a skipped grant, it gets
      # AuthorizationFailed and the WHOLE deployment fails. That is the P0 that
      # failed two full Commercial deploys on 2026-08-13 (#3333/#3329), so the
      # pass is armed ONLY on a positive measurement.
      #
      # The probe reads the SAME adopt plan bicep reads (not the discovered
      # DLZ_SUB/DLZ_RG — an explicit LOOM_ADOPT_JSON may name a different
      # account, and measuring rights at a resource group nothing deploys to
      # would be a green light for the wrong scope). It then asks ARM, as this
      # very credential, what it may do at that exact scope, and classifies
      # allowed / denied / unknown / not-applicable with the reason printed.
      #
      # It exits 0 on every DECIDED outcome — a customer whose deploy SP lacks
      # the right is a supported estate, not a broken run, and their gateway
      # honest-gates with a Fix-it naming the grant. It exits non-zero only when
      # its own embedded controls fail, i.e. when no verdict it produced could be
      # trusted in either direction. Nothing here is `|| true`.
      #
      # Runs AFTER the adopt step (it needs the plan) and BEFORE the compose step
      # (which passes the verdict), so both the what-if and the apply carry it.
      - name: Measure cross-subscription lake grant rights (#3336)
        id: lake_rights
        env:
          DEPLOY_SUB: ${{ steps.topology_guard.outputs.deploy_sub }}
        run: |
          set -euo pipefail
          # LOOM_ADOPT_JSON reaches this step through $GITHUB_ENV, written by the
          # adopt step above. Defaulted on its own line rather than inline: a
          # `${VAR:-{\}}` default needs a brace escaped inside a parameter
          # expansion, which is exactly the kind of quoting that silently
          # produces a literal instead of an empty object.
          PLAN="${LOOM_ADOPT_JSON:-}"
          [ -n "$PLAN" ] || PLAN='{}'
          node scripts/csa-loom/probe-lake-grant-rights.mjs \
            --adopt-json "$PLAN" \
            --deploy-subscription "${DEPLOY_SUB:-}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Compose deployment arguments (ONE source for what-if and apply)
        id: params
        env:
          # The admin GROUP object id. `secrets.` first (so an org/environment
          # secret still wins), then `vars.` — a group object id is an
          # IDENTIFIER, not a credential, and the repo already carries
          # LOOM_AUTOMATION_OID / LOOM_CONSOLE_UAMI_PRINCIPAL as plain
          # variables. Before #3090 this read `secrets.FIAB_ADMIN_GROUP_ID`
          # ALONE and that secret HAS NEVER EXISTED in this repo (`gh secret
          # list` shows only FIAB_GOV_ADMIN_GROUP_ID), so every Commercial
          # deploy passed adminEntraGroupId='' — measured on
          # csa-loom-ci-31210378858.
          ADMIN_ENTRA_GROUP_ID: ${{ secrets.FIAB_ADMIN_GROUP_ID || vars.FIAB_ADMIN_GROUP_ID }}
          INPUT_TENANT_ADMIN_OID: ${{ inputs.tenant_admin_oid }}
          VAR_TENANT_ADMIN_OID: ${{ vars.FIAB_TENANT_ADMIN_OID }}
          INPUT_TENANT_ADMIN_GROUP_ID: ${{ inputs.tenant_admin_group_id }}
          DEPLOY_SUB: ${{ steps.topology_guard.outputs.deploy_sub }}
          PURVIEW_ENABLED: ${{ steps.topology_guard.outputs.purview_enabled }}
          AZURE_MAPS_ENABLED: ${{ steps.topology_guard.outputs.azure_maps_enabled }}
          FIREWALL_ENABLED: ${{ steps.topology_guard.outputs.firewall_enabled }}
          DEPLOY_APPS_ENABLED: ${{ steps.reconcile.outputs.deploy_apps_enabled }}
          SKIP_ROLE_GRANTS: ${{ steps.topology_guard.outputs.skip_role_grants }}
          FRONT_DOOR_ENABLED: ${{ steps.topology_guard.outputs.front_door_enabled }}
          EXISTING_VPN_GATEWAY_NAME: ${{ steps.reconcile_adopt.outputs.vpn_gateway_name }}
          APIM_DNS_LINK_NAME: ${{ steps.reconcile_adopt.outputs.apim_dns_link_name }}
          HUB_ADMIN_SUB: ${{ steps.hubcoords.outputs.hub_admin_sub }}
          HUB_VNET_ID: ${{ steps.hubcoords.outputs.hub_vnet_id }}
          HUB_UAMI_PRINCIPAL: ${{ steps.hubcoords.outputs.hub_uami_principal }}
          HUB_UAMI_NAME: ${{ steps.hubcoords.outputs.hub_uami_name }}
          HUB_UAMI_CLIENT: ${{ steps.hubcoords.outputs.hub_uami_client }}
          HUB_UAMI_ID: ${{ steps.hubcoords.outputs.hub_uami_id }}
          # #2682 / #3067 — hub workload coordinates for the hub-side S3 gateway.
          # Empty is a legitimate answer (a hub whose topologyManifest predates
          # #2682); the composition below omits the parameter rather than
          # passing an empty one, and svc-s3-gateway honest-gates.
          HUB_ACR_LOGIN: ${{ steps.hubcoords.outputs.hub_acr_login }}
          HUB_CAE_ID: ${{ steps.hubcoords.outputs.hub_cae_id }}
          HUB_KV_ID: ${{ steps.hubcoords.outputs.hub_kv_id }}
          # #3336 — the MEASURED verdict from the lake-rights probe above. Never
          # an input, never a default the operator can flip blind: this value is
          # only ever what ARM said this credential may do at the lake.
          CROSS_SUB_LAKE_GRANTS: ${{ steps.lake_rights.outputs.cross_sub_lake_grants }}
          CROSS_SUB_LAKE_VERDICT: ${{ steps.lake_rights.outputs.verdict }}
        run: |
          set -euo pipefail
          DEPLOY_NAME="csa-loom-ci-${{ github.run_id }}"
          ARGS_FILE="${RUNNER_TEMP}/deploy-args.txt"
          : > "$ARGS_FILE"
          add() { printf '%s\n' "$@" >> "$ARGS_FILE"; }

          add --name "$DEPLOY_NAME"
          add --location "$AZURE_LOCATION"
          if [ -n "${DEPLOY_SUB:-}" ]; then add --subscription "$DEPLOY_SUB"; fi
          add --template-file platform/fiab/bicep/main.bicep
          add --parameters platform/fiab/bicep/params/commercial.bicepparam
          add --parameters "location=$AZURE_LOCATION"
          add --parameters "purviewEnabled=$PURVIEW_ENABLED"
          add --parameters "azureMapsEnabled=$AZURE_MAPS_ENABLED"
          add --parameters "hubFirewallEnabled=$FIREWALL_ENABLED"
          add --parameters "deployAppsEnabled=$DEPLOY_APPS_ENABLED"
          add --parameters "skipRoleGrants=$SKIP_ROLE_GRANTS"
          # #3336 — arm the cross-subscription lake grant pass ONLY on a measured
          # "allowed". Passed unconditionally (as an explicit true/false) rather
          # than appended only when true: an omitted parameter falls back to the
          # bicep default, which is the same `false`, but then the DEPLOY LOG
          # would not record what was measured. `unknown` and `denied` both
          # render false here — the difference between them is in the probe's
          # printed reason, and collapsing them into one silent omission is how
          # "could not measure" becomes indistinguishable from "measured no".
          add --parameters "crossSubLakeGrantsEnabled=${CROSS_SUB_LAKE_GRANTS:-false}"
          echo "::notice::[lake-grants] crossSubLakeGrantsEnabled=${CROSS_SUB_LAKE_GRANTS:-false} (measured verdict: ${CROSS_SUB_LAKE_VERDICT:-not-run})"
          add --parameters "frontDoorEnabled=$FRONT_DOOR_ENABLED"
          add --parameters "existingVpnGatewayName=$EXISTING_VPN_GATEWAY_NAME"
          add --parameters "apimGatewayDnsLinkName=$APIM_DNS_LINK_NAME"
          add --parameters "adminEntraGroupId=$ADMIN_ENTRA_GROUP_ID"
          # ── BOOTSTRAP ADMIN BINDING (auto-bind-by-default.md §5) ───────────
          # loomTenantAdminGroupId MUST be passed EXPLICITLY. It cannot be left
          # to params/commercial.bicepparam, whose expression
          #     readEnvironmentVariable('LOOM_TENANT_ADMIN_GROUP_ID', adminEntraGroupId)
          # resolves `adminEntraGroupId` to the PARAM FILE's OWN value at bicep
          # COMPILE time — i.e. readEnvironmentVariable('LOOM_ADMIN_ENTRA_GROUP_ID','')
          # — and NOT to the `--parameters adminEntraGroupId=…` override on the
          # line above. Proven with `az bicep build-params` on an unset env:
          # the compiled paramfile emits loomTenantAdminGroupId='' as an
          # EXPLICIT value, which then beats the CLI override for the OTHER
          # parameter. Result before #3090: the console shipped with BOTH
          # LOOM_TENANT_ADMIN_GROUP_ID and LOOM_TENANT_ADMIN_OID empty and the
          # admin gate shut for EVERYONE — the live 2026-08-07 defect.
          #
          # The env var is exported as well so the paramfile's own
          # readEnvironmentVariable resolves to the same value rather than to
          # a silently different one (the two must never disagree).
          TENANT_ADMIN_GROUP="${INPUT_TENANT_ADMIN_GROUP_ID:-$ADMIN_ENTRA_GROUP_ID}"
          add --parameters "loomTenantAdminGroupId=$TENANT_ADMIN_GROUP"
          # The OID binding falls back to the FIAB_TENANT_ADMIN_OID repo variable
          # when no dispatch input is given (#3109). Without that fallback the
          # param renders empty on every routine deploy, and admin-plane/main.bicep
          # then computes
          #   effectiveTenantAdminOid = !empty(loomTenantAdminOid) ? ... :
          #                             (hasRealAdminGroup ? '' : deployer().objectId)
          # which BLANKS the binding precisely because an admin GROUP is configured.
          # That assumes the group path works — and it does not: the auth callback
          # never populates session.claims.groups (#3175), so isTenantAdmin() can
          # only ever match the OID. Group configured + OID blank = nobody has
          # admin, which is exactly what the live Commercial estate shipped.
          TENANT_ADMIN_OID="${INPUT_TENANT_ADMIN_OID:-$VAR_TENANT_ADMIN_OID}"
          if [ -n "${TENANT_ADMIN_OID:-}" ]; then
            add --parameters "loomTenantAdminOid=$TENANT_ADMIN_OID"
          fi
          # Fail CLOSED. A console rendered with no bootstrap-admin binding has
          # an admin gate that no one can pass — /admin/*, the onboarding queue,
          # Purview/DLP/label policy and every requireTenantAdmin route 403 for
          # every user, with no in-product way out (the gate Fix-it itself
          # needs admin.env-config at Admin). Shipping that is worse than not
          # shipping: refuse rather than deploy an unusable console. Only
          # asserted when apps are actually being rendered.
          #
          # #3109 — this used to test INPUT_TENANT_ADMIN_OID, the DISPATCH INPUT,
          # and not the OID that was actually composed. An estate bound solely by
          # the FIAB_TENANT_ADMIN_OID repo variable (no group, no dispatch input)
          # therefore refused a deploy whose binding was in fact present and
          # valid — the same "the assertion describes a different value than the
          # one composed" defect #3180 fixed one line below. It now tests the
          # resolved value, which is the one that reaches the container app.
          if [ "${DEPLOY_APPS_ENABLED}" = "true" ] \
             && [ -z "${TENANT_ADMIN_GROUP}" ] && [ -z "${TENANT_ADMIN_OID:-}" ]; then
            echo "::error::No bootstrap tenant-admin binding could be resolved, and this run renders the Container Apps (deployAppsEnabled=true). loom-console would come up with LOOM_TENANT_ADMIN_GROUP_ID and LOOM_TENANT_ADMIN_OID both empty, which shuts /admin/* for EVERY user with no in-product remedy. Set the FIAB_ADMIN_GROUP_ID repo variable (or secret) to your Loom admin security-group object id — 'az ad group show --group \"Loom Admins\" --query id -o tsv' — or dispatch this workflow with tenant_admin_group_id / tenant_admin_oid. Refusing."
            exit 1
          fi
          # R7 — this line must report what was ACTUALLY composed. It used to
          # test INPUT_TENANT_ADMIN_OID (the dispatch input), which #3180 stopped
          # being the whole story: the OID now falls back to the
          # FIAB_TENANT_ADMIN_OID repo variable. Measured on run 31409194897 —
          # the notice printed "oid=absent" on a run whose very next line added
          # `loomTenantAdminOid=<the repo variable>`. A status line that
          # contradicts the parameter it is describing is worse than none,
          # because this is the line an operator reads to decide whether admin
          # access will survive the deploy.
          echo "::notice::Bootstrap admin binding: group=$([ -n "$TENANT_ADMIN_GROUP" ] && echo present || echo absent), oid=$([ -n "${TENANT_ADMIN_OID:-}" ] && echo "present (source=$([ -n "${INPUT_TENANT_ADMIN_OID:-}" ] && echo dispatch-input || echo FIAB_TENANT_ADMIN_OID-repo-var))" || echo absent). Values redacted."
          # Keep the paramfile's OWN readEnvironmentVariable in agreement with
          # the explicit override above, so `az bicep build-params` on this
          # checkout (and the documented by-hand `-p params/commercial.bicepparam`
          # path in docs/fiab) resolves to the same binding rather than ''.
          echo "LOOM_ADMIN_ENTRA_GROUP_ID=$ADMIN_ENTRA_GROUP_ID" >> "$GITHUB_ENV"
          echo "LOOM_TENANT_ADMIN_GROUP_ID=$TENANT_ADMIN_GROUP"  >> "$GITHUB_ENV"
          # Hand the COMPOSED binding (not the raw inputs) to the principal-kind
          # refusal below, so what is classified is exactly what will be applied.
          # Recomputing them there would be a second copy of this resolution, and
          # a second copy is what drifted in #3022.
          echo "tenant_admin_oid=${TENANT_ADMIN_OID:-}"      >> "$GITHUB_OUTPUT"
          echo "tenant_admin_group=$TENANT_ADMIN_GROUP"      >> "$GITHUB_OUTPUT"
          # EXPLICIT if/else, not `A && B || C`. That idiom is not if-then-else:
          # when B fails, C still runs. It is safe here only because `echo` cannot
          # fail — which is exactly the reasoning that stops being true the next
          # time someone edits the middle branch (shellcheck SC2015).
          if [ -z "${TENANT_ADMIN_OID:-}" ]; then
            OID_SOURCE="unbound"
          elif [ -n "${INPUT_TENANT_ADMIN_OID:-}" ]; then
            OID_SOURCE="the tenant_admin_oid dispatch input"
          else
            OID_SOURCE="the FIAB_TENANT_ADMIN_OID repo variable"
          fi
          if [ -z "$TENANT_ADMIN_GROUP" ]; then
            GROUP_SOURCE="unbound"
          elif [ -n "${INPUT_TENANT_ADMIN_GROUP_ID:-}" ]; then
            GROUP_SOURCE="the tenant_admin_group_id dispatch input"
          else
            GROUP_SOURCE="the FIAB_ADMIN_GROUP_ID repo variable/secret"
          fi
          # Grouped redirect: individual `>>` per line is SC2129, and this block
          # writes several related outputs.
          {
            echo "tenant_admin_oid_source=$OID_SOURCE"
            echo "tenant_admin_group_source=$GROUP_SOURCE"
          } >> "$GITHUB_OUTPUT"
          # ADOPT THE LIVE VANITY DOMAIN, never pass '' over one that exists.
          #
          # `vanity_domain` is an OPTIONAL dispatch input with no default, so a
          # schedule (which carries no inputs) and any dispatch that leaves the
          # field blank both send ''. front-door.bicep then renders
          #     customDomains: empty(vanityDomain) ? [] : [ { id: … } ]
          # which BLANKS the route binding, and the edge answers SNI with the
          # fallback *.azureedge.net certificate — every browser refuses the
          # console on its real URL.
          #
          # Measured on run 31566892058 (2026-08-12): CSA_LOOM_VANITY_DOMAIN was
          # empty, the apply succeeded, and csa-loom.limitlessdata.ai went to
          # `subject=CN=*.azureedge.net` with route customDomains=0. Third
          # recurrence of the same outage.
          #
          # This is the pattern the internal token already uses immediately below
          # (#3056: "adopt, never re-mint — passing it empty on an estate that
          # already has one is what strands every other holder"). Same rule, same
          # reason: an out-of-band value the template does not carry must be READ
          # from the estate, not defaulted to empty.
          #
          # Discovery FAILS CLOSED: if the profile cannot be read we do not know
          # whether a domain is bound, and passing '' on an unknown is exactly the
          # move that caused the outage — so the run stops instead.
          if [ -z "${CSA_LOOM_VANITY_DOMAIN:-}" ]; then
            VD_ERR="$(mktemp)"
            ADMIN_RG="rg-csa-loom-admin-${AZURE_LOCATION}"
            FD_PROFILE="$(az afd profile list -g "$ADMIN_RG" --query "[0].name" -o tsv 2>"$VD_ERR" | tr -d '\r')"
            if [ -n "$FD_PROFILE" ]; then
              LIVE_VANITY="$(az afd custom-domain list --profile-name "$FD_PROFILE" -g "$ADMIN_RG" --query "[0].hostName" -o tsv 2>>"$VD_ERR" | tr -d '\r')"
              # The RESOURCE NAME too, not just the host. front-door.bicep derives
              # `replace(host, ".", "-")` = csa-loom-limitlessdata-ai, while this estate
              # names it csa-loom-limitlessdata. Front Door refuses a SECOND custom
              # domain for a host it has already claimed, so passing the host without
              # the name made every apply fail Conflict instead of reconciling (#3287).
              LIVE_VANITY_NAME="$(az afd custom-domain list --profile-name "$FD_PROFILE" -g "$ADMIN_RG" --query "[0].name" -o tsv 2>>"$VD_ERR" | tr -d '\r')"
              if [ -n "${LIVE_VANITY:-}" ]; then
                CSA_LOOM_VANITY_DOMAIN="$LIVE_VANITY"
                echo "::notice::Adopted the live vanity domain '$LIVE_VANITY' (no vanity_domain input was supplied). Passing '' here would have unbound it and taken the console offline on its real URL."
              else
                echo "::notice::Front Door profile '$FD_PROFILE' carries no custom domain — this estate has no vanity URL to preserve."
              fi
            elif [ -s "$VD_ERR" ]; then
              echo "::error::Could not read the Front Door profile in $ADMIN_RG to find out whether a vanity domain is bound: $(head -c 400 "$VD_ERR"). That is UNKNOWN, and passing an empty loomVanityDomain over a bound domain UNBINDS it. Refusing."
              exit 1
            fi
            rm -f "$VD_ERR"
          fi
          add --parameters "loomVanityDomain=$CSA_LOOM_VANITY_DOMAIN"
          if [ -n "${LIVE_VANITY_NAME:-}" ]; then
            add --parameters "loomVanityCustomDomainName=$LIVE_VANITY_NAME"
          fi
          # #3056 — adopt, never re-mint. Empty ONLY on a greenfield estate with
          # no console to read; passing it empty on an estate that already has
          # one is what re-mints the token and strands every other holder.
          if [ -n "${LOOM_INTERNAL_TOKEN:-}" ]; then
            add --parameters "loomInternalTokenValue=$LOOM_INTERNAL_TOKEN"
            echo "::notice::Adopting the estate's existing internal trust token (fingerprint $(printf '%s' "$LOOM_INTERNAL_TOKEN" | sha256sum | cut -c1-12)) — this deploy re-applies it rather than minting a new one (#3056)."
          else
            echo "::warning::No live internal trust token was resolved for this estate — bicep will MINT one on this deploy. That is correct for a greenfield install; on an estate that already has a console it means the adopt step could not read the secret, and every other holder (the consumer jobs, the LOOM_INTERNAL_TOKEN repo secret) will be stranded. Check the adopt step above before trusting this run."
          fi
          if [ -n "${CSA_LOOM_TOPOLOGY:-}" ]; then
            add --parameters "topology=$CSA_LOOM_TOPOLOGY"
          fi
          if [ -n "${CSA_LOOM_TARGET_SUBSCRIPTION:-}" ]; then
            add --parameters "targetSubscriptionId=$CSA_LOOM_TARGET_SUBSCRIPTION"
            add --parameters "attachDomainName=$CSA_LOOM_DLZ_DOMAIN_NAMES"
          fi
          if [ "${CSA_LOOM_TOPOLOGY:-}" = "dlz-attach" ]; then
            # dlz-attach: the cross-sub hub coordinates discovered above, so the
            # hub-side peering + hub-console-env modules (and the DLZ RBAC
            # grants) target the HUB sub, not the deployment (DLZ) sub.
            add --parameters "hubAdminSubscriptionId=$HUB_ADMIN_SUB"
            add --parameters "hubVnetId=$HUB_VNET_ID"
            add --parameters "hubConsolePrincipalId=$HUB_UAMI_PRINCIPAL"
            add --parameters "hubConsoleUamiName=$HUB_UAMI_NAME"
            add --parameters "hubConsoleUamiAppId=$HUB_UAMI_CLIENT"
            add --parameters "hubConsoleUamiId=$HUB_UAMI_ID"
            # #2682 — the hub ACR / CAE / Key Vault coordinates for the hub-side
            # S3 gateway. Appended ONLY when discovery found them, so a hub whose
            # topologyManifest predates #2682 still attaches (the gateway is then
            # skipped and honest-gates — never a public-registry fallback, the
            # module has no such branch). Written as `if` blocks rather than
            # `[ -n x ] && …`: the && form is an SC2015 trap and its exit status
            # leaks into the step under `set -e`, which is why it needed a
            # trailing `true`. An if-block needs no such crutch.
            #
            # They live HERE, in the ONE composition, and not in the two az
            # commands (refs #3022). #3067 added them to the what-if AND the
            # apply as two hand-maintained copies — which is the shape that let
            # `--subscription` drift between preview and apply in the first
            # place. Composed once, they are covered by the sha256 both commands
            # re-assert, so the preview provably includes them.
            if [ -n "${HUB_ACR_LOGIN:-}" ]; then add --parameters "hubAcrLoginServer=$HUB_ACR_LOGIN"; fi
            if [ -n "${HUB_CAE_ID:-}" ];    then add --parameters "hubCaeId=$HUB_CAE_ID"; fi
            if [ -n "${HUB_KV_ID:-}" ];     then add --parameters "hubKeyVaultId=$HUB_KV_ID"; fi
          fi

          SHA=$(sha256sum "$ARGS_FILE" | cut -d' ' -f1)
          echo "deploy_args_file=$ARGS_FILE" >> "$GITHUB_OUTPUT"
          echo "deploy_args_sha256=$SHA"     >> "$GITHUB_OUTPUT"
          echo "DEPLOY_NAME=$DEPLOY_NAME"    >> "$GITHUB_ENV"
          echo "::notice::Composed $(grep -c . "$ARGS_FILE") deployment argument(s); sha256=$SHA. The what-if and the apply expand THIS file — there is no second copy to drift (#3022)."
          echo "Bicep parameters in this deployment (values redacted — adminEntraGroupId is a secret):"
          sed -n 's/^\([A-Za-z][A-Za-z0-9]*\)=.*/  \1=<redacted>/p' "$ARGS_FILE"

      # ── THE BOUND ADMIN MUST BE A HUMAN ADMIN (#3109) ─────────────────────
      #
      # Composing a binding is not the same as composing a WORKING one. Every
      # wrong shape fails identically to a right one — the container app comes
      # up with LOOM_TENANT_ADMIN_OID / _GROUP_ID set, /admin/readiness reports
      # the binding present, and no human can pass the gate:
      #
      #   * a SERVICE PRINCIPAL oid — what admin-plane/main.bicep produced on
      #     every CI run while it fell back to deployer().objectId, because CI
      #     logs in as an SP. A workload identity cannot sign in interactively,
      #     so the bypass belongs to a principal that can never use it.
      #   * a GROUP oid in the OID slot (or a user oid in the GROUP slot) —
      #     feature-gate.ts matches the oid against session.claims.oid and the
      #     group against session.claims.groups; neither ever crosses over.
      #   * a comma-separated OID — compared with === against the whole string.
      #
      # The classification is Microsoft Graph's own @odata.type, read through
      # the ACTIVE cloud's Graph endpoint (az cloud show), so the same step is
      # correct in a sovereign boundary. It fails closed on an unresolved read
      # and on an empty population: an unknown binding is the state that
      # shipped the outage, and "0 violations because nothing was checked" is
      # the guard class this repo keeps finding inside its own guards.
      #
      # Runs BEFORE the what-if — a refusal must cost seconds, not an hour of
      # provisioning, and nothing has reached ARM at this point.
      #
      # DOES THIS CREDENTIAL HAVE THE DIRECTORY READ? Measured, not assumed: on
      # csa-loom-post-deploy-bootstrap run 31239422563 (2026-08-08), logging in
      # with this same secrets.AZURE_CLIENT_ID, `az ad sp list --filter "appId
      # eq '00000003-…'"` returned the Microsoft Graph SP object id — a Graph
      # directory read that succeeded. If this step ever reports a REFUSED read,
      # that is the permission to restore (Directory.Read.All application
      # permission, or the Directory Readers role, on the deploy SP); the step
      # says so in its own message rather than guessing a principal type.
      - name: Bootstrap admin binding is a HUMAN admin (rejects a service-principal oid — #3109)
        env:
          TENANT_ADMIN_OID: ${{ steps.params.outputs.tenant_admin_oid }}
          TENANT_ADMIN_OID_SOURCE: ${{ steps.params.outputs.tenant_admin_oid_source }}
          TENANT_ADMIN_GROUP_ID: ${{ steps.params.outputs.tenant_admin_group }}
          TENANT_ADMIN_GROUP_SOURCE: ${{ steps.params.outputs.tenant_admin_group_source }}
          DEPLOY_APPS_ENABLED: ${{ steps.reconcile.outputs.deploy_apps_enabled }}
          DEPLOY_LANE: .github/workflows/deploy-fiab-commercial.yml
        run: node scripts/ci/bootstrap-admin-principal.mjs

      - name: Bicep what-if (preview)
        id: whatif
        env:
          ARGS_FILE: ${{ steps.params.outputs.deploy_args_file }}
          ARGS_SHA: ${{ steps.params.outputs.deploy_args_sha256 }}
        run: |
          set -euo pipefail
          HAVE=$(sha256sum "$ARGS_FILE" | cut -d' ' -f1)
          if [ "$HAVE" != "$ARGS_SHA" ]; then
            echo "::error::The composed deployment arguments changed between composition and the what-if (expected $ARGS_SHA, found $HAVE). A preview of arguments other than the ones that will be applied is worse than no preview. Refusing."
            exit 1
          fi
          echo "::notice::what-if previewing deployment arguments sha256=$HAVE (identical to the apply)."
          mapfile -t DEPLOY_ARGS < "$ARGS_FILE"
          az deployment sub what-if "${DEPLOY_ARGS[@]}"

      # ── IMAGE PREFLIGHT (refs #2958) ──────────────────────────────────────
      # THE FOOTGUN THIS CLOSES. This deploy is subscription-scoped and ADOPTS
      # every app already running in the live estate. The reconcile step above
      # pins LOOM_<APP>_TAG for each app it found RUNNING, but an app that does
      # NOT exist yet gets no pin and falls back to the paramfile default
      # ('v0.1'; 'v1' for mapsTiles). On the live Commercial estate 2026-08-04
      # that is FIVE of seventeen — loom-orchestrator, loom-copilot-maf,
      # loom-maps-tileserver, loom-duckdb, loom-risingwave — none of which has
      # ever been proven to exist in the registry. Deploying anyway creates five
      # Container Apps that can never pull, fails the nested deployment, and
      # takes the surrounding (live-estate-adopting) deployment down with it.
      #
      # deploy-fiab-gcch.yml and deploy-fiab-il5.yml have preflighted since
      # #2640 — but only `loom-duckdb`, one hard-coded ref that structurally
      # cannot notice the other four. This lane preflighted NOTHING. The ref set
      # is now DERIVED from reconcile-policy.mjs's APP_IMAGE_TAGS plus the
      # paramfile's readEnvironmentVariable defaults, so adding an app or moving
      # a default carries the guard with it.
      #
      # Every ref is checked, pinned ones included: a pinned tag is running, so
      # it should be present, and one extra read per app is cheap insurance
      # against a registry purge or an untagged manifest.
      #
      # --lease: tag enumeration is an ACR DATA-plane call and this is a hosted
      # runner, so the registry (publicNetworkAccess=Disabled) is unreachable
      # without the shared firewall lease (#2603) that the build lanes use. The
      # script releases it on exit. For an ad-hoc probe with no firewall change
      # at all, dispatch loom-aca-runner-smoke.yml — it runs in-VNet.
      #
      # --skip-if-registry-absent keeps the genuine FROM-SCRATCH path working:
      # no ACR yet means nothing live to adopt, and the two-phase image path
      # (no-vaporware.md) builds the registry contents in the next phase. A
      # registry that EXISTS but cannot be read still fails — "I could not prove
      # it" is not a pass.
      - name: Image preflight — ACR must already hold every referenced tag
        if: github.event_name == 'schedule' || inputs.run_mode == 'full'
        run: |
          set -uo pipefail
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          DEPLOY_SUB="${{ steps.topology_guard.outputs.deploy_sub }}"
          # R7 (#3090): the discovery read is CAPTURED, not discarded. This was
          # `2>/dev/null | tr -d '\r'` followed by `[ -z "$ACR" ] && exit 0`,
          # which collapsed an RBAC denial, a throttle, an unselected
          # subscription and a genuinely-empty resource group into the same
          # empty string — and then stated "from-scratch deploy, nothing live to
          # adopt" as FACT and SKIPPED the whole image gate with exit 0. That is
          # the fail-OPEN twin of the false-MISSING defect: on a scheduled
          # deploy against the LIVE estate, an unreadable control plane silently
          # disabled the preflight entirely.
          #
          # `az acr list` on a resource group that does not exist EXITS NON-ZERO
          # (ResourceGroupNotFound); an existing-but-empty RG exits 0 with `[]`.
          # So the two facts are genuinely distinguishable and are now kept apart.
          set +e
          ACR_OUT=$(az acr list -g "$RG" ${DEPLOY_SUB:+--subscription "$DEPLOY_SUB"} \
                      --query "[?starts_with(name,'acrloom')]|[0].name" -o tsv 2>&1)
          ACR_RC=$?
          set -e
          if [ $ACR_RC -ne 0 ]; then
            if node scripts/ci/deploy-classify.mjs --text "$ACR_OUT" \
                 --assert-signal config.resource-group-not-found >/dev/null 2>&1; then
              echo "::notice::image-preflight: ARM answered ResourceGroupNotFound for $RG — this is a from-scratch deploy with no live estate to adopt. Skipping (the two-phase image path creates it next)."
              exit 0
            fi
            echo "::error::image-preflight: could NOT enumerate registries in $RG, so it is NOT established whether this estate has an ACR — and nothing whatsoever is established about the image tags this deploy will pull. Refusing to treat an unreadable control plane as 'from-scratch, nothing to adopt' and skip the gate. $(node scripts/ci/deploy-classify.mjs --text "$ACR_OUT" --query)"
            exit 1
          fi
          ACR=$(printf '%s' "$ACR_OUT" | tr -d '\r' | head -1)
          [ "$ACR" = "None" ] && ACR=""
          if [ -z "$ACR" ]; then
            echo "::notice::image-preflight: ARM ANSWERED and $RG contains no acrloom* registry — from-scratch deploy, nothing live to adopt. Skipping."
            exit 0
          fi
          # reconcile-resolve.mjs exported the running pins into $GITHUB_ENV, so
          # they are in this step's environment and the resolver sees them.
          # --boundary commercial drops the two refs this template provably does
          # NOT pull here (the dead `orchestrator` key and the Gov-only maps tile
          # server); both are printed as NOT ASSERTED rather than dropped
          # silently. Asserting them would be a false failure, and a guard that
          # cries wolf is a guard that gets switched off.
          REFS=$(node scripts/ci/resolve-image-preflight-refs.mjs \
                   --param-file platform/fiab/bicep/params/commercial.bicepparam \
                   --boundary commercial | tr '\n' ' ')
          # shellcheck disable=SC2086
          bash scripts/ci/assert-acr-image-tags.sh --acr "$ACR" --rg "$RG" --lease \
            --skip-if-registry-absent $REFS

      # BROWNFIELD: ADOPT OR FAIL CLEARLY, never collide (refs #3039,
      # deploy-integrity.md R5/R6).
      #
      # Azure permits a VNet at most ONE Private DNS zone link per namespace. On
      # run 31069329802 the hub VNet was already linked to a `privatelink.
      # azuredatabricks.net` zone left in the DLZ resource group by a superseded
      # design, so admin-plane/network.bicep's own link could never be created
      # and the whole subscription deploy died on a raw ARM BadRequest 20+
      # minutes in. A raw ARM error reaching the operator is an R6 violation.
      #
      # This names the owning zone BEFORE the deploy starts, and points at the
      # ordered, idempotent migration that adopts the namespace without taking
      # DNS resolution down. It has three outcomes and only one of them is a
      # pass: an estate it could not READ exits 3 and fails the job, because a
      # failed read establishes nothing about whether a conflict exists.
      #
      # Greenfield is unaffected: a hub VNet that does not exist yet has no
      # links, so `az network vnet show` returns nothing and the step reports
      # that there is nothing to check rather than inventing a conflict.
      - name: Private DNS link preflight (adopt or fail clearly — deploy-integrity R5)
        if: github.event_name == 'schedule' || inputs.run_mode == 'full'
        run: |
          set -euo pipefail
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          DEPLOY_SUB="${{ steps.topology_guard.outputs.deploy_sub }}"
          # R7: the read's failure is CAPTURED, not discarded. An empty id from a
          # denied read and an empty id from a genuinely absent VNet are
          # different facts and are reported as different facts.
          set +e
          HUB_OUT=$(az network vnet show -g "$RG" -n "vnet-csa-loom-hub-${AZURE_LOCATION}" \
                      ${DEPLOY_SUB:+--subscription "$DEPLOY_SUB"} --query id -o tsv 2>&1)
          HUB_RC=$?
          set -e
          if [ $HUB_RC -ne 0 ]; then
            if node scripts/ci/deploy-classify.mjs --text "$HUB_OUT" --assert-signal config.resource-not-found >/dev/null; then
              echo "::notice::dns-preflight: ARM answered ResourceNotFound for the hub VNet — this is a from-scratch deploy, so there are no links to conflict with. Nothing to check."
              exit 0
            fi
            echo "::error::dns-preflight: the hub VNet could not be READ, so it is NOT known whether a conflicting private DNS link exists. $(node scripts/ci/deploy-classify.mjs --text "$HUB_OUT" --query)"
            exit 1
          fi
          HUB_ID=$(echo "$HUB_OUT" | tr -d '\r')
          node scripts/csa-loom/preflight-private-dns-links.mjs \
            --hub-vnet-id "$HUB_ID" \
            --zone-rg "$RG" \
            ${DEPLOY_SUB:+--zone-subscription "$DEPLOY_SUB"}

      # ── THE APPLY WRITES THE REGISTRY, SO IT MUST HOLD THE LEASE (#3676) ──
      #
      # `az deployment sub create` submits a template that CARRIES
      # Microsoft.ContainerRegistry/registries/<acr>. An ARM resource PUT
      # re-asserts publicNetworkAccess and REPLACES the resource's tags — and
      # the #2603 firewall lease IS four ARM tags on that resource. So the apply
      # writes, unarbitrated, exactly the state the lease exists to arbitrate.
      #
      # MEASURED, 2026-08-17 (all times UTC, all from run logs):
      #   07:05:39  this workflow's own what-if printed, for the registry:
      #               - tags.loomAcrFwExpiresEpoch / HolderUrl / Owner / SinceUtc
      #               ~ properties.networkRuleSet.defaultAction "Deny" => "Allow"
      #   07:09:09  the apply starts
      #   07:11:16  build run 32004290228 takes the lease, TTL 120m, opens ACR
      #   07:17:06  last successful push (loom-mirroring)
      #   07:17:23  first `denied: client with IP ... is not allowed access`
      #   07:23:58  the apply finishes
      #   07:35:07  that build's OWN release reads the owner as 'none'
      # Five of six images never shipped. The lease did NOT expire (96 minutes
      # were left) and no lane released it under the holder (the roll's last
      # release was 07:10:43, this workflow's was 07:09:07). The apply erased it.
      #
      # THE MUTEX IS CLAIM-ONLY. This run is not pushing, so it must not make the
      # registry public for a quarter of an hour; `--no-open` takes the lease and
      # leaves the firewall exactly as it is.
      #
      # THE BUILD WINS TIES, DELIBERATELY. A bounded wait that expires FAILS this
      # step, before the apply, naming the holder run. A nightly reconcile that
      # skips a night costs nothing and runs again tomorrow; six image builds
      # destroyed at minute 20 cost a merge. The wait is short (default 8m
      # against the lease's own 25m default) because a build holds for up to
      # 120m and waiting most of that out would burn a runner to no purpose.
      #
      # THE TTL IS SHORT. 45m covers an apply that has historically taken ~15m
      # with room for the retry classes deploy-retry.mjs allows, and bounds how
      # long a crashed reconcile can block the build lane. A crash is also swept
      # by acr-firewall-sweeper.yml.
      #
      # WHAT THIS DOES NOT FIX: the apply still DELETES the loomAcrFw* tags,
      # because the fix for that is in the ACR bicep module (it must carry the
      # tags, or stop managing tags on that resource) and this lane cannot reach
      # it. Holding the mutex means nobody is relying on those tags while they
      # are wiped, which removes the harm; the wipe itself is tracked separately.
      - name: Take the ACR firewall lease for the apply (claim-only — #3676)
        id: acr_apply_lease
        if: github.event_name == 'schedule' || inputs.run_mode == 'full'
        env:
          DEPLOY_SUB: ${{ steps.topology_guard.outputs.deploy_sub }}
          GH_TOKEN: ${{ github.token }}
          LOOM_ACR_LEASE_TTL_MINUTES: '45'
          LOOM_ACR_LEASE_WAIT_MINUTES: '8'
        run: |
          set -uo pipefail
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          ACR_ERR="$RUNNER_TEMP/acr-apply-lease.err"
          : > "$ACR_ERR"
          set +e
          ACR=$(az acr list -g "$RG" ${DEPLOY_SUB:+--subscription "$DEPLOY_SUB"} \
                  --query "[?starts_with(name,'acrloom')]|[0].name" -o tsv 2> "$ACR_ERR")
          ACR_RC=$?
          set -e
          ACR="$(printf '%s' "$ACR" | tr -d '\r')"
          ACR="${ACR%%$'\n'*}"
          [ "$ACR" = "None" ] && ACR=""

          if [ $ACR_RC -ne 0 ]; then
            DETAIL="$(tr '\n' ' ' < "$ACR_ERR")"
            if node scripts/ci/deploy-classify.mjs --text "${DETAIL:0:400}" \
                 --assert-signal config.resource-group-not-found > /dev/null; then
              echo "::notice::acr-apply-lease: ARM answered ResourceGroupNotFound for ${RG} — from-scratch deploy, there is no registry to arbitrate over yet."
              echo "held=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::acr-apply-lease: could NOT enumerate registries in ${RG}, so it is NOT established whether this apply is about to rewrite a registry that another run is pushing to. Refusing rather than repeating #3676. Detail: ${DETAIL:0:400}"
            exit 1
          fi
          if [ -z "$ACR" ]; then
            echo "::notice::acr-apply-lease: ARM ANSWERED and ${RG} holds no acrloom* registry — nothing to arbitrate."
            echo "held=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "acr=$ACR" >> "$GITHUB_OUTPUT"
          # No `|| true`, no `2>/dev/null`: a lease this run could not take is a
          # refusal, and the script's own message names the holder and its URL.
          bash scripts/csa-loom/acr-firewall-lease.sh acquire --acr "$ACR" --no-open \
            ${DEPLOY_SUB:+--subscription "$DEPLOY_SUB"}
          echo "held=true" >> "$GITHUB_OUTPUT"

      # ── I-FRESH — RE-MEASURE THE RUNNING IMAGES, SECONDS BEFORE THE APPLY ──
      #
      # THE INCIDENT (#3676, measured 2026-08-17). `Resolve reconcile target`
      # reads the tag every Container App is running and pins appImageTags to
      # it, so the ARM PUT is a no-op for the image. That read was CORRECT. It
      # was just taken SIXTEEN MINUTES before it was used, and loom-roll-and-
      # validate.yml writes the same field:
      #
      #   07:03:40  [reconcile] PIN console loom-console:587ac3b8…  <- true then
      #   07:10:56  revision 0000755 — loom-console:b9ca620b…       <- the roll
      #   07:19:48  revision 0000756 — loom-console:587ac3b8…       <- this apply
      #   07:27:26  deploy-fiab-commercial: SUCCESS
      #
      # A merged, rolled, cosign-verified, UAT-validated security fix (PR #3665,
      # GHSA-v2g8-gp3r-rg4r) was reverted off production nine minutes after it
      # went live, and both lanes reported success. The same shape is on record
      # two days earlier: run 31870181337 pinned 8f8e569a at 06:44:38, roll
      # 31870718201 moved the console to 2dda97b4, and this workflow's own
      # deployment outputs at 07:26:33 record `"console": "8f8e569a…"`.
      #
      # WHY RE-PIN RATHER THAN REFUSE. Rolls land roughly once every 70 minutes
      # and this job's read->apply window is ~20 of them, so refusing would
      # redden the nightly reconcile about one night in three — and a guard that
      # cries wolf is a guard that gets switched off. Re-pinning is also the
      # SAFER write: the tag it applies is one the estate is running right now,
      # which is a stronger guarantee than the image preflight's "the tag is in
      # ACR". It refuses only on the two states it genuinely cannot resolve — an
      # unreadable estate, and a key that was pinned and has become UNKNOWN.
      #
      # WHY THIS CAN RE-PIN AT ALL, THIS LATE. `commercial.bicepparam` resolves
      # `readEnvironmentVariable('LOOM_CONSOLE_TAG', 'v0.1')` when `az deployment
      # sub create` COMPILES it — not when the args file was composed. So a
      # $GITHUB_ENV write here reaches the apply while `deploy_args_file` stays
      # byte-identical and its sha256 assertion below still holds. The what-if
      # previewed the EARLIER tag for the image fields; that is stated in the log
      # rather than glossed, because applying the earlier tag is the defect.
      #
      # IT DOES NOT CLOSE THE WINDOW, and does not claim to: a roll can still
      # land while ARM is mid-apply. `Estate must not be BEHIND the last roll`
      # below is what NOTICES that, which is the half #3676 says matters most.
      # The step is named "narrows", not "closes", for that reason — an earlier
      # draft was named "closes the roll race" while the paragraph above it
      # correctly said it does not.
      #
      # IT RUNS *AFTER* THE ACR LEASE STEP, AND THAT ORDER IS LOAD-BEARING.
      # With the re-pin first, the lease's bounded wait (up to 8 minutes) sat
      # BETWEEN the measurement and the apply — and the lane it waits for is the
      # roll lane, i.e. exactly the writer that invalidates the measurement. In
      # roll run 32004219673 the lease release and the image write are the same
      # second:
      #     07:10:43.9909  released the ACR firewall lease ... VERIFIED re-locked
      #     07:10:43.9960  Run az containerapp update -n loom-console ...
      # So the old order could measure, wait up to 8 minutes for precisely the
      # lane about to write, and then apply the pin that lane had just
      # invalidated — a gap POSITIVELY CORRELATED with the race it exists to
      # narrow. Taking the lease first makes the wait happen before the
      # measurement instead of after it. Nothing is lost: the lease step
      # consumes no output from this one.
      #
      # Decision logic + tests: scripts/ci/reconcile-policy.mjs
      # (decidePinRefresh / comparePins) and __tests__/roll-race.test.mjs.
      - name: Re-pin appImageTags to the RUNNING images (narrows the roll race — #3676)
        id: repin
        if: github.event_name == 'schedule' || inputs.run_mode == 'full'
        env:
          DEPLOY_APPS_ENABLED: ${{ steps.reconcile.outputs.deploy_apps_enabled }}
          HUB_PRESENT: ${{ steps.reconcile.outputs.hub_present }}
          DEPLOY_SUB: ${{ steps.topology_guard.outputs.deploy_sub }}
        run: |
          set -uo pipefail
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          CONTAINERS="$RUNNER_TEMP/repin-containers.json"
          LIST_ERR="$RUNNER_TEMP/repin-list.err"

          # Truncation is done with parameter expansion, never `| head -c`.
          # GitHub runs `run:` under `bash -e`, and `pipefail` is set above, so
          # `cmd | head -c N` kills `cmd` with SIGPIPE on any input longer than
          # N and takes the whole STEP down — a guard that aborts on the error
          # path it exists to report is a guard that never reports.
          trim400() { local s; s="$(tr '\n' ' ' < "$1")"; printf '%s' "${s:0:400}"; }

          # The measurement timestamp is recorded BEFORE the read, so the
          # post-apply gate's "did a roll finish after we measured?" window is
          # never narrower than the truth. An over-inclusive window costs one
          # extra comparison; an under-inclusive one hides the incident.
          MEASURED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "measured_at=$MEASURED_AT" >> "$GITHUB_OUTPUT"

          if [ "${HUB_PRESENT}" != "true" ]; then
            echo "::notice::pin-refresh: ${RG} does not exist, so no Container App is running and no pin can be stale. This is a from-scratch install; the apply CREATES the apps."
            printf '[]' > "$CONTAINERS"
            node scripts/ci/reconcile-policy.mjs pin-refresh \
              --deploy-apps-enabled "$DEPLOY_APPS_ENABLED" --containers "$CONTAINERS"
            exit $?
          fi

          # stdout and stderr are captured SEPARATELY, never merged and never
          # discarded: `2>&1` would splice az's warnings into the JSON, and
          # `2>/dev/null` is what once turned a permission denial into an empty
          # string and then into a false claim (deploy-integrity R7, #3090).
          set +e
          az containerapp list -g "$RG" ${DEPLOY_SUB:+--subscription "$DEPLOY_SUB"} \
            --query '[].{name:name, image:properties.template.containers[0].image}' \
            -o json > "$CONTAINERS" 2> "$LIST_ERR"
          LIST_RC=$?
          set -e
          if [ $LIST_RC -ne 0 ]; then
            node scripts/ci/reconcile-policy.mjs pin-refresh \
              --deploy-apps-enabled "$DEPLOY_APPS_ENABLED" \
              --read-error "az containerapp list exited ${LIST_RC}: $(trim400 "$LIST_ERR")"
            exit $?
          fi
          if [ -s "$LIST_ERR" ]; then
            echo "::warning::pin-refresh: az wrote to stderr while SUCCEEDING; recording it rather than hiding it: $(trim400 "$LIST_ERR")"
          fi
          node scripts/ci/reconcile-policy.mjs pin-refresh \
            --deploy-apps-enabled "$DEPLOY_APPS_ENABLED" --containers "$CONTAINERS"

      - name: Provision (idempotent)
        id: provision
        if: github.event_name == 'schedule' || inputs.run_mode == 'full'
        env:
          ARGS_FILE: ${{ steps.params.outputs.deploy_args_file }}
          ARGS_SHA: ${{ steps.params.outputs.deploy_args_sha256 }}
        run: |
          set -e
          # az deployment sub create — directly provisions Bicep. azd up
          # would also need pre-built container images for the service
          # deploy phase, which we don't have in CI yet (PRP-16 builds
          # them). Infra-only validates the entire Bicep stack end-to-end.
          #
          # THE ARGUMENTS ARE NOT RESTATED HERE (refs #3022). They are the
          # SAME FILE the what-if expanded — including the dlz-attach hub
          # coordinates, the topology, and the `--subscription` the topology
          # guard resolved. The two commands used to be two hand-maintained
          # copies and had already drifted on `--subscription`. The sha256 is
          # re-asserted so that even a rewrite between the preview and the
          # apply is caught rather than assumed away.
          DEPLOY_SUB="${{ steps.topology_guard.outputs.deploy_sub }}"
          HAVE=$(sha256sum "$ARGS_FILE" | cut -d' ' -f1)
          if [ "$HAVE" != "$ARGS_SHA" ]; then
            echo "::error::The composed deployment arguments changed after the what-if previewed them (expected $ARGS_SHA, found $HAVE). The preview no longer describes this apply. Refusing."
            exit 1
          fi
          echo "::notice::Applying deployment arguments sha256=$HAVE — byte-identical to the set the what-if previewed."
          mapfile -t DEPLOY_ARGS < "$ARGS_FILE"
          # RETRY WITH CLASSIFICATION + PLATFORM REMEDIATION (deploy-integrity R6).
          #
          # This ran bare: no retry, no classification, no post-failure triage.
          # A 429, a DeploymentActive from a concurrent run, or an Entra
          # replication lag on a UAMI created seconds earlier all killed the
          # whole subscription deploy outright. deploy-retry.mjs retries ONLY
          # those classes, fails closed on exhaustion, and --remediate lets the
          # platform register a missing resource provider itself and try once
          # more (auto-bind-by-default.md 5) rather than printing an instruction.
          #
          # --arm-deployment: DRILL INTO the failed deployment operations on
          # failure (refs #3039). On run 31069329802 this step failed and the
          # classifier reported, correctly, that it could not classify the
          # failure — because `az deployment sub create` writes the bicep
          # linter's ~200 warnings to stderr and the ARM error itself is
          # content-free ("At least one resource deployment operation failed").
          # The two real causes (an overlapping-namespace private DNS link and a
          # RoleAssignmentExists) were two levels below that, reachable only by
          # listing the operations, which had to be done by hand. The drill-down
          # is FAIL-CLOSED: only a leaf it actually read is fed to the
          # classifier, so an unreadable drill-down leaves the run exactly as
          # red and exactly as honest as it was.
          # --class-allow includes `capacity` (D6, run 31100384405): ARM's own
          # CapacityNotAvailable text says "Please retry after some time", and
          # the taxonomy gives that class a 300s backoff which deploy-retry
          # honors over the 45s base. Classification is PER ARM LEAF — a
          # deterministic leaf still fails fast, and its refusal names any
          # retryable leaves it is blocking.
          node scripts/ci/deploy-retry.mjs \
            --class-allow transient,eventual-consistency,capacity \
            --max-attempts 4 --backoff 45 --jitter 0.3 --wall-clock 120m \
            --step "az deployment sub create ($CSA_LOOM_TOPOLOGY)" \
            --artifact "$GITHUB_WORKSPACE/deploy-failure.json" \
            --remediate \
            --arm-deployment "$DEPLOY_NAME" --arm-scope sub \
            ${DEPLOY_SUB:+--arm-subscription "$DEPLOY_SUB"} \
            -- az deployment sub create "${DEPLOY_ARGS[@]}"
          # R7: the console URL read used to be `2>/dev/null || echo ""`, so a
          # failed read printed "Console URL (VNet-internal): " with nothing
          # after it and the run still went green. Say which it is.
          set +e
          URL_OUT=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.consoleUrl.value" -o tsv 2>&1)
          URL_RC=$?
          set -e
          if [ $URL_RC -ne 0 ]; then
            echo "::error::The deployment SUCCEEDED but its outputs could not be read, so the console URL is unknown - it is NOT known to be absent. $(node scripts/ci/deploy-classify.mjs --text "$URL_OUT" --query)"
            exit 1
          fi
          CONSOLE_URL=$(echo "$URL_OUT" | tr -d '\r')
          echo "console_url=$CONSOLE_URL" >> "$GITHUB_OUTPUT"
          echo "deploy_name=$DEPLOY_NAME" >> "$GITHUB_OUTPUT"
          if [ -z "$CONSOLE_URL" ]; then
            echo "::warning::The deployment outputs were read and consoleUrl is empty. For topology=dlz-attach that is expected (a DLZ stamps no console); for tenant/single-sub it means the console output was not produced."
          else
            echo "::notice::Console URL (VNet-internal): $CONSOLE_URL"
          fi

      # Released the moment the apply is done, so the build lane waits minutes
      # rather than the full TTL. `always()` because a FAILED apply has written
      # the registry just as surely as a successful one, and the mutex must not
      # outlive the writer. The script exits non-zero when it cannot VERIFY the
      # registry locked (C24/#3088) and that failure is NOT swallowed here —
      # `|| true` on this line would restore a green step over a publicly
      # reachable registry.
      - name: Release the ACR firewall lease taken for the apply (#3676)
        if: always() && steps.acr_apply_lease.outputs.held == 'true'
        env:
          DEPLOY_SUB: ${{ steps.topology_guard.outputs.deploy_sub }}
          ACR: ${{ steps.acr_apply_lease.outputs.acr }}
        run: |
          set -uo pipefail
          bash scripts/csa-loom/acr-firewall-lease.sh release --acr "$ACR" \
            ${DEPLOY_SUB:+--subscription "$DEPLOY_SUB"}

      # ── ACR COMPLIANCE TAGS — APPLIED HERE, NOT BY THE TEMPLATE (#3714) ────
      #
      # The admin-plane ACR is the ONE resource whose ARM tags are written by
      # something other than the deployment: acr-firewall-lease.sh records the
      # firewall mutex there (`loomAcrFw*`) because the ARM control plane stays
      # reachable when the registry's data plane is firewalled off. Both
      # declarative options for compliance tags were tried and both shipped
      # broken:
      #
      #   #3676  `tags: complianceTags` on the registry — ARM PUTs top-level
      #          tags as an absolute REPLACE, erasing the live lease mid-apply
      #          and denying an in-flight `az acr build` push (8-minute outage).
      #   #3714  a `Microsoft.Resources/tags` resource that read its own current
      #          value — its scope expression IS its own resource id, so ARM
      #          rejected the whole template with "Circular dependency detected"
      #          and EVERY Commercial `az deployment sub create` failed.
      #
      # `az tag update --operation Merge` is a server-side PATCH: it adds the
      # compliance keys and touches nothing else, so it cannot clobber a lease
      # and has no read-then-write window on our side.
      #
      # RESOLVES THE REGISTRY ITSELF rather than reusing
      # `steps.acr_apply_lease.outputs.acr`: that step runs BEFORE Provision, so
      # on a greenfield subscription it found no registry at all — which is
      # precisely the run where the tags are missing and this step matters most.
      #
      # NOT `|| true`, and no discarded stderr. The script verifies by reading
      # the tags back (a 0 from `az tag update` means "accepted", not "applied"
      # — that distinction caught a real CR-corruption bug on 2026-08-18) and
      # fails the deploy if the registry is not actually tagged, or if the
      # firewall-lease key set changed across the merge.
      - name: Apply ACR compliance tags (merge-patch, out-of-band — #3714)
        if: steps.provision.conclusion == 'success'
        env:
          DEPLOY_SUB: ${{ steps.topology_guard.outputs.deploy_sub }}
        run: |
          set -uo pipefail
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          ACR_ERR="$RUNNER_TEMP/acr-tag-resolve.err"
          : > "$ACR_ERR"
          ACR=$(az acr list -g "$RG" ${DEPLOY_SUB:+--subscription "$DEPLOY_SUB"} \
                  --query "[?starts_with(name,'acrloom')]|[0].name" -o tsv 2> "$ACR_ERR" | tr -d '\r')
          ACR_RC=$?
          # R7 — do not assert a cause the code did not establish. A non-zero
          # `az` and an empty result are DIFFERENT facts and get different
          # messages; collapsing "I could not look" into "there is none" is the
          # exact substitution deploy-integrity R7 exists to forbid.
          if [ "$ACR_RC" -ne 0 ]; then
            echo "::error::Could not LIST registries in $RG (az exited $ACR_RC), so whether this estate has an ACR to tag is UNKNOWN. Raw stderr:"
            sed -n '1,20p' "$ACR_ERR" >&2
            exit 1
          fi
          if [ -z "$ACR" ]; then
            echo "::error::Provision succeeded but no 'acrloom*' registry exists in $RG. The admin-plane ACR is not optional; a successful apply that produced none means the template did not deploy what this lane assumes."
            exit 1
          fi
          bash scripts/csa-loom/apply-acr-compliance-tags.sh \
            --acr "$ACR" \
            ${DEPLOY_SUB:+--subscription "$DEPLOY_SUB"} \
            --params-file platform/fiab/bicep/params/commercial.bicepparam

      # ── I-BEHIND — DID THIS APPLY LEAVE THE ESTATE BEHIND THE LAST ROLL? ───
      #
      # THE DEFECT THIS EXISTS FOR is the SECOND half of #3676, and the half
      # that mattered: not that the estate went backwards, but that NOTHING SAID
      # SO. deploy-fiab-commercial reported success, loom-roll-and-validate
      # reported success (its own gates all passed and its rollback step is
      # `skipped`, correctly — it did roll, it was overwritten afterwards), and
      # /build-marker.txt honestly reported an estate that had moved backwards.
      # No gate anywhere compared the estate AFTER a deploy with what the last
      # roll had established, so a backwards move produced no signal at all.
      #
      # This step is that comparison, and it is deliberately POST-APPLY: the
      # re-pin above narrows the race but cannot close it (a roll can land while
      # ARM is mid-apply), so the last line of defence has to be detection.
      #
      # THREE WAYS IT FAILS, ALL LOUD:
      #   - the estate is not on the SHA the last effective roll shipped;
      #   - loom-console's running image cannot be read;
      #   - the roll history cannot be read, or the run that shipped cannot be
      #     resolved to a SHA.
      # The last two are UNKNOWN, and UNKNOWN fails the step. "I could not look"
      # spent as "nothing is wrong" is the collapse deploy-integrity R7 forbids
      # and the one this repo keeps re-finding.
      #
      # IT ASKS THE JOBS, NOT THE RUN. A roll run can conclude SUCCESS having
      # rolled NOTHING — run 32006479915 (2026-08-17T07:35Z) is eight seconds
      # long: `Should this roll proceed?` succeeded and `Roll image + validate
      # live URL` was SKIPPED because the console image had not built. Reading
      # the run conclusion would have named that run's SHA as "what the estate
      # should be running" and hidden the very revert this gate is for.
      #
      # IT SCANS BOTH CONSOLE WRITERS. full-app-deploy-commercial.yml also rolls
      # the console (from its own head SHA), so scanning only the roll lane
      # would report a REGRESSION every time that lane is used — a false red is
      # how a gate gets switched off.
      #
      # THIS STEP DOES NOT REPAIR. Restoring the image would make this workflow a
      # THIRD writer of the field two lanes already race over, and attribution is
      # the thing that was missing, not writes. The remediation it prints is the
      # exact roll dispatch that puts the estate back.
      #
      # Decision logic + tests: scripts/ci/reconcile-policy.mjs
      # (selectLastConsoleRoll / decideEstateRegression / parseRollRunTitle) and
      # scripts/ci/__tests__/roll-race.test.mjs.
      - name: Estate must not be BEHIND the last successful roll (#3676)
        id: estate_behind
        if: always() && steps.provision.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SUB: ${{ steps.topology_guard.outputs.deploy_sub }}
          APPLIED_TAG: ${{ steps.repin.outputs.console_tag }}
          MEASURED_AT: ${{ steps.repin.outputs.measured_at }}
        run: |
          set -uo pipefail
          RG="rg-csa-loom-admin-${AZURE_LOCATION}"
          TMP="$RUNNER_TEMP"
          ROLLS="$TMP/console-rolls.json"
          ROLL_ERR="$TMP/console-rolls.err"
          SHOW_ERR="$TMP/console-show.err"
          : > "$ROLL_ERR"
          : > "$SHOW_ERR"
          trim400() { local s; s="$(tr '\n' ' ' < "$1")"; printf '%s' "${s:0:400}"; }

          # A run that wrote no console image cannot have moved the estate, and
          # the verdict below says so on its own. Short-circuiting here keeps a
          # whatif-only dispatch from making ~60 Actions API calls to answer a
          # question its own first clause already answers. The step still RUNS
          # and still prints a verdict — a skipped gate reads as a passed one.
          if [ -z "${APPLIED_TAG:-}" ]; then
            node scripts/ci/reconcile-policy.mjs assert-estate-not-behind-roll \
              --applied-tag "" \
              --read-error "not read: this run applied no loom-console image tag" \
              --rolls-error "not read: this run applied no loom-console image tag"
            exit $?
          fi

          # ---- what is loom-console running RIGHT NOW? ------------------------
          set +e
          IMAGE=$(az containerapp show -n loom-console -g "$RG" ${DEPLOY_SUB:+--subscription "$DEPLOY_SUB"} \
                    --query "properties.template.containers[0].image" -o tsv 2> "$SHOW_ERR")
          SHOW_RC=$?
          set -e
          IMAGE="$(printf '%s' "$IMAGE" | tr -d '\r')"
          IMAGE="${IMAGE%%$'\n'*}"

          # ---- which console-writing run last actually SHIPPED an image? ------
          # `updated_at` on a COMPLETED run is when it finished; GitHub returns
          # RFC3339 Z timestamps, so the jq string comparison against
          # MEASURED_AT is a valid ordering.
          : > "$TMP/rolls.ndjson"
          ROLLS_OK=1
          for WF in loom-roll-and-validate.yml full-app-deploy-commercial.yml; do
            if ! RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/runs?status=completed&per_page=30" \
                          --jq ".workflow_runs[] | {id:.id, workflow:\"${WF}\", title:.display_title, headSha:.head_sha, completedAt:.updated_at}" \
                          2>> "$ROLL_ERR"); then
              ROLLS_OK=0
              break
            fi
            printf '%s\n' "$RUNS" >> "$TMP/rolls.ndjson"
          done

          if [ "$ROLLS_OK" = "1" ]; then
            : > "$TMP/rolls-with-jobs.ndjson"
            CANDIDATES="$(jq -c --arg since "${MEASURED_AT:-}" 'select(.completedAt > $since)' "$TMP/rolls.ndjson")"
            while IFS= read -r LINE; do
              if [ -z "$LINE" ]; then
                continue
              fi
              RID="$(printf '%s' "$LINE" | jq -r '.id')"
              WFN="$(printf '%s' "$LINE" | jq -r '.workflow')"
              case "$WFN" in
                loom-roll-and-validate.yml)     JOBNAME='Roll image + validate live URL' ;;
                full-app-deploy-commercial.yml) JOBNAME='Roll Container Apps to new image' ;;
                *) JOBNAME='__no_such_job__' ;;
              esac
              # An empty answer means NO job of that name — a rename, or a shape
              # this gate does not understand. It becomes null (UNKNOWN), never
              # "did not roll": that collapse is the whole bug class.
              #
              # The job's `completed_at` is captured alongside the conclusion
              # because the RUN's `updated_at` trails the actual
              # `az containerapp update` by minutes — 4m45s on the incident
              # night (update 07:10:44, run completed 07:15:30). Ordering two
              # close writers by the run can name the wrong "latest".
              if ! JOB=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RID}/jobs?per_page=100" \
                            --jq "[.jobs[] | select(.name == \"${JOBNAME}\") | {c:.conclusion, t:.completed_at}] | first // {}" \
                            2>> "$ROLL_ERR"); then
                ROLLS_OK=0
                break
              fi
              printf '%s' "$LINE" \
                | jq -c --argjson j "${JOB:-{\}}" '. + {jobConclusion: ($j.c // null), jobCompletedAt: ($j.t // null)}' \
                >> "$TMP/rolls-with-jobs.ndjson"
            done <<< "$CANDIDATES"
          fi

          if [ "$ROLLS_OK" = "1" ]; then
            jq -s '.' "$TMP/rolls-with-jobs.ndjson" > "$ROLLS"
            ROLL_ARGS=(--rolls "$ROLLS")
          else
            ROLL_ARGS=(--rolls-error "gh could not read the console-rolling workflow runs: $(trim400 "$ROLL_ERR")")
          fi

          if [ $SHOW_RC -ne 0 ] || [ -z "$IMAGE" ]; then
            node scripts/ci/reconcile-policy.mjs assert-estate-not-behind-roll \
              --applied-tag "${APPLIED_TAG}" \
              --read-error "az containerapp show -n loom-console -g ${RG} exited ${SHOW_RC}: $(trim400 "$SHOW_ERR")" \
              "${ROLL_ARGS[@]}"
            exit $?
          fi
          node scripts/ci/reconcile-policy.mjs assert-estate-not-behind-roll \
            --applied-tag "${APPLIED_TAG}" \
            --estate-image "$IMAGE" \
            "${ROLL_ARGS[@]}"

      - name: Export bootstrap coordinates (for the chained bootstrap)
        id: bootstrap_coords
        if: steps.provision.outcome == 'success'
        run: |
          # The active login sub == the admin (hub) sub for the app-bearing
          # tenant/single-sub path the chained bootstrap targets (dlz-attach does
          # not stamp a console, so it never chains). Real sub id (not a secret
          # literal), so it flows safely into the reusable workflow's `with:`.
          ADMIN_SUB=$(az account show --query id -o tsv)
          echo "admin_sub=$ADMIN_SUB" >> "$GITHUB_OUTPUT"
          # dlz_sub is emitted ONLY when a DISTINCT DLZ subscription was named
          # (#3143). It used to default to `$ADMIN_SUB`, which turned "I do not
          # know where the DLZ is" into the ASSERTION "the DLZ is in the admin
          # subscription" — false on every cross-subscription estate, including
          # this one. The callee now DISCOVERS the landing zone and treats a
          # supplied subscription as a NARROWING filter, so an admin-sub default
          # here would filter discovery down to the wrong subscription and make
          # it fail closed on an estate that is perfectly healthy. Empty = let it
          # look everywhere it can read.
          echo "dlz_sub=${CSA_LOOM_TARGET_SUBSCRIPTION:-}" >> "$GITHUB_OUTPUT"
          echo "region=${{ steps.reconcile.outputs.region }}" >> "$GITHUB_OUTPUT"

      # ── Front Door -> ACA env Private Link approval (#3203) ────────────────
      # Was an ARM deploymentScript inside front-door.bicep. It could not run
      # under a policy denying shared-key storage (KeyBasedAuthenticationNotPermitted
      # — one of four ARM leaves that failed run 31435481880 outright), and its
      # `az network private-endpoint-connection list --id` call does not support
      # Microsoft.App/managedEnvironments at all, so under its `2>/dev/null || true`
      # it could only ever time out. The mitigation had been "skip it on Gov and
      # let the operator click Approve in the portal" — a violation of both
      # auto-bind-by-default.md and cloud-parity.md.
      #
      # Front Door answers 504 while the connection is Pending, so this is not
      # optional; it is just no longer allowed to fail the whole apply for a
      # reason unrelated to Front Door.
      - name: Approve the Front Door -> ACA private-endpoint connection
        if: steps.provision.outcome == 'success'
        run: |
          set -euo pipefail
          CAE_ID=$(az containerapp env show -n "cae-csa-loom-${{ steps.reconcile.outputs.region }}" -g "rg-csa-loom-admin-${{ steps.reconcile.outputs.region }}" --query id -o tsv | tr -d '[:space:]')
          if [ -z "$CAE_ID" ]; then
            echo "::error::could not resolve the Container Apps managed environment id in rg-csa-loom-admin-${{ steps.reconcile.outputs.region }} — cannot approve the Front Door private-endpoint connection, and Front Door answers 504 while it is Pending."
            exit 1
          fi
          bash scripts/csa-loom/approve-cae-private-endpoints.sh --cae-id "$CAE_ID" --timeout-seconds 600

      - name: Post-provision validation (from inside cluster)
        id: validate
        if: steps.provision.outcome == 'success'
        # rel-T29 / B13: NO continue-on-error. This in-cluster probe is now the
        # REAL deploy gate — it retries loom-console /api/health from inside the
        # VNet and exits non-zero if the console never serves, failing the deploy.
        # (It replaces the old external-curl smoke that could never reach the
        # VNet-internal ingress and so was pinned continue-on-error = a no-op.)
        run: bash .github/scripts/fiab-post-provision-validate.sh
        env:
          RG_NAME: rg-csa-loom-admin-${{ steps.reconcile.outputs.region }}
          BOUNDARY: ${{ env.CSA_LOOM_BOUNDARY }}

      - name: External smoke test (best-effort)
        id: smoke
        # Best-effort ONLY: this from-scratch estate's console ingress is
        # VNet-internal, so an external runner genuinely cannot reach it. The
        # authoritative gate is the in-cluster validation above; this stays
        # continue-on-error and just records whatever it can see from outside.
        if: always() && steps.provision.outcome == 'success'
        continue-on-error: true
        run: bash .github/scripts/fiab-smoke-test.sh
        env:
          CONSOLE_URL: ${{ steps.provision.outputs.console_url }}

      # THE SCHEDULE MUST NEVER REACH THIS STEP (refs #2775).
      #
      # This condition used to read `github.event_name == 'schedule' || …`, so a
      # SUCCESSFUL scheduled run tore the estate down. `.github/scripts/
      # fiab-teardown.sh` does not delete only RG_NAME: it also enumerates
      # `[?starts_with(name,'rg-csa-loom-')]` across the whole subscription and
      # deletes every match, purging the Key Vaults and Cognitive Services
      # accounts on the way so the names are released. The nightly "reconcile"
      # was a nightly teardown that had simply never got past the topology guard
      # — which is why nobody had seen it. #2881 removed that guard's bug and
      # armed this step for the first time.
      #
      # The two intents are irreconcilable in one workflow: a CI run that stands
      # up a throwaway estate SHOULD tear it down; a reconcile of the live estate
      # must never. So teardown is now operator-initiated only. The scheduled
      # reconcile is idempotent and incremental, and leaves nothing to clean up.
      #
      # `github.event_name != 'schedule'` is stated LITERALLY and redundantly:
      # `inputs.run_mode` is already empty on a schedule, so the remaining clause
      # is false there anyway. The literal is what check-reconcile-safety.mjs (I1)
      # matches, because "it evaluates to false" is precisely the reasoning that
      # let the previous condition ship.
      #
      # THE SECOND DEFENCE (refs #3028). `!inputs.keep_resources` used to be the
      # ONLY thing between a default dispatch and the destruction of the admin
      # RG, and `keep_resources` DEFAULTED TO FALSE — so selecting `full` and
      # changing nothing else deleted the estate. The default is now `true`, and
      # this condition additionally requires the operator to have TYPED the
      # resource group being destroyed into `confirm_teardown_rg`. A
      # double-negative guarding a destructive step is how this hid; a positive
      # match against the resolved RG name cannot be produced by accident.
      #
      # The `Deploy input safety gate` step REFUSES this combination outright
      # long before here, so reaching this step at all means the confirmation
      # was supplied and matched. Both controls are kept: the gate gives the
      # operator the refusal early, and this condition means that even if the
      # gate were removed, teardown still cannot fire unconfirmed.
      - name: Teardown (operator dispatch only — NEVER on the scheduled reconcile)
        id: teardown
        if: |
          always()
          && github.event_name != 'schedule'
          && steps.provision.outcome == 'success'
          && inputs.run_mode == 'full' && !inputs.keep_resources
          && inputs.confirm_teardown_rg == format('rg-csa-loom-admin-{0}', steps.reconcile.outputs.region)
        run: bash .github/scripts/fiab-teardown.sh
        env:
          RG_NAME: rg-csa-loom-admin-${{ steps.reconcile.outputs.region }}

      - name: Note resources kept (manual teardown required)
        if: steps.provision.outcome == 'success' && inputs.run_mode == 'full' && inputs.keep_resources
        run: |
          echo "::notice::Resources KEPT (keep_resources=true — the safe default, and what a real install wants)."
          echo "::notice::To tear the estate down DELIBERATELY later, either re-dispatch with keep_resources=false AND confirm_teardown_rg=rg-csa-loom-admin-${{ steps.reconcile.outputs.region }}, or run:"
          echo "::notice::  RG_NAME=rg-csa-loom-admin-${{ steps.reconcile.outputs.region }} bash .github/scripts/fiab-teardown.sh"
          echo "::warning::Daily spend estimate at F8 capacity SKU: \$200-500."

      - name: Note dry-run completion
        if: success() && inputs.run_mode == 'whatif-only'
        run: |
          echo "✅ whatif-only complete. Bicep + auth validated; no spend."

      - name: Notify on failure (dedicated, OPEN issue - never a closed one)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Was: a comment on `issue_number: 279` - "CSA Loom - v1 build roadmap",
        # state CLOSED, 289 comments - with the body "Check workflow logs". That
        # is the literal mechanism by which 47 days of daily deploy failure
        # stayed invisible (deploy-integrity.md). The notifier now opens/updates
        # ONE dedicated OPEN issue per failing workflow, renders the classified
        # failure from deploy-failure.json, and FAILS if it cannot notify.
        run: |
          node .github/scripts/deploy-notify-failure.mjs \
            --workflow deploy-fiab-commercial \
            --result "${{ job.status }}" \
            --failure-json "$GITHUB_WORKSPACE/deploy-failure.json"

  # rel-T32/T34: auto-chain the post-deploy bootstrap after a REAL, app-bearing,
  # KEPT deploy. Runs the ONE reusable bootstrap (secrets: inherit) with computed
  # coordinates + boundary=Commercial. Guard rationale:
  #   - run_mode == full         → not a whatif-only preview (nothing to bootstrap)
  #   - deploy_apps_enabled      → a Console Container App actually exists to wire.
  #                                Read from the deploy job's OUTPUT (the resolver's
  #                                verdict, i.e. the value composed into
  #                                `--parameters deployAppsEnabled=…`) rather than
  #                                from `inputs.deploy_apps_enabled`. #3332 flipped
  #                                that input's default to true, and a raw-input
  #                                read here would be a second copy of the decision
  #                                that ARM never saw.
  #   - keep_resources           → the deploy did NOT tear down (teardown skips on
  #                                keep_resources), so the console is still live
  # dlz-attach never stamps a console, so it never satisfies deploy_apps_enabled
  # here — those operators run csa-loom-post-deploy-bootstrap.yml manually with
  # explicit admin/dlz subs.
  post-deploy-bootstrap:
    name: Post-deploy bootstrap (Commercial)
    needs: deploy-validate
    if: ${{ inputs.run_mode == 'full' && needs.deploy-validate.outputs.deploy_apps_enabled == 'true' && inputs.keep_resources && needs.deploy-validate.result == 'success' }}
    uses: ./.github/workflows/csa-loom-post-deploy-bootstrap.yml
    secrets: inherit
    with:
      boundary: Commercial
      region: ${{ needs.deploy-validate.outputs.region }}
      admin_subscription: ${{ needs.deploy-validate.outputs.admin_sub }}
      dlz_subscription: ${{ needs.deploy-validate.outputs.dlz_sub }}
