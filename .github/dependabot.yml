version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "python"]
    open-pull-requests-limit: 10
    groups:
      azure-sdk:
        patterns:
          - "azure-*"

  # apps/loom-duckdb/requirements.txt is the repo's ONLY direct pin of duckdb
  # and pyarrow, and the `/` entry above does not monitor it. Without this
  # entry the pyarrow 18 -> 23 major bump (#2504) that motivated #2543 could
  # only ever be raised by a human edit — the Test Suite lane's new
  # `apps/loom-duckdb/**` path filter would then have nothing to trigger on.
  - package-ecosystem: "pip"
    directory: "/apps/loom-duckdb"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "python"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    open-pull-requests-limit: 5
    # github/codeql-action/{init,autobuild,analyze} are three actions from ONE
    # repo that MUST run the same release. Bumping them separately is not a
    # partial upgrade, it is an outage: on 2026-08-09 `init` sat at v4.37.6
    # while autobuild/analyze were still v4.35.3, and every Analyze job died
    # with "Loaded a configuration file for version '4.37.6', but running
    # version '4.35.3'". A failed analysis still uploads a 0-rule/0-result
    # SARIF, and GitHub does not retire alerts from that upload — so the
    # code-scanning list FREEZES at the last real scan and reads as current
    # while every merge since goes unscanned. Grouping keeps them in lockstep;
    # scripts/ci/check-codeql-action-pins.mjs fails closed if they ever drift.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "npm"
    directory: "/portal/react-webapp"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "javascript"]
    open-pull-requests-limit: 10
  # CSA-0048: portal/static-webapp was archived on 2026-04-15; its
  # dependabot entry was removed here so PRs aren't opened against a
  # non-existent directory.

  # apps/loom-directlake is the repo's ONLY Rust crate, and until this entry it
  # carried an OPEN security alert with no version-update lane at all
  # (#3982: thrift < 0.23.0, GHSA-2f9f-gq7v-9h6m, dependabot alert #94).
  #
  # It is NOT the only manifest in that state — measured 2026-09-18, six npm
  # manifest paths (apps/fiab-console, apps/loom-sdk, apps/loom-embed,
  # apps/loom-cli, apps/fiab-label-propagation, azure-functions/secret-expiry-
  # monitor) also carry open alerts and are absent here, since the only npm
  # entry above is /portal/react-webapp. That is tracked separately; it is
  # named here so this comment does not read as "coverage is now complete".
  #
  # Security ALERTS come from the dependency graph and fire without a
  # dependabot.yml entry — which is why #94 was raised at all. Version-update
  # PRs do NOT. So the crate was being watched for "you are vulnerable" and never
  # for "a fix is now available", and that gap is the whole problem here:
  #
  # thrift cannot leave this graph today. Measured with a real resolver
  # (cargo 1.98.0, 2026-09-18): arrow-rs dropped the thrift crate at parquet
  # 59.0.0, but delta-rs has NOT followed — deltalake-core 0.32.4, the newest
  # published, still pins `arrow ^58` / `parquet ^58` / `datafusion ^53.1.0`,
  # and parquet 58 still depends on `thrift ^0.17`. The fix therefore arrives
  # upstream, on delta-rs's schedule, in a release nobody here is watching for.
  # This entry is that watch.
  - package-ecosystem: "cargo"
    directory: "/apps/loom-directlake"
    schedule:
      interval: "weekly"
    # `dependencies` only: there is no `rust` label in this repo (measured
    # 2026-09-18 — `gh label list` returns `dependencies`, `javascript`,
    # `security`, `sp:*`, `lane:*` and no `rust`), and naming one that does not
    # exist is not a no-op worth shrugging at.
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    # The arrow stack is grouped so it arrives as ONE reviewable PR rather than
    # four that each look reasonable alone.
    #
    # Be precise about what this buys, because the obvious reading is wrong:
    # grouping does NOT make the upgrade atomic and does NOT prevent a broken
    # stack from being proposed. A grouped bump to parquet 59 + datafusion 55 +
    # deltalake 0.32 resolves, and resolves BADLY — measured with cargo 1.98.0:
    #
    #   arrow 58.4.0 AND 59.3.0 · datafusion 53.1.0 AND 55.1.0
    #   parquet 58.4.0 AND 59.3.0 · thrift 0.17.0 still present via parquet 58
    #
    # Two datafusion majors in one graph means two distinct `TableProvider`
    # traits, so `ctx.register_table(Arc::new(delta_table))` in src/scan.rs stops
    # compiling. What actually STOPS that landing is `cargo build --locked` in
    # .github/workflows/loom-directlake-ci.yml, which compiles both feature sets
    # plus the release profile on every PR touching this crate. That lane is the
    # backstop; this group only ensures the four crates are judged together
    # instead of one at a time.
    groups:
      arrow-stack:
        patterns:
          - "arrow*"
          - "parquet*"
          - "datafusion*"
          - "deltalake*"
