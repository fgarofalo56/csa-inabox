# CSA Loom Health Data Services - stamp FHIR edge router (G1, #5410). Rendered by edge-router.bicep, which replaces every
# double-underscore token below; this file is the template, the bicep output `manifest` carries the rendered copy (single source of truth).
#
# Path: App Gateway (WAF, TLS) -> internal LB (network.bicep ingressIlbIp) -> THIS router -> fhir-<tenant>.<engine ns>.svc.
#
# NO AUTHORIZATION HAPPENS HERE. The router only maps a path to a Service. The tenant boundary is the engine's PDP interceptor,
# which checks the bearer token (passed through unchanged) against the tenant the engine serves. A request routed to the
# wrong engine is therefore refused by that engine, never served.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  # The default log format does not include request headers, so the bearer token is never logged.
  access_log /dev/stdout combined;

  # Read-only root filesystem: every writable path is the /tmp emptyDir.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Cluster DNS (the AKS cluster's dnsServiceIP, read from the cluster by the bicep). Every proxy_pass below holds a variable,
  # so names resolve per request: an unknown tenant is an NXDOMAIN at request time, never a failed start.
  resolver __RESOLVER__ valid=10s ipv6=off;
  resolver_timeout 5s;

  # Consistent with the App Gateway: the body cap is the WAF file-upload limit (the largest body the gateway lets through), the
  # timeouts are its backend request timeout. Bodies are streamed, not spooled to the emptyDir.
  client_max_body_size __MAX_BODY_MB__m;
  client_body_timeout __TIMEOUT_S__s;
  proxy_request_buffering off;
  proxy_http_version 1.1;
  proxy_connect_timeout 5s;
  proxy_send_timeout __TIMEOUT_S__s;
  proxy_read_timeout __TIMEOUT_S__s;

  # The App Gateway sends Host = its backend host name and carries the client's host in X-Original-Host.
  map $http_x_original_host $loom_fwd_host {
    ""      $host;
    default $http_x_original_host;
  }

  server {
    listen __PORT__;
    server_name _;
    absolute_redirect off;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # SMART discovery is served by the authorization server, not the engine: /{tenant}/fhir/.well-known/smart-configuration is
    # proxied to {issuer}/{tenant}/.well-known/smart-configuration (the same document, server.ts smartConfiguration). It must
    # precede the engine location: nginx takes the FIRST matching regex location. The tenant shape is the control plane's SLUG.
    location ~ "^/(?<tenant>[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9]))/fhir/\.well-known/smart-configuration$" {
      set $loom_discovery __DISCOVERY_ENABLED__;
      if ($loom_discovery = 0) {
        return 404 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"not-found","diagnostics":"SMART discovery is not proxied by this stamp edge: the issuer is the stamp ingress itself. Read it at the issuer."}]}';
      }
      # Discovery is unauthenticated: no token or cookie is forwarded to the issuer host.
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_set_header Host __ISSUER_HOST__;
      proxy_ssl_server_name on;
      proxy_ssl_name __ISSUER_HOST__;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 4;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      proxy_pass https://__ISSUER_HOST____ISSUER_PATH__/$tenant/.well-known/smart-configuration;
      error_page 502 504 = @issuer_unreachable;
    }

    # /{tenant}/fhir[/...] -> http://fhir-{tenant}.<ns>.svc.cluster.local:80/fhir[/...]?<query>. The workload name is
    # fhirNames(slug).workloadName = 'fhir-' + slug (apps/loom-health-cp/src/jobs/fhir-tenant-config.ts). Authorization is
    # forwarded unchanged (nginx passes request headers through by default; nothing here rewrites it).
    location ~ "^/(?<tenant>[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9]))/fhir(?<rest>/.*)?$" {
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $loom_fwd_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Prefix /$tenant;
      proxy_pass http://__ENGINE_PREFIX__$tenant.__ENGINE_NS__.svc.cluster.local:__ENGINE_SERVICE_PORT__/fhir$rest$is_args$args;
      # Only errors nginx itself generates are mapped (no proxy_intercept_errors): an engine's own 4xx/5xx OperationOutcome
      # reaches the client unchanged. 502 here = the name did not resolve (no such tenant Service) or the connect failed.
      error_page 502 = @no_engine;
      error_page 504 = @engine_timeout;
    }

    location @no_engine {
      default_type application/fhir+json;
      return 404 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"not-found","diagnostics":"No FHIR service is reachable for this tenant on this stamp."}]}';
    }

    location @engine_timeout {
      default_type application/fhir+json;
      return 504 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"timeout","diagnostics":"The tenant FHIR service did not answer in time."}]}';
    }

    location @issuer_unreachable {
      default_type application/fhir+json;
      return 502 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"transient","diagnostics":"The authorization server could not be reached for SMART discovery."}]}';
    }

    # Anything that is not /{tenant}/fhir answers 404 (also the App Gateway probe on "/", which accepts 200-499).
    location / {
      default_type application/fhir+json;
      return 404 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"not-found","diagnostics":"Not a FHIR path. Use /{tenant}/fhir/."}]}';
    }
  }
}
