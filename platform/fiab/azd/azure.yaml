# CSA Loom — azd project definition
#
# Status: SCAFFOLDED — real services land via PRP-02 (Bicep) + PRP-03
# (Console) + PRP-04 (Setup Orchestrator) + PRP-05 (MCP server) +
# PRP-06/07/08 (parity services).

name: csa-loom
metadata:
  template: csa-loom@v1.0
  description: CSA Loom — Microsoft Fabric parity layer for Azure tenants

infra:
  provider: bicep
  path: ../bicep
  module: main

# SERVICE PATHS ARE RELATIVE TO THIS FILE, WHICH LIVES AT platform/fiab/azd/.
#
# Every entry read `../../apps/<name>`, which resolves to platform/apps/<name> —
# a directory that has never existed. `azd provision` validates the project file
# before it does anything, so it died on the FIRST service every time:
#
#     ERROR: initializing service 'activator-engine',
#     stat …/csa-inabox/platform/apps/fiab-activator-engine: no such file or directory
#
# platform/fiab/azd -> .. = platform/fiab -> ../.. = platform -> ../../.. = repo
# root. All seven needed one more level. Checked with os.path.normpath against the
# real tree, not by eye.
# LANGUAGE IS `docker` FOR ALL SEVEN, because all seven ARE Dockerfile builds.
#
# They declared csharp / java / ts. azd takes that literally and looks for the
# language's project file BEFORE it looks at `docker.path`, so `azd provision`
# died at:
#
#     ERROR: initializing service 'activator-engine', could not locate a dotnet
#     project file for service activator-engine in …/apps/fiab-activator-engine
#
# measured on deploy-fiab-gcch run 31490493159. Checked against the tree, the
# declarations were wrong for five of seven — activator-engine (csharp, no
# .csproj), setup-orchestrator (csharp, actually PYTHON), mirroring-engine (java,
# no pom), direct-lake-shim (csharp, no .csproj), mcp-server (ts, no
# package.json). Only console and mcp-bridge matched what they claimed.
#
# `docker` is the documented value for exactly this — Learn, "Use Docker support
# to deploy containerized apps in any language": set `language: docker` and give
# `docker.path`, and azd builds the Dockerfile without introspecting the project.
# It is in the schema's allowed list alongside dotnet/py/js/java/go.
#
# scripts/ci/check-azd-service-paths.mjs now also asserts that a declared
# compiled language HAS the project file it implies, so this cannot come back.
services:
  console:
    project: ../../../apps/fiab-console
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile

  setup-orchestrator:
    project: ../../../apps/fiab-setup-orchestrator
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile

  mcp-server:
    project: ../../../apps/fiab-mcp-config
    language: docker
    host: containerapp
    docker:
      # ./Dockerfile, not ./Dockerfile.wrapper — the latter has never existed in
      # apps/fiab-mcp-config. The authoritative answer is the build lane:
      # build-fiab-images-acr-tasks.yml maps loom-mcp -> ./apps/fiab-mcp-config
      # with no `file:` override, i.e. the default Dockerfile.
      path: ./Dockerfile

  mcp-bridge:
    project: ../../../apps/fiab-mcp-bridge
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile

  activator-engine:
    project: ../../../apps/fiab-activator-engine
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile

  mirroring-engine:
    project: ../../../apps/fiab-mirroring-engine
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile

  direct-lake-shim:
    project: ../../../apps/fiab-direct-lake-shim
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile

# Per-environment variables defined via:
# azd env set CSA_LOOM_BOUNDARY <Commercial|GCC|GCC-High|IL5>
# azd env set CSA_LOOM_DEPLOYMENT_MODE <single-sub|multi-sub>
# azd env set CSA_LOOM_CAPACITY_SKU <F2|F4|F8|F32|F64|F128|F512>
# azd env set CSA_LOOM_ADMIN_GROUP_ID <Entra group object ID>
# azd env set CSA_LOOM_HUB_VNET_CIDR <CIDR>
# azd env set CSA_LOOM_DLZ_SUB_IDS <comma-separated sub IDs for multi-sub>
# azd env set CSA_LOOM_DLZ_NAMES <comma-separated domain names>
