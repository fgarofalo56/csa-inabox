# pnpm settings for apps/fiab-console.
#
# This file exists ONLY to carry `overrides`. pnpm 11 stopped reading
# `pnpm.overrides` from package.json — it warns
#   "The 'pnpm' field in package.json is no longer read by pnpm.
#    The following keys were ignored: 'pnpm.overrides'"
# and pnpm-workspace.yaml is the documented new home for those settings.
#
# `packages: ['.']` — the SINGLE member is this project itself. I first wrote
# this file with no `packages:` field at all, reasoning that fiab-console is not
# a workspace root and globs would change install semantics. pnpm rejects that
# outright: creating the file makes the directory a workspace root, and the
# field is mandatory. CI caught it in 17 seconds —
#     ERROR  packages field missing or empty
# on both `pnpm install` steps. Declaring exactly one member ('.') keeps the
# resolution graph identical to the pre-workspace layout while giving pnpm the
# field it requires. Do NOT widen this to 'apps/*' or similar: that would pull
# sibling apps into one resolution graph, which is a real behaviour change.
packages:
  - '.'
#
# WHY OVERRIDES AND NOT DEPENDENCY BUMPS. Every package below is a TRANSITIVE
# dependency — none appears in package.json. Dependabot reports each as a
# runtime-scope advisory, so they DO ship in the console image, but there is no
# direct-dependency version to raise; the fix is to floor the resolved version
# for every consumer at once.
#
# Each entry is the `first_patched_version` from the corresponding advisory, and
# each is a `>=` floor rather than a pin so ordinary upgrades are not blocked.
# Remove an entry once the parent package's own release pulls in a patched
# version by itself — the floor is a stopgap, not a permanent pin.
overrides:
  # 8 advisories against 8.0.0-8.5.0 (highest patched: 8.6.0), plus one against
  # the 7.x line patched in 7.6.5. The 8.x floor covers both, since nothing here
  # resolves protobufjs 7.
  protobufjs: '>=8.6.0'
  # CVE-2026-67213 (HIGH): a custom generator can loop indefinitely when size is
  # zero. Transitive only — nothing here depends on nanoid directly; it arrives
  # under the 3.x line and the lockfile resolved 3.3.16. Patched in 3.3.17.
  #
  # CARET, NOT `>=`, and deliberately against this block's usual convention. A
  # `>=3.3.17` floor resolved to nanoid **6.0.1** — nanoid 4+ is ESM-only, so a
  # bare floor turns a CVE patch into a major-version migration for a package
  # nothing here depends on directly. `^3.3.17` clears the vulnerable range
  # (<3.3.17) and stays on the 3.x line.
  nanoid: '^3.3.17'
  # <8.5.10 and <=8.5.11 advisories in this lockfile; portal/react-webapp has a
  # separate <=8.5.17 advisory handled in its own manifest.
  #
  # RAISED 8.5.12 -> 8.5.23 for GHSA-fxqj-rqcc-2cmp / CVE-2026-69153 (published
  # 2026-08-03), which is the INCOMPLETE-FIX follow-up to GHSA-6g55-p6wh-862q:
  # the earlier patch nested its traversal/absolute-path rejection inside
  # `if (cssFile)`, so `postcss([]).process(css)` with `from` unset skipped it
  # and an attacker `sourceMappingURL` could still read an arbitrary `.map`.
  # Range is `<= 8.5.22` — i.e. EVERY release up to and including the one this
  # lockfile resolved — and first_patched_version is 8.5.23.
  #
  # This is RUNTIME scope here, not build-time: `next` is a production
  # dependency and declares `postcss: 8.4.31` as a direct dependency of its
  # own, so postcss is in the production resolution graph. (A pnpm override
  # REPLACES the parent's range outright rather than intersecting with it,
  # which is why an exact `8.4.31` pin upstream still resolves to our floor.)
  postcss: '>=8.5.23'
  uuid: '>=11.1.1'
  '@opentelemetry/core': '>=2.8.0'
  '@opentelemetry/propagator-jaeger': '>=2.9.0'
  # Advisory <0.35.0. Transitive here (Next.js image optimisation pulls it);
  # the same floor was applied to portal/react-webapp in #2730, which is a
  # separate npm manifest with its own overrides block.
  sharp: '>=0.35.0'
  #
  # ── Batch 1 — dev-toolchain transitives (refs #2671) ──────────────────────
  #
  # WHY A MAJOR CEILING AND NOT A BARE `>=` FLOOR. Every floor above is
  # open-ended, and that is load-bearing here: a pnpm override REPLACES the
  # parent's declared range outright, it does not intersect with it. Proof from
  # this very lockfile — `uuid: '>=11.1.1'` resolved to **14.0.1**, three
  # majors past what any parent asked for. Harmless for uuid; NOT harmless for
  # these five, whose parents would break on a major bump. So each entry below
  # is floor + `<nextMajor>`: still an upgrade-permitting floor inside the
  # major, never a silent major float.
  #
  # js-yaml <4.2.0 and <4.3.0 advisories. Sole consumer is @eslint/eslintrc@3.3.5
  # (`js-yaml: ^4.1.1`), so 4.3.1 is a drop-in. Without `<5` this would resolve
  # js-yaml 5.x into a parent that never declared support for it.
  js-yaml: '>=4.3.1 <5'
  # form-data <4.0.6 advisory. Sole consumer is jsdom@25.0.1 (`form-data: ^4.0.0`).
  form-data: '>=4.0.6 <5'
  #
  # brace-expansion — THREE separate, per-major entries. Do NOT collapse these
  # into one blanket `brace-expansion: '>=5.0.7'`; that combination is broken,
  # and it is broken in a way no version number hints at. The module's PUBLIC
  # SHAPE changed across the majors (verified by unpacking each published
  # tarball, not by reading a changelog):
  #
  #   1.1.16 / 1.1.18  →  `module.exports = expandTop`      (callable)
  #   2.1.2  / 2.1.4   →  `module.exports = expandTop`      (callable)
  #   4.x              →  ESM-only                          (no CJS entry)
  #   5.0.7  / 5.0.9   →  `exports.expand = expand`         (NOT callable)
  #
  # minimatch@3.1.5 does `var expand = require('brace-expansion')` and then
  # `expand(pattern)`. Hand it a 5.x and every eslint run dies with
  # "expand is not a function"; hand it a 4.x and the CJS require fails
  # outright. The per-major split is therefore mandatory, not stylistic.
  #
  # The `pkg@range` key form scopes an override to consumers whose declared
  # range falls inside that range, which is exactly the three minimatch lines:
  #   minimatch@3.1.5  → 'brace-expansion': ^1.1.7  → floored to 1.x
  #   minimatch@9.0.9  → 'brace-expansion': ^2.0.2  → floored to 2.x
  #   minimatch@10.2.5 → 'brace-expansion': ^5.0.5  → floored to 5.x
  'brace-expansion@1': '>=1.1.16 <2'
  'brace-expansion@2': '>=2.1.2 <3'
  'brace-expansion@5': '>=5.0.7 <6'
  # THE ONE DELIBERATE EXCEPTION TO THE `>=` CONVENTION ABOVE — read before
  # "fixing" this to match its neighbours.
  #
  # Four advisories land on the vite/esbuild pair resolved here (dev-scope: vite
  # arrives only via vitest and @vitejs/plugin-react; `next build` is webpack,
  # and neither package appears under .next/standalone):
  #   vite  <6.4.3  server.fs.deny bypass on Windows alternate paths   (high)
  #   vite  <6.4.3  launch-editor NTLMv2 hash disclosure via UNC paths (medium)
  #   vite  <6.4.2  path traversal in optimized-deps `.map` handling   (medium)
  #   esbuild <0.25.0  dev server answers any origin's requests        (medium)
  #
  # There is NO patched release in the 5.x line — GitHub's advisory matrix gives
  # patched floors only at 6.4.3 / 7.3.5 / 8.0.16 — so the resolved 5.4.21
  # cannot be fixed in place. An override is the only route.
  #
  # WHY A CARET AND NOT `>=7.3.6`. pnpm resolves an override to the HIGHEST
  # matching version. `>=` resolves to vite 8.x today, and vitest@3.2.7
  # declares vite as a DEPENDENCY with range '^5.0.0 || ^6.0.0 || ^7.0.0-0' —
  # 8.x is outside it, so the "floor" would break the test runner rather than
  # patch it. (vite 8 also swaps esbuild for rolldown + lightningcss native
  # binaries — a brand-new supply-chain scan surface.) The bound is
  # load-bearing; do not relax it to `>=`.
  #
  # WHY 7.x AND NOT 6.x (raised 2026-08-06, D9 / #3036 / #3005 / #3024).
  # CVE-2025-68121 (CRITICAL, Go stdlib crypto/tls) rides in the prebuilt
  # `@esbuild/linux-x64` binary: every 0.25.x esbuild is compiled with go1.23.x,
  # below every fixed floor (1.24.13 / 1.25.7 / 1.26.0-rc.3). The loom-uat
  # image installs the full dev tree, so that gobinary lands in its layer and
  # fails the SC1 Trivy CRITICAL gate (full-app-deploy-commercial run
  # 31066164706). vite@6.4.3 caps esbuild at ^0.25.0, so no 6.x resolution can
  # ever clear it; vite@7.3.6 declares esbuild '^0.27.0 || ^0.28.0', which
  # resolves 0.28.1 — compiled with go1.26.4, above the fix (verified by
  # reading the Go toolchain string out of the published binary, the method
  # validated in #3036 against Trivy's own report). This is the ROOT fix — the
  # previous "zero extra CVE coverage" argument for staying on 6.x inverted.
  #
  # NO vitest BUMP NEEDED. vitest@3.2.7 / vite-node@3.2.4 declare
  # '^5.0.0 || ^6.0.0 || ^7.0.0-0' (7.3.6 satisfies '^7.0.0-0') and
  # @vitejs/plugin-react@4.7.0 peers '... || ^7.0.0' — all read from the npm
  # registry 2026-08-06, not assumed. The vitest 3 runner (with its documented
  # RPC fragility and roll-gate status) is deliberately NOT touched here.
  #
  # ENGINES. vite@7.3.6 wants node '^20.19.0 || >=22.12.0'. CI's
  # `node-version: '20'` resolves the latest 20.x (>= 20.19) via setup-node,
  # and vite never EXECUTES inside the loom-uat image anyway (entrypoint is
  # node -> `pnpm exec playwright test`; Playwright transpiles with its own
  # babel pipeline) — the binary is install-time cargo there, now non-vulnerable
  # install-time cargo.
  #
  # NO esbuild ENTRY ON PURPOSE. vite@7.3.6 declares esbuild
  # '^0.27.0 || ^0.28.0', which resolves 0.28.x and closes both the dev-server
  # advisory and CVE-2025-68121 by itself. An explicit 'esbuild: >=0.28.1'
  # override would pin a resolution vite already makes — and would silently
  # widen into a break the day vite's declared range and the override disagree.
  vite: '^7.3.6'
