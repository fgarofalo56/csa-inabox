# pnpm settings for apps/fiab-console.
#
# This file exists ONLY to carry `overrides`. pnpm 11 stopped reading
# `pnpm.overrides` from package.json — it warns
#   "The 'pnpm' field in package.json is no longer read by pnpm.
#    The following keys were ignored: 'pnpm.overrides'"
# and pnpm-workspace.yaml is the documented new home for those settings.
#
# `packages: ['.']` — the SINGLE member is this project itself. I first wrote
# this file with no `packages:` field at all, reasoning that fiab-console is not
# a workspace root and globs would change install semantics. pnpm rejects that
# outright: creating the file makes the directory a workspace root, and the
# field is mandatory. CI caught it in 17 seconds —
#     ERROR  packages field missing or empty
# on both `pnpm install` steps. Declaring exactly one member ('.') keeps the
# resolution graph identical to the pre-workspace layout while giving pnpm the
# field it requires. Do NOT widen this to 'apps/*' or similar: that would pull
# sibling apps into one resolution graph, which is a real behaviour change.
packages:
  - '.'
#
# WHY OVERRIDES AND NOT DEPENDENCY BUMPS. Every package below is a TRANSITIVE
# dependency — none appears in package.json. Dependabot reports each as a
# runtime-scope advisory, so they DO ship in the console image, but there is no
# direct-dependency version to raise; the fix is to floor the resolved version
# for every consumer at once.
#
# Each entry is the `first_patched_version` from the corresponding advisory, and
# each is a `>=` floor rather than a pin so ordinary upgrades are not blocked.
# Remove an entry once the parent package's own release pulls in a patched
# version by itself — the floor is a stopgap, not a permanent pin.
overrides:
  # 8 advisories against 8.0.0-8.5.0 (highest patched: 8.6.0), plus one against
  # the 7.x line patched in 7.6.5. The 8.x floor covers both, since nothing here
  # resolves protobufjs 7.
  protobufjs: '>=8.6.0'
  # <8.5.10 and <=8.5.11 advisories in this lockfile; portal/react-webapp has a
  # separate <=8.5.17 advisory handled in its own manifest.
  postcss: '>=8.5.12'
  uuid: '>=11.1.1'
  '@opentelemetry/core': '>=2.8.0'
  '@opentelemetry/propagator-jaeger': '>=2.9.0'
  # Advisory <0.35.0. Transitive here (Next.js image optimisation pulls it);
  # the same floor was applied to portal/react-webapp in #2730, which is a
  # separate npm manifest with its own overrides block.
  sharp: '>=0.35.0'
  #
  # ── Batch 1 — dev-toolchain transitives (refs #2671) ──────────────────────
  #
  # WHY A MAJOR CEILING AND NOT A BARE `>=` FLOOR. Every floor above is
  # open-ended, and that is load-bearing here: a pnpm override REPLACES the
  # parent's declared range outright, it does not intersect with it. Proof from
  # this very lockfile — `uuid: '>=11.1.1'` resolved to **14.0.1**, three
  # majors past what any parent asked for. Harmless for uuid; NOT harmless for
  # these five, whose parents would break on a major bump. So each entry below
  # is floor + `<nextMajor>`: still an upgrade-permitting floor inside the
  # major, never a silent major float.
  #
  # js-yaml <4.2.0 and <4.3.0 advisories. Sole consumer is @eslint/eslintrc@3.3.5
  # (`js-yaml: ^4.1.1`), so 4.3.1 is a drop-in. Without `<5` this would resolve
  # js-yaml 5.x into a parent that never declared support for it.
  js-yaml: '>=4.3.1 <5'
  # form-data <4.0.6 advisory. Sole consumer is jsdom@25.0.1 (`form-data: ^4.0.0`).
  form-data: '>=4.0.6 <5'
  #
  # brace-expansion — THREE separate, per-major entries. Do NOT collapse these
  # into one blanket `brace-expansion: '>=5.0.7'`; that combination is broken,
  # and it is broken in a way no version number hints at. The module's PUBLIC
  # SHAPE changed across the majors (verified by unpacking each published
  # tarball, not by reading a changelog):
  #
  #   1.1.16 / 1.1.18  →  `module.exports = expandTop`      (callable)
  #   2.1.2  / 2.1.4   →  `module.exports = expandTop`      (callable)
  #   4.x              →  ESM-only                          (no CJS entry)
  #   5.0.7  / 5.0.9   →  `exports.expand = expand`         (NOT callable)
  #
  # minimatch@3.1.5 does `var expand = require('brace-expansion')` and then
  # `expand(pattern)`. Hand it a 5.x and every eslint run dies with
  # "expand is not a function"; hand it a 4.x and the CJS require fails
  # outright. The per-major split is therefore mandatory, not stylistic.
  #
  # The `pkg@range` key form scopes an override to consumers whose declared
  # range falls inside that range, which is exactly the three minimatch lines:
  #   minimatch@3.1.5  → 'brace-expansion': ^1.1.7  → floored to 1.x
  #   minimatch@9.0.9  → 'brace-expansion': ^2.0.2  → floored to 2.x
  #   minimatch@10.2.5 → 'brace-expansion': ^5.0.5  → floored to 5.x
  'brace-expansion@1': '>=1.1.16 <2'
  'brace-expansion@2': '>=2.1.2 <3'
  'brace-expansion@5': '>=5.0.7 <6'
