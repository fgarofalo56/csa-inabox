[package]
name = "loom-directlake"
version = "0.1.0"
edition = "2021"
description = "CSA Loom Direct Lake — Azure-native columnar cache/scan service (HYP-5). Arrow + delta-rs framing + DataFusion scan; outcome-equivalent of Fabric Direct Lake with NO Fabric/Power BI dependency."
license = "MIT"
publish = false

# The binary the ACA image runs (internal ingress, port 8080).
[[bin]]
name = "loom-directlake"
path = "src/main.rs"

[features]
# `engine` (default): the fixture + local-parquet + DataFusion scan core path —
#   fully executable in CI with NO Azure. `cargo test --no-default-features
#   --features engine` runs the unit tests against the bundled fixture.
# `azure`  (default): adds delta-rs (deltalake) so the abfss:// Delta path reads
#   the Delta transaction log off ADLS Gen2 via Managed Identity. Runtime-gated
#   on LOOM_DIRECTLAKE_STORAGE_ACCOUNT; the fixture/parquet core needs none of it.
default = ["engine", "azure"]
engine = []
azure = ["dep:deltalake"]

[dependencies]
# HTTP server (internal ingress; mirrors the script-runner ACA contract shape).
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Columnar engine. These three move as ONE unit — deltalake re-uses this arrow
# and this datafusion, so the whole graph must resolve to ONE arrow + ONE
# datafusion (no split). .github/dependabot.yml groups arrow*/parquet*/
# datafusion*/deltalake* for the same reason.
#
# WHY THESE EXACT MAJORS (#3982, measured with cargo 1.98.1 on 2026-09-23).
# `thrift 0.17.0` used to enter this graph through `parquet` and carried an open
# advisory (GHSA-2f9f-gq7v-9h6m, < 0.23.0). The pins below are the FIRST
# combination that removes it, and each one is load-bearing:
#   * arrow-rs dropped the thrift crate at parquet 59.0.0. parquet 53/57/58 all
#     still declare `thrift ^0.17`; 59.x and 60.x declare no thrift at all. So
#     parquet must be >= 59.
#   * deltalake-core 1.0.0 (published 2026-09-21) is the first delta-rs release
#     on that arrow: it declares `arrow ^59`, `parquet ^59`, `datafusion ^55`.
#     0.32.4 — the newest before it — was still on `arrow ^58`/`parquet ^58`/
#     `datafusion ^53.1.0`, i.e. still thrift-bearing. So deltalake must be 1.0.
#   * datafusion 55 is what deltalake-core 1.0 admits AND what resolves onto
#     arrow 59. Mixing majors here is not merely untidy: it links TWO arrow
#     crates and `arrow::datatypes::Schema` stops being the same type as
#     `datafusion::arrow::datatypes::Schema`. That is exactly how the grouped
#     dependabot PR #4630 (arrow 54 + datafusion 51 -> parquet 57) failed, with
#     5x E0308 in this file.
#
# DO NOT bump one of these without the others, and do not accept a dependabot
# group bump that lands a split graph — check `cargo tree -d` for a duplicated
# arrow before believing it. Raising parquet to 60 requires a deltalake release
# that admits arrow 60; there is none as of 2026-09-23.
#
# A PATCHED thrift was considered and rejected while this was blocked, and is
# recorded so it is not rediscovered: thrift 0.23/0.24 are published but
# unreachable on semver, because `parquet` declared `thrift ^0.17` (for a 0.x
# crate that means `>=0.17.0, <0.18.0`) and a `[patch.crates-io]` replacement
# must still SATISFY the original requirement. It would have needed a forked,
# backported 0.17.x. Moot now that parquet 59 has no thrift at all.
arrow = "60"
parquet = "60"
datafusion = "55"

# delta-rs — reads the Delta log off ADLS the same way Direct Lake reads it off
# OneLake. `datafusion` feature makes DeltaTable a TableProvider; `azure` pulls
# object_store's Azure backend (Managed Identity via IMDS in-cluster). Optional
# so the `engine`-only build (CI core-path test) stays lean.
[dependencies.deltalake]
version = "1.0"
features = ["datafusion", "azure"]
optional = true

[profile.release]
# Small, fast image — the warm-cache service is memory-sensitive, so keep the
# binary lean and let LTO shrink it. Matches the "tiny image" goal in the PRP.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
