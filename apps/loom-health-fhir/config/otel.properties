# OpenTelemetry Java agent settings for the LHDS FHIR engine (LHDS W2-5).
# Loaded with -Dotel.javaagent.configuration-file=<this file>; environment variables
# (OTEL_*) take precedence, which is how the exporter is chosen per environment.
#
# POLICY: telemetry carries ids, routes, status codes and timings - never bodies,
# never headers (an Authorization header or a header carrying a patient name is PHI
# or a credential). The agent does not capture HTTP bodies; the capture-header lists
# below are set EMPTY explicitly so a future default change cannot start capturing.
# The agent still records the raw query string (url.query) on server spans; that is
# not configurable away, and it is the reason apps/loom-health-scrubber exists.
otel.service.name=loom-health-fhir
otel.instrumentation.http.server.capture-request-headers=
otel.instrumentation.http.server.capture-response-headers=
otel.instrumentation.http.client.capture-request-headers=
otel.instrumentation.http.client.capture-response-headers=
otel.instrumentation.common.db-statement-sanitizer.enabled=true
# Application log lines are NOT forwarded as OTel log records (they would bypass the
# scrubber's stdout path); stdout is the only log sink.
otel.logs.exporter=none
otel.instrumentation.logback-appender.enabled=false
otel.instrumentation.log4j-appender.enabled=false
