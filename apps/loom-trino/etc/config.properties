# CSA Loom — single-node Trino coordinator.
#
# `node-scheduler.include-coordinator=true` makes the coordinator also act as a
# worker, which is the supported single-process deployment shape. That is what
# lets the engine run as ONE scale-to-zero Container App replica instead of an
# always-on AKS node pool (see the module header of
# platform/fiab/bicep/modules/data-plane/loom-trino-aca.bicep).
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Container Apps terminates TLS at the ingress and the app is INTERNAL-ONLY, so
# the process itself speaks plain HTTP inside the environment. The only door is
# the Console BFF at /api/sql/trino, which authenticates the caller first.
http-server.process-forwarded=true

# Bound a single replica's planning/exec footprint so one runaway federated join
# cannot OOM the container (the BFF also caps rows). These are deliberately
# conservative for the 2 vCPU / 4Gi default; the AKS scale-out path overrides
# them in its Helm values.
query.max-memory=1GB
query.max-memory-per-node=1GB
memory.heap-headroom-per-node=0.5GB
